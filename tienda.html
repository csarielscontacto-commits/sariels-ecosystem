      cursor: grab; touch-action: none; user-select: none;
    }
    #marquinhos-widget:active { cursor: grabbing; }
    .pieza-voltron {
      position: fixed; width: 40px; height: 40px;
      background: var(--gold); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      z-index: 10000; font-size: 24px;

    }
    @keyframes wave { 0%,100%{transform:rotate(0)} 50%{transform:rotate(20deg)} }

    .ropa-equipada {

      pointer-events: none; z-index: 10;
    }
    .ropa-item {

      pointer-events: none;
      z-index: 11;

      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.2));
      animation: vestirAnim 0.6s ease-out;
      will-change: transform;
    }
    @keyframes vestirAnim {
      0% { transform: scale(0) rotate(-20deg); opacity: 0; }
      60% { transform: scale(1.2) rotate(5deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); }
    }

    // ================================================================

    // ================================================================

    function vestirMarquinhosReal(itemId) {
      const widget = obtenerWidget();
      const item = INVENTARIO_ROPA[itemId];
      if (!item) return;

      // Crear contenedor de ropa
      let capaRopa = widget.querySelector('.ropa-equipada');

        capaRopa = document.createElement('div');
        capaRopa.className = 'ropa-equipada';
        widget.style.position = 'relative';
        widget.appendChild(capaRopa);
      }

      // Limpiar items de la misma categoría
      const itemsPrevios = capaRopa.querySelectorAll(`.ropa-item-${item.category}`);
      itemsPrevios.forEach(el => {
        el.style.transition = 'all 0.3s ease';
        el.style.opacity = '0';
        el.style.transform = 'scale(0) rotate(20deg)';
        setTimeout(() => el.remove(), 300);
      });

      // Si es extra, verificar si ya existe
      if (item.category === 'extras') {
        const existente = capaRopa.querySelector(`.ropa-item[data-item-id="${itemId}"]`);
        if (existente) return;

      // Crear elemento de ropa

      ropaEl.className = `ropa-item ropa-item-${item.category}`;
      ropaEl.dataset.itemId = itemId;
      ropaEl.style.cssText = `
        position: absolute;
        top: ${item.top || '0px'};
        left: ${item.left || '0px'};
        font-size: ${item.size || '24px'};
        pointer-events: none;
        z-index: 11;

        filter: drop-shadow(0 2px 8px rgba(0,0,0,0.2));
        animation: vestirAnim 0.6s ease-out;
        will-change: transform;
      `;
      ropaEl.textContent = item.emoji || item.icono;

      // Guardar referencia para física
      ropaEl._posX = 0;
      ropaEl._posY = 0;

      capaRopa.appendChild(ropaEl);
      ropaItems.push(ropaEl);

      // Actualizar outfitActual
      if (item.category === 'extras') {
        if (!outfitActual.extras.includes(itemId)) {
          outfitActual.extras.push(itemId);
        }
      } else {
        const mapCategoria = {
          'gorro': 'gorro',
          'playera': 'playera',
          'pantalon': 'pantalon',
          'tenis': 'tenis'
        };
        outfitActual[mapCategoria[item.category]] = itemId;
      }

      // Guardar
      guardarOutfitLocal();
      guardarOutfitSupabase();

      console.log(`👕 ${item.emoji} puesto en Marquinhos flotante (${itemId})`);
      return ropaEl;
    }

    function guardarOutfitLocal() {
      localStorage.setItem('marquinhos_outfit', JSON.stringify(outfitActual));
      localStorage.setItem('marquinhos_outfit_last', Date.now());
    }

    function cargarOutfitLocal() {
      try {
        const data = localStorage.getItem('marquinhos_outfit');
        return data ? JSON.parse(data) : {};
      } catch { return {}; }
    }

    async function guardarOutfitSupabase() {
      try {
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) return;

        const { error } = await supabase
          .from('perfiles')
          .upsert({
            user_id: user.id,
            marquinhos_outfit: outfitActual,
            updated_at: new Date().toISOString()
          }, { onConflict: 'user_id' });

        if (error) console.warn('⚠️ Error guardando en Supabase:', error);
      } catch (e) {
        console.warn('⚠️ Excepción guardando outfit:', e);
      }
    }

    async function cargarOutfitSupabase() {
      try {
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) return null;

        const { data, error } = await supabase
          .from('perfiles')
          .select('marquinhos_outfit')
          .eq('user_id', user.id)
          .maybeSingle();

        if (error) throw error;
        return data?.marquinhos_outfit || null;
      } catch (e) {
        console.warn('⚠️ Error cargando outfit:', e);
        return null;
      }
    }

    async function cargarOutfitGuardado() {
      let outfit = await cargarOutfitSupabase();
      if (!outfit || Object.keys(outfit).length === 0) {
        outfit = cargarOutfitLocal();

      if (outfit && Object.keys(outfit).length > 0) {
        outfitActual = outfit;
        aplicarOutfit(outfitActual);
        console.log('👕 Outfit cargado:', outfitActual);

      if (outfit.tenis) vestirMarquinhosReal(outfit.tenis);
      if (outfit.extras) {
        outfit.extras.forEach(id => vestirMarquinhosReal(id));
      }
    }

      const ojo1 = new THREE.Mesh(ojoGeo, ojoMat);
      ojo1.position.set(-0.15, 0.65, 0.45);
      scene.add(ojo1);
      const ojo2 = new THREE.Mesh(ojoGeo, ojoMat);
      ojo2.position.set(0.15, 0.65, 0.45);
      scene.add(ojo2);

      const pupilaGeo = new THREE.SphereGeometry(0.04, 8, 8);
      const pupilaMat = new THREE.MeshStandardMaterial({ color: 0x0a0a1a });
      const pupila1 = new THREE.Mesh(pupilaGeo, pupilaMat);
      pupila1.position.set(-0.15, 0.62, 0.52);
      scene.add(pupila1);
      const pupila2 = new THREE.Mesh(pupilaGeo, pupilaMat);
      pupila2.position.set(0.15, 0.62, 0.52);
      scene.add(pupila2);

      three = { scene, camera, renderer, base };

      hacerDraggable(widget);

      (function animate() {
        requestAnimationFrame(animate);
        base.rotation.y += 0.005;
        renderer.render(scene, camera);
      })();

      window.addEventListener('resize', () => {
        const rect = widget.getBoundingClientRect();
        camera.aspect = rect.width / rect.height;
        camera.updateProjectionMatrix();
        renderer.setSize(rect.width, rect.height);
      });
    }

    // ================================================================
    // 👆 ARRASTRE CON FÍSICA SUELTA (¡NUEVO!)
    // ================================================================

    function hacerDraggable(widget) {
      let dragging = false;
      let startX, startY, origX, origY;
      let lastDx = 0, lastDy = 0;
      let animationId = null;

      widget.addEventListener('pointerdown', (e) => {
        dragging = true;
        startX = e.clientX;
        startY = e.clientY;
        const rect = widget.getBoundingClientRect();
        origX = rect.left;
        origY = rect.top;
        widget.setPointerCapture(e.pointerId);
        widget.style.cursor = 'grabbing';
        lastDx = 0;
        lastDy = 0;
      });

      widget.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;

        // Mover widget
        widget.style.left = (origX + dx) + 'px';
        widget.style.top = (origY + dy) + 'px';
        widget.style.right = 'auto';
        widget.style.bottom = 'auto';

        // Calcular velocidad
        const velX = dx - lastDx;
        const velY = dy - lastDy;
        lastDx = dx;
        lastDy = dy;

        // Aplicar física suelta a la ropa
        const capaRopa = widget.querySelector('.ropa-equipada');
        if (capaRopa) {
          const items = capaRopa.querySelectorAll('.ropa-item');
          items.forEach((item, index) => {
            const delay = index * 30;
            const factor = 0.15 + (index * 0.05);
            const xOffset = -dx * factor + velX * 2.5;
            const yOffset = -dy * factor + velY * 2.5;
            const rot = dx * 0.08 + velX * 0.5;

            // Aplicar con retraso para efecto de gelatina
            clearTimeout(item._physicsTimeout);
            item._physicsTimeout = setTimeout(() => {
              item.style.transform = `translate(${xOffset}px, ${yOffset}px) rotate(${rot}deg)`;
            }, delay);
          });
        }
      });

      widget.addEventListener('pointerup', () => {
        dragging = false;
        widget.style.cursor = 'grab';

        // Regresar la ropa a su posición con efecto de rebote
        const capaRopa = widget.querySelector('.ropa-equipada');
        if (capaRopa) {
          const items = capaRopa.querySelectorAll('.ropa-item');
          items.forEach((item, index) => {
            const delay = index * 40;
            clearTimeout(item._physicsTimeout);
            setTimeout(() => {
              item.style.transform = 'translate(0px, 0px) rotate(0deg)';
              item.style.transition = 'all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';
              setTimeout(() => {
                item.style.transition = 'all 0.3s cubic-bezier(0.34, 1.2, 0.64, 1)';
              }, 500);
            }, delay);
          });
        }
      });

      widget.addEventListener('pointercancel', () => {
        dragging = false;
        widget.style.cursor = 'grab';
      });
    }

    window.invocarMarquinhos = async function() {
      const widget = obtenerWidget();
      widget.style.display = 'none';

      const iconos = ['🧠', '💪', '🦾', '🦿', '👋', '🤚', '🦶', '👟', '📡', '✋'];
      const piezas = [];

      iconos.forEach((ico, i) => {
        const p = document.createElement('div');
        p.className = 'pieza-voltron';
        p.textContent = ico;
        const ang = (i / iconos.length) * Math.PI * 2;
        p.style.left = `calc(50% + ${Math.cos(ang) * window.innerWidth * 0.6}px)`;
        p.style.top = `calc(50% + ${Math.sin(ang) * window.innerHeight * 0.6}px)`;
        p.style.transitionDelay = `${i * 60}ms`;
        document.body.appendChild(p);
        piezas.push(p);
      });

      await new Promise(r => setTimeout(r, 300));

      piezas.forEach((p, i) => {
        p.style.left = '50%';
        p.style.top = '50%';
        p.style.transform = 'translate(-50%, -50%)';
        p.style.transition = 'all 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55)';
        p.style.transitionDelay = `${i * 60}ms`;
      });

      setTimeout(() => {
        piezas.forEach(p => p.remove());
        widget.style.display = 'block';
        widget.classList.add('saludando');
        setTimeout(() => widget.classList.remove('saludando'), 1500);

        setTimeout(() => {
          aplicarOutfit(outfitActual);
        }, 100);
      }, 1200);
    };

    // ================================================================
    // 🏷️ RENDER CATÁLOGO
    // ================================================================

    function renderCatalogo() {
      const div = document.getElementById('catalogo');
      div.innerHTML = '';

      for (const [id, item] of Object.entries(INVENTARIO_ROPA)) {
        const card = document.createElement('div');
        card.className = 'bg-white rounded-lg shadow p-3 flex flex-col items-center';

        const icon = document.createElement('span');
        icon.textContent = item.icono || '👕';
        icon.className = 'text-4xl mb-2';
        card.appendChild(icon);

        const name = document.createElement('p');
        name.textContent = item.name;
        name.className = 'text-sm font-medium text-center';
        card.appendChild(name);

        const price = document.createElement('p');
        price.textContent = `$${item.precio}`;
        price.className = 'text-xs text-gray-500 font-bold';
        card.appendChild(price);

        const btn = document.createElement('button');
        btn.textContent = '👕 Vestir';
        btn.className = 'mt-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-3 py-1 rounded transition';
        btn.onclick = () => {
          vestirMarquinhosReal(id);
          renderCatalogo();
          mostrarToast(`✅ ${item.name} puesto!`);
        };
        card.appendChild(btn);

        const estaEquipado = (() => {
          if (item.category === 'extras') return outfitActual.extras.includes(id);
          const map = { 'gorro': 'gorro', 'playera': 'playera', 'pantalon': 'pantalon', 'tenis': 'tenis' };
          return outfitActual[map[item.category]] === id;
        })();

        if (estaEquipado) {
          const badge = document.createElement('span');
          badge.textContent = '✅';
          badge.className = 'text-xs text-green-600 font-bold mt-1';
          card.appendChild(badge);
        }

        div.appendChild(card);
      }
    }

    // ================================================================
    // 🔔 TOAST
    // ================================================================

    function mostrarToast(mensaje) {
      const toast = document.createElement('div');
      toast.textContent = mensaje;
      toast.style.cssText = `
        position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
        background: #0f2d1a; color: #d4af37; padding: 10px 20px;
        border-radius: 12px; font-weight: bold; z-index: 99999;
        border: 1px solid rgba(212, 175, 55, 0.3);
        font-size: 0.8rem; box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        animation: toastAnim 0.3s ease-out;
      `;
      document.body.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s';
        setTimeout(() => toast.remove(), 400);
      }, 2500);
    }

    // ================================================================
    // 🚀 INICIALIZAR
    // ================================================================

    async function initApp() {
      initThree();
      renderCatalogo();
      await cargarOutfitGuardado();

      try {
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) {
          await supabase.auth.signInAnonymously();
        }
      } catch (e) {
        console.warn('⚠️ No se pudo hacer login anónimo:', e);
      }

      console.log('🛍️ Tienda Marquinhos lista!');
      console.log('👕 Items disponibles:', Object.keys(INVENTARIO_ROPA).length);
      console.log('💡 Usa vestirMarquinhosReal("id") para vestirlo');
      console.log('🔄 La ropa tiene física suelta al arrastrar!');
    }

    // Exponer funciones globales
    window.vestirMarquinhosReal = vestirMarquinhosReal;
    window.limpiarRopa = limpiarRopa;
    window.invocarMarquinhos = invocarMarquinhos;
    window.mostrarToast = mostrarToast;
    window.renderCatalogo = renderCatalogo;

    document.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
