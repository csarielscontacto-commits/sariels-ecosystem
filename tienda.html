    :root {

      --verde: #0f2d1a;
      --crema: #f5efe0;
      --verde-claro: #1a4a2a;
    }

    /* ===== FONDO CON PLANTILLA ===== */
    body {
      background: var(--verde);
      background-image:
        radial-gradient(ellipse at 20% 50%, rgba(212, 175, 55, 0.05) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 50%, rgba(212, 175, 55, 0.05) 0%, transparent 60%),
        radial-gradient(ellipse at 50% 100%, rgba(15, 45, 26, 0.3) 0%, transparent 50%);
      min-height: 100vh;
      font-family: 'Space Grotesk', system-ui, sans-serif;
    }

    /* ===== HEADER CON LOGO ===== */
    .header-csariel {
      background: rgba(15, 45, 26, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 2px solid rgba(212, 175, 55, 0.2);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo-csariel {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .logo-csariel .hex {
      font-size: 2rem;
      background: var(--verde);
      color: var(--gold);
      padding: 2px 12px;
      border-radius: 8px;
      border: 2px solid var(--gold);
      font-family: 'Orbitron', monospace;
      font-weight: 900;
    }

    .logo-csariel .text {
      font-family: 'Orbitron', monospace;
      font-size: 1.2rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--gold), var(--verde-claro));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo-csariel .badge {
      font-size: 0.5rem;
      background: var(--gold);
      color: var(--verde);
      padding: 2px 10px;
      border-radius: 20px;
      font-weight: 700;
      font-family: 'Orbitron', monospace;
    }

    /* ===== TIENDA ===== */
    .tienda-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .tienda-titulo {
      font-family: 'Orbitron', monospace;
      font-size: 2rem;
      font-weight: 900;
      text-align: center;
      background: linear-gradient(135deg, var(--gold), #b8923a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 20px 0;
      text-shadow: 0 0 40px rgba(212, 175, 55, 0.1);
    }

    .tienda-subtitulo {
      text-align: center;
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.9rem;
      margin-bottom: 24px;
      font-weight: 300;
      letter-spacing: 1px;
    }

    /* ===== CATÁLOGO ===== */
    .catalogo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 16px;
    }

    .card-ropa {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(212, 175, 55, 0.1);
      border-radius: 16px;
      padding: 16px 12px;
      text-align: center;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .card-ropa:hover {
      transform: translateY(-4px);
      border-color: rgba(212, 175, 55, 0.3);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 30px rgba(212, 175, 55, 0.05);
    }

    .card-ropa .icono {
      font-size: 3rem;
      display: block;
      margin-bottom: 6px;
    }

    .card-ropa .nombre {
      font-size: 0.7rem;
      color: rgba(255, 255, 255, 0.9);
      font-weight: 600;
    }

    .card-ropa .precio {
      font-family: 'Orbitron', monospace;
      font-size: 0.7rem;
      color: var(--gold);
      margin: 4px 0 8px;
    }

    .card-ropa .btn-vestir {
      background: var(--gold);
      border: none;
      border-radius: 30px;
      padding: 4px 14px;
      font-family: 'Orbitron', monospace;
      font-size: 0.55rem;
      font-weight: 700;
      color: var(--verde);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .card-ropa .btn-vestir:hover {
      background: #b8923a;
      transform: scale(1.05);
    }

    .card-ropa .badge-equipado {
      font-size: 0.5rem;
      color: #4ade80;
      font-weight: 700;
      display: block;
      margin-top: 4px;
    }

    /* ===== BOTONES DE ACCIÓN ===== */
    .acciones {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin: 20px 0;
    }

    .btn-accion {
      padding: 8px 24px;
      border: none;
      border-radius: 30px;
      font-family: 'Orbitron', monospace;
      font-size: 0.65rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-accion:hover {
      transform: scale(1.05);
    }

    .btn-voltron {
      background: linear-gradient(135deg, var(--gold), #b8923a);
      color: var(--verde);
    }

    .btn-limpiar {
      background: rgba(255, 50, 50, 0.8);
      color: white;
    }

    /* ===== WIDGET ===== */
    #marquinhos-widget {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 180px;
      height: 260px;
      z-index: 9999;
      cursor: grab;
      touch-action: none;
      user-select: none;
    }
    #marquinhos-widget:active {
      cursor: grabbing;
    }

    /* ===== VOLTRON ===== */
    .pieza-voltron {
      position: fixed;
      width: 40px;
      height: 40px;
      background: var(--gold);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      font-size: 24px;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
      transition: all 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }

    @keyframes wave {
      0%,
      100% {
        transform: rotate(0);
      }
      50% {
        transform: rotate(20deg);
      }
    }
    .saludando {
      animation: wave 0.4s 3;
    }

    /* ===== ROPA EQUIPADA ===== */
    .ropa-equipada {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    .ropa-item {
      position: absolute;
      pointer-events: none;
      z-index: 11;
      transition: all 0.3s cubic-bezier(0.34, 1.2, 0.64, 1);
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.2));
      animation: vestirAnim 0.6s ease-out;
      will-change: transform;
    }

    @keyframes vestirAnim {
      0% {
        transform: scale(0) rotate(-20deg);
        opacity: 0;
      }
      60% {
        transform: scale(1.2) rotate(5deg);
        opacity: 1;
      }
      100% {
        transform: scale(1) rotate(0deg);
      }
    }

    @keyframes voltronFlash {
      0% {
        filter: brightness(1) drop-shadow(0 0 0 transparent);
        transform: scale(1);
      }
      25% {
        filter: brightness(2) drop-shadow(0 0 30px #D4AF37);
        transform: scale(1.05);
      }
      50% {
        filter: brightness(1.5) drop-shadow(0 0 60px #00e5ff);
        transform: scale(0.95);
      }
      75% {
        filter: brightness(2) drop-shadow(0 0 30px #D4AF37);
        transform: scale(1.03);
      }
      100% {
        filter: brightness(1) drop-shadow(0 0 0 transparent);
        transform: scale(1);
      }
    }

    /* ===== TOAST ===== */
    .toast-csariel {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--verde);
      color: var(--gold);
      padding: 10px 20px;
      border-radius: 12px;
      font-weight: bold;
      z-index: 99999;
      border: 1px solid rgba(212, 175, 55, 0.3);
      font-size: 0.8rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      animation: toastAnim 0.3s ease-out;
      font-family: 'Orbitron', monospace;
    }

    @keyframes toastAnim {
      0% {
        opacity: 0;
        transform: translateX(-50%) translateY(20px);
      }
      100% {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 640px) {
      .catalogo-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
      .card-ropa {
        padding: 12px 8px;
      }
      .card-ropa .icono {
        font-size: 2rem;
      }
      .tienda-titulo {
        font-size: 1.3rem;
      }
      .header-csariel {
        flex-direction: column;
        align-items: flex-start;
        padding: 10px 16px;
      }
      .logo-csariel .text {
        font-size: 1rem;
      }
    }
  </style>
</head>

    // ================================================================
    // 🎯 WIDGET FLOTANTE
    // ================================================================

    function obtenerWidget() {
      if (!marquinhosWidget) {
        marquinhosWidget = document.getElementById('marquinhos-widget');
        if (!marquinhosWidget) {
          marquinhosWidget = document.createElement('div');
          marquinhosWidget.id = 'marquinhos-widget';

            width: 180px; height: 260px; z-index: 9999;
            cursor: grab; touch-action: none; user-select: none;
          `;
          document.body.appendChild(marquinhosWidget);
        }
      }
      return marquinhosWidget;
    }

    // ================================================================
    // 👕 VESTIR A MARQUINHOS REAL
    // ================================================================

    function vestirMarquinhosReal(itemId) {
      const widget = obtenerWidget();
      const item = INVENTARIO_ROPA[itemId];
      if (!item) return;

      let capaRopa = widget.querySelector('.ropa-equipada');
      if (!capaRopa) {
        capaRopa = document.createElement('div');
        capaRopa.className = 'ropa-equipada';
        widget.style.position = 'relative';
        widget.appendChild(capaRopa);
      }

      const itemsPrevios = capaRopa.querySelectorAll(`.ropa-item-${item.category}`);
      itemsPrevios.forEach(el => {
        el.style.transition = 'all 0.3s ease';
        el.style.opacity = '0';
        el.style.transform = 'scale(0) rotate(20deg)';
        setTimeout(() => el.remove(), 300);
      });

      if (item.category === 'extras') {
        const existente = capaRopa.querySelector(`.ropa-item[data-item-id="${itemId}"]`);
        if (existente) return;
      }

      const ropaEl = document.createElement('div');
      ropaEl.className = `ropa-item ropa-item-${item.category}`;
      ropaEl.dataset.itemId = itemId;

      const rotacion = item.rotation || '0deg';
      ropaEl.style.cssText = `
        position: absolute;
        top: ${item.top || '0px'};
        left: ${item.left || '0px'};
        font-size: ${item.size || '24px'};
        pointer-events: none;
        z-index: 11;
        transition: all 0.3s cubic-bezier(0.34, 1.2, 0.64, 1);
        filter: drop-shadow(0 2px 8px rgba(0,0,0,0.2));
        animation: vestirAnim 0.6s ease-out;
        will-change: transform;
        transform: rotate(${rotacion});
      `;

      // Si es la playera de Csariel's, mostrar emoji especial
      if (itemId === 'playera_csariel') {
        ropaEl.textContent = '◈';
        ropaEl.style.fontSize = '32px';
        ropaEl.style.fontWeight = '900';
        ropaEl.style.color = '#d4af37';
        ropaEl.style.textShadow = '0 0 20px rgba(212, 175, 55, 0.3)';
      } else {
        ropaEl.textContent = item.emoji || item.icono;
      }

      capaRopa.appendChild(ropaEl);
      ropaItems.push(ropaEl);

      if (item.category === 'extras') {
        if (!outfitActual.extras.includes(itemId)) {
          outfitActual.extras.push(itemId);
        }
      } else {
        const mapCategoria = {
          'gorro': 'gorro',
          'playera': 'playera',
          'pantalon': 'pantalon',
          'tenis': 'tenis'
        };
        outfitActual[mapCategoria[item.category]] = itemId;
      }

      guardarOutfitLocal();
      guardarOutfitSupabase();

      console.log(`👕 ${item.emoji} puesto en Marquinhos flotante (${itemId})`);
      return ropaEl;
    }

      localStorage.setItem('marquinhos_outfit', JSON.stringify(outfitActual));

    }

    function cargarOutfitLocal() {
      try {
        const data = localStorage.getItem('marquinhos_outfit');
        return data ? JSON.parse(data) : {};
      } catch { return {}; }
    }

    async function guardarOutfitSupabase() {
      try {
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) return;

        const { error } = await supabase
          .from('perfiles')
          .upsert({
            user_id: user.id,
            marquinhos_outfit: outfitActual,
            updated_at: new Date().toISOString()
          }, { onConflict: 'user_id' });

        if (error) console.warn('⚠️ Error guardando en Supabase:', error);
      } catch (e) {
        console.warn('⚠️ Excepción guardando outfit:', e);
      }
    }

      try {

        const { data, error } = await supabase
          .from('perfiles')
          .select('marquinhos_outfit')
          .eq('user_id', user.id)
          .maybeSingle();

        if (error) throw error;
        return data?.marquinhos_outfit || null;
      } catch (e) {
        console.warn('⚠️ Error cargando outfit:', e);
        return null;
      }
    }

    async function cargarOutfitGuardado() {
      let outfit = await cargarOutfitSupabase();
      if (!outfit || Object.keys(outfit).length === 0) {
        outfit = cargarOutfitLocal();
      }
      if (outfit && Object.keys(outfit).length > 0) {
        outfitActual = outfit;
        aplicarOutfit(outfitActual);
        console.log('👕 Outfit cargado:', outfitActual);
      }
    }

    function aplicarOutfit(outfit) {
      if (outfit.gorro) vestirMarquinhosReal(outfit.gorro);
      if (outfit.playera) vestirMarquinhosReal(outfit.playera);
      if (outfit.pantalon) vestirMarquinhosReal(outfit.pantalon);
      if (outfit.tenis) vestirMarquinhosReal(outfit.tenis);
      if (outfit.extras) {
        outfit.extras.forEach(id => vestirMarquinhosReal(id));
      }
    }

    window.limpiarRopa = function() {
      const widget = obtenerWidget();
      const capaRopa = widget.querySelector('.ropa-equipada');
      if (capaRopa) capaRopa.innerHTML = '';
      ropaItems = [];
      outfitActual = { gorro: null, playera: null, pantalon: null, tenis: null, extras: [] };
      guardarOutfitLocal();
      guardarOutfitSupabase();
      renderCatalogo();
      mostrarToast('🧹 Ropa limpiada');
    };

    // ================================================================
    // 🎨 THREE.JS - ESCENA 3D
    // ================================================================

    let three = null;

    function initThree() {
      const widget = obtenerWidget();

      const canvas = document.createElement('canvas');
      canvas.style.cssText = 'width:100%; height:100%; display:block;';
      widget.appendChild(canvas);

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(45, widget.clientWidth / widget.clientHeight, 0.1, 1000);
      camera.position.set(0, 1.2, 2.5);

      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      renderer.setSize(widget.clientWidth, widget.clientHeight);
      renderer.setPixelRatio(window.devicePixelRatio || 1);

      const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
      scene.add(hemi);
      const dir = new THREE.DirectionalLight(0xffffff, 0.8);
      dir.position.set(1, 2, 1);
      scene.add(dir);

      // Base Marquinhos con color dorado
      const baseGeo = new THREE.SphereGeometry(0.5, 32, 32);
      const baseMat = new THREE.MeshStandardMaterial({
        color: 0xd4af37,
        emissive: 0x0f2d1a,
        emissiveIntensity: 0.1,
        metalness: 0.1,
        roughness: 0.6
      });
      const base = new THREE.Mesh(baseGeo, baseMat);
      base.position.y = 0.5;
      scene.add(base);

      // Ojos
      const ojoGeo = new THREE.SphereGeometry(0.08, 8, 8);
      const ojoMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 0.3 });
      const ojo1 = new THREE.Mesh(ojoGeo, ojoMat);
      ojo1.position.set(-0.15, 0.65, 0.45);
      scene.add(ojo1);
      const ojo2 = new THREE.Mesh(ojoGeo, ojoMat);
      ojo2.position.set(0.15, 0.65, 0.45);
      scene.add(ojo2);

      const pupilaGeo = new THREE.SphereGeometry(0.04, 8, 8);
      const pupilaMat = new THREE.MeshStandardMaterial({ color: 0x0a0a1a });
      const pupila1 = new THREE.Mesh(pupilaGeo, pupilaMat);
      pupila1.position.set(-0.15, 0.62, 0.52);
      scene.add(pupila1);
      const pupila2 = new THREE.Mesh(pupilaGeo, pupilaMat);
      pupila2.position.set(0.15, 0.62, 0.52);
      scene.add(pupila2);

      three = { scene, camera, renderer, base };

      hacerDraggable(widget);

      (function animate() {
        requestAnimationFrame(animate);
        base.rotation.y += 0.005;
        renderer.render(scene, camera);
      })();

      window.addEventListener('resize', () => {
        const rect = widget.getBoundingClientRect();
        camera.aspect = rect.width / rect.height;
        camera.updateProjectionMatrix();
        renderer.setSize(rect.width, rect.height);
      });
    }

    // ================================================================
    // 👆 ARRASTRE CON FÍSICA SUELTA
    // ================================================================

    function hacerDraggable(widget) {
      let dragging = false;
      let startX, startY, origX, origY;
      let lastDx = 0,
        lastDy = 0;

      widget.addEventListener('pointerdown', (e) => {
        dragging = true;
        startX = e.clientX;
        startY = e.clientY;
        const rect = widget.getBoundingClientRect();
        origX = rect.left;
        origY = rect.top;
        widget.setPointerCapture(e.pointerId);
        widget.style.cursor = 'grabbing';
        lastDx = 0;
        lastDy = 0;
      });

      widget.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;

        widget.style.left = (origX + dx) + 'px';
        widget.style.top = (origY + dy) + 'px';
        widget.style.right = 'auto';
        widget.style.bottom = 'auto';

        const velX = dx - lastDx;
        const velY = dy - lastDy;
        lastDx = dx;
        lastDy = dy;

        const capaRopa = widget.querySelector('.ropa-equipada');
        if (capaRopa) {
          const items = capaRopa.querySelectorAll('.ropa-item');
          items.forEach((item, index) => {
            const delay = index * 30;
            const factor = 0.15 + (index * 0.05);
            const xOffset = -dx * factor + velX * 2.5;
            const yOffset = -dy * factor + velY * 2.5;
            const rot = dx * 0.08 + velX * 0.5;

            clearTimeout(item._physicsTimeout);
            item._physicsTimeout = setTimeout(() => {
              item.style.transform = `translate(${xOffset}px, ${yOffset}px) rotate(${rot}deg)`;
            }, delay);
          });
        }
      });

      widget.addEventListener('pointerup', () => {
        dragging = false;
        widget.style.cursor = 'grab';

        const capaRopa = widget.querySelector('.ropa-equipada');
        if (capaRopa) {
          const items = capaRopa.querySelectorAll('.ropa-item');
          items.forEach((item, index) => {
            const delay = index * 40;
            clearTimeout(item._physicsTimeout);
            setTimeout(() => {
              item.style.transform = 'translate(0px, 0px) rotate(0deg)';
              item.style.transition = 'all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';
              setTimeout(() => {
                item.style.transition = 'all 0.3s cubic-bezier(0.34, 1.2, 0.64, 1)';
              }, 500);
            }, delay);
          });
        }
      });

      widget.addEventListener('pointercancel', () => {
        dragging = false;
        widget.style.cursor = 'grab';
      });
    }

    // ================================================================
    // ⚡ TRANSFORMACIÓN VOLTRON
    // ================================================================

    window.invocarMarquinhos = async function() {
      const widget = obtenerWidget();
      widget.style.display = 'none';

      const iconos = ['🧠', '💪', '🦾', '🦿', '👋', '🤚', '🦶', '👟', '📡', '✋'];
      const piezas = [];

      iconos.forEach((ico, i) => {
        const p = document.createElement('div');
        p.className = 'pieza-voltron';
        p.textContent = ico;
        const ang = (i / iconos.length) * Math.PI * 2;
        p.style.left = `calc(50% + ${Math.cos(ang) * window.innerWidth * 0.6}px)`;
        p.style.top = `calc(50% + ${Math.sin(ang) * window.innerHeight * 0.6}px)`;
        p.style.transitionDelay = `${i * 60}ms`;
        document.body.appendChild(p);
        piezas.push(p);
      });

      await new Promise(r => setTimeout(r, 300));

      piezas.forEach((p, i) => {
        p.style.left = '50%';
        p.style.top = '50%';
        p.style.transform = 'translate(-50%, -50%)';
        p.style.transition = 'all 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55)';
        p.style.transitionDelay = `${i * 60}ms`;
      });

      setTimeout(() => {
        piezas.forEach(p => p.remove());
        widget.style.display = 'block';
        widget.classList.add('saludando');
        setTimeout(() => widget.classList.remove('saludando'), 1500);

        setTimeout(() => {
          aplicarOutfit(outfitActual);
        }, 100);
      }, 1200);
    };

    // ================================================================
    // 🏷️ RENDER CATÁLOGO
    // ================================================================

    function renderCatalogo() {
      const div = document.getElementById('catalogo');
      div.innerHTML = '';

      for (const [id, item] of Object.entries(INVENTARIO_ROPA)) {
        const card = document.createElement('div');
        card.className = 'card-ropa';

        const icon = document.createElement('span');
        icon.className = 'icono';
        if (id === 'playera_csariel') {
          icon.textContent = '◈';
          icon.style.color = '#d4af37';
          icon.style.fontSize = '3.5rem';
          icon.style.fontWeight = '900';
          icon.style.textShadow = '0 0 30px rgba(212, 175, 55, 0.3)';
        } else {
          icon.textContent = item.icono || '👕';
        }
        card.appendChild(icon);

        const name = document.createElement('div');
        name.className = 'nombre';
        name.textContent = item.name;
        card.appendChild(name);

        const price = document.createElement('div');
        price.className = 'precio';
        price.textContent = `$${item.precio}`;
        card.appendChild(price);

        const btn = document.createElement('button');
        btn.className = 'btn-vestir';
        btn.textContent = '👕 Vestir';
        btn.onclick = () => {
          vestirMarquinhosReal(id);
          renderCatalogo();
          mostrarToast(`✅ ${item.name} puesto!`);
        };
        card.appendChild(btn);

        const estaEquipado = (() => {
          if (item.category === 'extras') return outfitActual.extras.includes(id);
          const map = { 'gorro': 'gorro', 'playera': 'playera', 'pantalon': 'pantalon', 'tenis': 'tenis' };
          return outfitActual[map[item.category]] === id;
        })();

        if (estaEquipado) {
          const badge = document.createElement('span');
          badge.className = 'badge-equipado';
          badge.textContent = '✅ Equipado';
          card.appendChild(badge);
        }

        div.appendChild(card);
      }
    }

    // ================================================================
    // 🔔 TOAST
    // ================================================================

    function mostrarToast(mensaje) {
      const toast = document.createElement('div');
      toast.className = 'toast-csariel';
      toast.textContent = mensaje;
      document.body.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s';
        setTimeout(() => toast.remove(), 400);
      }, 2500);
    }

    // ================================================================
    // 🚀 INICIALIZAR
    // ================================================================

    async function initApp() {
      initThree();
      renderCatalogo();
      await cargarOutfitGuardado();

      try {
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) {
          await supabase.auth.signInAnonymously();
        }
      } catch (e) {
        console.warn('⚠️ No se pudo hacer login anónimo:', e);
      }

      console.log('🛍️ Tienda Marquinhos - Csariel\'s Edition');
      console.log('👕 Items disponibles:', Object.keys(INVENTARIO_ROPA).length);
      console.log('◈ Playera Csariel\'s con logo incluido!');
      console.log('🥖 Traje de Pan de Cancha y Baguette agregados!');
      console.log('💡 Usa vestirMarquinhosReal("playera_csariel") para el logo');
    }

    // Exponer funciones globales
    window.vestirMarquinhosReal = vestirMarquinhosReal;
    window.invocarMarquinhos = invocarMarquinhos;
    window.mostrarToast = mostrarToast;
    window.renderCatalogo = renderCatalogo;

    document.addEventListener('DOMContentLoaded', initApp);
  </script>
