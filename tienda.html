  </script>
  <style>
    /* ===== AZUL METÁLICO + WED3 ===== */
    :root {
      --azul-met: #0a192f;
      --azul-wed: #1a3a5c;
      --oro: #d4af37;
      --crema: #f5efe0;
      --azul-claro: #2a5a8c;
      --rojo-navidad: #cc2233;
      --verde-navidad: #1a6b3c;
    }

    body {
      background: var(--azul-met);
      background-image:
        radial-gradient(ellipse at 20% 50%, rgba(26, 58, 92, 0.6) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 50%, rgba(42, 90, 140, 0.4) 0%, transparent 60%),
        radial-gradient(ellipse at 50% 100%, rgba(10, 25, 47, 0.8) 0%, transparent 50%),
        linear-gradient(135deg, #0a192f 0%, #0d2847 40%, #1a3a5c 100%);
      min-height: 100vh;
      font-family: 'Space Grotesk', system-ui, sans-serif;
    }

    /* ===== HEADER ===== */
    .header-csariel {
      background: rgba(10, 25, 47, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 2px solid rgba(212, 175, 55, 0.25);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
    }

    .logo-csariel {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .logo-csariel .hex {
      font-size: 2rem;
      background: var(--azul-met);
      color: var(--oro);
      padding: 2px 12px;
      border-radius: 8px;
      border: 2px solid var(--oro);
      font-family: 'Orbitron', monospace;
      font-weight: 900;
      text-shadow: 0 0 20px rgba(212, 175, 55, 0.15);
    }

    .logo-csariel .text {
      font-family: 'Orbitron', monospace;
      font-size: 1.2rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--oro), #b8923a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo-csariel .badge {
      font-size: 0.5rem;
      background: var(--oro);
      color: var(--azul-met);
      padding: 2px 10px;
      border-radius: 20px;
      font-weight: 700;
      font-family: 'Orbitron', monospace;
    }

    /* ===== TIENDA ===== */
    .tienda-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .tienda-titulo {
      font-family: 'Orbitron', monospace;
      font-size: 2rem;
      font-weight: 900;
      text-align: center;
      background: linear-gradient(135deg, var(--oro), #b8923a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 20px 0;
      text-shadow: 0 0 60px rgba(212, 175, 55, 0.08);
    }

    .tienda-subtitulo {
      text-align: center;
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.9rem;
      margin-bottom: 24px;
      font-weight: 300;
      letter-spacing: 1px;
    }

    /* ===== CATÁLOGO ===== */
    .catalogo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 16px;
    }

    .card-ropa {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(212, 175, 55, 0.08);
      border-radius: 16px;
      padding: 16px 12px;
      text-align: center;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .card-ropa:hover {
      transform: translateY(-4px);
      border-color: rgba(212, 175, 55, 0.25);
      background: rgba(255, 255, 255, 0.07);
      box-shadow: 0 8px 40px rgba(212, 175, 55, 0.04);
    }

    .card-ropa .icono {
      font-size: 3rem;
      display: block;
      margin-bottom: 6px;
    }

    .card-ropa .nombre {
      font-size: 0.7rem;
      color: rgba(255, 255, 255, 0.85);
      font-weight: 600;
    }

    .card-ropa .precio {
      font-family: 'Orbitron', monospace;
      font-size: 0.7rem;
      color: var(--oro);
      margin: 4px 0 8px;
    }

    .card-ropa .btn-vestir {
      background: var(--oro);
      border: none;
      border-radius: 30px;
      padding: 4px 14px;
      font-family: 'Orbitron', monospace;
      font-size: 0.55rem;
      font-weight: 700;
      color: var(--azul-met);
      cursor: pointer;
      transition: all 0.3s ease;
      margin: 2px;
    }

    .card-ropa .btn-vestir:hover {
      background: #b8923a;
      transform: scale(1.05);
    }

    .card-ropa .badge-equipado {
      font-size: 0.5rem;
      color: #4ade80;
      font-weight: 700;
      display: block;
      margin-top: 4px;
    }

    .card-ropa .btn-guardar {
      background: #2a5a8c;
      border: none;
      border-radius: 30px;
      padding: 4px 10px;
      font-family: 'Orbitron', monospace;
      font-size: 0.5rem;
      font-weight: 700;
      color: white;
      cursor: pointer;
      transition: all 0.3s ease;
      margin: 2px;
    }

    .card-ropa .btn-guardar:hover {
      background: #3a7aac;
      transform: scale(1.05);
    }

    /* ===== VISTA PREVIA ===== */
    .preview-badge {
      background: #FF6B35;
      color: white;
      font-size: 0.5rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 12px;
      display: inline-block;
      margin-top: 4px;
    }

    .preview-actions {
      display: flex;
      gap: 4px;
      justify-content: center;
      margin-top: 4px;
    }

    .preview-actions .btn-comprar {
      background: #4ade80;
      border: none;
      border-radius: 30px;
      padding: 2px 10px;
      font-size: 0.5rem;
      font-weight: 700;
      color: #0a192f;
      cursor: pointer;
    }

    .preview-actions .btn-quitar {
      background: #ff4444;
      border: none;
      border-radius: 30px;
      padding: 2px 10px;
      font-size: 0.5rem;
      font-weight: 700;
      color: white;
      cursor: pointer;
    }

    /* ===== BOTONES ===== */
    .acciones {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin: 20px 0;
    }

    .btn-accion {
      padding: 8px 24px;
      border: none;
      border-radius: 30px;
      font-family: 'Orbitron', monospace;
      font-size: 0.65rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-accion:hover {
      transform: scale(1.05);
    }

    .btn-marquinhos {
      background: linear-gradient(135deg, var(--oro), #b8923a);
      color: var(--azul-met);
    }

    .btn-limpiar {
      background: rgba(255, 50, 50, 0.8);
      color: white;
    }

    .btn-guardar-outfit {
      background: #2a5a8c;
      color: white;
    }

    .btn-cargar-outfit {
      background: #1a6b3c;
      color: white;
    }

    /* ===== WIDGET ===== */
    #marquinhos-widget {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 180px;
      height: 260px;
      z-index: 9999;
      cursor: grab;
      touch-action: none;
      user-select: none;
    }
    #marquinhos-widget:active {
      cursor: grabbing;
    }

    /* ===== MARQUINHOS ASSEMBLY ===== */
    .pieza-marquinhos {
      position: fixed;
      width: 40px;
      height: 40px;
      background: var(--oro);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      font-size: 24px;
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.2);
      transition: all 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }

    @keyframes wave {
      0%,
      100% {
        transform: rotate(0);
      }
      50% {
        transform: rotate(20deg);
      }
    }
    .saludando {
      animation: wave 0.4s 3;
    }

    /* ===== ROPA EQUIPADA ===== */
    .ropa-equipada {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    .ropa-item {
      position: absolute;
      pointer-events: none;
      z-index: 11;
      transition: all 0.3s cubic-bezier(0.34, 1.2, 0.64, 1);
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.2));
      animation: vestirAnim 0.6s ease-out;
      will-change: transform;
    }

    @keyframes vestirAnim {
      0% {
        transform: scale(0) rotate(-20deg);
        opacity: 0;
      }
      60% {
        transform: scale(1.2) rotate(5deg);
        opacity: 1;
      }
      100% {
        transform: scale(1) rotate(0deg);
      }
    }

    @keyframes marquinhosFlash {
      0% {
        filter: brightness(1) drop-shadow(0 0 0 transparent);
        transform: scale(1);
      }
      25% {
        filter: brightness(2) drop-shadow(0 0 30px #D4AF37);
        transform: scale(1.05);
      }
      50% {
        filter: brightness(1.5) drop-shadow(0 0 60px #00e5ff);
        transform: scale(0.95);
      }
      75% {
        filter: brightness(2) drop-shadow(0 0 30px #D4AF37);
        transform: scale(1.03);
      }
      100% {
        filter: brightness(1) drop-shadow(0 0 0 transparent);
        transform: scale(1);
      }
    }

    /* ===== TOAST ===== */
    .toast-csariel {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--azul-met);
      color: var(--oro);
      padding: 10px 20px;
      border-radius: 12px;
      font-weight: bold;
      z-index: 99999;
      border: 1px solid rgba(212, 175, 55, 0.2);
      font-size: 0.8rem;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
      animation: toastAnim 0.3s ease-out;
      font-family: 'Orbitron', monospace;
    }

    @keyframes toastAnim {
      0% {
        opacity: 0;
        transform: translateX(-50%) translateY(20px);
      }
      100% {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }

    /* ===== MODAL DE GUARDADO ===== */
    .modal-outfit {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: modalAnim 0.3s ease-out;
    }

    @keyframes modalAnim {
      0% {
        opacity: 0;
        transform: scale(0.9);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .modal-content {
      background: var(--azul-met);
      border: 2px solid rgba(212, 175, 55, 0.3);
      border-radius: 20px;
      padding: 30px;
      max-width: 500px;
      width: 90%;
      color: white;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .modal-content h2 {
      font-family: 'Orbitron', monospace;
      color: var(--oro);
      margin-bottom: 20px;
      text-align: center;
    }

    .modal-content input {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid rgba(212, 175, 55, 0.3);
      background: rgba(255, 255, 255, 0.05);
      color: white;
      font-size: 1rem;
      margin-bottom: 15px;
    }

    .modal-content .btn-modal {
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      font-family: 'Orbitron', monospace;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      margin: 5px;
    }

    .modal-content .btn-modal:hover {
      transform: scale(1.05);
    }

    .modal-content .btn-guardar-modal {
      background: var(--oro);
      color: var(--azul-met);
    }

    .modal-content .btn-cancelar-modal {
      background: rgba(255, 50, 50, 0.8);
      color: white;
    }

    .modal-content .btn-cargar-modal {
      background: #2a5a8c;
      color: white;
    }

    .outfit-list {
      max-height: 200px;
      overflow-y: auto;
      margin: 15px 0;
    }

    .outfit-item {
      padding: 8px 12px;
      margin: 4px 0;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .outfit-item:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .outfit-item .nombre-outfit {
      font-size: 0.9rem;
    }

    .outfit-item .btn-cargar-outfit-item {
      background: var(--oro);
      border: none;
      border-radius: 20px;
      padding: 2px 12px;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--azul-met);
      cursor: pointer;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 640px) {
      .catalogo-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
      .card-ropa {
        padding: 12px 8px;
      }
      .card-ropa .icono {
        font-size: 2rem;
      }
      .tienda-titulo {
        font-size: 1.3rem;
      }
      .header-csariel {
        flex-direction: column;
        align-items: flex-start;
        padding: 10px 16px;
      }
      .logo-csariel .text {
        font-size: 1rem;
      }
      .modal-content {
        padding: 20px;
      }
    }
  </style>
</head>

        outfitsGuardados = data ? JSON.parse(data) : [];
      } catch {
        outfitsGuardados = [];
      }

    function guardarOutfitConNombre(nombre) {
      if (!nombre.trim()) {
        mostrarToast('❌ Por favor ingresa un nombre para el outfit');
        return;
      }

      const outfitCopy = JSON.parse(JSON.stringify(outfitActual));
      const nuevoOutfit = {
        id: Date.now(),
        nombre: nombre.trim(),
        outfit: outfitCopy,
        fecha: new Date().toLocaleDateString(),
        prendas: contarPrendas(outfitCopy)
      };

      outfitsGuardados.push(nuevoOutfit);
      guardarOutfitsEnLocal();
      mostrarToast(`✅ Outfit "${nombre}" guardado!`);
      cerrarModal();
    }

    function contarPrendas(outfit) {
      let count = 0;
      if (outfit.gorro) count++;
      if (outfit.playera) count++;
      if (outfit.pantalon) count++;
      if (outfit.tenis) count++;
      if (outfit.extras) count += outfit.extras.length;
      return count;
    }

    function cargarOutfitPorId(id) {
      const outfit = outfitsGuardados.find(o => o.id === id);
      if (!outfit) {
        mostrarToast('❌ Outfit no encontrado');
        return;

      limpiarRopa();
      outfitActual = JSON.parse(JSON.stringify(outfit.outfit));
      aplicarOutfit(outfitActual);
      renderCatalogo();
      mostrarToast(`✅ Outfit "${outfit.nombre}" cargado!`);

    // ================================================================

    // ================================================================

    function vestirMarquinhosReal(itemId) {
      const widget = obtenerWidget();
      const item = INVENTARIO_ROPA[itemId];
      if (!item) return;

      // Si hay preview, limpiarla
      if (previewMode) {
        limpiarPreview();
      }

      let capaRopa = widget.querySelector('.ropa-equipada');
      if (!capaRopa) {
        capaRopa = document.createElement('div');
        capaRopa.className = 'ropa-equipada';
        widget.style.position = 'relative';
        widget.appendChild(capaRopa);
      }

      const itemsPrevios = capaRopa.querySelectorAll(`.ropa-item-${item.category}`);
      itemsPrevios.forEach(el => {
        el.style.transition = 'all 0.3s ease';
        el.style.opacity = '0';
        el.style.transform = 'scale(0) rotate(20deg)';
        setTimeout(() => el.remove(), 300);
      });

      if (item.category === 'extras') {
        const existente = capaRopa.querySelector(`.ropa-item[data-item-id="${itemId}"]`);
        if (existente) return;
      }

      const ropaEl = document.createElement('div');
      ropaEl.className = `ropa-item ropa-item-${item.category}`;
      ropaEl.dataset.itemId = itemId;

      const rotacion = item.rotation || '0deg';
      ropaEl.style.cssText = `
        position: absolute;
        top: ${item.top || '0px'};
        left: ${item.left || '0px'};
        font-size: ${item.size || '24px'};
        pointer-events: none;
        z-index: 11;
        transition: all 0.3s cubic-bezier(0.34, 1.2, 0.64, 1);
        filter: drop-shadow(0 2px 8px rgba(0,0,0,0.2));
        animation: vestirAnim 0.6s ease-out;
        will-change: transform;
        transform: rotate(${rotacion});
      `;

      if (itemId === 'playera_csariel') {
        ropaEl.textContent = '◈';
        ropaEl.style.fontSize = '32px';
        ropaEl.style.fontWeight = '900';
        ropaEl.style.color = '#d4af37';
        ropaEl.style.textShadow = '0 0 20px rgba(212, 175, 55, 0.3)';
      } else {
        ropaEl.textContent = item.emoji || item.icono;
      }

      capaRopa.appendChild(ropaEl);
      ropaItems.push(ropaEl);

      if (item.category === 'extras') {
        if (!outfitActual.extras.includes(itemId)) {
          outfitActual.extras.push(itemId);
        }
      } else {
        const mapCategoria = {
          'gorro': 'gorro',
          'playera': 'playera',
          'pantalon': 'pantalon',
          'tenis': 'tenis'
        };
        outfitActual[mapCategoria[item.category]] = itemId;

          btnQuitar.textContent = '❌ Quitar';
          btnQuitar.onclick = (e) => {
            e.stopPropagation();

          };
          actions.appendChild(btnQuitar);

          card.appendChild(actions);

        } else {
          // Modo normal
          const btnVestir = document.createElement('button');
          btnVestir.className = 'btn-vestir';
          btnVestir.textContent = '👕 Vestir';
          btnVestir.onclick = () => {
            // Vista previa al tocar "Vestir"

          card.appendChild(btnVestir);

          const btnGuardar = document.createElement('button');

            if (item.category === 'extras') return outfitActual.extras.includes(id);

          })();

          if (estaEquipado) {

            badge.className = 'badge-equipado';
            badge.textContent = '✅ Equipado';
            card.appendChild(badge);
          }

        div.appendChild(card);

      const top = prompt(`📏 Ajusta la posición vertical (top) para "${item.name}":\nValor actual: ${item.top}`, item.top);

      const left = prompt(`📏 Ajusta la posición horizontal (left) para "${item.name}":\nValor actual: ${item.left}`, item.left);
      if (left === null) return;

      const size = prompt(`📏 Ajusta el tamaño (size) para "${item.name}":\nValor actual: ${item.size}`, item.size);
      if (size === null) return;

      const rotation = prompt(`📏 Ajusta la rotación (rotation) para "${item.name}":\nValor actual: ${item.rotation || '0deg'}`, item.rotation || '0deg');
      if (rotation === null) return;

      item.top = top;
      item.left = left;
      item.size = size;
      item.rotation = rotation;

      const estaEquipado = (() => {
        if (item.category === 'extras') return outfitActual.extras.includes(id);
        const map = { 'gorro': 'gorro', 'playera': 'playera', 'pantalon': 'pantalon', 'tenis': 'tenis' };
        return outfitActual[map[item.category]] === id;
      })();

      if (estaEquipado) {
        const widget = obtenerWidget();
        const capaRopa = widget.querySelector('.ropa-equipada');
        if (capaRopa) {
          const items = capaRopa.querySelectorAll(`.ropa-item-${item.category}`);

        vestirMarquinhosReal(id);
      }

      mostrarToast(`✅ Medidas guardadas para "${item.name}"`);
      localStorage.setItem('medidas_personalizadas', JSON.stringify(INVENTARIO_ROPA));

    window.invocarMarquinhos = async function() {
      const widget = obtenerWidget();
      widget.style.display = 'none';

      const iconos = ['🧠', '💪', '🦾', '🦿', '👋', '🤚', '🦶', '👟', '📡', '✋'];
      const piezas = [];

      iconos.forEach((ico, i) => {
        const p = document.createElement('div');
        p.className = 'pieza-marquinhos';
        p.textContent = ico;
        const ang = (i / iconos.length) * Math.PI * 2;
        p.style.left = `calc(50% + ${Math.cos(ang) * window.innerWidth * 0.6}px)`;
        p.style.top = `calc(50% + ${Math.sin(ang) * window.innerHeight * 0.6}px)`;
        p.style.transitionDelay = `${i * 60}ms`;
        document.body.appendChild(p);
        piezas.push(p);
      });

      await new Promise(r => setTimeout(r, 300));

      piezas.forEach((p, i) => {
        p.style.left = '50%';
        p.style.top = '50%';
        p.style.transform = 'translate(-50%, -50%)';
        p.style.transition = 'all 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55)';
        p.style.transitionDelay = `${i * 60}ms`;
      });

      setTimeout(() => {
        piezas.forEach(p => p.remove());
        widget.style.display = 'block';
        widget.classList.add('saludando');
        setTimeout(() => widget.classList.remove('saludando'), 1500);

        setTimeout(() => {
          aplicarOutfit(outfitActual);
        }, 100);
      }, 1200);
    };

    // ================================================================
    // 👆 ARRASTRE CON INERCIA
    // ================================================================

    function hacerDraggable(widget) {
      let dragging = false;
      let startX, startY, origX, origY;
      let lastDx = 0,
        lastDy = 0;

      widget.addEventListener('pointerdown', (e) => {
        dragging = true;
        startX = e.clientX;
        startY = e.clientY;
        const rect = widget.getBoundingClientRect();
        origX = rect.left;
        origY = rect.top;
        widget.setPointerCapture(e.pointerId);
        widget.style.cursor = 'grabbing';
        lastDx = 0;
        lastDy = 0;
      });

      widget.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;

        widget.style.left = (origX + dx) + 'px';
        widget.style.top = (origY + dy) + 'px';
        widget.style.right = 'auto';
        widget.style.bottom = 'auto';

        const velX = dx - lastDx;
        const velY = dy - lastDy;
        lastDx = dx;
        lastDy = dy;

        const capaRopa = widget.querySelector('.ropa-equipada');
        if (capaRopa) {
          const items = capaRopa.querySelectorAll('.ropa-item');
          items.forEach((item, index) => {
            const delay = index * 30;
            const factor = 0.15 + (index * 0.05);
            // Dirección CONTRARIA al arrastre (efecto de jalón)
            const xOffset = -dx * factor + velX * 2.5;
            const yOffset = -dy * factor + velY * 2.5;
            const rot = dx * 0.08 + velX * 0.5;

            clearTimeout(item._physicsTimeout);
            item._physicsTimeout = setTimeout(() => {
              item.style.transform = `translate(${xOffset}px, ${yOffset}px) rotate(${rot}deg)`;
            }, delay);
          });
        }
      });

      widget.addEventListener('pointerup', () => {
        dragging = false;
        widget.style.cursor = 'grab';

        const capaRopa = widget.querySelector('.ropa-equipada');
        if (capaRopa) {
          const items = capaRopa.querySelectorAll('.ropa-item');
          items.forEach((item, index) => {
            const delay = index * 40;
            clearTimeout(item._physicsTimeout);
            setTimeout(() => {
              // Regresar a posición original con bounce
              item.style.transform = 'translate(0px, 0px) rotate(0deg)';
              item.style.transition = 'all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';
              setTimeout(() => {
                item.style.transition = 'all 0.3s cubic-bezier(0.34, 1.2, 0.64, 1)';
              }, 500);
            }, delay);
          });
        }
      });

      widget.addEventListener('pointercancel', () => {
        dragging = false;
        widget.style.cursor = 'grab';
      });
    }

    // ================================================================
    // 🔔 TOAST
    // ================================================================

    function mostrarToast(mensaje) {
      const toast = document.createElement('div');
      toast.className = 'toast-csariel';
      toast.textContent = mensaje;
      document.body.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s';
        setTimeout(() => toast.remove(), 400);
      }, 2500);
    }

    // ================================================================
    // 📦 FUNCIÓN PARA CARGAR MARQUINHOS DESDE marquinhos.html
    // ================================================================

    async function cargarMarquinhos() {
      try {
        const widget = obtenerWidget();
        widget.innerHTML = '';

        // Cargar el widget real desde marquinhos.html
        const response = await fetch('marquinhos.html');
        if (!response.ok) {
          console.warn('⚠️ No se pudo cargar marquinhos.html, usando placeholder');
          widget.innerHTML = `
            <div style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; background:rgba(10,25,47,0.8); border-radius:20px; border:2px solid rgba(212,175,55,0.2); color:white; font-size:12px; text-align:center; padding:10px;">
              <div>
                <div style="font-size:40px; margin-bottom:8px;">🎭</div>
                <div style="font-weight:bold; color:#d4af37;">Marquinhos</div>
                <div style="font-size:10px; opacity:0.5;">Talavera Cerámica</div>
              </div>
            </div>
          `;
          return;
        }

        const html = await response.text();
        widget.innerHTML = html;

        // Hacer draggable al widget real
        hacerDraggable(widget);

        // Re-aplicar outfit después de cargar
        setTimeout(() => {
          aplicarOutfit(outfitActual);
          // Inicializar el módulo cognitivo si existe en el widget cargado
          if (typeof window.MarquinhosCognitiveAI?.loadFromSupabase === 'function') {
            window.MarquinhosCognitiveAI.loadFromSupabase();
          }
          // Inicializar Disney Mouth si existe
          if (typeof window.DisneyMouth?.init === 'function') {
            window.DisneyMouth.init();
          }
        }, 500);

        console.log('✅ Marquinhos widget cargado desde marquinhos.html');

      } catch (error) {
        console.error('❌ Error cargando marquinhos.html:', error);
        widget.innerHTML = `
          <div style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; background:rgba(10,25,47,0.8); border-radius:20px; border:2px solid rgba(255,50,50,0.2); color:white; font-size:12px; text-align:center; padding:10px;">
            <div>
              <div style="font-size:40px; margin-bottom:8px;">⚠️</div>
              <div style="font-weight:bold; color:#ff4444;">Error al cargar</div>
              <div style="font-size:10px; opacity:0.5;">${error.message}</div>
            </div>
          </div>
        `;
      }
    }

    // ================================================================
    // 🚀 INICIALIZAR
    // ================================================================

    async function initApp() {
      // Cargar medidas personalizadas
      try {
        const medidas = localStorage.getItem('medidas_personalizadas');
        if (medidas) {
          const medidasData = JSON.parse(medidas);
          for (const [id, data] of Object.entries(medidasData)) {
            if (INVENTARIO_ROPA[id]) {
              INVENTARIO_ROPA[id].top = data.top;
              INVENTARIO_ROPA[id].left = data.left;
              INVENTARIO_ROPA[id].size = data.size;
              INVENTARIO_ROPA[id].rotation = data.rotation || '0deg';
            }
          }
          console.log('📏 Medidas personalizadas cargadas');
        }
      } catch (e) {
        console.warn('⚠️ Error cargando medidas:', e);
      }

      // Cargar widget de Marquinhos desde marquinhos.html
      await cargarMarquinhos();

      renderCatalogo();
      cargarOutfitsGuardados();
      await cargarOutfitGuardado();

      console.log('🛍️ Tienda Marquinhos - Csariel\'s Edition');
      console.log('👕 Items disponibles:', Object.keys(INVENTARIO_ROPA).length);
      console.log('🎅 Gorra y traje de Santa Claus agregados!');
      console.log('🎩 Sombrero de barajas (mago) agregado!');
      console.log('🇲🇽 Sombrero mexicano para el Grito agregado!');
      console.log('💾 Sistema de guardado de outfits activado!');
      console.log('📏 Cada prenda tiene medidas personalizables!');
      console.log('👁️ Vista previa: toca "Vestir" para probar antes de comprar!');
      console.log('🛒 Hook de compra: window.confirmarCompra(itemId) listo!');
      console.log('⚡ Invoca a Marquinhos con el botón especial!');
    }

    // Exponer funciones globales
    window.vestirMarquinhosReal = vestirMarquinhosReal;
    window.invocarMarquinhos = invocarMarquinhos;
    window.mostrarToast = mostrarToast;
    window.renderCatalogo = renderCatalogo;
    window.guardarMedidasPrenda = guardarMedidasPrenda;
    window.guardarOutfitConNombre = guardarOutfitConNombre;
    window.cargarOutfitPorId = cargarOutfitPorId;
    window.eliminarOutfitPorId = eliminarOutfitPorId;
    window.confirmarCompra = confirmarCompra;
    window.mostrarPreview = mostrarPreview;
    window.limpiarPreview = limpiarPreview;
    window.cargarMarquinhos = cargarMarquinhos;

    document.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
