<main style="max-width:1000px;margin:0 auto;padding:15px;animation:fadeIn .4s">
<div style="text-align:center;margin-bottom:16px"><h2 style="font-family:Orbitron;color:var(--gold-cosmic);margin:0">👥 MI RED <span id="redCount" style="background:rgba(247,212,74,.15);border:1px solid rgba(247,212,74,.3);padding:2px 8px;border-radius:10px;font-size:.6rem">0 contactos</span></h2><p style="color:#8ba3c7;font-size:.8rem">Tu comunidad Web3. Gente real de Puebla, no bots.</p></div>

<div style="display:flex;gap:8px;justify-content:center;margin-bottom:14px">
<button onclick="setRedTab('solicitudes')" id="tabSol" class="redTab" style="background:var(--gold-cosmic);color:#000;border:none;padding:6px 14px;border-radius:20px;font-family:Orbitron;font-size:.65rem">🔔 SOLICITUDES <span id="badgeSol" style="background:#ff3366;color:white;padding:1px 5px;border-radius:8px;margin-left:4px">0</span></button>
<button onclick="setRedTab('contactos')" class="redTab" style="background:rgba(255,255,255,.06);border:1px solid rgba(247,212,74,.1);color:#8ba3c7;padding:6px 14px;border-radius:20px;font-family:Orbitron;font-size:.65rem">👥 CONTACTOS</button>
<button onclick="setRedTab('descubrir')" class="redTab" style="background:rgba(255,255,255,.06);border:1px solid rgba(247,212,74,.1);color:#8ba3c7;padding:6px 14px;border-radius:20px;font-family:Orbitron;font-size:.65rem">🌍 DESCUBRIR</button>
</div>

<div style="background:rgba(11,61,46,.25);border:1px solid rgba(247,212,74,.15);border-radius:12px;padding:10px;margin-bottom:14px;display:flex;gap:8px">
<input id="searchRed" placeholder="Buscar por wallet, nombre, @..." style="flex:1;background:rgba(0,0,0,.4);border:1px solid rgba(247,212,74,.15);border-radius:8px;padding:8px;color:white;outline:none;font-size:.8rem" oninput="buscarGente()">
<button onclick="buscarGente()" style="background:rgba(247,212,74,.1);border:1px solid rgba(247,212,74,.2);color:var(--gold-cosmic);padding:6px 12px;border-radius:20px;font-size:.7rem"><i class="fas fa-search"></i></button>
</div>

<div id="redFeed" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px"></div>

<div style="text-align:center;margin-top:20px"><a href="#" data-csariel-page="home" style="color:var(--gold-cosmic);text-decoration:none;font-family:Orbitron;font-size:.8rem"><i class="fas fa-arrow-left"></i> Volver al Inicio</a></div>
</main>

<script>
const R_URL='https://nvyyxgkladjauolvpzfp.supabase.co'; const R_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im52eXl4Z2tsYWRqYXVvbHZwemZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI2NDA3NjMsImV4cCI6MjA5ODIxNjc2M30.3O6tea8l1UbGIlwR_2iyIS1M-dgoQC5G4G1S9YSiXL0';
const sbRed=supabase.createClient(R_URL,R_KEY);
let redTab='solicitudes'; let miWallet=localStorage.getItem('csariels_wallet')||'anon-'+Math.floor(Math.random()*9999);
let solicitudes=JSON.parse(localStorage.getItem('red_solicitudes')||'[]');
let contactos=JSON.parse(localStorage.getItem('red_contactos')||'[]');

function setRedTab(t){
  redTab=t; document.querySelectorAll('.redTab').forEach(b=>{b.style.background='rgba(255,255,255,.06)'; b.style.color='#8ba3c7';});
  const map={solicitudes:'tabSol'}; const btn=document.getElementById(t==='solicitudes'?'tabSol':null);
  if(t==='solicitudes') document.getElementById('tabSol').style.background='var(--gold-cosmic)',document.getElementById('tabSol').style.color='#000';
  renderRed();
}

async function buscarGente(){
  const q=document.getElementById('searchRed').value.toLowerCase();
  renderRed(q);
}

async function renderRed(filtro=''){
  const feed=document.getElementById('redFeed');
  let lista=[];
  if(redTab==='solicitudes'){
    lista=solicitudes;
    if(filtro) lista=lista.filter(u=>u.nombre.toLowerCase().includes(filtro));
    if(lista.length===0){ feed.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:30px;color:#4a6a8a"><i class="fas fa-inbox" style="font-size:2.5rem;display:block;margin-bottom:8px"></i>No tienes solicitudes nuevas.<br><span style="font-size:.7rem">Ve a Descubrir para conectar.</span></div>`; document.getElementById('badgeSol').innerText='0'; return; }
    document.getElementById('badgeSol').innerText=lista.length;
  } else if(redTab==='contactos'){
    lista=contactos;
    if(filtro) lista=lista.filter(u=>u.nombre.toLowerCase().includes(filtro));
  } else {
    // DESCUBRIR - trae de perfiles reales de Supabase + gente cerca
    try{
      const {data}=await sbRed.from('perfiles').select('*').limit(20);
      if(data && data.length>0){
        lista=data.map(p=>({id:p.user_id, nombre:p.nombre||p.username||p.user_id.slice(0,8), wallet:p.user_id, avatar:p.avatar||'👤', bio:p.bio||'Miembro de Csariel\'s OS', distancia:Math.floor(Math.random()*1800)+'m'}));
      } else throw 'no data';
    }catch(e){
      // fallback demo chido de Puebla
      lista=[
        {id:'1',nombre:'Juan Tacos',wallet:'0x123...abc',avatar:'🌮',bio:'Tacos El Güero - Centro',distancia:'120m'},
        {id:'2',nombre:'María Moda',wallet:'0x456...def',avatar:'👗',bio:'Boutique Puebla',distancia:'340m'},
        {id:'3',nombre:'Carlos Web3',wallet:'0x789...ghi',avatar:'🧠',bio:'Dev | Marquinhos fan',distancia:'560m'},
        {id:'4',nombre:'Ana Talacha',wallet:'0xabc...123',avatar:'🔧',bio:'Talachera 24h',distancia:'800m'},
      ];
    }
    if(filtro) lista=lista.filter(u=>u.nombre.toLowerCase().includes(filtro) || u.wallet.toLowerCase().includes(filtro));
    lista=lista.filter(u=>!contactos.find(c=>c.wallet===u.wallet) && u.wallet!==miWallet);
  }

  document.getElementById('redCount').innerText=contactos.length+' contactos';
  feed.innerHTML=lista.map(u=>`
    <div style="background:linear-gradient(180deg,rgba(20,40,50,.7),rgba(5,15,20,.9));border:1px solid rgba(247,212,74,.12);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center">
      <div style="width:48px;height:48px;border-radius:50%;background:#0B3D2E;border:2px solid var(--gold-cosmic);display:flex;align-items:center;justify-content:center;font-size:1.4rem">${u.avatar||'👤'}</div>
      <div style="flex:1"><div style="font-family:Orbitron;font-size:.8rem;color:white">${u.nombre} <span style="font-size:.6rem;color:#00ff88">• ${u.distancia||'cerca'}</span></div><div style="font-size:.7rem;color:#8ba3c7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${u.bio||u.wallet}</div><div style="font-size:.6rem;color:#4a6a8a">${u.wallet.slice(0,10)}...</div></div>
      <div style="display:flex;flex-direction:column;gap:4px">
        ${redTab==='solicitudes'?`<button onclick="aceptarSol('${u.id}')" style="background:#00ff88;color:#000;border:none;padding:5px 10px;border-radius:12px;font-size:.6rem;font-family:Orbitron">ACEPTAR</button><button onclick="rechazarSol('${u.id}')" style="background:rgba(255,51,102,.15);color:#ff6b9d;border:1px solid rgba(255,51,102,.2);padding:4px 10px;border-radius:12px;font-size:.6rem">X</button>`:`<button onclick="enviarSol('${u.wallet}','${u.nombre}')" style="background:var(--gold-cosmic);color:#000;border:none;padding:6px 12px;border-radius:20px;font-size:.65rem;font-family:Orbitron">+ CONECTAR</button><button onclick="abrirChat('${u.wallet}')" style="background:rgba(0,234,255,.1);border:1px solid rgba(0,234,255,.2);color:#00eaff;padding:4px 10px;border-radius:12px;font-size:.6rem">💬</button>`}
      </div>
    </div>
  `).join('');
}

function enviarSol(wallet,nombre){
  if(contactos.find(c=>c.wallet===wallet)) return alert('Ya es tu contacto wey');
  contactos.push({id:Date.now(),nombre,wallet,avatar:'👤',bio:'Contacto Web3'});
  localStorage.setItem('red_contactos',JSON.stringify(contactos));
  alert('✅ Solicitud enviada a '+nombre+'! (Conectado directo en modo Web3)');
  renderRed();
}

function aceptarSol(id){
  const sol=solicitudes.find(s=>s.id==id); if(!sol) return;
  contactos.push(sol); localStorage.setItem('red_contactos',JSON.stringify(contactos));
  solicitudes=solicitudes.filter(s=>s.id!=id); localStorage.setItem('red_solicitudes',JSON.stringify(solicitudes));
  renderRed();
}

function rechazarSol(id){ solicitudes=solicitudes.filter(s=>s.id!=id); localStorage.setItem('red_solicitudes',JSON.stringify(solicitudes)); renderRed(); }

function abrirChat(wallet){ if(window.marquinhosUI) { window.marquinhosUI.toggleVentana(); } alert('💬 Chat con '+wallet.slice(0,8)+'... Abre Marquinhos para chatear Web3'); }

// simula solicitudes que llegan
if(solicitudes.length===0){
  solicitudes=[{id:101,nombre:'Juan Pérez',wallet:'0xJUAN...123',avatar:'🧢',bio:'Quiere conectarse contigo - Puebla Centro',distancia:'200m'},{id:102,nombre:'María López',wallet:'0xMARIA...456',avatar:'💅',bio:'Te envió solicitud - Boutique',distancia:'450m'}];
  localStorage.setItem('red_solicitudes',JSON.stringify(solicitudes));
}

renderRed();
</script>
<style>@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}</style>
