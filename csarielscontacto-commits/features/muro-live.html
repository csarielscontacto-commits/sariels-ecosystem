<!-- MURO LIVE - WINDOWS DE PUEBLA - LIVE REAL -->
<main style="max-width:900px;margin:0 auto;padding:15px;animation:fadeIn.4s">
<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px">
<div><h2 style="font-family:Orbitron;color:var(--gold-cosmic);margin:0">📱 MURO LIVE <span style="background:#ff0033;color:white;padding:2px 8px;border-radius:8px;font-size:.6rem;animation:pulse 1s infinite">● LIVE</span></h2><p style="color:#8ba3c7;font-size:.8rem;margin:4px 0">Tu feed, tus reglas. Transmite sin censura.</p></div>
<button onclick="iniciarLive()" style="background:linear-gradient(135deg,#ff0033,#b8001f);color:white;border:none;padding:8px 16px;border-radius:20px;font-family:Orbitron;font-weight:700;font-size:.7rem;cursor:pointer;box-shadow:0 0 20px rgba(255,0,51,.4)">🔴 TRANSMITIR</button>
</div>

<!-- CREAR POST -->
<div style="background:linear-gradient(180deg,rgba(20,40,50,.7),rgba(5,15,20,.9));border:1px solid rgba(247,212,74,.15);border-radius:16px;padding:12px;margin-bottom:14px">
<div style="display:flex;gap:10px"><div style="width:38px;height:38px;border-radius:50%;background:#0B3D2E;border:1px solid var(--gold-cosmic);display:flex;align-items:center;justify-content:center">👤</div><textarea id="liveText" placeholder="¿Qué está pasando en Puebla hoy? Foto, video, link..." style="flex:1;background:rgba(0,0,0,.4);border:1px solid rgba(247,212,74,.1);border-radius:12px;padding:10px;color:white;min-height:60px;outline:none;resize:none"></textarea></div>
<div id="livePreview" style="display:none;margin-top:10px;position:relative"><video id="previewVideo" controls style="width:100%;border-radius:10px;max-height:300px;background:#000"></video><img id="previewImgLive" style="width:100%;border-radius:10px;max-height:350px;object-fit:contain;background:#000;display:none"><button onclick="clearLiveMedia()" style="position:absolute;top:6px;right:6px;background:rgba(0,0,0,.7);color:white;border:none;border-radius:50%;width:28px;height:28px">X</button></div>
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;flex-wrap:wrap;gap:8px">
<div style="display:flex;gap:8px"><label style="background:rgba(247,212,74,.1);border:1px solid rgba(247,212,74,.2);padding:5px 12px;border-radius:20px;font-size:.7rem;cursor:pointer;color:var(--gold-cosmic)"><i class="fas fa-image"></i> FOTO<input type="file" id="liveImage" accept="image/*" hidden></label><label style="background:rgba(0,234,255,.1);border:1px solid rgba(0,234,255,.2);padding:5px 12px;border-radius:20px;font-size:.7rem;cursor:pointer;color:#00eaff"><i class="fas fa-video"></i> VIDEO<input type="file" id="liveVideoFile" accept="video/*" hidden></label><button onclick="document.getElementById('liveLink').style.display='block'" style="background:rgba(168,85,247,.1);border:1px solid rgba(168,85,247,.2);padding:5px 12px;border-radius:20px;font-size:.7rem;color:#a855f7"><i class="fas fa-link"></i> LINK</button></div>
<button onclick="publicarLive()" style="background:var(--gold-cosmic);color:#000;border:none;padding:7px 18px;border-radius:20px;font-family:Orbitron;font-weight:700;font-size:.7rem">📤 PUBLICAR</button>
</div>
<input id="liveLink" placeholder="https://..." style="display:none;width:100%;margin-top:8px;background:rgba(0,0,0,.4);border:1px solid rgba(168,85,247,.2);border-radius:8px;padding:8px;color:white;font-size:.8rem">
<div id="liveStatus" style="font-size:.7rem;color:#00ff88;margin-top:6px;text-align:center"></div>
</div>

<!-- LIVE ACTIVO -->
<div id="liveActive" style="display:none;background:#000;border:2px solid #ff0033;border-radius:16px;padding:0;overflow:hidden;margin-bottom:14px"><div style="background:#ff0033;color:white;padding:6px 12px;display:flex;justify-content:space-between;font-family:Orbitron;font-size:.7rem"><span>🔴 EN VIVO - 0 espectadores</span><button onclick="detenerLive()" style="background:white;color:#ff0033;border:none;padding:2px 10px;border-radius:10px;font-size:.6rem;font-weight:700">DETENER</button></div><video id="liveCam" autoplay muted playsinline style="width:100%;height:300px;object-fit:cover;background:#000"></video></div>

<!-- FEED -->
<div id="liveFeed" style="display:flex;flex-direction:column;gap:12px"></div>

<div style="text-align:center;margin-top:20px"><a href="#" data-csariel-page="home" style="color:var(--gold-cosmic);text-decoration:none;font-family:Orbitron;font-size:.8rem"><i class="fas fa-arrow-left"></i> Volver al Inicio</a></div>
</main>

<script>
const L_URL='https://nvyyxgkladjauolvpzfp.supabase.co'; const L_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im52eXl4Z2tsYWRqYXVvbHZwemZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI2NDA3NjMsImV4cCI6MjA5ODIxNjc2M30.3O6tea8l1UbGIlwR_2iyIS1M-dgoQC5G4G1S9YSiXL0';
const sbLive=supabase.createClient(L_URL,L_KEY);
let liveMedia=null, liveType=null, liveStream=null;

document.getElementById('liveImage').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return; liveType='image';
  const r=new FileReader(); r.onload=ev=>{ liveMedia=ev.target.result; document.getElementById('previewImgLive').src=liveMedia; document.getElementById('previewImgLive').style.display='block'; document.getElementById('previewVideo').style.display='none'; document.getElementById('livePreview').style.display='block'; }; r.readAsDataURL(f);
});
document.getElementById('liveVideoFile').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return; liveType='video';
  const r=new FileReader(); r.onload=ev=>{ liveMedia=ev.target.result; document.getElementById('previewVideo').src=liveMedia; document.getElementById('previewVideo').style.display='block'; document.getElementById('previewImgLive').style.display='none'; document.getElementById('livePreview').style.display='block'; }; r.readAsDataURL(f);
});
function clearLiveMedia(){ liveMedia=null; liveType=null; document.getElementById('livePreview').style.display='none'; }

async function iniciarLive(){
  try{
    liveStream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});
    document.getElementById('liveCam').srcObject=liveStream;
    document.getElementById('liveActive').style.display='block';
    document.getElementById('liveActive').scrollIntoView({behavior:'smooth'});
  }catch(e){ alert('Necesitas dar permiso a cámara y micro wey: '+e.message); }
}
function detenerLive(){ if(liveStream){ liveStream.getTracks().forEach(t=>t.stop()); } document.getElementById('liveActive').style.display='none'; }

async function publicarLive(){
  const texto=document.getElementById('liveText').value.trim();
  const link=document.getElementById('liveLink').value.trim();
  const status=document.getElementById('liveStatus');
  if(!texto &&!liveMedia &&!link) return status.innerText='⚠️ Escribe algo o sube foto/video';
  status.innerText='⏳ Publicando en Supabase...';
  const wallet=localStorage.getItem('csariels_wallet')||'anon';
  const payload={texto, author:wallet.slice(0,8), wallet, imagen_url: liveMedia? liveMedia.slice(0,100)+'...[base64]' : null, extra:{link, type:liveType||'text', live:!!liveStream}};

  try{
    // Intenta guardar en tabla live_posts, si no existe usa memes como fallback
    let {error}=await sbLive.from('live_posts').insert([{texto, author:payload.author, wallet, imagen_url:liveMedia, extra:payload.extra}]);
    if(error && error.message.includes('does not exist')){
      await sbLive.from('memes').insert([{texto: '[LIVE] '+texto, author:payload.author, wallet, imagen_url:liveMedia, nsfw:false}]);
    }
    status.innerText='✅ ¡Publicado en Muro Live!';
    document.getElementById('liveText').value=''; document.getElementById('liveLink').value=''; clearLiveMedia();
    setTimeout(()=>status.innerText='',2000);
    cargarLive();
  }catch(e){ status.innerText='❌ Error: '+e.message; }
}

async function cargarLive(){
  const feed=document.getElementById('liveFeed');
  try{
    let {data}=await sbLive.from('live_posts').select('*').order('created_at',{ascending:false}).limit(30);
    if(!data || data.length===0){ const r=await sbLive.from('memes').select('*').order('created_at',{ascending:false}).limit(30); data=r.data||[]; }
    if(!data || data.length===0){ feed.innerHTML=`<div style="text-align:center;padding:30px;color:#4a6a8a"><i class="fas fa-satellite-dish" style="font-size:3rem;display:block;margin-bottom:10px"></i>Aún no hay lives.<br>¡Sé el primero en transmitir!</div>`; return; }
    feed.innerHTML=data.map(p=>`
      <div style="background:linear-gradient(180deg,rgba(20,40,50,.7),rgba(5,15,20,.9));border:1px solid rgba(247,212,74,.12);border-radius:14px;padding:12px">
        <div style="display:flex;justify-content:space-between;align-items:center"><span style="font-family:Orbitron;font-size:.75rem;color:white">👤 ${p.author||'Anónimo'} ${p.extra?.live?'🔴 LIVE':''}</span><span style="font-size:.6rem;color:#4a6a8a">${new Date(p.created_at).toLocaleString()}</span></div>
        ${p.texto?`<div style="color:#e8f0f8;margin:8px 0;font-size:.9rem;white-space:pre-wrap">${p.texto}</div>`:''}
        ${p.imagen_url && p.imagen_url.startsWith('data:')?`<img src="${p.imagen_url}" style="width:100%;border-radius:10px;max-height:400px;object-fit:contain;background:#000">`:''}
        ${p.extra?.link?`<a href="${p.extra.link}" target="_blank" style="display:block;margin-top:6px;background:rgba(168,85,247,.15);border:1px solid rgba(168,85,247,.3);padding:8px;border-radius:8px;color:#a855f7;text-decoration:none;font-size:.8rem">🔗 ${p.extra.link}</a>`:''}
        <div style="display:flex;gap:14px;margin-top:10px;font-size:.8rem;color:#8ba3c7"><span onclick="this.innerText='❤️ '+(parseInt(this.innerText.split(' ')[1]||0)+1)" style="cursor:pointer">❤️ ${p.likes||0} Like</span><span style="cursor:pointer">💬 Comentar</span><span onclick="propina('${p.wallet}')" style="cursor:pointer;color:#f7d44a">💰 Propina TOK</span><span style="margin-left:auto;cursor:pointer" onclick="navigator.share?navigator.share({text:'${(p.texto||'').slice(0,30)}'}):alert('Copiado')">↗️</span></div>
      </div>`).join('');
  }catch(e){ feed.innerHTML='Error cargando feed: '+e.message; }
}

function propina(w){ const cant=prompt('¿Cuántos TOK le das de propina a '+w.slice(0,8)+'?', '10'); if(cant){ alert('💸 Propina de '+cant+' TOK enviada! (usa procesar_transaccion_commit)'); } }

cargarLive();
sbLive.channel('live-feed').on('postgres_changes',{event:'INSERT',schema:'public',table:'live_posts'},()=>cargarLive()).subscribe();
setInterval(cargarLive,8000);
</script>
<style>@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}</style>
