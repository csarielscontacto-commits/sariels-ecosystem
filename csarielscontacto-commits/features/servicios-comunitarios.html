<!-- SERVICIOS COMUNITARIOS - WINDOWS DE PUEBLA - MAPA REAL -->
<main style="max-width:1100px;margin:0 auto;padding:15px;animation:fadeIn .4s">
<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px">
<div><h2 style="font-family:Orbitron;color:var(--gold-cosmic);margin:0">🔧 SERVICIOS COMUNITARIOS <span style="background:#00ff88;color:#000;padding:2px 8px;border-radius:8px;font-size:.55rem">MAPA REAL</span></h2><p style="color:#8ba3c7;font-size:.8rem;margin:4px 0">Talacheros, mecánicos, plomeros cerca de ti. Pide y paga con CMT.</p></div>
<button onclick="centrarGPS()" style="background:rgba(0,234,255,.1);border:1px solid rgba(0,234,255,.3);color:#00eaff;padding:6px 14px;border-radius:20px;font-size:.7rem;font-family:Orbitron">📍 CERCA DE MÍ</button>
</div>

<div style="display:grid;grid-template-columns:1fr 340px;gap:12px">
<!-- MAPA + FILTROS -->
<div>
<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">
<button onclick="filtrarServ('todos')" class="fServ active" style="background:var(--gold-cosmic);color:#000;border:none;padding:5px 12px;border-radius:20px;font-size:.65rem;font-family:Orbitron">TODOS</button>
<button onclick="filtrarServ('mecanico')" class="fServ" style="background:rgba(255,255,255,.06);border:1px solid rgba(247,212,74,.1);color:#8ba3c7;padding:5px 12px;border-radius:20px;font-size:.65rem">🔧 MECÁNICO</button>
<button onclick="filtrarServ('plomeria')" class="fServ" style="background:rgba(255,255,255,.06);border:1px solid rgba(247,212,74,.1);color:#8ba3c7;padding:5px 12px;border-radius:20px;font-size:.65rem">🚿 PLOMERO</button>
<button onclick="filtrarServ('electricista')" class="fServ" style="background:rgba(255,255,255,.06);border:1px solid rgba(247,212,74,.1);color:#8ba3c7;padding:5px 12px;border-radius:20px;font-size:.65rem">⚡ ELÉCTRICO</button>
<button onclick="filtrarServ('talachero')" class="fServ" style="background:rgba(255,255,255,.06);border:1px solid rgba(247,212,74,.1);color:#8ba3c7;padding:5px 12px;border-radius:20px;font-size:.65rem">🛞 TALACHERO</button>
</div>
<div id="mapServicios" style="width:100%;height:420px;border-radius:16px;border:1px solid rgba(247,212,74,.2);background:#0a1a15"></div>
<div style="margin-top:8px;display:flex;gap:8px"><input id="buscarServ" placeholder="Buscar: talachero 24h, plomero barato..." style="flex:1;background:rgba(0,0,0,.4);border:1px solid rgba(247,212,74,.15);border-radius:8px;padding:8px;color:white;font-size:.8rem;outline:none" oninput="buscarServicios()"><button onclick="agregarServicio()" style="background:var(--gold-cosmic);color:#000;border:none;padding:6px 14px;border-radius:20px;font-family:Orbitron;font-size:.65rem">+ AGREGAR MI NEGOCIO</button></div>
</div>

<!-- LISTA -->
<div style="background:linear-gradient(180deg,rgba(20,40,50,.7),rgba(5,15,20,.9));border:1px solid rgba(247,212,74,.15);border-radius:16px;padding:12px;max-height:500px;overflow-y:auto">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span style="font-family:Orbitron;font-size:.7rem;color:var(--gold-cosmic)">CERCA DE TI</span><span id="servCount" style="font-size:.6rem;color:#4a6a8a">0 servicios</span></div>
<div id="listaServicios" style="display:flex;flex-direction:column;gap:8px"></div>
</div>
</div>

<div style="text-align:center;margin-top:18px"><a href="#" data-csariel-page="home" style="color:var(--gold-cosmic);text-decoration:none;font-family:Orbitron;font-size:.8rem"><i class="fas fa-arrow-left"></i> Volver al Inicio</a></div>
</main>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const S_URL='https://nvyyxgkladjauolvpzfp.supabase.co'; const S_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im52eXl4Z2tsYWRqYXVvbHZwemZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI2NDA3NjMsImV4cCI6MjA5ODIxNjc2M30.3O6tea8l1UbGIlwR_2iyIS1M-dgoQC5G4G1S9YSiXL0';
const sbServ=supabase.createClient(S_URL,S_KEY);
let map=null, markers=[], userPos=null, filtroActual='todos', todosServicios=[];

async function initMapaServ(){
  map=L.map('mapServicios').setView([19.0414,-98.2063],14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OSM'}).addTo(map);
  centrarGPS(); cargarServicios();
}
function centrarGPS(){
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(async pos=>{
      userPos={lat:pos.coords.latitude,lng:pos.coords.longitude};
      map.setView([userPos.lat,userPos.lng],15);
      L.marker([userPos.lat,userPos.lng],{icon:L.divIcon({html:'📍',className:'',iconSize:[30,30]})}).addTo(map).bindPopup('Tú estás aquí');
      cargarServicios(userPos.lat,userPos.lng);
    },()=>{ cargarServicios(); });
  } else cargarServicios();
}
async function cargarServicios(lat,lng){
  try{
    let data;
    if(lat&&lng){
      const {data:d,error}=await sbServ.rpc('get_nearby_services',{lat, lng, radius_km:5});
      if(error) throw error; data=d;
    } else {
      const {data:d,error}=await sbServ.from('service_points').select('*').limit(50);
      if(error) throw error; data=d;
    }
    if(!data||data.length===0){
      data=[
        {id:1,name:'Talachero El Güero 24h',category:'talachero',lat:19.042,lng:-98.205,rating:4.8,phone:'222-123-4567',price:'Desde 80 CMT'},
        {id:2,name:'Mecánico Don Lalo',category:'mecanico',lat:19.045,lng:-98.208,rating:4.9,phone:'222-987-6543',price:'Desde 150 CMT'},
        {id:3,name:'Plomería Express',category:'plomeria',lat:19.039,lng:-98.202,rating:4.7,phone:'222-456-7890',price:'Desde 100 CMT'},
      ];
    }
    todosServicios=data; renderServicios();
  }catch(e){
    document.getElementById('listaServicios').innerHTML='Error: '+e.message;
  }
}
function renderServicios(){
  const lista=document.getElementById('listaServicios');
  const q=document.getElementById('buscarServ').value.toLowerCase();
  let filtrados=todosServicios.filter(s=>{
    const matchCat=filtroActual==='todos'|| (s.category||'').toLowerCase().includes(filtroActual);
    const matchQ=!q|| (s.name||'').toLowerCase().includes(q) || (s.category||'').toLowerCase().includes(q);
    return matchCat && matchQ;
  });
  document.getElementById('servCount').innerText=filtrados.length+' servicios';
  markers.forEach(m=>map.removeLayer(m)); markers=[];
  lista.innerHTML=filtrados.map(s=>{
    const lat=s.lat||s.latitude; const lng=s.lng||s.longitude;
    if(lat&&lng){
      const mk=L.marker([lat,lng]).addTo(map).bindPopup(`<b>${s.name}</b><br>${s.category}<br>${s.price||''}`);
      markers.push(mk);
    }
    return `<div style="background:rgba(0,0,0,.3);border:1px solid rgba(247,212,74,.1);border-radius:10px;padding:10px">
      <div style="display:flex;justify-content:space-between"><b style="color:white;font-size:.85rem">${s.name||s.nombre}</b><span style="font-size:.7rem;color:#00ff88">★ ${s.rating||'4.5'}</span></div>
      <div style="font-size:.7rem;color:#8ba3c7;margin:4px 0">🔧 ${s.category||s.categoria} • 📍 ${s.distance_m?Math.round(s.distance_m)+'m': 'cerca'} • 💰 ${s.price||'Desde 100 CMT'}</div>
      <div style="display:flex;gap:6px;margin-top:6px"><button onclick="pedirServicio('${s.id}','${s.name}')" style="flex:1;background:var(--gold-cosmic);color:#000;border:none;padding:5px;border-radius:12px;font-size:.65rem;font-family:Orbitron">PEDIR</button><a href="tel:${s.phone||''}" style="background:rgba(0,234,255,.1);border:1px solid rgba(0,234,255,.2);color:#00eaff;padding:5px 10px;border-radius:12px;font-size:.65rem;text-decoration:none;text-align:center">📞</a><button onclick="verEnMapa(${lat},${lng})" style="background:rgba(255,255,255,.06);border:1px solid rgba(247,212,74,.1);color:#8ba3c7;padding:5px 10px;border-radius:12px;font-size:.65rem">🗺️</button></div>
    </div>`;
  }).join('');
  if(filtrados.length===0) lista.innerHTML=`<div style="text-align:center;padding:20px;color:#4a6a8a">No hay ${filtroActual} cerca.<br><button onclick="agregarServicio()" style="margin-top:8px;background:var(--gold-cosmic);color:#000;border:none;padding:6px 12px;border-radius:20px;font-size:.7rem">¡Sé el primero!</button></div>`;
}
function filtrarServ(cat){
  filtroActual=cat; document.querySelectorAll('.fServ').forEach(b=>{b.style.background='rgba(255,255,255,.06)'; b.style.color='#8ba3c7';});
  event.target.style.background='var(--gold-cosmic)'; event.target.style.color='#000';
  renderServicios();
}
function buscarServicios(){ renderServicios(); }
function verEnMapa(lat,lng){ if(lat&&lng) map.setView([lat,lng],16); }
async function pedirServicio(id,nombre){
  const wallet=localStorage.getItem('csariels_wallet')||'anon';
  if(confirm(`¿Pedir servicio a ${nombre}? Se cobrará 50 CMT de anticipo.`)){
    try{ await sbServ.rpc('procesar_transaccion_commit',{p_user_id:wallet,p_tipo:'pago_servicio',p_monto:50,p_moneda:'CMT',p_detalle:{servicio_id:id, nombre}}); alert('✅ Pedido enviado a '+nombre+'! Te contactará en minutos. 50 CMT descontados.'); }catch(e){ alert('✅ Pedido simulado a '+nombre+' (sin saldo). Te contactará pronto.'); }
  }
}
async function agregarServicio(){
  const nombre=prompt('Nombre de tu negocio:'); if(!nombre) return;
  const cat=prompt('Categoría (mecanico, plomeria, electricista, talachero):','mecanico');
  const tel=prompt('WhatsApp:','55...');
  if(!userPos){ alert('Activa GPS primero wey'); return; }
  try{
    const {error}=await sbServ.from('service_points').insert([{name:nombre, category:cat, lat:userPos.lat, lng:userPos.lng, phone:tel, rating:5}]);
    if(error) throw error;
    alert('✅ ¡Tu negocio ya está en el mapa!'); cargarServicios(userPos.lat,userPos.lng);
  }catch(e){ alert('Error: '+e.message); }
}
setTimeout(initMapaServ,400);
</script>
<style>@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}</style>
