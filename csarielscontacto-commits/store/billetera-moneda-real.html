<main style="padding:20px; animation: fadeIn 0.5s ease; max-width: 400px; margin: 0 auto;">

                ◈
            </div>
            <div>
                <b style="display:block; letter-spacing:2px; color:var(--gold-cosmic); font-family:'Orbitron', monospace;">BILLETERA</b>
                <span style="font-size:.7rem; color:var(--text-muted);">Moneda del Ecosistema</span>
            </div>
        </div>
    </div>

    <div style="background:linear-gradient(145deg, rgba(11,61,46,0.8), rgba(5,8,15,0.9)); border:1.5px solid var(--gold-cosmic); border-radius:22px; padding:20px; box-shadow:0 0 50px rgba(247,212,74,0.12); position:relative;">
        <div style="display:flex; align-items:center; gap:10px; margin-bottom:22px; color:var(--gold-cosmic); font-weight:700; letter-spacing:1px; font-size:.9rem;">

                ◈
            </div>
            SALDO CMT
        </div>
        <div style="font-size:2.4rem; font-weight:800; letter-spacing:-1px; color:var(--gold-cosmic);">

    <div style="display:flex; gap:10px; margin-top:20px;">

            <div style="width:40px; height:40px; border-radius:50%; background:rgba(247,212,74,0.12); border:1px solid rgba(247,212,74,0.25); display:grid; place-items:center; color:var(--gold-cosmic);">🛒</div>
            <div><b style="font-size:.9rem; display:block; color:var(--text-primary);">Compra en Tienda</b><span style="font-size:.7rem; color:var(--text-muted);">Hoy • 14:32</span></div>

            <div style="width:40px; height:40px; border-radius:50%; background:rgba(46,228,138,0.12); border:1px solid rgba(46,228,138,0.25); display:grid; place-items:center; color:#2ee48a;">💳</div>
            <div><b style="font-size:.9rem; display:block; color:var(--text-primary);">Recarga (Admin)</b><span style="font-size:.7rem; color:var(--text-muted);">Ayer • 18:05</span></div>
            <div style="margin-left:auto; color:#2ee48a; font-weight:700;">+50.00 CMT</div>
        </div>

    <div style="text-align:center; margin-top:20px;">
        <a href="#" data-csariel-page="home" style="color:var(--gold-cosmic); text-decoration:none; font-family:'Orbitron', monospace; font-size:0.9rem;">
            <i class="fas fa-arrow-left"></i> Volver al Inicio
        </a>

    @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
