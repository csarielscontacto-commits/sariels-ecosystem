<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>◈ Csariel's | Red Social Integral</title>
  <meta name="description" content="Red Social Integral con IA, eSIM y Web3" />
  <meta name="theme-color" content="#0B3D2E" />
  
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com https://*.supabase.co https://*.polygon.technology https://cdn.tailwindcss.com https://unpkg.com;
    style-src 'self' https://cdnjs.cloudflare.com https://fonts.googleapis.com https://cdn.tailwindcss.com 'unsafe-inline';
    font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;
    img-src 'self' data: https://*;
    connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.polygon.technology;
    frame-src 'self';
    media-src 'self';
    object-src 'none';
    base-uri 'self';
    form-action 'self';
  ">
  
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet" />
  
  <script src="https://unpkg.com/i18next@21.8.13/dist/umd/i18next.min.js"></script>
  <script src="https://unpkg.com/react-i18next@12.2.0/dist/umd/react-i18next.min.js"></script>
  <script src="./js/security.js"></script>
  
  <style>
    :root { --space-deep: #05080f; --space-mid: #0a1428; --space-light: #101f3a; --verde-bosque: #0B3D2E; --verde-bosque-light: #1a5a44; --verde-bosque-glass: rgba(11,61,46,0.85); --gold-cosmic: #f7d44a; --gold-dim: rgba(247,212,74,0.15); --gold-glow: rgba(247,212,74,0.25); --nebula-1: #6c2bd9; --nebula-2: #ff6b9d; --nebula-3: #00d4ff; --plasma: #ff3366; --quantum: #00e5ff; --text-primary: #e8f0f8; --text-secondary: #8ba3c7; --text-muted: #4a6a8a; --border: rgba(247,212,74,0.08); --border-glow: rgba(247,212,74,0.25); --shadow-neon: 0 0 40px rgba(247,212,74,0.08); --shadow-glow: 0 0 60px rgba(11,61,46,0.3); --radius: 20px; --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); --success: #00b894; --warning: #f7d44a; --danger: #ff3366; --emerald-green: #00d68f; }

    .lang-selector { display: flex; align-items: center; gap: 6px; background: rgba(0,0,0,0.2); border: 1px solid var(--gold-dim); border-radius: 20px; padding: 4px 10px; }
    .lang-btn { background: none; border: none; color: var(--text-muted); font-size: 1rem; cursor: pointer; transition: var(--transition); padding: 2px 4px; font-family: 'Space Grotesk', sans-serif; border-radius: 4px; }
    .lang-btn:hover { color: var(--gold-cosmic); transform: scale(1.1); }
    .lang-btn.active { color: var(--gold-cosmic); background: rgba(247,212,74,0.1); border: 1px solid rgba(247,212,74,0.2); }

    .wallet-status { display: flex; align-items: center; gap: 8px; padding: 4px 12px; background: rgba(0,0,0,0.2); border-radius: 8px; border: 1px solid var(--gold-dim); font-size: 0.55rem; cursor: pointer; transition: var(--transition); }
    .wallet-status:hover { border-color: var(--border-glow); }
    .wallet-status .wallet-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .wallet-status .wallet-dot.online { background: var(--success); box-shadow: 0 0 10px rgba(0,184,148,0.3); }
    .wallet-status .wallet-dot.offline { background: var(--text-muted); }
    .wallet-status .wallet-dot.loading { background: var(--warning); animation: pulse-glow 1s ease-in-out infinite; }
    .wallet-status .wallet-dot.metamask { background: #f6851b; box-shadow: 0 0 15px rgba(246,133,27,0.4); }
    .wallet-status .wallet-text { color: var(--text-secondary); font-family: 'Orbitron', monospace; font-size: 0.5rem; }
    .wallet-status .btn-conectar-wallet { background: none; border: 1px solid var(--gold-cosmic); color: var(--gold-cosmic); padding: 2px 8px; border-radius: 12px; font-size: 0.45rem; cursor: pointer; font-family: 'Orbitron', monospace; transition: var(--transition); }
    .wallet-status .btn-conectar-wallet:hover { background: rgba(247,212,74,0.1); }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { background: var(--space-deep); color: var(--text-primary); font-family: 'Space Grotesk', 'Inter', system-ui, sans-serif; line-height: 1.6; min-height: 100vh; overflow-x: hidden; position: relative; }
    #stars-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
    .nebula { position: fixed; border-radius: 50%; filter: blur(120px); opacity: 0.10; pointer-events: none; z-index: 0; animation: nebula-drift 25s ease-in-out infinite alternate; }
    .nebula-1 { width: 700px; height: 700px; background: var(--verde-bosque); top: -15%; right: -15%; }
    .nebula-2 { width: 600px; height: 600px; background: var(--gold-cosmic); bottom: -15%; left: -15%; animation-delay: -8s; opacity: 0.05; }
    .nebula-3 { width: 500px; height: 500px; background: var(--nebula-3); top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: -15s; opacity: 0.04; }
    @keyframes nebula-drift { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(40px, -30px) scale(1.15); } }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--space-deep); }
    ::-webkit-scrollbar-thumb { background: linear-gradient(var(--gold-cosmic), var(--verde-bosque)); border-radius: 3px; }

    .app { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 20px 24px 40px; }
    .header { display: flex; justify-content: space-between; align-items: center; padding: 16px 0 20px; border-bottom: 2px solid var(--gold-dim); margin-bottom: 28px; flex-wrap: wrap; gap: 12px; backdrop-filter: blur(10px); position: relative; }
    .header::after { content: ''; position: absolute; bottom: -2px; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--gold-cosmic), var(--verde-bosque), var(--gold-cosmic), transparent); opacity: 0.4; }
    .logo { display: flex; align-items: center; gap: 14px; text-decoration: none; }
    .logo-icon { font-size: 2.4rem; filter: drop-shadow(0 0 20px rgba(247,212,74,0.2)); animation: pulse-glow 3s ease-in-out infinite; }
    .logo-icon .hex { display: inline-block; background: var(--verde-bosque); color: var(--gold-cosmic); padding: 4px 12px; border-radius: 8px; font-size: 1.2rem; font-weight: 900; border: 2px solid var(--gold-cosmic); box-shadow: 0 0 30px rgba(247,212,74,0.1); font-family: 'Orbitron', monospace; }
    @keyframes pulse-glow { 0%, 100% { filter: drop-shadow(0 0 20px rgba(247,212,74,0.2)); } 50% { filter: drop-shadow(0 0 40px rgba(247,212,74,0.4)); } }
    .logo-text { font-family: 'Orbitron', monospace; font-size: 1.6rem; font-weight: 900; letter-spacing: 2px; background: linear-gradient(135deg, var(--gold-cosmic), var(--verde-bosque-light)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 40px rgba(247,212,74,0.15); }
    .logo-badge { font-family: 'Orbitron', monospace; font-size: 0.5rem; background: linear-gradient(135deg, var(--verde-bosque), var(--gold-cosmic)); color: white; padding: 4px 14px; border-radius: 20px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; -webkit-text-fill-color: white; box-shadow: 0 0 30px rgba(11,61,46,0.3); animation: badge-pulse 2s ease-in-out infinite; border: 1px solid rgba(247,212,74,0.2); }
    @keyframes badge-pulse { 0%, 100% { box-shadow: 0 0 30px rgba(11,61,46,0.3); } 50% { box-shadow: 0 0 60px rgba(247,212,74,0.2); } }
    .header-actions { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .status-badge { display: flex; align-items: center; gap: 8px; background: rgba(247,212,74,0.06); border: 1px solid rgba(247,212,74,0.15); padding: 8px 18px; border-radius: 30px; font-size: 0.65rem; color: var(--gold-cosmic); font-family: 'Orbitron', monospace; letter-spacing: 1px; backdrop-filter: blur(10px); }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; animation: quantum-pulse 1.5s ease-in-out infinite; }
    .status-dot.online { background: var(--success); box-shadow: 0 0 20px rgba(0,184,148,0.5); }
    .status-dot.offline { background: var(--text-muted); box-shadow: 0 0 20px rgba(74,106,138,0.3); }
    @keyframes quantum-pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.7); } }

    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; border: 1px solid var(--border); border-radius: 30px; background: rgba(247,212,74,0.03); color: var(--text-primary); font-family: 'Orbitron', monospace; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.5px; cursor: pointer; transition: var(--transition); text-decoration: none; }
    .btn:hover { transform: scale(1.03); border-color: var(--border-glow); }
    .btn-primary { background: linear-gradient(135deg, var(--verde-bosque), var(--verde-bosque-light)); border-color: var(--gold-cosmic); color: var(--gold-cosmic); -webkit-text-fill-color: var(--gold-cosmic); }
    .btn-primary:hover { background: linear-gradient(135deg, var(--verde-bosque-light), var(--verde-bosque)); box-shadow: 0 0 40px rgba(11,61,46,0.5); }
    .btn-gold { background: linear-gradient(135deg, var(--gold-cosmic), #b8923a); border-color: transparent; color: #0a0c10; -webkit-text-fill-color: #0a0c10; }
    .btn-gold:hover { box-shadow: 0 0 40px rgba(247,212,74,0.3); }
    .btn-internet { background: linear-gradient(135deg, var(--gold-cosmic), var(--emerald-green)); border-color: transparent; color: #0a0c10; -webkit-text-fill-color: #0a0c10; box-shadow: 0 0 20px rgba(0, 214, 143, 0.2); }
    .btn-internet:hover { box-shadow: 0 0 40px rgba(0, 214, 143, 0.4); }
    .btn-success { background: linear-gradient(135deg, #00b894, #00897b); border-color: transparent; color: white; -webkit-text-fill-color: white; }
    .btn-success:hover { background: linear-gradient(135deg, #00897b, #00695c); box-shadow: 0 0 40px rgba(0,184,148,0.3); }
    .btn-outline { border-color: var(--border); background: transparent; }
    .btn-outline:hover { background: rgba(247,212,74,0.05); border-color: var(--gold-cosmic); }
    .btn-sm { padding: 6px 14px; font-size: 0.6rem; }
    .btn-danger { background: rgba(255,51,102,0.15); border-color: rgba(255,51,102,0.3); color: var(--danger); }
    .btn-danger:hover { background: rgba(255,51,102,0.25); }

    .hero { background: linear-gradient(145deg, rgba(11,61,46,0.2), rgba(247,212,74,0.04)); border: 1px solid var(--gold-dim); border-radius: var(--radius); padding: 32px 40px; margin-bottom: 28px; position: relative; overflow: hidden; backdrop-filter: blur(10px); text-align: center; }
    .hero::before { content: ''; position: absolute; top: -50%; right: -20%; width: 600px; height: 600px; background: radial-gradient(circle, rgba(247,212,74,0.04) 0%, transparent 70%); border-radius: 50%; pointer-events: none; animation: hero-glow 8s ease-in-out infinite alternate; }
    @keyframes hero-glow { 0% { transform: translate(0, 0) scale(1); opacity: 0.5; } 100% { transform: translate(-50px, 30px) scale(1.5); opacity: 1; } }
    .hero-content { position: relative; z-index: 1; }
    .hero-title { font-family: 'Orbitron', monospace; font-size: 2.5rem; font-weight: 900; letter-spacing: -1px; margin-bottom: 8px; background: linear-gradient(135deg, var(--text-primary), var(--gold-cosmic), var(--verde-bosque-light)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 60px rgba(247,212,74,0.15); }
    .hero-title .highlight { background: linear-gradient(135deg, var(--gold-cosmic), var(--verde-bosque)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 40px rgba(247,212,74,0.3); }
    .hero-sub { font-size: 1.1rem; color: var(--text-secondary); max-width: 700px; margin: 0 auto 16px; letter-spacing: 0.5px; }
    .hero-metrics { display: flex; gap: 40px; justify-content: center; flex-wrap: wrap; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--gold-dim); }
    .metric { display: flex; flex-direction: column; align-items: center; }
    .metric .number { font-family: 'Orbitron', monospace; font-size: 1.3rem; font-weight: 700; color: var(--gold-cosmic); }
    .metric .label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; font-family: 'Orbitron', monospace; }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 8px; align-items: stretch; }

    .card { background: rgba(11,61,46,0.2); border: 1px solid var(--gold-dim); border-radius: var(--radius); padding: 24px; transition: var(--transition); position: relative; overflow: hidden; backdrop-filter: blur(10px); display: flex; flex-direction: column; align-items: center; text-align: center; height: 100%; min-height: 330px; }
    .card::before { content: ''; position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px; background: linear-gradient(135deg, var(--gold-cosmic), var(--verde-bosque), var(--gold-cosmic)); background-size: 300% 300%; border-radius: var(--radius); z-index: -1; opacity: 0; transition: var(--transition); animation: border-flow 4s ease-in-out infinite; }
    @keyframes border-flow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    .card:hover::before { opacity: 0.15; }
    .card:hover { transform: translateY(-4px); border-color: var(--border-glow); box-shadow: var(--shadow-neon), var(--shadow-glow); }
    .card .icon { font-size: 2.8rem; margin-bottom: 12px; filter: drop-shadow(0 0 20px rgba(247,212,74,0.15)); animation: float-icon 4s ease-in-out infinite; }
    .card:nth-child(2) .icon { animation-delay: -0.8s; }
    .card:nth-child(3) .icon { animation-delay: -1.6s; }
    .card:nth-child(4) .icon { animation-delay: -2.4s; }
    .card:nth-child(5) .icon { animation-delay: -3.2s; }
    .card:nth-child(6) .icon { animation-delay: -4s; }
    .card:nth-child(7) .icon { animation-delay: -4.8s; }
    .card:nth-child(8) .icon { animation-delay: -5.6s; }
    @keyframes float-icon { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-6px) scale(1.05); } }
    .card h2 { font-family: 'Orbitron', monospace; font-size: 1.1rem; font-weight: 700; margin-bottom: 6px; background: linear-gradient(135deg, var(--text-primary), var(--gold-cosmic)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; min-height: 2.8rem; display: flex; align-items: center; justify-content: center; }
    .card p { color: var(--text-secondary); font-size: 0.9rem; line-height: 1.5; margin-bottom: 16px; flex-grow: 1; min-height: 4.5rem; }
    .card .tags { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-bottom: 14px; min-height: 1.8rem; }
    .card .tags span { font-size: 0.55rem; background: rgba(247,212,74,0.06); border: 1px solid rgba(247,212,74,0.1); padding: 2px 10px; border-radius: 20px; color: var(--text-muted); text-transform: uppercase; font-family: 'Orbitron', monospace; letter-spacing: 0.5px; }
    .card .actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: auto; width: 100%; }

    .footer { margin-top: 48px; padding-top: 28px; border-top: 1px solid var(--gold-dim); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; position: relative; }
    .footer::before { content: ''; position: absolute; top: -1px; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--gold-cosmic), transparent); opacity: 0.2; }
    .footer-text { color: var(--text-muted); font-size: 0.78rem; letter-spacing: 0.5px; font-family: 'Orbitron', monospace; }
    .footer-text .brand { color: var(--gold-cosmic); }
    .footer-links { display: flex; gap: 16px; flex-wrap: wrap; }
    .footer-links a { color: var(--text-muted); text-decoration: none; font-size: 0.75rem; transition: var(--transition); font-family: 'Orbitron', monospace; letter-spacing: 0.5px; }
    .footer-links a:hover { color: var(--gold-cosmic); }
    .footer-links a.internet-link { color: var(--emerald-green); }
    .footer-links a.internet-link:hover { color: #00d68f; text-shadow: 0 0 20px rgba(0, 214, 143, 0.3); }
    .footer-hex { display: inline-block; background: var(--verde-bosque); color: var(--gold-cosmic); padding: 2px 10px; border-radius: 4px; font-size: 0.6rem; font-weight: 700; border: 1px solid var(--gold-cosmic); font-family: 'Orbitron', monospace; }

    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .card { animation: fadeInUp 0.5s ease-out forwards; }
    .card:nth-child(2) { animation-delay: 0.1s; }
    .card:nth-child(3) { animation-delay: 0.2s; }
    .card:nth-child(4) { animation-delay: 0.3s; }
    .card:nth-child(5) { animation-delay: 0.4s; }
    .card:nth-child(6) { animation-delay: 0.5s; }
    .card:nth-child(7) { animation-delay: 0.6s; }
    .card:nth-child(8) { animation-delay: 0.7s; }

    @media (max-width: 768px) { .app { padding: 16px; } .header { flex-direction: column; align-items: flex-start; } .logo-text { font-size: 1.2rem; } .header-actions { width: 100%; justify-content: flex-start; } .hero-title { font-size: 1.8rem; } .hero-metrics { gap: 20px; } .grid { grid-template-columns: 1fr 1fr; } .card { min-height: 280px; } .wallet-status { font-size: 0.45rem; padding: 2px 8px; } }
    @media (max-width: 480px) { .hero-title { font-size: 1.4rem; } .btn { font-size: 0.6rem; padding: 8px 14px; } .grid { grid-template-columns: 1fr; } .card { padding: 18px; min-height: 250px; } .wallet-status { font-size: 0.4rem; padding: 2px 6px; } .wallet-status .wallet-text { font-size: 0.4rem; } }
  </style>
</head>
<body>
  <canvas id="stars-canvas"></canvas>
  <div class="nebula nebula-1"></div>
  <div class="nebula nebula-2"></div>
  <div class="nebula nebula-3"></div>

  <div class="app">
    <header class="header">
      <a href="#" class="logo">
        <span class="logo-icon"><span class="hex">◈</span></span>
        <span class="logo-text">Csariel's</span>
        <span class="logo-badge">Inicio</span>
      </a>
      <div class="header-actions">
        <div class="status-badge">
          <span class="status-dot online"></span>
          <span>En línea</span>
        </div>
        <a href="#" data-csariel-page="network" class="btn btn-primary btn-sm"><i class="fas fa-users"></i> Mi Red</a>
        <button class="btn btn-gold btn-sm" onclick="window.marquinhosUI?.toggleVentana()"><i class="fas fa-brain"></i> 🧠 Marquinhos</button>
        <a href="#" data-csariel-page="admin" class="btn btn-outline btn-sm"><i class="fas fa-cog"></i> Admin</a>
        <a href="#" data-csariel-page="web3" class="btn btn-primary btn-sm"><i class="fas fa-wallet"></i> Web3</a>
        
        <div class="lang-selector" id="languageSelector">
          <button class="lang-btn active" onclick="setLanguage('es')" id="btn-es">🇪🇸</button>
          <button class="lang-btn" onclick="setLanguage('en')" id="btn-en">🇺🇸</button>
          <button class="lang-btn" onclick="setLanguage('fr')" id="btn-fr">🇫🇷</button>
        </div>

        <div class="wallet-status" id="walletStatus">
          <span class="wallet-dot loading" id="walletDot"></span>
          <span class="wallet-text" id="walletText">Conectando wallet...</span>
          <button class="btn-conectar-wallet" id="btnConectarWallet" style="display:none;" onclick="conectarMetaMask()"><i class="fas fa-plug"></i> Conectar</button>
        </div>
      </div>
    </header>

    <section class="hero">
      <div class="hero-content">
        <h1 class="hero-title" id="heroTitle">Bienvenido a <span class="highlight">Csariel's</span></h1>
        <p class="hero-sub" id="heroSub">Red Social Integral · IA · eSIM · Web3</p>
        <div class="hero-metrics">
          <div class="metric"><span class="number">🌐</span><span class="label" id="metricSocial">Red Social</span></div>
          <div class="metric"><span class="number">📶</span><span class="label" id="metricEsim">eSIM</span></div>
          <div class="metric"><
