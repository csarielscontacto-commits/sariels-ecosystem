<!-- 🗺️ SCRIPT DEL MAPA PARA ESTA PÁGINA -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<script>
    // Inicializar el mapa cuando cargue esta página
    document.addEventListener('DOMContentLoaded', function() {
        iniciarMapaServicios();
    });

    let mapServices = null;
    let userMarkerPlaced = false;

    function iniciarMapaServicios() {
        // Si el mapa ya existe, no lo crees de nuevo
        if(mapServices) return;

        mapServices = L.map('services-map').setView([19.4326, -99.1332], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(mapServices);
        
        // Intentar obtener la ubicación al cargar la página
        activarGPSMapa();
    }

    function activarGPSMapa() {
        if (!mapServices) return;

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    
                    // Volar al usuario
                    mapServices.flyTo([lat, lng], 15);
                    
                    // Poner pin azul
                    if(userMarkerPlaced) return;
                    const userMarker = L.marker([lat, lng], {icon: L.divIcon({className: 'user-pin', html: '📍', iconSize: [20, 20]})}).addTo(mapServices);
                    userMarker.bindPopup("<b style='color:black;'>📍 Estás aquí</b>").openPopup();
                    userMarkerPlaced = true;
                },
                (error) => {
                    console.warn("GPS denegado para servicios.");
                }
            );
        }
    }

    // Exponer la función globalmente para que el botón funcione
    window.activarGPSMapa = activarGPSMapa;
</script>
