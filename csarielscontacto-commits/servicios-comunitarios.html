<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Servicios Comunitarios | Csariel's</title>
  <meta name="theme-color" content="#0F2D1A" />

  <!-- ================================================================
  CSP – Seguridad contra inyecciones y hackeos
  ================================================================ -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com https://*.supabase.co https://*.polygon.technology https://cdn.tailwindcss.com;
    style-src 'self' https://cdnjs.cloudflare.com https://fonts.googleapis.com https://cdn.tailwindcss.com https://unpkg.com 'unsafe-inline';
    font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;
    img-src 'self' data: https://* https://tile.openstreetmap.org;
    connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.polygon.technology https://tile.openstreetmap.org;
    frame-src 'self';
    media-src 'self';
    object-src 'none';
    base-uri 'self';
    form-action 'self';
  ">

  <!-- ================================================================
  SEGURIDAD CSARIEL'S – ANTI‑HACKEO
  ================================================================ -->
  <script src="./js/security.js"></script>

  <!-- ==== ESTILOS EXTERNOS ==== -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;400;600;700&display=swap"
        rel="stylesheet" />

  <style>
    /* ==================== VARIABLES ==================== */
    :root{
      --space-deep:#05080f;
      --space-mid:#0a1428;
      --verde-bosque:#0F2D1A;
      --verde-bosque-light:#1a4a2a;
      --gold-cosmic:#D4AF37;
      --gold-dim:rgba(212,175,55,0.15);
      --gold-glow:rgba(212,175,55,0.25);
      --text-primary:#e8f0f8;
      --text-secondary:#8ba3c7;
      --text-muted:#4a6a8a;
      --border:rgba(212,175,55,0.08);
      --border-glow:rgba(212,175,55,0.25);
      --radius:16px;
      --transition:all 0.3s cubic-bezier(0.4,0,0.2,1);
      --success:#00b894;
      --danger:#ff3366;
      --warning:#D4AF37;
      --quantum:#00e5ff;
    }

    *{margin:0;padding:0;box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      background:var(--space-deep);
      color:var(--text-primary);
      font-family:'Space Grotesk','Inter',system-ui,sans-serif;
      line-height:1.6;
      min-height:100vh;
      overflow-x:hidden;
      position:relative;
    }
    #stars-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
    .nebula{
      position:fixed;border-radius:50%;filter:blur(120px);opacity:.10;pointer-events:none;z-index:0;
      animation:nebula-drift 25s ease-in-out infinite alternate;
    }
    .nebula-1{width:700px;height:700px;background:var(--verde-bosque);top:-15%;right:-15%}
    .nebula-2{width:600px;height:600px;background:var(--gold-cosmic);bottom:-15%;left:-15%;animation-delay:-8s;opacity:.05}
    .nebula-3{width:500px;height:500px;background:var(--quantum);top:50%;left:50%;transform:translate(-50%,-50%);animation-delay:-15s;opacity:.04}
    @keyframes nebula-drift{
      0%{transform:translate(0,0) scale(1)}
      100%{transform:translate(40px,-30px) scale(1.15)}
    }
    ::-webkit-scrollbar{width:5px}
    ::-webkit-scrollbar-track{background:var(--space-deep)}
    ::-webkit-scrollbar-thumb{background:linear-gradient(var(--gold-cosmic),var(--verde-bosque));border-radius:3px}
    .app{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:16px 20px 30px}
    .header{
      display:flex;justify-content:space-between;align-items:center;
      padding:12px 0 16px;border-bottom:2px solid var(--gold-dim);
      margin-bottom:20px;flex-wrap:wrap;gap:10px;
      backdrop-filter:blur(10px);position:relative;
    }
    .header::after{
      content:"";position:absolute;bottom:-2px;left:0;right:0;height:1px;
      background:linear-gradient(90deg,transparent,var(--gold-cosmic),var(--verde-bosque));
    }

    /* ---------- MAPA ---------- */
    .mapa-container{
      width:100%;
      height:400px;               /* Ajusta la altura si lo deseas */
      border-radius:var(--radius);
      overflow:hidden;
      box-shadow:0 0 20px rgba(212,175,55,.15);
      margin:20px 0;
    }
  </style>

  <!-- ==== LIBRERÍAS DE TERCEROS ==== -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <!-- ==== CONECTORES ==== -->
  <script src="./js/servicios-connector.js"></script>
  <script src="./js/perfil-connector.js"></script>
  <script src="./js/esim-connector.js"></script>
  <script src="./js/config.js"></script>
</head>

<body>
  <!-- ESTRELLAS DE FONDO -->
  <canvas id="stars-canvas"></canvas>
  <div class="nebula nebula-1"></div>
  <div class="nebula nebula-2"></div>
  <div class="nebula nebula-3"></div>

  <div class="app">
    <!-- ===================== HEADER ===================== -->
    <header class="header">
      <h1>Servicios Comunitarios</h1>
      <nav>
        <a href="#" class="text-secondary">Inicio</a>
        <a href="#" class="text-secondary">Acerca</a>
        <a href="#" class="text-secondary">Contacto</a>
      </nav>
    </header>

    <!-- ===================== CONTENIDO ===================== -->
    <main>
      <section>
        <h2>¿Dónde estamos?</h2>
        <p>¡Descubre la ubicación de nuestros puntos de servicio con el mapa interactivo!</p>

        <!-- <<< AQUI VA EL MAPA >>> -->
        <div id="mapa-servicios" class="mapa-container"></div>
      </section>
    </main>

    <!-- ===================== FOOTER ===================== -->
    <footer style="margin-top:40px;text-align:center;color:var(--text-secondary);">
      © 2024 Csariel's – Todos los derechos reservados.
    </footer>
  </div>

  <!-- ===================== SCRIPT DEL MAPA ===================== -->
  <script>
    // Esperamos a que el DOM esté listo
    document.addEventListener('DOMContentLoaded', () => {
      // Coordenada de ejemplo – cámbiala por la que necesites
      const centro = [-12.0464, -77.0428]; // Lima, Perú

      // Crear el mapa
      const mapa = L.map('mapa-servicios', {
        center: centro,
        zoom: 13,
        // Puedes desactivar interacciones si lo deseas:
        // dragging: false,
        // scrollWheelZoom: false,
        // tap: false
      });

      // Capa base: OpenStreetMap (gratuita)
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution:
          '&copy; <a href="https://www.openstreetmap.org/">OpenStreetMap</a> contributors',
        maxZoom: 19
      }).addTo(mapa);

      // Marcador de ejemplo
      const marcador = L.marker(centro).addTo(mapa);
      marcador.bindPopup('<b>Servicios Comunitarios</b><br>¡Aquí estamos!').openPopup();

      /* -------------------------------------------------------
      Si más adelante quieres cargar datos desde Supabase,
      puedes usar algo como:

      fetch('https://TU_SUPABASE_URL/rest/v1/ubicaciones')
        .then(r => r.json())
        .then(geojson => L.geoJSON(geojson).addTo(mapa));

      ------------------------------------------------------- */
    });
  </script>
</body>
</html>
