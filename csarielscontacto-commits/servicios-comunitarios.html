<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicios Comunitarios | Csariel's</title>
    <meta name="theme-color" content="#0F2D1A" />

    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com https://*.supabase.co https://*.polygon.technology https://cdn.tailwindcss.com;
        style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com https://cdn.tailwindcss.com https://unpkg.com;
        font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;
        img-src 'self' data: https://* blob:;
        connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.polygon.technology https://*.tile.openstreetmap.org;
        frame-src 'self';
        media-src 'self';
        object-src 'none';
        base-uri 'self';
        form-action 'self';
    ">

    <script src="./js/security.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="./js/servicios-connector.js"></script>
    <script src="./js/perfil-connector.js"></script>
    <script src="./js/esim-connector.js"></script>
    <script src="./js/config.js"></script>
    
    <style>
        /* ================================================================
           SERVICIOS COMUNITARIOS - ESTILOS
           ================================================================ */
        :root {
            --space-deep: #05080f;
            --space-mid: #0a1428;
            --verde-bosque: #0F2D1A;
            --verde-bosque-light: #1a4a2a;
            --gold-cosmic: #D4AF37;
            --gold-dim: rgba(212,175,55,0.15);
            --gold-glow: rgba(212,175,55,0.25);
            --text-primary: #e8f0f8;
            --text-secondary: #8ba3c7;
            --text-muted: #4a6a8a;
            --border: rgba(212,175,55,0.08);
            --border-glow: rgba(212,175,55,0.25);
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --success: #00b894;
            --danger: #ff3366;
            --warning: #D4AF37;
            --quantum: #00e5ff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            background: var(--space-deep);
            color: var(--text-primary);
            font-family: 'Space Grotesk', 'Inter', system-ui, sans-serif;
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .app {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px 20px 30px;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0 16px;
            border-bottom: 2px solid var(--gold-dim);
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .logo-text {
            font-family: 'Orbitron', monospace;
            font-size: 1.3rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--gold-cosmic), var(--verde-bosque-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* ===== SEARCH BAR ===== */
        .search-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 16px;
            align-items: center;
        }
        .search-bar .search-input-wrapper {
            flex: 1;
            min-width: 200px;
            position: relative;
        }
        .search-bar .search-input-wrapper input {
            width: 100%;
            padding: 10px 14px 10px 40px;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--gold-dim);
            border-radius: 12px;
            color: var(--text-primary);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.9rem;
            outline: none;
            transition: var(--transition);
        }
        .search-bar .btn-geolocation {
            background: rgba(0,212,255,0.1);
            border: 1px solid rgba(0,212,255,0.15);
            color: var(--quantum);
            padding: 10px 18px;
            border-radius: 12px;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Orbitron', monospace;
            font-size: 0.6rem;
            white-space: nowrap;
        }

        /* ===== MAPA (CORREGIDO Y CERRADO) ===== */
        #map-container {
            width: 100%;
            height: 380px;
            border-radius: var(--radius);
            border: 1px solid var(--gold-dim);
            overflow: hidden;
            margin-bottom: 16px;
            background: var(--space-mid);
            position: relative;
            z-index: 1;
        }

        /* Ajustes para que Leaflet encaje con el tema oscuro */
        .leaflet-tile-pane {
            filter: brightness(0.7) invert(1) contrast(2.5) hue-rotate(200deg) saturate(0.3);
        }
        .leaflet-popup-content-wrapper {
            background: var(--space-mid) !important;
            color: var(--text-primary) !important;
            border: 1px solid var(--gold-cosmic);
            border-radius: 12px !important;
        }
        .leaflet-popup-tip {
            background: var(--space-mid) !important;
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="logo-text">Csariel's <span style="font-size:0.6rem; color:var(--gold-cosmic);">SERVICIOS COMUNITARIOS</span></div>
        </header>

        <div class="search-bar">
            <div class="search-input-wrapper">
                <input type="text" id="searchInput" placeholder="Buscar servicio o negocio verificado..." />
            </div>
            <button class="btn-geolocation" onclick="geolocalizarUsuario()">📍 Cerca de mí</button>
        </div>

        <div id="map-container"></div>
    </div>

    <script>
        let map;
        let userMarker;
        const centroInicial = [19.0413, -98.2062]; // Coordenadas iniciales por defecto

        document.addEventListener("DOMContentLoaded", () => {
            // Inicializar mapa
            map = L.map('map-container').setView(centroInicial, 13);

            // Cargar capas de OpenStreetMap (100% gratis)
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);

            // Ejemplo de marcador de negocio verificado ($300 / 6 meses)
            const negocioVerificado = L.marker([19.0430, -98.2040]).addTo(map);
            negocioVerificado.bindPopup(`
                <strong style="color:var(--gold-cosmic);">Negocio Verificado</strong><br>
                <span>Servicio disponible en tu zona</span>
            `);
        });

        // Función del botón "Cerca de mí"
        function geolocalizarUsuario() {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition((position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;

                    map.setView([lat, lng], 15);

                    if (userMarker) map.removeLayer(userMarker);

                    userMarker = L.circleMarker([lat, lng], {
                        radius: 8,
                        fillColor: "#00e5ff",
                        color: "#ffffff",
                        weight: 2,
                        fillOpacity: 0.8
                    }).addTo(map).bindPopup("<b>Tu ubicación actual</b>").openPopup();
                }, (error) => {
                    alert("Por favor permite el acceso a tu ubicación para buscar servicios cercanos.");
                });
            }
        }
    </script>
</body>
</html>
