<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicios Comunitarios | Csariel's</title>
    <meta name="theme-color" content="#0a0e17" />

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;400;600&display=swap" rel="stylesheet" />

    <style>
        :root {
            --bg-dark: #07090e;
            --card-bg: #0d111a;
            --accent-gold: #c2a649;
            --accent-green: #2a5a3b;
            --accent-blue: #0088cc;
            --text-main: #e2e8f0;
            --text-muted: #64748b;
            --border-color: #1e293b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Space Grotesk', sans-serif;
            padding: 16px;
        }

        /* HEADER */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .brand {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--accent-gold);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .brand span {
            font-size: 0.65rem;
            color: #4ade80;
            letter-spacing: 1px;
        }

        /* SEARCH BAR */
        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }
        .search-input {
            flex: 1;
            background: #111622;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px 16px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }
        .search-input:focus {
            border-color: var(--accent-gold);
        }
        .btn-near {
            background: #092532;
            border: 1px solid #005580;
            color: #00aaff;
            border-radius: 10px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        /* MAP CONTAINER */
        #map {
            height: 300px;
            width: 100%;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
            z-index: 1;
            background: #1a1e29; /* Color de fondo mientras carga */
        }

        /* CATEGORIES */
        .categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 16px;
        }
        .cat-chip {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 14px;
            border-radius: 20px;
            white-space: nowrap;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .cat-chip.active {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
            background: rgba(194, 166, 73, 0.1);
        }

        /* LISTING */
        .services-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px;
        }
        .service-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
        }
        .service-card h4 {
            color: #fff;
            font-size: 1rem;
            margin-bottom: 4px;
        }
        .service-card p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="brand">
            Csariel's <span>SERVICIOS COMUNITARIOS</span>
        </div>
    </header>

    <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="Buscar servicio o negocio..." oninput="filtrarServicios()">
        <button class="btn-near" onclick="centerLocation()">
            <i class="fas fa-location-dot"></i> Cerca de mí
        </button>
    </div>

    <div id="map"></div>

    <div class="categories">
        <button class="cat-chip active" onclick="filtrar('todos', this)">Todos</button>
        <button class="cat-chip" onclick="filtrar('mecanico', this)">🔧 Mecánicos</button>
        <button class="cat-chip" onclick="filtrar('grua', this)">🚗 Grúas</button>
        <button class="cat-chip" onclick="filtrar('tecnico', this)">💻 Técnicos</button>
    </div>

    <div class="services-list" id="servicesContainer"></div>

    <script>
        let map;
        let mainMarker;
        const defaultLat = 19.0413;
        const defaultLng = -98.2062;

        const servicios = [
            { id: 1, nombre: "Taller Mecánico Express", cat: "mecanico", lat: 19.0430, lng: -98.2000, desc: "Reparación general y diagnóstico." },
            { id: 2, nombre: "Grúas Puebla 24/7", cat: "grua", lat: 19.0380, lng: -98.2100, desc: "Servicio de arrastre inmediato." },
            { id: 3, nombre: "Soporte Técnico Laptop", cat: "tecnico", lat: 19.0450, lng: -98.2050, desc: "Mantenimiento preventivo y correctivo." }
        ];

        function initMap() {
            // Inicializar el mapa
            map = L.map('map').setView([defaultLat, defaultLng], 13);

            // Capa Oscura Nativa de CartoDB (Carga rápido y NATIVAMENTE en modo oscuro sin bugs CSS)
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap &copy; CARTO',
                subdomains: 'abcd',
                maxZoom: 19
            }).addTo(map);

            // Marcador inicial
            mainMarker = L.marker([defaultLat, defaultLng]).addTo(map)
                .bindPopup('<b>Puebla</b>')
                .openPopup();

            // Agregar los marcadores de los servicios
            servicios.forEach(s => {
                L.marker([s.lat, s.lng]).addTo(map)
                    .bindPopup(`<b>${s.nombre}</b><br>${s.desc}`);
            });

            // FIX CRÍTICO: Forzar a Leaflet a recalcular dimensiones después de cargar el DOM
            setTimeout(() => {
                map.invalidateSize();
            }, 300);
        }

        function renderServicios(items) {
            const container = document.getElementById('servicesContainer');
            container.innerHTML = '';

            items.forEach(s => {
                const card = document.createElement('div');
                card.className = 'service-card';
                card.innerHTML = `
                    <h4>${s.nombre}</h4>
                    <p>${s.desc}</p>
                `;
                container.appendChild(card);
            });
        }

        function centerLocation() {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(position => {
                    const { latitude, longitude } = position.coords;
                    map.setView([latitude, longitude], 15);
                    mainMarker.setLatLng([latitude, longitude]).bindPopup('📍 Tu Ubicación').openPopup();
                }, error => {
                    alert("No se pudo obtener tu ubicación actual.");
                });
            }
        }

        function filtrar(categoria, btn) {
            document.querySelectorAll('.cat-chip').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');

            if (categoria === 'todos') {
                renderServicios(servicios);
            } else {
                renderServicios(servicios.filter(s => s.cat === categoria));
            }
        }

        function filtrarServicios() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtrados = servicios.filter(s => s.nombre.toLowerCase().includes(query) || s.desc.toLowerCase().includes(query));
            renderServicios(filtrados);
        }

        // Ejecutar al cargar la página completamente
        window.addEventListener('load', () => {
            initMap();
            renderServicios(servicios);
        });
    </script>
</body>
</html>
