<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="titulo_delivery">🚚 Delivery | Csariel's</title>
    <meta name="theme-color" content="#0F2D1A" />
    <base href="/">

    <!-- 🔒 CSP -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com https://*.supabase.co https://*.tile.openstreetmap.org;
        style-src 'self' https://cdnjs.cloudflare.com https://fonts.googleapis.com 'unsafe-inline';
        font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;
        img-src 'self' data: https://*;
        connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.tile.openstreetmap.org;
        frame-src 'self';
        media-src 'self';
        object-src 'none';
        base-uri 'self';
        form-action 'self';
    ">

    <!-- ===== RECURSOS ===== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

    <!-- ===== ESTILOS UNIFICADOS ===== -->
    <style>
        :root {
            --space-deep: #05080f;
            --space-mid: #0a1428;
            --verde-bosque: #0F2D1A;
            --verde-bosque-light: #1a4a2a;
            --gold-cosmic: #D4AF37;
            --gold-dim: rgba(212,175,55,0.15);
            --gold-glow: rgba(212,175,55,0.25);
            --text-primary: #e8f0f8;
            --text-secondary: #8ba3c7;
            --text-muted: #4a6a8a;
            --border: rgba(212,175,55,0.08);
            --border-glow: rgba(212,175,55,0.25);
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --success: #00b894;
            --danger: #ff3366;
            --warning: #D4AF37;
            --quantum: #00e5ff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            background: var(--space-deep);
            color: var(--text-primary);
            font-family: 'Space Grotesk', 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        #stars-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .nebula {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.10;
            pointer-events: none;
            z-index: 0;
            animation: nebula-drift 25s ease-in-out infinite alternate;
        }
        .nebula-1 { width: 700px; height: 700px; background: var(--verde-bosque); top: -15%; right: -15%; }
        .nebula-2 { width: 600px; height: 600px; background: var(--gold-cosmic); bottom: -15%; left: -15%; animation-delay: -8s; opacity: 0.05; }
        .nebula-3 { width: 500px; height: 500px; background: var(--quantum); top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: -15s; opacity: 0.04; }

        @keyframes nebula-drift {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, -30px) scale(1.15); }
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: var(--space-deep); }
        ::-webkit-scrollbar-thumb { background: linear-gradient(var(--gold-cosmic), var(--verde-bosque)); border-radius: 3px; }

        .app {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px 20px 30px;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0 16px;
            border-bottom: 2px solid var(--gold-dim);
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
            backdrop-filter: blur(10px);
            position: relative;
        }
        .header::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-cosmic), var(--verde-bosque), var(--gold-cosmic), transparent);
            opacity: 0.4;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        .logo-icon { font-size: 2rem; filter: drop-shadow(0 0 20px rgba(212,175,55,0.2)); animation: pulse-glow 3s ease-in-out infinite; }
        .logo-icon .hex {
            display: inline-block;
            background: var(--verde-bosque);
            color: var(--gold-cosmic);
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 900;
            border: 2px solid var(--gold-cosmic);
            font-family: 'Orbitron', monospace;
        }
        @keyframes pulse-glow { 0%, 100% { filter: drop-shadow(0 0 20px rgba(212,175,55,0.2)); } 50% { filter: drop-shadow(0 0 40px rgba(212,175,55,0.4)); } }

        .logo-text {
            font-family: 'Orbitron', monospace;
            font-size: 1.3rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--gold-cosmic), var(--verde-bosque-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo-badge {
            font-family: 'Orbitron', monospace;
            font-size: 0.45rem;
            background: linear-gradient(135deg, var(--verde-bosque), var(--gold-cosmic));
            color: white;
            padding: 3px 12px;
            border-radius: 20px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            -webkit-text-fill-color: white;
            border: 1px solid rgba(212,175,55,0.2);
            animation: badge-pulse 2s ease-in-out infinite;
        }
        @keyframes badge-pulse { 0%, 100% { box-shadow: 0 0 30px rgba(15,45,26,0.3); } 50% { box-shadow: 0 0 60px rgba(212,175,55,0.2); } }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 16px;
            border: 1px solid var(--border);
            border-radius: 30px;
            background: rgba(212,175,55,0.03);
            color: var(--text-primary);
            font-family: 'Orbitron', monospace;
            font-size: 0.6rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
        }
        .btn:hover { transform: scale(1.02); border-color: var(--border-glow); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }

        .btn-primary {
            background: linear-gradient(135deg, var(--verde-bosque), var(--verde-bosque-light));
            border-color: var(--gold-cosmic);
            color: var(--gold-cosmic);
            -webkit-text-fill-color: var(--gold-cosmic);
        }
        .btn-gold {
            background: linear-gradient(135deg, var(--gold-cosmic), #b8923a);
            border-color: transparent;
            color: #0a0c10;
            -webkit-text-fill-color: #0a0c10;
        }
        .btn-outline { border-color: var(--border); background: transparent; }
        .btn-sm { padding: 4px 12px; font-size: 0.55rem; }

        /* ===== SELECTOR DE IDIOMA ===== */
        .language-selector {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            background: rgba(212,175,55,0.03);
            border-radius: 16px;
            border: 1px solid rgba(212,175,55,0.08);
        }
        .language-selector .lang-icon { font-size: 0.7rem; margin-right: 2px; }
        .lang-btn {
            padding: 2px 8px;
            border-radius: 10px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-muted);
            font-family: 'Orbitron', monospace;
            font-size: 0.45rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .lang-btn:hover { color: var(--text-secondary); background: rgba(212,175,55,0.05); }
        .lang-btn.active { border-color: var(--gold-cosmic); background: rgba(212,175,55,0.1); color: var(--gold-cosmic); }

        /* ===== DELIVERY CONTAINER ===== */
        .delivery-container {
            background: rgba(15,45,26,0.25);
            border: 1px solid var(--gold-dim);
            border-radius: var(--radius);
            padding: 24px;
            backdrop-filter: blur(10px);
            margin-bottom: 16px;
        }

        #delivery-map {
            width: 100%;
            height: 350px;
            border-radius: var(--radius);
            border: 1px solid var(--gold-dim);
            overflow: hidden;
            margin-bottom: 16px;
            background: var(--space-deep);
        }

        .pedido-form {
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid var(--gold-dim);
        }
        .pedido-form .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .pedido-form .form-group {
            margin-bottom: 10px;
        }
        .pedido-form .form-group label {
            display: block;
            font-size: 0.6rem;
            color: var(--text-muted);
            font-family: 'Orbitron', monospace;
            margin-bottom: 3px;
            text-transform: uppercase;
        }
        .pedido-form .form-group input,
        .pedido-form .form-group select,
        .pedido-form .form-group textarea {
            width: 100%;
            padding: 8px 12px;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--gold-dim);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.8rem;
            outline: none;
            font-family: 'Space Grotesk', sans-serif;
        }
        .pedido-form .form-group textarea { min-height: 60px; resize: vertical; }
        .pedido-form .form-group.oculto { display: none; }

        .btn-delivery {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, var(--gold-cosmic), #b8923a);
            border: none;
            border-radius: 30px;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            font-size: 0.8rem;
            color: #0a0c10;
            cursor: pointer;
            transition: var(--transition);
        }
        .btn-delivery:hover { transform: scale(1.02); box-shadow: 0 0 30px rgba(212,175,55,0.3); }
        .btn-delivery:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; box-shadow: none; }

        .pedidos-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 12px;
        }
        .pedido-item {
            background: rgba(0,0,0,0.25);
            border: 1px solid var(--gold-dim);
            border-radius: 10px;
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .pedido-item .pedido-info { flex: 1; min-width: 180px; }
        .pedido-item .pedido-desc { font-size: 0.75rem; color: var(--text-primary); margin-bottom: 4px; }
        .pedido-item .pedido-meta { font-size: 0.6rem; color: var(--text-muted); font-family: 'Orbitron', monospace; }
        .estado-badge {
            font-family: 'Orbitron', monospace;
            font-size: 0.5rem;
            padding: 3px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            font-weight: 700;
        }
        .estado-pendiente { background: rgba(212,175,55,0.15); color: var(--gold-cosmic); }
        .estado-en_camino { background: rgba(0,229,255,0.15); color: var(--quantum); }
        .estado-entregado { background: rgba(0,184,148,0.15); color: var(--success); }
        .estado-cancelado { background: rgba(255,51,102,0.15); color: var(--danger); }

        /* ===== FOOTER ===== */
        .footer {
            margin-top: 24px;
            padding-top: 14px;
            border-top: 1px solid var(--gold-dim);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .footer-text { color: var(--text-muted); font-size: 0.5rem; font-family: 'Orbitron', monospace; }
        .footer-text .brand { color: var(--gold-cosmic); }
        .footer-links { display: flex; gap: 8px; flex-wrap: wrap; }
        .footer-links a { color: var(--text-muted); text-decoration: none; font-size: 0.5rem; font-family: 'Orbitron', monospace; }

        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--verde-bosque);
            color: var(--gold-cosmic);
            padding: 10px 20px;
            border-radius: var(--radius);
            font-weight: 600;
            font-size: 0.7rem;
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 5000;
            pointer-events: none;
            font-family: 'Orbitron', monospace;
            border: 1px solid rgba(212,175,55,0.15);
        }
        .toast.active { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.error { background: var(--danger); color: white; }
    </style>
</head>
<body>
    <canvas id="stars-canvas"></canvas>
    <div class="nebula nebula-1"></div>
    <div class="nebula nebula-2"></div>
    <div class="nebula nebula-3"></div>

    <div class="app">
        <!-- HEADER -->
        <header class="header">
            <a href="/" class="logo">
                <span class="logo-icon"><span class="hex">◈</span></span>
                <span class="logo-text">Csariel's</span>
                <span class="logo-badge" data-i18n="delivery">Delivery</span>
            </a>
            <div class="header-actions">
                <div class="language-selector">
                    <span class="lang-icon">🌐</span>
                    <button class="lang-btn" data-lang="es" onclick="CSARIELS_IDIOMA.cambiar('es')">ES</button>
                    <button class="lang-btn" data-lang="en" onclick="CSARIELS_IDIOMA.cambiar('en')">EN</button>
                    <button class="lang-btn" data-lang="fr" onclick="CSARIELS_IDIOMA.cambiar('fr')">FR</button>
                </div>

                <a href="/" class="btn btn-outline btn-sm">
                    <i class="fas fa-home"></i> <span data-i18n="inicio">Inicio</span>
                </a>
                <a href="/features/red/index.html" class="btn btn-primary btn-sm">
                    <i class="fas fa-users"></i> <span data-i18n="mi_red">Mi Red</span>
                </a>
                <a href="/features/live/index.html" class="btn btn-outline btn-sm">
                    <i class="fas fa-video"></i> <span data-i18n="live">Live</span>
                </a>
                <a href="/features/servicios/index.html" class="btn btn-gold btn-sm">
                    <i class="fas fa-arrow-left"></i> <span data-i18n="volver_servicios">Volver a Servicios</span>
                </a>
            </div>
        </header>

        <!-- CONTENIDO PRINCIPAL -->
        <div class="delivery-container">
            <h1 data-i18n="titulo_main">🚚 Delivery</h1>
            <div class="sub" data-i18n="sub_main">Solicita o gestiona entregas a domicilio</div>

            <div id="delivery-map"></div>

            <div class="pedido-form">
                <h3 style="font-family:'Orbitron';color:var(--gold-cosmic);font-size:0.85rem;margin-bottom:8px;" data-i18n="solicitar_entrega">📦 Solicitar entrega</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label data-i18n="nombre_cliente">Nombre del cliente *</label>
                        <input type="text" id="deliveryNombre" placeholder="Ej: Juan Pérez">
                    </div>
                    <div class="form-group">
                        <label data-i18n="telefono">Teléfono *</label>
                        <input type="tel" id="deliveryTelefono" placeholder="55 1234 5678">
                    </div>
                </div>
                <div class="form-group">
                    <label data-i18n="direccion_entrega">Dirección de entrega *</label>
                    <input type="text" id="deliveryDireccion" placeholder="Calle, número, colonia, ciudad">
                </div>
                <div class="form-group">
                    <label data-i18n="descripcion_pedido">Descripción del pedido *</label>
                    <textarea id="deliveryDescripcion" placeholder="¿Qué necesitas que entreguen?"></textarea>
                </div>
                <div class="form-group">
                    <label data-i18n="metodo_pago">Método de pago</label>
                    <select id="deliveryPago" onchange="toggleMontoCMT()">
                        <option value="efectivo">💵 Efectivo</option>
                        <option value="transferencia">🏦 Transferencia</option>
                        <option value="cmt">🪙 CMT</option>
                    </select>
                </div>
                <div class="form-group oculto" id="grupoMontoCMT">
                    <label data-i18n="monto_cmt">Monto en CMT *</label>
                    <input type="number" id="deliveryMontoCMT" placeholder="0.00" min="0" step="0.01">
                </div>
                <button onclick="crearPedido()" class="btn-delivery" id="btnCrearPedido">
                    <i class="fas fa-truck"></i> <span data-i18n="btn_solicitar">Solicitar entrega</span>
                </button>
            </div>

            <h3 style="font-family:'Orbitron';color:var(--text-secondary);font-size:0.8rem;margin-bottom:8px;" data-i18n="pedidos_recientes">📋 Pedidos recientes</h3>
            <div class="pedidos-list" id="pedidosList">
                <div style="text-align:center;padding:30px;color:var(--text-muted);">
                    <div style="font-size:2rem;opacity:0.3;margin-bottom:8px;">📭</div>
                    <p data-i18n="no_pedidos">No hay pedidos aún</p>
                </div>
            </div>
        </div>

        <!-- FOOTER -->
        <footer class="footer">
            <span class="footer-text">
                <span class="brand">◈ Csariel's</span> — <span data-i18n="footer_delivery">Delivery · Entregas a domicilio</span>
            </span>
            <div class="footer-links">
                <a href="/" data-i18n="inicio">🏠 Inicio</a>
                <a href="/features/servicios/index.html" data-i18n="servicios">🔧 Servicios</a>
            </div>
        </footer>
    </div>

    <div class="toast" id="toast"></div>

    <!-- SCRIPTS -->
    <script>
        const CSARIELS_IDIOMA = {
            actual: 'es',
            traducciones: {},

            init: async function() {
                this.actual = localStorage.getItem('csariels_idioma') || 'es';
                await this.cargarTraducciones(this.actual);
                this.aplicarTraducciones();
                this.actualizarBotones();
                return this.actual;
            },

            cargarTraducciones: async function(idioma) {
                const traduccionesInline = {
                    es: {
                        'titulo_delivery': '🚚 Delivery | Csariel\'s',
                        'delivery': 'Delivery',
                        'inicio': 'Inicio',
                        'mi_red': 'Mi Red',
                        'live': 'Live',
                        'trading': 'Trading',
                        'volver_servicios': 'Volver a Servicios',
                        'titulo_main': '🚚 Delivery',
                        'sub_main': 'Solicita o gestiona entregas a domicilio',
                        'solicitar_entrega': '📦 Solicitar entrega',
                        'nombre_cliente': 'Nombre del cliente *',
                        'telefono': 'Teléfono *',
                        'direccion_entrega': 'Dirección de entrega *',
                        'descripcion_pedido': 'Descripción del pedido *',
                        'metodo_pago': 'Método de pago',
                        'monto_cmt': 'Monto en CMT *',
                        'btn_solicitar': 'Solicitar entrega',
                        'pedidos_recientes': '📋 Pedidos recientes',
                        'no_pedidos': 'No hay pedidos aún',
                        'footer_delivery': 'Delivery · Entregas a domicilio',
                        'servicios': 'Servicios'
                    },
                    en: {
                        'titulo_delivery': '🚚 Delivery | Csariel\'s',
                        'delivery': 'Delivery',
                        'inicio': 'Home',
                        'mi_red': 'My Network',
                        'live': 'Live',
                        'trading': 'Trading',
                        'volver_servicios': 'Back to Services',
                        'titulo_main': '🚚 Delivery',
                        'sub_main': 'Request or manage home deliveries',
                        'solicitar_entrega': '📦 Request Delivery',
                        'nombre_cliente': 'Client Name *',
                        'telefono': 'Phone *',
                        'direccion_entrega': 'Delivery Address *',
                        'descripcion_pedido': 'Order Description *',
                        'metodo_pago': 'Payment Method',
                        'monto_cmt': 'Amount in CMT *',
                        'btn_solicitar': 'Request Delivery',
                        'pedidos_recientes': '📋 Recent Orders',
                        'no_pedidos': 'No orders yet',
                        'footer_delivery': 'Delivery · Home deliveries',
                        'servicios': 'Services'
                    },
                    fr: {
                        'titulo_delivery': '🚚 Livraison | Csariel\'s',
                        'delivery': 'Livraison',
                        'inicio': 'Accueil',
                        'mi_red': 'Mon Réseau',
                        'live': 'Live',
                        'trading': 'Trading',
                        'volver_servicios': 'Retour aux Services',
                        'titulo_main': '🚚 Livraison',
                        'sub_main': 'Demandez ou gérez des livraisons à domicile',
                        'solicitar_entrega': '📦 Demander une livraison',
                        'nombre_cliente': 'Nom du client *',
                        'telefono': 'Téléphone *',
                        'direccion_entrega': 'Adresse de livraison *',
                        'descripcion_pedido': 'Description de la commande *',
                        'metodo_pago': 'Mode de paiement',
                        'monto_cmt': 'Montant en CMT *',
                        'btn_solicitar': 'Demander la livraison',
                        'pedidos_recientes': '📋 Commandes récentes',
                        'no_pedidos': 'Aucune commande pour le moment',
                        'footer_delivery': 'Livraison · Livraisons à domicile',
                        'servicios': 'Services'
                    }
                };
                this.traducciones = traduccionesInline[idioma] || traduccionesInline.es;
            },

            cambiar: function(idioma) {
                if (!idioma || idioma === this.actual) return;
                this.actual = idioma;
                localStorage.setItem('csariels_idioma', idioma);
                this.cargarTraducciones(idioma).then(() => {
                    this.aplicarTraducciones();
                    this.actualizarBotones();
                });
            },

            aplicarTraducciones: function() {
                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.getAttribute('data-i18n');
                    if (this.traducciones[key]) el.textContent = this.traducciones[key];
                });
            },

            actualizarBotones: function() {
                document.querySelectorAll('.lang-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.getAttribute('data-lang') === this.actual);
                });
            }
        };

        function mostrarToast(mensaje, tipo = '') {
            const toast = document.getElementById('toast');
            toast.textContent = mensaje;
            toast.className = `toast${tipo ? ' error' : ''}`;
            toast.classList.add('active');
            setTimeout(() => toast.classList.remove('active'), 3000);
        }

        // ===== SUPABASE =====
        const SUPABASE_URL = 'https://nvyyxgkladjauolvpzfp.supabase.co';
        const SUPABASE_ANON_KEY = 'TU_ANON_KEY_AQUI'; // Recuerda colocar tu llave de Supabase aquí si lo requiere tu entorno
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUserId = null;

        async function ensureAuth() {
            const { data: { session } } = await sb.auth.getSession();
            if (session?.user) {
                currentUserId = session.user.id;
                return currentUserId;
            }
            const { data, error } = await sb.auth.signInAnonymously();
            if (error) {
                console.error('Error de autenticación anónima:', error);
                mostrarToast('⚠️ No se pudo iniciar sesión', 'error');
                return null;
            }
            currentUserId = data.user.id;
            return currentUserId;
        }

        function toggleMontoCMT() {
            const metodo = document.getElementById('deliveryPago').value;
            document.getElementById('grupoMontoCMT').classList.toggle('oculto', metodo !== 'cmt');
        }

        let map = null;
        function initMap() {
            if (map) return;
            map = L.map('delivery-map').setView([19.0413, -98.2062], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19
            }).addTo(map);
        }

        async function crearPedido() {
            const nombre = document.getElementById('deliveryNombre').value.trim();
            const telefono = document.getElementById('deliveryTelefono').value.trim();
            const direccion = document.getElementById('deliveryDireccion').value.trim();
            const descripcion = document.getElementById('deliveryDescripcion').value.trim();
            const metodoPago = document.getElementById('deliveryPago').value;
            const montoCMTInput = document.getElementById('deliveryMontoCMT').value;

            if (!nombre || !telefono || !direccion || !descripcion) {
                mostrarToast('⚠️ Completa todos los campos obligatorios', 'error');
                return;
            }

            let montoCMT = null;
            if (metodoPago === 'cmt') {
                montoCMT = parseFloat(montoCMTInput);
                if (!montoCMT || montoCMT <= 0) {
                    mostrarToast('⚠️ Ingresa un monto válido en CMT', 'error');
                    return;
                }
            }

            const userId = await ensureAuth();
            if (!userId) return;

            const btn = document.getElementById('btnCrearPedido');
            btn.disabled = true;

            const { data, error } = await sb.rpc('crear_pedido_delivery', {
                p_nombre: nombre,
                p_telefono: telefono,
                p_direccion: direccion,
                p_descripcion: descripcion,
                p_metodo_pago: metodoPago,
                p_monto_cmt: montoCMT,
                p_lat: null,
                p_lng: null
            });

            btn.disabled = false;

            if (error) {
                console.error('Error creando pedido:', error);
                if (error.message && error.message.includes('Saldo insuficiente')) {
                    mostrarToast('⚠️ Saldo CMT insuficiente', 'error');
                } else {
                    mostrarToast('⚠️ No se pudo crear el pedido', 'error');
                }
                return;
            }

            mostrarToast('✅ Pedido creado exitosamente');
            document.getElementById('deliveryNombre').value = '';
            document.getElementById('deliveryTelefono').value = '';
            document.getElementById('deliveryDireccion').value = '';
            document.getElementById('deliveryDescripcion').value = '';
            document.getElementById('deliveryMontoCMT').value = '';

            await cargarPedidos();
        }

        function renderPedidos(pedidos) {
            const lista = document.getElementById('pedidosList');

            if (!pedidos || pedidos.length === 0) {
                lista.innerHTML = `
                    <div style="text-align:center;padding:30px;color:var(--text-muted);">
                        <div style="font-size:2rem;opacity:0.3;margin-bottom:8px;">📭</div>
                        <p>No hay pedidos aún</p>
                    </div>`;
                return;
            }

            const iconosPago = { efectivo: '💵', transferencia: '🏦', cmt: '🪙' };
            const etiquetasEstado = {
                pendiente: 'Pendiente',
                en_camino: 'En camino',
                entregado: 'Entregado',
                cancelado: 'Cancelado'
            };

            lista.innerHTML = pedidos.map(p => `
                <div class="pedido-item">
                    <div class="pedido-info">
                        <div class="pedido-desc">${escapeHTML(p.descripcion)}</div>
                        <div class="pedido-meta">
                            ${iconosPago[p.metodo_pago] || '💳'} ${escapeHTML(p.direccion)}
                            ${p.monto_cmt ? ' · ' + p.monto_cmt + ' CMT' : ''}
                            · ${new Date(p.created_at).toLocaleString('es-MX')}
                        </div>
                    </div>
                    <span class="estado-badge estado-${p.estado}">${etiquetasEstado[p.estado] || p.estado}</span>
                </div>
            `).join('');
        }

        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str ?? '';
            return div.innerHTML;
        }

        async function cargarPedidos() {
            if (!currentUserId) return;
            const { data, error } = await sb
                .from('pedidos_delivery')
                .select('*')
                .eq('user_id', currentUserId)
                .order('created_at', { ascending: false })
                .limit(20);

            if (error) {
                console.error('Error cargando pedidos:', error);
                return;
            }
            renderPedidos(data);
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await CSARIELS_IDIOMA.init();
            initMap();
            await ensureAuth();
            await cargarPedidos();
        });
    </script>
</body>
</html>
