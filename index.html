<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>◈ Csariel's | Red Social Integral</title>
  <meta name="description" content="Red Social Integral con IA, eSIM y Web3" />
  <meta name="theme-color" content="#0B3D2E" />
  
  <!-- ================================================================ -->
  <!-- 🔒 CSP - SEGURIDAD CONTRA INYECCIONES Y HACKEOS -->
  <!-- ================================================================ -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com https://*.supabase.co https://*.polygon.technology https://cdn.tailwindcss.com;
    style-src 'self' https://cdnjs.cloudflare.com https://fonts.googleapis.com https://cdn.tailwindcss.com 'unsafe-inline';
    font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;
    img-src 'self' data: https://*;
    connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.polygon.technology;
    frame-src 'self';
    media-src 'self';
    object-src 'none';
    base-uri 'self';
    form-action 'self';
  ">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet" />
  
  <!-- ================================================================ -->
  <!-- 🔒 SEGURIDAD CSARIEL'S - ANTI-HACKEO -->
  <!-- ================================================================ -->
  <script src="./js/security.js"></script>
  
  <style>
    /* ================================================================
       TODOS TUS ESTILOS EXISTENTES (MANTENIDOS)
       ================================================================ */
    :root {
      --space-deep: #05080f;
      --space-mid: #0a1428;
      --space-light: #101f3a;
      --verde-bosque: #0B3D2E;
      --verde-bosque-light: #1a5a44;
      --verde-bosque-glass: rgba(11,61,46,0.85);
      --gold-cosmic: #f7d44a;
      --gold-dim: rgba(247,212,74,0.15);
      --gold-glow: rgba(247,212,74,0.25);
      --nebula-1: #6c2bd9;
      --nebula-2: #ff6b9d;
      --nebula-3: #00d4ff;
      --plasma: #ff3366;
      --quantum: #00e5ff;
      --text-primary: #e8f0f8;
      --text-secondary: #8ba3c7;
      --text-muted: #4a6a8a;
      --border: rgba(247,212,74,0.08);
      --border-glow: rgba(247,212,74,0.25);
      --shadow-neon: 0 0 40px rgba(247,212,74,0.08);
      --shadow-glow: 0 0 60px rgba(11,61,46,0.3);
      --radius: 20px;
      --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      --success: #00b894;
      --warning: #f7d44a;
      --danger: #ff3366;
      --emerald-green: #00d68f;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--space-deep);
      color: var(--text-primary);
      font-family: 'Space Grotesk', 'Inter', system-ui, sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    #stars-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .nebula {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.10;
      pointer-events: none;
      z-index: 0;
      animation: nebula-drift 25s ease-in-out infinite alternate;
    }

    .nebula-1 { width: 700px; height: 700px; background: var(--verde-bosque); top: -15%; right: -15%; }
    .nebula-2 { width: 600px; height: 600px; background: var(--gold-cosmic); bottom: -15%; left: -15%; animation-delay: -8s; opacity: 0.05; }
    .nebula-3 { width: 500px; height: 500px; background: var(--nebula-3); top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: -15s; opacity: 0.04; }

    @keyframes nebula-drift {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, -30px) scale(1.15); }
    }

  </style>
</head>
<body>
  <!-- ===== FONDO ESTELAR ===== -->
  <canvas id="stars-canvas"></canvas>
  <div class="nebula nebula-1"></div>
  <div class="nebula nebula-2"></div>
  <div class="nebula nebula-3"></div>

  <!-- ===== CONTENIDO ===== -->
  <div class="app">
    <!-- HEADER -->
    <header class="header">
      <a href="#" class="logo">
        <span class="logo-icon"><span class="hex">◈</span></span>
        <span class="logo-text">Csariel's</span>
        <span class="logo-badge">Inicio</span>
      </a>
      <div class="header-actions">
        <div class="status-badge">
          <span class="status-dot online"></span>
          <span>En línea</span>
        </div>
        <a href="./mi-red.html" class="btn btn-primary btn-sm">
          <i class="fas fa-users"></i> Mi Red
        </a>
        <button class="btn btn-gold btn-sm" onclick="window.marquinhosUI?.toggleVentana()">
          <i class="fas fa-brain"></i> 🧠 Marquinhos
        </button>
        <a href="./dashboard-emerald.html" class="btn btn-outline btn-sm">
          <i class="fas fa-cog"></i> Admin
        </a>
      </div>
    </header>

    <!-- HERO -->
    <section class="hero">
      <div class="hero-content">
        <h1 class="hero-title">
          Bienvenido a <span class="highlight">Csariel's</span>
        </h1>
        <p class="hero-sub">
          Red Social Integral · IA · eSIM · Web3
        </p>
        <div class="hero-metrics">
          <div class="metric">
            <span class="number">🌐</span>
            <span class="label">Red Social</span>
          </div>
          <div class="metric">
            <span class="number">📶</span>
            <span class="label">eSIM</span>
          </div>
          <div class="metric">
            <span class="number">🧠</span>
            <span class="label">Marquinhos IA</span>
          </div>
          <div class="metric">
            <span class="number">🔗</span>
            <span class="label">Web3</span>
          </div>
        </div>
      </div>
    </section>

  </div>

</body>
</html>
