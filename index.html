<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Csariel's · Inicio</title>
    <meta name="theme-color" content="#0F2D1A" />

    <!-- 🔒 CSP -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com https://*.supabase.co https://*.polygon.technology;
        style-src 'self' https://cdnjs.cloudflare.com https://fonts.googleapis.com 'unsafe-inline';
        font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;
        img-src 'self' data: https://*;
        connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.polygon.technology;
        frame-src 'self';
        media-src 'self';
        object-src 'none';
        base-uri 'self';
        form-action 'self';
    ">

    <!-- ===== FUENTES Y FONTAWESOME ===== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet" />

    <!-- ===== ESTILOS CON FALLO DE RESPALDO ===== -->
    <style>
        /* ================================================================
           ESTILOS CON COLOR DE RESPALDO (para que nunca se vea blanco)
           ================================================================ */
        :root {
            --space-deep: #05080f;
            --space-mid: #0a1428;
            --verde-bosque: #0F2D1A;
            --verde-bosque-light: #1a4a2a;
            --gold-cosmic: #D4AF37;
            --gold-dim: rgba(212,175,55,0.15);
            --gold-glow: rgba(212,175,55,0.25);
            --text-primary: #e8f0f8;
            --text-secondary: #8ba3c7;
            --text-muted: #4a6a8a;
            --border: rgba(212,175,55,0.08);
            --border-glow: rgba(212,175,55,0.25);
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --success: #00b894;
            --danger: #ff3366;
            --warning: #D4AF37;
            --quantum: #00e5ff;
        }

        /* FALLBACK: si las variables fallan, el body tiene un color sólido */
        body {
            background: #05080f; /* ← color de respaldo */
            background: var(--space-deep);
            color: #e8f0f8;
            color: var(--text-primary);
            font-family: 'Space Grotesk', 'Inter', system-ui, sans-serif;
            line-height: 1.5;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            position: relative;
        }

        #stars-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .app {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px 20px 30px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== RESTO DE ESTILOS (igual que antes) ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0 16px;
            border-bottom: 2px solid var(--gold-dim);
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
            backdrop-filter: blur(10px);
            position: relative;
        }
        .header::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-cosmic), var(--verde-bosque), var(--gold-cosmic), transparent);
            opacity: 0.4;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        .logo-icon { font-size: 2rem; filter: drop-shadow(0 0 20px rgba(212,175,55,0.2)); animation: pulse-glow 3s ease-in-out infinite; }
        .logo-icon .hex {
            display: inline-block;
            background: var(--verde-bosque);
            color: var(--gold-cosmic);
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 900;
            border: 2px solid var(--gold-cosmic);
            font-family: 'Orbitron', monospace;
        }
        @keyframes pulse-glow { 0%, 100% { filter: drop-shadow(0 0 20px rgba(212,175,55,0.2)); } 50% { filter: drop-shadow(0 0 40px rgba(212,175,55,0.4)); } }

        .logo-text {
            font-family: 'Orbitron', monospace;
            font-size: 1.3rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--gold-cosmic), var(--verde-bosque-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo-badge {
            font-family: 'Orbitron', monospace;
            font-size: 0.45rem;
            background: linear-gradient(135deg, var(--verde-bosque), var(--gold-cosmic));
            color: white;
            padding: 3px 12px;
            border-radius: 20px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            -webkit-text-fill-color: white;
            border: 1px solid rgba(212,175,55,0.2);
            animation: badge-pulse 2s ease-in-out infinite;
        }
        @keyframes badge-pulse { 0%, 100% { box-shadow: 0 0 30px rgba(15,45,26,0.3); } 50% { box-shadow: 0 0 60px rgba(212,175,55,0.2); } }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 16px;
            border: 1px solid var(--border);
            border-radius: 30px;
            background: rgba(212,175,55,0.03);
            color: var(--text-primary);
            font-family: 'Orbitron', monospace;
            font-size: 0.6rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
        }
        .btn:hover { transform: scale(1.02); border-color: var(--border-glow); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }

        .btn-primary {
            background: linear-gradient(135deg, var(--verde-bosque), var(--verde-bosque-light));
            border-color: var(--gold-cosmic);
            color: var(--gold-cosmic);
            -webkit-text-fill-color: var(--gold-cosmic);
        }
        .btn-primary:hover:not(:disabled) {
            background: linear-gradient(135deg, var(--verde-bosque-light), var(--verde-bosque));
            box-shadow: 0 0 40px rgba(15,45,26,0.5);
        }
        .btn-gold {
            background: linear-gradient(135deg, var(--gold-cosmic), #b8923a);
            border-color: transparent;
            color: #0a0c10;
            -webkit-text-fill-color: #0a0c10;
        }
        .btn-gold:hover:not(:disabled) { box-shadow: 0 0 40px rgba(212,175,55,0.3); }
        .btn-outline { border-color: var(--border); background: transparent; }
        .btn-outline:hover:not(:disabled) { background: rgba(212,175,55,0.05); border-color: var(--gold-cosmic); }
        .btn-sm { padding: 4px 12px; font-size: 0.55rem; }

        .footer {
            margin-top: 40px;
            padding-top: 14px;
            border-top: 1px solid var(--gold-dim);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            position: relative;
        }
        .footer::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-cosmic), transparent);
            opacity: 0.2;
        }
        .footer-text {
            color: var(--text-muted);
            font-size: 0.5rem;
            letter-spacing: 0.5px;
            font-family: 'Orbitron', monospace;
        }
        .footer-text .brand { color: var(--gold-cosmic); }
        .footer-links { display: flex; gap: 8px; flex-wrap: wrap; }
        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.5rem;
            transition: var(--transition);
            font-family: 'Orbitron', monospace;
            letter-spacing: 0.5px;
        }
        .footer-links a:hover { color: var(--gold-cosmic); }
        .footer-hex {
            display: inline-block;
            background: var(--verde-bosque);
            color: var(--gold-cosmic);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.45rem;
            font-weight: 700;
            border: 1px solid var(--gold-cosmic);
            font-family: 'Orbitron', monospace;
        }

        /* ===== LOGIN CARD ===== */
        .login-card {
            background: rgba(15,45,26,0.25);
            border: 1px solid var(--gold-dim);
            border-radius: var(--radius);
            padding: 32px 28px;
            max-width: 480px;
            margin: 20px auto;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
            flex: 1;
        }
        .login-card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(135deg, var(--gold-cosmic), var(--verde-bosque), var(--gold-cosmic));
            background-size: 300% 300%;
            border-radius: var(--radius);
            z-index: -1;
            opacity: 0.1;
            animation: border-flow 4s ease-in-out infinite;
        }
        @keyframes border-flow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .login-card .title {
            font-family: 'Orbitron', monospace;
            font-size: 1.2rem;
            text-align: center;
            color: var(--gold-cosmic);
            margin-bottom: 4px;
        }
        .login-card .subtitle {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.8rem;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-size: 0.6rem;
            color: var(--text-muted);
            font-family: 'Orbitron', monospace;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-group input {
            width: 100%;
            padding: 10px 14px;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--gold-dim);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 0.9rem;
            outline: none;
            transition: var(--transition);
            font-family: 'Space Grotesk', sans-serif;
        }
        .form-group input:focus {
            border-color: var(--gold-cosmic);
        }
        .form-group input::placeholder {
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .btn-login {
            width: 100%;
            justify-content: center;
            padding: 12px;
            font-size: 0.75rem;
            margin-top: 8px;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 18px 0;
            color: var(--text-muted);
            font-size: 0.6rem;
            font-family: 'Orbitron', monospace;
        }
        .divider hr {
            flex: 1;
            border: none;
            border-top: 1px solid var(--gold-dim);
        }

        .btn-google {
            width: 100%;
            justify-content: center;
            background: rgba(255,255,255,0.05);
            border-color: rgba(255,255,255,0.1);
            color: var(--text-primary);
            padding: 10px;
            font-size: 0.7rem;
        }
        .btn-google:hover {
            background: rgba(255,255,255,0.1);
            border-color: var(--gold-cosmic);
        }

        .terms-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.55rem;
            color: var(--text-muted);
            margin: 12px 0 6px;
            flex-wrap: wrap;
        }
        .terms-row a {
            color: var(--gold-cosmic);
            text-decoration: underline;
        }
        .terms-row input {
            accent-color: var(--gold-cosmic);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .login-footer-text {
            text-align: center;
            font-size: 0.6rem;
            color: var(--text-muted);
            margin-top: 14px;
        }

        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--verde-bosque);
            color: var(--gold-cosmic);
            padding: 10px 20px;
            border-radius: var(--radius);
            font-weight: 600;
            font-size: 0.7rem;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 5000;
            pointer-events: none;
            font-family: 'Orbitron', monospace;
            border: 1px solid rgba(212,175,55,0.15);
            max-width: 90%;
            text-align: center;
        }
        .toast.active { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.error { background: var(--danger); color: white; }

        @media (max-width: 480px) {
            .login-card { padding: 20px 16px; }
            .login-card .title { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <canvas id="stars-canvas"></canvas>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <!-- ================================================================ -->
    <!-- 🔥 SCRIPTS (cargados al final para no bloquear el renderizado) -->
    <!-- ================================================================ -->
    <script>
        // ================================================================
        // 🔐 TOAST
        // ================================================================
        let toastTimeout = null;
        function mostrarToast(mensaje, tipo = '') {
            const toast = document.getElementById('toast');
            toast.textContent = mensaje;
            toast.className = `toast${tipo ? ' error' : ''}`;
            toast.classList.add('active');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.remove('active'), 3000);
        }

        // ================================================================
        // 🌟 ESTRELLAS
        // ================================================================
        function initStars() {
            const canvas = document.getElementById('stars-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let width, height;
            let stars = [];
            const STAR_COUNT = 200;

            function resize() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
            }
            function createStars() {
                stars = [];
                for (let i = 0; i < STAR_COUNT; i++) {
                    stars.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        radius: Math.random() * 1.5 + 0.3,
                        speed: Math.random() * 0.015 + 0.005,
                        opacity: Math.random() * 0.7 + 0.3,
                        twinkleSpeed: Math.random() * 0.02 + 0.01,
                        twinklePhase: Math.random() * Math.PI * 2
                    });
                }
            }
            function draw() {
                ctx.clearRect(0, 0, width, height);
                for (let star of stars) {
                    const opacity = star.opacity * (0.6 + 0.4 * Math.sin(star.twinklePhase));
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
                    ctx.fill();
                    star.twinklePhase += star.twinkleSpeed;
                    star.y += star.speed;
                    if (star.y > height) {
                        star.y = 0;
                        star.x = Math.random() * width;
                    }
                }
                requestAnimationFrame(draw);
            }
            resize();
            createStars();
            draw();
            window.addEventListener('resize', () => { resize(); createStars(); });
        }

        // ================================================================
        // 👤 GUARDAR PERFIL EN SUPABASE
        // ================================================================
        async function guardarPerfilSupabase(uid, { nombre, email, phone } = {}) {
            if (!window.supabase) return false;
            const payload = { user_id: uid, ultimo_acceso: new Date().toISOString() };
            if (nombre) payload.nombre = nombre;
            if (email) payload.email = email;
            if (phone) payload.telefono = phone;

            const { error } = await window.supabase
                .from('perfiles')
                .upsert(payload, { onConflict: 'user_id' });

            if (error) {
                console.warn('⚠️ Error guardando perfil en Supabase:', error);
                return false;
            }
            return true;
        }

        // ================================================================
        // 🚀 LOGIN
        // ================================================================
        async function handleLogin() {
            const username = document.getElementById('inputUsername').value.trim();
            const email = document.getElementById('inputEmail').value.trim();
            const phone = document.getElementById('inputPhone').value.trim();
            const accept = document.getElementById('acceptTerms').checked;

            if (!username || username.length < 2) {
                mostrarToast('⚠️ Ingresa un nombre de usuario válido', 'error');
                return;
            }
            if (!accept) {
                mostrarToast('⚠️ Debes aceptar los Términos y Condiciones', 'error');
                return;
            }

            // Guardar en localStorage
            localStorage.setItem('csariels_user_name', username);
            if (email) localStorage.setItem('csariels_email', email);
            if (phone) localStorage.setItem('csariels_phone', phone);
            localStorage.setItem('csariels_login', 'true');
            localStorage.setItem('csariels_member_since', new Date().getFullYear());

            let supabaseOk = false;
            if (window.supabase) {
                try {
                    const { data: { session } } = await window.supabase.auth.getSession();
                    let uid = session?.user?.id;
                    if (!uid) {
                        const { data, error } = await window.supabase.auth.signInAnonymously();
                        if (error) throw error;
                        uid = data.session.user.id;
                        console.log('🆕 Sesión anónima creada:', uid);
                    }
                    localStorage.setItem('csariels_user_id', uid);
                    supabaseOk = await guardarPerfilSupabase(uid, { nombre: username, email, phone });
                    if (supabaseOk) console.log('✅ Perfil guardado en Supabase con uid:', uid);
                } catch (e) {
                    console.warn('⚠️ Supabase no disponible, guardando solo en localStorage:', e);
                }
            }

            if (!localStorage.getItem('csariels_user_id')) {
                localStorage.setItem('csariels_user_id', 'user_' + Date.now() + '_' + Math.random().toString(36).substring(2, 9));
            }

            const mensaje = supabaseOk
                ? '✅ Bienvenido ' + username + '! (datos en Supabase)'
                : '✅ Bienvenido ' + username + '! (modo local)';
            mostrarToast(mensaje);
            setTimeout(() => {
                window.location.href = './features/usuario/index.html';
            }, 800);
        }

        // ================================================================
        // 🔵 GOOGLE OAUTH
        // ================================================================
        async function loginWithGoogle() {
            if (!window.supabase) {
                mostrarToast('⚠️ Supabase no está disponible', 'error');
                return;
            }
            const accept = document.getElementById('acceptTerms').checked;
            if (!accept) {
                mostrarToast('⚠️ Debes aceptar los Términos y Condiciones', 'error');
                return;
            }

            try {
                const { data: { session } } = await window.supabase.auth.getSession();
                const redirectTo = window.location.origin + window.location.pathname;

                if (session?.user?.is_anonymous) {
                    const { error } = await window.supabase.auth.linkIdentity({
                        provider: 'google',
                        options: { redirectTo }
                    });
                    if (error) throw error;
                } else {
                    const { error } = await window.supabase.auth.signInWithOAuth({
                        provider: 'google',
                        options: { redirectTo }
                    });
                    if (error) throw error;
                }
            } catch (e) {
                console.error(e);
                mostrarToast('⚠️ No se pudo iniciar con Google: ' + e.message, 'error');
            }
        }

        // ================================================================
        // 🔁 PROCESAR RETORNO DE GOOGLE
        // ================================================================
        async function handleOAuthReturn() {
            if (!window.supabase) return;
            const { data: { session } } = await window.supabase.auth.getSession();
            if (!session?.user || session.user.is_anonymous) return;

            const uid = session.user.id;
            const nombreGoogle = session.user.user_metadata?.full_name || session.user.user_metadata?.name || 'Usuario';
            const emailGoogle = session.user.email || null;

            localStorage.setItem('csariels_user_id', uid);
            localStorage.setItem('csariels_user_name', nombreGoogle);
            if (emailGoogle) localStorage.setItem('csariels_email', emailGoogle);
            localStorage.setItem('csariels_login', 'true');

            await guardarPerfilSupabase(uid, { nombre: nombreGoogle, email: emailGoogle });

            mostrarToast('✅ Bienvenido ' + nombreGoogle + '! (Google)');
            setTimeout(() => {
                window.location.href = './features/usuario/index.html';
            }, 600);
        }

        // ================================================================
        // 🚀 INICIALIZAR
        // ================================================================
        document.addEventListener('DOMContentLoaded', async function() {
            // Inicializar estrellas
            initStars();

            // Seguridad
            if (window.Security) {
                window.Security.initSeguridad();
                console.log('🛡️ Seguridad activada');
            }

            console.log('◈ Csariel\'s - Inicio (modo híbrido)');

            // Procesar retorno de Google
            await handleOAuthReturn();

            // Redirigir si ya hay sesión local
            if (localStorage.getItem('csariels_login') === 'true') {
                const username = localStorage.getItem('csariels_user_name');
                if (username) {
                    mostrarToast('✅ Sesión activa como ' + username + '. Redirigiendo...');
                    setTimeout(() => {
                        window.location.href = './features/usuario/index.html';
                    }, 600);
                }
            }

            // Enter para enviar
            document.querySelectorAll('#inputUsername, #inputEmail, #inputPhone').forEach(input => {
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') handleLogin();
                });
            });
        });

        // Exponer funciones globales
        window.handleLogin = handleLogin;
        window.loginWithGoogle = loginWithGoogle;
        window.mostrarToast = mostrarToast;
    </script>
</body>
</html>
