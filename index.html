  <style>
    /* ================================================================

    :root {
      --space-deep: #05080f;
      --space-mid: #0a1428;
      --space-light: #101f3a;
      --verde-bosque: #0B3D2E;
      --verde-bosque-light: #1a5a44;
      --verde-bosque-glass: rgba(11,61,46,0.85);
      --gold-cosmic: #f7d44a;
      --gold-dim: rgba(247,212,74,0.15);
      --gold-glow: rgba(247,212,74,0.25);
      --nebula-1: #6c2bd9;
      --nebula-2: #ff6b9d;
      --nebula-3: #00d4ff;
      --plasma: #ff3366;
      --quantum: #00e5ff;
      --text-primary: #e8f0f8;
      --text-secondary: #8ba3c7;
      --text-muted: #4a6a8a;
      --border: rgba(247,212,74,0.08);
      --border-glow: rgba(247,212,74,0.25);
      --shadow-neon: 0 0 40px rgba(247,212,74,0.08);
      --shadow-glow: 0 0 60px rgba(11,61,46,0.3);
      --radius: 20px;
      --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      --success: #00b894;
      --warning: #f7d44a;
      --danger: #ff3366;
      --emerald-green: #00d68f;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--space-deep);
      color: var(--text-primary);
      font-family: 'Space Grotesk', 'Inter', system-ui, sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    #stars-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .nebula {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.10;
      pointer-events: none;
      z-index: 0;
      animation: nebula-drift 25s ease-in-out infinite alternate;
    }

    .nebula-1 { width: 700px; height: 700px; background: var(--verde-bosque); top: -15%; right: -15%; }
    .nebula-2 { width: 600px; height: 600px; background: var(--gold-cosmic); bottom: -15%; left: -15%; animation-delay: -8s; opacity: 0.05; }
    .nebula-3 { width: 500px; height: 500px; background: var(--nebula-3); top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: -15s; opacity: 0.04; }

    @keyframes nebula-drift {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, -30px) scale(1.15); }
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--space-deep); }
    ::-webkit-scrollbar-thumb { background: linear-gradient(var(--gold-cosmic), var(--verde-bosque)); border-radius: 3px; }

    .app {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 24px 40px;
    }

    /* ... (rest of original content preserved) ... */
  </style>
</head>
