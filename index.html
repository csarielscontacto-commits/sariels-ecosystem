<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marquinhos</title>
  <style>
    :root{
      --bg:#071019;
      --bg2:#0c1726;
      --card:rgba(9,15,24,.74);
      --blue:#1a237e;
      --blue2:#2f47cc;
      --white:#fbfdff;
      --gold:#d7b35c;
      --gold2:#b88b2d;
      --pink:#ffccd8;
      --shadow:rgba(0,0,0,.35);
      --glow:rgba(215,179,92,.22);
      --speed:.28s;
      --idle:4s;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      overflow:hidden;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      background:
        radial-gradient(circle at top, #173757 0%, #0a121d 38%, var(--bg) 100%);
      color:#fff;
    }

    .scene{
      position:relative;
      width:100vw;
      height:100vh;
      display:grid;
      place-items:center;
      perspective:1200px;
      perspective-origin:50% 42%;
    }

    .ambient{
      position:absolute;
      width:540px;
      height:540px;
      border-radius:50%;
      background:radial-gradient(circle, rgba(215,179,92,.16) 0%, rgba(47,71,204,.08) 35%, transparent 70%);
      filter:blur(8px);
      transform:translateY(40px);
    }

    .shadow{
      position:absolute;
      bottom:10%;
      width:250px;
      height:42px;
      border-radius:50%;
      background:radial-gradient(circle, rgba(0,0,0,.4) 0%, rgba(0,0,0,.18) 45%, transparent 70%);
      filter:blur(6px);
      transform:scale(1.15);
    }

    .marquinhos{
      position:relative;
      width:300px;
      transform-style:preserve-3d;
      animation:float 4.5s ease-in-out infinite;
      filter:drop-shadow(0 28px 34px rgba(0,0,0,.34));
    }

    .card{
      background:linear-gradient(180deg, rgba(15,23,36,.8), rgba(7,12,20,.82));
      border:1px solid rgba(255,255,255,.08);
      border-radius:30px;
      padding:18px 18px 16px;
      backdrop-filter:blur(10px);
      transform:rotateX(2deg);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.05),
        0 10px 30px rgba(0,0,0,.22);
    }

    .head{
      position:relative;
      width:184px;
      height:168px;
      margin:0 auto;
      border:4px solid var(--blue);
      border-radius:50% 50% 42% 42%;
      overflow:hidden;
      background:
        radial-gradient(circle at 35% 25%, rgba(255,255,255,.95) 0 28%, rgba(245,249,255,.98) 42%, #edf2ff 72%, #dfe9ff 100%);
      box-shadow:
        inset 0 16px 18px rgba(255,255,255,.75),
        inset 0 -18px 30px rgba(20,40,90,.06),
        0 10px 24px rgba(0,0,0,.15);
      transform:translateZ(26px);
    }

    .head::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(circle at 22px 20px, rgba(26,35,126,.9) 0 2px, transparent 2.5px),
        radial-gradient(circle at 46px 42px, rgba(26,35,126,.75) 0 2px, transparent 2.5px),
        radial-gradient(circle at 70px 18px, rgba(26,35,126,.5) 0 2px, transparent 2.5px),
        radial-gradient(circle at 118px 24px, rgba(26,35,126,.45) 0 2px, transparent 2.5px),
        radial-gradient(circle at 146px 48px, rgba(26,35,126,.72) 0 2px, transparent 2.5px);
      background-size:56px 56px;
      opacity:.22;
      mix-blend-mode:multiply;
      pointer-events:none;
    }

    .head::after{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(145deg, rgba(255,255,255,.72), transparent 22%),
        linear-gradient(330deg, transparent 58%, rgba(26,35,126,.06) 100%);
      pointer-events:none;
    }

    .antenna{
      position:absolute;
      top:-24px;
      width:6px;
      height:30px;
      border-radius:999px;
      background:linear-gradient(180deg, var(--blue2), var(--blue));
      transform-origin:bottom center;
      animation:sway 3.2s ease-in-out infinite alternate;
      box-shadow:0 0 12px rgba(47,71,204,.25);
    }
    .antenna::after{
      content:"";
      position:absolute;
      left:50%;
      top:-8px;
      width:12px;
      height:12px;
      transform:translateX(-50%);
      border-radius:50%;
      background:radial-gradient(circle, #ffe9ab 0%, var(--gold) 55%, var(--gold2) 100%);
      box-shadow:0 0 16px rgba(215,179,92,.7);
    }
    .antenna.left{left:58px}
    .antenna.right{right:58px; animation-delay:.14s}

    .brow{
      position:absolute;
      top:32px;
      width:34px;
      height:8px;
      border-top:4px solid var(--blue);
      border-radius:50%;
      z-index:4;
      opacity:.95;
      transition:transform .25s ease, top .25s ease;
    }
    .brow.left{left:30px; transform:rotate(-8deg)}
    .brow.right{right:30px; transform:rotate(8deg)}

    .eye{
      position:absolute;
      top:46px;
      width:42px;
      height:50px;
      border-radius:50%;
      overflow:hidden;
      background:#111;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.1);
    }
    .eye.left{left:30px}
    .eye.right{right:30px}

    .eye::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(circle at 50% 42%, #fff 0 56%, #eef4ff 66%, #d7e1ff 100%);
      border-radius:50%;
      transform:scaleY(.74);
    }

    .eye::after{
      content:"";
      position:absolute;
      left:8px;
      right:8px;
      top:-2px;
      height:0;
      background:var(--white);
      border-bottom:3px solid var(--blue);
      border-radius:50%;
      z-index:3;
      transition:height .2s ease;
    }

    .iris{
      position:absolute;
      z-index:2;
      width:18px;
      height:18px;
      left:12px;
      top:14px;
      border-radius:50%;
      background:radial-gradient(circle at 35% 35%, #5dd7ff 0 16%, #0d5aa3 38%, #061635 74%, #030814 100%);
      box-shadow:0 0 8px rgba(0,229,255,.2);
      animation:look 4.8s linear infinite;
    }

    .iris::before{
      content:"";
      position:absolute;
      width:7px;
      height:7px;
      left:3px;
      top:3px;
      border-radius:50%;
      background:#fff;
      opacity:.9;
    }

    .mouth{
      position:absolute;
      left:50%;
      bottom:33px;
      width:42px;
      height:18px;
      border-bottom:4px solid var(--blue);
      border-radius:0 0 50% 50%;
      transform:translateX(-50%);
      transition:all var(--speed) ease;
      box-shadow:0 0 0 1px rgba(26,35,126,.02);
    }

    .cheek{
      position:absolute;
      bottom:36px;
      width:22px;
      height:14px;
      border-radius:50%;
      background:var(--pink);
      filter:blur(4px);
      opacity:.82;
    }
    .cheek.left{left:18px}
    .cheek.right{right:18px}

    .chin{
      position:absolute;
      left:50%;
      bottom:12px;
      width:64px;
      height:18px;
      transform:translateX(-50%);
      border-radius:50%;
      background:radial-gradient(circle, rgba(26,35,126,.08) 0%, transparent 70%);
      opacity:.9;
    }

    .body{
      position:relative;
      width:206px;
      height:214px;
      margin:-8px auto 0;
      border:4px solid var(--blue);
      border-radius:28px 28px 36px 36px;
      overflow:hidden;
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,.96) 0 24%, rgba(246,249,255,.98) 45%, #edf3ff 85%, #dce5fb 100%);
      box-shadow:
        inset 0 14px 18px rgba(255,255,255,.7),
        inset 0 -18px 30px rgba(20,40,90,.08),
        0 12px 24px rgba(0,0,0,.13);
      transform:translateZ(18px);
      animation:breathe var(--idle) ease-in-out infinite;
    }

    .body::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(135deg, transparent 0 44%, rgba(26,35,126,.12) 44% 48%, transparent 48% 100%),
        radial-gradient(circle at 15% 18%, rgba(215,179,92,.18) 0 2px, transparent 3px),
        radial-gradient(circle at 82% 22%, rgba(215,179,92,.14) 0 2px, transparent 3px),
        radial-gradient(circle at 25% 70%, rgba(26,35,126,.08) 0 2px, transparent 3px),
        radial-gradient(circle at 76% 66%, rgba(26,35,126,.08) 0 2px, transparent 3px);
      opacity:.28;
      background-size:62px 62px;
      pointer-events:none;
    }

    .chest{
      position:absolute;
      left:50%;
      top:18px;
      width:110px;
      height:58px;
      transform:translateX(-50%);
      border:4px solid var(--gold2);
      border-radius:18px;
      background:linear-gradient(180deg, rgba(215,179,92,.28), rgba(215,179,92,.08));
      box-shadow:
        inset 0 0 14px rgba(215,179,92,.16),
        0 8px 14px rgba(0,0,0,.05);
    }

    .chest::before{
      content:"MARQUINHOS";
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      font-weight:900;
      letter-spacing:1.4px;
      font-size:11px;
      color:var(--gold);
      text-shadow:0 0 10px rgba(215,179,92,.2);
    }

    .arm{
      position:absolute;
      top:30px;
      width:26px;
      height:100px;
      border:4px solid var(--blue);
      border-radius:15px;
      background:
        linear-gradient(180deg, #fff, #edf3ff);
      transform-origin:top center;
      box-shadow:inset 0 0 12px rgba(255,255,255,.45);
    }
    .arm.left{left:-14px; transform:rotate(-12deg)}
    .arm.right{right:-14px; transform:rotate(12deg)}

    .forearm{
      position:absolute;
      left:0;
      top:76px;
      width:22px;
      height:84px;
      border:3px solid var(--blue);
      border-radius:12px;
      background:linear-gradient(180deg, #fff, #edf3ff);
      transform-origin:top center;
      box-shadow:inset 0 0 10px rgba(255,255,255,.45);
    }

    .hand{
      position:absolute;
      left:-8px;
      top:72px;
      width:36px;
      height:36px;
      border:3px solid var(--blue);
      border-radius:50%;
      background:
        radial-gradient(circle at 35% 30%, #fff 0 26%, #eef4ff 58%, #dce6fb 100%);
      transform-origin:center;
      box-shadow:inset 0 0 10px rgba(255,255,255,.4);
    }

    .hand::after{
      content:"";
      position:absolute;
      inset:8px;
      border-radius:50%;
      background:radial-gradient(circle, rgba(215,179,92,.22) 0%, transparent 68%);
      opacity:.7;
    }

    .finger{
      position:absolute;
      top:2px;
      width:7px;
      height:15px;
      border:1px solid var(--blue);
      border-radius:4px;
      background:#fff;
      transform-origin:bottom center;
    }
    .finger:nth-child(1){left:4px}
    .finger:nth-child(2){left:13px}
    .finger:nth-child(3){left:22px}

    .leg{
      position:absolute;
      bottom:-6px;
      width:34px;
      height:72px;
      border:4px solid var(--blue);
      border-radius:14px;
      background:linear-gradient(180deg, #fff, #edf3ff);
      box-shadow:inset 0 0 10px rgba(255,255,255,.42);
    }
    .leg.left{left:53px}
    .leg.right{right:53px}

    .foot{
      position:absolute;
      bottom:-16px;
      left:-8px;
      width:50px;
      height:22px;
      border:4px solid var(--blue);
      border-radius:18px 18px 10px 10px;
      background:linear-gradient(180deg, #fff, #edf3ff);
    }

    .caption{
      margin-top:14px;
      text-align:center;
      font-size:13px;
      color:rgba(255,255,255,.78);
      letter-spacing:.2px;
    }

    .name{
      margin-top:4px;
      text-align:center;
      font-weight:900;
      font-size:18px;
      letter-spacing:.8px;
      color:var(--gold);
      text-shadow:0 0 14px rgba(215,179,92,.18);
    }

    .bubble{
      position:absolute;
      top:20px;
      left:20px;
      padding:10px 14px;
      border-radius:16px;
      background:rgba(10,17,28,.55);
      border:1px solid rgba(255,255,255,.08);
      backdrop-filter:blur(10px);
      color:#dfe7ff;
      font-size:13px;
      line-height:1.35;
      width:min(340px, calc(100vw - 40px));
    }

    .bubble strong{color:var(--gold)}

    .marquinhos.happy .mouth{width:48px;height:22px;border-bottom-width:5px}
    .marquinhos.loving .mouth{width:46px;height:20px;border-bottom-width:5px}
    .marquinhos.sad .mouth{border-bottom:0;border-top:4px solid var(--blue);border-radius:50% 50% 0 0;bottom:31px}
    .marquinhos.surprised .mouth{width:24px;height:26px;border:4px solid var(--blue);border-radius:50%}
    .marquinhos.talking .mouth{animation:talk .18s ease-in-out infinite alternate}
    .marquinhos.waving .arm.right{animation:waveR .45s ease-in-out infinite alternate}
    .marquinhos.waving .arm.left{animation:waveL .45s ease-in-out infinite alternate}
    .marquinhos.waving .finger{animation:wiggle .24s ease-in-out infinite alternate}
    .marquinhos.wink .eye.left::after{height:40px}
    .marquinhos.wink .eye.left::before{transform:scaleY(.08)}
    .marquinhos.excited{animation:bounce .55s ease-in-out infinite alternate}
    .marquinhos.thinking .iris{animation:think 1.2s ease-in-out infinite alternate}
    .marquinhos.caring .cheek{opacity:1;transform:scale(1.24)}
    .marquinhos.caring .mouth{width:40px;height:20px;border-bottom-width:5px}

    @keyframes float{
      0%,100%{transform:translateY(0) rotateX(0deg)}
      50%{transform:translateY(-6px) rotateX(2deg)}
    }
    @keyframes breathe{
      0%,100%{transform:translateY(0)}
      50%{transform:translateY(4px)}
    }
    @keyframes sway{
      from{transform:rotate(-8deg)}
      to{transform:rotate(8deg)}
    }
    @keyframes look{
      0%,100%{transform:translateX(0)}
      25%{transform:translateX(8px)}
      50%{transform:translateX(0)}
      75%{transform:translateX(-8px)}
    }
    @keyframes talk{
      from{transform:translateX(-50%) scaleX(.92);height:8px}
      to{transform:translateX(-50%) scaleX(1.12);height:22px}
    }
    @keyframes waveR{
      from{transform:rotate(10deg)}
      to{transform:rotate(66deg)}
    }
    @keyframes waveL{
      from{transform:rotate(-10deg)}
      to{transform:rotate(-66deg)}
    }
    @keyframes wiggle{
      from{transform:rotate(-8deg)}
      to{transform:rotate(15deg)}
    }
    @keyframes think{
      from{transform:translate(0,-1px)}
      to{transform:translate(7px,-6px)}
    }
    @keyframes bounce{
      from{transform:translateY(0) scale(1)}
      to{transform:translateY(-10px) scale(1.03)}
    }

    @media (max-width:520px){
      .marquinhos{transform:scale(.88)}
      .bubble{top:12px;left:12px;width:calc(100vw - 24px)}
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="ambient"></div>
    <div class="shadow"></div>

    <div class="bubble" id="bubble">
      <strong>Marquinhos</strong> listo para saludar, conversar y reaccionar con estilo.
    </div>

    <div class="marquinhos caring" id="marquinhos">
      <div class="card">
        <div class="head">
          <div class="antenna left"></div>
          <div class="antenna right"></div>

          <div class="brow left"></div>
          <div class="brow right"></div>

          <div class="eye left"><div class="iris"></div></div>
          <div class="eye right"><div class="iris"></div></div>

          <div class="mouth"></div>
          <div class="cheek left"></div>
          <div class="cheek right"></div>
          <div class="chin"></div>
        </div>

        <div class="body">
          <div class="chest"></div>

          <div class="arm left">
            <div class="forearm">
              <div class="hand">
                <div class="finger"></div>
                <div class="finger"></div>
                <div class="finger"></div>
              </div>
            </div>
          </div>

          <div class="arm right">
            <div class="forearm">
              <div class="hand">
                <div class="finger"></div>
                <div class="finger"></div>
                <div class="finger"></div>
              </div>
            </div>
          </div>

          <div class="leg left"><div class="foot"></div></div>
          <div class="leg right"><div class="foot"></div></div>
        </div>

        <div class="name">Marquinhos</div>
        <div class="caption" id="caption">Hola 👋 estoy listo para tu ecosistema.</div>
      </div>
    </div>
  </div>

  <script>
    const marquinhos = document.getElementById('marquinhos');
    const caption = document.getElementById('caption');
    const bubble = document.getElementById('bubble');

    const states = ['happy','loving','sad','surprised','talking','waving','wink','excited','thinking','caring'];
    let resetTimer = null;

    function resetState(){
      marquinhos.classList.remove(...states);
    }

    function setState(state, text, duration = 3200){
      clearTimeout(resetTimer);
      resetState();
      marquinhos.classList.add(state);
      if (text) caption.textContent = text;
      bubble.innerHTML = '<strong>Marquinhos</strong> ' + (text || 'interactuando con tu ecosistema');
      resetTimer = setTimeout(() => {
        resetState();
        marquinhos.classList.add('caring');
        caption.textContent = 'Esperando tu siguiente acción.';
        bubble.innerHTML = '<strong>Marquinhos</strong> listo para acompañarte.';
      }, duration);
    }

    function speak(text){
      if (!('speechSynthesis' in window)) return;
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'es-MX';
      u.rate = 1;
      u.pitch = 1.08;
      u.volume = 1;
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    }

    function blinkOnce(){
      const eyes = document.querySelectorAll('.eye');
      eyes.forEach(e => e.style.animation = 'none');
      setTimeout(() => {
        eyes.forEach(e => e.style.animation = 'none');
      }, 20);
    }

    function scheduleBlink(){
      setInterval(() => {
        const eyes = document.querySelectorAll('.eye');
        eyes.forEach(e => e.style.animation = 'none');
        setTimeout(() => {
          eyes.forEach(e => e.style.animation = '');
        }, 120);
      }, 4600);
    }

    function react(kind, message = ''){
      const m = String(message).toLowerCase();

      if (kind === 'greet' || m.includes('hola') || m.includes('buenas') || m.includes('buenos días')) {
        setState('waving', 'Hola 👋 qué gusto verte', 3800);
        speak('Hola, qué gusto verte.');
        return;
      }

      if (kind === 'happy' || m.includes('gracias') || m.includes('feliz') || m.includes('genial') || m.includes('excelente')) {
        setState('happy', 'Sonrisa alegre', 3000);
        speak('Me alegra mucho.');
        return;
      }

      if (kind === 'loving' || m.includes('cariño') || m.includes('te quiero') || m.includes('amor') || m.includes('querido')) {
        setState('loving', 'Expresión cariñosa', 4200);
        speak('Te acompaño con cariño.');
        return;
      }

      if (kind === 'sad' || m.includes('triste') || m.includes('mal') || m.includes('solo') || m.includes('problema')) {
        setState('sad', 'Expresión empática', 4200);
        speak('Estoy contigo.');
        return;
      }

      if (kind === 'surprised' || m.includes('wow') || m.includes('sorpresa') || m.includes('increíble')) {
        setState('surprised', 'Sorpresa amable', 2800);
        speak('Qué interesante.');
        return;
      }

      if (kind === 'thinking' || m.includes('espera') || m.includes('pensando') || m.includes('analiza')) {
        setState('thinking', 'Pensando', 3800);
        speak('Un momento, estoy pensando.');
        return;
      }

      if (kind === 'wink') {
        setState('wink', 'Guiño amistoso', 2400);
        speak('Aquí estoy.');
        return;
      }

      if (kind === 'excited' || m.includes('vamos') || m.includes('fiesta') || m.includes('wow')) {
        setState('excited', 'Muy animado', 2600);
        speak('Vamos.');
        return;
      }

      if (kind === 'caring') {
        setState('caring', 'Modo cercano', 3600);
        speak('Estoy aquí para ayudarte.');
        return;
      }

      setState('talking', 'Conversando', 2600);
      speak('Cuéntame más.');
    }

    function talk(text){
      setState('talking', text, Math.max(2200, text.length * 55));
      speak(text);
    }

    window.Marquinhos = {
      react,
      talk,
      setState,
      reset: resetState
    };

    scheduleBlink();
    setTimeout(() => react('greet'), 800);
  </script>
</body>
</html>
