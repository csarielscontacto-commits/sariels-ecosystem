<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title data-i18n="titulo_delivery">🚚 Delivery | Csariel's</title>
    <meta name="theme-color" content="#0F2D1A" />
    <base href="/">

    <!-- 🔒 CSP -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com https://*.supabase.co https://*.tile.openstreetmap.org;
        style-src 'self' https://cdnjs.cloudflare.com https://fonts.googleapis.com 'unsafe-inline';
        font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;
        img-src 'self' data: https://*;
        connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.tile.openstreetmap.org;
        frame-src 'self';
        media-src 'self';
        object-src 'none';
        base-uri 'self';
        form-action 'self';
    ">

    <!-- ===== RECURSOS ===== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;400;600;700&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

    <!-- ===== ESTILOS UNIFICADOS ===== -->
    <style>
        :root {
            --space-deep: #05080f;
            --space-mid: #0a1428;
            --verde-bosque: #0F2D1A;
            --verde-bosque-light: #1a4a2a;
            --gold-cosmic: #D4AF37;
            --gold-dim: rgba(212,175,55,0.15);
            --gold-glow: rgba(212,175,55,0.25);
            --text-primary: #e8f0f8;
            --text-secondary: #8ba3c7;
            --text-muted: #4a6a8a;
            --border: rgba(212,175,55,0.08);
            --border-glow: rgba(212,175,55,0.25);
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --success: #00b894;
            --danger: #ff3366;
            --warning: #D4AF37;
            --quantum: #00e5ff;
            --color-activo: #1565C0;
            --talavera-blue: #1565C0;
            --talavera-light: #42A5F5;
            --talavera-dark: #0D47A1;
            --ceramic: #FFFFFF;
            --cream: #FFF8E1;
            --mic-active: #00E5FF;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            background: var(--space-deep);
            color: var(--text-primary);
            font-family: 'Space Grotesk', 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        #stars-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .nebula {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.10;
            pointer-events: none;
            z-index: 0;
            animation: nebula-drift 25s ease-in-out infinite alternate;
        }
        .nebula-1 { width: 700px; height: 700px; background: var(--verde-bosque); top: -15%; right: -15%; }
        .nebula-2 { width: 600px; height: 600px; background: var(--gold-cosmic); bottom: -15%; left: -15%; animation-delay: -8s; opacity: 0.05; }
        .nebula-3 { width: 500px; height: 500px; background: var(--quantum); top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: -15s; opacity: 0.04; }

        @keyframes nebula-drift {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, -30px) scale(1.15); }
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: var(--space-deep); }
        ::-webkit-scrollbar-thumb { background: linear-gradient(var(--gold-cosmic), var(--verde-bosque)); border-radius: 3px; }

        .app {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px 20px 30px;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0 16px;
            border-bottom: 2px solid var(--gold-dim);
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
            backdrop-filter: blur(10px);
            position: relative;
        }
        .header::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-cosmic), var(--verde-bosque), var(--gold-cosmic), transparent);
            opacity: 0.4;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        .logo-icon { font-size: 2rem; filter: drop-shadow(0 0 20px rgba(212,175,55,0.2)); animation: pulse-glow 3s ease-in-out infinite; }
        .logo-icon .hex {
            display: inline-block;
            background: var(--verde-bosque);
            color: var(--gold-cosmic);
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 900;
            border: 2px solid var(--gold-cosmic);
            font-family: 'Orbitron', monospace;
        }
        @keyframes pulse-glow { 0%, 100% { filter: drop-shadow(0 0 20px rgba(212,175,55,0.2)); } 50% { filter: drop-shadow(0 0 40px rgba(212,175,55,0.4)); } }

        .logo-text {
            font-family: 'Orbitron', monospace;
            font-size: 1.3rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--gold-cosmic), var(--verde-bosque-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo-badge {
            font-family: 'Orbitron', monospace;
            font-size: 0.45rem;
            background: linear-gradient(135deg, var(--verde-bosque), var(--gold-cosmic));
            color: white;
            padding: 3px 12px;
            border-radius: 20px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            -webkit-text-fill-color: white;
            border: 1px solid rgba(212,175,55,0.2);
            animation: badge-pulse 2s ease-in-out infinite;
        }
        @keyframes badge-pulse { 0%, 100% { box-shadow: 0 0 30px rgba(15,45,26,0.3); } 50% { box-shadow: 0 0 60px rgba(212,175,55,0.2); } }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 16px;
            border: 1px solid var(--border);
            border-radius: 30px;
            background: rgba(212,175,55,0.03);
            color: var(--text-primary);
            font-family: 'Orbitron', monospace;
            font-size: 0.6rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
        }
        .btn:hover { transform: scale(1.02); border-color: var(--border-glow); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }

        .btn-primary {
            background: linear-gradient(135deg, var(--verde-bosque), var(--verde-bosque-light));
            border-color: var(--gold-cosmic);
            color: var(--gold-cosmic);
            -webkit-text-fill-color: var(--gold-cosmic);
        }
        .btn-gold {
            background: linear-gradient(135deg, var(--gold-cosmic), #b8923a);
            border-color: transparent;
            color: #0a0c10;
            -webkit-text-fill-color: #0a0c10;
        }
        .btn-outline { border-color: var(--border); background: transparent; }
        .btn-sm { padding: 4px 12px; font-size: 0.55rem; }

        /* ===== SELECTOR DE IDIOMA ===== */
        .language-selector {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            background: rgba(212,175,55,0.03);
            border-radius: 16px;
            border: 1px solid rgba(212,175,55,0.08);
        }
        .language-selector .lang-icon { font-size: 0.7rem; margin-right: 2px; }
        .lang-btn {
            padding: 2px 8px;
            border-radius: 10px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-muted);
            font-family: 'Orbitron', monospace;
            font-size: 0.45rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .lang-btn:hover { color: var(--text-secondary); background: rgba(212,175,55,0.05); }
        .lang-btn.active { border-color: var(--gold-cosmic); background: rgba(212,175,55,0.1); color: var(--gold-cosmic); }

        /* ===== DELIVERY CONTAINER ===== */
        .delivery-container {
            background: rgba(15,45,26,0.25);
            border: 1px solid var(--gold-dim);
            border-radius: var(--radius);
            padding: 24px;
            backdrop-filter: blur(10px);
            margin-bottom: 16px;
        }

        #delivery-map {
            width: 100%;
            height: 350px;
            border-radius: var(--radius);
            border: 1px solid var(--gold-dim);
            overflow: hidden;
            margin-bottom: 16px;
            background: var(--space-deep);
        }

        .pedido-form {
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid var(--gold-dim);
        }
        .pedido-form .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .pedido-form .form-group {
            margin-bottom: 10px;
        }
        .pedido-form .form-group label {
            display: block;
            font-size: 0.6rem;
            color: var(--text-muted);
            font-family: 'Orbitron', monospace;
            margin-bottom: 3px;
            text-transform: uppercase;
        }
        .pedido-form .form-group input,
        .pedido-form .form-group select,
        .pedido-form .form-group textarea {
            width: 100%;
            padding: 8px 12px;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--gold-dim);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.8rem;
            outline: none;
            font-family: 'Space Grotesk', sans-serif;
        }
        .pedido-form .form-group textarea { min-height: 60px; resize: vertical; }
        .pedido-form .form-group.oculto { display: none; }

        .btn-delivery {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, var(--gold-cosmic), #b8923a);
            border: none;
            border-radius: 30px;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            font-size: 0.8rem;
            color: #0a0c10;
            cursor: pointer;
            transition: var(--transition);
        }
        .btn-delivery:hover { transform: scale(1.02); box-shadow: 0 0 30px rgba(212,175,55,0.3); }
        .btn-delivery:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; box-shadow: none; }

        .pedidos-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 12px;
        }
        .pedido-item {
            background: rgba(0,0,0,0.25);
            border: 1px solid var(--gold-dim);
            border-radius: 10px;
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .pedido-item .pedido-info { flex: 1; min-width: 180px; }
        .pedido-item .pedido-desc { font-size: 0.75rem; color: var(--text-primary); margin-bottom: 4px; }
        .pedido-item .pedido-meta { font-size: 0.6rem; color: var(--text-muted); font-family: 'Orbitron', monospace; }
        .estado-badge {
            font-family: 'Orbitron', monospace;
            font-size: 0.5rem;
            padding: 3px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            font-weight: 700;
        }
        .estado-pendiente { background: rgba(212,175,55,0.15); color: var(--gold-cosmic); }
        .estado-en_camino { background: rgba(0,229,255,0.15); color: var(--quantum); }
        .estado-entregado { background: rgba(0,184,148,0.15); color: var(--success); }
        .estado-cancelado { background: rgba(255,51,102,0.15); color: var(--danger); }

        /* ===== FOOTER ===== */
        .footer {
            margin-top: 24px;
            padding-top: 14px;
            border-top: 1px solid var(--gold-dim);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .footer-text { color: var(--text-muted); font-size: 0.5rem; font-family: 'Orbitron', monospace; }
        .footer-text .brand { color: var(--gold-cosmic); }
        .footer-links { display: flex; gap: 8px; flex-wrap: wrap; }
        .footer-links a { color: var(--text-muted); text-decoration: none; font-size: 0.5rem; font-family: 'Orbitron', monospace; }

        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--verde-bosque);
            color: var(--gold-cosmic);
            padding: 10px 20px;
            border-radius: var(--radius);
            font-weight: 600;
            font-size: 0.7rem;
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 5000;
            pointer-events: none;
            font-family: 'Orbitron', monospace;
            border: 1px solid rgba(212,175,55,0.15);
        }
        .toast.active { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.error { background: var(--danger); color: white; }

        /* ================================================================
           ===== ESTILOS DE MARQUINHOS (AUTOCONTENIDO) =====
           ================================================================ */

        /* Contenedor flotante de Marquinhos */
        #marquinhos-float {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 150px;
            height: 190px;
            z-index: 9999;
            cursor: grab;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            pointer-events: auto;
            filter: drop-shadow(0 8px 30px rgba(13, 71, 161, 0.3));
            transition: none;
        }

        #marquinhos-float:active {
            cursor: grabbing;
        }

        #marquinhos-float.hidden {
            display: none;
        }

        .marquinhos-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1565C0, #0D47A1);
            border: 2px solid #D4AF37;
            color: white;
            font-size: 24px;
            cursor: pointer;
            z-index: 10000;
            box-shadow: 0 4px 20px rgba(21, 101, 192, 0.4);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Quicksand', sans-serif;
        }

        .marquinhos-toggle:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 30px rgba(21, 101, 192, 0.6);
        }

        .marquinhos-toggle.hidden {
            display: none;
        }

        /* ===== MARQUINHOS WIDGET ===== */
        .marquinhos-widget {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            animation: float-mq 4.5s ease-in-out infinite;
            user-select: none;
            touch-action: none;
            isolation: isolate;
            pointer-events: none;
            margin: 0 auto;
        }

        .marquinhos-widget * {
            pointer-events: none;
        }

        .marquinhos-widget .card {
            background: transparent;
            border: none;
            padding: 0;
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* HEAD */
        .marquinhos-widget .head {
            position: relative;
            width: 130px;
            height: 120px;
            margin: 0 auto 0;
            border: 3px solid var(--color-activo, #1565C0);
            border-radius: 50% 50% 45% 45%;
            overflow: visible;
            background: radial-gradient(circle at 35% 25%, #FFFFFF 0%, #FFF8E1 60%, #f5efe0 85%, #e8e0d0 100%);
            box-shadow: inset 0 4px 12px rgba(255, 255, 255, 0.6), inset 0 -4px 12px rgba(13, 71, 161, 0.08), 0 4px 12px rgba(0, 0, 0, 0.10);
            transform: translateZ(10px);
            transition: border-color .3s ease, box-shadow .3s ease;
            z-index: 10;
        }

        .marquinhos-widget .head::before {
            content: "";
            position: absolute;
            inset: 6px;
            border-radius: 50%;
            background-image:
                radial-gradient(circle at 20% 30%, #1565C0 2px, transparent 2px),
                radial-gradient(circle at 80% 25%, #1565C0 2px, transparent 2px),
                radial-gradient(circle at 50% 15%, #1565C0 2.5px, transparent 2.5px),
                radial-gradient(circle at 70% 70%, #1565C0 1.8px, transparent 1.8px),
                radial-gradient(circle at 30% 75%, #1565C0 1.8px, transparent 1.8px),
                radial-gradient(circle at 50% 55%, #1565C0 2px, transparent 2px),
                radial-gradient(circle at 15% 55%, #42A5F5 1.5px, transparent 1.5px),
                radial-gradient(circle at 85% 55%, #42A5F5 1.5px, transparent 1.5px);
            background-size: 50px 50px;
            background-repeat: repeat;
            opacity: 0.2;
            pointer-events: none;
            z-index: 1;
        }

        .marquinhos-widget .head::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.4) 0%, transparent 60%);
            pointer-events: none;
            border-radius: inherit;
            z-index: 2;
        }

        /* ANTENAS */
        .marquinhos-widget .antenna {
            position: absolute;
            top: -16px;
            width: 4px;
            height: 20px;
            border-radius: 999px;
            background: linear-gradient(180deg, #1565C0, #42A5F5);
            transform-origin: bottom center;
            animation: sway-mq 3.2s ease-in-out infinite alternate;
            box-shadow: none;
            transition: all 0.5s ease;
            z-index: 15;
        }
        .marquinhos-widget .antenna::after {
            content: "";
            position: absolute;
            left: 50%;
            top: -10px;
            width: 16px;
            height: 16px;
            transform: translateX(-50%);
            border-radius: 50%;
            background: radial-gradient(circle at 40% 35%, #FFFFFF 0%, #FFF8E1 65%, #42A5F5 100%);
            border: 2px solid #1565C0;
            box-shadow: inset 0 0 6px rgba(255, 255, 255, 0.5), 0 0 0 1px rgba(13, 71, 161, 0.15);
            transition: all 0.5s ease;
        }
        .marquinhos-widget .antenna.left {
            left: 34px;
        }
        .marquinhos-widget .antenna.right {
            right: 34px;
            animation-delay: .14s;
        }

        /* CEJAS */
        .marquinhos-widget .brow {
            position: absolute;
            top: 26px;
            width: 26px;
            height: 6px;
            border-top: 3px solid var(--color-activo, #1565C0);
            border-radius: 50%;
            z-index: 14;
            opacity: 1;
            transition: transform .3s ease, top .3s ease, border-color .3s ease;
        }
        .marquinhos-widget .brow.left {
            left: 20px;
            transform: rotate(-4deg);
        }
        .marquinhos-widget .brow.right {
            right: 20px;
            transform: rotate(4deg);
        }

        /* OJOS */
        .marquinhos-widget .eye {
            position: absolute;
            top: 34px;
            width: 30px;
            height: 34px;
            border-radius: 50%;
            overflow: hidden;
            background: #1A0A2E;
            box-shadow: inset 0 0 0 2px rgba(13, 71, 161, 0.12), 0 0 8px rgba(21, 101, 192, 0.08);
            transition: clip-path 0.15s ease;
            z-index: 13;
        }
        .marquinhos-widget .eye.left {
            left: 20px;
        }
        .marquinhos-widget .eye.right {
            right: 20px;
        }

        .marquinhos-widget .eye::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 42%, #fff 0 56%, #f5f0e8 66%, #e8e0d0 100%);
            border-radius: 50%;
            transform: scaleY(.78);
            transition: transform .2s ease;
        }

        .marquinhos-widget .eye::after {
            content: "";
            position: absolute;
            left: 5px;
            right: 5px;
            top: -2px;
            height: 0;
            background: #FFF8F0;
            border-bottom: 3px solid var(--color-activo, #1565C0);
            border-radius: 50%;
            z-index: 13;
            transition: height .2s ease, border-color .3s ease;
        }

        /* IRIS */
        .marquinhos-widget .iris {
            position: absolute;
            z-index: 13;
            width: 14px;
            height: 14px;
            left: 8px;
            top: 10px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #6dd5ff 0 16%, #1a6cb0 38%, #0a1a3e 74%, #030810 100%);
            box-shadow: 0 0 10px rgba(0, 229, 255, .15), inset 0 0 6px rgba(255, 255, 255, .1);
            transition: transform .3s ease;
        }
        .marquinhos-widget .iris::before {
            content: "";
            position: absolute;
            width: 5px;
            height: 5px;
            left: 2px;
            top: 2px;
            border-radius: 50%;
            background: #fff;
            opacity: .9;
        }

        /* BOCA */
        .marquinhos-widget .mouth-container {
            position: absolute;
            left: 50%;
            bottom: 14px;
            transform: translateX(-50%);
            width: 36px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 13;
        }

        .marquinhos-widget .mouth {
            width: 28px;
            height: 8px;
            border-bottom: 3px solid var(--color-activo, #1565C0);
            border-radius: 0 0 50% 50%;
            transition: all 0.04s ease;
            transform-origin: center;
            background: transparent;
            position: relative;
            filter: drop-shadow(0 1px 4px rgba(21, 101, 192, .10));
        }

        .marquinhos-widget .mouth.shape-neutral { width: 28px; height: 8px; border-bottom-width: 3px; border-radius: 0 0 50% 50%; }
        .marquinhos-widget .mouth.talking { animation: talk-mq .12s ease-in-out infinite alternate; }

        /* MEJILLAS */
        .marquinhos-widget .cheek {
            position: absolute;
            bottom: 20px;
            width: 18px;

            transform: translateZ(8px);
            animation: breathe-mq 4s ease-in-out infinite;
            transition: border-color .3s ease;
            z-index: 5;
        }

        .marquinhos-widget .body::before {
            content: "";
            position: absolute;
            inset: 6px;
            border-radius: 18px;
            background-image:

                radial-gradient(circle at 80% 30%, #1565C0 1.8px, transparent 1.8px),

                radial-gradient(circle at 70% 70%, #1565C0 1.8px, transparent 1.8px),
                radial-gradient(circle at 30% 75%, #1565C0 1.8px, transparent 1.8px),
                radial-gradient(circle at 50% 50%, #42A5F5 2px, transparent 2px);
            background-size: 40px 40px;
            background-repeat: repeat;
            opacity: 0.15;
            pointer-events: none;
            z-index: 1;
        }

        .marquinhos-widget .body::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.25) 0%, transparent 50%);
            pointer-events: none;
            border-radius: inherit;
            z-index: 2;
        }

        /* PECHO */
        .marquinhos-widget .chest {
            position: absolute;
            left: 50%;
            top: 10px;
            width: 70px;
            height: 32px;
            transform: translateX(-50%);

            border-radius: 10px;
            background: #FFFFFF;
            box-shadow: inset 0 0 0 1px rgba(13, 71, 161, 0.05), 0 2px 8px rgba(0, 0, 0, 0.04);
            display: grid;
            place-items: center;
            transition: all 0.5s ease;
            z-index: 10;
            overflow: hidden;
        }

        .marquinhos-widget .chest::before {
            content: "MARQUINHOS";
            font-weight: 700;
            letter-spacing: 0.6px;
            font-size: 7px;
            color: #0D47A1;
            font-family: "Quicksand", sans-serif;
            transition: all 0.5s ease;
            text-align: center;
            line-height: 1.1;
            padding: 0 2px;
        }

        /* BRAZOS - FUERA DEL CUERPO */
        .marquinhos-widget .arm {
            position: absolute;
            top: 10px;
            width: 18px;
            height: 60px;
            border: 3px solid var(--color-activo, #1565C0);
            border-radius: 12px;
            background: linear-gradient(180deg, #FFFFFF, #FFF8E1);

            box-shadow: inset 0 0 8px rgba(255, 255, 255, 0.4);

            will-change: transform;

            left: -16px;
            transform: rotate(-15deg);

        .marquinhos-widget .arm.right {
            right: -16px;
            transform: rotate(15deg);

        .marquinhos-widget .hand {

            height: 28px;

        }
        .marquinhos-widget .hand.left {
            left: -28px;
            top: 54px;
        }
        .marquinhos-widget .hand.right {
            right: -28px;
            top: 54px;
        }

        /* PIERNAS - FUERA DEL CUERPO */
        .marquinhos-widget .leg {
            position: absolute;
            bottom: -40px;
            width: 24px;
            height: 44px;
            border: 3px solid var(--color-activo, #1565C0);
            border-radius: 10px;
            background: linear-gradient(180deg, #FFFFFF, #FFF8E1);

            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), border-color .3s ease;
            z-index: 4;
            will-change: transform;
        }
        .marquinhos-widget .leg.left {
            left: 32px;
            transform: rotate(0deg);
        }
        .marquinhos-widget .leg.right {
            right: 32px;
            transform: rotate(0deg);
        }

        /* PIES - FUERA DEL CUERPO */
        .marquinhos-widget .foot {
            position: absolute;
            bottom: -14px;
            left: -8px;
            width: 38px;
            height: 16px;
            border: 3px solid var(--color-activo, #1565C0);
            border-radius: 12px 12px 8px 8px;
            background: linear-gradient(180deg, #FFFFFF, #FFF8E1);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), border-color .3s ease;
            z-index: 3;
        }

        /* BURBUJA DE TEXTO */
        .marquinhos-widget #speech-bubble {
            position: absolute;
            bottom: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            color: #0D47A1;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 9px;
            font-family: "Quicksand", sans-serif;
            z-index: 100;
            max-width: 140px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12), 0 0 0 1px rgba(21, 101, 192, 0.08);
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.25s ease;
            opacity: 0;
            border: 1px solid rgba(21, 101, 192, 0.1);
            line-height: 1.3;
            font-weight: 600;
            white-space: nowrap;
        }

        .marquinhos-widget #speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 6px solid rgba(255, 255, 255, 0.95);

        .marquinhos-widget #speech-bubble.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(-2px);

            border-color: #00E5FF;
            color: #00B4D8;
            background: rgba(0, 229, 255, 0.08);

        .marquinhos-widget #speech-bubble.thinking {

            color: #BF360C;
            background: rgba(255, 107, 53, 0.08);
        }

            border-top-color: rgba(255, 107, 53, 0.08);
        }

        /* ESTADOS */
        .marquinhos-widget.on-call .antenna {
            animation: callPulse-mq 1.2s ease-in-out infinite alternate;
        }
        .marquinhos-widget.on-call .chest::before {
            content: "📞 LLAMADA";
            color: #FF6B35;
            font-size: 6px;
        }

        .marquinhos-widget.talking .mouth {
            animation: talk-mq .12s ease-in-out infinite alternate;
        }

        /* ANIMACIONES */
        @keyframes float-mq {
            0%, 100% { transform: translateY(0) rotateX(0deg); }
            50% { transform: translateY(-5px) rotateX(1deg); }
        }

        @keyframes breathe-mq {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(2px); }
        }

        @keyframes sway-mq {
            from { transform: rotate(-8deg); }
            to { transform: rotate(8deg); }
        }

        @keyframes talk-mq {
            from { transform: translateX(-50%) scaleX(.9); height: 3px; }
            to { transform: translateX(-50%) scaleX(1.1); height: 12px; }
        }

        @keyframes callPulse-mq {
            0% { transform: rotate(-10deg) scale(1); }
            100% { transform: rotate(10deg) scale(1.06); }
        }

        /* RESPONSIVE */
        @media (max-width: 520px) {

            }
        }
    </style>
</head>

    <script>
        const CSARIELS_IDIOMA = {
            actual: 'es',

            init: async function() {

            cambiar: function(idioma) {
                if (!idioma || idioma === this.actual) return;
                this.actual = idioma;
                localStorage.setItem('csariels_idioma', idioma);
                this.cargarTraducciones(idioma).then(() => {
                    this.aplicarTraducciones();
                    this.actualizarBotones();
                });
            },

            aplicarTraducciones: function() {
                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.getAttribute('data-i18n');
                    if (this.traducciones[key]) el.textContent = this.traducciones[key];
                });
            },

            actualizarBotones: function() {
                document.querySelectorAll('.lang-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.getAttribute('data-lang') === this.actual);
                });
            }
        };

        function mostrarToast(mensaje, tipo = '') {
            const toast = document.getElementById('toast');
            toast.textContent = mensaje;
            toast.className = `toast${tipo ? ' error' : ''}`;
            toast.classList.add('active');
            setTimeout(() => toast.classList.remove('active'), 3000);
        }

        // ===== SUPABASE =====
        const SUPABASE_URL = 'https://nvyyxgkladjauolvpzfp.supabase.co';
        const SUPABASE_ANON_KEY = 'TU_ANON_KEY_AQUI';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUserId = null;

        async function ensureAuth() {
            const { data: { session } } = await sb.auth.getSession();
            if (session?.user) {
                currentUserId = session.user.id;
                return currentUserId;
            }
            const { data, error } = await sb.auth.signInAnonymously();
            if (error) {
                console.error('Error de autenticación anónima:', error);
                mostrarToast('⚠️ No se pudo iniciar sesión', 'error');
                return null;
            }
            currentUserId = data.user.id;
            return currentUserId;
        }

        function toggleMontoCMT() {
            const metodo = document.getElementById('deliveryPago').value;
            document.getElementById('grupoMontoCMT').classList.toggle('oculto', metodo !== 'cmt');
        }

        let map = null;
        function initMap() {
            if (map) return;
            map = L.map('delivery-map').setView([19.0413, -98.2062], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19
            }).addTo(map);
        }

        async function crearPedido() {
            const nombre = document.getElementById('deliveryNombre').value.trim();
            const telefono = document.getElementById('deliveryTelefono').value.trim();
            const direccion = document.getElementById('deliveryDireccion').value.trim();
            const descripcion = document.getElementById('deliveryDescripcion').value.trim();
            const metodoPago = document.getElementById('deliveryPago').value;
            const montoCMTInput = document.getElementById('deliveryMontoCMT').value;

            if (!nombre || !telefono || !direccion || !descripcion) {
                mostrarToast('⚠️ Completa todos los campos obligatorios', 'error');
                return;
            }

            let montoCMT = null;
            if (metodoPago === 'cmt') {
                montoCMT = parseFloat(montoCMTInput);
                if (!montoCMT || montoCMT <= 0) {
                    mostrarToast('⚠️ Ingresa un monto válido en CMT', 'error');
                    return;
                }
            }

            const userId = await ensureAuth();
            if (!userId) return;

            const btn = document.getElementById('btnCrearPedido');
            btn.disabled = true;

            const { data, error } = await sb.rpc('crear_pedido_delivery', {
                p_nombre: nombre,
                p_telefono: telefono,
                p_direccion: direccion,
                p_descripcion: descripcion,
                p_metodo_pago: metodoPago,
                p_monto_cmt: montoCMT,
                p_lat: null,
                p_lng: null
            });

            btn.disabled = false;

            if (error) {
                console.error('Error creando pedido:', error);
                if (error.message && error.message.includes('Saldo insuficiente')) {
                    mostrarToast('⚠️ Saldo CMT insuficiente', 'error');
                } else {
                    mostrarToast('⚠️ No se pudo crear el pedido', 'error');
                }
                return;
            }

            mostrarToast('✅ Pedido creado exitosamente');
            document.getElementById('deliveryNombre').value = '';
            document.getElementById('deliveryTelefono').value = '';
            document.getElementById('deliveryDireccion').value = '';
            document.getElementById('deliveryDescripcion').value = '';
            document.getElementById('deliveryMontoCMT').value = '';

            await cargarPedidos();
        }

        function renderPedidos(pedidos) {
            const lista = document.getElementById('pedidosList');

            if (!pedidos || pedidos.length === 0) {
                lista.innerHTML = `
                    <div style="text-align:center;padding:30px;color:var(--text-muted);">
                        <div style="font-size:2rem;opacity:0.3;margin-bottom:8px;">📭</div>
                        <p>No hay pedidos aún</p>
                    </div>`;
                return;
            }

            const iconosPago = { efectivo: '💵', transferencia: '🏦', cmt: '🪙' };
            const etiquetasEstado = {
                pendiente: 'Pendiente',
                en_camino: 'En camino',
                entregado: 'Entregado',
                cancelado: 'Cancelado'
            };

            lista.innerHTML = pedidos.map(p => `
                <div class="pedido-item">
                    <div class="pedido-info">
                        <div class="pedido-desc">${escapeHTML(p.descripcion)}</div>
                        <div class="pedido-meta">
                            ${iconosPago[p.metodo_pago] || '💳'} ${escapeHTML(p.direccion)}
                            ${p.monto_cmt ? ' · ' + p.monto_cmt + ' CMT' : ''}
                            · ${new Date(p.created_at).toLocaleString('es-MX')}
                        </div>
                    </div>
                    <span class="estado-badge estado-${p.estado}">${etiquetasEstado[p.estado] || p.estado}</span>
                </div>
            `).join('');
        }

        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str ?? '';
            return div.innerHTML;
        }

        async function cargarPedidos() {
            if (!currentUserId) return;
            const { data, error } = await sb
                .from('pedidos_delivery')
                .select('*')
                .eq('user_id', currentUserId)
                .order('created_at', { ascending: false })
                .limit(20);

            if (error) {
                console.error('Error cargando pedidos:', error);
                return;
            }
            renderPedidos(data);
        }

        // ================================================================
        // ===== MARQUINHOS - ASISTENTE AUTOCONTENIDO =====
        // ================================================================

        (function marquinhosAssistant() {
            const container = document.getElementById('marquinhos-float');
            const toggleBtn = document.getElementById('marquinhosToggle');
            const widget = document.getElementById('marquinhosWidget');
            const bubble = document.getElementById('speech-bubble');
            const mouth = document.getElementById('disneyMouth');

            // Estado
            let isOpen = false;
            let isSpeaking = false;
            let synth = window.speechSynthesis;
            let userName = null;

            // ===== BURBUJA =====
            function showBubble(text, type = '') {
                bubble.textContent = text;
                bubble.className = 'visible';
                if (type) bubble.classList.add(type);
                clearTimeout(bubble._timeout);
                bubble._timeout = setTimeout(() => {
                    bubble.classList.remove('visible', 'listening', 'thinking');
                }, 3500);
            }

            function hideBubble() {
                bubble.classList.remove('visible', 'listening', 'thinking');
            }

            // ===== BOCA =====
            function setMouthTalking(talking) {
                if (talking) {
                    mouth.className = 'mouth talking';
                } else {
                    mouth.className = 'mouth shape-neutral';
                }
            }

            // ===== HABLAR =====
            function speak(text) {
                if (!text) return;
                if (isSpeaking) synth.cancel();

                showBubble(text, 'thinking');
                setMouthTalking(true);

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'es-MX';
                utterance.pitch = 1.08;
                utterance.rate = 0.95;
                utterance.volume = 1;

                utterance.onstart = () => {
                    isSpeaking = true;
                    widget.classList.add('talking');
                };

                utterance.onend = () => {
                    isSpeaking = false;
                    widget.classList.remove('talking');
                    setMouthTalking(false);
                    hideBubble();
                };

                utterance.onerror = () => {
                    isSpeaking = false;
                    widget.classList.remove('talking');
                    setMouthTalking(false);
                    hideBubble();
                };

                synth.cancel();
                synth.speak(utterance);
            }

            // ===== COMANDOS =====
            function processCommand(text) {
                const lower = text.toLowerCase();

                if (lower.includes('hola') || lower.includes('buenas') || lower.includes('hey')) {
                    const namePart = userName ? ` ${userName}` : '';
                    speak(`¡Hola${namePart}! ¿Cómo estás hoy?`);
                    return;
                }

                if (lower.includes('me llamo') || lower.includes('mi nombre es') || lower.includes('soy ')) {
                    const match = text.match(/(?:me llamo|mi nombre es|soy)\s+([a-zA-ZáéíóúüñÁÉÍÓÚÜÑ]+)/i);
                    if (match && match[1]) {
                        userName = match[1].charAt(0).toUpperCase() + match[1].slice(1).toLowerCase();
                        speak(`¡Mucho gusto ${userName}!`);
                        try { localStorage.setItem('marquinhos_user_name', userName); } catch (e) {}
                    }
                    return;
                }

                if (lower.includes('gracias')) {
                    speak('¡De nada! Es un placer ayudarte.');
                    return;
                }

                if (lower.includes('adiós') || lower.includes('adios') || lower.includes('hasta luego')) {
                    speak('¡Hasta luego! Fue un placer.');
                    return;
                }

                if (lower.includes('cómo estás') || lower.includes('como estas')) {
                    speak('¡Estoy muy bien! Gracias por preguntar.');
                    return;
                }

                if (lower.includes('quién eres') || lower.includes('quien eres')) {
                    speak('Soy Marquinhos, tu asistente personal. Estoy aquí para ayudarte.');
                    return;
                }

                speak('No entendí bien, ¿puedes repetirlo?');
            }

            // ===== RECONOCIMIENTO DE VOZ =====
            let recognition = null;
            let isListening = false;

            function initSpeechRecognition() {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) return;

                recognition = new SpeechRecognition();
                recognition.lang = 'es-MX';
                recognition.continuous = true;
                recognition.interimResults = true;

                const activationWords = ['marquinhos', 'hola marquinhos', 'hey marquinhos'];

                recognition.onresult = (event) => {
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        const transcript = event.results[i][0].transcript.trim();
                        if (event.results[i].isFinal) {
                            const lower = transcript.toLowerCase();
                            const isActivation = activationWords.some(word => lower.includes(word));
                            if (isActivation) {
                                speak('¡Dime! Estoy aquí.');
                                continue;
                            }
                            if (isOpen) {
                                processCommand(transcript);
                            }
                        }
                    }
                };

                recognition.onerror = () => {
                    if (isListening) {
                        setTimeout(() => {
                            try { recognition.start(); } catch (e) {}
                        }, 1000);
                    }
                };

                recognition.onend = () => {
                    if (isListening) {
                        setTimeout(() => {
                            try { recognition.start(); } catch (e) {}
                        }, 500);
                    }
                };

                try {
                    recognition.start();
                    isListening = true;
                    console.log('🎤 Marquinhos escuchando...');
                } catch (e) {}
            }

            // ===== TOGGLE =====
            toggleBtn.addEventListener('click', function() {
                isOpen = !isOpen;
                container.classList.toggle('hidden', !isOpen);
                toggleBtn.classList.toggle('hidden', isOpen);

                if (isOpen) {
                    showBubble('🎤 Di "Marquinhos" para hablar');
                    setTimeout(() => {
                        if (!recognition) initSpeechRecognition();
                        if (recognition) {
                            isListening = true;
                            try { recognition.start(); } catch (e) {}
                        }
                        // Saludo de bienvenida
                        setTimeout(() => {
                            const savedName = localStorage.getItem('marquinhos_user_name');
                            if (savedName) userName = savedName;
                            const namePart = userName ? ` ${userName}` : '';
                            speak(`¡Hola${namePart}! Soy Marquinhos. ¿Cómo puedo ayudarte?`);
                        }, 300);
                    }, 500);
                } else {
                    if (recognition) {
                        try { recognition.stop(); } catch (e) {}
                        isListening = false;
                    }
                    hideBubble();
                    setMouthTalking(false);
                }
            });

            // Cerrar al tocar fuera
            document.addEventListener('click', function(e) {
                if (isOpen && !container.contains(e.target) && !toggleBtn.contains(e.target)) {
                    isOpen = false;
                    container.classList.add('hidden');
                    toggleBtn.classList.remove('hidden');
                    if (recognition) {
                        try { recognition.stop(); } catch (e) {}
                        isListening = false;
                    }
                    hideBubble();
                    setMouthTalking(false);
                }
            });

            // ===== ARRASTRE =====
            let isDragging = false;
            let startX = 0,
                startY = 0;
            let origX = 0,
                origY = 0;

            container.addEventListener('pointerdown', (e) => {
                isDragging = true;
                const rect = container.getBoundingClientRect();
                startX = e.clientX;
                startY = e.clientY;
                origX = rect.left;
                origY = rect.top;
                container.setPointerCapture(e.pointerId);
                container.style.cursor = 'grabbing';
            });

            container.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                container.style.left = (origX + dx) + 'px';
                container.style.top = (origY + dy) + 'px';
                container.style.right = 'auto';
                container.style.bottom = 'auto';
                container.style.transform = 'none';
            });

            container.addEventListener('pointerup', () => {
                isDragging = false;
                container.style.cursor = 'grab';
            });

            container.addEventListener('pointercancel', () => {
                isDragging = false;
                container.style.cursor = 'grab';
            });

            console.log('🎭 Marquinhos Asistente cargado!');
            console.log('🎤 Di "Marquinhos" para activarlo');
        })();

        // ===== INICIALIZACIÓN =====
        document.addEventListener('DOMContentLoaded', async () => {
            await CSARIELS_IDIOMA.init();
            initMap();
            await ensureAuth();
            await cargarPedidos();
        });
    </script>
