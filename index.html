<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Csariel's · Red Social Integral</title>
    <meta name="theme-color" content="#0F2D1A" />
    <meta name="description" content="Red Social Integral · eSIM · Web3" />
    <base href="/">

    <!-- 🔒 CSP Estricto (Sin unsafe-inline en scripts) -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com https://*.supabase.co;
        style-src 'self' https://cdnjs.cloudflare.com https://fonts.googleapis.com 'unsafe-inline';
        font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;
        img-src 'self' data: https://*;
        connect-src 'self' https://*.supabase.co wss://*.supabase.co;
        frame-src 'self';
        media-src 'self';
        object-src 'none';
        base-uri 'self';
        form-action 'self';
    ">

    <!-- ===== FUENTES Y FONTAWESOME ===== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet" />

    <!-- ===== SUPABASE ===== -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

    <!-- ===== CONECTORES ===== -->
    <script src="/js/client-config-loader.js"></script>
    <script src="/js/security.js"></script>

    <!-- ===== UI COMPARTIDA (idiomas, toast, estrellas) ===== -->
    <script src="/js/red-main.js"></script>

    <style>
        /* ================================================================
           ESTILOS COMPLETOS - Csariel's
           ================================================================ */
        :root {
            --space-deep: #05080f;
            --space-mid: #0a1428;
            --verde-bosque: #0F2D1A;
            --verde-bosque-light: #1a4a2a;
            --gold-cosmic: #D4AF37;
            --gold-dim: rgba(212,175,55,0.15);
            --gold-glow: rgba(212,175,55,0.25);
            --text-primary: #e8f0f8;
            --text-secondary: #8ba3c7;
            --text-muted: #4a6a8a;
            --border: rgba(212,175,55,0.08);
            --border-glow: rgba(212,175,55,0.25);
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --success: #00b894;
            --danger: #ff3366;
            --warning: #D4AF37;
            --quantum: #00e5ff;
            --live-red: #ff0033;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #05080f;
            background: var(--space-deep);
            color: #e8f0f8;
            color: var(--text-primary);
            font-family: 'Space Grotesk', 'Inter', system-ui, sans-serif;
            line-height: 1.5;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            position: relative;
        }

        #stars-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .app {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px 20px 30px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0 16px;
            border-bottom: 2px solid var(--gold-dim);
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
            backdrop-filter: blur(10px);
            position: relative;
        }
        .header::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-cosmic), var(--verde-bosque), var(--gold-cosmic), transparent);
            opacity: 0.4;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        .logo-icon { font-size: 2rem; filter: drop-shadow(0 0 20px rgba(212,175,55,0.2)); animation: pulse-glow 3s ease-in-out infinite; }
        .logo-icon .hex {
            display: inline-block;
            background: var(--verde-bosque);
            color: var(--gold-cosmic);
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 900;
            border: 2px solid var(--gold-cosmic);
            font-family: 'Orbitron', monospace;
        }
        @keyframes pulse-glow { 0%, 100% { filter: drop-shadow(0 0 20px rgba(212,175,55,0.2)); } 50% { filter: drop-shadow(0 0 40px rgba(212,175,55,0.4)); } }

        .logo-text {
            font-family: 'Orbitron', monospace;
            font-size: 1.3rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--gold-cosmic), var(--verde-bosque-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo-badge {
            font-family: 'Orbitron', monospace;
            font-size: 0.45rem;
            background: linear-gradient(135deg, var(--verde-bosque), var(--gold-cosmic));
            color: white;
            padding: 3px 12px;
            border-radius: 20px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            -webkit-text-fill-color: white;
            border: 1px solid rgba(212,175,55,0.2);
            animation: badge-pulse 2s ease-in-out infinite;
        }
        @keyframes badge-pulse { 0%, 100% { box-shadow: 0 0 30px rgba(15,45,26,0.3); } 50% { box-shadow: 0 0 60px rgba(212,175,55,0.2); } }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* ===== SELECTOR DE IDIOMA ===== */
        .language-selector {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            background: rgba(212,175,55,0.03);
            border-radius: 16px;
            border: 1px solid rgba(212,175,55,0.08);
        }
        .language-selector .lang-icon {
            font-size: 0.7rem;
            margin-right: 2px;
        }
        .lang-btn {
            padding: 2px 8px;
            border-radius: 10px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-muted);
            font-family: 'Orbitron', monospace;
            font-size: 0.45rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .lang-btn:hover {
            color: var(--text-secondary);
            background: rgba(212,175,55,0.05);
        }
        .lang-btn.active {
            border-color: var(--gold-cosmic);
            background: rgba(212,175,55,0.1);
            color: var(--gold-cosmic);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border: 1px solid var(--border);
            border-radius: 30px;
            background: rgba(212,175,55,0.03);
            color: var(--text-primary);
            font-family: 'Orbitron', monospace;
            font-size: 0.55rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
        }
        .btn:hover { transform: scale(1.02); border-color: var(--border-glow); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }

        .btn-primary {
            background: linear-gradient(135deg, var(--verde-bosque), var(--verde-bosque-light));
            border-color: var(--gold-cosmic);
            color: var(--gold-cosmic);
            -webkit-text-fill-color: var(--gold-cosmic);
        }
        .btn-primary:hover:not(:disabled) {
            background: linear-gradient(135deg, var(--verde-bosque-light), var(--verde-bosque));
            box-shadow: 0 0 40px rgba(15,45,26,0.5);
        }
        .btn-gold {
            background: linear-gradient(135deg, var(--gold-cosmic), #b8923a);
            border-color: transparent;
            color: #0a0c10;
            -webkit-text-fill-color: #0a0c10;
        }
        .btn-gold:hover:not(:disabled) { box-shadow: 0 0 40px rgba(212,175,55,0.3); }
        .btn-outline { border-color: var(--border); background: transparent; }
        .btn-outline:hover:not(:disabled) { background: rgba(212,175,55,0.05); border-color: var(--gold-cosmic); }
        .btn-sm { padding: 4px 10px; font-size: 0.5rem; }
        .btn-danger {
            background: rgba(255,51,102,0.15);
            border-color: rgba(255,51,102,0.3);
            color: var(--danger);
        }
        .btn-danger:hover:not(:disabled) { background: rgba(255,51,102,0.25); }
        .btn-trading {
            background: linear-gradient(135deg, var(--quantum), #0099ff);
            border-color: transparent;
            color: #0a0c10;
            -webkit-text-fill-color: #0a0c10;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.2);
            animation: pulse-trading 2s ease-in-out infinite;
        }
        .btn-trading:hover {
            box-shadow: 0 0 40px rgba(0, 229, 255, 0.4);
            transform: scale(1.03);
        }
        @keyframes pulse-trading {
            0%, 100% { box-shadow: 0 0 20px rgba(0, 229, 255, 0.2); }
            50% { box-shadow: 0 0 40px rgba(0, 229, 255, 0.4); }
        }
        .btn-internet {
            background: linear-gradient(135deg, var(--gold-cosmic), #00d68f);
            border-color: transparent;
            color: #0a0c10;
            -webkit-text-fill-color: #0a0c10;
            box-shadow: 0 0 20px rgba(0, 214, 143, 0.2);
            animation: pulse-internet 2s ease-in-out infinite;
        }
        .btn-internet:hover {
            box-shadow: 0 0 40px rgba(0, 214, 143, 0.4);
            transform: scale(1.03);
        }
        @keyframes pulse-internet {
            0%, 100% { box-shadow: 0 0 20px rgba(0, 214, 143, 0.2); }
            50% { box-shadow: 0 0 40px rgba(0, 214, 143, 0.4); }
        }
        .btn-tienda {
            background: linear-gradient(135deg, #a855f7, #7c3aed);
            border-color: transparent;
            color: #fff;
            -webkit-text-fill-color: #fff;
            box-shadow: 0 0 20px rgba(168,85,247,0.2);
            animation: pulse-tienda 2s ease-in-out infinite;
        }
        .btn-tienda:hover {
            box-shadow: 0 0 40px rgba(168,85,247,0.4);
            transform: scale(1.03);
        }
        @keyframes pulse-tienda {
            0%, 100% { box-shadow: 0 0 20px rgba(168,85,247,0.2); }
            50% { box-shadow: 0 0 40px rgba(168,85,247,0.4); }
        }
        .btn-wallet {
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            border-color: transparent;
            color: #0a0c10;
            -webkit-text-fill-color: #0a0c10;
            box-shadow: 0 0 20px rgba(0,212,255,0.2);
            animation: pulse-wallet 2s ease-in-out infinite;
        }
        .btn-wallet:hover {
            box-shadow: 0 0 40px rgba(0,212,255,0.4);
            transform: scale(1.03);
        }
        @keyframes pulse-wallet {
            0%, 100% { box-shadow: 0 0 20px rgba(0,212,255,0.2); }
            50% { box-shadow: 0 0 40px rgba(0,212,255,0.4); }
        }

        /* ===== BOTÓN MURO P2P ===== */
        .btn-muro-p2p {
            background: linear-gradient(135deg, var(--gold-cosmic), var(--verde-bosque-light));
            border-color: var(--gold-cosmic);
            color: var(--gold-cosmic);
            -webkit-text-fill-color: var(--gold-cosmic);
            box-shadow: 0 0 20px rgba(212,175,55,0.15);
            animation: pulse-muro 2s ease-in-out infinite;
        }
        .btn-muro-p2p:hover {
            box-shadow: 0 0 40px rgba(212,175,55,0.3);
            transform: scale(1.03);
        }
        @keyframes pulse-muro {
            0%, 100% { box-shadow: 0 0 20px rgba(212,175,55,0.15); }
            50% { box-shadow: 0 0 40px rgba(212,175,55,0.3); }
        }

        .status-badge {
            padding: 4px 12px;
            font-size: 0.5rem;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(212,175,55,0.06);
            border: 1px solid rgba(212,175,55,0.15);
            border-radius: 30px;
            color: var(--gold-cosmic);
            font-family: 'Orbitron', monospace;
        }
        .status-dot.online {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
            display: inline-block;
        }

        /* ===== BOTÓN LIVE DESTACADO ===== */
        .btn-live {
            background: linear-gradient(135deg, var(--live-red), #cc0033);
            border-color: var(--live-red);
            color: #fff;
            -webkit-text-fill-color: #fff;
            box-shadow: 0 0 20px rgba(255,0,51,0.3);
            animation: pulse-live 1.5s ease-in-out infinite;
        }
        .btn-live:hover {
            box-shadow: 0 0 40px rgba(255,0,51,0.5);
            transform: scale(1.05);
        }
        @keyframes pulse-live {
            0%, 100% { box-shadow: 0 0 20px rgba(255,0,51,0.3); }
            50% { box-shadow: 0 0 40px rgba(255,0,51,0.6); }
        }
        .btn-live .live-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #fff;
            border-radius: 50%;
            animation: dot-pulse 1s infinite;
            margin-right: 4px;
        }
        @keyframes dot-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* ===== LOGIN CARD ===== */
        .login-card {
            background: rgba(15,45,26,0.25);
            border: 1px solid var(--gold-dim);
            border-radius: var(--radius);
            padding: 32px 28px;
            max-width: 480px;
            margin: 20px auto;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
            flex: 1;
        }
        .login-card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(135deg, var(--gold-cosmic), var(--verde-bosque), var(--gold-cosmic));
            background-size: 300% 300%;
            border-radius: var(--radius);
            z-index: -1;
            opacity: 0.1;
            animation: border-flow 4s ease-in-out infinite;
        }
        @keyframes border-flow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .login-card .title {
            font-family: 'Orbitron', monospace;
            font-size: 1.2rem;
            text-align: center;
            color: var(--gold-cosmic);
            margin-bottom: 4px;
        }
        .login-card .subtitle {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.8rem;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-size: 0.6rem;
            color: var(--text-muted);
            font-family: 'Orbitron', monospace;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-group input {
            width: 100%;
            padding: 10px 14px;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--gold-dim);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 0.9rem;
            outline: none;
            transition: var(--transition);
            font-family: 'Space Grotesk', sans-serif;
        }
        .form-group input:focus {
            border-color: var(--gold-cosmic);
        }
        .form-group input::placeholder {
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .btn-login {
            width: 100%;
            justify-content: center;
            padding: 12px;
            font-size: 0.75rem;
            margin-top: 8px;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 18px 0;
            color: var(--text-muted);
            font-size: 0.6rem;
            font-family: 'Orbitron', monospace;
        }
        .divider hr {
            flex: 1;
            border: none;
            border-top: 1px solid var(--gold-dim);
        }

        .btn-google {
            width: 100%;
            justify-content: center;
            background: rgba(255,255,255,0.05);
            border-color: rgba(255,255,255,0.1);
            color: var(--text-primary);
            padding: 10px;
            font-size: 0.7rem;
        }
        .btn-google:hover {
            background: rgba(255,255,255,0.1);
            border-color: var(--gold-cosmic);
        }

        .terms-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.55rem;
            color: var(--text-muted);
            margin: 12px 0 6px;
            flex-wrap: wrap;
        }
        .terms-row a {
            color: var(--gold-cosmic);
            text-decoration: underline;
        }
        .terms-row input {
            accent-color: var(--gold-cosmic);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .login-footer-text {
            text-align: center;
            font-size: 0.6rem;
            color: var(--text-muted);
            margin-top: 14px;
        }

        /* ===== FOOTER ===== */
        .footer {
            margin-top: 40px;
            padding-top: 14px;
            border-top: 1px solid var(--gold-dim);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            position: relative;
        }
        .footer::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-cosmic), transparent);
            opacity: 0.2;
        }
        .footer-text {
            color: var(--text-muted);
            font-size: 0.5rem;
            letter-spacing: 0.5px;
            font-family: 'Orbitron', monospace;
        }
        .footer-text .brand { color: var(--gold-cosmic); }
        .footer-links {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.5rem;
            transition: var(--transition);
            font-family: 'Orbitron', monospace;
            letter-spacing: 0.5px;
        }
        .footer-links a:hover { color: var(--gold-cosmic); }
        .footer-hex {
            display: inline-block;
            background: var(--verde-bosque);
            color: var(--gold-cosmic);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.45rem;
            font-weight: 700;
            border: 1px solid var(--gold-cosmic);
            font-family: 'Orbitron', monospace;
        }

        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--verde-bosque);
            color: var(--gold-cosmic);
            padding: 10px 20px;
            border-radius: var(--radius);
            font-weight: 600;
            font-size: 0.7rem;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 5000;
            pointer-events: none;
            font-family: 'Orbitron', monospace;
            border: 1px solid rgba(212,175,55,0.15);
            max-width: 90%;
            text-align: center;
        }
        .toast.active { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.error { background: var(--danger); color: white; }

        @media (max-width: 480px) {
            .login-card { padding: 20px 16px; }
            .login-card .title { font-size: 1rem; }
            .header { flex-direction: column; align-items: flex-start; }
            .header-actions { width: 100%; justify-content: flex-start; flex-wrap: wrap; }
        }
    </style>
</head>
<body>
    <!-- ===== FONDO ESTELAR ===== -->
    <canvas id="stars-canvas"></canvas>

    <div class="app">

        <!-- HEADER CON LOGOTIPO Y SELECTOR DE IDIOMA -->
        <header class="header">
            <a href="/" class="logo">
                <span class="logo-icon"><span class="hex">◈</span></span>
                <span class="logo-text">Csariel's</span>
                <span class="logo-badge" data-i18n="inicio">Inicio</span>
            </a>
            <div class="header-actions">
                <!-- ===== SELECTOR DE IDIOMA ===== -->
                <div class="language-selector">
                    <span class="lang-icon">🌐</span>
                    <button class="lang-btn" data-lang="es" onclick="CSARIELS_IDIOMA.cambiar('es')">ES</button>
                    <button class="lang-btn" data-lang="en" onclick="CSARIELS_IDIOMA.cambiar('en')">EN</button>
                    <button class="lang-btn" data-lang="fr" onclick="CSARIELS_IDIOMA.cambiar('fr')">FR</button>
                </div>

                <div class="status-badge">
                    <span class="status-dot online"></span>
                    <span data-i18n="status_online">Online</span>
                </div>

                <button class="btn btn-muro-p2p btn-sm" onclick="window.location.href='/muro-p2p/index.html'">
                    <i class="fa-solid fa-users"></i> <span data-i18n="muro_p2p">Muro P2P</span>
                </button>

                <button class="btn btn-live btn-sm" onclick="window.location.href='/live/index.html'">
                    <span class="live-dot"></span> <span data-i18n="live">LIVE</span>
                </button>
            </div>
        </header>

        <!-- ===== LOGIN CARD ===== -->
        <main class="login-card">
            <h1 class="title">ACCESO AL SISTEMA</h1>
            <p class="subtitle">Ingresa tus datos o conéctate con Web3</p>

            <div class="form-group">
                <label><i class="fa-regular fa-user"></i> <span data-i18n="username">Nombre de Usuario</span></label>
                <input type="text" id="inputUsername" placeholder="Ej. Csariel" autocomplete="username">
            </div>
            <div class="form-group">
                <label><i class="fa-regular fa-envelope"></i> <span data-i18n="email">Correo Electrónico (Opcional)</span></label>
                <input type="email" id="inputEmail" placeholder="correo@dominio.com" autocomplete="email">
            </div>
            <div class="form-group">
                <label><i class="fa-regular fa-phone"></i> <span data-i18n="phone">Teléfono (Opcional)</span></label>
                <input type="tel" id="inputPhone" placeholder="+52..." autocomplete="tel">
            </div>

            <div class="terms-row">
