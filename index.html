<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#001A80" />
    <title>Marquinhos · Asistente Flotante</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <style>
        /* ===== VARIABLES Y RESET ===== */
        :root {
            --bg: #071019;
            --bg2: #0c1726;
            --card: rgba(9, 15, 24, .74);
            --blue: #1a237e;
            --blue2: #2f47cc;
            --white: #fbfdff;
            --gold: #d7b35c;
            --gold2: #b88b2d;
            --pink: #ffccd8;
            --shadow: rgba(0, 0, 0, .35);
            --glow: rgba(215, 179, 92, .22);
            --speed: .28s;
            --idle: 4s;
            --talavera-white: #F5F5F5;
            --talavera-dark: #0D47A1;
            --talavera-blue: #1565C0;
            --talavera-light: #42A5F5;
            --deep-blue: #0A1E3F;
            --talavera-gold: #FFD700;
            --soft-gold: #FFC107;
            --talavera-green: #00897B;
            --terracotta: #E65100;
            --cream: #FFF8E1;
            --ceramic: #FFFFFF;
            --child-safe: #4CAF50;
            --child-safe-bg: rgba(76, 175, 80, 0.15);
            --call-pause: #FF6B35;
            --call-pause-bg: rgba(255, 107, 53, 0.15);
            --mic-active: #00E5FF;
            --mic-active-bg: rgba(0, 229, 255, 0.15);
            --bluetooth: #2979FF;
            --bluetooth-bg: rgba(41, 121, 255, 0.15);
            /* Color activo (controlado por el usuario) */
            --color-activo: #001A80;
            --color-activo-rgb: 0, 26, 128;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
            font-family: "Space Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        }

        /* ===== ESCENA PRINCIPAL ===== */
        .scene {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: grid;
            place-items: center;
            perspective: 1200px;
            perspective-origin: 50% 42%;
            background: radial-gradient(circle at top, #173757 0%, #0a121d 38%, var(--bg) 100%);
        }

        .ambient {
            position: absolute;
            width: 540px;
            height: 540px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(215, 179, 92, .16) 0%, rgba(47, 71, 204, .08) 35%, transparent 70%);
            filter: blur(8px);
            transform: translateY(40px);
            pointer-events: none;
        }

        .shadow {
            position: absolute;
            bottom: 10%;
            width: 250px;
            height: 42px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 0, 0, .4) 0%, rgba(0, 0, 0, .18) 45%, transparent 70%);
            filter: blur(6px);
            transform: scale(1.15);
            pointer-events: none;
        }

        /* ===== CONTENEDOR PRINCIPAL ===== */
        .marquinhos {
            position: relative;
            width: 300px;
            transform-style: preserve-3d;
            animation: float 4.5s ease-in-out infinite;
            filter: drop-shadow(0 28px 34px rgba(0, 0, 0, .34));
            user-select: none;
            touch-action: none;
            isolation: isolate;
            transition: all 0.5s ease;
        }

        /* ===== TARJETA ===== */
        .card {
            background: linear-gradient(180deg, rgba(15, 23, 36, .8), rgba(7, 12, 20, .82));
            border: 1px solid rgba(255, 255, 255, .08);
            border-radius: 30px;
            padding: 18px 18px 16px;
            backdrop-filter: blur(10px);
            transform: rotateX(2deg);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05), 0 10px 30px rgba(0, 0, 0, .22);
            position: relative;
            transition: all 0.5s ease;
        }

        /* ===== HEAD ===== */
        .head {
            position: relative;
            width: 184px;
            height: 168px;
            margin: 0 auto;
            border: 4px solid var(--color-activo);
            border-radius: 50% 50% 42% 42%;
            overflow: visible;
            background: radial-gradient(circle at 35% 25%, rgba(255, 255, 255, .95) 0 28%, rgba(245, 249, 255, .98) 42%, #edf2ff 72%, #dfe9ff 100%);
            box-shadow: inset 0 16px 18px rgba(255, 255, 255, .75), inset 0 -18px 30px rgba(20, 40, 90, .06), 0 10px 24px rgba(0, 0, 0, .15);
            transform: translateZ(26px);
            transition: border-color .25s ease, box-shadow .25s ease;
        }

        .head::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 22px 20px, rgba(26, 35, 126, .9) 0 2px, transparent 2.5px),
                radial-gradient(circle at 46px 42px, rgba(26, 35, 126, .75) 0 2px, transparent 2.5px),
                radial-gradient(circle at 70px 18px, rgba(26, 35, 126, .5) 0 2px, transparent 2.5px),
                radial-gradient(circle at 118px 24px, rgba(26, 35, 126, .45) 0 2px, transparent 2.5px),
                radial-gradient(circle at 146px 48px, rgba(26, 35, 126, .72) 0 2px, transparent 2.5px);
            background-size: 56px 56px;
            opacity: .22;
            mix-blend-mode: multiply;
            pointer-events: none;
        }

        .head::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(145deg, rgba(255, 255, 255, .72), transparent 22%),
                linear-gradient(330deg, transparent 58%, rgba(26, 35, 126, .06) 100%);
            pointer-events: none;
        }

        /* ===== ANTENAS DISNEY ===== */
        .antenna {
            position: absolute;
            top: -24px;
            width: 6px;
            height: 30px;
            border-radius: 999px;
            background: linear-gradient(180deg, var(--blue2), var(--blue));
            transform-origin: bottom center;
            animation: sway 3.2s ease-in-out infinite alternate;
            box-shadow: 0 0 12px rgba(47, 71, 204, .25);
            transition: all 0.5s ease;
        }
        .antenna::after {
            content: "";
            position: absolute;
            left: 50%;
            top: -8px;
            width: 12px;
            height: 12px;
            transform: translateX(-50%);
            border-radius: 50%;
            background: radial-gradient(circle, #ffe9ab 0%, var(--gold) 55%, var(--gold2) 100%);
            box-shadow: 0 0 16px rgba(215, 179, 92, .7);
            transition: all 0.5s ease;
        }
        .antenna.left {
            left: 58px;
        }
        .antenna.right {
            right: 58px;
            animation-delay: .14s;
        }

        /* ===== CEJAS ===== */
        .brow {
            position: absolute;
            top: 32px;
            width: 34px;
            height: 8px;
            border-top: 4px solid var(--color-activo);
            border-radius: 50%;
            z-index: 4;
            opacity: .95;
            transition: transform .25s ease, top .25s ease, border-color .25s ease;
        }
        .brow.left {
            left: 30px;
            transform: rotate(-8deg);
        }
        .brow.right {
            right: 30px;
            transform: rotate(8deg);
        }

        /* ===== OJOS ===== */
        .eye {
            position: absolute;
            top: 46px;
            width: 42px;
            height: 50px;
            border-radius: 50%;
            overflow: hidden;
            background: #111;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .1);
            transition: clip-path 0.15s ease;
        }
        .eye.left {
            left: 30px;
        }
        .eye.right {
            right: 30px;
        }

        .eye::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 42%, #fff 0 56%, #eef4ff 66%, #d7e1ff 100%);
            border-radius: 50%;
            transform: scaleY(.74);
            transition: transform .2s ease;
        }

        .eye::after {
            content: "";
            position: absolute;
            left: 8px;
            right: 8px;
            top: -2px;
            height: 0;
            background: var(--white);
            border-bottom: 3px solid var(--color-activo);
            border-radius: 50%;
            z-index: 3;
            transition: height .2s ease, border-color .25s ease;
        }

        /* ===== IRIS ===== */
        .iris {
            position: absolute;
            z-index: 2;
            width: 18px;
            height: 18px;
            left: 12px;
            top: 14px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #5dd7ff 0 16%, #0d5aa3 38%, #061635 74%, #030814 100%);
            box-shadow: 0 0 8px rgba(0, 229, 255, .2);
            transition: transform .28s ease;
        }
        .iris::before {
            content: "";
            position: absolute;
            width: 7px;
            height: 7px;
            left: 3px;
            top: 3px;
            border-radius: 50%;
            background: #fff;
            opacity: .9;
        }

        /* ===== BOCA DISNEY (con forma de caricatura) ===== */
        .mouth-container {
            position: absolute;
            left: 50%;
            bottom: 33px;
            transform: translateX(-50%);
            width: 60px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.05s ease;
        }

        .mouth {
            width: 44px;
            height: 16px;
            border-bottom: 5px solid var(--color-activo);
            border-radius: 0 0 50% 50%;
            transition: all 0.04s ease;
            transform-origin: center;
            background: transparent;
            position: relative;
            transition: width 0.04s ease, height 0.04s ease, border-bottom-width 0.04s ease, border-radius 0.04s ease;
            filter: drop-shadow(0 2px 8px rgba(108, 60, 224, .15));
        }

        /* Formas de boca Disney */
        .mouth.shape-A {
            width: 52px;
            height: 30px;
            border-bottom-width: 6px;
            border-radius: 50% 50% 45% 45%;
        }
        .mouth.shape-E {
            width: 46px;
            height: 20px;
            border-bottom-width: 5px;
            border-radius: 0 0 50% 50%;
        }
        .mouth.shape-I {
            width: 34px;
            height: 14px;
            border-bottom-width: 4px;
            border-radius: 0 0 40% 40%;
        }
        .mouth.shape-O {
            width: 50px;
            height: 28px;
            border-bottom-width: 6px;
            border-radius: 50%;
        }
        .mouth.shape-U {
            width: 32px;
            height: 22px;
            border-bottom-width: 5px;
            border-radius: 50% 50% 40% 40%;
        }
        .mouth.shape-M {
            width: 28px;
            height: 8px;
            border-bottom-width: 4px;
            border-radius: 0 0 50% 50%;
        }
        .mouth.shape-F {
            width: 32px;
            height: 10px;
            border-bottom-width: 3px;
            border-radius: 0 0 30% 30%;
        }
        .mouth.shape-S {
            width: 36px;
            height: 10px;
            border-bottom-width: 3px;
            border-radius: 0 0 40% 40%;
        }
        .mouth.shape-neutral {
            width: 44px;
            height: 14px;
            border-bottom-width: 4px;
            border-radius: 0 0 50% 50%;
        }
        .mouth.shape-ORA {
            width: 55px;
            height: 32px;
            border-bottom-width: 7px;
            border-radius: 50%;
            border-color: #FF9500;
            animation: oraShake 0.4s ease-in-out;
        }

        @keyframes oraShake {
            0% { transform: translateX(-50%) scale(1) rotate(0deg); }
            25% { transform: translateX(-50%) scale(1.2) rotate(-5deg); }
            50% { transform: translateX(-50%) scale(1.1) rotate(5deg); }
            75% { transform: translateX(-50%) scale(1.15) rotate(-3deg); }
            100% { transform: translateX(-50%) scale(1) rotate(0deg); }
        }

        /* ===== MEJILLAS ===== */
        .cheek {
            position: absolute;
            bottom: 36px;
            width: 22px;
            height: 14px;
            border-radius: 50%;
            background: var(--pink);
            filter: blur(4px);
            opacity: .82;
            transition: opacity .3s ease, transform .3s ease, background .3s ease;
        }
        .cheek.left {
            left: 18px;
        }
        .cheek.right {
            right: 18px;
        }

        .chin {
            position: absolute;
            left: 50%;
            bottom: 12px;
            width: 64px;
            height: 18px;
            transform: translateX(-50%);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(26, 35, 126, .08) 0%, transparent 70%);
            opacity: .9;
        }

        /* ===== CUERPO ===== */
        .body {
            position: relative;
            width: 206px;
            height: 214px;
            margin: -8px auto 0;
            border: 4px solid var(--color-activo);
            border-radius: 28px 28px 36px 36px;
            overflow: hidden;
            background: radial-gradient(circle at 50% 0%, rgba(255, 255, 255, .96) 0 24%, rgba(246, 249, 255, .98) 45%, #edf3ff 85%, #dce5fb 100%);
            box-shadow: inset 0 14px 18px rgba(255, 255, 255, .7), inset 0 -18px 30px rgba(20, 40, 90, .08), 0 12px 24px rgba(0, 0, 0, .13);
            transform: translateZ(18px);
            animation: breathe var(--idle) ease-in-out infinite;
            transition: border-color .25s ease, box-shadow .25s ease;
        }

        .body::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent 0 44%, rgba(26, 35, 126, .12) 44% 48%, transparent 48% 100%),
                radial-gradient(circle at 15% 18%, rgba(215, 179, 92, .18) 0 2px, transparent 3px),
                radial-gradient(circle at 82% 22%, rgba(215, 179, 92, .14) 0 2px, transparent 3px),
                radial-gradient(circle at 25% 70%, rgba(26, 35, 126, .08) 0 2px, transparent 3px),
                radial-gradient(circle at 76% 66%, rgba(26, 35, 126, .08) 0 2px, transparent 3px);
            opacity: .28;
            background-size: 62px 62px;
            pointer-events: none;
        }

        /* ===== PECHO ===== */
        .chest {
            position: absolute;
            left: 50%;
            top: 18px;
            width: 110px;
            height: 58px;
            transform: translateX(-50%);
            border: 4px solid var(--gold2);
            border-radius: 18px;
            background: linear-gradient(180deg, rgba(215, 179, 92, .28), rgba(215, 179, 92, .08));
            box-shadow: inset 0 0 14px rgba(215, 179, 92, .16), 0 8px 14px rgba(0, 0, 0, .05);
            display: grid;
            place-items: center;
            transition: all 0.5s ease;
        }

        .chest::before {
            content: "MARQUINHOS";
            font-weight: 900;
            letter-spacing: 1.4px;
            font-size: 11px;
            color: var(--gold);
            text-shadow: 0 0 10px rgba(215, 179, 92, .2);
            font-family: "Orbitron", sans-serif;
            transition: all 0.5s ease;
        }

        /* ===== BRAZOS ===== */
        .arm {
            position: absolute;
            top: 30px;
            width: 26px;
            height: 100px;
            border: 4px solid var(--color-activo);
            border-radius: 15px;
            background: linear-gradient(180deg, #fff, #edf3ff);
            transform-origin: top center;
            box-shadow: inset 0 0 12px rgba(255, 255, 255, .45);
            transition: transform .35s cubic-bezier(.2, .8, .2, 1), border-color .25s ease;
        }
        .arm.left {
            left: -14px;
            transform: rotate(-12deg);
        }
        .arm.right {
            right: -14px;
            transform: rotate(12deg);
        }

        .forearm {
            position: absolute;
            left: 0;
            top: 76px;
            width: 22px;
            height: 84px;
            border: 3px solid var(--color-activo);
            border-radius: 12px;
            background: linear-gradient(180deg, #fff, #edf3ff);
            transform-origin: top center;
            box-shadow: inset 0 0 10px rgba(255, 255, 255, .45);
            transition: transform .35s cubic-bezier(.2, .8, .2, 1), border-color .25s ease;
        }

        .hand {
            position: absolute;
            left: -8px;
            top: 72px;
            width: 36px;
            height: 36px;
            border: 3px solid var(--color-activo);
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #fff 0 26%, #eef4ff 58%, #dce6fb 100%);
            transform-origin: center;
            box-shadow: inset 0 0 10px rgba(255, 255, 255, .4);
            transition: transform .35s cubic-bezier(.2, .8, .2, 1), border-color .25s ease;
        }

        .hand::after {
            content: "";
            position: absolute;
            inset: 8px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(215, 179, 92, .22) 0%, transparent 68%);
            opacity: .7;
        }

        .finger {
            position: absolute;
            top: 2px;
            width: 7px;
            height: 15px;
            border: 1px solid var(--color-activo);
            border-radius: 4px;
            background: #fff;
            transform-origin: bottom center;
            transition: transform .24s ease, border-color .25s ease;
        }
        .finger:nth-child(1) {
            left: 4px;
        }
        .finger:nth-child(2) {
            left: 13px;
        }
        .finger:nth-child(3) {
            left: 22px;
        }

        /* ===== PIERNAS ===== */
        .leg {
            position: absolute;
            bottom: -6px;
            width: 34px;
            height: 72px;
            border: 4px solid var(--color-activo);
            border-radius: 14px;
            background: linear-gradient(180deg, #fff, #edf3ff);
            box-shadow: inset 0 0 10px rgba(255, 255, 255, .42);
            transition: border-color .25s ease;
        }
        .leg.left {
            left: 53px;
        }
        .leg.right {
            right: 53px;
        }

        .foot {
            position: absolute;
            bottom: -16px;
            left: -8px;
            width: 50px;
            height: 22px;
            border: 4px solid var(--color-activo);
            border-radius: 18px 18px 10px 10px;
            background: linear-gradient(180deg, #fff, #edf3ff);
            transition: border-color .25s ease;
        }

        /* ===== TEXTO ===== */
        .caption {
            margin-top: 14px;
            text-align: center;
            font-size: 13px;
            color: rgba(255, 255, 255, .78);
            letter-spacing: .2px;
            transition: all 0.3s ease;
        }

        .name {
            margin-top: 4px;
            text-align: center;
            font-weight: 900;
            font-size: 18px;
            letter-spacing: .8px;
            color: var(--gold);
            text-shadow: 0 0 14px rgba(215, 179, 92, .18);
            font-family: "Orbitron", sans-serif;
            transition: all 0.5s ease;
        }

        /* ===== BURBUJA ===== */
        .bubble {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 14px;
            border-radius: 16px;
            background: rgba(10, 17, 28, .55);
            border: 1px solid rgba(255, 255, 255, .08);
            backdrop-filter: blur(10px);
            color: #dfe7ff;
            font-size: 13px;
            line-height: 1.35;
            width: min(340px, calc(100vw - 40px));
            pointer-events: none;
            transition: all 0.5s ease;
        }

        .bubble strong {
            color: var(--gold);
        }

        /* ===== INDICADOR DE MICRÓFONO ===== */
        .mic-indicator {
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 229, 255, 0.1);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(0, 229, 255, 0.2);
            font-size: 10px;
            color: var(--mic-active);
            transition: all 0.5s ease;
            opacity: 0;
            pointer-events: none;
        }

        .mic-indicator.active {
            opacity: 1;
        }

        .mic-indicator .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--mic-active);
            animation: micPulse 1s ease-in-out infinite;
        }

        @keyframes micPulse {
            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.5);
                opacity: 0.5;
            }
        }

        /* ===== SELECTOR DE COLOR (PALETA) ===== */
        .color-picker {
            position: absolute;
            top: -10px;
            right: -10px;
            z-index: 100;
            cursor: pointer;
            user-select: none;
            transition: all 0.3s ease;
        }

        .color-picker .palette-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            border: 2px solid rgba(255, 255, 255, 0.15);
            display: grid;
            place-items: center;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
        }

        .color-picker .palette-icon:hover {
            transform: scale(1.1);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .color-picker .palette-options {
            position: absolute;
            top: 40px;
            right: 0;
            background: rgba(10, 17, 28, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 8px 0;
            min-width: 170px;
            display: none;
            flex-direction: column;
            gap: 2px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            transform-origin: top right;
            animation: pickerSlide 0.2s ease-out;
        }

        .color-picker .palette-options.open {
            display: flex;
        }

        @keyframes pickerSlide {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(-8px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .color-picker .color-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 16px;
            border: none;
            background: transparent;
            color: #dfe7ff;
            font-family: "Space Grotesk", sans-serif;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            border-radius: 0;
            width: 100%;
            text-align: left;
        }

        .color-picker .color-option:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .color-picker .color-option .swatch {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            flex-shrink: 0;
            transition: border-color 0.2s ease;
        }

        .color-picker .color-option:hover .swatch {
            border-color: rgba(255, 255, 255, 0.5);
        }

        .color-picker .color-option .check-mark {
            margin-left: auto;
            opacity: 0;
            transition: opacity 0.2s ease;
