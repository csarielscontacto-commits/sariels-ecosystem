<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>◈ Csariel's | Iniciar Sesión</title>
  <meta name="theme-color" content="#0B3D2E" />
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon-512.png">
  
  <!-- Fuentes -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
  
  <style>
    :root {
      --space-deep: #05080f;
      --verde-bosque: #0B3D2E;
      --gold-cosmic: #f7d44a;
      --gold-dim: rgba(247,212,74,0.15);
      --text-primary: #e8f0f8;
      --text-secondary: #8ba3c7;
      --border: rgba(247,212,74,0.08);
      --radius: 20px;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--space-deep);
      color: var(--text-primary);
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 20px;
    }

    .login-container {
      max-width: 400px;
      width: 100%;
      text-align: center;
      background: rgba(11,61,46,0.1);
      border: 1px solid var(--gold-dim);
      border-radius: var(--radius);
      padding: 40px 30px;
      backdrop-filter: blur(10px);
    }

    .logo-icon {
      font-size: 3rem;
      display: inline-block;
      background: var(--verde-bosque);
      color: var(--gold-cosmic);
      padding: 10px 15px;
      border-radius: 12px;
      border: 2px solid var(--gold-cosmic);
      margin-bottom: 10px;
      font-family: 'Orbitron', monospace;
      font-weight: 900;
    }

    h1 {
      font-family: 'Orbitron', monospace;
      color: var(--gold-cosmic);
      font-size: 1.8rem;
      margin-bottom: 4px;
    }

    p.sub {
      color: var(--text-secondary);
      font-size: 0.9rem;
      margin-bottom: 30px;
    }

    .btn-main {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--gold-cosmic), #b8923a);
      border: none;
      border-radius: 30px;
      color: #0a0c10;
      font-family: 'Orbitron', monospace;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-main:hover { transform: scale(1.02); box-shadow: 0 0 30px rgba(247,212,74,0.3); }

    /* ===== MODAL DE LOGIN (Igual que antes) ===== */
    #authModal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      backdrop-filter: blur(5px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    .modal-box {
      background: rgba(11,61,46,0.95);
      border: 1px solid var(--gold-dim);
      border-radius: var(--radius);
      padding: 30px;
      max-width: 400px;
      width: 90%;
    }
    .modal-box h2 { font-family: 'Orbitron'; color: var(--gold-cosmic); margin-bottom: 15px; }
    .input-field {
      width: 100%;
      padding: 12px;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 10px;
      color: white;
      margin-bottom: 12px;
      font-family: 'Space Grotesk';
      outline: none;
    }
    .input-field:focus { border-color: var(--gold-cosmic); }
    .btn-login {
      width: 100%;
      padding: 12px;
      background: var(--gold-cosmic);
      border: none;
      border-radius: 30px;
      color: black;
      font-family: 'Orbitron';
      font-weight: 700;
      cursor: pointer;
      margin-top: 5px;
    }
    .btn-close-modal {
      background: none;
      border: none;
      color: #ff3366;
      font-size: 0.8rem;
      cursor: pointer;
      margin-top: 15px;
      font-family: 'Space Grotesk';
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="logo-icon">◈</div>
    <h1>Csariel's</h1>
    <p class="sub">Ecosistema Web3 de Puebla</p>

    <!-- ÚNICO BOTÓN DE ENTRADA -->
    <button class="btn-main" onclick="abrirLogin()">
      <i class="fas fa-arrow-right"></i> INICIAR SESIÓN
    </button>
  </div>

  <!-- MODAL DE LOGIN -->
  <div id="authModal">
    <div class="modal-box">
      <h2>🔐 Iniciar Sesión</h2>
      <input id="inputNombre" type="text" class="input-field" placeholder="Nombre completo">
      <input id="inputTel" type="tel" class="input-field" placeholder="Número de celular">
      <input id="inputEmail" type="email" class="input-field" placeholder="Correo electrónico">
      
      <button class="btn-login" onclick="entrarAlEcosistema()">
        🚀 ENTRAR AL ECOSISTEMA
      </button>
      <button class="btn-close-modal" onclick="document.getElementById('authModal').style.display='none'">Cerrar</button>
    </div>
  </div>

  <script>
    function abrirLogin() {
      document.getElementById('authModal').style.display = 'flex';
    }

    function entrarAlEcosistema() {
      const nombre = document.getElementById('inputNombre').value.trim();
      if(nombre.length < 2) { alert("Por favor escribe tu nombre."); return; }
      
      // Guardar sesión y redirigir a tu tablero principal (el mundo real)
      localStorage.setItem('csariel_nombre', nombre.toUpperCase());
      localStorage.setItem('csariel_login', 'true');
      
      // Redirigir al menú principal (o al carrusel del mundo que ya tienes en otra página)
      window.location.href = 'index.html'; // O redirige a un dashboard.html si lo tuvieras
    }
  </script>
</body>
</html>
