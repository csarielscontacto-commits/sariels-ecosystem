<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Música | Csariel's Live</title>
    <meta name="theme-color" content="#0F2D1A" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <style>
        body {
            background: #05080f;
            color: #e8f0f8;
            font-family: 'Space Grotesk', sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        .back {
            color: #D4AF37;
            text-decoration: none;
            font-family: 'Orbitron', monospace;
            font-size: 0.7rem;
            display: inline-block;
            margin-bottom: 20px;
        }
        .back:hover { color: #c4a030; }
        h1 {
            font-family: 'Orbitron', monospace;
            color: #D4AF37;
            font-size: 1.5rem;
            margin-bottom: 8px;
        }
        .sub {
            color: #8ba3c7;
            font-size: 0.85rem;
            margin-bottom: 24px;
        }
        .player {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(212,175,55,0.1);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
        }
        .player .album-art { font-size: 5rem; margin-bottom: 16px; }
        .player .song-title {
            font-family: 'Orbitron', monospace;
            font-size: 1.1rem;
            color: #e8f0f8;
        }
        .player .song-artist {
            color: #8ba3c7;
            font-size: 0.85rem;
            margin-bottom: 16px;
        }
        .player .progress {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.05);
            border-radius: 2px;
            margin: 16px 0;
            position: relative;
        }
        .player .progress .bar {
            width: 35%;
            height: 100%;
            background: linear-gradient(90deg, #D4AF37, #0F2D1A);
            border-radius: 2px;
            transition: width 0.3s ease;
        }
        .player .time {
            display: flex;
            justify-content: space-between;
            font-size: 0.65rem;
            color: #4a6a8a;
            font-family: 'Orbitron', monospace;
        }
        .player .controls {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin: 20px 0 12px;
        }
        .player .controls button {
            background: rgba(212,175,55,0.05);
            border: 1px solid rgba(212,175,55,0.1);
            color: #e8f0f8;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
        }
        .player .controls button:hover {
            background: rgba(212,175,55,0.1);
            border-color: #D4AF37;
            transform: scale(1.05);
        }
        .player .controls .btn-play {
            background: #D4AF37;
            border-color: #D4AF37;
            color: #0a0c10;
        }
        .player .controls .btn-play:hover {
            background: #c4a030;
            border-color: #c4a030;
        }
        .playlist {
            margin-top: 20px;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(212,175,55,0.05);
            border-radius: 12px;
            padding: 16px;
        }
        .playlist .song {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border-radius: 8px;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .playlist .song:hover { background: rgba(255,255,255,0.03); }
        .playlist .song.active {
            background: rgba(212,175,55,0.05);
            border-left: 2px solid #D4AF37;
        }
        .playlist .song .info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .playlist .song .info .num {
            color: #4a6a8a;
            font-size: 0.7rem;
            font-family: 'Orbitron', monospace;
            min-width: 24px;
        }
        .playlist .song .info .name { font-size: 0.8rem; }
        .playlist .song .info .artist {
            color: #4a6a8a;
            font-size: 0.65rem;
        }
        .playlist .song .duration {
            color: #4a6a8a;
            font-size: 0.6rem;
            font-family: 'Orbitron', monospace;
        }
        .badge {
            display: inline-block;
            background: rgba(212,175,55,0.1);
            color: #D4AF37;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.6rem;
            font-family: 'Orbitron', monospace;
            margin-left: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../index.html" class="back">← Volver al Live</a>
        <h1>🎵 Centro de Música</h1>
        <p class="sub">Reproductor sincronizado para el live</p>

        <div class="player">
            <div class="album-art">🎶</div>
            <div class="song-title">Starlight <span class="badge">En vivo</span></div>
            <div class="song-artist">Csariel's · 2026</div>
            <div class="progress"><div class="bar" style="width: 35%;"></div></div>
            <div class="time"><span>1:12</span><span>3:28</span></div>
            <div class="controls">
                <button><i class="fas fa-step-backward"></i></button>
                <button class="btn-play"><i class="fas fa-pause"></i></button>
                <button><i class="fas fa-step-forward"></i></button>
            </div>
        </div>

        <div class="playlist">
            <div class="song active">
                <div class="info"><span class="num">01</span><div><div class="name">Starlight ✦</div><div class="artist">Csariel's</div></div></div>
                <span class="duration">3:28</span>
            </div>
            <div class="song">
                <div class="info"><span class="num">02</span><div><div class="name">Galactic Dreams</div><div class="artist">Csariel's</div></div></div>
                <span class="duration">4:12</span>
            </div>
            <div class="song">
                <div class="info"><span class="num">03</span><div><div class="name">Neon Nights</div><div class="artist">Csariel's</div></div></div>
                <span class="duration">3:45</span>
            </div>
            <div class="song">
                <div class="info"><span class="num">04</span><div><div class="name">Cosmic Love</div><div class="artist">Csariel's</div></div></div>
                <span class="duration">5:03</span>
            </div>
            <div class="song">
                <div class="info"><span class="num">05</span><div><div class="name">Digital Soul</div><div class="artist">Csariel's</div></div></div>
                <span class="duration">3:58</span>
            </div>
        </div>
    </div>
    <script>
        console.log('🎵 Centro de Música - Csariel\'s');
    </script>
</body>
</html>
