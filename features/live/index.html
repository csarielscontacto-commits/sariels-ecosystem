<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="titulo_live">Live | Csariel's</title>
    <meta name="theme-color" content="#0F2D1A" />

    <!-- 🔒 CSP -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com https://*.supabase.co;
        style-src 'self' https://cdnjs.cloudflare.com https://fonts.googleapis.com 'unsafe-inline';
        font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;
        img-src 'self' data: https://*;
        connect-src 'self' https://*.supabase.co wss://*.supabase.co;
        frame-src 'self';
        media-src 'self';
        object-src 'none';
        base-uri 'self';
        form-action 'self';
    ">

    <!-- ===== RECURSOS ===== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet" />

    <!-- ===== SUPABASE ===== -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

    <!-- ===== CONECTORES ===== -->
    <script src="../../js/client-config-loader.js"></script>
    <script src="../../js/security.js"></script>
    <script src="../../js/perfil-connector.js"></script>
    <script src="../../js/esim-connector.js"></script>
    <script src="../../js/red-main.js"></script>

    <style>
        /* ================================================================
           ESTILOS CSARIEL'S - LIVE
           ================================================================ */
        :root {
            --space-deep: #05080f;
            --space-mid: #0a1428;
            --verde-bosque: #0F2D1A;
            --verde-bosque-light: #1a4a2a;
            --gold-cosmic: #D4AF37;
            --gold-dim: rgba(212,175,55,0.15);
            --gold-glow: rgba(212,175,55,0.25);
            --text-primary: #e8f0f8;
            --text-secondary: #8ba3c7;
            --text-muted: #4a6a8a;
            --border: rgba(212,175,55,0.08);
            --border-glow: rgba(212,175,55,0.25);
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --success: #00b894;
            --danger: #ff3366;
            --warning: #D4AF37;
            --quantum: #00e5ff;
            --live-red: #ff0033;
            --live-glow: rgba(255,0,51,0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            background: var(--space-deep);
            color: var(--text-primary);
            font-family: 'Space Grotesk', 'Inter', system-ui, sans-serif;
            line-height: 1.5;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        #stars-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .nebula {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.10;
            pointer-events: none;
            z-index: 0;
            animation: nebula-drift 25s ease-in-out infinite alternate;
        }
        .nebula-1 { width: 700px; height: 700px; background: var(--live-red); top: -15%; right: -15%; opacity: 0.05; }
        .nebula-2 { width: 600px; height: 600px; background: var(--gold-cosmic); bottom: -15%; left: -15%; animation-delay: -8s; opacity: 0.05; }
        .nebula-3 { width: 500px; height: 500px; background: var(--quantum); top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: -15s; opacity: 0.04; }

        @keyframes nebula-drift {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, -30px) scale(1.15); }
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: var(--space-deep); }
        ::-webkit-scrollbar-thumb { background: linear-gradient(var(--gold-cosmic), var(--verde-bosque)); border-radius: 3px; }

        .app {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px 20px 30px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0 16px;
            border-bottom: 2px solid var(--gold-dim);
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
            backdrop-filter: blur(10px);
            position: relative;
        }
        .header::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-cosmic), var(--verde-bosque), var(--gold-cosmic), transparent);
            opacity: 0.4;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        .logo-icon { font-size: 2rem; filter: drop-shadow(0 0 20px rgba(212,175,55,0.2)); animation: pulse-glow 3s ease-in-out infinite; }
        .logo-icon .hex {
            display: inline-block;
            background: var(--verde-bosque);
            color: var(--gold-cosmic);
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 900;
            border: 2px solid var(--gold-cosmic);
            font-family: 'Orbitron', monospace;
        }
        @keyframes pulse-glow { 0%, 100% { filter: drop-shadow(0 0 20px rgba(212,175,55,0.2)); } 50% { filter: drop-shadow(0 0 40px rgba(212,175,55,0.4)); } }

        .logo-text {
            font-family: 'Orbitron', monospace;
            font-size: 1.3rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--gold-cosmic), var(--verde-bosque-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo-badge {
            font-family: 'Orbitron', monospace;
            font-size: 0.45rem;
            background: linear-gradient(135deg, var(--verde-bosque), var(--gold-cosmic));
            color: white;
            padding: 3px 12px;
            border-radius: 20px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            -webkit-text-fill-color: white;
            border: 1px solid rgba(212,175,55,0.2);
            animation: badge-pulse 2s ease-in-out infinite;
        }
        @keyframes badge-pulse { 0%, 100% { box-shadow: 0 0 30px rgba(15,45,26,0.3); } 50% { box-shadow: 0 0 60px rgba(212,175,55,0.2); } }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border: 1px solid var(--border);
            border-radius: 30px;
            background: rgba(212,175,55,0.03);
            color: var(--text-primary);
            font-family: 'Orbitron', monospace;
            font-size: 0.55rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
        }
        .btn:hover { transform: scale(1.02); border-color: var(--border-glow); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }

        .btn-primary {
            background: linear-gradient(135deg, var(--verde-bosque), var(--verde-bosque-light));
            border-color: var(--gold-cosmic);
            color: var(--gold-cosmic);
            -webkit-text-fill-color: var(--gold-cosmic);
        }
        .btn-primary:hover:not(:disabled) {
            background: linear-gradient(135deg, var(--verde-bosque-light), var(--verde-bosque));
            box-shadow: 0 0 40px rgba(15,45,26,0.5);
        }
        .btn-gold {
            background: linear-gradient(135deg, var(--gold-cosmic), #b8923a);
            border-color: transparent;
            color: #0a0c10;
            -webkit-text-fill-color: #0a0c10;
        }
        .btn-gold:hover:not(:disabled) { box-shadow: 0 0 40px rgba(212,175,55,0.3); }
        .btn-outline { border-color: var(--border); background: transparent; }
        .btn-outline:hover:not(:disabled) { background: rgba(212,175,55,0.05); border-color: var(--gold-cosmic); }
        .btn-sm { padding: 4px 10px; font-size: 0.5rem; }
        .btn-danger {
            background: rgba(255,51,102,0.15);
            border-color: rgba(255,51,102,0.3);
            color: var(--danger);
        }
        .btn-danger:hover:not(:disabled) { background: rgba(255,51,102,0.25); }
        
        /* ===== BOTÓN LIVE - MÁS PEQUEÑO ===== */
        .btn-live {
            background: linear-gradient(135deg, var(--live-red), #cc0033);
            border-color: transparent;
            color: #fff;
            -webkit-text-fill-color: #fff;
            box-shadow: 0 0 15px var(--live-glow);
            animation: pulse-live 2s ease-in-out infinite;
            padding: 3px 10px;
            font-size: 0.45rem;
            border-radius: 20px;
        }
        .btn-live:hover:not(:disabled) {
            box-shadow: 0 0 25px var(--live-glow);
            transform: scale(1.03);
        }
        @keyframes pulse-live {
            0%, 100% { box-shadow: 0 0 15px var(--live-glow); }
            50% { box-shadow: 0 0 25px var(--live-glow); }
        }
        .btn-live .live-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #fff;
            border-radius: 50%;
            animation: dot-pulse 1s infinite;
            margin-right: 3px;
        }
        @keyframes dot-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .language-selector {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            background: rgba(212,175,55,0.03);
            border-radius: 16px;
            border: 1px solid rgba(212,175,55,0.08);
        }
        .language-selector .lang-icon { font-size: 0.7rem; margin-right: 2px; }
        .lang-btn {
            padding: 2px 8px;
            border-radius: 10px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-muted);
            font-family: 'Orbitron', monospace;
            font-size: 0.45rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .lang-btn:hover { color: var(--text-secondary); background: rgba(212,175,55,0.05); }
        .lang-btn.active { border-color: var(--gold-cosmic); background: rgba(212,175,55,0.1); color: var(--gold-cosmic); }

        .status-badge {
            padding: 3px 10px;
            font-size: 0.45rem;
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(212,175,55,0.06);
            border: 1px solid rgba(212,175,55,0.15);
            border-radius: 30px;
            color: var(--gold-cosmic);
            font-family: 'Orbitron', monospace;
        }
        .status-dot.online {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--success);
            display: inline-block;
        }

        /* ===== LIVE CONTAINER ===== */
        .live-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 20px;
            text-align: center;
            min-height: 300px;
        }
        .live-container .icono {
            font-size: 4rem;
            margin-bottom: 10px;
            opacity: 0.4;
        }
        .live-container h1 {
            font-family: 'Orbitron', monospace;
            font-size: 1.5rem;
            color: var(--gold-cosmic);
            margin-bottom: 4px;
        }
        .live-container .subtitle {
            color: var(--text-secondary);
            font-size: 0.75rem;
            max-width: 450px;
            line-height: 1.5;
        }
        .live-container .btn-live {
            margin-top: 10px;
            padding: 5px 16px;
            font-size: 0.5rem;
        }

        /* ===== TRANSMISIONES EN VIVO ===== */
        .transmisiones-section {
            margin-top: 16px;
            width: 100%;
            max-width: 800px;
        }
        .transmisiones-section h3 {
            font-family: 'Orbitron', monospace;
            font-size: 0.65rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-align: left;
        }
        .transmisiones-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 10px;
        }
        .transmision-card {
            background: rgba(15,45,26,0.12);
            border: 1px solid var(--gold-dim);
            border-radius: var(--radius);
            padding: 12px;
            text-align: center;
            transition: var(--transition);
            cursor: pointer;
        }
        .transmision-card:hover {
            border-color: var(--border-glow);
            transform: translateY(-2px);
        }
        .transmision-card.live {
            border-color: var(--live-red);
            box-shadow: 0 0 20px var(--live-glow);
        }
        .transmision-card .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--verde-bosque), var(--gold-cosmic));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: white;
            font-size: 0.85rem;
            margin: 0 auto 4px;
        }
        .transmision-card .nombre {
            font-weight: 600;
            font-size: 0.65rem;
            color: var(--text-primary);
        }
        .transmision-card .titulo {
            font-size: 0.5rem;
            color: var(--text-secondary);
            margin: 2px 0;
        }
        .transmision-card .badge-live {
            display: inline-block;
            background: var(--live-red);
            color: white;
            padding: 1px 8px;
            border-radius: 10px;
            font-size: 0.4rem;
            font-weight: 700;
            font-family: 'Orbitron', monospace;
            animation: pulse-live-text 1.5s ease-in-out infinite;
        }
        @keyframes pulse-live-text {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .transmision-card .viewers {
            font-size: 0.45rem;
            color: var(--text-muted);
            margin-top: 3px;
        }
        .transmision-card .viewers i {
            color: var(--gold-cosmic);
        }

        .empty-state {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            grid-column: 1/-1;
        }
        .empty-state .icon { font-size: 1.8rem; opacity: 0.3; margin-bottom: 4px; }
        .empty-state h3 { font-family: 'Orbitron', monospace; font-size: 0.6rem; color: var(--text-secondary); }
        .empty-state p { font-size: 0.5rem; }

        /* ===== FOOTER ===== */
        .footer {
            margin-top: 30px;
            padding-top: 12px;
            border-top: 1px solid var(--gold-dim);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            position: relative;
        }
        .footer::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-cosmic), transparent);
            opacity: 0.2;
        }
        .footer-text {
            color: var(--text-muted);
            font-size: 0.45rem;
            letter-spacing: 0.5px;
            font-family: 'Orbitron', monospace;
        }
        .footer-text .brand { color: var(--gold-cosmic); }
        .footer-links { display: flex; gap: 6px; flex-wrap: wrap; }
        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.45rem;
            transition: var(--transition);
            font-family: 'Orbitron', monospace;
            letter-spacing: 0.5px;
        }
        .footer-links a:hover { color: var(--gold-cosmic); }
        .footer-hex {
            display: inline-block;
            background: var(--verde-bosque);
            color: var(--gold-cosmic);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.4rem;
            font-weight: 700;
            border: 1px solid var(--gold-cosmic);
            font-family: 'Orbitron', monospace;
        }

        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--verde-bosque);
            color: var(--gold-cosmic);
            padding: 8px 16px;
            border-radius: var(--radius);
            font-weight: 600;
            font-size: 0.6rem;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 5000;
            pointer-events: none;
            font-family: 'Orbitron', monospace;
            border: 1px solid rgba(212,175,55,0.15);
            max-width: 90%;
            text-align: center;
        }
        .toast.active { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.error { background: var(--danger); color: white; }

        @media (max-width: 768px) {
            .header { flex-direction: column; align-items: flex-start; }
            .header-actions { width: 100%; justify-content: flex-start; flex-wrap: wrap; }
            .live-container h1 { font-size: 1.2rem; }
            .transmisiones-grid { grid-template-columns: 1fr 1fr; }
            .live-container .icono { font-size: 3rem; }
        }

        @media (max-width: 480px) {
            .btn { font-size: 0.4rem; padding: 3px 8px; }
            .live-container .icono { font-size: 2.5rem; }
            .live-container h1 { font-size: 1rem; }
            .transmisiones-grid { grid-template-columns: 1fr; }
            .btn-live { padding: 2px 8px; font-size: 0.4rem; }
        }
    </style>
</head>
<body>
    <!-- ===== FONDO ESTELAR ===== -->
    <canvas id="stars-canvas"></canvas>
    <div class="nebula nebula-1"></div>
    <div class="nebula nebula-2"></div>
    <div class="nebula nebula-3"></div>

    <div class="app">

        <!-- ===== HEADER ===== -->
        <header class="header">
            <a href="../../index.html" class="logo">
                <span class="logo-icon"><span class="hex">◈</span></span>
                <span class="logo-text">Csariel's</span>
                <span class="logo-badge" data-i18n="live">Live</span>
            </a>
            <div class="header-actions">
                <div class="language-selector">
                    <span class="lang-icon">🌐</span>
                    <button class="lang-btn" data-lang="es" onclick="CSARIELS_IDIOMA.cambiar('es')">ES</button>
                    <button class="lang-btn" data-lang="en" onclick="CSARIELS_IDIOMA.cambiar('en')">EN</button>
                    <button class="lang-btn" data-lang="fr" onclick="CSARIELS_IDIOMA.cambiar('fr')">FR</button>
                </div>

                <div class="status-badge">
                    <span class="status-dot online"></span>
                    <span data-i18n="en_linea">En línea</span>
                </div>

                <a href="../../index.html" class="btn btn-outline btn-sm">
                    <i class="fas fa-arrow-left"></i> <span data-i18n="volver">Volver</span>
                </a>
                <a href="../red/index.html" class="btn btn-primary btn-sm">
                    <i class="fas fa-users"></i> <span data-i18n="mi_red">Mi Red</span>
                </a>
                <!-- BOTÓN LIVE MÁS PEQUEÑO EN EL HEADER -->
                <button class="btn btn-live" onclick="iniciarDirecto()">
                    <span class="live-dot"></span> <span data-i18n="iniciar_directo">Directo</span>
                </button>
            </div>
        </header>

        <!-- ===== LIVE CONTAINER ===== -->
        <div class="live-container">
            <div class="icono">📹</div>
            <h1 data-i18n="live_titulo">Live en Csariel's</h1>
            <p class="subtitle" data-i18n="live_desc">Transmisiones en vivo, eventos y contenido exclusivo en tiempo real. ¡Conecta con la comunidad!</p>
            <!-- BOTÓN LIVE MÁS PEQUEÑO EN EL CONTENIDO -->
            <button class="btn btn-live" onclick="iniciarDirecto()">
                <span class="live-dot"></span> <span data-i18n="iniciar_directo">Iniciar Directo</span>
            </button>
        </div>

        <!-- ===== TRANSMISIONES EN VIVO ===== -->
        <div class="transmisiones-section">
            <h3><i class="fas fa-broadcast" style="color:var(--live-red);"></i> <span data-i18n="transmisiones_activas">Transmisiones activas</span></h3>
            <div class="transmisiones-grid" id="transmisionesGrid">
                <!-- Renderizado con JavaScript -->
            </div>
        </div>

        <!-- ===== FOOTER ===== -->
        <footer class="footer">
            <span class="footer-text">
                <span class="brand">◈ Csariel's</span> — <span data-i18n="footer_live">Live · Transmisiones · Comunidad</span>
            </span>
            <div class="footer-links">
                <a href="../../index.html" data-i18n="inicio">🏠 Inicio</a>
                <a href="../red/index.html" data-i18n="mi_red">👥 Mi Red</a>
                <a href="../foro/index.html" data-i18n="foro">💬 Foro</a>
                <span class="footer-hex">◈</span>
            </div>
        </footer>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <!-- ================================================================ -->
    <!-- 🔥 SCRIPTS -->
    <!-- ================================================================ -->
    <script>
        // ================================================================
        // 📋 DATOS DE TRANSMISIONES
        // ================================================================
        let transmisiones = [
            { id: 1, nombre: 'Csariel', avatar: 'C', titulo: '🚀 Explorando la nueva actualización', live: true, viewers: 42 },
            { id: 2, nombre: 'María', avatar: 'M', titulo: '🎨 Diseño en tiempo real', live: true, viewers: 18 },
            { id: 3, nombre: 'Javier', avatar: 'J', titulo: '🎮 Gameplay de estrategia', live: false, viewers: 0 },
            { id: 4, nombre: 'Laura', avatar: 'L', titulo: '🌌 Charla sobre el espacio', live: false, viewers: 0 },
        ];

        let nextId = 5;

        // ================================================================
        // 🖥️ RENDERIZAR TRANSMISIONES
        // ================================================================
        function renderTransmisiones() {
            const grid = document.getElementById('transmisionesGrid');
            const t = CSARIELS_IDIOMA.traducciones || {};

            // Ordenar: primero las que están en vivo
            const ordenadas = [...transmisiones].sort((a, b) => (b.live ? 1 : 0) - (a.live ? 1 : 0));

            if (ordenadas.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📡</div>
                        <h3>${t.sin_transmisiones || 'Sin transmisiones'}</h3>
                        <p>${t.sin_transmisiones_desc || 'No hay transmisiones en vivo en este momento.'}</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = ordenadas.map(t => `
                <div class="transmision-card ${t.live ? 'live' : ''}" onclick="verDirecto(${t.id})">
                    <div class="avatar">${t.avatar}</div>
                    <div class="nombre">${t.nombre}</div>
                    <div class="titulo">${t.titulo}</div>
                    ${t.live ? `<span class="badge-live">● EN VIVO</span>` : ''}
                    <div class="viewers">
                        ${t.live ? `<i class="fas fa-eye"></i> ${t.viewers} ${t.viewers === 1 ? 'espectador' : 'espectadores'}` : '📹 Grabación'}
                    </div>
                </div>
            `).join('');
        }

        // ================================================================
        // 🎯 ACCIONES
        // ================================================================
        function iniciarDirecto() {
            const t = CSARIELS_IDIOMA.traducciones || {};
            const titulo = prompt('📹 Título de la transmisión:', 'Mi directo en Csariel\'s');
            if (!titulo) return;

            const nuevo = {
                id: nextId++,
                nombre: 'Csariel',
                avatar: 'C',
                titulo: titulo,
                live: true,
                viewers: 1
            };

            transmisiones.unshift(nuevo);
            renderTransmisiones();
            mostrarToast(`✅ ${t.directo_iniciado || 'Transmisión iniciada'}: "${titulo}"`);
        }

        function verDirecto(id) {
            const t = transmisiones.find(t => t.id === id);
            if (!t) return;
            if (t.live) {
                mostrarToast(`📺 Viendo "${t.titulo}" - ${t.viewers} ${t.viewers === 1 ? 'espectador' : 'espectadores'}`);
            } else {
                mostrarToast(`📹 Reproduciendo grabación: "${t.titulo}"`);
            }
        }

        // ================================================================
        // 🔌 CONEXIÓN CON SUPABASE (usando tus conectores)
        // ================================================================
        async function cargarTransmisionesDesdeSupabase() {
            if (!window.supabase) {
                console.log('⚠️ Supabase no disponible, usando datos locales');
                return;
            }

            try {
                const { data, error } = await window.supabase
                    .from('transmisiones')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (data && data.length > 0) {
                    transmisiones = data.map(t => ({
                        id: t.id,
                        nombre: t.nombre || 'Usuario',
                        avatar: t.nombre ? t.nombre.charAt(0).toUpperCase() : 'U',
                        titulo: t.titulo || 'Transmisión',
                        live: t.activa || false,
                        viewers: t.viewers || 0
                    }));
                    renderTransmisiones();
                    console.log('📹 Transmisiones cargadas desde Supabase:', data.length);
                }
            } catch (error) {
                console.warn('⚠️ Error cargando transmisiones desde Supabase:', error.message);
            }
        }

        // ================================================================
        // 🚀 INICIALIZAR
        // ================================================================
        document.addEventListener('DOMContentLoaded', async function() {
            // Inicializar estrellas
            initStars();

            // Inicializar idioma
            await CSARIELS_IDIOMA.init();

            // Cargar transmisiones
            renderTransmisiones();

            // Intentar cargar desde Supabase
            await cargarTransmisionesDesdeSupabase();

            console.log('📹 Csariel\'s - Live cargado');

            // Simular cambios en espectadores cada 10 segundos
            setInterval(() => {
                transmisiones.forEach(t => {
                    if (t.live) {
                        t.viewers += Math.floor(Math.random() * 5) - 2;
                        if (t.viewers < 1) t.viewers = 1;
                    }
                });
                renderTransmisiones();
            }, 15000);
        });

        // Exponer funciones globales
        window.iniciarDirecto = iniciarDirecto;
        window.verDirecto = verDirecto;
        window.renderTransmisiones = renderTransmisiones;
        window.mostrarToast = mostrarToast;
        window.CSARIELS_IDIOMA = CSARIELS_IDIOMA;
        window.initStars = initStars;
    </script>
</body>
</html>
