<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Marquinhos · Asistente Csariel's</title>
    <meta name="theme-color" content="#0F2D1A" />

    <!-- ===== RECURSOS ===== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet" />

    <!-- ===== SUPABASE ===== -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

    <!-- ===== CONECTORES DE CSARIEL'S ===== -->
    <script src="/js/client-config-loader.js"></script>
    <script src="/js/security.js"></script>
    <script src="/js/red-main.js"></script>

    <style>
        /* ===== RESET Y VARIABLES ===== */
        :root {
            --space-deep: #05080f;
            --space-mid: #0a1428;
            --verde-bosque: #0F2D1A;
            --verde-bosque-light: #1a4a2a;
            --gold-cosmic: #D4AF37;
            --gold-dim: rgba(212,175,55,0.15);
            --gold-glow: rgba(212,175,55,0.25);
            --text-primary: #e8f0f8;
            --text-secondary: #8ba3c7;
            --text-muted: #4a6a8a;
            --border: rgba(212,175,55,0.08);
            --border-glow: rgba(212,175,55,0.25);
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --success: #00b894;
            --danger: #ff3366;
            --warning: #D4AF37;
            --quantum: #00e5ff;
            --color-activo: #1565C0;
            --talavera-blue: #1565C0;
            --talavera-light: #42A5F5;
            --talavera-dark: #0D47A1;
            --ceramic: #FFFFFF;
            --cream: #FFF8E1;
            --mic-active: #00E5FF;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            background: var(--space-deep);
            color: var(--text-primary);
            font-family: 'Space Grotesk', system-ui, sans-serif;
            min-height: 100vh;
            overflow: hidden;
        }

        #stars-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .nebula {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.08;
            pointer-events: none;
            z-index: 0;
            animation: nebula-drift 25s ease-in-out infinite alternate;
        }
        .nebula-1 { width: 600px; height: 600px; background: var(--verde-bosque); top: -15%; right: -15%; }
        .nebula-2 { width: 500px; height: 500px; background: var(--gold-cosmic); bottom: -15%; left: -15%; animation-delay: -8s; opacity: 0.04; }
        .nebula-3 { width: 400px; height: 400px; background: var(--quantum); top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: -15s; opacity: 0.03; }

        @keyframes nebula-drift {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, -20px) scale(1.1); }
        }

        .app {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px 20px 30px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0 16px;
            border-bottom: 2px solid var(--gold-dim);
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
            width: 100%;
            position: relative;
        }
        .header::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-cosmic), var(--verde-bosque), var(--gold-cosmic), transparent);
            opacity: 0.4;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        .logo-icon { font-size: 2rem; filter: drop-shadow(0 0 20px rgba(212,175,55,0.2)); }
        .logo-icon .hex {
            display: inline-block;
            background: var(--verde-bosque);
            color: var(--gold-cosmic);
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 900;
            border: 2px solid var(--gold-cosmic);
            font-family: 'Orbitron', monospace;
        }
        .logo-text {
            font-family: 'Orbitron', monospace;
            font-size: 1.3rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--gold-cosmic), var(--verde-bosque-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 16px;
            border: 1px solid var(--border);
            border-radius: 30px;
            background: rgba(212,175,55,0.03);
            color: var(--text-primary);
            font-family: 'Orbitron', monospace;
            font-size: 0.6rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
        }
        .btn:hover { transform: scale(1.02); border-color: var(--border-glow); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }

        .btn-primary {
            background: linear-gradient(135deg, var(--verde-bosque), var(--verde-bosque-light));
            border-color: var(--gold-cosmic);
            color: var(--gold-cosmic);
            -webkit-text-fill-color: var(--gold-cosmic);
        }
        .btn-gold {
            background: linear-gradient(135deg, var(--gold-cosmic), #b8923a);
            border-color: transparent;
            color: #0a0c10;
            -webkit-text-fill-color: #0a0c10;
        }
        .btn-outline { border-color: var(--border); background: transparent; }
        .btn-sm { padding: 4px 12px; font-size: 0.55rem; }
        .btn-danger {
            background: rgba(255,51,102,0.15);
            border-color: rgba(255,51,102,0.3);
            color: var(--danger);
        }
        .btn-danger:hover { background: rgba(255,51,102,0.25); }

        /* ===== MARQUINHOS WIDGET ===== */
        .marquinhos-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 10px 0;
            width: 100%;
            max-width: 500px;
        }

        #marquinhos-float {
            width: 200px;
            height: 260px;
            position: relative;
            cursor: grab;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            pointer-events: auto;
            filter: drop-shadow(0 8px 30px rgba(13, 71, 161, 0.3));
            transition: none;
            margin: 0 auto;
        }

        #marquinhos-float:active {
            cursor: grabbing;
        }

        /* ===== MARQUINHOS WIDGET ===== */
        .marquinhos-widget {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            animation: float-mq 4.5s ease-in-out infinite;
            user-select: none;
            touch-action: none;
            isolation: isolate;
            pointer-events: none;
            margin: 0 auto;
        }

        .marquinhos-widget * {
            pointer-events: none;
        }

        .marquinhos-widget .card {
            background: transparent;
            border: none;
            padding: 0;
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* HEAD */
        .marquinhos-widget .head {
            position: relative;
            width: 130px;
            height: 120px;
            margin: 0 auto 0;
            border: 3px solid var(--color-activo, #1565C0);
            border-radius: 50% 50% 45% 45%;
            overflow: visible;
            background: radial-gradient(circle at 35% 25%, #FFFFFF 0%, #FFF8E1 60%, #f5efe0 85%, #e8e0d0 100%);
            box-shadow: inset 0 4px 12px rgba(255, 255, 255, 0.6), inset 0 -4px 12px rgba(13, 71, 161, 0.08), 0 4px 12px rgba(0, 0, 0, 0.10);
            transform: translateZ(10px);
            transition: border-color .3s ease, box-shadow .3s ease;
            z-index: 10;
        }

        .marquinhos-widget .head::before {
            content: "";
            position: absolute;
            inset: 6px;
            border-radius: 50%;
            background-image:
                radial-gradient(circle at 20% 30%, #1565C0 2px, transparent 2px),
                radial-gradient(circle at 80% 25%, #1565C0 2px, transparent 2px),
                radial-gradient(circle at 50% 15%, #1565C0 2.5px, transparent 2.5px),
                radial-gradient(circle at 70% 70%, #1565C0 1.8px, transparent 1.8px),
                radial-gradient(circle at 30% 75%, #1565C0 1.8px, transparent 1.8px),
                radial-gradient(circle at 50% 55%, #1565C0 2px, transparent 2px),
                radial-gradient(circle at 15% 55%, #42A5F5 1.5px, transparent 1.5px),
                radial-gradient(circle at 85% 55%, #42A5F5 1.5px, transparent 1.5px);
            background-size: 50px 50px;
            background-repeat: repeat;
            opacity: 0.2;
            pointer-events: none;
            z-index: 1;
        }

        .marquinhos-widget .head::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.4) 0%, transparent 60%);
            pointer-events: none;
            border-radius: inherit;
            z-index: 2;
        }

        /* ANTENAS */
        .marquinhos-widget .antenna {
            position: absolute;
            top: -16px;
            width: 4px;
            height: 20px;
            border-radius: 999px;
            background: linear-gradient(180deg, #1565C0, #42A5F5);
            transform-origin: bottom center;
            animation: sway-mq 3.2s ease-in-out infinite alternate;
            box-shadow: none;
            transition: all 0.5s ease;
            z-index: 15;
        }
        .marquinhos-widget .antenna::after {
            content: "";
            position: absolute;
            left: 50%;
            top: -10px;
            width: 16px;
            height: 16px;
            transform: translateX(-50%);
            border-radius: 50%;
            background: radial-gradient(circle at 40% 35%, #FFFFFF 0%, #FFF8E1 65%, #42A5F5 100%);
            border: 2px solid #1565C0;
            box-shadow: inset 0 0 6px rgba(255, 255, 255, 0.5), 0 0 0 1px rgba(13, 71, 161, 0.15);
            transition: all 0.5s ease;
        }
        .marquinhos-widget .antenna.left {
            left: 34px;
        }
        .marquinhos-widget .antenna.right {
            right: 34px;
            animation-delay: .14s;
        }

        /* CEJAS */
        .marquinhos-widget .brow {
            position: absolute;
            top: 26px;
            width: 26px;
            height: 6px;
            border-top: 3px solid var(--color-activo, #1565C0);
            border-radius: 50%;
            z-index: 14;
            opacity: 1;
            transition: transform .3s ease, top .3s ease, border-color .3s ease;
        }
        .marquinhos-widget .brow.left {
            left: 20px;
            transform: rotate(-4deg);
        }
        .marquinhos-widget .brow.right {
            right: 20px;
            transform: rotate(4deg);
        }

        /* OJOS */
        .marquinhos-widget .eye {
            position: absolute;
            top: 34px;
            width: 30px;
            height: 34px;
            border-radius: 50%;
            overflow: hidden;
            background: #1A0A2E;
            box-shadow: inset 0 0 0 2px rgba(13, 71, 161, 0.12), 0 0 8px rgba(21, 101, 192, 0.08);
            transition: clip-path 0.15s ease;
            z-index: 13;
        }
        .marquinhos-widget .eye.left {
            left: 20px;
        }
        .marquinhos-widget .eye.right {
            right: 20px;
        }

        .marquinhos-widget .eye::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 42%, #fff 0 56%, #f5f0e8 66%, #e8e0d0 100%);
            border-radius: 50%;
            transform: scaleY(.78);
            transition: transform .2s ease;
        }

        .marquinhos-widget .eye::after {
            content: "";
            position: absolute;
            left: 5px;
            right: 5px;
            top: -2px;
            height: 0;
            background: #FFF8F0;
            border-bottom: 3px solid var(--color-activo, #1565C0);
            border-radius: 50%;
            z-index: 13;
            transition: height .2s ease, border-color .3s ease;
        }

        /* IRIS */
        .marquinhos-widget .iris {
            position: absolute;
            z-index: 13;
            width: 14px;
            height: 14px;
            left: 8px;
            top: 10px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #6dd5ff 0 16%, #1a6cb0 38%, #0a1a3e 74%, #030810 100%);
            box-shadow: 0 0 10px rgba(0, 229, 255, .15), inset 0 0 6px rgba(255, 255, 255, .1);
            transition: transform .3s ease;
        }
        .marquinhos-widget .iris::before {
            content: "";
            position: absolute;
            width: 5px;
            height: 5px;
            left: 2px;
            top: 2px;
            border-radius: 50%;
            background: #fff;
            opacity: .9;
        }

        /* BOCA */
        .marquinhos-widget .mouth-container {
            position: absolute;
            left: 50%;
            bottom: 14px;
            transform: translateX(-50%);
            width: 36px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 13;
        }

        .marquinhos-widget .mouth {
            width: 28px;
            height: 8px;
            border-bottom: 3px solid var(--color-activo, #1565C0);
            border-radius: 0 0 50% 50%;
            transition: all 0.04s ease;
            transform-origin: center;
            background: transparent;
            position: relative;
            filter: drop-shadow(0 1px 4px rgba(21, 101, 192, .10));
        }

        .marquinhos-widget .mouth.shape-neutral { width: 28px; height: 8px; border-bottom-width: 3px; border-radius: 0 0 50% 50%; }
        .marquinhos-widget .mouth.talking { animation: talk-mq .12s ease-in-out infinite alternate; }

        /* MEJILLAS */
        .marquinhos-widget .cheek {
            position: absolute;
            bottom: 20px;
            width: 18px;
            height: 12px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 107, 138, 0.5) 0%, rgba(255, 59, 111, 0.2) 100%);
            filter: blur(4px);
            opacity: .5;
            transition: opacity .3s ease;
            z-index: 12;
        }
        .marquinhos-widget .cheek.left {
            left: 8px;
        }
        .marquinhos-widget .cheek.right {
            right: 8px;
        }

        /* CUERPO */
        .marquinhos-widget .body {
            position: relative;
            width: 135px;
            height: 115px;
            margin: -4px auto 0;
            border: 3px solid var(--color-activo, #1565C0);
            border-radius: 25px 25px 35px 35px;
            overflow: visible;
            background: radial-gradient(circle at 50% 0%, #FFFFFF 0%, #FFF8E1 55%, #f0ead8 85%, #e0d8c0 100%);
            box-shadow: inset 0 4px 12px rgba(255, 255, 255, 0.5), inset 0 -4px 12px rgba(13, 71, 161, 0.06), 0 4px 12px rgba(0, 0, 0, 0.08);
            transform: translateZ(8px);
            animation: breathe-mq 4s ease-in-out infinite;
            transition: border-color .3s ease;
            z-index: 5;
        }

        .marquinhos-widget .body::before {
            content: "";
            position: absolute;
            inset: 6px;
            border-radius: 18px;
            background-image:
                radial-gradient(circle at 20% 25%, #1565C0 2px, transparent 2px),
                radial-gradient(circle at 80% 30%, #1565C0 1.8px, transparent 1.8px),
                radial-gradient(circle at 50% 15%, #1565C0 1.8px, transparent 1.8px),
                radial-gradient(circle at 70% 70%, #1565C0 1.8px, transparent 1.8px),
                radial-gradient(circle at 30% 75%, #1565C0 1.8px, transparent 1.8px),
                radial-gradient(circle at 50% 50%, #42A5F5 2px, transparent 2px);
            background-size: 40px 40px;
            background-repeat: repeat;
            opacity: 0.15;
            pointer-events: none;
            z-index: 1;
        }

        .marquinhos-widget .body::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.25) 0%, transparent 50%);
            pointer-events: none;
            border-radius: inherit;
            z-index: 2;
        }

        /* PECHO */
        .marquinhos-widget .chest {
            position: absolute;
            left: 50%;
            top: 10px;
            width: 70px;
            height: 32px;
            transform: translateX(-50%);
            border: 2.5px solid #1565C0;
            border-radius: 10px;
            background: #FFFFFF;
            box-shadow: inset 0 0 0 1px rgba(13, 71, 161, 0.05), 0 2px 8px rgba(0, 0, 0, 0.04);
            display: grid;
            place-items: center;
            transition: all 0.5s ease;
            z-index: 10;
            overflow: hidden;
        }

        .marquinhos-widget .chest::before {
            content: "MARQUINHOS";
            font-weight: 700;
            letter-spacing: 0.6px;
            font-size: 7px;
            color: #0D47A1;
            font-family: "Quicksand", sans-serif;
            transition: all 0.5s ease;
            text-align: center;
            line-height: 1.1;
            padding: 0 2px;
        }

        /* BRAZOS - FUERA DEL CUERPO */
        .marquinhos-widget .arm {
            position: absolute;
            top: 10px;
            width: 18px;
            height: 60px;
            border: 3px solid var(--color-activo, #1565C0);
            border-radius: 12px;
            background: linear-gradient(180deg, #FFFFFF, #FFF8E1);
            transform-origin: top center;
            box-shadow: inset 0 0 8px rgba(255, 255, 255, 0.4);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), border-color .3s ease;
            z-index: 6;
            will-change: transform;
        }
        .marquinhos-widget .arm.left {
            left: -16px;
            transform: rotate(-15deg);
        }
        .marquinhos-widget .arm.right {
            right: -16px;
            transform: rotate(15deg);
        }

        /* MANOS - FUERA DEL CUERPO */
        .marquinhos-widget .hand {
            position: absolute;
            width: 28px;
            height: 28px;
            border: 3px solid var(--color-activo, #1565C0);
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #FFFFFF 0%, #FFF8E1 60%, #e8e0d0 100%);
            transform-origin: center;
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.3);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), border-color .3s ease;
            z-index: 7;
        }
        .marquinhos-widget .hand.left {
            left: -28px;
            top: 54px;
        }
        .marquinhos-widget .hand.right {
            right: -28px;
            top: 54px;
        }

        /* PIERNAS - FUERA DEL CUERPO */
        .marquinhos-widget .leg {
            position: absolute;
            bottom: -40px;
            width: 24px;
            height: 44px;
            border: 3px solid var(--color-activo, #1565C0);
            border-radius: 10px;
            background: linear-gradient(180deg, #FFFFFF, #FFF8E1);
            box-shadow: inset 0 0 8px rgba(255, 255, 255, 0.3);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), border-color .3s ease;
            z-index: 4;
            will-change: transform;
        }
        .marquinhos-widget .leg.left {
            left: 32px;
            transform: rotate(0deg);
        }
        .marquinhos-widget .leg.right {
            right: 32px;
            transform: rotate(0deg);
        }

        /* PIES - FUERA DEL CUERPO */
        .marquinhos-widget .foot {
            position: absolute;
            bottom: -14px;
            left: -8px;
            width: 38px;
            height: 16px;
            border: 3px solid var(--color-activo, #1565C0);
            border-radius: 12px 12px 8px 8px;
            background: linear-gradient(180deg, #FFFFFF, #FFF8E1);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), border-color .3s ease;
            z-index: 3;
        }

        /* BURBUJA DE TEXTO */
        .marquinhos-widget #speech-bubble {
            position: absolute;
            bottom: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            color: #0D47A1;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 9px;
            font-family: "Quicksand", sans-serif;
            z-index: 100;
            max-width: 140px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12), 0 0 0 1px rgba(21, 101, 192, 0.08);
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.25s ease;
            opacity: 0;
            border: 1px solid rgba(21, 101, 192, 0.1);
            line-height: 1.3;
            font-weight: 600;
            white-space: nowrap;
        }

        .marquinhos-widget #speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 6px solid rgba(255, 255, 255, 0.95);
        }

        .marquinhos-widget #speech-bubble.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(-2px);
        }

        .marquinhos-widget #speech-bubble.listening {
            border-color: #00E5FF;
            color: #00B4D8;
            background: rgba(0, 229, 255, 0.08);
        }

        .marquinhos-widget #speech-bubble.listening::after {
            border-top-color: rgba(0, 229, 255, 0.08);
        }

        .marquinhos-widget #speech-bubble.thinking {
            border-color: #FF6B35;
            color: #BF360C;
            background: rgba(255, 107, 53, 0.08);
        }

        .marquinhos-widget #speech-bubble.thinking::after {
            border-top-color: rgba(255, 107, 53, 0.08);
        }

        /* ESTADOS */
        .marquinhos-widget.on-call .antenna {
            animation: callPulse-mq 1.2s ease-in-out infinite alternate;
        }
        .marquinhos-widget.on-call .chest::before {
            content: "📞 LLAMADA";
            color: #FF6B35;
            font-size: 6px;
        }

        .marquinhos-widget.talking .mouth {
            animation: talk-mq .12s ease-in-out infinite alternate;
        }

        /* ANIMACIONES */
        @keyframes float-mq {
            0%, 100% { transform: translateY(0) rotateX(0deg); }
            50% { transform: translateY(-5px) rotateX(1deg); }
        }

        @keyframes callPulse-mq {

        }
        .toast.active { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.error { background: var(--danger); color: white; }

    <!-- ================================================================ -->
    <!-- 🔥 SCRIPTS DE MARQUINHOS (AUTOCONTENIDO) -->
    <!-- ================================================================ -->
    <script>
        "use strict";

        // ================================================================
        // 🌟 ESTRELLAS
        // ================================================================
        (function initStars() {
            const canvas = document.getElementById('stars-canvas');
            const ctx = canvas.getContext('2d');
            let w, h;

            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }
            resize();

            const stars = Array.from({ length: 200 }, () => ({
                x: Math.random() * w,
                y: Math.random() * h,
                r: Math.random() * 0.8 + 0.2,
                o: Math.random() * 0.8 + 0.2,
                speed: Math.random() * 0.005 + 0.002,
                phase: Math.random() * Math.PI * 2
            }));

            function draw() {
                ctx.clearRect(0, 0, w, h);
                stars.forEach(s => {
                    const opacity = s.o * (0.6 + 0.4 * Math.sin(s.phase));
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, 2 * Math.PI);
                    ctx.fillStyle = `rgba(255,255,255,${opacity})`;
                    ctx.fill();
                    s.y += s.speed;
                    s.phase += 0.01;
                    if (s.y > h) { s.y = 0;
                        s.x = Math.random() * w; }
                });
                requestAnimationFrame(draw);
            }
            draw();

            window.addEventListener('resize', () => {
                resize();
                stars.forEach(s => { s.x = Math.random() * w;
                    s.y = Math.random() * h; });
            });
        })();

        // ================================================================
        // 🎯 MARQUINHOS - ASISTENTE
        // ================================================================

        (function marquinhosAssistant() {
            // DOM elements
            const container = document.getElementById('marquinhos-float');
            const widget = document.getElementById('marquinhosWidget');
            const bubble = document.getElementById('speech-bubble');
            const mouth = document.getElementById('disneyMouth');
            const statusVoice = document.getElementById('statusVoice');
            const chatInput = document.getElementById('chatInput');

            // Estado
            let isSpeaking = false;
            let synth = window.speechSynthesis;
            let userName = null;
            let recognition = null;
            let isListening = false;

            // ===== BURBUJA =====
            function showBubble(text, type = '') {
                if (!bubble) return;
                bubble.textContent = text;
                bubble.className = 'visible';
                if (type) bubble.classList.add(type);
                clearTimeout(bubble._timeout);
                bubble._timeout = setTimeout(() => {
                    bubble.classList.remove('visible', 'listening', 'thinking');
                }, 3500);
            }

            function hideBubble() {
                if (!bubble) return;
                bubble.classList.remove('visible', 'listening', 'thinking');
            }

            // ===== BOCA =====
            function setMouthTalking(talking) {
                if (!mouth) return;
                if (talking) {
                    mouth.className = 'mouth talking';
                } else {
                    mouth.className = 'mouth shape-neutral';
                }
            }

            // ===== HABLAR =====
            function speak(text, callback) {
                if (!text) return;
                if (isSpeaking) synth.cancel();

                showBubble(text, 'thinking');
                setMouthTalking(true);
                if (statusVoice) statusVoice.textContent = `🗣️ Marquinhos: ${text}`;

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'es-MX';
                utterance.pitch = 1.08;
                utterance.rate = 0.95;
                utterance.volume = 1;

                utterance.onstart = () => {
                    isSpeaking = true;
                    widget.classList.add('talking');
                };

                utterance.onend = () => {
                    isSpeaking = false;
                    widget.classList.remove('talking');
                    setMouthTalking(false);
                    hideBubble();
                    if (statusVoice) statusVoice.textContent = '💬 Esperando tu mensaje...';
                    if (callback) callback();
                };

                utterance.onerror = () => {
                    isSpeaking = false;
                    widget.classList.remove('talking');
                    setMouthTalking(false);
                    hideBubble();
                    if (statusVoice) statusVoice.textContent = '💬 Esperando tu mensaje...';
                    if (callback) callback();
                };

                synth.cancel();
                synth.speak(utterance);
            }

            // ===== REACCIONES =====
            function react(type, message) {
                const emotions = {
                    happy: '😊 ¡Qué bien!',
                    thinking: '🤔 Pensando...',
                    waving: '👋 ¡Hola!',
                    caring: '💙 Estoy aquí para ti',
                    sad: '😢 No te preocupes',
                    excited: '🎉 ¡Qué emocionante!'
                };

                const msg = message || emotions[type] || '¿Cómo puedo ayudarte?';
                if (type === 'waving') {
                    widget.classList.add('waving');
                    setTimeout(() => widget.classList.remove('waving'), 1500);
                }
                speak(msg);
            }

            // ===== COMANDOS =====
            function processCommand(text) {
                const lower = text.toLowerCase();

                // Saludar
                if (lower.includes('hola') || lower.includes('buenas') || lower.includes('hey')) {
                    const namePart = userName ? ` ${userName}` : '';
                    speak(`¡Hola${namePart}! ¿Cómo estás hoy?`);
                    return;
                }

                // Nombre
                if (lower.includes('me llamo') || lower.includes('mi nombre es') || lower.includes('soy ')) {
                    const match = text.match(/(?:me llamo|mi nombre es|soy)\s+([a-zA-ZáéíóúüñÁÉÍÓÚÜÑ]+)/i);
                    if (match && match[1]) {
                        userName = match[1].charAt(0).toUpperCase() + match[1].slice(1).toLowerCase();
                        speak(`¡Mucho gusto ${userName}! Ya te voy a recordar.`);
                        try { localStorage.setItem('marquinhos_user_name', userName); } catch (e) {}
                    }
                    return;
                }

                // Gracias
                if (lower.includes('gracias') || lower.includes('gracias')) {
                    speak('¡De nada! Es un placer ayudarte.');
                    return;
                }

                // Adiós
                if (lower.includes('adiós') || lower.includes('adios') || lower.includes('hasta luego') || lower.includes('chao')) {
                    speak('¡Hasta luego! Fue un placer hablar contigo.');
                    if (isListening) {
                        setTimeout(() => {
                            if (recognition) {
                                try { recognition.stop(); } catch (e) {}
                            }
                            isListening = false;
                            if (statusVoice) statusVoice.textContent = '💬 En espera';
                        }, 2000);
                    }
                    return;
                }

                // Cómo estás
                if (lower.includes('cómo estás') || lower.includes('como estas') || lower.includes('qué tal')) {
                    speak('¡Estoy muy bien! Gracias por preguntar. ¿Y tú?');
                    return;
                }

                // Quién eres
                if (lower.includes('quién eres') || lower.includes('quien eres') || lower.includes('qué haces')) {
                    speak('Soy Marquinhos, tu asistente personal. Estoy aquí para ayudarte, escucharte y ser tu compañero.');
                    return;
                }

                // Ayuda
                if (lower.includes('ayuda') || lower.includes('qué puedes hacer')) {
                    speak('Puedo ayudarte con música, luces, responder preguntas y ser tu compañero. Solo dímelo.');
                    return;
                }

                // Hora
                if (lower.includes('hora') || lower.includes('qué hora')) {
                    const now = new Date();
                    const hora = now.getHours();
                    const minutos = now.getMinutes().toString().padStart(2, '0');
                    speak(`Son las ${hora}:${minutos}.`);
                    return;
                }

                // Respuesta por defecto
                speak('No entendí bien, ¿puedes repetirlo?');
            }

            // ===== RECONOCIMIENTO DE VOZ =====
            function initSpeechRecognition() {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) {
                    if (statusVoice) statusVoice.textContent = '⚠️ Tu navegador no soporta voz';
                    return;
                }

                recognition = new SpeechRecognition();
                recognition.lang = 'es-MX';
                recognition.continuous = true;
                recognition.interimResults = true;

                const activationWords = ['marquinhos', 'hola marquinhos', 'hey marquinhos', 'marquinhos'];

                recognition.onresult = (event) => {
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        const transcript = event.results[i][0].transcript.trim();
                        if (event.results[i].isFinal) {
                            console.log('🎤 Dijiste:', transcript);
                            if (statusVoice) statusVoice.textContent = `🎤 Tú: ${transcript}`;

                            const lower = transcript.toLowerCase();
                            const isActivation = activationWords.some(word => lower.includes(word));

                            if (isActivation) {
                                speak('¡Dime! Estoy aquí.');
                                continue;
                            }

                            if (isListening) {
                                processCommand(transcript);
                            }
                        }
                    }
                };

                recognition.onerror = (event) => {
                    console.warn('⚠️ Error de reconocimiento:', event.error);
                    if (event.error === 'not-allowed') {
                        if (statusVoice) statusVoice.textContent = '🔇 Necesito permiso del micrófono';
                        isListening = false;
                        return;
                    }
                    if (isListening) {
                        setTimeout(() => {
                            try { recognition.start(); } catch (e) {}
                        }, 1000);
                    }
                };

                recognition.onend = () => {
                    if (isListening) {
                        setTimeout(() => {
                            try { recognition.start(); } catch (e) {}
                        }, 500);
                    }
                };

                try {
                    recognition.start();
                    isListening = true;
                    if (statusVoice) statusVoice.textContent = '🎤 Escuchando... di "Marquinhos"';
                    console.log('🎤 Marquinhos escuchando...');
                } catch (e) {
                    console.warn('⚠️ No se pudo iniciar:', e);
                }
            }

            // ===== TOGGLE MICRÓFONO =====
            function toggleMic() {
                if (isListening) {
                    isListening = false;
                    if (recognition) {
                        try { recognition.stop(); } catch (e) {}
                    }
                    if (statusVoice) statusVoice.textContent = '🔇 Micrófono apagado';
                    document.getElementById('btnEscuchar').innerHTML = '<i class="fas fa-microphone"></i> Hablar';
                    document.getElementById('btnEscuchar').classList.remove('btn-danger');
                    document.getElementById('btnEscuchar').classList.add('btn-primary');
                } else {
                    if (!recognition) {
                        initSpeechRecognition();
                        return;
                    }
                    isListening = true;
                    try {
                        recognition.start();
                        if (statusVoice) statusVoice.textContent = '🎤 Escuchando... di "Marquinhos"';
                        document.getElementById('btnEscuchar').innerHTML = '<i class="fas fa-stop"></i> Detener';
                        document.getElementById('btnEscuchar').classList.remove('btn-primary');
                        document.getElementById('btnEscuchar').classList.add('btn-danger');
                    } catch (e) {
                        if (statusVoice) statusVoice.textContent = '⚠️ Error al activar micrófono';
                    }
                }
            }

            // ===== ENVIAR MENSAJE =====
            function enviarMensaje() {
                const input = document.getElementById('chatInput');
                const texto = input.value.trim();
                if (!texto) return;

                if (statusVoice) statusVoice.textContent = `💬 Tú: ${texto}`;
                processCommand(texto);
                input.value = '';
            }

            // ===== RESETEAR POSICIÓN =====
            function resetearPosicion() {
                container.style.position = 'relative';
                container.style.left = 'auto';
                container.style.top = 'auto';
                container.style.right = 'auto';
                container.style.bottom = 'auto';
                container.style.transform = 'none';
                container.style.margin = '0 auto';
                showBubble('🏠 Posición restaurada');
                setTimeout(hideBubble, 1500);
            }

            // ===== ARRASTRE =====
            let isDragging = false;
            let startX = 0,
                startY = 0;
            let origX = 0,
                origY = 0;

            container.addEventListener('pointerdown', (e) => {
                isDragging = true;
                const rect = container.getBoundingClientRect();
                startX = e.clientX;
                startY = e.clientY;
                origX = rect.left;
                origY = rect.top;
                container.setPointerCapture(e.pointerId);
                container.style.cursor = 'grabbing';
            });

            container.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                container.style.position = 'fixed';
                container.style.left = (origX + dx) + 'px';
                container.style.top = (origY + dy) + 'px';
                container.style.right = 'auto';
                container.style.bottom = 'auto';
                container.style.margin = '0';
                container.style.transform = 'none';
            });

            container.addEventListener('pointerup', () => {
                isDragging = false;
                container.style.cursor = 'grab';
            });

            container.addEventListener('pointercancel', () => {
                isDragging = false;
                container.style.cursor = 'grab';
            });

            // ===== INICIALIZAR =====
            function init() {
                // Cargar nombre guardado
                try {
                    const saved = localStorage.getItem('marquinhos_user_name');
                    if (saved) userName = saved;
                } catch (e) {}

                // Iniciar reconocimiento
                setTimeout(initSpeechRecognition, 1000);

                // Saludo de bienvenida
                setTimeout(() => {
                    const namePart = userName ? ` ${userName}` : '';
                    speak(`¡Hola${namePart}! Soy Marquinhos, tu asistente personal. ¿Cómo puedo ayudarte?`);
                }, 1500);

                // Eventos
                document.getElementById('btnEscuchar').addEventListener('click', toggleMic);
                chatInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') enviarMensaje();
                });

                console.log('🎭 MARQUINHOS - Asistente Personal');
                console.log('🎤 Di "Marquinhos" para activarme');
                console.log('👤 Di "me llamo [nombre]" para recordarlo');
            }

            // ===== EXPONER FUNCIONES =====
            window.Marquinhos = {
                speak,
                react,
                processCommand,
                toggleMic,
                enviarMensaje,
                resetearPosicion,
                isListening: () => isListening,
                isSpeaking: () => isSpeaking,
                getUserName: () => userName,
                setUserName: (name) => {
                    userName = name;
                    try { localStorage.setItem('marquinhos_user_name', name); } catch (e) {}
                }
            };

            // Inicializar cuando el DOM esté listo
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();

        // ================================================================
        // 💬 FUNCIONES GLOBALES
        // ================================================================

        function enviarMensaje() {
            if (window.Marquinhos) window.Marquinhos.enviarMensaje();
        }

        function resetearPosicion() {
            if (window.Marquinhos) window.Marquinhos.resetearPosicion();
        }

        function mostrarToast(mensaje, tipo = '') {
            const toast = document.getElementById('toast');
            toast.textContent = mensaje;
            toast.className = 'toast active';
            if (tipo === 'error') toast.classList.add('error');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => toast.classList.remove('active'), 3000);
        }

        // Exponer globalmente
        window.enviarMensaje = enviarMensaje;
        window.resetearPosicion = resetearPosicion;
        window.mostrarToast = mostrarToast;

        console.log('🚀 Marquinhos cargado exitosamente');
    </script>
</body>
</html>
