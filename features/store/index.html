<script>
const SUPABASE_URL='https://nvyyxgkladjauolvpzfp.supabase.co'; const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im52eXl4Z2tsYWRqYXVvbHZwemZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI2NDA3NjMsImV4cCI6MjA5ODIxNjc2M30.3O6tea8l1UbGIlwR_2iyIS1M-dgoQC5G4G1S9YSiXL0';
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let userId=localStorage.getItem('csariels_wallet')||'usuario_prueba_001';
const tokens=[{id:'PLATA',nombre:'Cubo Plata',emoji:'🥈',code:'CUBO-PLATA-001',price:1},{id:'BRONCE',nombre:'Cubo Bronce',emoji:'🪙',code:'CUBO-BRONCE-005',price:5},{id:'ORO',nombre:'Cubo Oro',emoji:'🥇',code:'CUBO-ORO-010',price:10},{id:'DIAMANTE',nombre:'Diamante Cohete',emoji:'💎',code:'DIAMANTE-COHETE-200',price:200},{id:'LEGENDARIO',nombre:'Cubo Legendario',emoji:'⭐',code:'CUBO-LEGENDARIO-500',price:500}];
function renderizarTokens(){document.getElementById('tokenGrid').innerHTML=tokens.map(t=>`<div style="background:rgba(11,61,46,0.2); border:1px solid var(--gold-dim); border-radius:16px; padding:20px; text-align:center;"><span style="font-size:3rem;">${t.emoji}</span><div style="font-family:Orbitron;color:var(--gold-cosmic);">${t.nombre}</div><div style="font-size:1.2rem;font-weight:700;">${t.price} CMT</div><button onclick="comprarToken('${t.id}')" style="margin-top:10px; padding:8px 20px; background:linear-gradient(135deg, var(--gold-cosmic), #b8923a); border:none; border-radius:30px; font-weight:700; font-family:Orbitron; width:100%;">Comprar</button></div>`).join('');}
async function cargarSaldo(){try{const {data}=await supabaseClient.rpc('obtener_saldo_commit',{p_user_id:userId}); if(data&&data.length>0) document.getElementById('userBalance').textContent=data[0].balance_commit+' CMT';}catch(e){}}
window.comprarToken=async function(tokenId){const token=tokens.find(t=>t.id===tokenId); if(!confirm(`${token.nombre} ${token.price} CMT?`)) return; try{const {data,error}=await supabaseClient.rpc('procesar_transaccion_commit',{p_sender_id:userId,p_receiver_id:'sistema_tienda',p_amount:token.price,p_asset_type:'compra_token',p_description:`Compra ${token.nombre}`}); if(error) throw error; alert('✅ Comprado!'); cargarSaldo();}catch(e){alert('Error:'+e.message);}};
renderizarTokens(); cargarSaldo();
window.closeDialog=function(){document.getElementById('dialogBubble').style.display='none';}
</script>
