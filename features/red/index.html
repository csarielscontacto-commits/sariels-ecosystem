<!doctype html>

<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">  <title>◈ Csariel's | Mi Red</title>  <meta name="description" content="Mi Red de Csariel's: conecta, publica, conversa y descubre personas.">
  <meta name="theme-color" content="#05080f">  <link rel="stylesheet" href="./css/red.css">
  <link rel="stylesheet" href="./css/perfil.css">
  <link rel="stylesheet" href="./css/chat.css">
  <link rel="stylesheet" href="./css/publicaciones.css">  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head><body class="red-page">  <main id="red-app" class="red-app"><header class="red-header">
  <div>
    <span class="red-kicker">CSARIEL'S</span>
    <h1>Mi Red</h1>
    <p>Tu espacio para conectar, compartir y conversar.</p>
  </div>

  <button
    type="button"
    class="red-avatar-button"
    data-red-route="perfil"
    aria-label="Abrir perfil">
    <i class="fa-solid fa-user"></i>
  </button>
</header>

<section class="red-quick-actions" aria-label="Acciones principales">

  <button type="button" data-red-route="publicaciones">
    <i class="fa-solid fa-pen"></i>
    <span>Publicar</span>
  </button>

  <button type="button" data-red-route="chat">
    <i class="fa-solid fa-comments"></i>
    <span>Chat</span>
  </button>

  <button type="button" data-red-route="contactos">
    <i class="fa-solid fa-user-group"></i>
    <span>Contactos</span>
  </button>

  <button type="button" data-red-route="notificaciones">
    <i class="fa-solid fa-bell"></i>
    <span>Alertas</span>
  </button>

</section>

<section class="red-dashboard">

  <article class="red-card red-profile-card">
    <div class="red-card-icon">
      <i class="fa-solid fa-user"></i>
    </div>

    <div>
      <span>Mi perfil</span>
      <strong id="red-profile-name">Usuario Csariel's</strong>
      <small id="red-profile-bio">Completa tu perfil para conectar.</small>
    </div>

    <button type="button" data-red-route="perfil">
      Ver perfil
    </button>
  </article>

  <article class="red-card">
    <div class="red-card-icon">
      <i class="fa-solid fa-users"></i>
    </div>

    <div>
      <span>Contactos</span>
      <strong id="red-contact-count">0</strong>
      <small>Personas conectadas</small>
    </div>

    <button type="button" data-red-route="contactos">
      Abrir
    </button>
  </article>

  <article class="red-card">
    <div class="red-card-icon">
      <i class="fa-solid fa-message"></i>
    </div>

    <div>
      <span>Mensajes</span>
      <strong id="red-chat-count">0</strong>
      <small>Conversaciones</small>
    </div>

    <button type="button" data-red-route="chat">
      Abrir
    </button>
  </article>

</section>

<section class="red-section">

  <div class="red-section-heading">
    <div>
      <span class="red-kicker">ACTIVIDAD</span>
      <h2>Tu Red</h2>
    </div>

    <button type="button" data-red-route="descubrir">
      <i class="fa-solid fa-compass"></i>
      Descubrir
    </button>
  </div>

  <div id="red-feed" class="red-feed">
    <article class="red-empty-state">
      <i class="fa-solid fa-layer-group"></i>
      <h3>Tu red está lista</h3>
      <p>Agrega contactos o crea tu primera publicación.</p>

      <div class="red-empty-actions">
        <button type="button" data-red-route="descubrir">
          Encontrar personas
        </button>

        <button type="button" data-red-route="publicaciones">
          Crear publicación
        </button>
      </div>
    </article>
  </div>

</section>

<nav class="red-bottom-nav" aria-label="Navegación de Mi Red">

  <button type="button" class="active" data-red-route="home">
    <i class="fa-solid fa-house"></i>
    <span>Inicio</span>
  </button>

  <button type="button" data-red-route="descubrir">
    <i class="fa-solid fa-magnifying-glass"></i>
    <span>Descubrir</span>
  </button>

  <button type="button" data-red-route="chat">
    <i class="fa-solid fa-comment"></i>
    <span>Chat</span>
  </button>

  <button type="button" data-red-route="notificaciones">
    <i class="fa-solid fa-bell"></i>
    <span>Alertas</span>
  </button>

  <button type="button" data-red-route="perfil">
    <i class="fa-solid fa-user"></i>
    <span>Perfil</span>
  </button>

</nav>

  </main>  <script src="./js/red-main.js"></script>  <script src="./js/perfil.js"></script>  <script src="./js/contactos.js"></script>  <script src="./js/solicitudes.js"></script>  <script src="./js/descubrir.js"></script>  <script src="./js/chat.js"></script>  <script src="./js/publicaciones.js"></script>  <script src="./js/notificaciones.js"></script></body>
</html>
