<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Testimonios | Csariel's</title>
    <meta name="theme-color" content="#0F2D1A" />

    <!-- ===== RECURSOS ===== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet" />

    <style>
        /* ================================================================
           ESTILOS CSARIEL'S - TESTIMONIOS
           ================================================================ */
        :root {
            --space-deep: #05080f;
            --space-mid: #0a1428;
            --verde-bosque: #0F2D1A;
            --verde-bosque-light: #1a4a2a;
            --gold-cosmic: #D4AF37;
            --gold-dim: rgba(212,175,55,0.15);
            --gold-glow: rgba(212,175,55,0.25);
            --text-primary: #e8f0f8;
            --text-secondary: #8ba3c7;
            --text-muted: #4a6a8a;
            --border: rgba(212,175,55,0.08);
            --border-glow: rgba(212,175,55,0.25);
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --success: #00b894;
            --danger: #ff3366;
            --warning: #D4AF37;
            --quantum: #00e5ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--space-deep);
            color: var(--text-primary);
            font-family: 'Space Grotesk', system-ui, sans-serif;
            min-height: 100vh;
        }

        #stars-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .nebula {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.10;
            pointer-events: none;
            z-index: 0;
            animation: nebula-drift 25s ease-in-out infinite alternate;
        }
        .nebula-1 {
            width: 700px;
            height: 700px;
            background: var(--verde-bosque);
            top: -15%;
            right: -15%;
        }
        .nebula-2 {
            width: 600px;
            height: 600px;
            background: var(--gold-cosmic);
            bottom: -15%;
            left: -15%;
            animation-delay: -8s;
            opacity: 0.05;
        }
        .nebula-3 {
            width: 500px;
            height: 500px;
            background: var(--quantum);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -15s;
            opacity: 0.04;
        }

        @keyframes nebula-drift {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(40px, -30px) scale(1.15);
            }
        }

        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: var(--space-deep);
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(var(--gold-cosmic), var(--verde-bosque));
            border-radius: 3px;
        }

        .app {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 16px 20px 30px;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0 16px;
            border-bottom: 2px solid var(--gold-dim);
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
            backdrop-filter: blur(10px);
            position: relative;
        }
        .header::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-cosmic), var(--verde-bosque), var(--gold-cosmic), transparent);
            opacity: 0.4;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        .logo-icon {
            font-size: 2rem;
            filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.2));
            animation: pulse-glow 3s ease-in-out infinite;
        }
        .logo-icon .hex {
            display: inline-block;
            background: var(--verde-bosque);
            color: var(--gold-cosmic);
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 900;
            border: 2px solid var(--gold-cosmic);
            font-family: 'Orbitron', monospace;
        }
        @keyframes pulse-glow {
            0%,
            100% {
                filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.2));
            }
            50% {
                filter: drop-shadow(0 0 40px rgba(212, 175, 55, 0.4));
            }
        }

        .logo-text {
            font-family: 'Orbitron', monospace;
            font-size: 1.3rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--gold-cosmic), var(--verde-bosque-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo-badge {
            font-family: 'Orbitron', monospace;
            font-size: 0.45rem;
            background: linear-gradient(135deg, var(--verde-bosque), var(--gold-cosmic));
            color: white;
            padding: 3px 12px;
            border-radius: 20px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            -webkit-text-fill-color: white;
            border: 1px solid rgba(212, 175, 55, 0.2);
            animation: badge-pulse 2s ease-in-out infinite;
        }
        @keyframes badge-pulse {
            0%,
            100% {
                box-shadow: 0 0 30px rgba(15, 45, 26, 0.3);
            }
            50% {
                box-shadow: 0 0 60px rgba(212, 175, 55, 0.2);
            }
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 16px;
            border: 1px solid var(--border);
            border-radius: 30px;
            background: rgba(212, 175, 55, 0.03);
            color: var(--text-primary);
            font-family: 'Orbitron', monospace;
            font-size: 0.6rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
        }
        .btn:hover {
            transform: scale(1.02);
            border-color: var(--border-glow);
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--verde-bosque), var(--verde-bosque-light));
            border-color: var(--gold-cosmic);
            color: var(--gold-cosmic);
            -webkit-text-fill-color: var(--gold-cosmic);
        }
        .btn-primary:hover:not(:disabled) {
            background: linear-gradient(135deg, var(--verde-bosque-light), var(--verde-bosque));
            box-shadow: 0 0 40px rgba(15, 45, 26, 0.5);
        }
        .btn-gold {
            background: linear-gradient(135deg, var(--gold-cosmic), #b8923a);
            border-color: transparent;
            color: #0a0c10;
            -webkit-text-fill-color: #0a0c10;
        }
        .btn-gold:hover:not(:disabled) {
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.3);
        }
        .btn-outline {
            border-color: var(--border);
            background: transparent;
        }
        .btn-outline:hover:not(:disabled) {
            background: rgba(212, 175, 55, 0.05);
            border-color: var(--gold-cosmic);
        }
        .btn-sm {
            padding: 4px 12px;
            font-size: 0.55rem;
        }

        .language-selector {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            background: rgba(212, 175, 55, 0.03);
            border-radius: 16px;
            border: 1px solid rgba(212, 175, 55, 0.08);
        }
        .language-selector .lang-icon {
            font-size: 0.7rem;
            margin-right: 2px;
        }
        .lang-btn {
            padding: 2px 8px;
            border-radius: 10px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-muted);
            font-family: 'Orbitron', monospace;
            font-size: 0.45rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .lang-btn:hover {
            color: var(--text-secondary);
            background: rgba(212, 175, 55, 0.05);
        }
        .lang-btn.active {
            border-color: var(--gold-cosmic);
            background: rgba(212, 175, 55, 0.1);
            color: var(--gold-cosmic);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(212, 175, 55, 0.06);
            border: 1px solid rgba(212, 175, 55, 0.15);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.6rem;
            color: var(--gold-cosmic);
            font-family: 'Orbitron', monospace;
            backdrop-filter: blur(10px);
        }
        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            animation: quantum-pulse 1.5s ease-in-out infinite;
        }
        .status-dot.online {
            background: var(--success);
            box-shadow: 0 0 20px rgba(0, 184, 148, 0.5);
        }
        @keyframes quantum-pulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(0.7);
            }
        }

        /* ===== TESTIMONIOS ===== */
        .testimonios-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }
        .testimonios-header h2 {
            font-family: 'Orbitron', monospace;
            font-size: 1rem;
            color: var(--text-secondary);
        }
        .testimonios-header h2 i {
            color: var(--gold-cosmic);
        }

        .testimonios-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }
        .stat-card {
            background: rgba(15, 45, 26, 0.06);
            border: 1px solid var(--gold-dim);
            border-radius: var(--radius);
            padding: 12px 16px;
            text-align: center;
        }
        .stat-card .numero {
            font-family: 'Orbitron', monospace;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--gold-cosmic);
        }
        .stat-card .label {
            font-size: 0.5rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .testimonios-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 12px;
        }

        .testimonio-card {
            background: rgba(15, 45, 26, 0.06);
            border: 1px solid var(--gold-dim);
            border-radius: var(--radius);
            padding: 16px 18px;
            transition: var(--transition);
        }
        .testimonio-card:hover {
            border-color: var(--border-glow);
            background: rgba(15, 45, 26, 0.1);
            transform: translateY(-2px);
        }
        .testimonio-card .estrellas {
            color: var(--gold-cosmic);
            font-size: 0.7rem;
            margin-bottom: 4px;
            letter-spacing: 2px;
        }
        .testimonio-card .texto {
            font-size: 0.65rem;
            color: var(--text-secondary);
            line-height: 1.6;
            font-style: italic;
            margin-bottom: 8px;
        }
        .testimonio-card .texto::before {
            content: '"';
            color: var(--gold-cosmic);
            font-size: 1rem;
        }
        .testimonio-card .texto::after {
            content: '"';
            color: var(--gold-cosmic);
            font-size: 1rem;
        }
        .testimonio-card .autor {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .testimonio-card .autor .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--verde-bosque), var(--gold-cosmic));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: white;
            font-size: 0.6rem;
            flex-shrink: 0;
        }
        .testimonio-card .autor .info .nombre {
            font-weight: 600;
            font-size: 0.7rem;
            color: var(--text-primary);
        }
        .testimonio-card .autor .info .rol {
            font-size: 0.5rem;
            color: var(--text-muted);
        }

        .testimonio-card .btn {
            margin-top: 8px;
            padding: 3px 14px;
            font-size: 0.45rem;
            border-radius: 20px;
        }

        .btn-agregar {
            margin-top: 16px;
            text-align: center;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            grid-column: 1/-1;
        }
        .empty-state .icon {
            font-size: 2.5rem;
            opacity: 0.3;
            margin-bottom: 6px;
        }
        .empty-state h3 {
            font-family: 'Orbitron', monospace;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        .empty-state p {
            font-size: 0.6rem;
        }

        /* ===== FOOTER ===== */
        .footer {
            margin-top: 24px;
            padding-top: 14px;
            border-top: 1px solid var(--gold-dim);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            position: relative;
        }
        .footer::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-cosmic), transparent);
            opacity: 0.2;
        }
        .footer-text {
            color: var(--text-muted);
            font-size: 0.5rem;
            letter-spacing: 0.5px;
            font-family: 'Orbitron', monospace;
        }
        .footer-text .brand {
            color: var(--gold-cosmic);
        }
        .footer-links {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.5rem;
            transition: var(--transition);
            font-family: 'Orbitron', monospace;
            letter-spacing: 0.5px;
        }
        .footer-links a:hover {
            color: var(--gold-cosmic);
        }
        .footer-hex {
            display: inline-block;
            background: var(--verde-bosque);
            color: var(--gold-cosmic);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.45rem;
            font-weight: 700;
            border: 1px solid var(--gold-cosmic);
            font-family: 'Orbitron', monospace;
        }

        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--verde-bosque);
            color: var(--gold-cosmic);
            padding: 10px 20px;
            border-radius: var(--radius);
            font-weight: 600;
            font-size: 0.7rem;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 5000;
            pointer-events: none;
            font-family: 'Orbitron', monospace;
            border: 1px solid rgba(212, 175, 55, 0.15);
            max-width: 90%;
            text-align: center;
        }
        .toast.active {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.error {
            background: var(--danger);
            color: white;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            .header-actions {
                width: 100%;
                justify-content: flex-start;
                flex-wrap: wrap;
            }
            .testimonios-stats {
                grid-template-columns: repeat(3, 1fr);
            }
            .testimonios-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .btn {
                font-size: 0.45rem;
                padding: 4px 8px;
            }
            .testimonios-stats {
                grid-template-columns: 1fr 1fr;
            }
            .stat-card .numero {
                font-size: 1rem;
            }
            .testimonio-card .texto {
                font-size: 0.55rem;
            }
        }
    </style>
</head>

    <script>
        // ================================================================
        // 🌟 ESTRELLAS
        // ================================================================
        (function initStars() {
            const canvas = document.getElementById('stars-canvas');
            const ctx = canvas.getContext('2d');
            let w, h;

            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }
            resize();

            const stars = Array.from({ length: 200 }, () => ({
                x: Math.random() * w,
                y: Math.random() * h,
                r: Math.random() * 0.8 + 0.2,
                o: Math.random() * 0.8 + 0.2,
                speed: Math.random() * 0.005 + 0.002,
                phase: Math.random() * Math.PI * 2
            }));

            function draw() {
                ctx.clearRect(0, 0, w, h);
                stars.forEach(s => {
                    const opacity = s.o * (0.6 + 0.4 * Math.sin(s.phase));
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, 2 * Math.PI);
                    ctx.fillStyle = `rgba(255,255,255,${opacity})`;
                    ctx.fill();
                    s.y += s.speed;
                    s.phase += 0.01;
                    if (s.y > h) { s.y = 0;
                        s.x = Math.random() * w; }
                });
                requestAnimationFrame(draw);
            }
            draw();

            window.addEventListener('resize', () => {
                resize();
                stars.forEach(s => { s.x = Math.random() * w;
                    s.y = Math.random() * h; });
            });
        })();

                'volver': 'Retour',
                'agregar': 'Ajouter',
                'comunidad': 'Témoignages de la Communauté',
                'dicen': 'Ce que disent nos membres',
                'testimonios_count': 'Témoignages',
                'calificacion': '⭐ Note',
                'usuarios': 'Utilisateurs',
                'comparte': 'Partagez votre expérience',
                'sin_testimonios': '📝 Aucun témoignage',
                'sin_testimonios_desc': 'Soyez le premier à partager votre expérience.',
                'agregado': '✅ Témoignage ajouté'
            }
        };

        let idiomaActual = localStorage.getItem('csariels_idioma') || 'es';

        function aplicarIdioma(idioma) {
            const t = traducciones[idioma] || traducciones.es;
            document.querySelector('.logo-badge').textContent = t.testimonios;
            document.querySelector('.status-badge span:last-child').textContent = t.en_linea;
            document.querySelector('.testimonios-header h2').innerHTML =
                `<i class="fas fa-comment"></i> ${t.comunidad}`;
            document.querySelector('.testimonios-header span').textContent = t.dicen;
            document.querySelector('.header-actions .btn-primary span:last-child').textContent = t.agregar;

            const statsLabels = document.querySelectorAll('.stat-card .label');
            const statsTextos = [t.testimonios_count, t.calificacion, t.usuarios];
            statsLabels.forEach((el, i) => {
                if (i < statsTextos.length) el.textContent = statsTextos[i];
            });

            document.querySelector('.btn-agregar .btn').innerHTML =
                `<i class="fas fa-pen"></i> ${t.comparte}`;
        }

        function cambiarIdioma(idioma) {
            idiomaActual = idioma;
            localStorage.setItem('csariels_idioma', idioma);
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`.lang-btn[onclick="cambiarIdioma('${idioma}')"]`).classList.add('active');
            aplicarIdioma(idioma);
            renderTestimonios();
            mostrarToast(`🌐 ${idioma.toUpperCase()}`);
        }

        // ================================================================
        // 📋 DATOS DE TESTIMONIOS
        // ================================================================
        let testimonios = [{
            id: 1,
            nombre: 'María García',
            avatar: 'M',
            rol: 'Creadora de Contenido',
            texto: 'Csariel\'s ha transformado mi forma de conectar con mi audiencia. Las herramientas de eSIM y la comunidad son increíbles.',
            estrellas: 5,
            fecha: '15/08/2026'
        }, {
            id: 2,
            nombre: 'Carlos Ruiz',
            avatar: 'C',
            rol: 'Desarrollador',
            texto: 'La API de Csariel\'s es súper intuitiva. Pude integrar mi aplicación en menos de una semana.',
            estrellas: 5,
            fecha: '12/08/2026'
        }, {
            id: 3,
            nombre: 'Laura Sánchez',
            avatar: 'L',
            rol: 'Viajera',
            texto: 'La eSIM de Csariel\'s me ha salvado en todos mis viajes. Datos ilimitados en cualquier país, sin complicaciones.',
            estrellas: 4,
            fecha: '10/08/2026'
        }, {
            id: 4,
            nombre: 'Javier Morales',
            avatar: 'J',
            rol: 'Emprendedor',
            texto: 'La comunidad es el mejor activo de Csariel\'s. He encontrado colaboradores increíbles para mis proyectos.',
            estrellas: 5,
            fecha: '08/08/2026'
        }, {
            id: 5,
            nombre: 'Ana Martínez',
            avatar: 'A',
            rol: 'Diseñadora',
            texto: 'Los temas personalizados y la flexibilidad de diseño me permitieron crear un perfil que refleja mi marca.',
            estrellas: 5,
            fecha: '05/08/2026'
        }, {
            id: 6,
            nombre: 'Roberto Fernández',
            avatar: 'R',
            rol: 'Profesor',
            texto: 'Uso Csariel\'s para mis clases. Los grupos y el chat en tiempo real mejoraron la comunicación con mis estudiantes.',
            estrellas: 4,
            fecha: '01/08/2026'
        }];

        // ================================================================
        // 🖥️ RENDERIZAR TESTIMONIOS
        // ================================================================
        function renderTestimonios() {
            const grid = document.getElementById('testimoniosGrid');
            const t = traducciones[idiomaActual] || traducciones.es;

            if (testimonios.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📝</div>
                        <h3>${t.sin_testimonios}</h3>
                        <p>${t.sin_testimonios_desc}</p>
                    </div>
                `;
                return;
            }

            // Actualizar estadísticas
            document.getElementById('statTotal').textContent = testimonios.length;
            const promedio = testimonios.reduce((sum, t) => sum + t.estrellas, 0) / testimonios.length;
            document.getElementById('statPromedio').textContent = promedio.toFixed(1);
            const usuariosUnicos = new Set(testimonios.map(t => t.nombre)).size;
            document.getElementById('statUsuarios').textContent = usuariosUnicos;

            grid.innerHTML = testimonios.map(t => `
                <div class="testimonio-card">
                    <div class="estrellas">${'⭐'.repeat(t.estrellas)}${'☆'.repeat(5 - t.estrellas)}</div>
                    <div class="texto">${t.texto}</div>
                    <div class="autor">
                        <div class="avatar">${t.avatar}</div>
                        <div class="info">
                            <div class="nombre">${t.nombre}</div>
                            <div class="rol">${t.rol} · ${t.fecha}</div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // ================================================================
        // 🎯 ACCIONES
        // ================================================================
        function agregarTestimonio() {
            const t = traducciones[idiomaActual] || traducciones.es;
            const nombre = prompt('👤 Tu nombre:');
            if (!nombre) return;
            const texto = prompt('📝 Tu testimonio:');
            if (!texto) return;
            const estrellas = prompt('⭐ Calificación (1-5):', '5');
            if (!estrellas) return;
            const numEstrellas = parseInt(estrellas);
            if (isNaN(numEstrellas) || numEstrellas < 1 || numEstrellas > 5) {
                mostrarToast('⚠️ Calificación inválida (1-5)', 'error');
                return;
            }

            const nuevo = {
                id: testimonios.length + 1,
                nombre: nombre,
                avatar: nombre.charAt(0).toUpperCase(),
                rol: 'Miembro de Csariel\'s',
                texto: texto,
                estrellas: numEstrellas,
                fecha: new Date().toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' })
            };

            testimonios.unshift(nuevo);
            renderTestimonios();
            mostrarToast(t.agregado);
        }

        // ================================================================
        // 🔔 TOAST
        // ================================================================
        let toastTimeout;

        function mostrarToast(mensaje, tipo = '') {
            const toast = document.getElementById('toast');
            toast.textContent = mensaje;
            toast.className = 'toast active';
            if (tipo === 'error') toast.classList.add('error');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.remove('active'), 3000);
        }

        // ================================================================
        // 🚀 INICIALIZAR
        // ================================================================
        document.addEventListener('DOMContentLoaded', () => {
            aplicarIdioma(idiomaActual);
            renderTestimonios();
            console.log('💬 Csariel\'s - Testimonios cargado');
        });

        // Exponer funciones globales
        window.cambiarIdioma = cambiarIdioma;
        window.agregarTestimonio = agregarTestimonio;
        window.mostrarToast = mostrarToast;
    </script>
</body>
</html>
