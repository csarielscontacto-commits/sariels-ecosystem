<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grupos | Csariel's</title>
    <meta name="theme-color" content="#0F2D1A" />

    <!-- ===== RECURSOS ===== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet" />

    <style>
        /* ================================================================
           ESTILOS CSARIEL'S - GRUPOS
           ================================================================ */
        :root {
            --space-deep: #05080f;
            --space-mid: #0a1428;
            --verde-bosque: #0F2D1A;
            --verde-bosque-light: #1a4a2a;
            --gold-cosmic: #D4AF37;
            --gold-dim: rgba(212,175,55,0.15);
            --gold-glow: rgba(212,175,55,0.25);
            --text-primary: #e8f0f8;
            --text-secondary: #8ba3c7;
            --text-muted: #4a6a8a;
            --border: rgba(212,175,55,0.08);
            --border-glow: rgba(212,175,55,0.25);
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --success: #00b894;
            --danger: #ff3366;
            --warning: #D4AF37;
            --quantum: #00e5ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--space-deep);
            color: var(--text-primary);
            font-family: 'Space Grotesk', system-ui, sans-serif;
            min-height: 100vh;
        }

        #stars-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .nebula {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.10;
            pointer-events: none;
            z-index: 0;
            animation: nebula-drift 25s ease-in-out infinite alternate;
        }
        .nebula-1 {
            width: 700px;
            height: 700px;
            background: var(--verde-bosque);
            top: -15%;
            right: -15%;
        }
        .nebula-2 {
            width: 600px;
            height: 600px;
            background: var(--gold-cosmic);
            bottom: -15%;
            left: -15%;
            animation-delay: -8s;
            opacity: 0.05;
        }
        .nebula-3 {
            width: 500px;
            height: 500px;
            background: var(--quantum);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -15s;
            opacity: 0.04;
        }

        @keyframes nebula-drift {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(40px, -30px) scale(1.15);
            }
        }

        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: var(--space-deep);
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(var(--gold-cosmic), var(--verde-bosque));
            border-radius: 3px;
        }

        .app {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px 20px 30px;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0 16px;
            border-bottom: 2px solid var(--gold-dim);
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
            backdrop-filter: blur(10px);
            position: relative;
        }
        .header::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-cosmic), var(--verde-bosque), var(--gold-cosmic), transparent);
            opacity: 0.4;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        .logo-icon {
            font-size: 2rem;
            filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.2));
            animation: pulse-glow 3s ease-in-out infinite;
        }
        .logo-icon .hex {
            display: inline-block;
            background: var(--verde-bosque);
            color: var(--gold-cosmic);
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 900;
            border: 2px solid var(--gold-cosmic);
            font-family: 'Orbitron', monospace;
        }
        @keyframes pulse-glow {
            0%,
            100% {
                filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.2));
            }
            50% {
                filter: drop-shadow(0 0 40px rgba(212, 175, 55, 0.4));
            }
        }

        .logo-text {
            font-family: 'Orbitron', monospace;
            font-size: 1.3rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--gold-cosmic), var(--verde-bosque-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo-badge {
            font-family: 'Orbitron', monospace;
            font-size: 0.45rem;
            background: linear-gradient(135deg, var(--verde-bosque), var(--gold-cosmic));
            color: white;
            padding: 3px 12px;
            border-radius: 20px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            -webkit-text-fill-color: white;
            border: 1px solid rgba(212, 175, 55, 0.2);
            animation: badge-pulse 2s ease-in-out infinite;
        }
        @keyframes badge-pulse {
            0%,
            100% {
                box-shadow: 0 0 30px rgba(15, 45, 26, 0.3);
            }
            50% {
                box-shadow: 0 0 60px rgba(212, 175, 55, 0.2);
            }
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 16px;
            border: 1px solid var(--border);
            border-radius: 30px;
            background: rgba(212, 175, 55, 0.03);
            color: var(--text-primary);
            font-family: 'Orbitron', monospace;
            font-size: 0.6rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
        }
        .btn:hover {
            transform: scale(1.02);
            border-color: var(--border-glow);
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--verde-bosque), var(--verde-bosque-light));
            border-color: var(--gold-cosmic);
            color: var(--gold-cosmic);
            -webkit-text-fill-color: var(--gold-cosmic);
        }
        .btn-primary:hover:not(:disabled) {
            background: linear-gradient(135deg, var(--verde-bosque-light), var(--verde-bosque));
            box-shadow: 0 0 40px rgba(15, 45, 26, 0.5);
        }
        .btn-gold {
            background: linear-gradient(135deg, var(--gold-cosmic), #b8923a);
            border-color: transparent;
            color: #0a0c10;
            -webkit-text-fill-color: #0a0c10;
        }
        .btn-gold:hover:not(:disabled) {
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.3);
        }
        .btn-outline {
            border-color: var(--border);
            background: transparent;
        }
        .btn-outline:hover:not(:disabled) {
            background: rgba(212, 175, 55, 0.05);
            border-color: var(--gold-cosmic);
        }
        .btn-sm {
            padding: 4px 12px;
            font-size: 0.55rem;
        }
        .btn-success {
            background: rgba(0, 184, 148, 0.15);
            border-color: rgba(0, 184, 148, 0.3);
            color: var(--success);
        }
        .btn-success:hover:not(:disabled) {
            background: rgba(0, 184, 148, 0.25);
        }
        .btn-danger {
            background: rgba(255, 51, 102, 0.15);
            border-color: rgba(255, 51, 102, 0.3);
            color: var(--danger);
        }
        .btn-danger:hover:not(:disabled) {
            background: rgba(255, 51, 102, 0.25);
        }

        .language-selector {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            background: rgba(212, 175, 55, 0.03);
            border-radius: 16px;
            border: 1px solid rgba(212, 175, 55, 0.08);
        }
        .language-selector .lang-icon {
            font-size: 0.7rem;
            margin-right: 2px;
        }
        .lang-btn {
            padding: 2px 8px;
            border-radius: 10px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-muted);
            font-family: 'Orbitron', monospace;
            font-size: 0.45rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .lang-btn:hover {
            color: var(--text-secondary);
            background: rgba(212, 175, 55, 0.05);
        }
        .lang-btn.active {
            border-color: var(--gold-cosmic);
            background: rgba(212, 175, 55, 0.1);
            color: var(--gold-cosmic);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(212, 175, 55, 0.06);
            border: 1px solid rgba(212, 175, 55, 0.15);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.6rem;
            color: var(--gold-cosmic);
            font-family: 'Orbitron', monospace;
            backdrop-filter: blur(10px);
        }
        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            animation: quantum-pulse 1.5s ease-in-out infinite;
        }
        .status-dot.online {
            background: var(--success);
            box-shadow: 0 0 20px rgba(0, 184, 148, 0.5);
        }
        @keyframes quantum-pulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(0.7);
            }
        }

        /* ===== GRUPOS ===== */
        .grupos-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }
        .grupos-header h2 {
            font-family: 'Orbitron', monospace;
            font-size: 1rem;
            color: var(--text-secondary);
        }
        .grupos-header h2 i {
            color: var(--gold-cosmic);
        }
        .grupos-header .badge-total {
            background: var(--gold-cosmic);
            color: var(--space-deep);
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.6rem;
            font-weight: 700;
            font-family: 'Orbitron', monospace;
        }

        .busqueda-bar {
            display: flex;
            gap: 8px;
            flex: 1;
            max-width: 450px;
        }
        .busqueda-bar input {
            flex: 1;
            padding: 8px 14px;
            border-radius: 30px;
            border: 1px solid var(--gold-dim);
            background: rgba(15, 45, 26, 0.15);
            color: var(--text-primary);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.7rem;
            outline: none;
            transition: var(--transition);
        }
        .busqueda-bar input:focus {
            border-color: var(--gold-cosmic);
        }
        .busqueda-bar input::placeholder {
            color: var(--text-muted);
        }

        .filtros-bar {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .filtro-btn {
            padding: 4px 14px;
            border: 1px solid var(--gold-dim);
            border-radius: 20px;
            background: transparent;
            color: var(--text-muted);
            font-family: 'Orbitron', monospace;
            font-size: 0.45rem;
            cursor: pointer;
            transition: var(--transition);
        }
        .filtro-btn:hover {
            border-color: var(--gold-cosmic);
            color: var(--text-secondary);
        }
        .filtro-btn.active {
            background: rgba(212, 175, 55, 0.1);
            border-color: var(--gold-cosmic);
            color: var(--gold-cosmic);
        }

        .grupos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 12px;
        }

        .grupo-card {
            background: rgba(15, 45, 26, 0.15);
            border: 1px solid var(--gold-dim);
            border-radius: var(--radius);
            padding: 16px;
            transition: var(--transition);
            cursor: pointer;
        }
        .grupo-card:hover {
            border-color: var(--border-glow);
            background: rgba(15, 45, 26, 0.25);
            transform: translateY(-2px);
        }

        .grupo-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }
        .grupo-icono {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--verde-bosque), var(--gold-cosmic));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: white;
            flex-shrink: 0;
        }
        .grupo-info {
            flex: 1;
            min-width: 0;
        }
        .grupo-nombre {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-primary);
        }
        .grupo-descripcion {
            font-size: 0.6rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .grupo-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 0.5rem;
            color: var(--text-muted);
            padding: 8px 0;
            border-top: 1px solid var(--gold-dim);
            border-bottom: 1px solid var(--gold-dim);
            margin: 6px 0 10px;
        }
        .grupo-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .grupo-meta i {
            color: var(--gold-cosmic);
            font-size: 0.5rem;
        }

        .grupo-acciones {
            display: flex;
            gap: 6px;
            justify-content: flex-end;
        }
        .grupo-acciones .btn {
            padding: 4px 14px;
            font-size: 0.5rem;
            border-radius: 20px;
        }

        .grupo-miembros {
            display: flex;
            gap: 4px;
            margin-top: 6px;
            flex-wrap: wrap;
        }
        .grupo-miembros .miembro-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--verde-bosque), var(--gold-cosmic));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: white;
            font-size: 0.5rem;
            border: 2px solid var(--space-deep);
        }
        .grupo-miembros .miembro-mas {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(212, 175, 55, 0.1);
            border: 2px solid var(--gold-dim);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.5rem;
            color: var(--text-muted);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            grid-column: 1/-1;
        }
        .empty-state .icon {
            font-size: 3rem;
            opacity: 0.3;
            margin-bottom: 8px;
        }
        .empty-state h3 {
            font-family: 'Orbitron', monospace;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .empty-state p {
            font-size: 0.65rem;
        }

        /* ===== FOOTER ===== */
        .footer {
            margin-top: 24px;
            padding-top: 14px;
            border-top: 1px solid var(--gold-dim);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            position: relative;
        }
        .footer::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-cosmic), transparent);
            opacity: 0.2;
        }
        .footer-text {
            color: var(--text-muted);
            font-size: 0.5rem;
            letter-spacing: 0.5px;
            font-family: 'Orbitron', monospace;
        }
        .footer-text .brand {
            color: var(--gold-cosmic);
        }
        .footer-links {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.5rem;
            transition: var(--transition);
            font-family: 'Orbitron', monospace;
            letter-spacing: 0.5px;
        }
        .footer-links a:hover {
            color: var(--gold-cosmic);
        }
        .footer-hex {
            display: inline-block;
            background: var(--verde-bosque);
            color: var(--gold-cosmic);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.45rem;
            font-weight: 700;
            border: 1px solid var(--gold-cosmic);
            font-family: 'Orbitron', monospace;
        }

        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--verde-bosque);
            color: var(--gold-cosmic);
            padding: 10px 20px;
            border-radius: var(--radius);
            font-weight: 600;
            font-size: 0.7rem;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 5000;
            pointer-events: none;
            font-family: 'Orbitron', monospace;
            border: 1px solid rgba(212, 175, 55, 0.15);
            max-width: 90%;
            text-align: center;
        }
        .toast.active {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.error {
            background: var(--danger);
            color: white;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            .header-actions {
                width: 100%;
                justify-content: flex-start;
                flex-wrap: wrap;
            }
            .grupos-header {
                flex-direction: column;
                align-items: stretch;
            }
            .busqueda-bar {
                max-width: 100%;
            }
            .grupos-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .btn {
                font-size: 0.45rem;
                padding: 4px 8px;
            }
            .grupo-icono {
                width: 36px;
                height: 36px;
                font-size: 0.9rem;
            }
            .grupo-nombre {
                font-size: 0.7rem;
            }
            .filtro-btn {
                font-size: 0.4rem;
                padding: 3px 10px;
            }
            .grupo-miembros .miembro-avatar {
                width: 24px;
                height: 24px;
                font-size: 0.4rem;
            }
        }
    </style>
</head>
<body>
    <!-- ===== FONDO ESTELAR ===== -->
    <canvas id="stars-canvas"></canvas>
    <div class="nebula nebula-1"></div>
    <div class="nebula nebula-2"></div>
    <div class="nebula nebula-3"></div>

    <div class="app">

        <!-- ===== HEADER ===== -->
        <header class="header">
            <a href="../index.html" class="logo">
                <span class="logo-icon"><span class="hex">◈</span></span>
                <span class="logo-text">Csariel's</span>
                <span class="logo-badge">Grupos</span>
            </a>
            <div class="header-actions">
                <div class="language-selector">
                    <span class="lang-icon">🌐</span>
                    <button class="lang-btn active" onclick="cambiarIdioma('es')">ES</button>
                    <button class="lang-btn" onclick="cambiarIdioma('en')">EN</button>
                    <button class="lang-btn" onclick="cambiarIdioma('fr')">FR</button>
                </div>

                <div class="status-badge">
                    <span class="status-dot online"></span>
                    <span>En línea</span>
                </div>

                <a href="../index.html" class="btn btn-outline btn-sm">
                    <i class="fas fa-arrow-left"></i> Volver
                </a>
                <a href="../contactos/index.html" class="btn btn-outline btn-sm">
                    <i class="fas fa-users"></i> Contactos
                </a>
            </div>
        </header>

        <!-- ===== GRUPOS ===== -->
        <div class="grupos-header">
            <h2><i class="fas fa-layer-group"></i> Mis Grupos <span class="badge-total" id="totalGrupos">4</span></h2>
            <div class="busqueda-bar">
                <input type="text" id="buscarGrupos" placeholder="🔍 Buscar grupos..." oninput="filtrarGrupos()" />
                <button class="btn btn-primary btn-sm" onclick="crearGrupo()">
                    <i class="fas fa-plus"></i> Crear
                </button>
            </div>
        </div>

        <div class="filtros-bar">
            <button class="filtro-btn active" data-filtro="todos" onclick="aplicarFiltro('todos')">🌟 Todos</button>
            <button class="filtro-btn" data-filtro="activos" onclick="aplicarFiltro('activos')">🟢 Activos</button>
            <button class="filtro-btn" data-filtro="privados" onclick="aplicarFiltro('privados')">🔒 Privados</button>
            <button class="filtro-btn" data-filtro="publicos" onclick="aplicarFiltro('publicos')">🌐 Públicos</button>
            <button class="filtro-btn" data-filtro="administro" onclick="aplicarFiltro('administro')">👑 Administro</button>
        </div>

        <div class="grupos-grid" id="gruposGrid">
            <!-- Renderizado con JavaScript -->
        </div>

        <!-- ===== FOOTER ===== -->
        <footer class="footer">
            <span class="footer-text">
                <span class="brand">◈ Csariel's</span> — Grupos · Comunidad · Comparte
            </span>
            <div class="footer-links">
                <a href="../index.html">🏠 Red</a>
                <a href="../contactos/index.html">👥 Contactos</a>
                <a href="../perfil/index.html">👤 Perfil</a>
                <a href="../chat/index.html">💬 Chat</a>
                <span class="footer-hex">◈</span>
            </div>
        </footer>
    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast"></div>

    <!-- ================================================================ -->
    <!-- SCRIPTS -->
    <!-- ================================================================ -->
    <script>
        // ================================================================
        // 🌟 ESTRELLAS
        // ================================================================
        (function initStars() {
            const canvas = document.getElementById('stars-canvas');
            const ctx = canvas.getContext('2d');
            let w, h;

            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }
            resize();

            const stars = Array.from({ length: 200 }, () => ({
                x: Math.random() * w,
                y: Math.random() * h,
                r: Math.random() * 0.8 + 0.2,
                o: Math.random() * 0.8 + 0.2,
                speed: Math.random() * 0.005 + 0.002,
                phase: Math.random() * Math.PI * 2
            }));

            function draw() {
                ctx.clearRect(0, 0, w, h);
                stars.forEach(s => {
                    const opacity = s.o * (0.6 + 0.4 * Math.sin(s.phase));
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, 2 * Math.PI);
                    ctx.fillStyle = `rgba(255,255,255,${opacity})`;
                    ctx.fill();
                    s.y += s.speed;
                    s.phase += 0.01;
                    if (s.y > h) { s.y = 0;
                        s.x = Math.random() * w; }
                });
                requestAnimationFrame(draw);
            }
            draw();

            window.addEventListener('resize', () => {
                resize();
                stars.forEach(s => { s.x = Math.random() * w;
                    s.y = Math.random() * h; });
            });
        })();

        // ================================================================
        // 🌐 IDIOMAS
        // ================================================================
        const traducciones = {
            es: {
                'grupos': 'Grupos',
                'en_linea': 'En línea',
                'volver': 'Volver',
                'contactos': 'Contactos',
                'buscar': '🔍 Buscar grupos...',
                'crear': 'Crear',
                'todos': '🌟 Todos',
                'activos': '🟢 Activos',
                'privados': '🔒 Privados',
                'publicos': '🌐 Públicos',
                'administro': '👑 Administro',
                'sin_grupos': '👥 Sin grupos',
                'sin_grupos_desc': 'Aún no estás en ningún grupo. ¡Crea o únete a uno!',
                'miembros': 'miembros',
                'administrador': 'Administrador',
                'unirse': 'Unirse',
                'salir': 'Salir',
                'admin': 'Admin'
            },
            en: {
                'grupos': 'Groups',
                'en_linea': 'Online',
                'volver': 'Back',
                'contactos': 'Contacts',
                'buscar': '🔍 Search groups...',
                'crear': 'Create',
                'todos': '🌟 All',
                'activos': '🟢 Active',
                'privados': '🔒 Private',
                'publicos': '🌐 Public',
                'administro': '👑 Admin',
                'sin_grupos': '👥 No groups',
                'sin_grupos_desc': 'You are not in any group yet. Create or join one!',
                'miembros': 'members',
                'administrador': 'Administrator',
                'unirse': 'Join',
                'salir': 'Leave',
                'admin': 'Admin'
            },
            fr: {
                'grupos': 'Groupes',
                'en_linea': 'En ligne',
                'volver': 'Retour',
                'contactos': 'Contacts',
                'buscar': '🔍 Rechercher des groupes...',
                'crear': 'Créer',
                'todos': '🌟 Tous',
                'activos': '🟢 Actifs',
                'privados': '🔒 Privés',
                'publicos': '🌐 Publics',
                'administro': '👑 Admin',
                'sin_grupos': '👥 Aucun groupe',
                'sin_grupos_desc': 'Vous n\'êtes dans aucun groupe. Créez ou rejoignez-en un!',
                'miembros': 'membres',
                'administrador': 'Administrateur',
                'unirse': 'Rejoindre',
                'salir': 'Quitter',
                'admin': 'Admin'
            }
        };

        let idiomaActual = localStorage.getItem('csariels_idioma') || 'es';
        let filtroActual = 'todos';

        function aplicarIdioma(idioma) {
            const t = traducciones[idioma] || traducciones.es;
            document.querySelector('.logo-badge').textContent = t.grupos;
            document.querySelector('.status-badge span:last-child').textContent = t.en_linea;
            document.querySelector('.grupos-header h2').innerHTML =
                `<i class="fas fa-layer-group"></i> ${t.grupos} <span class="badge-total" id="totalGrupos">4</span>`;
            document.querySelector('.busqueda-bar input').placeholder = t.buscar;
            document.querySelector('.busqueda-bar .btn span:last-child').textContent = t.crear;

            document.querySelectorAll('.filtro-btn').forEach(b => {
                const key = b.dataset.filtro;
                if (key === 'todos') b.textContent = t.todos;
                else if (key === 'activos') b.textContent = t.activos;
                else if (key === 'privados') b.textContent = t.privados;
                else if (key === 'publicos') b.textContent = t.publicos;
                else if (key === 'administro') b.textContent = t.administro;
            });
        }

        function cambiarIdioma(idioma) {
            idiomaActual = idioma;
            localStorage.setItem('csariels_idioma', idioma);
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`.lang-btn[onclick="cambiarIdioma('${idioma}')"]`).classList.add('active');
            aplicarIdioma(idioma);
            renderGrupos();
            mostrarToast(`🌐 ${idioma.toUpperCase()}`);
        }

        // ================================================================
        // 📋 DATOS DE GRUPOS
        // ================================================================
        let grupos = [{
            id: 1,
            nombre: '🚀 Exploradores Digitales',
            descripcion: 'Comunidad para amantes de la tecnología y la innovación',
            icono: '🚀',
            miembros: 24,
            esPrivado: false,
            esAdmin: true,
            activo: true,
            miembrosList: ['C', 'M', 'J', 'L', 'A']
        }, {
            id: 2,
            nombre: '🎮 Gamers Unite',
            descripcion: 'Para jugadores de todas las plataformas',
            icono: '🎮',
            miembros: 18,
            esPrivado: true,
            esAdmin: false,
            activo: true,
            miembrosList: ['P', 'R', 'S', 'T', 'V']
        }, {
            id: 3,
            nombre: '📚 Club de Lectura',
            descripcion: 'Compartimos y discutimos libros interesantes',
            icono: '📚',
            miembros: 12,
            esPrivado: false,
            esAdmin: false,
            activo: false,
            miembrosList: ['E', 'N', 'O', 'Q']
        }, {
            id: 4,
            nombre: '🌿 EcoVida',
            descripcion: 'Sostenibilidad y medio ambiente',
            icono: '🌿',
            miembros: 8,
            esPrivado: true,
            esAdmin: true,
            activo: true,
            miembrosList: ['C', 'M', 'J']
        }];

        // ================================================================
        // 🖥️ RENDERIZAR GRUPOS
        // ================================================================
        function renderGrupos() {
            const grid = document.getElementById('gruposGrid');
            const t = traducciones[idiomaActual] || traducciones.es;

            let filtrados = [...grupos];

            // Aplicar filtro
            if (filtroActual === 'activos') {
                filtrados = filtrados.filter(g => g.activo);
            } else if (filtroActual === 'privados') {
                filtrados = filtrados.filter(g => g.esPrivado);
            } else if (filtroActual === 'publicos') {
                filtrados = filtrados.filter(g => !g.esPrivado);
            } else if (filtroActual === 'administro') {
                filtrados = filtrados.filter(g => g.esAdmin);
            }

            // Aplicar búsqueda
            const busqueda = document.getElementById('buscarGrupos').value.toLowerCase();
            if (busqueda) {
                filtrados = filtrados.filter(g =>
                    g.nombre.toLowerCase().includes(busqueda) ||
                    g.descripcion.toLowerCase().includes(busqueda)
                );
            }

            // Actualizar contador
            document.getElementById('totalGrupos').textContent = filtrados.length;

            if (filtrados.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">👥</div>
                        <h3>${t.sin_grupos}</h3>
                        <p>${t.sin_grupos_desc}</p>
                        <button class="btn btn-primary btn-sm" style="margin-top:8px;" onclick="crearGrupo()">
                            <i class="fas fa-plus"></i> ${t.crear}
                        </button>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtrados.map(g => {
                const miembrosMostrar = g.miembrosList.slice(0, 4);
                const restantes = g.miembrosList.length - 4;

                return `
                    <div class="grupo-card" onclick="verGrupo(${g.id})">
                        <div class="grupo-header">
                            <div class="grupo-icono">${g.icono}</div>
                            <div class="grupo-info">
                                <div class="grupo-nombre">${g.nombre}</div>
                                <div class="grupo-descripcion">${g.descripcion}</div>
                            </div>
                        </div>

                        <div class="grupo-meta">
                            <span><i class="fas fa-users"></i> ${g.miembros} ${t.miembros}</span>
                            <span><i class="fas ${g.esPrivado ? 'fa-lock' : 'fa-globe'}"></i> ${g.esPrivado ? t.privados : t.publicos}</span>
                            ${g.esAdmin ? `<span><i class="fas fa-crown" style="color:var(--gold-cosmic);"></i> ${t.admin}</span>` : ''}
                            <span><i class="fas ${g.activo ? 'fa-circle' : 'fa-circle'}"></i> ${g.activo ? '🟢 Activo' : '⚪ Inactivo'}</span>
                        </div>

                        <div class="grupo-miembros">
                            ${miembrosMostrar.map(m => `<div class="miembro-avatar">${m}</div>`).join('')}
                            ${restantes > 0 ? `<div class="miembro-mas">+${restantes}</div>` : ''}
                        </div>

                        <div class="grupo-acciones">
                            ${g.esAdmin ? `
                                <button class="btn btn-primary btn-sm" onclick="event.stopPropagation();administrarGrupo(${g.id})">
                                    <i class="fas fa-cog"></i> Administrar
                                </button>
                            ` : `
                                <button class="btn btn-success btn-sm" onclick="event.stopPropagation();unirseGrupo(${g.id})">
                                    <i class="fas fa-user-plus"></i> ${t.unirse}
                                </button>
                            `}
                            <button class="btn btn-outline btn-sm" onclick="event.stopPropagation();abrirChatGrupo(${g.id})">
                                <i class="fas fa-comment"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ================================================================
        // 🔍 FILTROS Y BÚSQUEDA
        // ================================================================
        function filtrarGrupos() {
            renderGrupos();
        }

        function aplicarFiltro(filtro) {
            filtroActual = filtro;
            document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`.filtro-btn[data-filtro="${filtro}"]`).classList.add('active');
            renderGrupos();
        }

        // ================================================================
        // 🎯 ACCIONES
        // ================================================================
        function crearGrupo() {
            const t = traducciones[idiomaActual] || traducciones.es;
            const nombre = prompt('📝 Nombre del grupo:');
            if (!nombre) return;
            const descripcion = prompt('📝 Descripción:');
            if (descripcion === null) return;

            const nuevoGrupo = {
                id: grupos.length + 1,
                nombre: nombre,
                descripcion: descripcion || 'Sin descripción',
                icono: '👥',
                miembros: 1,
                esPrivado: false,
                esAdmin: true,
                activo: true,
                miembrosList: ['C']
            };

            grupos.push(nuevoGrupo);
            renderGrupos();
            mostrarToast(`✅ Grupo "${nombre}" creado`);
        }

        function verGrupo(id) {
            const g = grupos.find(g => g.id === id);
            if (g) {
                mostrarToast(`👥 ${g.nombre} - ${g.miembros} miembros`);
                // window.location.href = `../grupos/ver.html?id=${g.id}`;
            }
        }

        function administrarGrupo(id) {
            const g = grupos.find(g => g.id === id);
            if (g) {
                mostrarToast(`⚙️ Administrando ${g.nombre}`);
            }
        }

        function unirseGrupo(id) {
            const g = grupos.find(g => g.id === id);
            if (g) {
                g.miembros += 1;
                g.miembrosList.push('+');
                renderGrupos();
                mostrarToast(`✅ Te uniste a ${g.nombre}`);
            }
        }

        function abrirChatGrupo(id) {
            const g = grupos.find(g => g.id === id);
            if (g) {
                mostrarToast(`💬 Chat de ${g.nombre}`);
                // window.location.href = `../chat/index.html?grupo=${g.id}`;
            }
        }

        // ================================================================
        // 🔔 TOAST
        // ================================================================
        let toastTimeout;

        function mostrarToast(mensaje, tipo = '') {
            const toast = document.getElementById('toast');
            toast.textContent = mensaje;
            toast.className = 'toast active';
            if (tipo === 'error') toast.classList.add('error');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.remove('active'), 3000);
        }

        // ================================================================
        // 🚀 INICIALIZAR
        // ================================================================
        document.addEventListener('DOMContentLoaded', () => {
            aplicarIdioma(idiomaActual);
            renderGrupos();
            console.log('👥 Csariel\'s - Grupos cargado');
        });

        // Exponer funciones globales
        window.cambiarIdioma = cambiarIdioma;
        window.filtrarGrupos = filtrarGrupos;
        window.aplicarFiltro = aplicarFiltro;
        window.crearGrupo = crearGrupo;
        window.verGrupo = verGrupo;
        window.administrarGrupo = administrarGrupo;
        window.unirseGrupo = unirseGrupo;
        window.abrirChatGrupo = abrirChatGrupo;
        window.mostrarToast = mostrarToast;
    </script>
</body>
</html>
