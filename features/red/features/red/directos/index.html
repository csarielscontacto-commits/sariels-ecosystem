<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Directos | Csariel's</title>
    <meta name="theme-color" content="#0F2D1A" />

    <!-- ===== RECURSOS ===== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet" />

    <style>
        /* ================================================================
           ESTILOS CSARIEL'S - DIRECTOS
           ================================================================ */
        :root {
            --space-deep: #05080f;
            --space-mid: #0a1428;
            --verde-bosque: #0F2D1A;
            --verde-bosque-light: #1a4a2a;
            --gold-cosmic: #D4AF37;
            --gold-dim: rgba(212,175,55,0.15);
            --gold-glow: rgba(212,175,55,0.25);
            --text-primary: #e8f0f8;
            --text-secondary: #8ba3c7;
            --text-muted: #4a6a8a;
            --border: rgba(212,175,55,0.08);
            --border-glow: rgba(212,175,55,0.25);
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --success: #00b894;
            --danger: #ff3366;
            --warning: #D4AF37;
            --quantum: #00e5ff;
            --live-red: #ff0044;
            --live-glow: rgba(255,0,68,0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--space-deep);
            color: var(--text-primary);
            font-family: 'Space Grotesk', system-ui, sans-serif;
            min-height: 100vh;
        }

        #stars-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .nebula {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.10;
            pointer-events: none;
            z-index: 0;
            animation: nebula-drift 25s ease-in-out infinite alternate;
        }
        .nebula-1 {
            width: 700px;
            height: 700px;
            background: var(--verde-bosque);
            top: -15%;
            right: -15%;
        }
        .nebula-2 {
            width: 600px;
            height: 600px;
            background: var(--gold-cosmic);
            bottom: -15%;
            left: -15%;
            animation-delay: -8s;
            opacity: 0.05;
        }
        .nebula-3 {
            width: 500px;
            height: 500px;
            background: var(--live-red);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -15s;
            opacity: 0.04;
        }

        @keyframes nebula-drift {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(40px, -30px) scale(1.15);
            }
        }

        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: var(--space-deep);
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(var(--gold-cosmic), var(--verde-bosque));
            border-radius: 3px;
        }

        .app {
            position: relative;
            z-index: 1;
            max-width: 1000px;
            margin: 0 auto;
            padding: 16px 20px 30px;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0 16px;
            border-bottom: 2px solid var(--gold-dim);
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
            backdrop-filter: blur(10px);
            position: relative;
        }
        .header::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-cosmic), var(--verde-bosque), var(--gold-cosmic), transparent);
            opacity: 0.4;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        .logo-icon {
            font-size: 2rem;
            filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.2));
            animation: pulse-glow 3s ease-in-out infinite;
        }
        .logo-icon .hex {
            display: inline-block;
            background: var(--verde-bosque);
            color: var(--gold-cosmic);
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 900;
            border: 2px solid var(--gold-cosmic);
            font-family: 'Orbitron', monospace;
        }
        @keyframes pulse-glow {
            0%,
            100% {
                filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.2));
            }
            50% {
                filter: drop-shadow(0 0 40px rgba(212, 175, 55, 0.4));
            }
        }

        .logo-text {
            font-family: 'Orbitron', monospace;
            font-size: 1.3rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--gold-cosmic), var(--verde-bosque-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo-badge {
            font-family: 'Orbitron', monospace;
            font-size: 0.45rem;
            background: linear-gradient(135deg, var(--verde-bosque), var(--gold-cosmic));
            color: white;
            padding: 3px 12px;
            border-radius: 20px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            -webkit-text-fill-color: white;
            border: 1px solid rgba(212, 175, 55, 0.2);
            animation: badge-pulse 2s ease-in-out infinite;
        }
        @keyframes badge-pulse {
            0%,
            100% {
                box-shadow: 0 0 30px rgba(15, 45, 26, 0.3);
            }
            50% {
                box-shadow: 0 0 60px rgba(212, 175, 55, 0.2);
            }
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 16px;
            border: 1px solid var(--border);
            border-radius: 30px;
            background: rgba(212, 175, 55, 0.03);
            color: var(--text-primary);
            font-family: 'Orbitron', monospace;
            font-size: 0.6rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
        }
        .btn:hover {
            transform: scale(1.02);
            border-color: var(--border-glow);
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--verde-bosque), var(--verde-bosque-light));
            border-color: var(--gold-cosmic);
            color: var(--gold-cosmic);
            -webkit-text-fill-color: var(--gold-cosmic);
        }
        .btn-primary:hover:not(:disabled) {
            background: linear-gradient(135deg, var(--verde-bosque-light), var(--verde-bosque));
            box-shadow: 0 0 40px rgba(15, 45, 26, 0.5);
        }
        .btn-gold {
            background: linear-gradient(135deg, var(--gold-cosmic), #b8923a);
            border-color: transparent;
            color: #0a0c10;
            -webkit-text-fill-color: #0a0c10;
        }
        .btn-gold:hover:not(:disabled) {
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.3);
        }
        .btn-outline {
            border-color: var(--border);
            background: transparent;
        }
        .btn-outline:hover:not(:disabled) {
            background: rgba(212, 175, 55, 0.05);
            border-color: var(--gold-cosmic);
        }
        .btn-sm {
            padding: 4px 12px;
            font-size: 0.55rem;
        }
        .btn-success {
            background: rgba(0, 184, 148, 0.15);
            border-color: rgba(0, 184, 148, 0.3);
            color: var(--success);
        }
        .btn-success:hover:not(:disabled) {
            background: rgba(0, 184, 148, 0.25);
        }
        .btn-danger {
            background: rgba(255, 51, 102, 0.15);
            border-color: rgba(255, 51, 102, 0.3);
            color: var(--danger);
        }
        .btn-danger:hover:not(:disabled) {
            background: rgba(255, 51, 102, 0.25);
        }
        .btn-live {
            background: linear-gradient(135deg, var(--live-red), #cc0033);
            border-color: transparent;
            color: white;
            -webkit-text-fill-color: white;
            box-shadow: 0 0 20px var(--live-glow);
            animation: pulse-live 1.5s ease-in-out infinite;
        }
        .btn-live:hover:not(:disabled) {
            box-shadow: 0 0 40px var(--live-glow);
            transform: scale(1.03);
        }
        @keyframes pulse-live {
            0%,
            100% {
                box-shadow: 0 0 20px var(--live-glow);
            }
            50% {
                box-shadow: 0 0 40px var(--live-glow);
            }
        }

        .language-selector {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            background: rgba(212, 175, 55, 0.03);
            border-radius: 16px;
            border: 1px solid rgba(212, 175, 55, 0.08);
        }
        .language-selector .lang-icon {
            font-size: 0.7rem;
            margin-right: 2px;
        }
        .lang-btn {
            padding: 2px 8px;
            border-radius: 10px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-muted);
            font-family: 'Orbitron', monospace;
            font-size: 0.45rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .lang-btn:hover {
            color: var(--text-secondary);
            background: rgba(212, 175, 55, 0.05);
        }
        .lang-btn.active {
            border-color: var(--gold-cosmic);
            background: rgba(212, 175, 55, 0.1);
            color: var(--gold-cosmic);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(212, 175, 55, 0.06);
            border: 1px solid rgba(212, 175, 55, 0.15);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.6rem;
            color: var(--gold-cosmic);
            font-family: 'Orbitron', monospace;
            backdrop-filter: blur(10px);
        }
        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            animation: quantum-pulse 1.5s ease-in-out infinite;
        }
        .status-dot.online {
            background: var(--success);
            box-shadow: 0 0 20px rgba(0, 184, 148, 0.5);
        }
        @keyframes quantum-pulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(0.7);
            }
        }

        /* ===== DIRECTOS ===== */
        .directos-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }
        .directos-header h2 {
            font-family: 'Orbitron', monospace;
            font-size: 1rem;
            color: var(--text-secondary);
        }
        .directos-header h2 i {
            color: var(--live-red);
        }
        .directos-header .badge-live {
            background: var(--live-red);
            color: white;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.5rem;
            font-weight: 700;
            font-family: 'Orbitron', monospace;
            animation: pulse-live-text 1.5s ease-in-out infinite;
        }
        @keyframes pulse-live-text {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .directos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .directo-card {
            background: rgba(15, 45, 26, 0.15);
            border: 1px solid var(--gold-dim);
            border-radius: var(--radius);
            overflow: hidden;
            transition: var(--transition);
            cursor: pointer;
        }
        .directo-card:hover {
            border-color: var(--border-glow);
            transform: translateY(-4px);
        }
        .directo-card.live {
            border-color: var(--live-red);
            box-shadow: 0 0 30px var(--live-glow);
        }

        .directo-thumbnail {
            position: relative;
            aspect-ratio: 16/9;
            background: linear-gradient(135deg, var(--verde-bosque), var(--verde-bosque-light));
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .directo-thumbnail .icono {
            font-size: 4rem;
            opacity: 0.3;
        }
        .directo-thumbnail .badge-live {
            position: absolute;
            top: 10px;
            left: 10px;
            background: var(--live-red);
            color: white;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.5rem;
            font-weight: 700;
            font-family: 'Orbitron', monospace;
            animation: pulse-live-text 1.5s ease-in-out infinite;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .directo-thumbnail .badge-live .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: white;
            animation: pulse-live-text 1s ease-in-out infinite;
        }
        .directo-thumbnail .badge-viewers {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.45rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .directo-thumbnail .badge-viewers i {
            color: var(--gold-cosmic);
        }

        .directo-info {
            padding: 12px 16px;
        }
        .directo-info .titulo {
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--text-primary);
            margin-bottom: 4px;
        }
        .directo-info .creador {
            font-size: 0.6rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .directo-info .creador .avatar {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--verde-bosque), var(--gold-cosmic));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.4rem;
            color: white;
            font-weight: 700;
        }
        .directo-info .meta {
            display: flex;
            gap: 12px;
            margin-top: 6px;
            font-size: 0.5rem;
            color: var(--text-muted);
        }
        .directo-info .meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .directo-info .meta i {
            font-size: 0.4rem;
            color: var(--gold-cosmic);
        }

        .directo-acciones {
            padding: 8px 16px 16px;
            display: flex;
            gap: 6px;
        }
        .directo-acciones .btn {
            flex: 1;
            justify-content: center;
            padding: 6px 12px;
            font-size: 0.5rem;
        }

        /* ===== FOOTER ===== */
        .footer {
            margin-top: 24px;
            padding-top: 14px;
            border-top: 1px solid var(--gold-dim);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            position: relative;
        }
        .footer::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-cosmic), transparent);
            opacity: 0.2;
        }
        .footer-text {
            color: var(--text-muted);
            font-size: 0.5rem;
            letter-spacing: 0.5px;
            font-family: 'Orbitron', monospace;
        }
        .footer-text .brand {
            color: var(--gold-cosmic);
        }
        .footer-links {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.5rem;
            transition: var(--transition);
            font-family: 'Orbitron', monospace;
            letter-spacing: 0.5px;
        }
        .footer-links a:hover {
            color: var(--gold-cosmic);
        }
        .footer-hex {
            display: inline-block;
            background: var(--verde-bosque);
            color: var(--gold-cosmic);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.45rem;
            font-weight: 700;
            border: 1px solid var(--gold-cosmic);
            font-family: 'Orbitron', monospace;
        }

        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--verde-bosque);
            color: var(--gold-cosmic);
            padding: 10px 20px;
            border-radius: var(--radius);
            font-weight: 600;
            font-size: 0.7rem;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 5000;
            pointer-events: none;
            font-family: 'Orbitron', monospace;
            border: 1px solid rgba(212, 175, 55, 0.15);
            max-width: 90%;
            text-align: center;
        }
        .toast.active {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.error {
            background: var(--danger);
            color: white;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            .header-actions {
                width: 100%;
                justify-content: flex-start;
                flex-wrap: wrap;
            }
            .directos-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 480px) {
            .btn {
                font-size: 0.45rem;
                padding: 4px 8px;
            }
            .directos-grid {
                grid-template-columns: 1fr;
            }
            .directo-thumbnail .icono {
                font-size: 2.5rem;
            }
            .directo-info .titulo {
                font-size: 0.7rem;
            }
        }
    </style>
</head>

    <canvas id="stars-canvas"></canvas>

    <script>
        // ================================================================
        // 🌟 ESTRELLAS
        // ================================================================
        (function initStars() {
            const canvas = document.getElementById('stars-canvas');
            const ctx = canvas.getContext('2d');
            let w, h;

            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }
            resize();

            const stars = Array.from({ length: 200 }, () => ({
                x: Math.random() * w,
                y: Math.random() * h,
                r: Math.random() * 0.8 + 0.2,
                o: Math.random() * 0.8 + 0.2,
                speed: Math.random() * 0.005 + 0.002,
                phase: Math.random() * Math.PI * 2
            }));

            function draw() {
                ctx.clearRect(0, 0, w, h);
                stars.forEach(s => {
                    const opacity = s.o * (0.6 + 0.4 * Math.sin(s.phase));
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, 2 * Math.PI);
                    ctx.fillStyle = `rgba(255,255,255,${opacity})`;
                    ctx.fill();
                    s.y += s.speed;
                    s.phase += 0.01;
                    if (s.y > h) { s.y = 0;
                        s.x = Math.random() * w; }
                });
                requestAnimationFrame(draw);
            }
            draw();

            window.addEventListener('resize', () => {
                resize();
                stars.forEach(s => { s.x = Math.random() * w;
                    s.y = Math.random() * h; });
            });
        })();

        // ================================================================
        // 🌐 IDIOMAS
        // ================================================================
        const traducciones = {
            es: {
                'directos': 'Directos',
                'en_linea': 'En línea',
                'volver': 'Volver',
                'iniciar_directo': 'Iniciar Directo',
                'live': '● LIVE',
                'transmitiendo': 'personas transmitiendo ahora',
                'ver_directo': 'Ver Directo',
                'compartir': 'Compartir',
                'sin_directos': '📡 Sin transmisiones',
                'sin_directos_desc': 'No hay transmisiones en vivo en este momento. ¡Inicia una!',
                'iniciando': '📹 Iniciando transmisión...',
                'iniciado': '✅ Transmisión iniciada',
                'unirse': 'Unirse'
            },
            en: {
                'directos': 'Live',
                'en_linea': 'Online',
                'volver': 'Back',
                'iniciar_directo': 'Go Live',
                'live': '● LIVE',
                'transmitiendo': 'people streaming now',
                'ver_directo': 'Watch Live',
                'compartir': 'Share',
                'sin_directos': '📡 No streams',
                'sin_directos_desc': 'No live streams right now. Start one!',
                'iniciando': '📹 Starting stream...',
                'iniciado': '✅ Stream started',
                'unirse': 'Join'
            },
            fr: {
                'directos': 'Directs',
                'en_linea': 'En ligne',
                'volver': 'Retour',
                'iniciar_directo': 'Lancer un Direct',
                'live': '● EN DIRECT',
                'transmitiendo': 'personnes en direct maintenant',
                'ver_directo': 'Voir le Direct',
                'compartir': 'Partager',
                'sin_directos': '📡 Aucun direct',
                'sin_directos_desc': 'Aucun direct en ce moment. Lancez-en un!',
                'iniciando': '📹 Lancement du direct...',
                'iniciado': '✅ Direct lancé',
                'unirse': 'Rejoindre'
            }
        };

        let idiomaActual = localStorage.getItem('csariels_idioma') || 'es';

        function aplicarIdioma(idioma) {
            const t = traducciones[idioma] || traducciones.es;
            document.querySelector('.logo-badge').textContent = t.directos;
            document.querySelector('.status-badge span:last-child').textContent = t.en_linea;
            document.querySelector('.directos-header h2').innerHTML =
                `<i class="fas fa-broadcast"></i> ${t.directos} <span class="badge-live">● LIVE</span>`;
            document.querySelector('.header-actions .btn-live span:last-child').textContent = t.iniciar_directo;
            document.querySelector('.directos-header span').textContent =
                `2 ${t.transmitiendo}`;
        }

        function cambiarIdioma(idioma) {
            idiomaActual = idioma;
            localStorage.setItem('csariels_idioma', idioma);
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`.lang-btn[onclick="cambiarIdioma('${idioma}')"]`).classList.add('active');
            aplicarIdioma(idioma);
            renderDirectos();
            mostrarToast(`🌐 ${idioma.toUpperCase()}`);
        }

        // ================================================================
        // 📋 DATOS DE DIRECTOS
        // ================================================================
        let directos = [{
            id: 1,
            titulo: '🎮 Gameplay en vivo - Csariel\'s',
            creador: 'Csariel',
            avatar: 'C',
            viewers: 42,
            live: true,
            duracion: '12:34'
        }, {
            id: 2,
            titulo: '💻 Programación en directo - Proyecto',
            creador: 'María',
            avatar: 'M',
            viewers: 18,
            live: true,
            duracion: '45:12'
        }, {
            id: 3,
            titulo: '🎵 Sesión musical acústica',
            creador: 'Javier',
            avatar: 'J',
            viewers: 0,
            live: false,
            duracion: '01:23:45'
        }, {
            id: 4,
            titulo: '🌌 Explorando el espacio - Charla',
            creador: 'Laura',
            avatar: 'L',
            viewers: 0,
            live: false,
            duracion: '02:15:30'
        }];

        // ================================================================
        // 🖥️ RENDERIZAR DIRECTOS
        // ================================================================
        function renderDirectos() {
            const grid = document.getElementById('directosGrid');
            const t = traducciones[idiomaActual] || traducciones.es;

            // Filtrar: mostrar primero los que están en vivo
            const ordenados = [...directos].sort((a, b) => (b.live ? 1 : 0) - (a.live ? 1 : 0));

            if (ordenados.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--text-muted);">
                        <div style="font-size:3rem;opacity:0.3;margin-bottom:8px;">📡</div>
                        <h3 style="font-family:'Orbitron',monospace;font-size:0.85rem;color:var(--text-secondary);">${t.sin_directos}</h3>
                        <p style="font-size:0.65rem;">${t.sin_directos_desc}</p>
                        <button class="btn btn-live btn-sm" style="margin-top:12px;" onclick="iniciarDirecto()">
                            <i class="fas fa-broadcast"></i> ${t.iniciar_directo}
                        </button>
                    </div>
                `;
                return;
            }

            grid.innerHTML = ordenados.map(d => `
                <div class="directo-card ${d.live ? 'live' : ''}" onclick="verDirecto(${d.id})">
                    <div class="directo-thumbnail">
                        <span class="icono">${d.live ? '🔴' : '📹'}</span>
                        ${d.live ? `
                            <div class="badge-live">
                                <span class="dot"></span> LIVE
                            </div>
                            <div class="badge-viewers">
                                <i class="fas fa-eye"></i> ${d.viewers}
                            </div>
                        ` : `
                            <div class="badge-viewers">
                                <i class="fas fa-clock"></i> ${d.duracion}
                            </div>
                        `}
                    </div>
                    <div class="directo-info">
                        <div class="titulo">${d.titulo}</div>
                        <div class="creador">
                            <span class="avatar">${d.avatar}</span>
                            ${d.creador}
                            ${d.live ? '<span style="color:var(--live-red);font-size:0.4rem;font-weight:700;">● EN VIVO</span>' : ''}
                        </div>
                        <div class="meta">
                            <span><i class="fas fa-eye"></i> ${d.viewers} ${d.live ? 'viendo' : 'vistas'}</span>
                            <span><i class="fas fa-heart" style="color:var(--danger);"></i> ${Math.floor(Math.random() * 50) + 10}</span>
                        </div>
                    </div>
                    <div class="directo-acciones">
                        <button class="btn ${d.live ? 'btn-danger' : 'btn-outline'} btn-sm" onclick="event.stopPropagation();verDirecto(${d.id})">
                            <i class="fas ${d.live ? 'fa-broadcast' : 'fa-play'}"></i> ${d.live ? t.ver_directo : 'Ver grabación'}
                        </button>
                        <button class="btn btn-outline btn-sm" onclick="event.stopPropagation();compartirDirecto(${d.id})">
                            <i class="fas fa-share"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // ================================================================
        // 🎯 ACCIONES
        // ================================================================
        function iniciarDirecto() {
            const t = traducciones[idiomaActual] || traducciones.es;
            const titulo = prompt('📹 Título de la transmisión:', 'Mi directo en Csariel\'s');
            if (!titulo) return;

            mostrarToast(t.iniciando);
            setTimeout(() => {
                const nuevoDirecto = {
                    id: directos.length + 1,
                    titulo: titulo,
                    creador: 'Csariel',
                    avatar: 'C',
                    viewers: 1,
                    live: true,
                    duracion: '00:00'
                };
                directos.unshift(nuevoDirecto);
                renderDirectos();
                mostrarToast(t.iniciado);
            }, 2000);
        }

        function verDirecto(id) {
            const d = directos.find(d => d.id === id);
            if (!d) return;
            if (d.live) {
                mostrarToast(`📺 Viendo "${d.titulo}" - ${d.viewers} espectadores`);
            } else {
                mostrarToast(`📹 Reproduciendo grabación: "${d.titulo}"`);
            }
        }

        function compartirDirecto(id) {
            const d = directos.find(d => d.id === id);
            if (!d) return;
            const t = traducciones[idiomaActual] || traducciones.es;
            if (navigator.share) {
                navigator.share({
                    title: d.titulo,
                    text: `📺 ¡Mira "${d.titulo}" en Csariel's!`,
                }).catch(() => {});
            } else {
                mostrarToast(`📤 ${t.compartir}: "${d.titulo}"`);
            }
        }

        // ================================================================
        // 🔔 TOAST
        // ================================================================
        let toastTimeout;

        function mostrarToast(mensaje, tipo = '') {
            const toast = document.getElementById('toast');
            toast.textContent = mensaje;
            toast.className = 'toast active';
            if (tipo === 'error') toast.classList.add('error');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.remove('active'), 3000);
        }

        // ================================================================
        // 🚀 INICIALIZAR
        // ================================================================
        document.addEventListener('DOMContentLoaded', () => {
            aplicarIdioma(idiomaActual);
            renderDirectos();
            console.log('📹 Csariel\'s - Directos cargado');
        });

        // Simular cambios en espectadores
        setInterval(() => {
            directos.forEach(d => {
                if (d.live) {
                    d.viewers += Math.floor(Math.random() * 5) - 2;
                    if (d.viewers < 1) d.viewers = 1;
                }
            });
            if (document.querySelector('.directos-grid')) {
                renderDirectos();
            }
        }, 10000);

        // Exponer funciones globales
        window.cambiarIdioma = cambiarIdioma;
        window.iniciarDirecto = iniciarDirecto;
        window.verDirecto = verDirecto;
        window.compartirDirecto = compartirDirecto;
        window.mostrarToast = mostrarToast;
    </script>
</body>
</html>
