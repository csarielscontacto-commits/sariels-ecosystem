<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fotos | Csariel's</title>
    <meta name="theme-color" content="#0F2D1A" />

    <!-- ===== RECURSOS ===== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet" />

    <style>
        /* ================================================================
           ESTILOS CSARIEL'S - FOTOS
           ================================================================ */
        :root {
            --space-deep: #05080f;
            --space-mid: #0a1428;
            --verde-bosque: #0F2D1A;
            --verde-bosque-light: #1a4a2a;
            --gold-cosmic: #D4AF37;
            --gold-dim: rgba(212,175,55,0.15);
            --gold-glow: rgba(212,175,55,0.25);
            --text-primary: #e8f0f8;
            --text-secondary: #8ba3c7;
            --text-muted: #4a6a8a;
            --border: rgba(212,175,55,0.08);
            --border-glow: rgba(212,175,55,0.25);
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --success: #00b894;
            --danger: #ff3366;
            --warning: #D4AF37;
            --quantum: #00e5ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--space-deep);
            color: var(--text-primary);
            font-family: 'Space Grotesk', system-ui, sans-serif;
            min-height: 100vh;
        }

        #stars-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .nebula {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.10;
            pointer-events: none;
            z-index: 0;
            animation: nebula-drift 25s ease-in-out infinite alternate;
        }
        .nebula-1 {
            width: 700px;
            height: 700px;
            background: var(--verde-bosque);
            top: -15%;
            right: -15%;
        }
        .nebula-2 {
            width: 600px;
            height: 600px;
            background: var(--gold-cosmic);
            bottom: -15%;
            left: -15%;
            animation-delay: -8s;
            opacity: 0.05;
        }
        .nebula-3 {
            width: 500px;
            height: 500px;
            background: var(--quantum);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -15s;
            opacity: 0.04;
        }

        @keyframes nebula-drift {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(40px, -30px) scale(1.15);
            }
        }

        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: var(--space-deep);
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(var(--gold-cosmic), var(--verde-bosque));
            border-radius: 3px;
        }

        .app {
            position: relative;
            z-index: 1;
            max-width: 1000px;
            margin: 0 auto;
            padding: 16px 20px 30px;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0 16px;
            border-bottom: 2px solid var(--gold-dim);
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
            backdrop-filter: blur(10px);
            position: relative;
        }
        .header::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-cosmic), var(--verde-bosque), var(--gold-cosmic), transparent);
            opacity: 0.4;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        .logo-icon {
            font-size: 2rem;
            filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.2));
            animation: pulse-glow 3s ease-in-out infinite;
        }
        .logo-icon .hex {
            display: inline-block;
            background: var(--verde-bosque);
            color: var(--gold-cosmic);
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 900;
            border: 2px solid var(--gold-cosmic);
            font-family: 'Orbitron', monospace;
        }
        @keyframes pulse-glow {
            0%,
            100% {
                filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.2));
            }
            50% {
                filter: drop-shadow(0 0 40px rgba(212, 175, 55, 0.4));
            }
        }

        .logo-text {
            font-family: 'Orbitron', monospace;
            font-size: 1.3rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--gold-cosmic), var(--verde-bosque-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo-badge {
            font-family: 'Orbitron', monospace;
            font-size: 0.45rem;
            background: linear-gradient(135deg, var(--verde-bosque), var(--gold-cosmic));
            color: white;
            padding: 3px 12px;
            border-radius: 20px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            -webkit-text-fill-color: white;
            border: 1px solid rgba(212, 175, 55, 0.2);
            animation: badge-pulse 2s ease-in-out infinite;
        }
        @keyframes badge-pulse {
            0%,
            100% {
                box-shadow: 0 0 30px rgba(15, 45, 26, 0.3);
            }
            50% {
                box-shadow: 0 0 60px rgba(212, 175, 55, 0.2);
            }
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 16px;
            border: 1px solid var(--border);
            border-radius: 30px;
            background: rgba(212, 175, 55, 0.03);
            color: var(--text-primary);
            font-family: 'Orbitron', monospace;
            font-size: 0.6rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
        }
        .btn:hover {
            transform: scale(1.02);
            border-color: var(--border-glow);
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--verde-bosque), var(--verde-bosque-light));
            border-color: var(--gold-cosmic);
            color: var(--gold-cosmic);
            -webkit-text-fill-color: var(--gold-cosmic);
        }
        .btn-primary:hover:not(:disabled) {
            background: linear-gradient(135deg, var(--verde-bosque-light), var(--verde-bosque));
            box-shadow: 0 0 40px rgba(15, 45, 26, 0.5);
        }
        .btn-gold {
            background: linear-gradient(135deg, var(--gold-cosmic), #b8923a);
            border-color: transparent;
            color: #0a0c10;
            -webkit-text-fill-color: #0a0c10;
        }
        .btn-gold:hover:not(:disabled) {
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.3);
        }
        .btn-outline {
            border-color: var(--border);
            background: transparent;
        }
        .btn-outline:hover:not(:disabled) {
            background: rgba(212, 175, 55, 0.05);
            border-color: var(--gold-cosmic);
        }
        .btn-sm {
            padding: 4px 12px;
            font-size: 0.55rem;
        }
        .btn-success {
            background: rgba(0, 184, 148, 0.15);
            border-color: rgba(0, 184, 148, 0.3);
            color: var(--success);
        }
        .btn-success:hover:not(:disabled) {
            background: rgba(0, 184, 148, 0.25);
        }
        .btn-danger {
            background: rgba(255, 51, 102, 0.15);
            border-color: rgba(255, 51, 102, 0.3);
            color: var(--danger);
        }
        .btn-danger:hover:not(:disabled) {
            background: rgba(255, 51, 102, 0.25);
        }

        .language-selector {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            background: rgba(212, 175, 55, 0.03);
            border-radius: 16px;
            border: 1px solid rgba(212, 175, 55, 0.08);
        }
        .language-selector .lang-icon {
            font-size: 0.7rem;
            margin-right: 2px;
        }
        .lang-btn {
            padding: 2px 8px;
            border-radius: 10px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-muted);
            font-family: 'Orbitron', monospace;
            font-size: 0.45rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .lang-btn:hover {
            color: var(--text-secondary);
            background: rgba(212, 175, 55, 0.05);
        }
        .lang-btn.active {
            border-color: var(--gold-cosmic);
            background: rgba(212, 175, 55, 0.1);
            color: var(--gold-cosmic);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(212, 175, 55, 0.06);
            border: 1px solid rgba(212, 175, 55, 0.15);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.6rem;
            color: var(--gold-cosmic);
            font-family: 'Orbitron', monospace;
            backdrop-filter: blur(10px);
        }
        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            animation: quantum-pulse 1.5s ease-in-out infinite;
        }
        .status-dot.online {
            background: var(--success);
            box-shadow: 0 0 20px rgba(0, 184, 148, 0.5);
        }
        @keyframes quantum-pulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(0.7);
            }
        }

        /* ===== FOTOS ===== */
        .fotos-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }
        .fotos-header h2 {
            font-family: 'Orbitron', monospace;
            font-size: 1rem;
            color: var(--text-secondary);
        }
        .fotos-header h2 i {
            color: var(--gold-cosmic);
        }
        .fotos-header .badge-total {
            background: var(--gold-cosmic);
            color: var(--space-deep);
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.6rem;
            font-weight: 700;
            font-family: 'Orbitron', monospace;
        }

        .albumes-bar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px;
            overflow-x: auto;
            padding-bottom: 4px;
        }
        .album-btn {
            padding: 6px 16px;
            border: 1px solid var(--gold-dim);
            border-radius: 20px;
            background: transparent;
            color: var(--text-muted);
            font-family: 'Orbitron', monospace;
            font-size: 0.5rem;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
        }
        .album-btn:hover {
            border-color: var(--gold-cosmic);
            color: var(--text-secondary);
        }
        .album-btn.active {
            background: rgba(212, 175, 55, 0.1);
            border-color: var(--gold-cosmic);
            color: var(--gold-cosmic);
        }

        .fotos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
        }

        .foto-item {
            position: relative;
            background: rgba(15, 45, 26, 0.15);
            border: 1px solid var(--gold-dim);
            border-radius: var(--radius);
            overflow: hidden;
            aspect-ratio: 1;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .foto-item:hover {
            border-color: var(--border-glow);
            transform: scale(1.02);
        }

        .foto-item .preview {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            opacity: 0.3;
            background: linear-gradient(135deg, var(--verde-bosque), var(--verde-bosque-light));
        }
        .foto-item .preview .icono {
            font-size: 3rem;
            opacity: 0.5;
        }
        .foto-item .preview .label {
            position: absolute;
            bottom: 8px;
            left: 8px;
            font-size: 0.5rem;
            color: var(--text-muted);
            background: rgba(0, 0, 0, 0.5);
            padding: 2px 10px;
            border-radius: 10px;
        }

        .foto-item .overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: var(--transition);
            gap: 12px;
        }
        .foto-item:hover .overlay {
            opacity: 1;
        }
        .foto-item .overlay .btn {
            padding: 6px 12px;
            font-size: 0.5rem;
            border-radius: 20px;
        }

        .foto-item .badge-ubicacion {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.6);
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 0.4rem;
            color: var(--text-muted);
        }

        .foto-item .badge-fecha {
            position: absolute;
            bottom: 8px;
            right: 8px;
            font-size: 0.4rem;
            color: var(--text-muted);
            background: rgba(0, 0, 0, 0.5);
            padding: 2px 10px;
            border-radius: 10px;
        }

        .foto-item.add-foto {
            border: 2px dashed var(--gold-dim);
            background: rgba(212, 175, 55, 0.03);
        }
        .foto-item.add-foto:hover {
            border-color: var(--gold-cosmic);
            background: rgba(212, 175, 55, 0.06);
        }
        .foto-item.add-foto .preview {
            font-size: 1rem;
            flex-direction: column;
            gap: 8px;
        }
        .foto-item.add-foto .preview i {
            font-size: 3rem;
            opacity: 0.3;
        }
        .foto-item.add-foto .preview span {
            font-size: 0.6rem;
            color: var(--text-muted);
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(10px);
        }
        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            max-width: 90%;
            max-height: 90%;
            background: var(--space-deep);
            border: 1px solid var(--gold-dim);
            border-radius: var(--radius);
            overflow: hidden;
            position: relative;
        }
        .modal-content .modal-close {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.6);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            transition: var(--transition);
            z-index: 10;
        }
        .modal-content .modal-close:hover {
            background: var(--danger);
        }

        .modal-content .modal-img {
            width: 100%;
            height: auto;
            max-height: 80vh;
            object-fit: contain;
            display: block;
        }

        .modal-content .modal-info {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            background: rgba(15, 45, 26, 0.3);
            border-top: 1px solid var(--gold-dim);
        }
        .modal-content .modal-info .title {
            font-size: 0.7rem;
            color: var(--text-secondary);
        }
        .modal-content .modal-info .title strong {
            color: var(--text-primary);
        }
        .modal-content .modal-info .actions {
            display: flex;
            gap: 6px;
        }

        /* ===== FOOTER ===== */
        .footer {
            margin-top: 24px;
            padding-top: 14px;
            border-top: 1px solid var(--gold-dim);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            position: relative;
        }
        .footer::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-cosmic), transparent);
            opacity: 0.2;
        }
        .footer-text {
            color: var(--text-muted);
            font-size: 0.5rem;
            letter-spacing: 0.5px;
            font-family: 'Orbitron', monospace;
        }
        .footer-text .brand {
            color: var(--gold-cosmic);
        }
        .footer-links {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.5rem;
            transition: var(--transition);
            font-family: 'Orbitron', monospace;
            letter-spacing: 0.5px;
        }
        .footer-links a:hover {
            color: var(--gold-cosmic);
        }
        .footer-hex {
            display: inline-block;
            background: var(--verde-bosque);
            color: var(--gold-cosmic);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.45rem;
            font-weight: 700;
            border: 1px solid var(--gold-cosmic);
            font-family: 'Orbitron', monospace;
        }

        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--verde-bosque);
            color: var(--gold-cosmic);
            padding: 10px 20px;
            border-radius: var(--radius);
            font-weight: 600;
            font-size: 0.7rem;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 5000;
            pointer-events: none;
            font-family: 'Orbitron', monospace;
            border: 1px solid rgba(212, 175, 55, 0.15);
            max-width: 90%;
            text-align: center;
        }
        .toast.active {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.error {
            background: var(--danger);
            color: white;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            .header-actions {
                width: 100%;
                justify-content: flex-start;
                flex-wrap: wrap;
            }
            .fotos-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            .modal-content {
                max-width: 95%;
            }
        }

        @media (max-width: 480px) {
            .btn {
                font-size: 0.45rem;
                padding: 4px 8px;
            }
            .fotos-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .album-btn {
                font-size: 0.4rem;
                padding: 4px 10px;
            }
            .modal-content .modal-info {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <!-- ===== FONDO ESTELAR ===== -->
    <canvas id="stars-canvas"></canvas>
    <div class="nebula nebula-1"></div>
    <div class="nebula nebula-2"></div>
    <div class="nebula nebula-3"></div>

    <div class="app">

        <!-- ===== HEADER ===== -->
        <header class="header">
            <a href="../index.html" class="logo">
                <span class="logo-icon"><span class="hex">◈</span></span>
                <span class="logo-text">Csariel's</span>
                <span class="logo-badge">Fotos</span>
            </a>
            <div class="header-actions">
                <div class="language-selector">
                    <span class="lang-icon">🌐</span>
                    <button class="lang-btn active" onclick="cambiarIdioma('es')">ES</button>
                    <button class="lang-btn" onclick="cambiarIdioma('en')">EN</button>
                    <button class="lang-btn" onclick="cambiarIdioma('fr')">FR</button>
                </div>

                <div class="status-badge">
                    <span class="status-dot online"></span>
                    <span>En línea</span>
                </div>

                <a href="../index.html" class="btn btn-outline btn-sm">
                    <i class="fas fa-arrow-left"></i> Volver
                </a>
                <a href="../perfil/index.html" class="btn btn-outline btn-sm">
                    <i class="fas fa-user"></i> Perfil
                </a>
            </div>
        </header>

        <!-- ===== FOTOS ===== -->
        <div class="fotos-header">
            <h2><i class="fas fa-images"></i> Mis Fotos <span class="badge-total" id="totalFotos">9</span></h2>
            <button class="btn btn-primary btn-sm" onclick="subirFoto()">
                <i class="fas fa-upload"></i> Subir foto
            </button>
        </div>

        <div class="albumes-bar">
            <button class="album-btn active" data-album="todos" onclick="cambiarAlbum('todos')">📸 Todas</button>
            <button class="album-btn" data-album="perfil" onclick="cambiarAlbum('perfil')">👤 Perfil</button>
            <button class="album-btn" data-album="viajes" onclick="cambiarAlbum('viajes')">✈️ Viajes</button>
            <button class="album-btn" data-album="eventos" onclick="cambiarAlbum('eventos')">🎉 Eventos</button>
            <button class="album-btn" data-album="familia" onclick="cambiarAlbum('familia')">👨‍👩‍👦 Familia</button>
        </div>

        <div class="fotos-grid" id="fotosGrid">
            <!-- Renderizado con JavaScript -->
        </div>

        <!-- ===== MODAL ===== -->
        <div class="modal-overlay" id="modalFoto" onclick="cerrarModal()">
            <div class="modal-content" onclick="event.stopPropagation();">
                <button class="modal-close" onclick="cerrarModal()"><i class="fas fa-times"></i></button>
                <div class="modal-img" id="modalImg">📸</div>
                <div class="modal-info">

        (function initStars() {
            const canvas = document.getElementById('stars-canvas');
            const ctx = canvas.getContext('2d');
            let w, h;

            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }
            resize();

            const stars = Array.from({ length: 200 }, () => ({
                x: Math.random() * w,
                y: Math.random() * h,
                r: Math.random() * 0.8 + 0.2,
                o: Math.random() * 0.8 + 0.2,
                speed: Math.random() * 0.005 + 0.002,
                phase: Math.random() * Math.PI * 2
            }));

            function draw() {
                ctx.clearRect(0, 0, w, h);
                stars.forEach(s => {
                    const opacity = s.o * (0.6 + 0.4 * Math.sin(s.phase));
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, 2 * Math.PI);
                    ctx.fillStyle = `rgba(255,255,255,${opacity})`;
                    ctx.fill();
                    s.y += s.speed;
                    s.phase += 0.01;
                    if (s.y > h) { s.y = 0;
                        s.x = Math.random() * w; }
                });
                requestAnimationFrame(draw);
            }
            draw();

            window.addEventListener('resize', () => {
                resize();
                stars.forEach(s => { s.x = Math.random() * w;
                    s.y = Math.random() * h; });
            });
        })();

        function aplicarIdioma(idioma) {

            document.querySelector('.fotos-header .btn span:last-child').textContent = t.subir_foto;

            document.querySelectorAll('.album-btn').forEach(b => {
                const key = b.dataset.album;
                if (key === 'todos') b.textContent = t.todas;
                else if (key === 'perfil') b.textContent = t.album_perfil;
                else if (key === 'viajes') b.textContent = t.album_viajes;
                else if (key === 'eventos') b.textContent = t.album_eventos;
                else if (key === 'familia') b.textContent = t.album_familia;
            });
        }

        function cambiarIdioma(idioma) {
            idiomaActual = idioma;
            localStorage.setItem('csariels_idioma', idioma);
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`.lang-btn[onclick="cambiarIdioma('${idioma}')"]`).classList.add('active');

            renderFotos();

        // ================================================================
        // 🖥️ RENDERIZAR FOTOS
        // ================================================================
        function renderFotos() {
            const grid = document.getElementById('fotosGrid');
            const t = traducciones[idiomaActual] || traducciones.es;

            let filtradas = [...fotos];

            if (albumActual !== 'todos') {
                filtradas = filtradas.filter(f => f.album === albumActual);
            }

            document.getElementById('totalFotos').textContent = filtradas.length;

            if (filtradas.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column:1/-1;text-align:center;padding:40px 20px;color:var(--text-muted);">
                        <div style="font-size:3rem;opacity:0.3;margin-bottom:8px;">🖼️</div>
                        <h3 style="font-family:'Orbitron',monospace;font-size:0.85rem;color:var(--text-secondary);">${t.sin_fotos}</h3>

                    <div class="foto-item add-foto" onclick="subirFoto()">
                        <div class="preview">

                            <span>${t.subir_foto}</span>

                return;

            grid.innerHTML = filtradas.map(f => `

                    <div class="badge-ubicacion"><i class="fas fa-map-marker-alt"></i> ${f.ubicacion}</div>
                    <div class="badge-fecha">${f.fecha}</div>
                    <div class="overlay">
                        <button class="btn btn-outline btn-sm" onclick="event.stopPropagation();mostrarToast('📤 Compartiendo...')"><i class="fas fa-share"></i></button>
                        <button class="btn btn-danger btn-sm" onclick="event.stopPropagation();eliminarFoto(${f.id})"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            `).join('') + `
                <div class="foto-item add-foto" onclick="subirFoto()">
                    <div class="preview">

        // ================================================================
        // 🔍 ALBUMES
        // ================================================================
        function cambiarAlbum(album) {
            albumActual = album;
            document.querySelectorAll('.album-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`.album-btn[data-album="${album}"]`).classList.add('active');
            renderFotos();
        }

        // ================================================================
        // 🎯 ACCIONES
        // ================================================================
        function subirFoto() {
            const t = traducciones[idiomaActual] || traducciones.es;
            mostrarToast(t.subiendo);
            setTimeout(() => {
                const nuevaFoto = {
                    id: fotos.length + 1,
                    nombre: `Nueva foto ${fotos.length + 1} 📷`,
                    icono: '📷',
                    album: albumActual === 'todos' ? 'perfil' : albumActual,
                    fecha: new Date().toLocaleDateString('es-ES'),
                    ubicacion: 'Ubicación'
                };
                fotos.push(nuevaFoto);
                renderFotos();
                mostrarToast(t.subida);
            }, 1500);
        }

        function eliminarFoto(id) {
            const foto = fotos.find(f => f.id === id);
            if (!foto) return;
            if (confirm(`¿Eliminar "${foto.nombre}"?`)) {
                fotos = fotos.filter(f => f.id !== id);
                renderFotos();
                mostrarToast('🗑️ Foto eliminada');
            }
        }

        function abrirModal(id) {
            const foto = fotos.find(f => f.id === id);
            if (!foto) return;
            document.getElementById('modalImg').textContent = foto.icono;
            document.getElementById('modalImg').style.fontSize = '8rem';
            document.getElementById('modalImg').style.textAlign = 'center';
            document.getElementById('modalImg').style.padding = '60px 40px';
            document.getElementById('modalTitle').innerHTML =
                `<strong>${foto.nombre}</strong> <span id="modalFecha">${foto.fecha} · ${foto.ubicacion}</span>`;
            document.getElementById('modalFoto').classList.add('active');
        }

        function cerrarModal() {
            document.getElementById('modalFoto').classList.remove('active');
        }

        // ================================================================
        // 🔔 TOAST
        // ================================================================
        let toastTimeout;

        function mostrarToast(mensaje, tipo = '') {
            const toast = document.getElementById('toast');
            toast.textContent = mensaje;
            toast.className = 'toast active';
            if (tipo === 'error') toast.classList.add('error');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.remove('active'), 3000);
        }

        // 🚀 INICIALIZAR
        // ================================================================
        document.addEventListener('DOMContentLoaded', () => {
            aplicarIdioma(idiomaActual);
            renderFotos();
            console.log('🖼️ Csariel\'s - Fotos cargado');
        });

        // Exponer funciones globales
        window.cambiarIdioma = cambiarIdioma;
        window.cambiarAlbum = cambiarAlbum;
        window.subirFoto = subirFoto;
        window.eliminarFoto = eliminarFoto;
        window.abrirModal = abrirModal;
        window.cerrarModal = cerrarModal;
        window.mostrarToast = mostrarToast;
    </script>
