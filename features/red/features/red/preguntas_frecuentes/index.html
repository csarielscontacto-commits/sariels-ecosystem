<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preguntas Frecuentes | Csariel's</title>
    <meta name="theme-color" content="#0F2D1A" />

    <!-- ===== RECURSOS ===== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet" />

    <style>
        /* ================================================================
           ESTILOS CSARIEL'S - PREGUNTAS FRECUENTES
           ================================================================ */
        :root {
            --space-deep: #05080f;
            --space-mid: #0a1428;
            --verde-bosque: #0F2D1A;
            --verde-bosque-light: #1a4a2a;
            --gold-cosmic: #D4AF37;
            --gold-dim: rgba(212,175,55,0.15);
            --gold-glow: rgba(212,175,55,0.25);
            --text-primary: #e8f0f8;
            --text-secondary: #8ba3c7;
            --text-muted: #4a6a8a;
            --border: rgba(212,175,55,0.08);
            --border-glow: rgba(212,175,55,0.25);
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --success: #00b894;
            --danger: #ff3366;
            --warning: #D4AF37;
            --quantum: #00e5ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--space-deep);
            color: var(--text-primary);
            font-family: 'Space Grotesk', system-ui, sans-serif;
            min-height: 100vh;
        }

        #stars-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .nebula {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.10;
            pointer-events: none;
            z-index: 0;
            animation: nebula-drift 25s ease-in-out infinite alternate;
        }
        .nebula-1 {
            width: 700px;
            height: 700px;
            background: var(--verde-bosque);
            top: -15%;
            right: -15%;
        }
        .nebula-2 {
            width: 600px;
            height: 600px;
            background: var(--gold-cosmic);
            bottom: -15%;
            left: -15%;
            animation-delay: -8s;
            opacity: 0.05;
        }
        .nebula-3 {
            width: 500px;
            height: 500px;
            background: var(--quantum);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -15s;
            opacity: 0.04;
        }

        @keyframes nebula-drift {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(40px, -30px) scale(1.15);
            }
        }

        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: var(--space-deep);
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(var(--gold-cosmic), var(--verde-bosque));
            border-radius: 3px;
        }

        .app {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 16px 20px 30px;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0 16px;
            border-bottom: 2px solid var(--gold-dim);
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
            backdrop-filter: blur(10px);
            position: relative;
        }
        .header::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-cosmic), var(--verde-bosque), var(--gold-cosmic), transparent);
            opacity: 0.4;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        .logo-icon {
            font-size: 2rem;
            filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.2));
            animation: pulse-glow 3s ease-in-out infinite;
        }
        .logo-icon .hex {
            display: inline-block;
            background: var(--verde-bosque);
            color: var(--gold-cosmic);
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 900;
            border: 2px solid var(--gold-cosmic);
            font-family: 'Orbitron', monospace;
        }
        @keyframes pulse-glow {
            0%,
            100% {
                filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.2));
            }
            50% {
                filter: drop-shadow(0 0 40px rgba(212, 175, 55, 0.4));
            }
        }

        .logo-text {
            font-family: 'Orbitron', monospace;
            font-size: 1.3rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--gold-cosmic), var(--verde-bosque-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo-badge {
            font-family: 'Orbitron', monospace;
            font-size: 0.45rem;
            background: linear-gradient(135deg, var(--verde-bosque), var(--gold-cosmic));
            color: white;
            padding: 3px 12px;
            border-radius: 20px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            -webkit-text-fill-color: white;
            border: 1px solid rgba(212, 175, 55, 0.2);
            animation: badge-pulse 2s ease-in-out infinite;
        }
        @keyframes badge-pulse {
            0%,
            100% {
                box-shadow: 0 0 30px rgba(15, 45, 26, 0.3);
            }
            50% {
                box-shadow: 0 0 60px rgba(212, 175, 55, 0.2);
            }
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 16px;
            border: 1px solid var(--border);
            border-radius: 30px;
            background: rgba(212, 175, 55, 0.03);
            color: var(--text-primary);
            font-family: 'Orbitron', monospace;
            font-size: 0.6rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
        }
        .btn:hover {
            transform: scale(1.02);
            border-color: var(--border-glow);
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--verde-bosque), var(--verde-bosque-light));
            border-color: var(--gold-cosmic);
            color: var(--gold-cosmic);
            -webkit-text-fill-color: var(--gold-cosmic);
        }
        .btn-primary:hover:not(:disabled) {
            background: linear-gradient(135deg, var(--verde-bosque-light), var(--verde-bosque));
            box-shadow: 0 0 40px rgba(15, 45, 26, 0.5);
        }
        .btn-gold {
            background: linear-gradient(135deg, var(--gold-cosmic), #b8923a);
            border-color: transparent;
            color: #0a0c10;
            -webkit-text-fill-color: #0a0c10;
        }
        .btn-gold:hover:not(:disabled) {
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.3);
        }
        .btn-outline {
            border-color: var(--border);
            background: transparent;
        }
        .btn-outline:hover:not(:disabled) {
            background: rgba(212, 175, 55, 0.05);
            border-color: var(--gold-cosmic);
        }
        .btn-sm {
            padding: 4px 12px;
            font-size: 0.55rem;
        }

        .language-selector {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            background: rgba(212, 175, 55, 0.03);
            border-radius: 16px;
            border: 1px solid rgba(212, 175, 55, 0.08);
        }
        .language-selector .lang-icon {
            font-size: 0.7rem;
            margin-right: 2px;
        }
        .lang-btn {
            padding: 2px 8px;
            border-radius: 10px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-muted);
            font-family: 'Orbitron', monospace;
            font-size: 0.45rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .lang-btn:hover {
            color: var(--text-secondary);
            background: rgba(212, 175, 55, 0.05);
        }
        .lang-btn.active {
            border-color: var(--gold-cosmic);
            background: rgba(212, 175, 55, 0.1);
            color: var(--gold-cosmic);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(212, 175, 55, 0.06);
            border: 1px solid rgba(212, 175, 55, 0.15);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.6rem;
            color: var(--gold-cosmic);
            font-family: 'Orbitron', monospace;
            backdrop-filter: blur(10px);
        }
        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            animation: quantum-pulse 1.5s ease-in-out infinite;
        }
        .status-dot.online {
            background: var(--success);
            box-shadow: 0 0 20px rgba(0, 184, 148, 0.5);
        }
        @keyframes quantum-pulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(0.7);
            }
        }

        /* ===== PREGUNTAS FRECUENTES ===== */
        .faq-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }
        .faq-header h2 {
            font-family: 'Orbitron', monospace;
            font-size: 1rem;
            color: var(--text-secondary);
        }
        .faq-header h2 i {
            color: var(--gold-cosmic);
        }

        .busqueda-faq {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .busqueda-faq input {
            flex: 1;
            padding: 8px 14px;
            border-radius: 30px;
            border: 1px solid var(--gold-dim);
            background: rgba(15, 45, 26, 0.15);
            color: var(--text-primary);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.7rem;
            outline: none;
            transition: var(--transition);
        }
        .busqueda-faq input:focus {
            border-color: var(--gold-cosmic);
        }
        .busqueda-faq input::placeholder {
            color: var(--text-muted);
        }

        .categorias-faq {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .cat-faq-btn {
            padding: 4px 14px;
            border: 1px solid var(--gold-dim);
            border-radius: 20px;
            background: transparent;
            color: var(--text-muted);
            font-family: 'Orbitron', monospace;
            font-size: 0.45rem;
            cursor: pointer;
            transition: var(--transition);
        }
        .cat-faq-btn:hover {
            border-color: var(--gold-cosmic);
            color: var(--text-secondary);
        }
        .cat-faq-btn.active {
            background: rgba(212, 175, 55, 0.1);
            border-color: var(--gold-cosmic);
            color: var(--gold-cosmic);
        }

        .faq-item {
            background: rgba(15, 45, 26, 0.04);
            border: 1px solid var(--gold-dim);
            border-radius: var(--radius);
            padding: 12px 16px;
            margin-bottom: 8px;
            transition: var(--transition);
        }
        .faq-item:hover {
            border-color: var(--border-glow);
            background: rgba(15, 45, 26, 0.08);
        }
        .faq-item .pregunta {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }
        .faq-item .pregunta .icono {
            color: var(--gold-cosmic);
            font-size: 0.8rem;
            flex-shrink: 0;
        }
        .faq-item .pregunta .texto {
            font-weight: 600;
            font-size: 0.75rem;
            color: var(--text-primary);
            flex: 1;
        }
        .faq-item .pregunta .toggle-icon {
            color: var(--text-muted);
            transition: var(--transition);
        }
        .faq-item .pregunta .toggle-icon.rotated {
            transform: rotate(180deg);
        }

        .faq-item .respuesta {
            display: none;
            padding-top: 10px;
            border-top: 1px solid var(--gold-dim);
            margin-top: 10px;
            font-size: 0.65rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }
        .faq-item .respuesta.open {
            display: block;
        }
        .faq-item .respuesta ul {
            list-style: none;
            padding: 4px 0;
        }
        .faq-item .respuesta ul li {
            padding: 2px 0;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }
        .faq-item .respuesta ul li i {
            color: var(--gold-cosmic);
            font-size: 0.5rem;
            margin-top: 3px;
        }
        .faq-item .respuesta .enlace {
            color: var(--gold-cosmic);
            cursor: pointer;
            text-decoration: underline;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }
        .empty-state .icon {
            font-size: 2.5rem;
            opacity: 0.3;
            margin-bottom: 6px;
        }
        .empty-state h3 {
            font-family: 'Orbitron', monospace;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        .empty-state p {
            font-size: 0.6rem;
        }

        .no-encontrado {
            display: none;
            text-align: center;
            padding: 30px 20px;
            color: var(--text-muted);
        }
        .no-encontrado .icon {
            font-size: 2rem;
            opacity: 0.3;
            margin-bottom: 6px;
        }
        .no-encontrado h4 {
            font-family: 'Orbitron', monospace;
            font-size: 0.7rem;
            color: var(--text-secondary);
        }
        .no-encontrado p {
            font-size: 0.55rem;
        }

        /* ===== FOOTER ===== */
        .footer {
            margin-top: 24px;
            padding-top: 14px;
            border-top: 1px solid var(--gold-dim);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            position: relative;
        }
        .footer::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-cosmic), transparent);
            opacity: 0.2;
        }
        .footer-text {
            color: var(--text-muted);
            font-size: 0.5rem;
            letter-spacing: 0.5px;
            font-family: 'Orbitron', monospace;
        }
        .footer-text .brand {
            color: var(--gold-cosmic);
        }
        .footer-links {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.5rem;
            transition: var(--transition);
            font-family: 'Orbitron', monospace;
            letter-spacing: 0.5px;
        }
        .footer-links a:hover {
            color: var(--gold-cosmic);
        }
        .footer-hex {
            display: inline-block;
            background: var(--verde-bosque);
            color: var(--gold-cosmic);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.45rem;
            font-weight: 700;
            border: 1px solid var(--gold-cosmic);
            font-family: 'Orbitron', monospace;
        }

        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--verde-bosque);
            color: var(--gold-cosmic);
            padding: 10px 20px;
            border-radius: var(--radius);
            font-weight: 600;
            font-size: 0.7rem;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 5000;
            pointer-events: none;
            font-family: 'Orbitron', monospace;
            border: 1px solid rgba(212, 175, 55, 0.15);
            max-width: 90%;
            text-align: center;
        }
        .toast.active {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.error {
            background: var(--danger);
            color: white;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            .header-actions {
                width: 100%;
                justify-content: flex-start;
                flex-wrap: wrap;
            }
            .faq-item .pregunta .texto {
                font-size: 0.65rem;
            }
            .faq-item .respuesta {
                font-size: 0.55rem;
            }
        }

        @media (max-width: 480px) {
            .btn {
                font-size: 0.45rem;
                padding: 4px 8px;
            }
            .busqueda-faq {
                flex-direction: column;
            }
            .cat-faq-btn {
                font-size: 0.4rem;
                padding: 3px 10px;
            }
        }
    </style>
</head>
<body>
    <!-- ===== FONDO ESTELAR ===== -->
    <canvas id="stars-canvas"></canvas>
    <div class="nebula nebula-1"></div>
    <div class="nebula nebula-2"></div>
    <div class="nebula nebula-3"></div>

    <div class="app">

        <!-- ===== HEADER ===== -->
        <header class="header">
            <a href="../index.html" class="logo">
                <span class="logo-icon"><span class="hex">◈</span></span>
                <span class="logo-text">Csariel's</span>

                <div class="language-selector">

                <div class="status-badge">

                <a href="../index.html" class="btn btn-outline btn-sm">

        <div class="faq-header">

            <span style="font-size:0.55rem;color:var(--text-muted);">Encuentra respuestas rápidas</span>
        </div>

            <input type="text" id="buscarFaq" placeholder="🔍 Buscar pregunta..." oninput="filtrarFaq()" />

            <button class="cat-faq-btn active" data-cat="todas" onclick="filtrarCategoria('todas')">📌 Todas</button>
            <button class="cat-faq-btn" data-cat="cuenta" onclick="filtrarCategoria('cuenta')">👤 Cuenta</button>
            <button class="cat-faq-btn" data-cat="seguridad" onclick="filtrarCategoria('seguridad')">🔒 Seguridad</button>
            <button class="cat-faq-btn" data-cat="esim" onclick="filtrarCategoria('esim')">📶 eSIM</button>
            <button class="cat-faq-btn" data-cat="comunidad" onclick="filtrarCategoria('comunidad')">🌐 Comunidad</button>

            <div class="footer-links">

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast"></div>

    <!-- ================================================================ -->
    <!-- SCRIPTS -->
    <!-- ================================================================ -->
    <script>
        // ================================================================
        // 🌟 ESTRELLAS
        // ================================================================
        (function initStars() {
            const canvas = document.getElementById('stars-canvas');
            const ctx = canvas.getContext('2d');
            let w, h;

            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }
            resize();

            const stars = Array.from({ length: 200 }, () => ({
                x: Math.random() * w,
                y: Math.random() * h,
                r: Math.random() * 0.8 + 0.2,
                o: Math.random() * 0.8 + 0.2,
                speed: Math.random() * 0.005 + 0.002,
                phase: Math.random() * Math.PI * 2
            }));

            function draw() {
                ctx.clearRect(0, 0, w, h);
                stars.forEach(s => {
                    const opacity = s.o * (0.6 + 0.4 * Math.sin(s.phase));
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, 2 * Math.PI);
                    ctx.fillStyle = `rgba(255,255,255,${opacity})`;
                    ctx.fill();
                    s.y += s.speed;
                    s.phase += 0.01;
                    if (s.y > h) { s.y = 0;
                        s.x = Math.random() * w; }
                });
                requestAnimationFrame(draw);
            }
            draw();

            window.addEventListener('resize', () => {
                resize();
                stars.forEach(s => { s.x = Math.random() * w;
                    s.y = Math.random() * h; });
            });
        })();

        // ================================================================
        // 🌐 IDIOMAS
        // ================================================================
        const traducciones = {
            es: {
                'faq': 'Preguntas Frecuentes',
                'en_linea': 'En línea',
                'volver': 'Volver',
                'encuentra': 'Encuentra respuestas rápidas',
                'buscar': '🔍 Buscar pregunta...',
                'todas': '📌 Todas',
                'cuenta': '👤 Cuenta',
                'seguridad': '🔒 Seguridad',
                'esim': '📶 eSIM',
                'comunidad': '🌐 Comunidad',
                'pagos': '💳 Pagos',
                'no_resultados': 'No se encontraron preguntas',
                'intenta_otra': 'Intenta con otra palabra clave o categoría'
            },
            en: {
                'faq': 'Frequently Asked Questions',
                'en_linea': 'Online',
                'volver': 'Back',
                'encuentra': 'Find quick answers',
                'buscar': '🔍 Search question...',
                'todas': '📌 All',
                'cuenta': '👤 Account',
                'seguridad': '🔒 Security',
                'esim': '📶 eSIM',
                'comunidad': '🌐 Community',
                'pagos': '💳 Payments',
                'no_resultados': 'No questions found',
                'intenta_otra': 'Try another keyword or category'
            },
            fr: {
                'faq': 'Questions Fréquentes',
                'en_linea': 'En ligne',
                'volver': 'Retour',
                'encuentra': 'Trouvez des réponses rapides',
                'buscar': '🔍 Rechercher une question...',
                'todas': '📌 Toutes',
                'cuenta': '👤 Compte',
                'seguridad': '🔒 Sécurité',
                'esim': '📶 eSIM',
                'comunidad': '🌐 Communauté',
                'pagos': '💳 Paiements',
                'no_resultados': 'Aucune question trouvée',
                'intenta_otra': 'Essayez un autre mot-clé ou catégorie'
            }
        };

        let idiomaActual = localStorage.getItem('csariels_idioma') || 'es';
        let categoriaActual = 'todas';

        function aplicarIdioma(idioma) {
            const t = traducciones[idioma] || traducciones.es;
            document.querySelector('.logo-badge').textContent = t.faq;
            document.querySelector('.status-badge span:last-child').textContent = t.en_linea;
            document.querySelector('.faq-header h2').innerHTML =
                `<i class="fas fa-question-circle"></i> ${t.faq}`;
            document.querySelector('.faq-header span').textContent = t.encuentra;
            document.querySelector('.busqueda-faq input').placeholder = t.buscar;

            document.querySelectorAll('.cat-faq-btn').forEach(b => {
                const key = b.dataset.cat;
                if (key === 'todas') b.textContent = t.todas;
                else if (key === 'cuenta') b.textContent = t.cuenta;
                else if (key === 'seguridad') b.textContent = t.seguridad;
                else if (key === 'esim') b.textContent = t.esim;
                else if (key === 'comunidad') b.textContent = t.comunidad;
                else if (key === 'pagos') b.textContent = t.pagos;
            });

            document.querySelector('#noEncontrado h4').textContent = t.no_resultados;
            document.querySelector('#noEncontrado p').textContent = t.intenta_otra;
        }

        function cambiarIdioma(idioma) {
            idiomaActual = idioma;
            localStorage.setItem('csariels_idioma', idioma);
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`.lang-btn[onclick="cambiarIdioma('${idioma}')"]`).classList.add('active');
            aplicarIdioma(idioma);
            renderFaq();
            mostrarToast(`🌐 ${idioma.toUpperCase()}`);
        }

        // ================================================================
        // 📋 DATOS DE FAQ
        // ================================================================
        let faqs = [{
            id: 1,
            categoria: 'cuenta',
            pregunta: '¿Cómo creo una cuenta en Csariel\'s?',
            respuesta: 'Para crear una cuenta, haz clic en "Registrarse" en la página principal. Completa el formulario con tu nombre, correo electrónico y contraseña. Recibirás un correo de confirmación para activar tu cuenta.'
        }, {
            id: 2,
            categoria: 'cuenta',
            pregunta: '¿Puedo cambiar mi nombre de usuario?',
            respuesta: 'Sí, puedes cambiar tu nombre de usuario desde la sección de Configuración > Perfil. Ten en cuenta que los cambios solo se permiten una vez cada 30 días.'
        }, {
            id: 3,
            categoria: 'seguridad',
            pregunta: '¿Cómo activo la verificación en 2 pasos?',
            respuesta: 'Ve a Seguridad > Verificación en 2 pasos. Selecciona tu método preferido (SMS o app de autenticación) y sigue las instrucciones para activarlo.'
        }, {
            id: 4,
            categoria: 'seguridad',
            pregunta: '¿Qué hago si olvidé mi contraseña?',
            respuesta: 'Haz clic en "¿Olvidaste tu contraseña?" en la página de inicio de sesión. Ingresa tu correo y recibirás un enlace para restablecer tu contraseña.'
        }, {
            id: 5,
            categoria: 'esim',
            pregunta: '¿Cómo activo mi eSIM?',
            respuesta: 'Ve a la sección eSIM en tu red. Selecciona "Activar eSIM", elige tu plan y sigue las instrucciones. Necesitarás escanear un código QR que te proporcionaremos.'
        }, {
            id: 6,
            categoria: 'esim',
            pregunta: '¿Puedo recargar datos en mi eSIM?',
            respuesta: 'Sí, desde el panel de eSIM puedes recargar datos en cualquier momento. Selecciona "Recargar" y elige la cantidad de MB que deseas agregar.'
        }, {
            id: 7,
            categoria: 'comunidad',
            pregunta: '¿Cómo reporto contenido inapropiado?',
            respuesta: 'Usa el botón de reporte (🚩) en cada publicación o perfil. Nuestro equipo revisará el reporte y tomará las medidas necesarias.'
        }, {
            id: 8,
            categoria: 'comunidad',
            pregunta: '¿Puedo bloquear a otro usuario?',
            respuesta: 'Sí, desde el perfil de cualquier usuario puedes seleccionar "Bloquear". Esto impedirá que interactúen contigo y ocultará su contenido.'
        }, {
            id: 9,
            categoria: 'pagos',
            pregunta: '¿Qué métodos de pago aceptan?',
            respuesta: 'Aceptamos tarjetas de crédito/débito (Visa, Mastercard), PayPal y criptomonedas (BTC, ETH). Todos los pagos son seguros y encriptados.'
        }, {
            id: 10,
            categoria: 'pagos',
            pregunta: '¿Cómo cancelo mi suscripción Premium?',
            respuesta: 'Ve a Configuración > Premium y selecciona "Cancelar suscripción". Tu suscripción seguirá activa hasta el final del período facturado.'
        }];

        // ================================================================
        // 🖥️ RENDERIZAR FAQ
        // ================================================================
        function renderFaq() {
            const container = document.getElementById('faqContainer');
            const noEncontrado = document.getElementById('noEncontrado');
            const busqueda = document.getElementById('buscarFaq').value.toLowerCase();

            let filtrados = [...faqs];

            // Filtrar por categoría
            if (categoriaActual !== 'todas') {
                filtrados = filtrados.filter(f => f.categoria === categoriaActual);
            }

            // Filtrar por búsqueda
            if (busqueda) {
                filtrados = filtrados.filter(f =>
                    f.pregunta.toLowerCase().includes(busqueda) ||
                    f.respuesta.toLowerCase().includes(busqueda)
                );
            }

            if (filtrados.length === 0) {
                container.innerHTML = '';
                noEncontrado.style.display = 'block';
                return;
            }

            noEncontrado.style.display = 'none';

            container.innerHTML = filtrados.map(f => `
                <div class="faq-item" data-categoria="${f.categoria}">
                    <div class="pregunta" onclick="toggleFaq(${f.id})">
                        <span class="icono"><i class="fas fa-question-circle"></i></span>
                        <span class="texto">${f.pregunta}</span>
                        <span class="toggle-icon" id="faq-icon-${f.id}"><i class="fas fa-chevron-down"></i></span>
                    </div>
                    <div class="respuesta" id="faq-respuesta-${f.id}">
                        ${f.respuesta}
                    </div>
                </div>
            `).join('');
        }

        // ================================================================
        // 🔍 FILTROS Y BÚSQUEDA
        // ================================================================
        function filtrarFaq() {
            renderFaq();
        }

        function filtrarCategoria(cat) {
            categoriaActual = cat;
            document.querySelectorAll('.cat-faq-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`.cat-faq-btn[data-cat="${cat}"]`).classList.add('active');
            renderFaq();
        }

        // ================================================================
        // 🎯 ACCIONES
        // ================================================================
        function toggleFaq(id) {
            const respuesta = document.getElementById(`faq-respuesta-${id}`);
            const icono = document.getElementById(`faq-icon-${id}`);
            if (respuesta) {
                respuesta.classList.toggle('open');
                if (icono) {
                    icono.classList.toggle('rotated');
                }
            }
        }

        // ================================================================
        // 🔔 TOAST
        // ================================================================
        let toastTimeout;

        function mostrarToast(mensaje, tipo = '') {
            const toast = document.getElementById('toast');
            toast.textContent = mensaje;
            toast.className = 'toast active';
            if (tipo === 'error') toast.classList.add('error');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.remove('active'), 3000);
        }

        // ================================================================
        // 🚀 INICIALIZAR
        // ================================================================
        document.addEventListener('DOMContentLoaded', () => {
            aplicarIdioma(idiomaActual);
            renderFaq();
            console.log('❓ Csariel\'s - Preguntas Frecuentes cargado');
        });

        // Exponer funciones globales
        window.cambiarIdioma = cambiarIdioma;
        window.filtrarFaq = filtrarFaq;
        window.filtrarCategoria = filtrarCategoria;
        window.toggleFaq = toggleFaq;
        window.mostrarToast = mostrarToast;
    </script>
</body>
</html>
