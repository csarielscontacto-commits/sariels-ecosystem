<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Publicaciones | Csariel's</title>
    <meta name="theme-color" content="#0F2D1A" />

    <!-- ===== RECURSOS ===== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet" />

    <style>
        /* ================================================================
           ESTILOS CSARIEL'S - PUBLICACIONES
           ================================================================ */
        :root {
            --space-deep: #05080f;
            --space-mid: #0a1428;
            --verde-bosque: #0F2D1A;
            --verde-bosque-light: #1a4a2a;
            --gold-cosmic: #D4AF37;
            --gold-dim: rgba(212,175,55,0.15);
            --gold-glow: rgba(212,175,55,0.25);
            --text-primary: #e8f0f8;
            --text-secondary: #8ba3c7;
            --text-muted: #4a6a8a;
            --border: rgba(212,175,55,0.08);
            --border-glow: rgba(212,175,55,0.25);
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --success: #00b894;
            --danger: #ff3366;
            --warning: #D4AF37;
            --quantum: #00e5ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--space-deep);
            color: var(--text-primary);
            font-family: 'Space Grotesk', system-ui, sans-serif;
            min-height: 100vh;
        }

        #stars-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .nebula {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.10;
            pointer-events: none;
            z-index: 0;
            animation: nebula-drift 25s ease-in-out infinite alternate;
        }
        .nebula-1 {
            width: 700px;
            height: 700px;
            background: var(--verde-bosque);
            top: -15%;
            right: -15%;
        }
        .nebula-2 {
            width: 600px;
            height: 600px;
            background: var(--gold-cosmic);
            bottom: -15%;
            left: -15%;
            animation-delay: -8s;
            opacity: 0.05;
        }
        .nebula-3 {
            width: 500px;
            height: 500px;
            background: var(--quantum);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -15s;
            opacity: 0.04;
        }

        @keyframes nebula-drift {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(40px, -30px) scale(1.15);
            }
        }

        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: var(--space-deep);
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(var(--gold-cosmic), var(--verde-bosque));
            border-radius: 3px;
        }

        .app {
            position: relative;
            z-index: 1;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px 20px 30px;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0 16px;
            border-bottom: 2px solid var(--gold-dim);
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
            backdrop-filter: blur(10px);
            position: relative;
        }
        .header::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-cosmic), var(--verde-bosque), var(--gold-cosmic), transparent);
            opacity: 0.4;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        .logo-icon {
            font-size: 2rem;
            filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.2));
            animation: pulse-glow 3s ease-in-out infinite;
        }
        .logo-icon .hex {
            display: inline-block;
            background: var(--verde-bosque);
            color: var(--gold-cosmic);
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 900;
            border: 2px solid var(--gold-cosmic);
            font-family: 'Orbitron', monospace;
        }
        @keyframes pulse-glow {
            0%,
            100% {
                filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.2));
            }
            50% {
                filter: drop-shadow(0 0 40px rgba(212, 175, 55, 0.4));
            }
        }

        .logo-text {
            font-family: 'Orbitron', monospace;
            font-size: 1.3rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--gold-cosmic), var(--verde-bosque-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo-badge {
            font-family: 'Orbitron', monospace;
            font-size: 0.45rem;
            background: linear-gradient(135deg, var(--verde-bosque), var(--gold-cosmic));
            color: white;
            padding: 3px 12px;
            border-radius: 20px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            -webkit-text-fill-color: white;
            border: 1px solid rgba(212, 175, 55, 0.2);
            animation: badge-pulse 2s ease-in-out infinite;
        }
        @keyframes badge-pulse {
            0%,
            100% {
                box-shadow: 0 0 30px rgba(15, 45, 26, 0.3);
            }
            50% {
                box-shadow: 0 0 60px rgba(212, 175, 55, 0.2);
            }
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 16px;
            border: 1px solid var(--border);
            border-radius: 30px;
            background: rgba(212, 175, 55, 0.03);
            color: var(--text-primary);
            font-family: 'Orbitron', monospace;
            font-size: 0.6rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
        }
        .btn:hover {
            transform: scale(1.02);
            border-color: var(--border-glow);
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--verde-bosque), var(--verde-bosque-light));
            border-color: var(--gold-cosmic);
            color: var(--gold-cosmic);
            -webkit-text-fill-color: var(--gold-cosmic);
        }
        .btn-primary:hover:not(:disabled) {
            background: linear-gradient(135deg, var(--verde-bosque-light), var(--verde-bosque));
            box-shadow: 0 0 40px rgba(15, 45, 26, 0.5);
        }
        .btn-gold {
            background: linear-gradient(135deg, var(--gold-cosmic), #b8923a);
            border-color: transparent;
            color: #0a0c10;
            -webkit-text-fill-color: #0a0c10;
        }
        .btn-gold:hover:not(:disabled) {
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.3);
        }
        .btn-outline {
            border-color: var(--border);
            background: transparent;
        }
        .btn-outline:hover:not(:disabled) {
            background: rgba(212, 175, 55, 0.05);
            border-color: var(--gold-cosmic);
        }
        .btn-sm {
            padding: 4px 12px;
            font-size: 0.55rem;
        }
        .btn-success {
            background: rgba(0, 184, 148, 0.15);
            border-color: rgba(0, 184, 148, 0.3);
            color: var(--success);
        }
        .btn-success:hover:not(:disabled) {
            background: rgba(0, 184, 148, 0.25);
        }
        .btn-danger {
            background: rgba(255, 51, 102, 0.15);
            border-color: rgba(255, 51, 102, 0.3);
            color: var(--danger);
        }
        .btn-danger:hover:not(:disabled) {
            background: rgba(255, 51, 102, 0.25);
        }

        .language-selector {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            background: rgba(212, 175, 55, 0.03);
            border-radius: 16px;
            border: 1px solid rgba(212, 175, 55, 0.08);
        }
        .language-selector .lang-icon {
            font-size: 0.7rem;
            margin-right: 2px;
        }
        .lang-btn {
            padding: 2px 8px;
            border-radius: 10px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-muted);
            font-family: 'Orbitron', monospace;
            font-size: 0.45rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .lang-btn:hover {
            color: var(--text-secondary);
            background: rgba(212, 175, 55, 0.05);
        }
        .lang-btn.active {
            border-color: var(--gold-cosmic);
            background: rgba(212, 175, 55, 0.1);
            color: var(--gold-cosmic);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(212, 175, 55, 0.06);
            border: 1px solid rgba(212, 175, 55, 0.15);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.6rem;
            color: var(--gold-cosmic);
            font-family: 'Orbitron', monospace;
            backdrop-filter: blur(10px);
        }
        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            animation: quantum-pulse 1.5s ease-in-out infinite;
        }
        .status-dot.online {
            background: var(--success);
            box-shadow: 0 0 20px rgba(0, 184, 148, 0.5);
        }
        @keyframes quantum-pulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(0.7);
            }
        }

        /* ===== CREAR PUBLICACIÓN ===== */
        .crear-publicacion {
            background: rgba(15, 45, 26, 0.15);
            border: 1px solid var(--gold-dim);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 16px;
        }
        .crear-publicacion .input-area {
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }
        .crear-publicacion .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--verde-bosque), var(--gold-cosmic));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: white;
            font-size: 0.8rem;
            flex-shrink: 0;
        }
        .crear-publicacion textarea {
            flex: 1;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--gold-dim);
            border-radius: 12px;
            padding: 10px 14px;
            color: var(--text-primary);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.75rem;
            resize: vertical;
            min-height: 60px;
            outline: none;
            transition: var(--transition);
        }
        .crear-publicacion textarea:focus {
            border-color: var(--gold-cosmic);
        }
        .crear-publicacion textarea::placeholder {
            color: var(--text-muted);
        }
        .crear-publicacion .acciones {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .crear-publicacion .acciones .botones-adjuntos {
            display: flex;
            gap: 6px;
        }
        .crear-publicacion .acciones .botones-adjuntos .btn {
            padding: 4px 10px;
            font-size: 0.5rem;
        }

        /* ===== PUBLICACIONES ===== */
        .publicacion {
            background: rgba(15, 45, 26, 0.15);
            border: 1px solid var(--gold-dim);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 12px;
            transition: var(--transition);
        }
        .publicacion:hover {
            border-color: var(--border-glow);
        }

        .pub-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }
        .pub-header .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--verde-bosque), var(--gold-cosmic));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: white;
            font-size: 0.8rem;
            flex-shrink: 0;
            cursor: pointer;
        }
        .pub-header .info {
            flex: 1;
        }
        .pub-header .info .nombre {
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--text-primary);
            cursor: pointer;
        }
        .pub-header .info .nombre:hover {
            color: var(--gold-cosmic);
        }
        .pub-header .info .meta {
            font-size: 0.5rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .pub-header .info .meta .privacidad {
            font-size: 0.4rem;
            padding: 1px 8px;
            border-radius: 10px;
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid var(--gold-dim);
        }
        .pub-header .menu-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.9rem;
            padding: 4px;
            transition: var(--transition);
        }
        .pub-header .menu-btn:hover {
            color: var(--text-primary);
        }

        .pub-contenido {
            color: var(--text-secondary);
            font-size: 0.8rem;
            line-height: 1.6;
            margin: 4px 0 10px;
        }
        .pub-contenido img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 8px;
            border: 1px solid var(--gold-dim);
        }

        .pub-adjuntos {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin: 6px 0 10px;
        }
        .pub-adjuntos .adjunto {
            background: rgba(15, 45, 26, 0.2);
            border: 1px solid var(--gold-dim);
            border-radius: 8px;
            padding: 4px 10px;
            font-size: 0.5rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .pub-adjuntos .adjunto i {
            color: var(--gold-cosmic);
        }

        .pub-acciones {
            display: flex;
            gap: 16px;
            padding-top: 10px;
            border-top: 1px solid var(--gold-dim);
            flex-wrap: wrap;
        }
        .pub-acciones button {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.6rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .pub-acciones button:hover {
            color: var(--text-primary);
        }
        .pub-acciones button.liked {
            color: var(--danger);
        }
        .pub-acciones button .icono {
            font-size: 0.7rem;
        }

        .pub-comentarios {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--gold-dim);
        }
        .pub-comentarios .comentario {
            display: flex;
            gap: 8px;
            padding: 6px 0;
            font-size: 0.65rem;
        }
        .pub-comentarios .comentario .c-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--verde-bosque), var(--gold-cosmic));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: white;
            font-size: 0.5rem;
            flex-shrink: 0;
        }
        .pub-comentarios .comentario .c-texto {
            color: var(--text-secondary);
            flex: 1;
        }
        .pub-comentarios .comentario .c-texto .c-nombre {
            color: var(--text-primary);
            font-weight: 600;
        }
        .pub-comentarios .comentario .c-texto .c-hora {
            font-size: 0.4rem;
            color: var(--text-muted);
            margin-left: 4px;
        }
        .pub-comentarios .input-comentario {
            display: flex;
            gap: 6px;
            margin-top: 6px;
        }
        .pub-comentarios .input-comentario input {
            flex: 1;
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid var(--gold-dim);
            background: rgba(0, 0, 0, 0.2);
            color: var(--text-primary);
            font-size: 0.6rem;
            outline: none;
            font-family: 'Space Grotesk', sans-serif;
        }
        .pub-comentarios .input-comentario input:focus {
            border-color: var(--gold-cosmic);
        }
        .pub-comentarios .input-comentario input::placeholder {
            color: var(--text-muted);
        }
        .pub-comentarios .input-comentario .btn {
            padding: 4px 12px;
            font-size: 0.5rem;
            border-radius: 20px;
        }

        /* ===== FOOTER ===== */
        .footer {
            margin-top: 24px;
            padding-top: 14px;
            border-top: 1px solid var(--gold-dim);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            position: relative;
        }
        .footer::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-cosmic), transparent);
            opacity: 0.2;
        }
        .footer-text {
            color: var(--text-muted);
            font-size: 0.5rem;
            letter-spacing: 0.5px;
            font-family: 'Orbitron', monospace;
        }
        .footer-text .brand {
            color: var(--gold-cosmic);
        }
        .footer-links {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.5rem;
            transition: var(--transition);
            font-family: 'Orbitron', monospace;
            letter-spacing: 0.5px;
        }
        .footer-links a:hover {
            color: var(--gold-cosmic);
        }
        .footer-hex {
            display: inline-block;
            background: var(--verde-bosque);
            color: var(--gold-cosmic);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.45rem;
            font-weight: 700;
            border: 1px solid var(--gold-cosmic);
            font-family: 'Orbitron', monospace;
        }

        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--verde-bosque);
            color: var(--gold-cosmic);
            padding: 10px 20px;
            border-radius: var(--radius);
            font-weight: 600;
            font-size: 0.7rem;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 5000;
            pointer-events: none;
            font-family: 'Orbitron', monospace;
            border: 1px solid rgba(212, 175, 55, 0.15);
            max-width: 90%;
            text-align: center;
        }
        .toast.active {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.error {
            background: var(--danger);
            color: white;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            .header-actions {
                width: 100%;
                justify-content: flex-start;
                flex-wrap: wrap;
            }
            .crear-publicacion .acciones {
                flex-direction: column;
                align-items: stretch;
            }
            .crear-publicacion .acciones .botones-adjuntos {
                justify-content: center;
            }
            .pub-acciones {
                gap: 10px;
            }
        }

        @media (max-width: 480px) {
            .btn {
                font-size: 0.45rem;
                padding: 4px 8px;
            }
            .crear-publicacion .avatar {
                width: 32px;
                height: 32px;
                font-size: 0.6rem;
            }
            .crear-publicacion textarea {
                font-size: 0.65rem;
                min-height: 50px;
            }
            .pub-header .avatar {
                width: 32px;
                height: 32px;
                font-size: 0.6rem;
            }
            .pub-contenido {
                font-size: 0.7rem;
            }
            .pub-acciones button {
                font-size: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- ===== FONDO ESTELAR ===== -->
    <canvas id="stars-canvas"></canvas>
    <div class="nebula nebula-1"></div>
    <div class="nebula nebula-2"></div>
    <div class="nebula nebula-3"></div>

    <div class="app">

        <!-- ===== HEADER ===== -->
        <header class="header">
            <a href="../index.html" class="logo">
                <span class="logo-icon"><span class="hex">◈</span></span>
                <span class="logo-text">Csariel's</span>
                <span class="logo-badge">Publicaciones</span>
            </a>
            <div class="header-actions">
                <div class="language-selector">
                    <span class="lang-icon">🌐</span>
                    <button class="lang-btn active" onclick="cambiarIdioma('es')">ES</button>
                    <button class="lang-btn" onclick="cambiarIdioma('en')">EN</button>
                    <button class="lang-btn" onclick="cambiarIdioma('fr')">FR</button>
                </div>

                <div class="status-badge">
                    <span class="status-dot online"></span>
                    <span>En línea</span>
                </div>

                <a href="../index.html" class="btn btn-outline btn-sm">
                    <i class="fas fa-arrow-left"></i> Volver
                </a>
                <a href="../notificaciones/index.html" class="btn btn-outline btn-sm">
                    <i class="fas fa-bell"></i>
                </a>
            </div>
        </header>

        <!-- ===== CREAR PUBLICACIÓN ===== -->
        <div class="crear-publicacion">
            <div class="input-area">
                <div class="avatar">C</div>
                <textarea id="nuevaPub" placeholder="¿Qué estás pensando? Comparte con la comunidad..." rows="2"></textarea>
            </div>
            <div class="acciones">
                <div class="botones-adjuntos">

    <script>
        // ================================================================
        // 🌟 ESTRELLAS

        (function initStars() {
            const canvas = document.getElementById('stars-canvas');
            const ctx = canvas.getContext('2d');
            let w, h;

            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }
            resize();

            const stars = Array.from({ length: 200 }, () => ({
                x: Math.random() * w,
                y: Math.random() * h,
                r: Math.random() * 0.8 + 0.2,
                o: Math.random() * 0.8 + 0.2,
                speed: Math.random() * 0.005 + 0.002,
                phase: Math.random() * Math.PI * 2
            }));

            function draw() {
                ctx.clearRect(0, 0, w, h);
                stars.forEach(s => {
                    const opacity = s.o * (0.6 + 0.4 * Math.sin(s.phase));
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, 2 * Math.PI);
                    ctx.fillStyle = `rgba(255,255,255,${opacity})`;
                    ctx.fill();
                    s.y += s.speed;
                    s.phase += 0.01;
                    if (s.y > h) { s.y = 0;
                        s.x = Math.random() * w; }
                });
                requestAnimationFrame(draw);
            }
            draw();

            window.addEventListener('resize', () => {
                resize();
                stars.forEach(s => { s.x = Math.random() * w;
                    s.y = Math.random() * h; });
            });
        })();

        // ================================================================
        // 🌐 IDIOMAS
        // ================================================================
        const traducciones = {
            es: {
                'publicaciones': 'Publicaciones',
                'en_linea': 'En línea',
                'volver': 'Volver',
                'que_piensas': '¿Qué estás pensando? Comparte con la comunidad...',
                'imagen': 'Imagen',
                'enlace': 'Enlace',
                'emoji': 'Emoji',
                'publicar': 'Publicar',
                'comentar': 'Comentar',
                'compartir': 'Compartir',
                'escribe_comentario': 'Escribe un comentario...',
                'publicado': '✅ Publicación creada',
                'adjuntar_imagen': '🖼️ Adjuntar imagen (próximamente)',
                'adjuntar_enlace': '🔗 Adjuntar enlace (próximamente)',
                'adjuntar_emoji': '😊 Adjuntar emoji (próximamente)',
                'hace': 'hace'
            },
            en: {
                'publicaciones': 'Posts',

                'volver': 'Back',
                'que_piensas': 'What are you thinking? Share with the community...',

                'emoji': 'Emoji',

                'comentar': 'Comment',
                'compartir': 'Share',

                'publicado': '✅ Post created',
                'adjuntar_imagen': '🖼️ Attach image (coming soon)',
                'adjuntar_enlace': '🔗 Attach link (coming soon)',
                'adjuntar_emoji': '😊 Attach emoji (coming soon)',
                'hace': 'ago'
            },
            fr: {
                'publicaciones': 'Publications',
                'en_linea': 'En ligne',
                'volver': 'Retour',
                'que_piensas': 'À quoi pensez-vous? Partagez avec la communauté...',
                'imagen': 'Image',
                'enlace': 'Lien',
                'emoji': 'Émoji',
                'publicar': 'Publier',
                'comentar': 'Commenter',
                'compartir': 'Partager',
                'escribe_comentario': 'Écrire un commentaire...',
                'publicado': '✅ Publication créée',

                'adjuntar_enlace': '🔗 Joindre un lien (bientôt)',
                'adjuntar_emoji': '😊 Joindre un émoji (bientôt)',
                'hace': 'il y a'
            }
        };

        let idiomaActual = localStorage.getItem('csariels_idioma') || 'es';
        let publicaciones = [];
        let nextId = 1;

        function aplicarIdioma(idioma) {
            const t = traducciones[idioma] || traducciones.es;
            document.querySelector('.logo-badge').textContent = t.publicaciones;
            document.querySelector('.status-badge span:last-child').textContent = t.en_linea;
            document.querySelector('.crear-publicacion textarea').placeholder = t.que_piensas;

            document.querySelectorAll('.botones-adjuntos .btn').forEach((btn, i) => {
                const textos = [t.imagen, t.enlace, t.emoji];
                if (i < 3) {
                    const iconos = ['fa-image', 'fa-link', 'fa-smile'];
                    btn.innerHTML = `<i class="fas ${iconos[i]}"></i> ${textos[i]}`;
                }
            });

            document.querySelector('.crear-publicacion .btn-primary').innerHTML =
                `<i class="fas fa-paper-plane"></i> ${t.publicar}`;
        }

        function cambiarIdioma(idioma) {
            idiomaActual = idioma;
            localStorage.setItem('csariels_idioma', idioma);
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`.lang-btn[onclick="cambiarIdioma('${idioma}')"]`).classList.add('active');
            aplicarIdioma(idioma);
            renderPublicaciones();
            mostrarToast(`🌐 ${idioma.toUpperCase()}`);
        }

        // ================================================================
        // 📋 DATOS INICIALES
        // ================================================================
        function initPublicaciones() {
            const t = traducciones[idiomaActual] || traducciones.es;
            publicaciones = [{
                id: nextId++,
                autor: 'Csariel',
                avatar: 'C',
                contenido: '🚀 ¡Bienvenidos a la sección de Publicaciones! Comparte tus ideas, proyectos y momentos con la comunidad. 🌟',
                imagen: null,
                fecha: new Date(Date.now() - 120000),
                likes: 24,
                comentarios: [
                    { autor: 'María', avatar: 'M', texto: '¡Excelente iniciativa!', fecha: new Date(Date.now() -
                            60000) },
                    { autor: 'Javier', avatar: 'J', texto: 'Me encanta esta comunidad 🚀', fecha: new Date(Date
                            .now() - 30000) }
                ],
                liked: false
            }, {
                id: nextId++,
                autor: 'María',
                avatar: 'M',
                contenido: '🎉 ¡Acabo de lanzar mi nuevo proyecto! Estoy muy emocionada de compartirlo con todos. ¿Qué opinan?',
                imagen: null,
                fecha: new Date(Date.now() - 3600000),
                likes: 18,
                comentarios: [
                    { autor: 'Csariel', avatar: 'C', texto: '¡Felicidades María! Se ve increíble 💪', fecha: new Date(
                            Date.now() - 1800000) }
                ],
                liked: false
            }, {
                id: nextId++,
                autor: 'Javier',
                avatar: 'J',
                contenido: '🌌 Explorando nuevas fronteras en el mundo de la tecnología. ¿Alguien más está trabajando en algo interesante?',
                imagen: null,
                fecha: new Date(Date.now() - 7200000),
                likes: 12,
                comentarios: [],
                liked: false
            }];
        }

        // ================================================================
        // 🖥️ RENDERIZAR PUBLICACIONES
        // ================================================================
        function renderPublicaciones() {
            const container = document.getElementById('publicacionesContainer');
            const t = traducciones[idiomaActual] || traducciones.es;

            if (publicaciones.length === 0) {
                container.innerHTML = `
                    <div style="text-align:center;padding:40px 20px;color:var(--text-muted);">
                        <div style="font-size:3rem;opacity:0.3;margin-bottom:8px;">📝</div>
                        <h3 style="font-family:'Orbitron',monospace;font-size:0.85rem;color:var(--text-secondary);">Sin publicaciones</h3>
                        <p style="font-size:0.65rem;">Sé el primero en compartir algo con la comunidad.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = publicaciones.map(p => {
                const tiempo = calcularTiempo(p.fecha, t);
                const likes = p.likes || 0;
                const comentarios = p.comentarios || [];

                return `
                    <div class="publicacion" data-id="${p.id}">
                        <div class="pub-header">
                            <div class="avatar" onclick="verPerfil('${p.autor}')">${p.avatar}</div>
                            <div class="info">
                                <div class="nombre" onclick="verPerfil('${p.autor}')">${p.autor}</div>
                                <div class="meta">
                                    <span>${tiempo}</span>
                                    <span class="privacidad"><i class="fas fa-globe"></i> Público</span>
                                </div>
                            </div>
                            <button class="menu-btn" onclick="mostrarOpciones(${p.id})">
                                <i class="fas fa-ellipsis-v"></i>
                            </button>
                        </div>

                        <div class="pub-contenido">
                            ${p.contenido}
                            ${p.imagen ? `<img src="${p.imagen}" alt="Imagen de publicación" />` : ''}
                        </div>

                        <div class="pub-acciones">
                            <button onclick="toggleLike(${p.id})" class="${p.liked ? 'liked' : ''}">
                                <span class="icono"><i class="fas fa-heart"></i></span>
                                <span>${likes}</span>
                            </button>
                            <button onclick="toggleComentarios(${p.id})">
                                <span class="icono"><i class="fas fa-comment"></i></span>
                                <span>${comentarios.length}</span>
                            </button>
                            <button onclick="compartirPublicacion(${p.id})">
                                <span class="icono"><i class="fas fa-share"></i></span>
                                ${t.compartir}
                            </button>
                        </div>

                        <div class="pub-comentarios" id="comentarios-${p.id}" style="display:${p.mostrarComentarios ? 'block' : 'none'}">
                            ${comentarios.map(c => `
                                <div class="comentario">
                                    <div class="c-avatar">${c.avatar}</div>
                                    <div class="c-texto">
                                        <span class="c-nombre">${c.autor}</span>
                                        ${c.texto}
                                        <span class="c-hora">${calcularTiempo(c.fecha, t)}</span>
                                    </div>
                                </div>
                            `).join('')}
                            <div class="input-comentario">
                                <input type="text" id="inputComentario-${p.id}" placeholder="${t.escribe_comentario}" />
                                <button class="btn btn-primary btn-sm" onclick="agregarComentario(${p.id})">
                                    <i class="fas fa-paper-plane"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ================================================================
        // 🎯 FUNCIONES
        // ================================================================
        function calcularTiempo(fecha, t) {
            const diff = Date.now() - fecha.getTime();
            const minutos = Math.floor(diff / 60000);
            const horas = Math.floor(diff / 3600000);
            const dias = Math.floor(diff / 86400000);

            if (minutos < 1) return 'Ahora';
            if (minutos < 60) return `${minutos} ${t.hace || 'minutos'}`;
            if (horas < 24) return `${horas} ${t.hace || 'horas'}`;
            if (dias < 7) return `${dias} ${t.hace || 'días'}`;
            return fecha.toLocaleDateString();
        }

        function publicar() {
            const textarea = document.getElementById('nuevaPub');
            const texto = textarea.value.trim();
            if (!texto) {
                mostrarToast('⚠️ Escribe algo para publicar', 'error');
                return;
            }

            const t = traducciones[idiomaActual] || traducciones.es;
            const nuevaPub = {
                id: nextId++,
                autor: 'Csariel',
                avatar: 'C',
                contenido: texto,
                imagen: null,
                fecha: new Date(),
                likes: 0,
                comentarios: [],
                liked: false,
                mostrarComentarios: false
            };

            publicaciones.unshift(nuevaPub);
            textarea.value = '';
            renderPublicaciones();
            mostrarToast(t.publicado);
        }

        function toggleLike(id) {
            const pub = publicaciones.find(p => p.id === id);
            if (!pub) return;
            pub.liked = !pub.liked;
            pub.likes += pub.liked ? 1 : -1;
            renderPublicaciones();
        }

        function toggleComentarios(id) {
            const pub = publicaciones.find(p => p.id === id);
            if (!pub) return;
            pub.mostrarComentarios = !pub.mostrarComentarios;
            renderPublicaciones();
            if (pub.mostrarComentarios) {
                setTimeout(() => {
                    const input = document.getElementById(`inputComentario-${id}`);
                    if (input) input.focus();
                }, 100);
            }
        }

        function agregarComentario(id) {
            const input = document.getElementById(`inputComentario-${id}`);
            const texto = input.value.trim();
            if (!texto) return;

            const pub = publicaciones.find(p => p.id === id);
            if (!pub) return;

            pub.comentarios.push({
                autor: 'Csariel',
                avatar: 'C',
                texto: texto,
                fecha: new Date()
            });

            input.value = '';
            renderPublicaciones();
        }

        function compartirPublicacion(id) {
            const pub = publicaciones.find(p => p.id === id);
            if (!pub) return;
            if (navigator.share) {
                navigator.share({
                    title: 'Publicación de Csariel\'s',
                    text: pub.contenido,
                }).catch(() => {});
            } else {
                const t = traducciones[idiomaActual] || traducciones.es;
                mostrarToast(`📤 ${t.compartir}`);
            }
        }

        function mostrarOpciones(id) {
            const t = traducciones[idiomaActual] || traducciones.es;
            const pub = publicaciones.find(p => p.id === id);
            if (!pub) return;
            if (confirm(`¿Eliminar esta publicación de ${pub.autor}?`)) {
                publicaciones = publicaciones.filter(p => p.id !== id);
                renderPublicaciones();
                mostrarToast('🗑️ Publicación eliminada');
            }
        }

        function verPerfil(autor) {
            mostrarToast(`👤 Perfil de ${autor}`);
            // window.location.href = `../perfil/index.html?user=${encodeURIComponent(autor)}`;
        }

        // ================================================================
        // 📎 ADJUNTOS
        // ================================================================
        function adjuntarImagen() {
            const t = traducciones[idiomaActual] || traducciones.es;
            mostrarToast(t.adjuntar_imagen);
        }

        function adjuntarEnlace() {
            const t = traducciones[idiomaActual] || traducciones.es;
            const link = prompt('🔗 Ingresa el enlace:');
            if (link) {
                const textarea = document.getElementById('nuevaPub');
                textarea.value += `\n${link}`;
                mostrarToast('✅ Enlace agregado');
            }
        }

        function adjuntarEmoji() {
            const t = traducciones[idiomaActual] || traducciones.es;
            const emojis = ['😊', '😂', '❤️', '🔥', '🚀', '💪', '🎉', '⭐', '🌈', '✨'];
            const seleccionado = prompt('Selecciona un emoji:\n' + emojis.join(' '));
            if (seleccionado && emojis.includes(seleccionado)) {
                const textarea = document.getElementById('nuevaPub');
                textarea.value += seleccionado;
            } else {
                mostrarToast(t.adjuntar_emoji);
            }
        }

        // ================================================================
        // 🔔 TOAST
        // ================================================================
        let toastTimeout;

        function mostrarToast(mensaje, tipo = '') {
            const toast = document.getElementById('toast');
            toast.textContent = mensaje;
            toast.className = 'toast active';
            if (tipo === 'error') toast.classList.add('error');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.remove('active'), 3000);
        }

        // ================================================================
        // 🚀 INICIALIZAR
        // ================================================================
        document.addEventListener('DOMContentLoaded', () => {
            aplicarIdioma(idiomaActual);
            initPublicaciones();
            renderPublicaciones();
            console.log('📝 Csariel\'s - Publicaciones cargado');
        });

        // Exponer funciones globales
        window.cambiarIdioma = cambiarIdioma;
        window.publicar = publicar;
        window.toggleLike = toggleLike;
        window.toggleComentarios = toggleComentarios;
        window.agregarComentario = agregarComentario;
        window.compartirPublicacion = compartirPublicacion;
        window.mostrarOpciones = mostrarOpciones;
        window.verPerfil = verPerfil;
        window.adjuntarImagen = adjuntarImagen;
        window.adjuntarEnlace = adjuntarEnlace;
        window.adjuntarEmoji = adjuntarEmoji;
        window.mostrarToast = mostrarToast;
    </script>
