<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logros | Csariel's</title>
    <meta name="theme-color" content="#0F2D1A" />

    <!-- ===== RECURSOS ===== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet" />

    <style>
        /* ================================================================
           ESTILOS CSARIEL'S - LOGROS
           ================================================================ */
        :root {
            --space-deep: #05080f;
            --space-mid: #0a1428;
            --verde-bosque: #0F2D1A;
            --verde-bosque-light: #1a4a2a;
            --gold-cosmic: #D4AF37;
            --gold-dim: rgba(212,175,55,0.15);
            --gold-glow: rgba(212,175,55,0.25);
            --text-primary: #e8f0f8;
            --text-secondary: #8ba3c7;
            --text-muted: #4a6a8a;
            --border: rgba(212,175,55,0.08);
            --border-glow: rgba(212,175,55,0.25);
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --success: #00b894;
            --danger: #ff3366;
            --warning: #D4AF37;
            --quantum: #00e5ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--space-deep);
            color: var(--text-primary);
            font-family: 'Space Grotesk', system-ui, sans-serif;
            min-height: 100vh;
        }

        #stars-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .nebula {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.10;
            pointer-events: none;
            z-index: 0;
            animation: nebula-drift 25s ease-in-out infinite alternate;
        }
        .nebula-1 {
            width: 700px;
            height: 700px;
            background: var(--verde-bosque);
            top: -15%;
            right: -15%;
        }
        .nebula-2 {
            width: 600px;
            height: 600px;
            background: var(--gold-cosmic);
            bottom: -15%;
            left: -15%;
            animation-delay: -8s;
            opacity: 0.05;
        }
        .nebula-3 {
            width: 500px;
            height: 500px;
            background: var(--quantum);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -15s;
            opacity: 0.04;
        }

        @keyframes nebula-drift {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(40px, -30px) scale(1.15);
            }
        }

        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: var(--space-deep);
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(var(--gold-cosmic), var(--verde-bosque));
            border-radius: 3px;
        }

        .app {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 16px 20px 30px;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0 16px;
            border-bottom: 2px solid var(--gold-dim);
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
            backdrop-filter: blur(10px);
            position: relative;
        }
        .header::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-cosmic), var(--verde-bosque), var(--gold-cosmic), transparent);
            opacity: 0.4;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        .logo-icon {
            font-size: 2rem;
            filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.2));
            animation: pulse-glow 3s ease-in-out infinite;
        }
        .logo-icon .hex {
            display: inline-block;
            background: var(--verde-bosque);
            color: var(--gold-cosmic);
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 900;
            border: 2px solid var(--gold-cosmic);
            font-family: 'Orbitron', monospace;
        }
        @keyframes pulse-glow {
            0%,
            100% {
                filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.2));
            }
            50% {
                filter: drop-shadow(0 0 40px rgba(212, 175, 55, 0.4));
            }
        }

        .logo-text {
            font-family: 'Orbitron', monospace;
            font-size: 1.3rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--gold-cosmic), var(--verde-bosque-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo-badge {
            font-family: 'Orbitron', monospace;
            font-size: 0.45rem;
            background: linear-gradient(135deg, var(--verde-bosque), var(--gold-cosmic));
            color: white;
            padding: 3px 12px;
            border-radius: 20px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            -webkit-text-fill-color: white;
            border: 1px solid rgba(212, 175, 55, 0.2);
            animation: badge-pulse 2s ease-in-out infinite;
        }
        @keyframes badge-pulse {
            0%,
            100% {
                box-shadow: 0 0 30px rgba(15, 45, 26, 0.3);
            }
            50% {
                box-shadow: 0 0 60px rgba(212, 175, 55, 0.2);
            }
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 16px;
            border: 1px solid var(--border);
            border-radius: 30px;
            background: rgba(212, 175, 55, 0.03);
            color: var(--text-primary);
            font-family: 'Orbitron', monospace;
            font-size: 0.6rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
        }
        .btn:hover {
            transform: scale(1.02);
            border-color: var(--border-glow);
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--verde-bosque), var(--verde-bosque-light));
            border-color: var(--gold-cosmic);
            color: var(--gold-cosmic);
            -webkit-text-fill-color: var(--gold-cosmic);
        }
        .btn-primary:hover:not(:disabled) {
            background: linear-gradient(135deg, var(--verde-bosque-light), var(--verde-bosque));
            box-shadow: 0 0 40px rgba(15, 45, 26, 0.5);
        }
        .btn-gold {
            background: linear-gradient(135deg, var(--gold-cosmic), #b8923a);
            border-color: transparent;
            color: #0a0c10;
            -webkit-text-fill-color: #0a0c10;
        }
        .btn-gold:hover:not(:disabled) {
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.3);
        }
        .btn-outline {
            border-color: var(--border);
            background: transparent;
        }
        .btn-outline:hover:not(:disabled) {
            background: rgba(212, 175, 55, 0.05);
            border-color: var(--gold-cosmic);
        }
        .btn-sm {
            padding: 4px 12px;
            font-size: 0.55rem;
        }
        .btn-success {
            background: rgba(0, 184, 148, 0.15);
            border-color: rgba(0, 184, 148, 0.3);
            color: var(--success);
        }
        .btn-success:hover:not(:disabled) {
            background: rgba(0, 184, 148, 0.25);
        }
        .btn-danger {
            background: rgba(255, 51, 102, 0.15);
            border-color: rgba(255, 51, 102, 0.3);
            color: var(--danger);
        }
        .btn-danger:hover:not(:disabled) {
            background: rgba(255, 51, 102, 0.25);
        }

        .language-selector {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            background: rgba(212, 175, 55, 0.03);
            border-radius: 16px;
            border: 1px solid rgba(212, 175, 55, 0.08);
        }
        .language-selector .lang-icon {
            font-size: 0.7rem;
            margin-right: 2px;
        }
        .lang-btn {
            padding: 2px 8px;
            border-radius: 10px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-muted);
            font-family: 'Orbitron', monospace;
            font-size: 0.45rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .lang-btn:hover {
            color: var(--text-secondary);
            background: rgba(212, 175, 55, 0.05);
        }
        .lang-btn.active {
            border-color: var(--gold-cosmic);
            background: rgba(212, 175, 55, 0.1);
            color: var(--gold-cosmic);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(212, 175, 55, 0.06);
            border: 1px solid rgba(212, 175, 55, 0.15);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.6rem;
            color: var(--gold-cosmic);
            font-family: 'Orbitron', monospace;
            backdrop-filter: blur(10px);
        }
        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            animation: quantum-pulse 1.5s ease-in-out infinite;
        }
        .status-dot.online {
            background: var(--success);
            box-shadow: 0 0 20px rgba(0, 184, 148, 0.5);
        }
        @keyframes quantum-pulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(0.7);
            }
        }

        /* ===== LOGROS ===== */
        .logros-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }
        .logros-header h2 {
            font-family: 'Orbitron', monospace;
            font-size: 1rem;
            color: var(--text-secondary);
        }
        .logros-header h2 i {
            color: var(--gold-cosmic);
        }

        .puntaje-general {
            background: rgba(15, 45, 26, 0.15);
            border: 1px solid var(--gold-dim);
            border-radius: var(--radius);
            padding: 14px 20px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .puntaje-general .nivel {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .puntaje-general .nivel .icono {
            font-size: 2rem;
        }
        .puntaje-general .nivel .info .titulo {
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--text-primary);
        }
        .puntaje-general .nivel .info .sub {
            font-size: 0.55rem;
            color: var(--text-muted);
        }
        .puntaje-general .puntos {
            text-align: right;
        }
        .puntaje-general .puntos .numero {
            font-family: 'Orbitron', monospace;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--gold-cosmic);
        }
        .puntaje-general .puntos .label {
            font-size: 0.5rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .logros-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
        }

        .logro-card {
            background: rgba(15, 45, 26, 0.1);
            border: 2px solid var(--gold-dim);
            border-radius: var(--radius);
            padding: 16px 12px;
            text-align: center;
            transition: var(--transition);
            position: relative;
        }
        .logro-card:hover {
            border-color: var(--border-glow);
            transform: translateY(-3px);
        }
        .logro-card.desbloqueado {
            border-color: var(--gold-cosmic);
            background: rgba(212, 175, 55, 0.05);
        }
        .logro-card.bloqueado {
            opacity: 0.4;
            filter: grayscale(0.8);
        }
        .logro-card .icono {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 4px;
        }
        .logro-card .nombre {
            font-weight: 600;
            font-size: 0.7rem;
            color: var(--text-primary);
        }
        .logro-card .descripcion {
            font-size: 0.5rem;
            color: var(--text-muted);
            margin: 4px 0 8px;
            line-height: 1.3;
        }
        .logro-card .progreso {
            width: 100%;
            height: 4px;
            background: var(--gold-dim);
            border-radius: 2px;
            overflow: hidden;
            margin: 6px 0;
        }
        .logro-card .progreso .fill {
            height: 100%;
            background: linear-gradient(90deg, var(--gold-cosmic), var(--quantum));
            border-radius: 2px;
            transition: width 0.5s;
        }
        .logro-card .porcentaje {
            font-size: 0.45rem;
            color: var(--text-muted);
            font-family: 'Orbitron', monospace;
        }
        .logro-card .badge-estado {
            position: absolute;
            top: 6px;
            right: 6px;
            font-size: 0.6rem;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            grid-column: 1/-1;
        }
        .empty-state .icon {
            font-size: 2.5rem;
            opacity: 0.3;
            margin-bottom: 6px;
        }
        .empty-state h3 {
            font-family: 'Orbitron', monospace;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        .empty-state p {
            font-size: 0.6rem;
        }

        /* ===== FOOTER ===== */
        .footer {
            margin-top: 24px;
            padding-top: 14px;
            border-top: 1px solid var(--gold-dim);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            position: relative;
        }
        .footer::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-cosmic), transparent);
            opacity: 0.2;
        }
        .footer-text {
            color: var(--text-muted);
            font-size: 0.5rem;
            letter-spacing: 0.5px;
            font-family: 'Orbitron', monospace;
        }
        .footer-text .brand {
            color: var(--gold-cosmic);
        }
        .footer-links {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.5rem;
            transition: var(--transition);
            font-family: 'Orbitron', monospace;
            letter-spacing: 0.5px;
        }
        .footer-links a:hover {
            color: var(--gold-cosmic);
        }
        .footer-hex {
            display: inline-block;
            background: var(--verde-bosque);
            color: var(--gold-cosmic);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.45rem;
            font-weight: 700;
            border: 1px solid var(--gold-cosmic);
            font-family: 'Orbitron', monospace;
        }

        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--verde-bosque);
            color: var(--gold-cosmic);
            padding: 10px 20px;
            border-radius: var(--radius);
            font-weight: 600;
            font-size: 0.7rem;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 5000;
            pointer-events: none;
            font-family: 'Orbitron', monospace;
            border: 1px solid rgba(212, 175, 55, 0.15);
            max-width: 90%;
            text-align: center;
        }
        .toast.active {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.error {
            background: var(--danger);
            color: white;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            .header-actions {
                width: 100%;
                justify-content: flex-start;
                flex-wrap: wrap;
            }
            .logros-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .puntaje-general {
                flex-direction: column;
                text-align: center;
            }
            .puntaje-general .puntos {
                text-align: center;
            }
        }

        @media (max-width: 480px) {
            .btn {
                font-size: 0.45rem;
                padding: 4px 8px;
            }
            .logros-grid {
                grid-template-columns: 1fr 1fr;
            }
            .logro-card .icono {
                font-size: 2rem;
            }
            .puntaje-general .puntos .numero {
                font-size: 1.2rem;
            }
        }
    </style>
</head>

    <script>
        // ================================================================
        // 🌟 ESTRELLAS
        // ================================================================
        (function initStars() {
            const canvas = document.getElementById('stars-canvas');
            const ctx = canvas.getContext('2d');
            let w, h;

            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }
            resize();

            const stars = Array.from({ length: 200 }, () => ({
                x: Math.random() * w,
                y: Math.random() * h,
                r: Math.random() * 0.8 + 0.2,
                o: Math.random() * 0.8 + 0.2,
                speed: Math.random() * 0.005 + 0.002,
                phase: Math.random() * Math.PI * 2
            }));

            function draw() {
                ctx.clearRect(0, 0, w, h);
                stars.forEach(s => {
                    const opacity = s.o * (0.6 + 0.4 * Math.sin(s.phase));
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, 2 * Math.PI);
                    ctx.fillStyle = `rgba(255,255,255,${opacity})`;
                    ctx.fill();
                    s.y += s.speed;
                    s.phase += 0.01;
                    if (s.y > h) { s.y = 0;
                        s.x = Math.random() * w; }
                });
                requestAnimationFrame(draw);
            }
            draw();

            window.addEventListener('resize', () => {
                resize();
                stars.forEach(s => { s.x = Math.random() * w;
                    s.y = Math.random() * h; });
            });
        })();

        // ================================================================
        // 🌐 IDIOMAS
        // ================================================================
        const traducciones = {

                'en_linea': 'En línea',

                'mis_logros': 'Mis Logros',
                'desbloqueados': 'de desbloqueados',
                'nivel': 'Nivel Explorador',
                'nivel_desc': 'Sigue participando para subir de nivel',
                'puntos': 'Puntos de experiencia',
                'desbloqueado': '✅ Desbloqueado',
                'bloqueado': '🔒 Bloqueado',
                'progreso': 'Progreso'
            },
            en: {
                'logros': 'Achievements',
                'en_linea': 'Online',
                'volver': 'Back',
                'mis_logros': 'My Achievements',
                'desbloqueados': 'of unlocked',
                'nivel': 'Explorer Level',
                'nivel_desc': 'Keep participating to level up',
                'puntos': 'Experience points',
                'desbloqueado': '✅ Unlocked',
                'bloqueado': '🔒 Locked',
                'progreso': 'Progress'
            },
            fr: {
                'logros': 'Succès',
                'en_linea': 'En ligne',
                'volver': 'Retour',
                'mis_logros': 'Mes Succès',
                'desbloqueados': 'de débloqués',
                'nivel': 'Niveau Explorateur',
                'nivel_desc': 'Continuez à participer pour monter de niveau',
                'puntos': "Points d'expérience",

        let idiomaActual = localStorage.getItem('csariels_idioma') || 'es';

        function aplicarIdioma(idioma) {
            const t = traducciones[idioma] || traducciones.es;
            document.querySelector('.logo-badge').textContent = t.logros;
            document.querySelector('.status-badge span:last-child').textContent = t.en_linea;
            document.querySelector('.logros-header h2').innerHTML =
                `<i class="fas fa-trophy"></i> ${t.mis_logros}`;
            document.querySelector('.logros-header span').textContent =
                `5 ${t.desbloqueados}`;

            document.querySelector('.puntaje-general .nivel .info .titulo').textContent = t.nivel;
            document.querySelector('.puntaje-general .nivel .info .sub').textContent = t.nivel_desc;
            document.querySelector('.puntaje-general .puntos .label').textContent = t.puntos;
        }

        function cambiarIdioma(idioma) {
            idiomaActual = idioma;
            localStorage.setItem('csariels_idioma', idioma);
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`.lang-btn[onclick="cambiarIdioma('${idioma}')"]`).classList.add('active');
            aplicarIdioma(idioma);
            renderLogros();
            mostrarToast(`🌐 ${idioma.toUpperCase()}`);
        }

        // ================================================================
        // 📋 DATOS DE LOGROS
        // ================================================================
        let logros = [{
            id: 1,
            nombre: 'Explorador Inicial',
            icono: '🌱',
            descripcion: 'Completa tu perfil al 100%',
            desbloqueado: true,
            progreso: 100,

        }, {

            descripcion: 'Agrega 10 amigos',

            progreso: 100,

        }, {
            id: 3,
            nombre: 'Creador de Contenido',
            icono: '📝',
            descripcion: 'Publica 5 publicaciones',
            desbloqueado: true,
            progreso: 80,
            puntos: 200
        }, {
            id: 4,

            icono: '💬',

        }, {

        }, {

            icono: '⭐',

            desbloqueado: false,
            progreso: 80,
            puntos: 500
        }, {
            id: 8,
            nombre: 'Leyenda Csariel\'s',
            icono: '👑',
            descripcion: 'Completa todos los logros',
            desbloqueado: false,
            progreso: 25,
            puntos: 1000
        }];

        // ================================================================
        // 🖥️ RENDERIZAR LOGROS
        // ================================================================
        function renderLogros() {
            const grid = document.getElementById('logrosGrid');
            const t = traducciones[idiomaActual] || traducciones.es;

            if (logros.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">🏆</div>
                        <h3>Sin logros</h3>
                        <p>Comienza a participar para desbloquear logros.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = logros.map(l => `
                <div class="logro-card ${l.desbloqueado ? 'desbloqueado' : 'bloqueado'}">
                    <span class="badge-estado">${l.desbloqueado ? '✅' : '🔒'}</span>
                    <span class="icono">${l.icono}</span>
                    <div class="nombre">${l.nombre}</div>
                    <div class="descripcion">${l.descripcion}</div>
                    <div class="progreso">
                        <div class="fill" style="width:${l.progreso}%;"></div>
                    </div>
                    <div class="porcentaje">${l.progreso}% · ${l.puntos} pts</div>
                </div>
            `).join('');
        }

        // ================================================================
        // 🔔 TOAST
        // ================================================================
        let toastTimeout;

        function mostrarToast(mensaje, tipo = '') {
            const toast = document.getElementById('toast');
            toast.textContent = mensaje;
            toast.className = 'toast active';
            if (tipo === 'error') toast.classList.add('error');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.remove('active'), 3000);
        }

        // ================================================================
        // 🚀 INICIALIZAR
        // ================================================================
        document.addEventListener('DOMContentLoaded', () => {
            aplicarIdioma(idiomaActual);
            renderLogros();
            console.log('🏆 Csariel\'s - Logros cargado');
        });

        // Exponer funciones globales
        window.cambiarIdioma = cambiarIdioma;
        window.mostrarToast = mostrarToast;
    </script>
