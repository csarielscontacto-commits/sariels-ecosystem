<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sugerencias | Csariel's</title>
    <meta name="theme-color" content="#0F2D1A" />

    <!-- ===== RECURSOS ===== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet" />

    <style>
        /* ================================================================
           ESTILOS CSARIEL'S - SUGERENCIAS
           ================================================================ */
        :root {
            --space-deep: #05080f;
            --space-mid: #0a1428;
            --verde-bosque: #0F2D1A;
            --verde-bosque-light: #1a4a2a;
            --gold-cosmic: #D4AF37;
            --gold-dim: rgba(212,175,55,0.15);
            --gold-glow: rgba(212,175,55,0.25);
            --text-primary: #e8f0f8;
            --text-secondary: #8ba3c7;
            --text-muted: #4a6a8a;
            --border: rgba(212,175,55,0.08);
            --border-glow: rgba(212,175,55,0.25);
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --success: #00b894;
            --danger: #ff3366;
            --warning: #D4AF37;
            --quantum: #00e5ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--space-deep);
            color: var(--text-primary);
            font-family: 'Space Grotesk', system-ui, sans-serif;
            min-height: 100vh;
        }

        #stars-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .nebula {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.10;
            pointer-events: none;
            z-index: 0;
            animation: nebula-drift 25s ease-in-out infinite alternate;
        }
        .nebula-1 {
            width: 700px;
            height: 700px;
            background: var(--verde-bosque);
            top: -15%;
            right: -15%;
        }
        .nebula-2 {
            width: 600px;
            height: 600px;
            background: var(--gold-cosmic);
            bottom: -15%;
            left: -15%;
            animation-delay: -8s;
            opacity: 0.05;
        }
        .nebula-3 {
            width: 500px;
            height: 500px;
            background: var(--quantum);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -15s;
            opacity: 0.04;
        }

        @keyframes nebula-drift {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(40px, -30px) scale(1.15);
            }
        }

        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: var(--space-deep);
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(var(--gold-cosmic), var(--verde-bosque));
            border-radius: 3px;
        }

        .app {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 16px 20px 30px;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0 16px;
            border-bottom: 2px solid var(--gold-dim);
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
            backdrop-filter: blur(10px);
            position: relative;
        }
        .header::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-cosmic), var(--verde-bosque), var(--gold-cosmic), transparent);
            opacity: 0.4;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        .logo-icon {
            font-size: 2rem;
            filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.2));
            animation: pulse-glow 3s ease-in-out infinite;
        }
        .logo-icon .hex {
            display: inline-block;
            background: var(--verde-bosque);
            color: var(--gold-cosmic);
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 900;
            border: 2px solid var(--gold-cosmic);
            font-family: 'Orbitron', monospace;
        }
        @keyframes pulse-glow {
            0%,
            100% {
                filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.2));
            }
            50% {
                filter: drop-shadow(0 0 40px rgba(212, 175, 55, 0.4));
            }
        }

        .logo-text {
            font-family: 'Orbitron', monospace;
            font-size: 1.3rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--gold-cosmic), var(--verde-bosque-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo-badge {
            font-family: 'Orbitron', monospace;
            font-size: 0.45rem;
            background: linear-gradient(135deg, var(--verde-bosque), var(--gold-cosmic));
            color: white;
            padding: 3px 12px;
            border-radius: 20px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            -webkit-text-fill-color: white;
            border: 1px solid rgba(212, 175, 55, 0.2);
            animation: badge-pulse 2s ease-in-out infinite;
        }
        @keyframes badge-pulse {
            0%,
            100% {
                box-shadow: 0 0 30px rgba(15, 45, 26, 0.3);
            }
            50% {
                box-shadow: 0 0 60px rgba(212, 175, 55, 0.2);
            }
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 16px;
            border: 1px solid var(--border);
            border-radius: 30px;
            background: rgba(212, 175, 55, 0.03);
            color: var(--text-primary);
            font-family: 'Orbitron', monospace;
            font-size: 0.6rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
        }
        .btn:hover {
            transform: scale(1.02);
            border-color: var(--border-glow);
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--verde-bosque), var(--verde-bosque-light));
            border-color: var(--gold-cosmic);
            color: var(--gold-cosmic);
            -webkit-text-fill-color: var(--gold-cosmic);
        }
        .btn-primary:hover:not(:disabled) {
            background: linear-gradient(135deg, var(--verde-bosque-light), var(--verde-bosque));
            box-shadow: 0 0 40px rgba(15, 45, 26, 0.5);
        }
        .btn-gold {
            background: linear-gradient(135deg, var(--gold-cosmic), #b8923a);
            border-color: transparent;
            color: #0a0c10;
            -webkit-text-fill-color: #0a0c10;
        }
        .btn-gold:hover:not(:disabled) {
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.3);
        }
        .btn-outline {
            border-color: var(--border);
            background: transparent;
        }
        .btn-outline:hover:not(:disabled) {
            background: rgba(212, 175, 55, 0.05);
            border-color: var(--gold-cosmic);
        }
        .btn-sm {
            padding: 4px 12px;
            font-size: 0.55rem;
        }

        .language-selector {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            background: rgba(212, 175, 55, 0.03);
            border-radius: 16px;
            border: 1px solid rgba(212, 175, 55, 0.08);
        }
        .language-selector .lang-icon {
            font-size: 0.7rem;
            margin-right: 2px;
        }
        .lang-btn {
            padding: 2px 8px;
            border-radius: 10px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-muted);
            font-family: 'Orbitron', monospace;
            font-size: 0.45rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .lang-btn:hover {
            color: var(--text-secondary);
            background: rgba(212, 175, 55, 0.05);
        }
        .lang-btn.active {
            border-color: var(--gold-cosmic);
            background: rgba(212, 175, 55, 0.1);
            color: var(--gold-cosmic);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(212, 175, 55, 0.06);
            border: 1px solid rgba(212, 175, 55, 0.15);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.6rem;
            color: var(--gold-cosmic);
            font-family: 'Orbitron', monospace;
            backdrop-filter: blur(10px);
        }
        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            animation: quantum-pulse 1.5s ease-in-out infinite;
        }
        .status-dot.online {
            background: var(--success);
            box-shadow: 0 0 20px rgba(0, 184, 148, 0.5);
        }
        @keyframes quantum-pulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(0.7);
            }
        }

        /* ===== SUGERENCIAS ===== */
        .sugerencias-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }
        .sugerencias-header h2 {
            font-family: 'Orbitron', monospace;
            font-size: 1rem;
            color: var(--text-secondary);
        }
        .sugerencias-header h2 i {
            color: var(--gold-cosmic);
        }

        .form-sugerencia {
            background: rgba(15, 45, 26, 0.06);
            border: 1px solid var(--gold-dim);
            border-radius: var(--radius);
            padding: 20px 24px;
            margin-bottom: 16px;
        }
        .form-sugerencia .campo {
            margin-bottom: 12px;
        }
        .form-sugerencia .campo label {
            display: block;
            font-size: 0.6rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
            font-weight: 600;
        }
        .form-sugerencia .campo input,
        .form-sugerencia .campo select,
        .form-sugerencia .campo textarea {
            width: 100%;
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid var(--gold-dim);
            background: rgba(15, 45, 26, 0.15);
            color: var(--text-primary);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.65rem;
            outline: none;
            transition: var(--transition);
            resize: vertical;
        }
        .form-sugerencia .campo input:focus,
        .form-sugerencia .campo select:focus,
        .form-sugerencia .campo textarea:focus {
            border-color: var(--gold-cosmic);
        }
        .form-sugerencia .campo input::placeholder,
        .form-sugerencia .campo textarea::placeholder {
            color: var(--text-muted);
        }
        .form-sugerencia .campo select {
            appearance: none;
            cursor: pointer;
        }
        .form-sugerencia .campo select option {
            background: var(--space-deep);
            color: var(--text-primary);
        }
        .form-sugerencia .acciones {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        .sugerencias-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }

        .sugerencia-item {
            background: rgba(15, 45, 26, 0.04);
            border: 1px solid var(--gold-dim);
            border-radius: var(--radius);
            padding: 12px 16px;
            transition: var(--transition);
        }
        .sugerencia-item:hover {
            border-color: var(--border-glow);
        }
        .sugerencia-item .header-sug {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 4px;
        }
        .sugerencia-item .header-sug .titulo {
            font-weight: 600;
            font-size: 0.75rem;
            color: var(--text-primary);
        }
        .sugerencia-item .header-sug .categoria {
            font-size: 0.45rem;
            color: var(--gold-cosmic);
            background: rgba(212, 175, 55, 0.06);
            padding: 2px 10px;
            border-radius: 12px;
            font-family: 'Orbitron', monospace;
            border: 1px solid var(--gold-dim);
        }
        .sugerencia-item .header-sug .estado {
            font-size: 0.45rem;
            padding: 2px 10px;
            border-radius: 12px;
            font-weight: 600;
            font-family: 'Orbitron', monospace;
        }
        .sugerencia-item .header-sug .estado.pendiente {
            background: rgba(212, 175, 55, 0.15);
            color: var(--warning);
        }
        .sugerencia-item .header-sug .estado.en-progreso {
            background: rgba(0, 229, 255, 0.15);
            color: var(--quantum);
        }
        .sugerencia-item .header-sug .estado.completada {
            background: rgba(0, 184, 148, 0.15);
            color: var(--success);
        }
        .sugerencia-item .header-sug .estado.rechazada {
            background: rgba(255, 51, 102, 0.15);
            color: var(--danger);
        }

        .sugerencia-item .descripcion {
            font-size: 0.6rem;
            color: var(--text-secondary);
            line-height: 1.5;
            margin: 4px 0 6px;
        }
        .sugerencia-item .meta {
            display: flex;
            gap: 12px;
            font-size: 0.45rem;
            color: var(--text-muted);
            flex-wrap: wrap;
        }
        .sugerencia-item .meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .sugerencia-item .meta i {
            font-size: 0.4rem;
            color: var(--gold-cosmic);
        }

        .sugerencia-item .votos {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid var(--gold-dim);
        }
        .sugerencia-item .votos .btn-voto {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.6rem;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            border-radius: 16px;
            border: 1px solid var(--gold-dim);
        }
        .sugerencia-item .votos .btn-voto:hover {
            border-color: var(--gold-cosmic);
            color: var(--gold-cosmic);
        }
        .sugerencia-item .votos .btn-voto.votado {
            border-color: var(--gold-cosmic);
            color: var(--gold-cosmic);
            background: rgba(212, 175, 55, 0.05);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            grid-column: 1/-1;
        }
        .empty-state .icon {
            font-size: 2.5rem;
            opacity: 0.3;
            margin-bottom: 6px;
        }
        .empty-state h3 {
            font-family: 'Orbitron', monospace;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        .empty-state p {
            font-size: 0.6rem;
        }

        /* ===== FOOTER ===== */
        .footer {
            margin-top: 24px;
            padding-top: 14px;
            border-top: 1px solid var(--gold-dim);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            position: relative;
        }
        .footer::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-cosmic), transparent);
            opacity: 0.2;
        }
        .footer-text {
            color: var(--text-muted);
            font-size: 0.5rem;
            letter-spacing: 0.5px;
            font-family: 'Orbitron', monospace;
        }
        .footer-text .brand {
            color: var(--gold-cosmic);
        }
        .footer-links {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.5rem;
            transition: var(--transition);
            font-family: 'Orbitron', monospace;
            letter-spacing: 0.5px;
        }
        .footer-links a:hover {
            color: var(--gold-cosmic);
        }
        .footer-hex {
            display: inline-block;
            background: var(--verde-bosque);
            color: var(--gold-cosmic);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.45rem;
            font-weight: 700;
            border: 1px solid var(--gold-cosmic);
            font-family: 'Orbitron', monospace;
        }

        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--verde-bosque);
            color: var(--gold-cosmic);
            padding: 10px 20px;
            border-radius: var(--radius);
            font-weight: 600;
            font-size: 0.7rem;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 5000;
            pointer-events: none;
            font-family: 'Orbitron', monospace;
            border: 1px solid rgba(212, 175, 55, 0.15);
            max-width: 90%;
            text-align: center;
        }
        .toast.active {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.error {
            background: var(--danger);
            color: white;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            .header-actions {
                width: 100%;
                justify-content: flex-start;
                flex-wrap: wrap;
            }
            .form-sugerencia {
                padding: 14px 16px;
            }
            .sugerencia-item .header-sug {
                flex-direction: column;
                align-items: flex-start;
            }
        }

        @media (max-width: 480px) {
            .btn {
                font-size: 0.45rem;
                padding: 4px 8px;
            }
            .form-sugerencia .acciones {
                flex-direction: column;
            }
            .form-sugerencia .acciones .btn {
                width: 100%;
                justify-content: center;
            }
            .sugerencia-item .header-sug .titulo {
                font-size: 0.65rem;
            }
        }
    </style>
</head>
<body>
    <!-- ===== FONDO ESTELAR ===== -->
    <canvas id="stars-canvas"></canvas>
    <div class="nebula nebula-1"></div>
    <div class="nebula nebula-2"></div>
    <div class="nebula nebula-3"></div>

    <div class="app">

        <!-- ===== HEADER ===== -->
        <header class="header">
            <a href="../index.html" class="logo">
                <span class="logo-icon"><span class="hex">◈</span></span>
                <span class="logo-text">Csariel's</span>
                <span class="logo-badge">Sugerencias</span>
            </a>
            <div class="header-actions">
                <div class="language-selector">
                    <span class="lang-icon">🌐</span>
                    <button class="lang-btn active" onclick="cambiarIdioma('es')">ES</button>
                    <button class="lang-btn" onclick="cambiarIdioma('en')">EN</button>
                    <button class="lang-btn" onclick="cambiarIdioma('fr')">FR</button>
                </div>

                <div class="status-badge">
                    <span class="status-dot online"></span>
                    <span>En línea</span>
                </div>

                <a href="../index.html" class="btn btn-outline btn-sm">
                    <i class="fas fa-arrow-left"></i> Volver
                </a>
            </div>
        </header>

        <!-- ===== SUGERENCIAS ===== -->
        <div class="sugerencias-header">
            <h2><i class="fas fa-lightbulb"></i> Sugerencias y Feedback</h2>
            <span style="font-size:0.55rem;color:var(--text-muted);">Ayuda a mejorar Csariel's</span>
        </div>

        <!-- ===== FORMULARIO ===== -->
        <div class="form-sugerencia">
            <div class="campo">
                <label for="tituloSugerencia">Título de la sugerencia</label>
                <input type="text" id="tituloSugerencia" placeholder="Ej: Mejorar el sistema de notificaciones" />
            </div>
            <div class="campo">
                <label for="categoriaSugerencia">Categoría</label>
                <select id="categoriaSugerencia">
                    <option value="funcionalidad">⚙️ Funcionalidad</option>
                    <option value="diseno">🎨 Diseño</option>
                    <option value="rendimiento">🚀 Rendimiento</option>
                    <option value="seguridad">🔒 Seguridad</option>
                    <option value="otro">📌 Otro</option>
                </select>
            </div>
            <div class="campo">
                <label for="descripcionSugerencia">Descripción detallada</label>
                <textarea id="descripcionSugerencia" rows="3" placeholder="Describe tu sugerencia con el mayor detalle posible..."></textarea>
            </div>
            <div class="acciones">
                <button class="btn btn-outline btn-sm" onclick="limpiarFormulario()">Limpiar</button>
                <button class="btn btn-gold" onclick="enviarSugerencia()">
                    <i class="fas fa-paper-plane"></i> Enviar sugerencia
                </button>
            </div>
        </div>

        <!-- ===== LISTA DE SUGERENCIAS ===== -->
        <div class="sugerencias-list" id="sugerenciasList">
            <!-- Renderizado con JavaScript -->
        </div>

        <!-- ===== FOOTER ===== -->
        <footer class="footer">
            <span class="footer-text">
                <span class="brand">◈ Csariel's</span> — Sugerencias · Feedback · Mejora
            </span>
            <div class="footer-links">
                <a href="../index.html">🏠 Red</a>
                <a href="../testimonios/index.html">💬 Testimonios</a>
                <a href="../ayuda/index.html">🆘 Ayuda</a>
                <span class="footer-hex">◈</span>
            </div>
        </footer>
    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast"></div>

    <!-- ================================================================ -->
    <!-- SCRIPTS -->
    <!-- ================================================================ -->
    <script>
        // ================================================================
        // 🌟 ESTRELLAS
        // ================================================================
        (function initStars() {
            const canvas = document.getElementById('stars-canvas');
            const ctx = canvas.getContext('2d');
            let w, h;

            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }
            resize();

            const stars = Array.from({ length: 200 }, () => ({
                x: Math.random() * w,
                y: Math.random() * h,
                r: Math.random() * 0.8 + 0.2,
                o: Math.random() * 0.8 + 0.2,
                speed: Math.random() * 0.005 + 0.002,
                phase: Math.random() * Math.PI * 2
            }));

            function draw() {
                ctx.clearRect(0, 0, w, h);
                stars.forEach(s => {
                    const opacity = s.o * (0.6 + 0.4 * Math.sin(s.phase));
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, 2 * Math.PI);
                    ctx.fillStyle = `rgba(255,255,255,${opacity})`;
                    ctx.fill();
                    s.y += s.speed;
                    s.phase += 0.01;
                    if (s.y > h) { s.y = 0;
                        s.x = Math.random() * w; }
                });
                requestAnimationFrame(draw);
            }
            draw();

            window.addEventListener('resize', () => {
                resize();
                stars.forEach(s => { s.x = Math.random() * w;
                    s.y = Math.random() * h; });
            });
        })();

        // ================================================================
        // 🌐 IDIOMAS
        // ================================================================
        const traducciones = {
            es: {

                'descripcion': 'Descripción detallada',

                'limpiar': 'Limpiar',
                'enviar': 'Enviar sugerencia',
                'sin_sugerencias': '💡 Sin sugerencias',
                'sin_sugerencias_desc': 'Sé el primero en compartir una sugerencia.',
                'enviado': '✅ Sugerencia enviada',

            },
            en: {
                'sugerencias': 'Suggestions',
                'en_linea': 'Online',
                'volver': 'Back',
                'feedback': 'Suggestions and Feedback',
                'ayuda_mejorar': 'Help improve Csariel\'s',
                'titulo': 'Suggestion title',
                'titulo_placeholder': 'E.g: Improve the notification system',
                'categoria': 'Category',
                'funcionalidad': '⚙️ Functionality',
                'diseno': '🎨 Design',
                'rendimiento': '🚀 Performance',
                'seguridad': '🔒 Security',
                'otro': '📌 Other',
                'descripcion': 'Detailed description',
                'descripcion_placeholder': 'Describe your suggestion in as much detail as possible...',
                'limpiar': 'Clear',
                'enviar': 'Send suggestion',
                'sin_sugerencias': '💡 No suggestions',
                'sin_sugerencias_desc': 'Be the first to share a suggestion.',
                'enviado': '✅ Suggestion sent',
                'votar': 'Vote',
                'votos': 'votes'
            },
            fr: {
                'sugerencias': 'Suggestions',
                'en_linea': 'En ligne',
                'volver': 'Retour',
                'feedback': 'Suggestions et Retours',
                'ayuda_mejorar': 'Aidez à améliorer Csariel\'s',
                'titulo': 'Titre de la suggestion',
                'titulo_placeholder': 'Ex: Améliorer le système de notifications',
                'categoria': 'Catégorie',
                'funcionalidad': '⚙️ Fonctionnalité',
                'diseno': '🎨 Design',
                'rendimiento': '🚀 Performance',
                'seguridad': '🔒 Sécurité',
                'otro': '📌 Autre',
                'descripcion': 'Description détaillée',
                'descripcion_placeholder': 'Décrivez votre suggestion avec le plus de détails possible...',
                'limpiar': 'Effacer',
                'enviar': 'Envoyer la suggestion',
                'sin_sugerencias': '💡 Aucune suggestion',
                'sin_sugerencias_desc': 'Soyez le premier à partager une suggestion.',
                'enviado': '✅ Suggestion envoyée',
                'votar': 'Voter',
                'votos': 'votes'
            }
        };

        let idiomaActual = localStorage.getItem('csariels_idioma') || 'es';

        function aplicarIdioma(idioma) {
            const t = traducciones[idioma] || traducciones.es;
            document.querySelector('.logo-badge').textContent = t.sugerencias;
            document.querySelector('.status-badge span:last-child').textContent = t.en_linea;
            document.querySelector('.sugerencias-header h2').innerHTML =
                `<i class="fas fa-lightbulb"></i> ${t.feedback}`;
            document.querySelector('.sugerencias-header span').textContent = t.ayuda_mejorar;

            document.querySelector('.form-sugerencia .campo label[for="tituloSugerencia"]').textContent = t.titulo;
            document.querySelector('#tituloSugerencia').placeholder = t.titulo_placeholder;
            document.querySelector('.form-sugerencia .campo label[for="categoriaSugerencia"]').textContent = t.categoria;

            const options = document.querySelectorAll('#categoriaSugerencia option');
            const optTexts = [t.funcionalidad, t.diseno, t.rendimiento, t.seguridad, t.otro];
            options.forEach((opt, i) => {
                if (i < optTexts.length) opt.textContent = optTexts[i];
            });

            document.querySelector('.form-sugerencia .campo label[for="descripcionSugerencia"]').textContent = t
            .descripcion;
            document.querySelector('#descripcionSugerencia').placeholder = t.descripcion_placeholder;
            document.querySelector('.form-sugerencia .acciones .btn-outline span:last-child').textContent = t.limpiar;
            document.querySelector('.form-sugerencia .acciones .btn-gold').innerHTML =
                `<i class="fas fa-paper-plane"></i> ${t.enviar}`;
        }

        function cambiarIdioma(idioma) {
            idiomaActual = idioma;
            localStorage.setItem('csariels_idioma', idioma);
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`.lang-btn[onclick="cambiarIdioma('${idioma}')"]`).classList.add('active');
            aplicarIdioma(idioma);
            renderSugerencias();
            mostrarToast(`🌐 ${idioma.toUpperCase()}`);
        }

        // ================================================================
        // 📋 DATOS DE SUGERENCIAS
        // ================================================================
        let sugerencias = [{
            id: 1,
            titulo: 'Mejorar el sistema de notificaciones',
            categoria: 'funcionalidad',
            descripcion: 'Las notificaciones deberían agruparse por tipo y permitir marcar todas como leídas con un solo clic.',
            autor: 'María G.',
            fecha: '15/08/2026',
            estado: 'en-progreso',
            votos: 12,
            votado: false
        }, {
            id: 2,
            titulo: 'Tema claro para la interfaz',
            categoria: 'diseno',
            descripcion: 'Me encanta el tema oscuro, pero sería genial tener una opción clara para quienes prefieren más luminosidad.',
            autor: 'Carlos R.',
            fecha: '12/08/2026',
            estado: 'pendiente',
            votos: 8,
            votado: false
        }, {
            id: 3,
            titulo: 'Optimizar el rendimiento en móvil',
            categoria: 'rendimiento',
            descripcion: 'La carga de imágenes en dispositivos móviles es un poco lenta. Se podría implementar lazy loading.',
            autor: 'Laura S.',
            fecha: '10/08/2026',
            estado: 'pendiente',
            votos: 15,
            votado: true
        }, {
            id: 4,
            titulo: 'Autenticación biométrica',
            categoria: 'seguridad',
            descripcion: 'Añadir soporte para huella digital o Face ID para un acceso más rápido y seguro.',
            autor: 'Javier M.',
            fecha: '08/08/2026',
            estado: 'completada',
            votos: 20,
            votado: false
        }, {
            id: 5,
            titulo: 'Integración con Google Calendar',
            categoria: 'funcionalidad',
            descripcion: 'Sería útil poder sincronizar los eventos de Csariel\'s con Google Calendar.',
            autor: 'Ana M.',
            fecha: '05/08/2026',
            estado: 'rechazada',
            votos: 3,
            votado: false
        }];

        // ================================================================
        // 🖥️ RENDERIZAR SUGERENCIAS
        // ================================================================
        function renderSugerencias() {
            const container = document.getElementById('sugerenciasList');
            const t = traducciones[idiomaActual] || traducciones.es;

            if (sugerencias.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">💡</div>
                        <h3>${t.sin_sugerencias}</h3>
                        <p>${t.sin_sugerencias_desc}</p>
                    </div>
                `;
                return;
            }

            const estadoText = {
                'pendiente': '⏳ Pendiente',
                'en-progreso': '🔄 En progreso',
                'completada': '✅ Completada',
                'rechazada': '❌ Rechazada'
            };
            const estadoClass = {
                'pendiente': 'pendiente',
                'en-progreso': 'en-progreso',
                'completada': 'completada',
                'rechazada': 'rechazada'
            };

            container.innerHTML = sugerencias.map(s => `
                <div class="sugerencia-item">
                    <div class="header-sug">
                        <span class="titulo">${s.titulo}</span>
                        <span class="categoria">${s.categoria.charAt(0).toUpperCase() + s.categoria.slice(1)}</span>
                        <span class="estado ${estadoClass[s.estado]}">${estadoText[s.estado]}</span>
                    </div>
                    <div class="descripcion">${s.descripcion}</div>
                    <div class="meta">
                        <span><i class="fas fa-user"></i> ${s.autor}</span>
                        <span><i class="fas fa-calendar-alt"></i> ${s.fecha}</span>
                    </div>
                    <div class="votos">
                        <button class="btn-voto ${s.votado ? 'votado' : ''}" onclick="votarSugerencia(${s.id})">
                            <i class="fas fa-thumbs-up"></i> ${t.votar} (${s.votos})
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // ================================================================
        // 🎯 ACCIONES
        // ================================================================
        function enviarSugerencia() {
            const t = traducciones[idiomaActual] || traducciones.es;
            const titulo = document.getElementById('tituloSugerencia').value.trim();
            const categoria = document.getElementById('categoriaSugerencia').value;
            const descripcion = document.getElementById('descripcionSugerencia').value.trim();

            if (!titulo) {
                mostrarToast('⚠️ Ingresa un título para tu sugerencia', 'error');
                return;
            }
            if (!descripcion) {
                mostrarToast('⚠️ Describe tu sugerencia', 'error');
                return;
            }

            const nueva = {
                id: sugerencias.length + 1,
                titulo: titulo,
                categoria: categoria,
                descripcion: descripcion,
                autor: 'Tú',
                fecha: new Date().toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' }),
                estado: 'pendiente',
                votos: 1,
                votado: true
            };

            sugerencias.unshift(nueva);
            document.getElementById('tituloSugerencia').value = '';
            document.getElementById('descripcionSugerencia').value = '';
            renderSugerencias();
            mostrarToast(t.enviado);
        }

        function votarSugerencia(id) {
            const s = sugerencias.find(s => s.id === id);
            if (!s) return;
            s.votado = !s.votado;
            s.votos += s.votado ? 1 : -1;
            renderSugerencias();
        }

        function limpiarFormulario() {
            document.getElementById('tituloSugerencia').value = '';
            document.getElementById('descripcionSugerencia').value = '';
            document.getElementById('categoriaSugerencia').selectedIndex = 0;
            mostrarToast('🧹 Formulario limpiado');
        }

        // ================================================================
        // 🔔 TOAST
        // ================================================================
        let toastTimeout;

        function mostrarToast(mensaje, tipo = '') {
            const toast = document.getElementById('toast');
            toast.textContent = mensaje;
            toast.className = 'toast active';
            if (tipo === 'error') toast.classList.add('error');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.remove('active'), 3000);
        }

        // ================================================================
        // 🚀 INICIALIZAR
        // ================================================================
        document.addEventListener('DOMContentLoaded', () => {
            aplicarIdioma(idiomaActual);
            renderSugerencias();
            console.log('💡 Csariel\'s - Sugerencias cargado');
        });

        // Exponer funciones globales
        window.cambiarIdioma = cambiarIdioma;
        window.enviarSugerencia = enviarSugerencia;
        window.votarSugerencia = votarSugerencia;
        window.limpiarFormulario = limpiarFormulario;
        window.mostrarToast = mostrarToast;
    </script>
</body>
