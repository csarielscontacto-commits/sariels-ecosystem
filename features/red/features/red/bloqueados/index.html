<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bloqueados | Csariel's</title>
    <meta name="theme-color" content="#0F2D1A" />

    <!-- ===== RECURSOS ===== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet" />

    <style>
        /* ================================================================
           ESTILOS CSARIEL'S - BLOQUEADOS
           ================================================================ */
        :root {
            --space-deep: #05080f;
            --space-mid: #0a1428;
            --verde-bosque: #0F2D1A;
            --verde-bosque-light: #1a4a2a;
            --gold-cosmic: #D4AF37;
            --gold-dim: rgba(212,175,55,0.15);
            --gold-glow: rgba(212,175,55,0.25);
            --text-primary: #e8f0f8;
            --text-secondary: #8ba3c7;
            --text-muted: #4a6a8a;
            --border: rgba(212,175,55,0.08);
            --border-glow: rgba(212,175,55,0.25);
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --success: #00b894;
            --danger: #ff3366;
            --warning: #D4AF37;
            --quantum: #00e5ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--space-deep);
            color: var(--text-primary);
            font-family: 'Space Grotesk', system-ui, sans-serif;
            min-height: 100vh;
        }

        #stars-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .nebula {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.10;
            pointer-events: none;
            z-index: 0;
            animation: nebula-drift 25s ease-in-out infinite alternate;
        }
        .nebula-1 {
            width: 700px;
            height: 700px;
            background: var(--verde-bosque);
            top: -15%;
            right: -15%;
        }
        .nebula-2 {
            width: 600px;
            height: 600px;
            background: var(--gold-cosmic);
            bottom: -15%;
            left: -15%;
            animation-delay: -8s;
            opacity: 0.05;
        }
        .nebula-3 {
            width: 500px;
            height: 500px;
            background: var(--quantum);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -15s;
            opacity: 0.04;
        }

        @keyframes nebula-drift {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(40px, -30px) scale(1.15);
            }
        }

        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: var(--space-deep);
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(var(--gold-cosmic), var(--verde-bosque));
            border-radius: 3px;
        }

        .app {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px 20px 30px;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0 16px;
            border-bottom: 2px solid var(--gold-dim);
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
            backdrop-filter: blur(10px);
            position: relative;
        }
        .header::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-cosmic), var(--verde-bosque), var(--gold-cosmic), transparent);
            opacity: 0.4;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        .logo-icon {
            font-size: 2rem;
            filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.2));
            animation: pulse-glow 3s ease-in-out infinite;
        }
        .logo-icon .hex {
            display: inline-block;
            background: var(--verde-bosque);
            color: var(--gold-cosmic);
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 900;
            border: 2px solid var(--gold-cosmic);
            font-family: 'Orbitron', monospace;
        }
        @keyframes pulse-glow {
            0%,
            100% {
                filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.2));
            }
            50% {
                filter: drop-shadow(0 0 40px rgba(212, 175, 55, 0.4));
            }
        }

        .logo-text {
            font-family: 'Orbitron', monospace;
            font-size: 1.3rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--gold-cosmic), var(--verde-bosque-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo-badge {
            font-family: 'Orbitron', monospace;
            font-size: 0.45rem;
            background: linear-gradient(135deg, var(--verde-bosque), var(--gold-cosmic));
            color: white;
            padding: 3px 12px;
            border-radius: 20px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            -webkit-text-fill-color: white;
            border: 1px solid rgba(212, 175, 55, 0.2);
            animation: badge-pulse 2s ease-in-out infinite;
        }
        @keyframes badge-pulse {
            0%,
            100% {
                box-shadow: 0 0 30px rgba(15, 45, 26, 0.3);
            }
            50% {
                box-shadow: 0 0 60px rgba(212, 175, 55, 0.2);
            }
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 16px;
            border: 1px solid var(--border);
            border-radius: 30px;
            background: rgba(212, 175, 55, 0.03);
            color: var(--text-primary);
            font-family: 'Orbitron', monospace;
            font-size: 0.6rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
        }
        .btn:hover {
            transform: scale(1.02);
            border-color: var(--border-glow);
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--verde-bosque), var(--verde-bosque-light));
            border-color: var(--gold-cosmic);
            color: var(--gold-cosmic);
            -webkit-text-fill-color: var(--gold-cosmic);
        }
        .btn-primary:hover:not(:disabled) {
            background: linear-gradient(135deg, var(--verde-bosque-light), var(--verde-bosque));
            box-shadow: 0 0 40px rgba(15, 45, 26, 0.5);
        }
        .btn-gold {
            background: linear-gradient(135deg, var(--gold-cosmic), #b8923a);
            border-color: transparent;
            color: #0a0c10;
            -webkit-text-fill-color: #0a0c10;
        }
        .btn-gold:hover:not(:disabled) {
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.3);
        }
        .btn-outline {
            border-color: var(--border);
            background: transparent;
        }
        .btn-outline:hover:not(:disabled) {
            background: rgba(212, 175, 55, 0.05);
            border-color: var(--gold-cosmic);
        }
        .btn-sm {
            padding: 4px 12px;
            font-size: 0.55rem;
        }
        .btn-success {
            background: rgba(0, 184, 148, 0.15);
            border-color: rgba(0, 184, 148, 0.3);
            color: var(--success);
        }
        .btn-success:hover:not(:disabled) {
            background: rgba(0, 184, 148, 0.25);
        }
        .btn-danger {
            background: rgba(255, 51, 102, 0.15);
            border-color: rgba(255, 51, 102, 0.3);
            color: var(--danger);
        }
        .btn-danger:hover:not(:disabled) {
            background: rgba(255, 51, 102, 0.25);
        }

        .language-selector {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            background: rgba(212, 175, 55, 0.03);
            border-radius: 16px;
            border: 1px solid rgba(212, 175, 55, 0.08);
        }
        .language-selector .lang-icon {
            font-size: 0.7rem;
            margin-right: 2px;
        }
        .lang-btn {
            padding: 2px 8px;
            border-radius: 10px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-muted);
            font-family: 'Orbitron', monospace;
            font-size: 0.45rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .lang-btn:hover {
            color: var(--text-secondary);
            background: rgba(212, 175, 55, 0.05);
        }
        .lang-btn.active {
            border-color: var(--gold-cosmic);
            background: rgba(212, 175, 55, 0.1);
            color: var(--gold-cosmic);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(212, 175, 55, 0.06);
            border: 1px solid rgba(212, 175, 55, 0.15);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.6rem;
            color: var(--gold-cosmic);
            font-family: 'Orbitron', monospace;
            backdrop-filter: blur(10px);
        }
        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            animation: quantum-pulse 1.5s ease-in-out infinite;
        }
        .status-dot.online {
            background: var(--success);
            box-shadow: 0 0 20px rgba(0, 184, 148, 0.5);
        }
        @keyframes quantum-pulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(0.7);
            }
        }

        /* ===== BLOQUEADOS ===== */
        .bloqueados-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }
        .bloqueados-header h2 {
            font-family: 'Orbitron', monospace;
            font-size: 1rem;
            color: var(--text-secondary);
        }
        .bloqueados-header h2 i {
            color: var(--danger);
        }
        .bloqueados-header .badge-total {
            background: var(--danger);
            color: white;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.6rem;
            font-weight: 700;
            font-family: 'Orbitron', monospace;
        }

        .busqueda-bar {
            display: flex;
            gap: 8px;
            flex: 1;
            max-width: 450px;
        }
        .busqueda-bar input {
            flex: 1;
            padding: 8px 14px;
            border-radius: 30px;
            border: 1px solid var(--gold-dim);
            background: rgba(15, 45, 26, 0.15);
            color: var(--text-primary);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.7rem;
            outline: none;
            transition: var(--transition);
        }
        .busqueda-bar input:focus {
            border-color: var(--gold-cosmic);
        }
        .busqueda-bar input::placeholder {
            color: var(--text-muted);
        }

        .bloqueados-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 12px;
        }

        .bloqueado-card {
            background: rgba(15, 45, 26, 0.15);
            border: 1px solid rgba(255, 51, 102, 0.2);
            border-radius: var(--radius);
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: var(--transition);
            opacity: 0.7;
        }
        .bloqueado-card:hover {
            border-color: rgba(255, 51, 102, 0.4);
            background: rgba(15, 45, 26, 0.25);
            opacity: 1;
        }

        .bloqueado-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4a1a2a, #663344);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: white;
            font-size: 1rem;
            flex-shrink: 0;
            position: relative;
            border: 2px solid var(--danger);
            filter: grayscale(1);
        }
        .bloqueado-avatar .bloqueado-icon {
            position: absolute;
            bottom: -4px;
            right: -4px;
            background: var(--danger);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.5rem;
            color: white;
            border: 2px solid var(--space-deep);
        }

        .bloqueado-info {
            flex: 1;
            min-width: 0;
        }
        .bloqueado-nombre {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-decoration: line-through;
        }
        .bloqueado-username {
            font-size: 0.6rem;
            color: var(--text-muted);
            text-decoration: line-through;
        }
        .bloqueado-razon {
            font-size: 0.5rem;
            color: var(--text-secondary);
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .bloqueado-razon i {
            color: var(--danger);
            font-size: 0.4rem;
        }
        .bloqueado-fecha {
            font-size: 0.45rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .bloqueado-acciones {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }
        .bloqueado-acciones .btn {
            padding: 4px 10px;
            font-size: 0.45rem;
            border-radius: 20px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            grid-column: 1/-1;
        }
        .empty-state .icon {
            font-size: 3rem;
            opacity: 0.3;
            margin-bottom: 8px;
        }
        .empty-state h3 {
            font-family: 'Orbitron', monospace;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .empty-state p {
            font-size: 0.65rem;
        }

        /* ===== FOOTER ===== */
        .footer {
            margin-top: 24px;
            padding-top: 14px;
            border-top: 1px solid var(--gold-dim);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            position: relative;
        }
        .footer::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-cosmic), transparent);
            opacity: 0.2;
        }
        .footer-text {
            color: var(--text-muted);
            font-size: 0.5rem;
            letter-spacing: 0.5px;
            font-family: 'Orbitron', monospace;
        }
        .footer-text .brand {
            color: var(--gold-cosmic);
        }
        .footer-links {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.5rem;
            transition: var(--transition);
            font-family: 'Orbitron', monospace;
            letter-spacing: 0.5px;
        }
        .footer-links a:hover {
            color: var(--gold-cosmic);
        }
        .footer-hex {
            display: inline-block;
            background: var(--verde-bosque);
            color: var(--gold-cosmic);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.45rem;
            font-weight: 700;
            border: 1px solid var(--gold-cosmic);
            font-family: 'Orbitron', monospace;
        }

        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--verde-bosque);
            color: var(--gold-cosmic);
            padding: 10px 20px;
            border-radius: var(--radius);
            font-weight: 600;
            font-size: 0.7rem;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 5000;
            pointer-events: none;
            font-family: 'Orbitron', monospace;
            border: 1px solid rgba(212, 175, 55, 0.15);
            max-width: 90%;
            text-align: center;
        }
        .toast.active {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.error {
            background: var(--danger);
            color: white;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            .header-actions {
                width: 100%;
                justify-content: flex-start;
                flex-wrap: wrap;
            }
            .bloqueados-header {
                flex-direction: column;
                align-items: stretch;
            }
            .busqueda-bar {
                max-width: 100%;
            }
            .bloqueados-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .btn {
                font-size: 0.45rem;
                padding: 4px 8px;
            }
            .bloqueado-avatar {
                width: 36px;
                height: 36px;
                font-size: 0.7rem;
            }
            .bloqueado-nombre {
                font-size: 0.7rem;
            }
        }
    </style>
</head>

    <script>
        // ================================================================
        // 🌟 ESTRELLAS
        // ================================================================
        (function initStars() {
            const canvas = document.getElementById('stars-canvas');
            const ctx = canvas.getContext('2d');
            let w, h;

            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }
            resize();

            const stars = Array.from({ length: 200 }, () => ({
                x: Math.random() * w,
                y: Math.random() * h,
                r: Math.random() * 0.8 + 0.2,
                o: Math.random() * 0.8 + 0.2,
                speed: Math.random() * 0.005 + 0.002,
                phase: Math.random() * Math.PI * 2
            }));

            function draw() {
                ctx.clearRect(0, 0, w, h);
                stars.forEach(s => {
                    const opacity = s.o * (0.6 + 0.4 * Math.sin(s.phase));
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, 2 * Math.PI);
                    ctx.fillStyle = `rgba(255,255,255,${opacity})`;
                    ctx.fill();
                    s.y += s.speed;
                    s.phase += 0.01;
                    if (s.y > h) { s.y = 0;
                        s.x = Math.random() * w; }
                });
                requestAnimationFrame(draw);
            }
            draw();

            window.addEventListener('resize', () => {
                resize();
                stars.forEach(s => { s.x = Math.random() * w;
                    s.y = Math.random() * h; });
            });
        })();

        // ================================================================
        // 🌐 IDIOMAS
        // ================================================================
        const traducciones = {
            es: {
                'bloqueados': 'Bloqueados',
                'en_linea': 'En línea',
                'volver': 'Volver',
                'seguridad': 'Seguridad',
                'buscar': '🔍 Buscar bloqueados...',
                'sin_bloqueados': '🚫 Sin bloqueados',
                'sin_bloqueados_desc': 'No has bloqueado a ningún usuario.',
                'razon': 'Razón',
                'fecha': 'Fecha',
                'desbloquear': 'Desbloquear',
                'confirmar_desbloquear': '¿Desbloquear a {nombre}?',
                'desbloqueado': '✅ {nombre} desbloqueado'
            },
            en: {
                'bloqueados': 'Blocked',
                'en_linea': 'Online',
                'volver': 'Back',
                'seguridad': 'Security',
                'buscar': '🔍 Search blocked...',
                'sin_bloqueados': '🚫 No blocked users',
                'sin_bloqueados_desc': 'You have not blocked any users.',
                'razon': 'Reason',
                'fecha': 'Date',
                'desbloquear': 'Unblock',
                'confirmar_desbloquear': 'Unblock {nombre}?',
                'desbloqueado': '✅ {nombre} unblocked'
            },
            fr: {
                'bloqueados': 'Bloqués',
                'en_linea': 'En ligne',
                'volver': 'Retour',
                'seguridad': 'Sécurité',
                'buscar': '🔍 Rechercher des bloqués...',
                'sin_bloqueados': '🚫 Aucun bloqué',
                'sin_bloqueados_desc': 'Vous n\'avez bloqué aucun utilisateur.',
                'razon': 'Raison',
                'fecha': 'Date',
                'desbloquear': 'Débloquer',
                'confirmar_desbloquear': 'Débloquer {nombre} ?',
                'desbloqueado': '✅ {nombre} débloqué'
            }
        };

        let idiomaActual = localStorage.getItem('csariels_idioma') || 'es';

        function aplicarIdioma(idioma) {
            const t = traducciones[idioma] || traducciones.es;
            document.querySelector('.logo-badge').textContent = t.bloqueados;
            document.querySelector('.status-badge span:last-child').textContent = t.en_linea;
            document.querySelector('.bloqueados-header h2').innerHTML =
                `<i class="fas fa-ban"></i> ${t.bloqueados} <span class="badge-total" id="totalBloqueados">2</span>`;
            document.querySelector('.busqueda-bar input').placeholder = t.buscar;
        }

        function cambiarIdioma(idioma) {
            idiomaActual = idioma;
            localStorage.setItem('csariels_idioma', idioma);
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`.lang-btn[onclick="cambiarIdioma('${idioma}')"]`).classList.add('active');
            aplicarIdioma(idioma);
            renderBloqueados();
            mostrarToast(`🌐 ${idioma.toUpperCase()}`);
        }

        // ================================================================
        // 📋 DATOS DE BLOQUEADOS
        // ================================================================
        let bloqueados = [{
            id: 1,
            nombre: 'SpamBot_123',
            username: 'spambot_123',
            razon: 'Spam y contenido inapropiado',
            fecha: '15/01/2026'
        }, {
            id: 2,
            nombre: 'Usuario_Troll',
            username: 'troll_user',
            razon: 'Acoso y comportamiento tóxico',
            fecha: '20/01/2026'
        }];

        // ================================================================
        // 🖥️ RENDERIZAR BLOQUEADOS
        // ================================================================
        function renderBloqueados() {
            const grid = document.getElementById('bloqueadosGrid');
            const t = traducciones[idiomaActual] || traducciones.es;

            let filtrados = [...bloqueados];

            // Aplicar búsqueda
            const busqueda = document.getElementById('buscarBloqueados').value.toLowerCase();
            if (busqueda) {
                filtrados = filtrados.filter(b =>
                    b.nombre.toLowerCase().includes(busqueda) ||
                    b.username.toLowerCase().includes(busqueda) ||
                    b.razon.toLowerCase().includes(busqueda)
                );
            }

            // Actualizar contador
            document.getElementById('totalBloqueados').textContent = filtrados.length;

            if (filtrados.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">🚫</div>
                        <h3>${t.sin_bloqueados}</h3>
                        <p>${t.sin_bloqueados_desc}</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtrados.map(b => `
                <div class="bloqueado-card" data-id="${b.id}">
                    <div class="bloqueado-avatar">
                        ${b.nombre.charAt(0).toUpperCase()}
                        <span class="bloqueado-icon"><i class="fas fa-ban"></i></span>
                    </div>
                    <div class="bloqueado-info">
                        <div class="bloqueado-nombre">${b.nombre}</div>
                        <div class="bloqueado-username">@${b.username}</div>
                        <div class="bloqueado-razon">
                            <i class="fas fa-exclamation-triangle"></i> ${t.razon}: ${b.razon}
                        </div>
                        <div class="bloqueado-fecha">
                            <i class="far fa-calendar-alt"></i> ${t.fecha}: ${b.fecha}
                        </div>
                    </div>
                    <div class="bloqueado-acciones">
                        <button class="btn btn-success btn-sm" onclick="desbloquearUsuario(${b.id})">
                            <i class="fas fa-unlock"></i> ${t.desbloquear}
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // ================================================================
        // 🔍 BÚSQUEDA
        // ================================================================
        function filtrarBloqueados() {
            renderBloqueados();
        }

        // ================================================================
        // 🎯 ACCIONES
        // ================================================================
        function desbloquearUsuario(id) {
            const b = bloqueados.find(b => b.id === id);
            if (!b) return;
            const t = traducciones[idiomaActual] || traducciones.es;

            if (confirm(t.confirmar_desbloquear.replace('{nombre}', b.nombre))) {
                bloqueados = bloqueados.filter(b => b.id !== id);
                renderBloqueados();
                mostrarToast(t.desbloqueado.replace('{nombre}', b.nombre));
            }
        }

        // ================================================================
        // 🔔 TOAST
        // ================================================================
        let toastTimeout;

        function mostrarToast(mensaje, tipo = '') {
            const toast = document.getElementById('toast');
            toast.textContent = mensaje;
            toast.className = 'toast active';
            if (tipo === 'error') toast.classList.add('error');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.remove('active'), 3000);
        }

        // ================================================================
        // 🚀 INICIALIZAR
        // ================================================================
        document.addEventListener('DOMContentLoaded', () => {
            aplicarIdioma(idiomaActual);
            renderBloqueados();
            console.log('🚫 Csariel\'s - Bloqueados cargado');
        });

        // Exponer funciones globales
        window.cambiarIdioma = cambiarIdioma;
        window.filtrarBloqueados = filtrarBloqueados;
        window.desbloquearUsuario = desbloquearUsuario;
        window.mostrarToast = mostrarToast;
    </script>
</body>
</html>
