<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solicitudes | Csariel's</title>
    <meta name="theme-color" content="#0F2D1A" />

    <!-- ===== RECURSOS ===== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet" />

    <style>
        /* ================================================================
           ESTILOS CSARIEL'S - SOLICITUDES
           ================================================================ */
        :root {
            --space-deep: #05080f;
            --space-mid: #0a1428;
            --verde-bosque: #0F2D1A;
            --verde-bosque-light: #1a4a2a;
            --gold-cosmic: #D4AF37;
            --gold-dim: rgba(212,175,55,0.15);
            --gold-glow: rgba(212,175,55,0.25);
            --text-primary: #e8f0f8;
            --text-secondary: #8ba3c7;
            --text-muted: #4a6a8a;
            --border: rgba(212,175,55,0.08);
            --border-glow: rgba(212,175,55,0.25);
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --success: #00b894;
            --danger: #ff3366;
            --warning: #D4AF37;
            --quantum: #00e5ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--space-deep);
            color: var(--text-primary);
            font-family: 'Space Grotesk', system-ui, sans-serif;
            min-height: 100vh;
        }

        #stars-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .nebula {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.10;
            pointer-events: none;
            z-index: 0;
            animation: nebula-drift 25s ease-in-out infinite alternate;
        }
        .nebula-1 {
            width: 700px;
            height: 700px;
            background: var(--verde-bosque);
            top: -15%;
            right: -15%;
        }
        .nebula-2 {
            width: 600px;
            height: 600px;
            background: var(--gold-cosmic);
            bottom: -15%;
            left: -15%;
            animation-delay: -8s;
            opacity: 0.05;
        }
        .nebula-3 {
            width: 500px;
            height: 500px;
            background: var(--quantum);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -15s;
            opacity: 0.04;
        }

        @keyframes nebula-drift {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(40px, -30px) scale(1.15);
            }
        }

        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: var(--space-deep);
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(var(--gold-cosmic), var(--verde-bosque));
            border-radius: 3px;
        }

        .app {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px 20px 30px;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0 16px;
            border-bottom: 2px solid var(--gold-dim);
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
            backdrop-filter: blur(10px);
            position: relative;
        }
        .header::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-cosmic), var(--verde-bosque), var(--gold-cosmic), transparent);
            opacity: 0.4;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        .logo-icon {
            font-size: 2rem;
            filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.2));
            animation: pulse-glow 3s ease-in-out infinite;
        }
        .logo-icon .hex {
            display: inline-block;
            background: var(--verde-bosque);
            color: var(--gold-cosmic);
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 900;
            border: 2px solid var(--gold-cosmic);
            font-family: 'Orbitron', monospace;
        }
        @keyframes pulse-glow {
            0%,
            100% {
                filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.2));
            }
            50% {
                filter: drop-shadow(0 0 40px rgba(212, 175, 55, 0.4));
            }
        }

        .logo-text {
            font-family: 'Orbitron', monospace;
            font-size: 1.3rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--gold-cosmic), var(--verde-bosque-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo-badge {
            font-family: 'Orbitron', monospace;
            font-size: 0.45rem;
            background: linear-gradient(135deg, var(--verde-bosque), var(--gold-cosmic));
            color: white;
            padding: 3px 12px;
            border-radius: 20px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            -webkit-text-fill-color: white;
            border: 1px solid rgba(212, 175, 55, 0.2);
            animation: badge-pulse 2s ease-in-out infinite;
        }
        @keyframes badge-pulse {
            0%,
            100% {
                box-shadow: 0 0 30px rgba(15, 45, 26, 0.3);
            }
            50% {
                box-shadow: 0 0 60px rgba(212, 175, 55, 0.2);
            }
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 16px;
            border: 1px solid var(--border);
            border-radius: 30px;
            background: rgba(212, 175, 55, 0.03);
            color: var(--text-primary);
            font-family: 'Orbitron', monospace;
            font-size: 0.6rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
        }
        .btn:hover {
            transform: scale(1.02);
            border-color: var(--border-glow);
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--verde-bosque), var(--verde-bosque-light));
            border-color: var(--gold-cosmic);
            color: var(--gold-cosmic);
            -webkit-text-fill-color: var(--gold-cosmic);
        }
        .btn-primary:hover:not(:disabled) {
            background: linear-gradient(135deg, var(--verde-bosque-light), var(--verde-bosque));
            box-shadow: 0 0 40px rgba(15, 45, 26, 0.5);
        }
        .btn-gold {
            background: linear-gradient(135deg, var(--gold-cosmic), #b8923a);
            border-color: transparent;
            color: #0a0c10;
            -webkit-text-fill-color: #0a0c10;
        }
        .btn-gold:hover:not(:disabled) {
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.3);
        }
        .btn-outline {
            border-color: var(--border);
            background: transparent;
        }
        .btn-outline:hover:not(:disabled) {
            background: rgba(212, 175, 55, 0.05);
            border-color: var(--gold-cosmic);
        }
        .btn-sm {
            padding: 4px 12px;
            font-size: 0.55rem;
        }
        .btn-success {
            background: rgba(0, 184, 148, 0.15);
            border-color: rgba(0, 184, 148, 0.3);
            color: var(--success);
        }
        .btn-success:hover:not(:disabled) {
            background: rgba(0, 184, 148, 0.25);
        }
        .btn-danger {
            background: rgba(255, 51, 102, 0.15);
            border-color: rgba(255, 51, 102, 0.3);
            color: var(--danger);
        }
        .btn-danger:hover:not(:disabled) {
            background: rgba(255, 51, 102, 0.25);
        }

        .language-selector {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            background: rgba(212, 175, 55, 0.03);
            border-radius: 16px;
            border: 1px solid rgba(212, 175, 55, 0.08);
        }
        .language-selector .lang-icon {
            font-size: 0.7rem;
            margin-right: 2px;
        }
        .lang-btn {
            padding: 2px 8px;
            border-radius: 10px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-muted);
            font-family: 'Orbitron', monospace;
            font-size: 0.45rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .lang-btn:hover {
            color: var(--text-secondary);
            background: rgba(212, 175, 55, 0.05);
        }
        .lang-btn.active {
            border-color: var(--gold-cosmic);
            background: rgba(212, 175, 55, 0.1);
            color: var(--gold-cosmic);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(212, 175, 55, 0.06);
            border: 1px solid rgba(212, 175, 55, 0.15);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.6rem;
            color: var(--gold-cosmic);
            font-family: 'Orbitron', monospace;
            backdrop-filter: blur(10px);
        }
        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            animation: quantum-pulse 1.5s ease-in-out infinite;
        }
        .status-dot.online {
            background: var(--success);
            box-shadow: 0 0 20px rgba(0, 184, 148, 0.5);
        }
        @keyframes quantum-pulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(0.7);
            }
        }

        /* ===== SOLICITUDES ===== */
        .solicitudes-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }
        .solicitudes-header h2 {
            font-family: 'Orbitron', monospace;
            font-size: 1rem;
            color: var(--text-secondary);
        }
        .solicitudes-header h2 i {
            color: var(--gold-cosmic);
        }
        .solicitudes-header .badge-total {
            background: var(--gold-cosmic);
            color: var(--space-deep);
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.6rem;
            font-weight: 700;
            font-family: 'Orbitron', monospace;
        }

        .solicitudes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 12px;
        }

        .solicitud-card {
            background: rgba(15, 45, 26, 0.15);
            border: 1px solid var(--gold-dim);
            border-radius: var(--radius);
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: var(--transition);
        }
        .solicitud-card:hover {
            border-color: var(--border-glow);
            background: rgba(15, 45, 26, 0.25);
            transform: translateY(-2px);
        }
        .solicitud-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--verde-bosque), var(--gold-cosmic));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: white;
            font-size: 1rem;
            flex-shrink: 0;
            position: relative;
        }
        .solicitud-avatar .online-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid var(--space-deep);
        }
        .solicitud-avatar .online-dot.online {
            background: var(--success);
        }
        .solicitud-avatar .online-dot.offline {
            background: var(--text-muted);
        }

        .solicitud-info {
            flex: 1;
            min-width: 0;
        }
        .solicitud-nombre {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-primary);
        }
        .solicitud-username {
            font-size: 0.6rem;
            color: var(--text-muted);
        }
        .solicitud-mensaje {
            font-size: 0.55rem;
            color: var(--text-secondary);
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .solicitud-mensaje i {
            font-size: 0.4rem;
            color: var(--gold-cosmic);
        }
        .solicitud-tiempo {
            font-size: 0.45rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .solicitud-acciones {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
            flex-direction: column;
        }
        .solicitud-acciones .btn {
            padding: 4px 10px;
            font-size: 0.45rem;
            border-radius: 20px;
            justify-content: center;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            grid-column: 1/-1;
        }
        .empty-state .icon {
            font-size: 3rem;
            opacity: 0.3;
            margin-bottom: 8px;
        }
        .empty-state h3 {
            font-family: 'Orbitron', monospace;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .empty-state p {
            font-size: 0.65rem;
        }

        /* ===== TABS SOLICITUDES ===== */
        .tabs-solicitudes {
            display: flex;
            gap: 4px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .tab-sol {
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid var(--gold-dim);
            background: transparent;
            color: var(--text-muted);
            font-family: 'Orbitron', monospace;
            font-size: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }
        .tab-sol:hover {
            border-color: var(--gold-cosmic);
            color: var(--text-secondary);
        }
        .tab-sol.active {
            background: rgba(212, 175, 55, 0.1);
            border-color: var(--gold-cosmic);
            color: var(--gold-cosmic);
        }
        .tab-sol .badge {
            background: var(--danger);
            color: white;
            padding: 1px 8px;
            border-radius: 10px;
            font-size: 0.4rem;
            margin-left: 4px;
        }

        /* ===== FOOTER ===== */
        .footer {
            margin-top: 24px;
            padding-top: 14px;
            border-top: 1px solid var(--gold-dim);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            position: relative;
        }
        .footer::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-cosmic), transparent);
            opacity: 0.2;
        }
        .footer-text {
            color: var(--text-muted);
            font-size: 0.5rem;
            letter-spacing: 0.5px;
            font-family: 'Orbitron', monospace;
        }
        .footer-text .brand {
            color: var(--gold-cosmic);
        }
        .footer-links {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.5rem;
            transition: var(--transition);
            font-family: 'Orbitron', monospace;
            letter-spacing: 0.5px;
        }
        .footer-links a:hover {
            color: var(--gold-cosmic);
        }
        .footer-hex {
            display: inline-block;
            background: var(--verde-bosque);
            color: var(--gold-cosmic);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.45rem;
            font-weight: 700;
            border: 1px solid var(--gold-cosmic);
            font-family: 'Orbitron', monospace;
        }

        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--verde-bosque);
            color: var(--gold-cosmic);
            padding: 10px 20px;
            border-radius: var(--radius);
            font-weight: 600;
            font-size: 0.7rem;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 5000;
            pointer-events: none;
            font-family: 'Orbitron', monospace;
            border: 1px solid rgba(212, 175, 55, 0.15);
            max-width: 90%;
            text-align: center;
        }
        .toast.active {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.error {
            background: var(--danger);
            color: white;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            .header-actions {
                width: 100%;
                justify-content: flex-start;
                flex-wrap: wrap;
            }
            .solicitudes-grid {
                grid-template-columns: 1fr;
            }
            .solicitud-acciones {
                flex-direction: row;
            }
        }

        @media (max-width: 480px) {
            .btn {
                font-size: 0.45rem;
                padding: 4px 8px;
            }
            .solicitud-avatar {
                width: 36px;
                height: 36px;
                font-size: 0.7rem;
            }
            .solicitud-nombre {
                font-size: 0.7rem;
            }
            .tab-sol {
                font-size: 0.4rem;
                padding: 4px 10px;
            }
        }
    </style>
</head>
<body>
    <!-- ===== FONDO ESTELAR ===== -->
    <canvas id="stars-canvas"></canvas>
    <div class="nebula nebula-1"></div>
    <div class="nebula nebula-2"></div>
    <div class="nebula nebula-3"></div>

    <div class="app">

        <!-- ===== HEADER ===== -->
        <header class="header">
            <a href="../index.html" class="logo">
                <span class="logo-icon"><span class="hex">◈</span></span>
                <span class="logo-text">Csariel's</span>
                <span class="logo-badge">Solicitudes</span>
            </a>
            <div class="header-actions">
                <div class="language-selector">
                    <span class="lang-icon">🌐</span>
                    <button class="lang-btn active" onclick="cambiarIdioma('es')">ES</button>
                    <button class="lang-btn" onclick="cambiarIdioma('en')">EN</button>
                    <button class="lang-btn" onclick="cambiarIdioma('fr')">FR</button>
                </div>

                <div class="status-badge">
                    <span class="status-dot online"></span>
                    <span>En línea</span>
                </div>

                <a href="../index.html" class="btn btn-outline btn-sm">
                    <i class="fas fa-arrow-left"></i> Volver
                </a>
                <a href="../contactos/index.html" class="btn btn-outline btn-sm">
                    <i class="fas fa-users"></i> Contactos
                </a>
            </div>
        </header>

        <!-- ===== SOLICITUDES ===== -->
        <div class="solicitudes-header">
            <h2><i class="fas fa-bell"></i> Solicitudes <span class="badge-total" id="totalSolicitudes">3</span></h2>
            <div>
                <button class="btn btn-primary btn-sm" onclick="mostrarToast('📬 Todas las solicitudes')">
                    <i class="fas fa-check-double"></i> Marcar todas
                </button>
            </div>
        </div>

        <!-- ===== TABS ===== -->
        <div class="tabs-solicitudes">
            <button class="tab-sol active" data-tab="recibidas" onclick="cambiarTabSol('recibidas')">
                📩 Recibidas <span class="badge" id="badgeRecibidas">3</span>
            </button>
            <button class="tab-sol" data-tab="enviadas" onclick="cambiarTabSol('enviadas')">
                📤 Enviadas <span class="badge" id="badgeEnviadas">1</span>
            </button>
            <button class="tab-sol" data-tab="pendientes" onclick="cambiarTabSol('pendientes')">
                ⏳ Pendientes <span class="badge" id="badgePendientes">2</span>
            </button>
        </div>

        <!-- ===== GRID DE SOLICITUDES ===== -->
        <div class="solicitudes-grid" id="solicitudesGrid">
            <!-- Renderizado con JavaScript -->
        </div>

        <!-- ===== FOOTER ===== -->
        <footer class="footer">
            <span class="footer-text">
                <span class="brand">◈ Csariel's</span> — Solicitudes · Conecta · Comparte
            </span>
            <div class="footer-links">
                <a href="../index.html">🏠 Red</a>
                <a href="../contactos/index.html">👥 Contactos</a>
                <a href="../perfil/index.html">👤 Perfil</a>
                <a href="../chat/index.html">💬 Chat</a>
                <span class="footer-hex">◈</span>
            </div>
        </footer>
    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast"></div>

    <!-- ================================================================ -->
    <!-- SCRIPTS -->
    <!-- ================================================================ -->
    <script>
        // ================================================================
        // 🌟 ESTRELLAS
        // ================================================================
        (function initStars() {
            const canvas = document.getElementById('stars-canvas');
            const ctx = canvas.getContext('2d');
            let w, h;

            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }
            resize();

            const stars = Array.from({ length: 200 }, () => ({
                x: Math.random() * w,
                y: Math.random() * h,
                r: Math.random() * 0.8 + 0.2,
                o: Math.random() * 0.8 + 0.2,
                speed: Math.random() * 0.005 + 0.002,
                phase: Math.random() * Math.PI * 2
            }));

            function draw() {
                ctx.clearRect(0, 0, w, h);
                stars.forEach(s => {
                    const opacity = s.o * (0.6 + 0.4 * Math.sin(s.phase));
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, 2 * Math.PI);
                    ctx.fillStyle = `rgba(255,255,255,${opacity})`;
                    ctx.fill();
                    s.y += s.speed;
                    s.phase += 0.01;
                    if (s.y > h) { s.y = 0;
                        s.x = Math.random() * w; }
                });
                requestAnimationFrame(draw);
            }
            draw();

            window.addEventListener('resize', () => {
                resize();
                stars.forEach(s => { s.x = Math.random() * w;
                    s.y = Math.random() * h; });
            });
        })();

        // ================================================================
        // 🌐 IDIOMAS
        // ================================================================
        const traducciones = {
            es: {
                'solicitudes': 'Solicitudes',
                'en_linea': 'En línea',
                'volver': 'Volver',
                'contactos': 'Contactos',
                'recibidas': '📩 Recibidas',
                'enviadas': '📤 Enviadas',
                'pendientes': '⏳ Pendientes',
                'marcar_todas': 'Marcar todas',
                'sin_solicitudes': '📭 Sin solicitudes',
                'sin_solicitudes_desc': 'No tienes solicitudes pendientes.',
                'aceptar': 'Aceptar',
                'rechazar': 'Rechazar',
                'cancelar': 'Cancelar',
                'mensaje': '📝 Te envió un mensaje:'
            },
            en: {
                'solicitudes': 'Requests',
                'en_linea': 'Online',
                'volver': 'Back',
                'contactos': 'Contacts',
                'recibidas': '📩 Received',
                'enviadas': '📤 Sent',
                'pendientes': '⏳ Pending',
                'marcar_todas': 'Mark all',
                'sin_solicitudes': '📭 No requests',
                'sin_solicitudes_desc': 'You have no pending requests.',
                'aceptar': 'Accept',
                'rechazar': 'Decline',
                'cancelar': 'Cancel',
                'mensaje': '📝 Sent you a message:'
            },
            fr: {
                'solicitudes': 'Demandes',
                'en_linea': 'En ligne',
                'volver': 'Retour',
                'contactos': 'Contacts',
                'recibidas': '📩 Reçues',
                'enviadas': '📤 Envoyées',
                'pendientes': '⏳ En attente',
                'marcar_todas': 'Tout marquer',
                'sin_solicitudes': '📭 Aucune demande',
                'sin_solicitudes_desc': 'Vous n\'avez pas de demandes en attente.',
                'aceptar': 'Accepter',
                'rechazar': 'Refuser',
                'cancelar': 'Annuler',
                'mensaje': '📝 Vous a envoyé un message:'
            }
        };

        let idiomaActual = localStorage.getItem('csariels_idioma') || 'es';
        let tabActual = 'recibidas';

        function aplicarIdioma(idioma) {
            const t = traducciones[idioma] || traducciones.es;
            document.querySelector('.logo-badge').textContent = t.solicitudes;
            document.querySelector('.status-badge span:last-child').textContent = t.en_linea;
            document.querySelector('.solicitudes-header h2').innerHTML =
                `<i class="fas fa-bell"></i> ${t.solicitudes} <span class="badge-total" id="totalSolicitudes">3</span>`;
            document.querySelector('.solicitudes-header .btn span:last-child').textContent = t.marcar_todas;

            document.querySelectorAll('.tab-sol').forEach(b => {
                const key = b.dataset.tab;
                if (key === 'recibidas') b.innerHTML = `${t.recibidas} <span class="badge" id="badgeRecibidas">3</span>`;
                if (key === 'enviadas') b.innerHTML = `${t.enviadas} <span class="badge" id="badgeEnviadas">1</span>`;
                if (key === 'pendientes') b.innerHTML = `${t.pendientes} <span class="badge" id="badgePendientes">2</span>`;
            });
        }

        function cambiarIdioma(idioma) {
            idiomaActual = idioma;
            localStorage.setItem('csariels_idioma', idioma);
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`.lang-btn[onclick="cambiarIdioma('${idioma}')"]`).classList.add('active');
            aplicarIdioma(idioma);
            renderSolicitudes();
            mostrarToast(`🌐 ${idioma.toUpperCase()}`);
        }

        // ================================================================
        // 📋 DATOS DE SOLICITUDES
        // ================================================================
        let solicitudes = [{
            id: 1,
            nombre: 'Carlos Ruiz',
            username: 'carlos_dev',
            online: true,
            mensaje: 'Hola, me encantaría conectar contigo',
            tiempo: 'Hace 2 horas',
            tipo: 'recibida',
            estado: 'pendiente'
        }, {
            id: 2,
            nombre: 'Ana Martínez',
            username: 'ana_space',
            online: true,
            mensaje: '¡Hola! Vi tu perfil y me interesa tu trabajo',
            tiempo: 'Hace 4 horas',
            tipo: 'recibida',
            estado: 'pendiente'
        }, {
            id: 3,
            nombre: 'Patricia López',
            username: 'paty_creator',
            online: false,
            mensaje: '¿Te gustaría colaborar en un proyecto?',
            tiempo: 'Hace 1 día',
            tipo: 'recibida',
            estado: 'pendiente'
        }, {
            id: 4,
            nombre: 'Roberto Fernández',
            username: 'roberto_quantum',
            online: false,
            mensaje: 'Gracias por la solicitud',
            tiempo: 'Hace 2 días',
            tipo: 'enviada',
            estado: 'pendiente'
        }, {
            id: 5,
            nombre: 'Miguel Ángel',
            username: 'mike_tech',
            online: true,
            mensaje: '¡Claro! Con gusto',
            tiempo: 'Hace 3 días',
            tipo: 'enviada',
            estado: 'aceptada'
        }];

        // ================================================================
        // 🖥️ RENDERIZAR SOLICITUDES
        // ================================================================
        function renderSolicitudes() {
            const grid = document.getElementById('solicitudesGrid');
            const t = traducciones[idiomaActual] || traducciones.es;

            let filtradas = solicitudes.filter(s => s.tipo === tabActual);

            if (tabActual === 'recibidas') {
                filtradas = filtradas.filter(s => s.estado === 'pendiente');
            } else if (tabActual === 'pendientes') {
                filtradas = solicitudes.filter(s => s.estado === 'pendiente');
            } else if (tabActual === 'enviadas') {
                filtradas = solicitudes.filter(s => s.tipo === 'enviada');
            }

            // Actualizar badges
            const recibidas = solicitudes.filter(s => s.tipo === 'recibida' && s.estado === 'pendiente').length;
            const enviadas = solicitudes.filter(s => s.tipo === 'enviada').length;
            const pendientes = solicitudes.filter(s => s.estado === 'pendiente').length;

            document.getElementById('totalSolicitudes').textContent = recibidas;
            document.getElementById('badgeRecibidas').textContent = recibidas;
            document.getElementById('badgeEnviadas').textContent = enviadas;
            document.getElementById('badgePendientes').textContent = pendientes;

            if (filtradas.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <h3>${t.sin_solicitudes}</h3>
                        <p>${t.sin_solicitudes_desc}</p>
                        <a href="../descubrir/index.html" class="btn btn-primary btn-sm" style="margin-top:8px;">
                            <i class="fas fa-compass"></i> Descubrir personas
                        </a>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtradas.map(s => {
                const esRecibida = s.tipo === 'recibida';
                return `
                    <div class="solicitud-card" data-id="${s.id}">
                        <div class="solicitud-avatar" onclick="verPerfil('${s.id}')">
                            ${s.nombre.charAt(0)}
                            <span class="online-dot ${s.online ? 'online' : 'offline'}"></span>
                        </div>
                        <div class="solicitud-info">
                            <div class="solicitud-nombre">${s.nombre}</div>
                            <div class="solicitud-username">@${s.username}</div>
                            <div class="solicitud-mensaje">
                                <i class="fas fa-quote-left"></i> ${s.mensaje}
                            </div>
                            <div class="solicitud-tiempo">${s.tiempo}</div>
                        </div>
                        <div class="solicitud-acciones">
                            ${esRecibida ? `
                                <button class="btn btn-success btn-sm" onclick="aceptarSolicitud(${s.id})">
                                    <i class="fas fa-check"></i> ${t.aceptar}
                                </button>
                                <button class="btn btn-danger btn-sm" onclick="rechazarSolicitud(${s.id})">
                                    <i class="fas fa-times"></i> ${t.rechazar}
                                </button>
                            ` : `
                                <button class="btn btn-outline btn-sm" onclick="cancelarSolicitud(${s.id})">
                                    <i class="fas fa-undo"></i> ${t.cancelar}
                                </button>
                                <span style="font-size:0.45rem;color:var(--text-muted);text-align:center;">
                                    ${s.estado === 'aceptada' ? '✅ Aceptada' : '⏳ Pendiente'}
                                </span>
                            `}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ================================================================
        // 🎯 ACCIONES
        // ================================================================
        function cambiarTabSol(tab) {
            tabActual = tab;
            document.querySelectorAll('.tab-sol').forEach(b => b.classList.remove('active'));
            document.querySelector(`.tab-sol[data-tab="${tab}"]`).classList.add('active');
            renderSolicitudes();
        }

        function aceptarSolicitud(id) {
            const sol = solicitudes.find(s => s.id === id);
            if (!sol) return;
            sol.estado = 'aceptada';
            mostrarToast(`✅ Aceptaste la solicitud de ${sol.nombre}`);
            renderSolicitudes();
        }

        function rechazarSolicitud(id) {
            const sol = solicitudes.find(s => s.id === id);
            if (!sol) return;
            solicitudes = solicitudes.filter(s => s.id !== id);
            mostrarToast(`❌ Rechazaste la solicitud de ${sol.nombre}`);
            renderSolicitudes();
        }

        function cancelarSolicitud(id) {
            const sol = solicitudes.find(s => s.id === id);
            if (!sol) return;
            solicitudes = solicitudes.filter(s => s.id !== id);
            mostrarToast(`↩️ Cancelaste la solicitud a ${sol.nombre}`);
            renderSolicitudes();
        }

        function verPerfil(id) {
            const sol = solicitudes.find(s => s.id === id);
            if (sol) {
                mostrarToast(`👤 Perfil de ${sol.nombre}`);
                // window.location.href = `../perfil/index.html?user=${sol.id}`;
            }
        }

        // ================================================================
        // 🔔 TOAST
        // ================================================================
        let toastTimeout;

        function mostrarToast(mensaje, tipo = '') {
            const toast = document.getElementById('toast');
            toast.textContent = mensaje;
            toast.className = 'toast active';
            if (tipo === 'error') toast.classList.add('error');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.remove('active'), 3000);
        }

        // ================================================================
        // 🚀 INICIALIZAR
        // ================================================================
        document.addEventListener('DOMContentLoaded', () => {
            aplicarIdioma(idiomaActual);
            renderSolicitudes();
            console.log('📬 Csariel\'s - Solicitudes cargado');
        });

        // Exponer funciones globales
        window.cambiarIdioma = cambiarIdioma;
        window.cambiarTabSol = cambiarTabSol;
        window.aceptarSolicitud = aceptarSolicitud;
        window.rechazarSolicitud = rechazarSolicitud;
        window.cancelarSolicitud = cancelarSolicitud;
        window.verPerfil = verPerfil;
        window.mostrarToast = mostrarToast;
    </script>
</body>
</html>
