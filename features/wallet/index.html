            z-index: 0;

        .nebula-3 { width: 500px; height: 500px; background: var(--quantum); top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: -15s; opacity: 0.04; }

        @keyframes nebula-drift {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, -30px) scale(1.15); }

        ::-webkit-scrollbar { width: 5px; }

            max-width: 1200px;

        .logo {

        .logo-icon { font-size: 2rem; filter: drop-shadow(0 0 20px rgba(212,175,55,0.2)); animation: pulse-glow 3s ease-in-out infinite; }
        .logo-icon .hex {

        .logo-text {

    <script>
        // ================================================================
        // ESTRELLAS
        // ================================================================
        function initStars() {
            const canvas = document.getElementById('stars-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let width, height;
            let stars = [];
            const STAR_COUNT = 200;

            function resize() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
            }
            function createStars() {
                stars = [];
                for (let i = 0; i < STAR_COUNT; i++) {
                    stars.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        radius: Math.random() * 1.5 + 0.3,
                        speed: Math.random() * 0.015 + 0.005,
                        opacity: Math.random() * 0.7 + 0.3,
                        twinkleSpeed: Math.random() * 0.02 + 0.01,
                        twinklePhase: Math.random() * Math.PI * 2
                    });
                }
            }
            function draw() {
                ctx.clearRect(0, 0, width, height);
                for (let star of stars) {
                    const opacity = star.opacity * (0.6 + 0.4 * Math.sin(star.twinklePhase));
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
                    ctx.fill();
                    star.twinklePhase += star.twinkleSpeed;
                    star.y += star.speed;
                    if (star.y > height) {
                        star.y = 0;
                        star.x = Math.random() * width;
                    }
                }
                requestAnimationFrame(draw);
            }
            resize();
            createStars();
            draw();
            window.addEventListener('resize', () => { resize(); createStars(); });
        }

        // ================================================================
        // WALLET (FUNCIONALIDAD BÁSICA)
        // ================================================================
        let walletAddress = localStorage.getItem('csariels_wallet') || null;
        let balanceCMT = 0;

        function cargarSaldo() {
            const stored = localStorage.getItem('csariels_cmt_balance');
            if (stored) {
                balanceCMT = parseFloat(stored);
            } else {
                balanceCMT = 0;
                localStorage.setItem('csariels_cmt_balance', '0');
            }
            document.getElementById('userBalance').innerHTML = balanceCMT.toFixed(2) + ' <small>CMT</small>';
            if (walletAddress) {
                document.getElementById('walletAddress').textContent = walletAddress.slice(0,6) + '...' + walletAddress.slice(-4);
            }
        }

        function recargarSaldo() {
            const monto = prompt('¿Cuántos CMT quieres recargar? (mínimo 1)', '10');
            if (!monto) return;
            const cantidad = parseFloat(monto);
            if (isNaN(cantidad) || cantidad <= 0) {
                alert('⚠️ Ingresa un número válido');
                return;
            }
            balanceCMT += cantidad;
            localStorage.setItem('csariels_cmt_balance', balanceCMT.toString());
            cargarSaldo();
            alert('✅ Recarga exitosa! Nuevo saldo: ' + balanceCMT.toFixed(2) + ' CMT');
        }

        function retirarSaldo() {
            const monto = prompt('¿Cuántos CMT quieres retirar?', '5');
            if (!monto) return;
            const cantidad = parseFloat(monto);
            if (isNaN(cantidad) || cantidad <= 0) {
                alert('⚠️ Ingresa un número válido');
                return;
            }
            if (cantidad > balanceCMT) {
                alert('⚠️ Saldo insuficiente. Tienes ' + balanceCMT.toFixed(2) + ' CMT');
                return;
            }
            balanceCMT -= cantidad;
            localStorage.setItem('csariels_cmt_balance', balanceCMT.toString());
            cargarSaldo();
            alert('✅ Retiro exitoso! Nuevo saldo: ' + balanceCMT.toFixed(2) + ' CMT');
        }

        async function conectarWallet() {
            if (typeof window.ethereum !== 'undefined') {
                try {
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    walletAddress = accounts[0];
                    localStorage.setItem('csariels_wallet', walletAddress);
                    document.getElementById('walletAddress').textContent = walletAddress.slice(0,6) + '...' + walletAddress.slice(-4);
                    alert('🦊 Wallet conectada');
                } catch (e) {
                    alert('❌ Error al conectar MetaMask');
                }
            } else {
                alert('⚠️ Instala MetaMask para conectar tu wallet');
            }
        }

        // ================================================================
        // INICIO
        // ================================================================
        document.addEventListener('DOMContentLoaded', function() {
            initStars();
            cargarSaldo();
            if (!walletAddress) {
                const addressEl = document.getElementById('walletAddress');
                addressEl.innerHTML = '<button onclick="conectarWallet()" style="background:rgba(212,175,55,0.15);border:1px solid var(--gold-cosmic);color:var(--gold-cosmic);padding:4px 16px;border-radius:20px;cursor:pointer;font-family:Orbitron;font-size:0.6rem;">🦊 Conectar MetaMask</button>';
            }
            console.log('◈ Csariel\'s - Wallet (conectada al ecosistema)');
        });

        window.recargarSaldo = recargarSaldo;
        window.retirarSaldo = retirarSaldo;
        window.conectarWallet = conectarWallet;
    </script>
</body>
</html>
