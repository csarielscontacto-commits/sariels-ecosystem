<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="titulo_wallet">◈ Wallet CMT | Csariel's</title>

        font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet" />

    <!-- ===== CONECTORES ===== -->
    <script src="/js/client-config-loader.js"></script>
    <script src="/js/security.js"></script>
    <script src="/js/perfil-connector.js"></script>
    <script src="/js/red-main.js"></script>

    <style>
        /* ================================================================
           PLANTILLA IDÉNTICA A CSARIEL'S
           ================================================================ */
        :root {
            --space-deep: #05080f;
            --space-mid: #0a1428;
            --verde-bosque: #0F2D1A;
            --verde-bosque-light: #1a4a2a;
            --gold-cosmic: #D4AF37;
            --gold-dim: rgba(212,175,55,0.15);
            --gold-glow: rgba(212,175,55,0.25);
            --text-primary: #e8f0f8;
            --text-secondary: #8ba3c7;
            --text-muted: #4a6a8a;
            --border: rgba(212,175,55,0.08);
            --border-glow: rgba(212,175,55,0.25);
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --success: #00b894;
            --danger: #ff3366;
            --warning: #D4AF37;
            --quantum: #00e5ff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            background: var(--space-deep);
            color: var(--text-primary);
            font-family: 'Space Grotesk', 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        #stars-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .nebula {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.10;
            pointer-events: none;
            z-index: 0;
            animation: nebula-drift 25s ease-in-out infinite alternate;
        }
        .nebula-1 { width: 700px; height: 700px; background: var(--verde-bosque); top: -15%; right: -15%; }
        .nebula-2 { width: 600px; height: 600px; background: var(--gold-cosmic); bottom: -15%; left: -15%; animation-delay: -8s; opacity: 0.05; }
        .nebula-3 { width: 500px; height: 500px; background: var(--quantum); top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: -15s; opacity: 0.04; }

        @keyframes nebula-drift {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, -30px) scale(1.15); }
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: var(--space-deep); }
        ::-webkit-scrollbar-thumb { background: linear-gradient(var(--gold-cosmic), var(--verde-bosque)); border-radius: 3px; }

        .app {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px 20px 30px;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0 16px;
            border-bottom: 2px solid var(--gold-dim);
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
            backdrop-filter: blur(10px);
            position: relative;
        }
        .header::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-cosmic), var(--verde-bosque), var(--gold-cosmic), transparent);
            opacity: 0.4;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        .logo-icon { font-size: 2rem; filter: drop-shadow(0 0 20px rgba(212,175,55,0.2)); animation: pulse-glow 3s ease-in-out infinite; }
        .logo-icon .hex {
            display: inline-block;
            background: var(--verde-bosque);
            color: var(--gold-cosmic);
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 900;
            border: 2px solid var(--gold-cosmic);
            font-family: 'Orbitron', monospace;
        }
        @keyframes pulse-glow { 0%, 100% { filter: drop-shadow(0 0 20px rgba(212,175,55,0.2)); } 50% { filter: drop-shadow(0 0 40px rgba(212,175,55,0.4)); } }

        .logo-text {
            font-family: 'Orbitron', monospace;
            font-size: 1.3rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--gold-cosmic), var(--verde-bosque-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo-badge {
            font-family: 'Orbitron', monospace;
            font-size: 0.45rem;
            background: linear-gradient(135deg, var(--verde-bosque), var(--gold-cosmic));
            color: white;
            padding: 3px 12px;
            border-radius: 20px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            -webkit-text-fill-color: white;
            border: 1px solid rgba(212,175,55,0.2);
            animation: badge-pulse 2s ease-in-out infinite;
        }
        @keyframes badge-pulse { 0%, 100% { box-shadow: 0 0 30px rgba(15,45,26,0.3); } 50% { box-shadow: 0 0 60px rgba(212,175,55,0.2); } }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 16px;
            border: 1px solid var(--border);
            border-radius: 30px;
            background: rgba(212,175,55,0.03);
            color: var(--text-primary);
            font-family: 'Orbitron', monospace;
            font-size: 0.6rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
        }
        .btn:hover { transform: scale(1.02); border-color: var(--border-glow); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }

        .btn-primary {
            background: linear-gradient(135deg, var(--verde-bosque), var(--verde-bosque-light));
            border-color: var(--gold-cosmic);
            color: var(--gold-cosmic);
            -webkit-text-fill-color: var(--gold-cosmic);
        }
        .btn-primary:hover:not(:disabled) {
            background: linear-gradient(135deg, var(--verde-bosque-light), var(--verde-bosque));
            box-shadow: 0 0 40px rgba(15,45,26,0.5);
        }
        .btn-gold {
            background: linear-gradient(135deg, var(--gold-cosmic), #b8923a);
            border-color: transparent;
            color: #0a0c10;
            -webkit-text-fill-color: #0a0c10;
        }
        .btn-gold:hover:not(:disabled) { box-shadow: 0 0 40px rgba(212,175,55,0.3); }
        .btn-outline { border-color: var(--border); background: transparent; }
        .btn-outline:hover:not(:disabled) { background: rgba(212,175,55,0.05); border-color: var(--gold-cosmic); }
        .btn-sm { padding: 4px 12px; font-size: 0.55rem; }
        .btn-danger {
            background: rgba(255,51,102,0.15);
            border-color: rgba(255,51,102,0.3);
            color: var(--danger);
        }
        .btn-danger:hover:not(:disabled) { background: rgba(255,51,102,0.25); }
        .btn-trading {
            background: linear-gradient(135deg, var(--quantum), #0099ff);
            border-color: transparent;
            color: #0a0c10;
            -webkit-text-fill-color: #0a0c10;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.2);
            animation: pulse-trading 2s ease-in-out infinite;
        }
        .btn-trading:hover {
            box-shadow: 0 0 40px rgba(0, 229, 255, 0.4);
            transform: scale(1.03);
        }
        @keyframes pulse-trading {
            0%, 100% { box-shadow: 0 0 20px rgba(0, 229, 255, 0.2); }
            50% { box-shadow: 0 0 40px rgba(0, 229, 255, 0.4); }
        }
        .btn-internet {
            background: linear-gradient(135deg, var(--gold-cosmic), #00d68f);
            border-color: transparent;
            color: #0a0c10;
            -webkit-text-fill-color: #0a0c10;
            box-shadow: 0 0 20px rgba(0, 214, 143, 0.2);
            animation: pulse-internet 2s ease-in-out infinite;
        }
        .btn-internet:hover {
            box-shadow: 0 0 40px rgba(0, 214, 143, 0.4);
            transform: scale(1.03);
        }
        @keyframes pulse-internet {
            0%, 100% { box-shadow: 0 0 20px rgba(0, 214, 143, 0.2); }
            50% { box-shadow: 0 0 40px rgba(0, 214, 143, 0.4); }
        }

        .btn-tienda {
            background: linear-gradient(135deg, #a855f7, #7c3aed);
            border-color: transparent;
            color: #fff;
            -webkit-text-fill-color: #fff;
            box-shadow: 0 0 20px rgba(168,85,247,0.2);
            animation: pulse-tienda 2s ease-in-out infinite;
        }
        .btn-tienda:hover {
            box-shadow: 0 0 40px rgba(168,85,247,0.4);
            transform: scale(1.03);
        }
        @keyframes pulse-tienda {
            0%, 100% { box-shadow: 0 0 20px rgba(168,85,247,0.2); }
            50% { box-shadow: 0 0 40px rgba(168,85,247,0.4); }
        }

        .btn-wallet {
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            border-color: transparent;
            color: #0a0c10;
            -webkit-text-fill-color: #0a0c10;
            box-shadow: 0 0 20px rgba(0,212,255,0.2);
            animation: pulse-wallet 2s ease-in-out infinite;
        }
        .btn-wallet:hover {
            box-shadow: 0 0 40px rgba(0,212,255,0.4);
            transform: scale(1.03);
        }
        @keyframes pulse-wallet {
            0%, 100% { box-shadow: 0 0 20px rgba(0,212,255,0.2); }
            50% { box-shadow: 0 0 40px rgba(0,212,255,0.4); }
        }

        /* ===== SELECTOR DE IDIOMA ===== */
        .language-selector {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            background: rgba(212,175,55,0.03);
            border-radius: 16px;
            border: 1px solid rgba(212,175,55,0.08);
        }
        .language-selector .lang-icon { font-size: 0.7rem; margin-right: 2px; }
        .lang-btn {
            padding: 2px 8px;
            border-radius: 10px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-muted);
            font-family: 'Orbitron', monospace;
            font-size: 0.45rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .lang-btn:hover { color: var(--text-secondary); background: rgba(212,175,55,0.05); }
        .lang-btn.active { border-color: var(--gold-cosmic); background: rgba(212,175,55,0.1); color: var(--gold-cosmic); }

        /* ================================================================
           ESTILOS PROPIOS DE LA WALLET
           ================================================================ */
        .wallet-container {
            background: rgba(15,45,26,0.25);
            border: 1px solid var(--gold-dim);
            border-radius: var(--radius);
            padding: 28px 24px;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
            max-width: 480px;
            margin: 0 auto;
        }
        .wallet-container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(135deg, var(--gold-cosmic), var(--verde-bosque), var(--gold-cosmic));
            background-size: 300% 300%;
            border-radius: var(--radius);
            z-index: -1;
            opacity: 0.08;
            animation: border-flow 4s ease-in-out infinite;
        }
        @keyframes border-flow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .wallet-card {
            background: linear-gradient(145deg, rgba(11,61,46,0.8), rgba(5,8,15,0.9));
            border: 1.5px solid var(--gold-cosmic);
            border-radius: 22px;
            padding: 24px 20px;
            text-align: center;
        }
        .wallet-card .label {
            font-family: 'Orbitron', monospace;
            color: var(--gold-cosmic);
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }
        .wallet-card .balance {
            font-size: 2.4rem;
            font-weight: 800;
            color: var(--gold-cosmic);
            font-family: 'Orbitron', monospace;
        }
        .wallet-card .balance small {
            font-size: 1rem;
            font-weight: 400;
            color: var(--text-muted);
        }

        .wallet-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .wallet-actions .btn-action {
            flex: 1;
            padding: 12px;
            border-radius: 30px;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            font-size: 0.8rem;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
        }
        .wallet-actions .btn-action.recargar {
            background: linear-gradient(135deg, var(--gold-cosmic), #b8923a);
            color: #000;
        }
        .wallet-actions .btn-action.recargar:hover { transform: scale(1.02); box-shadow: 0 0 30px rgba(212,175,55,0.3); }
        .wallet-actions .btn-action.retirar {
            background: rgba(255,51,102,0.15);
            border: 1px solid var(--danger);
            color: var(--danger);
        }
        .wallet-actions .btn-action.retirar:hover { background: rgba(255,51,102,0.25); }

        .wallet-info {
            text-align: center;
            margin-top: 20px;
            font-size: 0.7rem;
            color: var(--text-muted);
            font-family: 'Orbitron', monospace;
        }
        .wallet-info .address {
            color: var(--text-secondary);
            font-size: 0.6rem;
            word-break: break-all;
            background: rgba(0,0,0,0.2);
            padding: 6px 12px;
            border-radius: 8px;
            margin-top: 4px;
        }

        /* ===== FOOTER ===== */
        .footer {
            margin-top: 24px;
            padding-top: 14px;
            border-top: 1px solid var(--gold-dim);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            position: relative;
        }
        .footer::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-cosmic), transparent);
            opacity: 0.2;
        }
        .footer-text {
            color: var(--text-muted);
            font-size: 0.5rem;
            letter-spacing: 0.5px;
            font-family: 'Orbitron', monospace;
        }
        .footer-text .brand { color: var(--gold-cosmic); }
        .footer-links { display: flex; gap: 8px; flex-wrap: wrap; }
        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.5rem;
            transition: var(--transition);
            font-family: 'Orbitron', monospace;
            letter-spacing: 0.5px;
        }
        .footer-links a:hover { color: var(--gold-cosmic); }
        .footer-hex {
            display: inline-block;
            background: var(--verde-bosque);
            color: var(--gold-cosmic);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.45rem;
            font-weight: 700;
            border: 1px solid var(--gold-cosmic);
            font-family: 'Orbitron', monospace;
        }

        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--verde-bosque);
            color: var(--gold-cosmic);
            padding: 10px 20px;
            border-radius: var(--radius);
            font-weight: 600;
            font-size: 0.7rem;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 5000;
            pointer-events: none;
            font-family: 'Orbitron', monospace;
            border: 1px solid rgba(212,175,55,0.15);
            max-width: 90%;
            text-align: center;
        }
        .toast.active { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.error { background: var(--danger); color: white; }

        @media (max-width: 768px) {
            .header { flex-direction: column; align-items: flex-start; }
            .header-actions { width: 100%; justify-content: flex-start; flex-wrap: wrap; }
            .wallet-actions { flex-direction: column; }
        }
        @media (max-width: 480px) {
            .btn { font-size: 0.45rem; padding: 4px 8px; }
            .wallet-card .balance { font-size: 1.8rem; }
        }
    </style>
</head>

    <div class="nebula nebula-1"></div>

    <div class="app">

        <!-- ===== CONTENIDO DE LA WALLET ===== -->

        <!-- ===== FOOTER ===== -->
        <footer class="footer">
            <span class="footer-text">
                <span class="brand">◈ Csariel's</span> — <span data-i18n="footer_wallet">Wallet · Gestión de CMT</span>
            </span>
            <div class="footer-links">
                <a href="/" data-i18n="inicio">🏠 Inicio</a>
                <a href="/features/red/index.html" data-i18n="mi_red">👥 Mi Red</a>
                <a href="/features/live/index.html" data-i18n="live">📹 Live</a>
                <a href="/features/foro/index.html" data-i18n="foro">💬 Foro</a>
                <a href="/features/trading/index.html" data-i18n="trading">📈 Trading</a>
                <a href="/features/servicios/index.html" data-i18n="servicios">🛠️ Servicios</a>
                <a href="/features/internet/index.html" data-i18n="internet">🌐 Internet</a>
                <a href="/features/tienda/index.html" data-i18n="tienda">🏰 Tienda</a>
                <a href="/terminos-completos.html" data-i18n="terminos">📜 Términos</a>
                <span class="footer-hex">◈</span>
            </div>
        </footer>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <!-- ================================================================ -->
    <!-- 🔥 SCRIPTS (CON SUPABASE) -->
    <!-- ================================================================ -->
    <script>
        // ================================================================
        // 🌐 SISTEMA DE IDIOMAS (COMPARTIDO)
        // ================================================================
        const CSARIELS_IDIOMA = {
            actual: 'es',
            traducciones: {},

            init: async function() {
                this.actual = localStorage.getItem('csariels_idioma') || 'es';
                await this.cargarTraducciones(this.actual);
                this.aplicarTraducciones();
                this.actualizarBotones();
                console.log(`🌐 Wallet - Idioma: ${this.actual}`);
                return this.actual;
            },

            cargarTraducciones: async function(idioma) {
                const traduccionesInline = {
                    es: {
                        'titulo_wallet': '◈ Wallet CMT | Csariel\'s',
                        'wallet': 'Wallet',
                        'inicio': 'Inicio',
                        'mi_red': 'Mi Red',
                        'live': 'Live',
                        'foro': 'Foro',
                        'trading': 'Trading',
                        'servicios': 'Servicios',
                        'internet': 'Internet',
                        'tienda': 'Tienda',
                        'terminos': 'Términos',
                        'footer_wallet': 'Wallet · Gestión de CMT',
                        'mi_id': 'Mi ID de usuario'
                    },
                    en: {
                        'titulo_wallet': '◈ CMT Wallet | Csariel\'s',
                        'wallet': 'Wallet',
                        'inicio': 'Home',
                        'mi_red': 'My Network',
                        'live': 'Live',
                        'foro': 'Forum',
                        'trading': 'Trading',
                        'servicios': 'Services',
                        'internet': 'Internet',
                        'tienda': 'Store',
                        'terminos': 'Terms',
                        'footer_wallet': 'Wallet · CMT Management',
                        'mi_id': 'My User ID'
                    },
                    fr: {
                        'titulo_wallet': '◈ Portefeuille CMT | Csariel\'s',
                        'wallet': 'Portefeuille',
                        'inicio': 'Accueil',
                        'mi_red': 'Mon Réseau',
                        'live': 'Live',
                        'foro': 'Forum',
                        'trading': 'Trading',
                        'servicios': 'Services',
                        'internet': 'Internet',
                        'tienda': 'Magasin',
                        'terminos': 'Termes',
                        'footer_wallet': 'Portefeuille · Gestion CMT',
                        'mi_id': 'Mon ID utilisateur'
                    }
                };
                this.traducciones = traduccionesInline[idioma] || traduccionesInline.es;
            },

            cambiar: function(idioma) {
                if (!idioma || idioma === this.actual) return;
                this.actual = idioma;
                localStorage.setItem('csariels_idioma', idioma);
                this.cargarTraducciones(idioma).then(() => {
                    this.aplicarTraducciones();
                    this.actualizarBotones();
                    this.notificarCambio(idioma);
                });
            },

            aplicarTraducciones: function() {
                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.getAttribute('data-i18n');
                    if (this.traducciones[key]) el.textContent = this.traducciones[key];
                });
                document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                    const key = el.getAttribute('data-i18n-placeholder');
                    if (this.traducciones[key]) el.placeholder = this.traducciones[key];
                });
            },

            actualizarBotones: function() {
                document.querySelectorAll('.lang-btn').forEach(btn => {
                    const lang = btn.getAttribute('data-lang');
                    btn.classList.toggle('active', lang === this.actual);
                });
            },

            notificarCambio: function(idioma) {
                localStorage.setItem('csariels_idioma', idioma);
                try {
                    window.dispatchEvent(new CustomEvent('idioma-cambiado', { detail: { idioma: idioma } }));
                } catch (e) { console.warn(e); }
                const nombres = { es: 'Español 🌎', en: 'English 🌍', fr: 'Français 🌏' };
                mostrarToast(`🌐 ${nombres[idioma] || idioma.toUpperCase()}`);
            }
        };

        // ================================================================
        // 🔐 TOAST
        // ================================================================
        let toastTimeout = null;

        function mostrarToast(mensaje, tipo = '') {
            const toast = document.getElementById('toast');
            toast.textContent = mensaje;
            toast.className = `toast${tipo ? ' error' : ''}`;
            toast.classList.add('active');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.remove('active'), 3000);
        }

        // ================================================================
        // 🌟 ESTRELLAS
        // ================================================================
        function initStars() {
            const canvas = document.getElementById('stars-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let width, height;
            let stars = [];
            const STAR_COUNT = 200;

            function resize() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
            }
            function createStars() {
                stars = [];
                for (let i = 0; i < STAR_COUNT; i++) {
                    stars.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        radius: Math.random() * 1.5 + 0.3,
                        speed: Math.random() * 0.015 + 0.005,
                        opacity: Math.random() * 0.7 + 0.3,
                        twinkleSpeed: Math.random() * 0.02 + 0.01,
                        twinklePhase: Math.random() * Math.PI * 2
                    });
                }
            }
            function draw() {
                ctx.clearRect(0, 0, width, height);
                for (let star of stars) {
                    const opacity = star.opacity * (0.6 + 0.4 * Math.sin(star.twinklePhase));
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
                    ctx.fill();
                    star.twinklePhase += star.twinkleSpeed;
                    star.y += star.speed;
                    if (star.y > height) {
                        star.y = 0;
                        star.x = Math.random() * width;
                    }
                }
                requestAnimationFrame(draw);
            }
            resize();
            createStars();
            draw();
            window.addEventListener('resize', () => { resize(); createStars(); });
        }

        // ================================================================
        // 🔌 ESPERAR SUPABASE
        // ================================================================
        function esperarSupabase(intentos = 40) {
            return new Promise((resolve, reject) => {
                const check = () => {
                    if (window.supabase && typeof window.supabase.from === 'function') {
                        return resolve(window.supabase);
                    }
                    if (intentos <= 0) return reject(new Error('Supabase no se inicializó'));
                    intentos--;
                    setTimeout(check, 150);
                };
                check();
            });
        }

        // ================================================================
        // 👤 OBTENER USUARIO
        // ================================================================
        async function obtenerUsuario() {
            try {
                const client = await esperarSupabase();
                const { data: { user }, error } = await client.auth.getUser();
                if (error || !user) {
                    const { data, error: signError } = await client.auth.signInAnonymously();
                    if (signError) throw signError;
                    return data.user;
                }
                return user;
            } catch (e) {
                console.error('Error de autenticación:', e);
                return null;
            }
        }

        // ================================================================
        // ◈ WALLET
        // ================================================================
        let userId = null;
        let balanceCMT = 0;

        async function cargarSaldo() {
            try {
                const user = await obtenerUsuario();
                if (user) {
                    userId = user.id;
                    localStorage.setItem('csariels_user_id', userId);
                    
                    // Intentar cargar desde Supabase
                    try {
                        const client = await esperarSupabase();
                        const { data, error } = await client
                            .from('perfiles')
                            .select('cmt_balance')
                            .eq('user_id', userId)
                            .single();
                        
                        if (data && data.cmt_balance !== null) {
                            balanceCMT = parseFloat(data.cmt_balance);
                            localStorage.setItem(`csariels_cmt_balance_${userId}`, balanceCMT.toString());
                        } else {
                            // Fallback a localStorage
                            const saved = localStorage.getItem(`csariels_cmt_balance_${userId}`);
                            balanceCMT = saved ? parseFloat(saved) : 0;
                        }
                    } catch (e) {
                        // Fallback a localStorage
                        const saved = localStorage.getItem(`csariels_cmt_balance_${userId}`);
                        balanceCMT = saved ? parseFloat(saved) : 0;
                    }
                } else {
                    userId = localStorage.getItem('csariels_user_id') || 'guest';
                    const saved = localStorage.getItem(`csariels_cmt_balance_${userId}`);
                    balanceCMT = saved ? parseFloat(saved) : 0;
                }
            } catch (e) {
                console.warn('Error cargando saldo:', e);
                userId = localStorage.getItem('csariels_user_id') || 'guest';
                const saved = localStorage.getItem(`csariels_cmt_balance_${userId}`);
                balanceCMT = saved ? parseFloat(saved) : 0;
            }

            document.getElementById('userBalance').innerHTML = balanceCMT.toFixed(2) + ' <small>CMT</small>';
            
            const displayId = userId && userId.length > 12 ? userId.slice(0, 8) + '...' + userId.slice(-4) : (userId || 'cargando...');
            document.getElementById('userIdDisplay').textContent = displayId;
        }

        async function recargarSaldo() {
            const monto = prompt('¿Cuántos CMT quieres recargar? (mínimo 1)', '10');
            if (!monto) return;
            const cantidad = parseFloat(monto);
            if (isNaN(cantidad) || cantidad <= 0) {
                mostrarToast('⚠️ Ingresa un número válido', 'error');
                return;
            }
            
            balanceCMT += cantidad;
            localStorage.setItem(`csariels_cmt_balance_${userId}`, balanceCMT.toString());
            
            // Intentar guardar en Supabase
            try {
                const client = await esperarSupabase();
                await client
                    .from('perfiles')
                    .update({ cmt_balance: balanceCMT })
                    .eq('user_id', userId);
            } catch (e) {
                console.warn('No se pudo guardar en Supabase:', e);
            }
            
            cargarSaldo();
            mostrarToast(`✅ Recarga exitosa! Nuevo saldo: ${balanceCMT.toFixed(2)} CMT`);
        }

        async function retirarSaldo() {
            const monto = prompt('¿Cuántos CMT quieres retirar?', '5');
            if (!monto) return;
            const cantidad = parseFloat(monto);
            if (isNaN(cantidad) || cantidad <= 0) {
                mostrarToast('⚠️ Ingresa un número válido', 'error');
                return;
            }
            if (cantidad > balanceCMT) {
                mostrarToast(`⚠️ Saldo insuficiente. Tienes ${balanceCMT.toFixed(2)} CMT`, 'error');
                return;
            }
            
            balanceCMT -= cantidad;
            localStorage.setItem(`csariels_cmt_balance_${userId}`, balanceCMT.toString());
            
            try {
                const client = await esperarSupabase();
                await client
                    .from('perfiles')
                    .update({ cmt_balance: balanceCMT })
                    .eq('user_id', userId);
            } catch (e) {
                console.warn('No se pudo guardar en Supabase:', e);
            }
            
            cargarSaldo();
            mostrarToast(`✅ Retiro exitoso! Nuevo saldo: ${balanceCMT.toFixed(2)} CMT`);
        }

        // ================================================================
        // 🚀 INICIALIZAR
        // ================================================================
        document.addEventListener('DOMContentLoaded', async function() {
            initStars();
            await CSARIELS_IDIOMA.init();
            await cargarSaldo();
            
            console.log('◈ Csariel\'s - Wallet CMT (CON SUPABASE)');
            console.log(`👤 Usuario: ${userId || 'guest'}`);
            console.log(`💰 Saldo: ${balanceCMT} CMT`);

            window.addEventListener('storage', (e) => {
                if (e.key === 'csariels_idioma' && e.newValue !== CSARIELS_IDIOMA.actual) {
                    CSARIELS_IDIOMA.cambiar(e.newValue);
                }
            });

            window.addEventListener('idioma-cambiado', (e) => {
                if (e.detail?.idioma && e.detail.idioma !== CSARIELS_IDIOMA.actual) {
                    CSARIELS_IDIOMA.cambiar(e.detail.idioma);
                }
            });
        });

        window.recargarSaldo = recargarSaldo;
        window.retirarSaldo = retirarSaldo;
        window.mostrarToast = mostrarToast;
        window.CSARIELS_IDIOMA = CSARIELS_IDIOMA;
    </script>
</body>
</html>
