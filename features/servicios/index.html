<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📋 Mis Servicios | Csariel's</title>
    <meta name="theme-color" content="#0F2D1A" />

    <!-- 🔒 CSP -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com https://*.supabase.co;
        style-src 'self' https://cdnjs.cloudflare.com https://fonts.googleapis.com 'unsafe-inline';
        font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;
        img-src 'self' data: https://*;
        connect-src 'self' https://*.supabase.co wss://*.supabase.co;
        frame-src 'self';
        media-src 'self';
        object-src 'none';
        base-uri 'self';
        form-action 'self';
    ">

    <!-- ===== RECURSOS ===== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

    <style>
        :root {
            --space-deep: #05080f;
            --space-mid: #0a1428;
            --verde-bosque: #0F2D1A;
            --verde-bosque-light: #1a4a2a;
            --gold-cosmic: #D4AF37;
            --gold-dim: rgba(212,175,55,0.15);
            --gold-glow: rgba(212,175,55,0.25);
            --text-primary: #e8f0f8;
            --text-secondary: #8ba3c7;
            --text-muted: #4a6a8a;
            --border: rgba(212,175,55,0.08);
            --border-glow: rgba(212,175,55,0.25);
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --success: #00b894;
            --danger: #ff3366;
            --warning: #D4AF37;
            --quantum: #00e5ff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            background: var(--space-deep);
            color: var(--text-primary);
            font-family: 'Space Grotesk', 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        #stars-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .nebula {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.10;
            pointer-events: none;
            z-index: 0;
            animation: nebula-drift 25s ease-in-out infinite alternate;
        }
        .nebula-1 { width: 700px; height: 700px; background: var(--verde-bosque); top: -15%; right: -15%; }
        .nebula-2 { width: 600px; height: 600px; background: var(--gold-cosmic); bottom: -15%; left: -15%; animation-delay: -8s; opacity: 0.05; }
        .nebula-3 { width: 500px; height: 500px; background: var(--quantum); top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: -15s; opacity: 0.04; }

        @keyframes nebula-drift {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, -30px) scale(1.15); }
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: var(--space-deep); }
        ::-webkit-scrollbar-thumb { background: linear-gradient(var(--gold-cosmic), var(--verde-bosque)); border-radius: 3px; }

        .app {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px 20px 30px;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0 16px;
            border-bottom: 2px solid var(--gold-dim);
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
            backdrop-filter: blur(10px);
            position: relative;
        }
        .header::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-cosmic), var(--verde-bosque), var(--gold-cosmic), transparent);
            opacity: 0.4;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        .logo-icon { font-size: 2rem; filter: drop-shadow(0 0 20px rgba(212,175,55,0.2)); animation: pulse-glow 3s ease-in-out infinite; }
        .logo-icon .hex {
            display: inline-block;
            background: var(--verde-bosque);
            color: var(--gold-cosmic);
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 900;
            border: 2px solid var(--gold-cosmic);
            font-family: 'Orbitron', monospace;
        }
        @keyframes pulse-glow { 0%, 100% { filter: drop-shadow(0 0 20px rgba(212,175,55,0.2)); } 50% { filter: drop-shadow(0 0 40px rgba(212,175,55,0.4)); } }

        .logo-text {
            font-family: 'Orbitron', monospace;
            font-size: 1.3rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--gold-cosmic), var(--verde-bosque-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo-badge {
            font-family: 'Orbitron', monospace;
            font-size: 0.45rem;
            background: linear-gradient(135deg, var(--verde-bosque), var(--gold-cosmic));
            color: white;
            padding: 3px 12px;
            border-radius: 20px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            -webkit-text-fill-color: white;
            border: 1px solid rgba(212,175,55,0.2);
            animation: badge-pulse 2s ease-in-out infinite;
        }
        @keyframes badge-pulse { 0%, 100% { box-shadow: 0 0 30px rgba(15,45,26,0.3); } 50% { box-shadow: 0 0 60px rgba(212,175,55,0.2); } }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 16px;
            border: 1px solid var(--border);
            border-radius: 30px;
            background: rgba(212,175,55,0.03);
            color: var(--text-primary);
            font-family: 'Orbitron', monospace;
            font-size: 0.6rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
        }
        .btn:hover { transform: scale(1.02); border-color: var(--border-glow); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }

        .btn-primary {
            background: linear-gradient(135deg, var(--verde-bosque), var(--verde-bosque-light));
            border-color: var(--gold-cosmic);
            color: var(--gold-cosmic);
            -webkit-text-fill-color: var(--gold-cosmic);
        }
        .btn-primary:hover:not(:disabled) {
            background: linear-gradient(135deg, var(--verde-bosque-light), var(--verde-bosque));
            box-shadow: 0 0 40px rgba(15,45,26,0.5);
        }
        .btn-gold {
            background: linear-gradient(135deg, var(--gold-cosmic), #b8923a);
            border-color: transparent;
            color: #0a0c10;
            -webkit-text-fill-color: #0a0c10;
        }
        .btn-gold:hover:not(:disabled) { box-shadow: 0 0 40px rgba(212,175,55,0.3); }
        .btn-outline { border-color: var(--border); background: transparent; }
        .btn-outline:hover:not(:disabled) { background: rgba(212,175,55,0.05); border-color: var(--gold-cosmic); }
        .btn-sm { padding: 4px 12px; font-size: 0.55rem; }
        .btn-danger {
            background: rgba(255,51,102,0.15);
            border-color: rgba(255,51,102,0.3);
            color: var(--danger);
        }
        .btn-danger:hover:not(:disabled) { background: rgba(255,51,102,0.25); }
        .btn-internet {
            background: linear-gradient(135deg, var(--gold-cosmic), #00d68f);
            border-color: transparent;
            color: #0a0c10;
            -webkit-text-fill-color: #0a0c10;
            box-shadow: 0 0 20px rgba(0, 214, 143, 0.2);
            animation: pulse-internet 2s ease-in-out infinite;
        }
        .btn-internet:hover {
            box-shadow: 0 0 40px rgba(0, 214, 143, 0.4);
            transform: scale(1.03);
        }
        @keyframes pulse-internet {
            0%, 100% { box-shadow: 0 0 20px rgba(0, 214, 143, 0.2); }
            50% { box-shadow: 0 0 40px rgba(0, 214, 143, 0.4); }
        }

        /* ===== SELECTOR DE IDIOMA ===== */
        .language-selector {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            background: rgba(212,175,55,0.03);
            border-radius: 16px;
            border: 1px solid rgba(212,175,55,0.08);
        }
        .language-selector .lang-icon { font-size: 0.7rem; margin-right: 2px; }
        .lang-btn {
            padding: 2px 8px;
            border-radius: 10px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-muted);
            font-family: 'Orbitron', monospace;
            font-size: 0.45rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .lang-btn:hover { color: var(--text-secondary); background: rgba(212,175,55,0.05); }
        .lang-btn.active { border-color: var(--gold-cosmic); background: rgba(212,175,55,0.1); color: var(--gold-cosmic); }

        /* ===== PANEL DE MIS SERVICIOS ===== */
        .panel-container {
            background: rgba(15,45,26,0.25);
            border: 1px solid var(--gold-dim);
            border-radius: var(--radius);
            padding: 24px;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
            margin-bottom: 16px;
        }
        .panel-container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(135deg, var(--gold-cosmic), var(--verde-bosque), var(--gold-cosmic));
            background-size: 300% 300%;
            border-radius: var(--radius);
            z-index: -1;
            opacity: 0.08;
            animation: border-flow 4s ease-in-out infinite;
        }
        @keyframes border-flow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .panel-container h1 {
            font-family: 'Orbitron', monospace;
            color: var(--gold-cosmic);
            font-size: 1.4rem;
            margin-bottom: 4px;
        }
        .panel-container .sub {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-bottom: 16px;
        }

        .servicio-item {
            background: rgba(0,0,0,0.25);
            border: 1px solid var(--gold-dim);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .servicio-item .info .nombre {
            font-weight: 600;
            color: var(--text-primary);
        }
        .servicio-item .info .categoria {
            font-size: 0.6rem;
            color: var(--text-secondary);
            background: rgba(212,175,55,0.1);
            padding: 2px 10px;
            border-radius: 12px;
            display: inline-block;
            margin-top: 4px;
        }
        .servicio-item .info .estado {
            font-size: 0.55rem;
            margin-left: 8px;
            padding: 2px 8px;
            border-radius: 8px;
        }
        .servicio-item .info .estado.activo {
            background: rgba(0,184,148,0.15);
            color: var(--success);
            border: 1px solid rgba(0,184,148,0.3);
        }
        .servicio-item .info .estado.inactivo {
            background: rgba(255,51,102,0.15);
            color: var(--danger);
            border: 1px solid rgba(255,51,102,0.3);
        }
        .servicio-item .acciones {
            display: flex;
            gap: 6px;
        }

        .no-servicios {
            text-align: center;
            padding: 30px 20px;
            color: var(--text-muted);
        }
        .no-servicios .icono {
            font-size: 2.5rem;
            opacity: 0.3;
            margin-bottom: 8px;
        }

        /* ===== FOOTER ===== */
        .footer {
            margin-top: 24px;
            padding-top: 14px;
            border-top: 1px solid var(--gold-dim);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            position: relative;
        }
        .footer::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-cosmic), transparent);
            opacity: 0.2;
        }
        .footer-text {
            color: var(--text-muted);
            font-size: 0.5rem;
            letter-spacing: 0.5px;
            font-family: 'Orbitron', monospace;
        }
        .footer-text .brand { color: var(--gold-cosmic); }
        .footer-links { display: flex; gap: 8px; flex-wrap: wrap; }
        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.5rem;
            transition: var(--transition);
            font-family: 'Orbitron', monospace;
            letter-spacing: 0.5px;
        }
        .footer-links a:hover { color: var(--gold-cosmic); }
        .footer-hex {
            display: inline-block;
            background: var(--verde-bosque);
            color: var(--gold-cosmic);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.45rem;
            font-weight: 700;
            border: 1px solid var(--gold-cosmic);
            font-family: 'Orbitron', monospace;
        }

        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--verde-bosque);
            color: var(--gold-cosmic);
            padding: 10px 20px;
            border-radius: var(--radius);
            font-weight: 600;
            font-size: 0.7rem;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 5000;
            pointer-events: none;
            font-family: 'Orbitron', monospace;
            border: 1px solid rgba(212,175,55,0.15);
            max-width: 90%;
            text-align: center;
        }
        .toast.active { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.error { background: var(--danger); color: white; }

        @media (max-width: 768px) {
            .header { flex-direction: column; align-items: flex-start; }
            .header-actions { width: 100%; justify-content: flex-start; flex-wrap: wrap; }
            .servicio-item { flex-direction: column; align-items: stretch; }
            .servicio-item .acciones { justify-content: flex-start; }
        }
        @media (max-width: 480px) {
            .btn { font-size: 0.45rem; padding: 4px 8px; }
        }
    </style>
</head>
<body>
    <!-- ===== FONDO ESTELAR ===== -->
    <canvas id="stars-canvas"></canvas>
    <div class="nebula nebula-1"></div>
    <div class="nebula nebula-2"></div>
    <div class="nebula nebula-3"></div>

    <div class="app">

        <!-- HEADER -->
        <header class="header">
            <a href="../../../index.html" class="logo">
                <span class="logo-icon"><span class="hex">◈</span></span>
                <span class="logo-text">Csariel's</span>
                <span class="logo-badge" data-i18n="mis_servicios">Mis Servicios</span>
            </a>
            <div class="header-actions">
                <div class="language-selector">
                    <span class="lang-icon">🌐</span>
                    <button class="lang-btn" data-lang="es" onclick="CSARIELS_IDIOMA.cambiar('es')">ES</button>
                    <button class="lang-btn" data-lang="en" onclick="CSARIELS_IDIOMA.cambiar('en')">EN</button>
                    <button class="lang-btn" data-lang="fr" onclick="CSARIELS_IDIOMA.cambiar('fr')">FR</button>
                </div>

                <a href="../../../index.html" class="btn btn-outline btn-sm">
                    <i class="fas fa-home"></i> <span data-i18n="inicio">Inicio</span>
                </a>
                <a href="../../red/index.html" class="btn btn-primary btn-sm">
                    <i class="fas fa-users"></i> <span data-i18n="mi_red">Mi Red</span>
                </a>
                <a href="../index.html" class="btn btn-gold btn-sm">
                    <i class="fas fa-arrow-left"></i> <span data-i18n="volver_servicios">Volver a Servicios</span>
                </a>
                <a href="../registrar/index.html" class="btn btn-internet btn-sm">
                    <i class="fas fa-plus"></i> <span data-i18n="nuevo_servicio">Nuevo</span>
                </a>
            </div>
        </header>

        <!-- PANEL -->
        <div class="panel-container">
            <h1>📋 Mis Servicios</h1>
            <div class="sub">Administra tus servicios publicados</div>

            <div id="misServiciosList">
                <div class="no-servicios">
                    <div class="icono">📭</div>
                    <p>No tienes servicios publicados aún.</p>
                    <button class="btn btn-gold" onclick="window.location.href='../registrar/index.html'" style="margin-top:8px;">
                        <i class="fas fa-plus"></i> Registrar mi negocio
                    </button>
                </div>
            </div>
        </div>

        <!-- FOOTER -->
        <footer class="footer">
            <span class="footer-text">
                <span class="brand">◈ Csariel's</span> — <span data-i18n="footer_mis_servicios">Panel de Comerciante</span>
            </span>
            <div class="footer-links">
                <a href="../../../index.html" data-i18n="inicio">🏠 Inicio</a>
                <a href="../index.html" data-i18n="servicios">🔧 Servicios</a>
                <span class="footer-hex">◈</span>
            </div>
        </footer>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <!-- ================================================================ -->
    <!-- 🔥 SCRIPTS -->
    <!-- ================================================================ -->
    <script>
        const CSARIELS_IDIOMA = {
            actual: 'es',
            traducciones: {},

            init: async function() {
                this.actual = localStorage.getItem('csariels_idioma') || 'es';
                await this.cargarTraducciones(this.actual);
                this.aplicarTraducciones();
                this.actualizarBotones();
                return this.actual;
            },

            cargarTraducciones: async function(idioma) {
                const traduccionesInline = {
                    es: {
                        'mis_servicios': 'Mis Servicios',
                        'inicio': 'Inicio',
                        'mi_red': 'Mi Red',
                        'volver_servicios': 'Volver a Servicios',
                        'nuevo_servicio': 'Nuevo',
                        'servicios': 'Servicios',
                        'footer_mis_servicios': 'Panel de Comerciante'
                    },
                    en: {
                        'mis_servicios': 'My Services',
                        'inicio': 'Home',
                        'mi_red': 'My Network',
                        'volver_servicios': 'Back to Services',
                        'nuevo_servicio': 'New',
                        'servicios': 'Services',
                        'footer_mis_servicios': 'Merchant Panel'
                    },
                    fr: {
                        'mis_servicios': 'Mes Services',
                        'inicio': 'Accueil',
                        'mi_red': 'Mon Réseau',
                        'volver_servicios': 'Retour aux Services',
                        'nuevo_servicio': 'Nouveau',
                        'servicios': 'Services',
                        'footer_mis_servicios': 'Panneau Marchand'
                    }
                };
                this.traducciones = traduccionesInline[idioma] || traduccionesInline.es;
            },

            cambiar: function(idioma) {
                if (!idioma || idioma === this.actual) return;
                this.actual = idioma;
                localStorage.setItem('csariels_idioma', idioma);
                this.cargarTraducciones(idioma).then(() => {
                    this.aplicarTraducciones();
                    this.actualizarBotones();
                    mostrarToast(`🌐 ${idioma.toUpperCase()}`);
                });
            },

            aplicarTraducciones: function() {
                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.getAttribute('data-i18n');
                    if (this.traducciones[key]) el.textContent = this.traducciones[key];
                });
            },

            actualizarBotones: function() {
                document.querySelectorAll('.lang-btn').forEach(btn => {
                    const lang = btn.getAttribute('data-lang');
                    btn.classList.toggle('active', lang === this.actual);
                });
            }
        };

        let toastTimeout = null;
        function mostrarToast(mensaje, tipo = '') {
            const toast = document.getElementById('toast');
            toast.textContent = mensaje;
            toast.className = `toast${tipo ? ' error' : ''}`;
            toast.classList.add('active');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.remove('active'), 3000);
        }

        function initStars() {
            const canvas = document.getElementById('stars-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let width, height;
            let stars = [];

            function resize() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
            }
            function createStars() {
                stars = [];
                for (let i = 0; i < 200; i++) {
                    stars.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        radius: Math.random() * 1.5 + 0.3,
                        speed: Math.random() * 0.015 + 0.005,
                        opacity: Math.random() * 0.7 + 0.3,
                        twinkleSpeed: Math.random() * 0.02 + 0.01,
                        twinklePhase: Math.random() * Math.PI * 2
                    });
                }
            }
            function draw() {
                ctx.clearRect(0, 0, width, height);
                for (let star of stars) {
                    const opacity = star.opacity * (0.6 + 0.4 * Math.sin(star.twinklePhase));
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
                    ctx.fill();
                    star.twinklePhase += star.twinkleSpeed;
                    star.y += star.speed;
                    if (star.y > height) {
                        star.y = 0;
                        star.x = Math.random() * width;
                    }
                }
                requestAnimationFrame(draw);
            }
            resize();
            createStars();
            draw();
            window.addEventListener('resize', () => { resize(); createStars(); });
        }

        document.addEventListener('DOMContentLoaded', async function() {
            initStars();
            await CSARIELS_IDIOMA.init();
        });

        window.mostrarToast = mostrarToast;
        window.CSARIELS_IDIOMA = CSARIELS_IDIOMA;
    </script>
</body>
</html>
