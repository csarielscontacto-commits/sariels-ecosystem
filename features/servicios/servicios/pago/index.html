<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💳 Pagos | Csariel's</title>
    <meta name="theme-color" content="#0F2D1A" />

    <!-- 🔒 CSP -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com https://*.supabase.co;
        style-src 'self' https://cdnjs.cloudflare.com https://fonts.googleapis.com 'unsafe-inline';
        font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;
        img-src 'self' data: https://*;
        connect-src 'self' https://*.supabase.co wss://*.supabase.co;
        frame-src 'self';
        media-src 'self';
        object-src 'none';
        base-uri 'self';
        form-action 'self';
    ">

    <!-- ===== RECURSOS ===== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet" />

    <style>
        /* ================================================================
           PLANTILLA CSARIEL'S
           ================================================================ */
        :root {
            --space-deep: #05080f;
            --space-mid: #0a1428;
            --verde-bosque: #0F2D1A;
            --verde-bosque-light: #1a4a2a;
            --gold-cosmic: #D4AF37;
            --gold-dim: rgba(212,175,55,0.15);
            --gold-glow: rgba(212,175,55,0.25);
            --text-primary: #e8f0f8;
            --text-secondary: #8ba3c7;
            --text-muted: #4a6a8a;
            --border: rgba(212,175,55,0.08);
            --border-glow: rgba(212,175,55,0.25);
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --success: #00b894;
            --danger: #ff3366;
            --warning: #D4AF37;
            --quantum: #00e5ff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            background: var(--space-deep);
            color: var(--text-primary);
            font-family: 'Space Grotesk', 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        #stars-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .nebula {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.10;
            pointer-events: none;
            z-index: 0;
            animation: nebula-drift 25s ease-in-out infinite alternate;
        }
        .nebula-1 { width: 700px; height: 700px; background: var(--verde-bosque); top: -15%; right: -15%; }
        .nebula-2 { width: 600px; height: 600px; background: var(--gold-cosmic); bottom: -15%; left: -15%; animation-delay: -8s; opacity: 0.05; }
        .nebula-3 { width: 500px; height: 500px; background: var(--quantum); top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: -15s; opacity: 0.04; }

        @keyframes nebula-drift {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, -30px) scale(1.15); }
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: var(--space-deep); }
        ::-webkit-scrollbar-thumb { background: linear-gradient(var(--gold-cosmic), var(--verde-bosque)); border-radius: 3px; }

        .app {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px 20px 30px;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0 16px;
            border-bottom: 2px solid var(--gold-dim);
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
            backdrop-filter: blur(10px);
            position: relative;
        }
        .header::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-cosmic), var(--verde-bosque), var(--gold-cosmic), transparent);
            opacity: 0.4;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        .logo-icon { font-size: 2rem; filter: drop-shadow(0 0 20px rgba(212,175,55,0.2)); animation: pulse-glow 3s ease-in-out infinite; }
        .logo-icon .hex {
            display: inline-block;
            background: var(--verde-bosque);
            color: var(--gold-cosmic);
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 900;
            border: 2px solid var(--gold-cosmic);
            font-family: 'Orbitron', monospace;
        }
        @keyframes pulse-glow { 0%, 100% { filter: drop-shadow(0 0 20px rgba(212,175,55,0.2)); } 50% { filter: drop-shadow(0 0 40px rgba(212,175,55,0.4)); } }

        .logo-text {
            font-family: 'Orbitron', monospace;
            font-size: 1.3rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--gold-cosmic), var(--verde-bosque-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo-badge {
            font-family: 'Orbitron', monospace;
            font-size: 0.45rem;
            background: linear-gradient(135deg, var(--verde-bosque), var(--gold-cosmic));
            color: white;
            padding: 3px 12px;
            border-radius: 20px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            -webkit-text-fill-color: white;
            border: 1px solid rgba(212,175,55,0.2);
            animation: badge-pulse 2s ease-in-out infinite;
        }
        @keyframes badge-pulse { 0%, 100% { box-shadow: 0 0 30px rgba(15,45,26,0.3); } 50% { box-shadow: 0 0 60px rgba(212,175,55,0.2); } }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 16px;
            border: 1px solid var(--border);
            border-radius: 30px;
            background: rgba(212,175,55,0.03);
            color: var(--text-primary);
            font-family: 'Orbitron', monospace;
            font-size: 0.6rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
        }
        .btn:hover { transform: scale(1.02); border-color: var(--border-glow); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }

        .btn-primary {
            background: linear-gradient(135deg, var(--verde-bosque), var(--verde-bosque-light));
            border-color: var(--gold-cosmic);
            color: var(--gold-cosmic);
            -webkit-text-fill-color: var(--gold-cosmic);
        }
        .btn-primary:hover:not(:disabled) {
            background: linear-gradient(135deg, var(--verde-bosque-light), var(--verde-bosque));
            box-shadow: 0 0 40px rgba(15,45,26,0.5);
        }
        .btn-gold {
            background: linear-gradient(135deg, var(--gold-cosmic), #b8923a);
            border-color: transparent;
            color: #0a0c10;
            -webkit-text-fill-color: #0a0c10;
        }
        .btn-gold:hover:not(:disabled) { box-shadow: 0 0 40px rgba(212,175,55,0.3); }
        .btn-outline { border-color: var(--border); background: transparent; }
        .btn-outline:hover:not(:disabled) { background: rgba(212,175,55,0.05); border-color: var(--gold-cosmic); }
        .btn-sm { padding: 4px 12px; font-size: 0.55rem; }
        .btn-danger {
            background: rgba(255,51,102,0.15);
            border-color: rgba(255,51,102,0.3);
            color: var(--danger);
        }
        .btn-danger:hover:not(:disabled) { background: rgba(255,51,102,0.25); }
        .btn-trading {
            background: linear-gradient(135deg, var(--quantum), #0099ff);
            border-color: transparent;
            color: #0a0c10;
            -webkit-text-fill-color: #0a0c10;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.2);
            animation: pulse-trading 2s ease-in-out infinite;
        }
        .btn-trading:hover {
            box-shadow: 0 0 40px rgba(0, 229, 255, 0.4);
            transform: scale(1.03);
        }
        @keyframes pulse-trading {
            0%, 100% { box-shadow: 0 0 20px rgba(0, 229, 255, 0.2); }
            50% { box-shadow: 0 0 40px rgba(0, 229, 255, 0.4); }
        }
        .btn-internet {
            background: linear-gradient(135deg, var(--gold-cosmic), #00d68f);
            border-color: transparent;
            color: #0a0c10;
            -webkit-text-fill-color: #0a0c10;
            box-shadow: 0 0 20px rgba(0, 214, 143, 0.2);
            animation: pulse-internet 2s ease-in-out infinite;
        }
        .btn-internet:hover {
            box-shadow: 0 0 40px rgba(0, 214, 143, 0.4);
            transform: scale(1.03);
        }
        @keyframes pulse-internet {
            0%, 100% { box-shadow: 0 0 20px rgba(0, 214, 143, 0.2); }
            50% { box-shadow: 0 0 40px rgba(0, 214, 143, 0.4); }
        }

        .btn-tienda {
            background: linear-gradient(135deg, #a855f7, #7c3aed);
            border-color: transparent;
            color: #fff;
            -webkit-text-fill-color: #fff;
            box-shadow: 0 0 20px rgba(168,85,247,0.2);
            animation: pulse-tienda 2s ease-in-out infinite;
        }
        .btn-tienda:hover {
            box-shadow: 0 0 40px rgba(168,85,247,0.4);
            transform: scale(1.03);
        }
        @keyframes pulse-tienda {
            0%, 100% { box-shadow: 0 0 20px rgba(168,85,247,0.2); }
            50% { box-shadow: 0 0 40px rgba(168,85,247,0.4); }
        }

        .btn-wallet {
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            border-color: transparent;
            color: #0a0c10;
            -webkit-text-fill-color: #0a0c10;
            box-shadow: 0 0 20px rgba(0,212,255,0.2);
            animation: pulse-wallet 2s ease-in-out infinite;
        }
        .btn-wallet:hover {
            box-shadow: 0 0 40px rgba(0,212,255,0.4);
            transform: scale(1.03);
        }
        @keyframes pulse-wallet {
            0%, 100% { box-shadow: 0 0 20px rgba(0,212,255,0.2); }
            50% { box-shadow: 0 0 40px rgba(0,212,255,0.4); }
        }

        /* ===== SELECTOR DE IDIOMA ===== */
        .language-selector {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            background: rgba(212,175,55,0.03);
            border-radius: 16px;
            border: 1px solid rgba(212,175,55,0.08);
        }
        .language-selector .lang-icon { font-size: 0.7rem; margin-right: 2px; }
        .lang-btn {
            padding: 2px 8px;
            border-radius: 10px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-muted);
            font-family: 'Orbitron', monospace;
            font-size: 0.45rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .lang-btn:hover { color: var(--text-secondary); background: rgba(212,175,55,0.05); }
        .lang-btn.active { border-color: var(--gold-cosmic); background: rgba(212,175,55,0.1); color: var(--gold-cosmic); }

        /* ================================================================
           ESTILOS PROPIOS DE PAGOS
           ================================================================ */
        .pago-container {
            background: rgba(15,45,26,0.25);
            border: 1px solid var(--gold-dim);
            border-radius: var(--radius);
            padding: 24px;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
            margin-bottom: 16px;
        }
        .pago-container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(135deg, var(--gold-cosmic), var(--verde-bosque), var(--gold-cosmic));
            background-size: 300% 300%;
            border-radius: var(--radius);
            z-index: -1;
            opacity: 0.08;
            animation: border-flow 4s ease-in-out infinite;
        }
        @keyframes border-flow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .pago-container h1 {
            font-family: 'Orbitron', monospace;
            color: var(--gold-cosmic);
            font-size: 1.4rem;
            margin-bottom: 4px;
        }
        .pago-container .sub {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-bottom: 16px;
        }

        .pago-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
            margin-bottom: 16px;
        }
        .pago-stat {
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--gold-dim);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
        }
        .pago-stat .numero {
            font-family: 'Orbitron', monospace;
            font-size: 1.2rem;
            color: var(--gold-cosmic);
        }
        .pago-stat .label {
            font-size: 0.55rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .pago-item {
            background: rgba(0,0,0,0.25);
            border: 1px solid var(--gold-dim);
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .pago-item .info .concepto {
            font-weight: 600;
            color: var(--text-primary);
        }
        .pago-item .info .fecha {
            font-size: 0.6rem;
            color: var(--text-secondary);
        }
        .pago-item .monto {
            font-family: 'Orbitron', monospace;
            font-size: 1rem;
            color: var(--gold-cosmic);
        }
        .pago-item .estado {
            font-size: 0.55rem;
            padding: 2px 10px;
            border-radius: 12px;
            display: inline-block;
        }
        .pago-item .estado.pagado {
            background: rgba(0,184,148,0.15);
            color: var(--success);
            border: 1px solid rgba(0,184,148,0.2);
        }
        .pago-item .estado.pendiente {
            background: rgba(255,235,59,0.15);
            color: var(--warning);
            border: 1px solid rgba(255,235,59,0.2);
        }
        .pago-item .estado.vencido {
            background: rgba(255,51,102,0.1);
            color: var(--danger);
            border: 1px solid rgba(255,51,102,0.2);
        }

        .empty-pagos {
            text-align: center;
            padding: 30px 20px;
            color: var(--text-muted);
        }
        .empty-pagos .icono {
            font-size: 2.5rem;
            opacity: 0.3;
            margin-bottom: 8px;
        }

        /* ===== FOOTER ===== */
        .footer {
            margin-top: 24px;
            padding-top: 14px;
            border-top: 1px solid var(--gold-dim);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            position: relative;
        }
        .footer::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-cosmic), transparent);
            opacity: 0.2;
        }
        .footer-text {
            color: var(--text-muted);
            font-size: 0.5rem;
            letter-spacing: 0.5px;
            font-family: 'Orbitron', monospace;
        }
        .footer-text .brand { color: var(--gold-cosmic); }
        .footer-links { display: flex; gap: 8px; flex-wrap: wrap; }
        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.5rem;
            transition: var(--transition);
            font-family: 'Orbitron', monospace;
            letter-spacing: 0.5px;
        }
        .footer-links a:hover { color: var(--gold-cosmic); }
        .footer-hex {
            display: inline-block;
            background: var(--verde-bosque);
            color: var(--gold-cosmic);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.45rem;
            font-weight: 700;
            border: 1px solid var(--gold-cosmic);
            font-family: 'Orbitron', monospace;
        }

        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--verde-bosque);
            color: var(--gold-cosmic);
            padding: 10px 20px;
            border-radius: var(--radius);
            font-weight: 600;
            font-size: 0.7rem;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 5000;
            pointer-events: none;
            font-family: 'Orbitron', monospace;
            border: 1px solid rgba(212,175,55,0.15);
            max-width: 90%;
            text-align: center;
        }
        .toast.active { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.error { background: var(--danger); color: white; }

        @media (max-width: 768px) {
            .header { flex-direction: column; align-items: flex-start; }
            .header-actions { width: 100%; justify-content: flex-start; flex-wrap: wrap; }
            .pago-stats { grid-template-columns: 1fr; }
            .pago-item { flex-direction: column; align-items: stretch; }
        }
        @media (max-width: 480px) {
            .btn { font-size: 0.45rem; padding: 4px 8px; }
        }
    </style>
</head>
<body>
    <!-- ===== FONDO ESTELAR ===== -->
    <canvas id="stars-canvas"></canvas>
    <div class="nebula nebula-1"></div>
    <div class="nebula nebula-2"></div>
    <div class="nebula nebula-3"></div>

    <div class="app">

        <!-- HEADER -->
        <header class="header">
            <a href="../../../index.html" class="logo">
                <span class="logo-icon"><span class="hex">◈</span></span>
                <span class="logo-text">Csariel's</span>
                <span class="logo-badge" data-i18n="pagos">Pagos</span>
            </a>
            <div class="header-actions">
                <div class="language-selector">
                    <span class="lang-icon">🌐</span>
                    <button class="lang-btn" data-lang="es" onclick="CSARIELS_IDIOMA.cambiar('es')">ES</button>
                    <button class="lang-btn" data-lang="en" onclick="CSARIELS_IDIOMA.cambiar('en')">EN</button>
                    <button class="lang-btn" data-lang="fr" onclick="CSARIELS_IDIOMA.cambiar('fr')">FR</button>
                </div>

                <a href="../../../index.html" class="btn btn-outline btn-sm">
                    <i class="fas fa-home"></i> <span data-i18n="inicio">Inicio</span>
                </a>
                <a href="../../red/index.html" class="btn btn-primary btn-sm">
                    <i class="fas fa-users"></i> <span data-i18n="mi_red">Mi Red</span>
                </a>
                <a href="../index.html" class="btn btn-gold btn-sm">
                    <i class="fas fa-arrow-left"></i> <span data-i18n="volver_servicios">Volver a Servicios</span>
                </a>
            </div>
        </header>

        <!-- ===== CONTENIDO ===== -->
        <div class="pago-container">
            <h1>💳 Historial de Pagos</h1>
            <div class="sub">Gestiona tus pagos y suscripciones</div>

            <!-- Estadísticas -->
            <div class="pago-stats" id="pagoStats">
                <div class="pago-stat">
                    <div class="numero" id="totalPagado">$0.00</div>
                    <div class="label">Total Pagado</div>
                </div>
                <div class="pago-stat">
                    <div class="numero" id="pagosActivos">0</div>
                    <div class="label">Pagos Activos</div>
                </div>
                <div class="pago-stat">
                    <div class="numero" id="proximoPago">--</div>
                    <div class="label">Próximo Pago</div>
                </div>
            </div>

            <!-- Lista de pagos -->
            <div id="pagosList">
                <div class="empty-pagos">
                    <div class="icono">📭</div>
                    <p>No tienes pagos registrados aún.</p>
                    <button class="btn btn-gold" onclick="window.location.href='../registrar/index.html'" style="margin-top:8px;">
                        <i class="fas fa-store"></i> Registrar mi negocio
                    </button>
                </div>
            </div>
        </div>

        <!-- ===== FOOTER ===== -->
        <footer class="footer">
            <span class="footer-text">
                <span class="brand">◈ Csariel's</span> — <span data-i18n="footer_pagos">Historial de Pagos · Facturación</span>
            </span>
            <div class="footer-links">
                <a href="../../../index.html" data-i18n="inicio">🏠 Inicio</a>
                <a href="../index.html" data-i18n="servicios">🔧 Servicios</a>
                <span class="footer-hex">◈</span>
            </div>
        </footer>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <!-- ================================================================ -->
    <!-- 🔥 SCRIPTS -->
    <!-- ================================================================ -->
    <script>
        // ================================================================
        // 🌐 SISTEMA DE IDIOMAS (COMPARTIDO)
        // ================================================================
        const CSARIELS_IDIOMA = {
            actual: 'es',
            traducciones: {},

            init: async function() {
                this.actual = localStorage.getItem('csariels_idioma') || 'es';
                await this.cargarTraducciones(this.actual);
                this.aplicarTraducciones();
                this.actualizarBotones();
                console.log(`🌐 Pagos - Idioma: ${this.actual}`);
                return this.actual;
            },

            cargarTraducciones: async function(idioma) {
                const traduccionesInline = {
                    es: {
                        'pagos': 'Pagos',
                        'inicio': 'Inicio',
                        'mi_red': 'Mi Red',
                        'volver_servicios': 'Volver a Servicios',
                        'footer_pagos': 'Historial de Pagos · Facturación',
                        'servicios': 'Servicios'
                    },
                    en: {
                        'pagos': 'Payments',
                        'inicio': 'Home',
                        'mi_red': 'My Network',
                        'volver_servicios': 'Back to Services',
                        'footer_pagos': 'Payment History · Billing',
                        'servicios': 'Services'
                    },
                    fr: {
                        'pagos': 'Paiements',
                        'inicio': 'Accueil',
                        'mi_red': 'Mon Réseau',
                        'volver_servicios': 'Retour aux Services',
                        'footer_pagos': 'Historique des Paiements · Facturation',
                        'servicios': 'Services'
                    }
                };
                this.traducciones = traduccionesInline[idioma] || traduccionesInline.es;
            },

            cambiar: function(idioma) {
                if (!idioma || idioma === this.actual) return;
                this.actual = idioma;
                localStorage.setItem('csariels_idioma', idioma);
                this.cargarTraducciones(idioma).then(() => {
                    this.aplicarTraducciones();
                    this.actualizarBotones();
                    this.notificarCambio(idioma);
                });
            },

            aplicarTraducciones: function() {
                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.getAttribute('data-i18n');
                    if (this.traducciones[key]) el.textContent = this.traducciones[key];
                });
                document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                    const key = el.getAttribute('data-i18n-placeholder');
                    if (this.traducciones[key]) el.placeholder = this.traducciones[key];
                });
            },

            actualizarBotones: function() {
                document.querySelectorAll('.lang-btn').forEach(btn => {
                    const lang = btn.getAttribute('data-lang');
                    btn.classList.toggle('active', lang === this.actual);
                });
            },

            notificarCambio: function(idioma) {
                localStorage.setItem('csariels_idioma', idioma);
                try {
                    window.dispatchEvent(new CustomEvent('idioma-cambiado', { detail: { idioma: idioma } }));
                } catch (e) { console.warn(e); }
                const nombres = { es: 'Español 🌎', en: 'English 🌍', fr: 'Français 🌏' };
                mostrarToast(`🌐 ${nombres[idioma] || idioma.toUpperCase()}`);
            }
        };

        // ================================================================
        // 🌟 ESTRELLAS
        // ================================================================
        function initStars() {
            const canvas = document.getElementById('stars-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let width, height;
            let stars = [];
            const STAR_COUNT = 200;

            function resize() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
            }
            function createStars() {
                stars = [];
                for (let i = 0; i < STAR_COUNT; i++) {
                    stars.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        radius: Math.random() * 1.5 + 0.3,
                        speed: Math.random() * 0.015 + 0.005,
                        opacity: Math.random() * 0.7 + 0.3,
                        twinkleSpeed: Math.random() * 0.02 + 0.01,
                        twinklePhase: Math.random() * Math.PI * 2
                    });
                }
            }
            function draw() {
                ctx.clearRect(0, 0, width, height);
                for (let star of stars) {
                    const opacity = star.opacity * (0.6 + 0.4 * Math.sin(star.twinklePhase));
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
                    ctx.fill();
                    star.twinklePhase += star.twinkleSpeed;
                    star.y += star.speed;
                    if (star.y > height) {
                        star.y = 0;
                        star.x = Math.random() * width;
                    }
                }
                requestAnimationFrame(draw);
            }
            resize();
            createStars();
            draw();
            window.addEventListener('resize', () => { resize(); createStars(); });
        }

        // ================================================================
        // 💳 CARGAR PAGOS
        // ================================================================

        async function cargarPagos() {
            const userId = localStorage.getItem('csariels_user_id');
            const list = document.getElementById('pagosList');

            if (!userId) {
                list.innerHTML = `
                    <div class="empty-pagos">
                        <div class="icono">🔒</div>
                        <p>Inicia sesión para ver tus pagos.</p>
                        <button class="btn btn-primary" onclick="window.location.href='../../../index.html'" style="margin-top:8px;">
                            <i class="fas fa-sign-in-alt"></i> Iniciar sesión
                        </button>
                    </div>
                `;
                return;
            }

            try {
                const { data, error } = await supabase
                    .from('pagos_comerciantes')
                    .select('*')
                    .eq('comerciante_id', userId)
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (!data || data.length === 0) {
                    list.innerHTML = `
                        <div class="empty-pagos">
                            <div class="icono">📭</div>
                            <p>No tienes pagos registrados aún.</p>
                            <button class="btn btn-gold" onclick="window.location.href='../registrar/index.html'" style="margin-top:8px;">
                                <i class="fas fa-store"></i> Registrar mi negocio
                            </button>
                        </div>
                    `;
                    return;
                }

                // Calcular estadísticas
                let total = 0;
                let activos = 0;
                data.forEach(p => {
                    if (p.status === 'pagado' || p.status === 'activo') {
                        total += p.monto || 0;
                        activos++;
                    }
                });

                document.getElementById('totalPagado').textContent = `$${total.toFixed(2)}`;
                document.getElementById('pagosActivos').textContent = activos;

                // Próximo pago (el más reciente)
                const proximo = data.find(p => p.status === 'pendiente' || p.status === 'activo');
                if (proximo) {
                    const fecha = new Date(proximo.created_at);
                    document.getElementById('proximoPago').textContent = fecha.toLocaleDateString('es-ES');
                }

                // Renderizar lista
                list.innerHTML = data.map(p => {
                    const estadoClass = p.status === 'pagado' || p.status === 'activo' ? 'pagado' :
                                      p.status === 'pendiente' ? 'pendiente' : 'vencido';
                    const estadoLabel = p.status === 'pagado' || p.status === 'activo' ? '✅ Pagado' :
                                       p.status === 'pendiente' ? '⏳ Pendiente' : '❌ Vencido';
                    const fecha = new Date(p.created_at).toLocaleDateString('es-ES');
                    const monto = p.monto || 0;

                    return `
                        <div class="pago-item">
                            <div class="info">
                                <div class="concepto">${p.concepto || 'Registro de comerciante'}</div>
                                <div class="fecha">📅 ${fecha} · ${p.metodo_pago || 'Transferencia'}</div>
                            </div>
                            <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
                                <span class="monto">$${monto.toFixed(2)} MXN</span>
                                <span class="estado ${estadoClass}">${estadoLabel}</span>
                                ${p.status === 'pagado' ? `<button class="btn btn-outline btn-sm" onclick="descargarComprobante('${p.id}')"><i class="fas fa-download"></i></button>` : ''}
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (error) {
                console.error('❌ Error cargando pagos:', error);
                list.innerHTML = `
                    <div class="empty-pagos">
                        <div class="icono">⚠️</div>
                        <p>Error al cargar tus pagos</p>
                        <button class="btn btn-gold" onclick="cargarPagos()" style="margin-top:8px;">
                            <i class="fas fa-sync"></i> Reintentar
                        </button>
                    </div>
                `;
            }
        }
