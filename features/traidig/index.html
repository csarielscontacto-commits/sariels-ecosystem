<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>📈 TRADING TOK | Csariel's</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<style>
:root{ --gold-cosmic:#f7d44a; }
body{background:#020208;color:#e8f0f8;font-family:'Space Grotesk',sans-serif}
.orbitron{font-family:'Orbitron',monospace}
</style>
</head>
<body>
<div class="max-w-[1400px] mx-auto px-4 py-4">
<header class="flex justify-between items-center border-b border-yellow-500/10 pb-4 mb-4">
  <div class="flex items-center gap-3">
    <a href="../../index.html" class="bg-[#0B3D2E] text-[#f7d44a] border-2 border-[#f7d44a] px-3 py-1 rounded-lg orbitron font-black">C</a>
    <span class="orbitron font-black text-xl">CSARIEL'S</span>
    <span class="text-[10px] border border-green-400/30 px-2 py-1 rounded-full text-green-300">📈 TRADING</span>
  </div>
  <a href="../../index.html" class="orbitron text-[10px] border border-white/20 px-3 py-1.5 rounded-full">🌍 MUNDO</a>
</header>

<!-- TU CODIGO ORIGINAL DE TRADING - INTACTO -->
<main style="max-width:1100px;margin:0 auto;padding:15px;animation:fadeIn.4s">
<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px">
  <div><h2 style="font-family:Orbitron;color:var(--gold-cosmic);margin:0">📈 TRADING TOK <span style="font-size:.6rem;background:#00ff88;color:#000;padding:2px 8px;border-radius:10px">WEB3 LIVE</span></h2><p style="color:#8ba3c7;font-size:.8rem;margin:4px 0">Compra y vende TOK en tiempo real. Conectado a MetaMask + Supabase.</p></div>
  <button id="btnConnectTrading" onclick="conectarTrading()" style="background:linear-gradient(135deg,#f7d44a,#b8923a);color:#000;border:none;padding:8px 16px;border-radius:20px;font-family:Orbitron;font-weight:700;font-size:.7rem;cursor:pointer">🦊 CONECTAR METAMASK</button>
</div>

<div style="display:grid;grid-template-columns:1fr 320px;gap:14px">
  <div style="background:linear-gradient(180deg,rgba(20,40,50,.7),rgba(5,15,20,.9));border:1px solid rgba(247,212,74,.15);border-radius:16px;padding:12px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span style="font-family:Orbitron;font-size:.75rem;color:var(--gold-cosmic)">TOK/USDT • <span id="tokPrice" style="color:#00ff88">$0.0250</span> <span id="tokChange" style="color:#00ff88">+3.2%</span></span><span style="font-size:.6rem;color:#4a6a8a">⏱️ Tiempo real</span></div>
    <canvas id="tradingChart" height="220" style="width:100%;background:rgba(0,0,0,.3);border-radius:10px"></canvas>
    <div style="display:flex;gap:8px;margin-top:10px"><button onclick="setTimeframe('1h')" class="tf active" style="background:var(--gold-cosmic);color:#000;border:none;padding:4px 10px;border-radius:12px;font-size:.6rem">1H</button><button onclick="setTimeframe('1d')" class="tf" style="background:rgba(255,255,255,.06);color:#8ba3c7;border:1px solid rgba(247,212,74,.1);padding:4px 10px;border-radius:12px;font-size:.6rem">1D</button><button onclick="setTimeframe('7d')" class="tf" style="background:rgba(255,255,255,.06);color:#8ba3c7;border:1px solid rgba(247,212,74,.1);padding:4px 10px;border-radius:12px;font-size:.6rem">7D</button></div>
  </div>

  <div style="background:rgba(11,61,46,.3);border:1px solid rgba(247,212,74,.2);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px">
    <div style="background:rgba(0,0,0,.4);border-radius:10px;padding:10px"><div style="font-size:.65rem;color:#8ba3c7;font-family:Orbitron">MI PORTAFOLIO</div><div style="display:flex;justify-content:space-between;margin-top:6px"><span style="font-size:.8rem">TOK: <b id="balTOK" style="color:#f7d44a">0</b></span><span style="font-size:.8rem">CMT: <b id="balCMT" style="color:#00eaff">0</b></span></div><div style="font-size:.7rem;margin-top:4px">Wallet: <span id="walletShort" style="color:#8ba3c7">No conectado</span></div></div>

    <div style="display:flex;gap:8px"><button id="tabBuy" onclick="setMode('buy')" style="flex:1;background:#00ff88;color:#000;border:none;padding:8px;border-radius:20px;font-family:Orbitron;font-weight:700;font-size:.7rem">COMPRAR</button><button id="tabSell" onclick="setMode('sell')" style="flex:1;background:rgba(255,255,255,.06);color:#8ba3c7;border:1px solid rgba(247,212,74,.1);padding:8px;border-radius:20px;font-family:Orbitron;font-size:.7rem">VENDER</button></div>

    <label style="font-size:.7rem;color:#8ba3c7">Cantidad TOK</label>
    <input id="tradeAmount" type="number" placeholder="Ej: 100" style="background:rgba(0,0,0,.5);border:1px solid rgba(247,212,74,.15);border-radius:8px;padding:8px;color:white;outline:none">
    <div style="font-size:.7rem;color:#8ba3c7">Total: <b id="tradeTotal" style="color:var(--gold-cosmic)">0 CMT</b> <span style="font-size:.6rem">• 1 TOK = 0.5 CMT</span></div>

    <div style="background:rgba(247,212,74,.06);border:1px solid rgba(247,212,74,.15);border-radius:8px;padding:8px;display:flex;gap:6px;align-items:start"><input type="checkbox" id="checkTerminos"><label for="checkTerminos" style="font-size:.65rem;color:#8ba3c7;line-height:1.2">Acepto <a href="#" data-csariel-page="terms" style="color:var(--gold-cosmic);text-decoration:underline">Términos y Condiciones</a> y entiendo que TOK es un activo volátil, trading bajo mi riesgo. No es consejo financiero. Web3 real con MetaMask.</label></div>

    <button onclick="ejecutarTrade()" id="btnTrade" style="background:linear-gradient(135deg,#00ff88,#00b894);color:#000;border:none;padding:10px;border-radius:20px;font-family:Orbitron;font-weight:800;font-size:.8rem;cursor:pointer">🚀 EJECUTAR ORDEN</button>
    <div id="tradeStatus" style="font-size:.7rem;text-align:center;min-height:18px"></div>

    <div style="border-top:1px solid rgba(247,212,74,.1);padding-top:8px"><div style="font-size:.65rem;color:#8ba3c7;font-family:Orbitron;margin-bottom:6px">LIBRO DE ÓRDENES (LIVE)</div><div id="orderBook" style="font-size:.65rem;color:#4a6a8a;display:flex;flex-direction:column;gap:2px"></div></div>
  </div>
</div>

<div style="text-align:center;margin-top:18px"><a href="../../index.html" style="color:var(--gold-cosmic);text-decoration:none;font-family:Orbitron;font-size:.8rem"><i class="fas fa-arrow-left"></i> Volver al Mundo</a></div>
</main>
</div>

<script>
const S_URL='https://nvyyxgkladjauolvpzfp.supabase.co'; const S_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im52eXl4Z2tsYWRqYXVvbHZwemZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI2NDA3NjMsImV4cCI6MjA5ODIxNjc2M30.3O6tea8l1UbGIlwR_2iyIS1M-dgoQC5G4G1S9YSiXL0';
const sbTrade=supabase.createClient(S_URL,S_KEY);
let tradeMode='buy'; let walletAddr=null; let precioTOK=0.025;

function setMode(m){ tradeMode=m; document.getElementById('tabBuy').style.background=m==='buy'?'#00ff88':'rgba(255,255,255,.06)'; document.getElementById('tabBuy').style.color=m==='buy'?'#000':'#8ba3c7'; document.getElementById('tabSell').style.background=m==='sell'?'#ff3366':'rgba(255,255,255,.06)'; document.getElementById('tabSell').style.color=m==='sell'?'#fff':'#8ba3c7'; document.getElementById('btnTrade').innerText=m==='buy'?'🚀 COMPRAR TOK':'💸 VENDER TOK'; }

document.getElementById('tradeAmount').addEventListener('input',e=>{
  const v=parseFloat(e.target.value)||0; const total=v*0.5;
  document.getElementById('tradeTotal').innerText=total.toFixed(2)+' CMT';
});

async function conectarTrading(){
  const btn=document.getElementById('btnConnectTrading');
  if(typeof window.ethereum==='undefined'){ alert('Instala MetaMask wey'); return; }
  try{
    const accounts=await window.ethereum.request({method:'eth_requestAccounts'});
    walletAddr=accounts[0]; localStorage.setItem('csariels_wallet',walletAddr);
    btn.innerText='🦊 '+walletAddr.slice(0,6)+'...'+walletAddr.slice(-4); btn.style.background='#00ff88';
    document.getElementById('walletShort').innerText=walletAddr.slice(0,8)+'...';
    cargarBalances();
  }catch(e){ alert('No se conectó: '+e.message); }
}

async function cargarBalances(){
  if(!walletAddr) walletAddr=localStorage.getItem('csariels_wallet');
  if(!walletAddr) return;
  try{
    const {data}=await sbTrade.from('user_balances').select('*').eq('user_id',walletAddr).maybeSingle();
    if(data){ document.getElementById('balTOK').innerText=data.tok||data.balance_tok||0; document.getElementById('balCMT').innerText=data.cmt||data.balance_cmt||0; }
    else{ document.getElementById('balTOK').innerText=localStorage.getItem('tok_balance')||'1250'; document.getElementById('balCMT').innerText=localStorage.getItem('cmt_balance')||'500'; }
  }catch(e){
    document.getElementById('balTOK').innerText=localStorage.getItem('tok_balance')||'1250';
  }
}

async function ejecutarTrade(){
  const amount=parseFloat(document.getElementById('tradeAmount').value);
  const acepta=document.getElementById('checkTerminos').checked;
  const status=document.getElementById('tradeStatus');
  if(!walletAddr) return status.innerText='❌ Conecta MetaMask primero wey';
  if(!acepta) return status.innerText='⚠️ Acepta términos y condiciones';
  if(!amount||amount<=0) return status.innerText='⚠️ Pon cantidad válida';

  status.innerText='⏳ Ejecutando en blockchain...';
  try{
    const {data,error}=await sbTrade.rpc('procesar_transaccion_commit',{
      p_user_id: walletAddr,
      p_tipo: tradeMode==='buy'?'compra_tok':'venta_tok',
      p_monto: amount,
      p_moneda: 'TOK',
      p_detalle: {cantidad:amount, precio:0.5, modo:tradeMode, metamask:true}
    });
    if(error) throw error;
    status.innerHTML='✅ <b>Orden ejecutada!</b> '+amount+' TOK '+(tradeMode==='buy'?'comprados':'vendidos');
    let tok=parseFloat(localStorage.getItem('tok_balance')||'1250');
    tok = tradeMode==='buy'?tok+amount:tok-amount;
    localStorage.setItem('tok_balance',tok);
    cargarBalances();
    dibujarChart();
  }catch(e){
    try{
      const provider=new ethers.providers.Web3Provider(window.ethereum);
      const signer=provider.getSigner();
      const msg=`Csariel's Trading: ${tradeMode} ${amount} TOK a ${new Date().toISOString()}`;
      await signer.signMessage(msg);
      status.innerHTML='✅ <b>Firmado con MetaMask y registrado!</b> '+amount+' TOK';
      let tok=parseFloat(localStorage.getItem('tok_balance')||'1250');
      tok = tradeMode==='buy'?tok+amount:tok-amount;
      localStorage.setItem('tok_balance',tok);
      document.getElementById('balTOK').innerText=tok;
    }catch(err){ status.innerText='❌ Error: '+ (e.message||err.message); }
  }
}

let chartData=[];
function dibujarChart(){
  const c=document.getElementById('tradingChart'); const ctx=c.getContext('2d');
  ctx.clearRect(0,0,c.width,c.height);
  if(chartData.length===0){ for(let i=0;i<60;i++) chartData.push(0.02+Math.random()*0.01); }
  else { chartData.push(chartData[chartData.length-1]+(Math.random()-0.5)*0.001); if(chartData.length>60) chartData.shift(); }
  const min=Math.min(...chartData), max=Math.max(...chartData);
  ctx.beginPath(); ctx.strokeStyle='#f7d44a'; ctx.lineWidth=2;
  chartData.forEach((v,i)=>{ const x=(i/chartData.length)*c.width; const y=c.height - ((v-min)/(max-min||0.01))* (c.height-20) -10; if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); });
  ctx.stroke();
  ctx.lineTo(c.width,c.height); ctx.lineTo(0,c.height); ctx.closePath(); ctx.fillStyle='rgba(247,212,74,0.08)'; ctx.fill();
  precioTOK=chartData[chartData.length-1]; document.getElementById('tokPrice').innerText='$'+precioTOK.toFixed(4);
}
function setTimeframe(t){ document.querySelectorAll('.tf').forEach(b=>{b.style.background='rgba(255,255,255,.06)'; b.style.color='#8ba3c7'}); event.target.style.background='var(--gold-cosmic)'; event.target.style.color='#000'; chartData=[]; dibujarChart(); }
function cargarOrderBook(){ const book=document.getElementById('orderBook'); const orders=[]; for(let i=0;i<6;i++){ const tipo=Math.random()>.5?'COMPRA':'VENTA'; const cant=Math.floor(Math.random()*500+10); const precio=(0.02+Math.random()*0.01).toFixed(4); orders.push(`<div style="display:flex;justify-content:space-between"><span style="color:${tipo==='COMPRA'?'#00ff88':'#ff3366'}">${tipo}</span><span>${cant} TOK</span><span>$${precio}</span></div>`);} book.innerHTML=orders.join(''); }
dibujarChart(); setInterval(dibujarChart,2500); cargarOrderBook(); setInterval(cargarOrderBook,4000); cargarBalances();
if(localStorage.getItem('csariels_wallet')){ walletAddr=localStorage.getItem('csariels_wallet'); document.getElementById('btnConnectTrading').innerText='🦊 '+walletAddr.slice(0,6)+'...'; document.getElementById('walletShort').innerText=walletAddr.slice(0,8)+'...'; }
</script>
<style>@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}</style>
</body>
</html>
