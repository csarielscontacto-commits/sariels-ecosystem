<main style="padding:20px; animation: fadeIn 0.5s ease; max-width: 800px; margin: 0 auto;">
    <div style="background:rgba(11,61,46,0.2); border:1px solid var(--gold-dim); border-radius:var(--radius); padding:40px; backdrop-filter:blur(10px);">
        <div style="display:flex; justify-content:space-between; align-items:center; padding-bottom:20px; border-bottom:2px solid var(--gold-dim); margin-bottom:28px; flex-wrap:wrap; gap:12px;">
            <div style="display:flex; align-items:center; gap:12px; text-decoration:none;">
                <span style="display:inline-block; background:var(--verde-bosque); color:var(--gold-cosmic); padding:4px 12px; border-radius:8px; font-size:1.2rem; font-weight:900; border:2px solid var(--gold-cosmic); font-family:'Orbitron', monospace;">◈</span>
                <span style="font-family:'Orbitron', monospace; font-size:1.3rem; font-weight:700; background:linear-gradient(135deg, var(--gold-cosmic), var(--verde-bosque-light)); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">Csariel's</span>
                <span style="font-family:'Orbitron', monospace; font-size:0.5rem; background:var(--verde-bosque); color:var(--gold-cosmic); padding:4px 12px; border-radius:20px; border:1px solid var(--gold-dim);">Contrato</span>
            </div>
            <a href="#" data-csariel-page="home" style="display:inline-flex; align-items:center; gap:8px; padding:8px 16px; border:1px solid var(--gold-dim); border-radius:30px; color:var(--text-secondary); text-decoration:none; font-size:0.7rem; font-family:'Orbitron', monospace; transition:var(--transition);">
                <i class="fas fa-arrow-left"></i> Volver
            </a>
        </div>
        <h1 style="font-family:'Orbitron', monospace; color:var(--gold-cosmic); font-size:1.8rem; margin-bottom:4px;">📄 Contrato de Creador</h1>
        <div style="color:var(--text-secondary); font-size:0.9rem; margin-bottom:24px;">Streamers y Creadores</div>
        <p style="color:var(--text-secondary);"><strong>Requisitos:</strong> Mayor de 18 años, 1,000 seguidores.</p>
        <p style="color:var(--text-secondary);"><strong>Monetización:</strong> 50% Creador / 50% Csariel's.</p>
        <div style="text-align:center; margin-top:20px;">
            <a href="#" data-csariel-page="home" style="color:var(--gold-cosmic); text-decoration:none; font-family:'Orbitron', monospace; font-size:0.9rem;">
                <i class="fas fa-arrow-left"></i> Volver al Inicio
            </a>
        </div>
    </div>
</main>
<style>@keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }</style>
