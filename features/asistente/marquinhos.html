            // ===== DISNEY SPEAK CON LIP SYNC =====
            function speakWithDisneyMouth(text, options = {}) {
                if (!('speechSynthesis' in window)) {
                    console.warn('Web Speech API no soportada.');
                    return null;
                }

                if (window.MarquinhosCognitiveAI && window.MarquinhosCognitiveAI.isOnCall()) {
                    console.log('📞 En llamada, Marquinhos no habla.');
                    return null;
                }

                let safeText = String(text || '');
                if (window.MarquinhosCognitiveAI && window.MarquinhosCognitiveAI.isChildDetected()) {
                    const offensiveWords = ['pendejo', 'wey', 'güey', 'chinga', 'verga', 'puto', 'culero', 'mamón', 'chingar'];
                    for (const word of offensiveWords) {
                        const regex = new RegExp(word, 'gi');
                        safeText = safeText.replace(regex, 'amigo');
                    }
                    safeText = safeText.replace(/[^a-zA-ZáéíóúüñÁÉÍÓÚÜÑ\s.,;:!?¿¡]/g, '');
                }

                if (!safeText) return null;

                const token = ++state.speechToken;
                state.speaking = true;

                const emotion = options.emotion || 'talking';
                const label = options.caption || safeText;
                setEmotion(emotion, label, 0);

                const utterance = new SpeechSynthesisUtterance(safeText);
                utterance.pitch = 1.08;
                utterance.rate = 1;
                utterance.lang = options.lang || 'es-MX';
                utterance.volume = Number(options.volume) || 1;

                let lastPhoneme = 'neutral';

                utterance.onboundary = (event) => {
                    if (token !== state.speechToken) return;
                    if (event.name === 'phoneme' && event.text) {
                        const phoneme = event.text.toUpperCase().replace(/[^A-Z]/g, '');
                        const intensity = 0.5 + Math.random() * 0.5;
                        DisneyMouth.setShape(phoneme, intensity);
                        lastPhoneme = phoneme;
                    }
                    if (event.name === 'word' || event.name === 'sentence') {
                        if (lastPhoneme !== 'neutral') {
                            DisneyMouth.setShape(lastPhoneme, 0.6);
                        }
                    }
                    state.audioLevel = Math.max(state.audioLevel, 0.2);
                };

                utterance.onstart = () => {
                    if (token !== state.speechToken) return;
                    state.speaking = true;
                    setEmotion(emotion, label, 0);
                    marquinhosEl.classList.add('talking');
                    startVolumeMouthTracking();
                };

                utterance.onend = () => {
                    if (token !== state.speechToken) return;
                    state.speaking = false;
                    state.audioLevel = 0;
                    marquinhosEl.classList.remove('talking');
                    DisneyMouth.reset();
                    setEmotion('caring', 'Listo para escucharte.', 1800);
                    stopVolumeMouthTracking();
                };

                utterance.onerror = () => {
                    if (token !== state.speechToken) return;
                    state.speaking = false;
                    state.audioLevel = 0;
                    marquinhosEl.classList.remove('talking');
                    DisneyMouth.reset();
                    setEmotion('caring', 'Listo para escucharte.', 1800);
                    stopVolumeMouthTracking();
                };

                window.speechSynthesis.cancel();
                window.speechSynthesis.speak(utterance);
                return utterance;
            }

            function startVolumeMouthTracking() {
                if (!state.audioContext) {
                    try {
                        state.audioContext = new(window.AudioContext || window.webkitAudioContext)();
                        state.analyser = state.audioContext.createAnalyser();
                        state.analyser.fftSize = 256;
                        state.audioData = new Uint8Array(state.analyser.fftSize);
                    } catch (e) {
                        return;
                    }
                }

                if (!state.audioSource && window.MarquinhosCognitiveAI?.isMicActive()) {
                    try {
                        const stream = window.MarquinhosCognitiveAI._micStream;
                        if (stream) {
                            state.audioSource = state.audioContext.createMediaStreamSource(stream);
                            state.audioSource.connect(state.analyser);
                        }
                    } catch (e) {}
                }

                if (!state.audioSource) {
                    try {
                        const osc = state.audioContext.createOscillator();
                        const gain = state.audioContext.createGain();
                        gain.gain.value = 0;
                        osc.connect(gain);
                        gain.connect(state.analyser);
                        osc.start();
                        state.audioSource = osc;
                    } catch (e) {}
                }

                if (state.volumeMouthTimeout) {
                    clearInterval(state.volumeMouthTimeout);
                }

                state.volumeMouthTimeout = setInterval(() => {
                    if (!state.speaking) {
                        return;
                    }
                    if (state.analyser && state.audioData) {
                        state.analyser.getByteTimeDomainData(state.audioData);
                        let sum = 0;
                        for (let i = 0; i < state.audioData.length; i++) {
                            const val = (state.audioData[i] - 128) / 128;
                            sum += val * val;
                        }
                        const rms = Math.sqrt(sum / state.audioData.length);
                        const level = clamp(rms * 6, 0, 1);
                        const mouthOpen = Math.min(level * 1.5, 1);
                        if (mouthOpen > 0.05) {
                            DisneyMouth.setOpenAmount(mouthOpen);
                        } else {
                            DisneyMouth.setOpenAmount(0.1);
                        }
                    }
                }, 50);
            }

            function stopVolumeMouthTracking() {
                if (state.volumeMouthTimeout) {
                    clearInterval(state.volumeMouthTimeout);
                    state.volumeMouthTimeout = null;
                }
            }

            const speakWithBrowser = speakWithDisneyMouth;

            // ===== PROCESAR COMANDOS DE VOZ =====
            function processVoiceCommand(transcript) {
                const text = transcript.toLowerCase();

                // === DETECTOR ORA ===
                if (OraDetector.check(text)) {
                    DisneyMouth.triggerOra();
                    return;
                }

                if (text.includes('salir') || text.includes('adiós') || text.includes('hasta luego')) {
                    state.isListening = false;
                    if (micIndicator) micIndicator.classList.remove('active');
                    if (micStatus) micStatus.textContent = '⏸️ En espera';
                    let farewellMsg = "¡Hasta luego! Fue un placer.";
                    setEmotion('waving', farewellMsg, 3000);
                    speakWithDisneyMouth(farewellMsg);
                    setTimeout(() => {
                        state.isListening = true;
                        if (micIndicator) micIndicator.classList.add('active');
                        if (micStatus) micStatus.textContent = '🎤 Escuchando...';
                        state.recognitionRetries = 0;
                        if (state.recognition) {
                            try {
                                state.recognition.start();
                            } catch (e) {}
                        }
                    }, 10000);
                    return;
                }

                if (text.includes('gracias')) {
                    let thanksMsg = "¡De nada! Es un placer ayudarte.";
                    react('grateful', thanksMsg);
                    return;
                }

                if (text.includes('cómo estás') || text.includes('qué tal')) {
                    let howMsg = "¡Estoy muy bien! ¿Y tú cómo estás?";
                    setEmotion('happy', howMsg, 3000);
                    speakWithDisneyMouth(howMsg);
                    return;
                }

                if (text.includes('quién eres') || text.includes('qué haces')) {
                    let whoMsg = "Soy Marquinhos, tu asistente de voz. Estoy aquí para ayudarte y acompañarte.";
                    setEmotion('caring', whoMsg, 5000);
                    speakWithDisneyMouth(whoMsg);
                    return;
                }

                if (text.includes('llamada') || text.includes('teléfono') || text.includes('llamar')) {
                    if (window.MarquinhosCognitiveAI && window.MarquinhosCognitiveAI.callStart) {
                        window.MarquinhosCognitiveAI.callStart();
                        const msg = 'Entendido, pausando para la llamada.';
                        setEmotion('thinking', msg, 3000);
                        speakWithDisneyMouth(msg);
                    }
                    return;
                }

                if (text.includes('colgar') || text.includes('terminar llamada') || text.includes('finalizar')) {
                    if (window.MarquinhosCognitiveAI && window.MarquinhosCognitiveAI.callEnd) {
                        window.MarquinhosCognitiveAI.callEnd();
                    }
                    return;
                }

                if (window.MarquinhosCognitiveAI && window.MarquinhosCognitiveAI.isOnCall()) {
                    return;
                }

                if (window.MarquinhosCognitiveAI && typeof window.MarquinhosCognitiveAI.evalInput === 'function') {
                    const result = window.MarquinhosCognitiveAI.evalInput(text);
                    if (result.message) {
                        setEmotion('talking', result.message, 4500);
                        speakWithDisneyMouth(result.message);
                        return;
                    }
                }

                let fallbackMsg = "No entendí bien, ¿puedes repetirlo?";
                setEmotion('thinking', fallbackMsg, 3500);
                speakWithDisneyMouth(fallbackMsg);
            }

            // ===== RECONOCIMIENTO DE VOZ =====
            function initSpeechRecognition() {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) {
                    console.warn('⚠️ Speech Recognition no soportado en este navegador.');
                    return;
                }

                state.recognition = new SpeechRecognition();
                state.recognition.lang = 'es-MX';
                state.recognition.continuous = true;
                state.recognition.interimResults = true;
                state.recognition.maxAlternatives = 1;

                const activationWords = ['hola marquinhos', 'marquinhos', 'hey marquinhos', 'buenas marquinhos'];

                state.recognition.onresult = (event) => {
                    state.recognitionRetries = 0;
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        const transcript = event.results[i][0].transcript.toLowerCase().trim();
                        if (micStatus) {
                            micStatus.textContent = '🎤 ' + (event.results[i].isFinal ? 'Escuchando...' : '...');
                        }
                        if (event.results[i].isFinal) {
                            console.log('🎤 Dijiste:', transcript);
                            const isActivation = activationWords.some(word => transcript.includes(word));
                            if (isActivation) {
                                const msg = window.MarquinhosCognitiveAI.getActivationPhrase();
                                react('greet', msg);
                                state.isListening = true;
                                if (micIndicator) micIndicator.classList.add('active');
                                continue;
                            }
                            if (state.isListening) {
                                if (window.MarquinhosCognitiveAI && window.MarquinhosCognitiveAI.isOnCall()) {
                                    continue;
                                }
                                processVoiceCommand(transcript);
                            }
                        }
                    }
                };

                state.recognition.onerror = (event) => {
                    console.warn('⚠️ Error de reconocimiento:', event.error);
                    if (event.error === 'not-allowed') {
                        state.recognitionRetries = state.maxRetries;
                        if (micStatus) micStatus.textContent = '🔇 Toca el micrófono para activar';
                        showMicPermissionMessage();
                        return;
                    }
                    if (state.recognitionRetries < state.maxRetries) {
                        state.recognitionRetries++;
                        const delay = [1000, 3000, 6000][state.recognitionRetries - 1] || 3000;
                        console.log(`🔄 Reintento ${state.recognitionRetries}/${state.maxRetries} en ${delay}ms...`);
                        if (micStatus) {
                            micStatus.textContent = `⏳ Reintentando (${state.recognitionRetries}/${state.maxRetries})...`;
                        }
                        clearTimeout(state.retryTimeout);
                        state.retryTimeout = setTimeout(() => {
                            if (state.isListening) {
                                try {
                                    state.recognition.start();
                                } catch (e) {}
                            }
                        }, delay);
                    } else {
                        console.log('❌ Máximo de reintentos alcanzado.');
                        if (micStatus) micStatus.textContent = '🔇 Toca el micrófono para reactivar';
                        showMicPermissionMessage();
                        state.isListening = false;
                        if (micIndicator) micIndicator.classList.remove('active');
                    }
                };

                state.recognition.onend = () => {
                    if (state.recognitionRetries >= state.maxRetries) {
                        return;
                    }
                    if (state.isListening) {
                        clearTimeout(state.retryTimeout);
                        state.retryTimeout = setTimeout(() => {
                            try {
                                state.recognition.start();
                            } catch (e) {}
                        }, 500);
                    }
                };

                try {
                    state.recognition.start();
                    state.isListening = true;
                    state.recognitionRetries = 0;
                    if (micIndicator) micIndicator.classList.add('active');
                    if (micStatus) micStatus.textContent = '🎤 Escuchando...';
                    console.log('🎤 Reconocimiento de voz iniciado.');
                } catch (e) {
                    console.warn('⚠️ No se pudo iniciar reconocimiento:', e);
                }
            }

            function showMicPermissionMessage() {
                const msg = '🔇 Necesito permiso del micrófono. Toca el avatar para activarlo.';
                if (window.MarquinhosCognitiveAI && typeof window.MarquinhosCognitiveAI.triggerReaction === 'function') {
                    window.MarquinhosCognitiveAI.triggerReaction('permission', msg);
                }
                if (bubbleEl) {
                    bubbleEl.innerHTML = `<strong>⭐ Marquinhos</strong> · ${msg}`;
                }
            }

            function setEmotion(emotion, text, duration = 3200) {
                const next = validEmotions.has(emotion) ? emotion : 'caring';
                clearTimeout(resetTimer);

                marquinhosEl.classList.remove(...validEmotions);
                marquinhosEl.classList.add(next);
                state.emotion = next;

                if (text) {
                    let safeText = String(text);
                    if (window.MarquinhosCognitiveAI && window.MarquinhosCognitiveAI.isChildDetected()) {
                        const offensiveWords = ['pendejo', 'wey', 'güey', 'chinga', 'verga', 'puto', 'culero', 'mamón'];
                        for (const word of offensiveWords) {
                            const regex = new RegExp(word, 'gi');
                            safeText = safeText.replace(regex, '****');
                        }
                    }
                    captionEl.textContent = safeText;
                    bubbleEl.innerHTML = `<strong>⭐ Marquinhos</strong> · ${safeText}`;
                }

                if (duration > 0) {
                    resetTimer = window.setTimeout(() => {
                        if (!state.speaking) {
                            resetState();
                        }
                    }, duration);
                }
            }

            function react(kind, message = '') {
                const text = String(message).toLowerCase();

                if (window.MarquinhosCognitiveAI && window.MarquinhosCognitiveAI.isOnCall()) {
                    const callMsg = '📞 Disculpa, estoy en una llamada. En cuanto termine, retomamos nuestra conversación.';
                    setEmotion('thinking', callMsg, 3000);
                    speakWithDisneyMouth(callMsg);
                    return;
                }

                const isChild = window.MarquinhosCognitiveAI && window.MarquinhosCognitiveAI.isChildDetected();

                if (kind === 'greet' || text.includes('hola') || text.includes('buenas') || text.includes('bienvenido')) {
                    let msg = isChild ? "¡Hola! Qué gusto verte. ¿Cómo estás hoy?" :
                        "Hola, qué gusto verte.";
                    setEmotion('waving', msg, 3800);
                    speakWithDisneyMouth(msg);
                    return;
                }
                if (kind === 'happy' || text.includes('gracias') || text.includes('excelente') || text.includes('genial')) {
                    let msg = isChild ? "¡Qué bien! Me alegra mucho que estés feliz." :
                        "Me alegra mucho.";
                    setEmotion('happy', msg, 3000);
                    speakWithDisneyMouth(msg);
                    return;
                }
                if (kind === 'loving' || text.includes('cariño') || text.includes('amor') || text.includes('te quiero')) {
                    let msg = isChild ? "Yo también te quiero mucho. Eres muy especial." :
                        "Te acompaño con cariño.";
                    setEmotion('loving', msg, 4200);
                    speakWithDisneyMouth(msg);
                    return;
                }
                if (kind === 'sad' || text.includes('triste') || text.includes('mal') || text.includes('problema')) {
                    let msg = isChild ? "No te preocupes, todo va a estar bien. Estoy aquí contigo." :
                        "Estoy contigo.";
                    setEmotion('sad', msg, 4200);
                    speakWithDisneyMouth(msg);
                    return;
                }
                if (kind === 'surprised' || text.includes('wow') || text.includes('increíble') || text.includes('sorpresa')) {
                    let msg = isChild ? "¡Qué increíble! Eso es muy interesante." :
                        "Qué interesante.";
                    setEmotion('surprised', msg, 2800);
                    speakWithDisneyMouth(msg);
                    return;
                }
                if (kind === 'thinking' || text.includes('espera') || text.includes('pensando') || text.includes('analizando')) {
                    let msg = isChild ? "Dame un momentito para pensar en eso." :
                        "Estoy pensando.";
                    setEmotion('thinking', msg, 3800);
                    speakWithDisneyMouth(msg);
                    return;
                }
                if (kind === 'wink') {
                    let msg = isChild ? "¡Aquí estoy! Siempre listo para ayudarte." :
                        "Aquí estoy.";
                    setEmotion('wink', msg, 2400);
                    speakWithDisneyMouth(msg);
                    return;
                }
                if (kind === 'excited' || text.includes('vamos') || text.includes('celebrar')) {
                    let msg = isChild ? "¡Vamos! Esto va a ser muy divertido." :
                        "¡Vamos!";
                    setEmotion('excited', msg, 2600);
                    speakWithDisneyMouth(msg);
                    return;
                }
                if (kind === 'grateful' || text.includes('agradecido') || text.includes('muchas gracias')) {
                    let msg = isChild ? "Gracias a ti por ser tan amable." :
                        "Gracias por confiar en mí.";
                    setEmotion('grateful', msg, 3200);
                    speakWithDisneyMouth(msg);
                    return;
                }
                if (kind === 'embarrassed' || text.includes('error') || text.includes('vergüenza')) {
                    let msg = isChild ? "No pasa nada, todos cometemos errores. Lo importante es aprender." :
                        "Ups... tienes razón.";
                    setEmotion('embarrassed', msg, 3200);
                    speakWithDisneyMouth(msg);
                    return;
                }
                if (kind === 'curious' || text.includes('qué opinas') || text.includes('por qué')) {
                    let msg = isChild ? "¡Qué buena pregunta! Vamos a descubrir la respuesta juntos." :
                        "Quiero entender mejor.";
                    setEmotion('curious', msg, 3200);
                    speakWithDisneyMouth(msg);
                    return;
                }
                if (kind === 'tired' || text.includes('cansado') || text.includes('mucho tiempo')) {
                    let msg = isChild ? "Vamos a descansar un poquito, ¿te parece?" :
                        "Tomemos un pequeño descanso.";
                    setEmotion('tired', msg, 3600);
                    speakWithDisneyMouth(msg);
                    return;
                }
                if (kind === 'thrilled' || text.includes('lo logramos') || text.includes('celebración')) {
                    let msg = isChild ? "¡Lo logramos! ¡Eso es fantástico!" :
                        "¡Esto es extraordinario!";
                    setEmotion('thrilled', msg, 3200);
                    speakWithDisneyMouth(msg);
                    return;
                }

                let fallbackMsg = isChild ? "Cuéntame más, me interesa mucho lo que dices." :
                    "Cuéntame más.";
                setEmotion('talking', fallbackMsg, 2600);
                speakWithDisneyMouth(fallbackMsg);
            }

            function initColorPicker() {
                let savedColor = '#6C3CE0';
                try {
                    const stored = localStorage.getItem('marquinhos_color_preference');
                    if (stored) savedColor = stored;
                } catch (e) {}

                applyColor(savedColor);

                colorOptions.forEach(opt => {
                    const color = opt.dataset.color;
                    opt.classList.toggle('active', color === savedColor);
                });

                paletteToggle.addEventListener('click', (e) => {
                    e.stopPropagation();
                    paletteOptions.classList.toggle('open');
                });

                document.addEventListener('click', () => {
                    paletteOptions.classList.remove('open');
                });

                colorOptions.forEach(opt => {
                    opt.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const color = opt.dataset.color;
                        const name = opt.dataset.name;

                        colorOptions.forEach(o => o.classList.remove('active'));
                        opt.classList.add('active');

                        applyColor(color);

                        if (bubbleEl) {
                            bubbleEl.innerHTML =
                                `<strong>🎨 Color</strong> · Cambiado a "${name}"`;
                            setTimeout(() => {
                                if (!state.speaking) {
                                    bubbleEl.innerHTML =
                                        '<strong>⭐ Marquinhos</strong> · Di "Hola Marquinhos" para activarme';
                                }
                            }, 3000);
                        }

                        paletteOptions.classList.remove('open');
                        console.log(`🎨 Color cambiado a: ${name} (${color})`);
                    });
                });
            }

            function analyseAudio() {
                if (!state.analyser || !state.audioData) {
                    if (!state.speaking) state.audioLevel *= 0.88;
                    return;
                }
                state.analyser.getByteTimeDomainData(state.audioData);
                let sum = 0;
                for (let i = 0; i < state.audioData.length; i += 1) {
                    const normalized = (state.audioData[i] - 128) / 128;
                    sum += normalized * normalized;
                }
                const rms = Math.sqrt(sum / state.audioData.length);
                const level = clamp(rms * 5.2, 0, 1);
                state.audioLevel += (level - state.audioLevel) * 0.28;
                state.speaking = level > 0.025;
            }

            function blink(now) {
                if (now >= state.nextBlink && now > state.blinkUntil) {
                    state.blinkUntil = now + 135;
                    state.nextBlink = now + 3200 + Math.random() * 5000;
                }
                const blinking = now < state.blinkUntil;
                eyes.forEach((eye, index) => {
                    if (blinking) {
                        eye.style.clipPath = 'inset(46% 0 46% 0 round 50%)';
                        if (index === 1) eye.style.transform = 'scaleY(.94)';
                    } else {
                        eye.style.clipPath = 'none';
                        eye.style.transform = 'scaleY(1)';
                    }
                });
            }

            function performIdleAction(now) {
                if (now < state.nextIdleAction) return;
                const actions = ['lookLeft', 'lookRight', 'nod', 'listen', 'antenna'];
                state.idleAction = actions[Math.floor(Math.random() * actions.length)];
                state.idleActionUntil = now + random(900, 1800);
                state.nextIdleAction = now + random(3600, 7200);

                if (state.idleAction === 'lookLeft') setLook(-0.75, -0.04);
                if (state.idleAction === 'lookRight') setLook(0.75, -0.04);
                if (state.idleAction === 'nod') {
                    state.targetTiltX = random(-3, 3);
                    state.targetTiltY = random(-5, 5);
                }
                if (state.idleAction === 'listen') {
                    state.targetTiltY = random(-8, 8);
                    state.targetTiltX = random(2, 5);
                }
            }

            function finishIdleAction(now) {
                if (state.idleAction && now > state.idleActionUntil) {
                    state.idleAction = '';
                    setLook(0, 0);
                    state.targetTiltX = 0;
                    state.targetTiltY = 0;
                }
            }

            function setLook(x = 0, y = 0) {
                state.targetLookX = clamp(Number(x) || 0, -1, 1);
                state.targetLookY = clamp(Number(y) || 0, -1, 1);
            }

            function updateLookAndPosture(delta) {
                const emotion = state.emotion;
                let lookX = state.targetLookX;
                let lookY = state.targetLookY;
                let tiltX = state.targetTiltX;
                let tiltY = state.targetTiltY;

                if (emotion === 'thinking') {
                    lookX = 0.35;
                    lookY = -0.45;
                    tiltY += 5;
                }
                if (emotion === 'curious') {
                    lookX += 0.18;
                    tiltY += 3;
                }
                if (emotion === 'surprised') {
                    lookY = -0.2;
                    tiltX -= 3;
                }
                if (emotion === 'tired') {
                    lookY += 0.12;
                    tiltX += 2;
                }
                if (emotion === 'talking') {
                    tiltY += Math.sin(performance.now() / 870) * 2.2;
                    tiltX += Math.sin(performance.now() / 1130) * 1.2;
                }

                state.lookX += (lookX - state.lookX) * delta * 7;
                state.lookY += (lookY - state.lookY) * delta * 7;
                state.tiltX += (tiltX - state.tiltX) * delta * 5;
                state.tiltY += (tiltY - state.tiltY) * delta * 5;

                const card = document.querySelector('.marquinhos .card');
                if (card) {
                    card.style.transform =
                        `rotateX(${2 + state.tiltX * 0.3}deg) rotateY(${state.tiltY * 0.3}deg)`;
                }

                irises.forEach((iris) => {
                    iris.style.transform =
                        `translate(${state.lookX * 7}px, ${state.lookY * 4}px)`;
                });
            }

            function updateActing(now) {
                const level = state.audioLevel;
                const talking = state.speaking || level > 0.03;

                if (talking) {
                    antennas.forEach((antenna, index) => {
                        const rotation = Math.sin(now / 180 + index) * (5 + level * 12);
                        antenna.style.transform = `rotate(${rotation}deg)`;
                    });
                } else {
                    antennas.forEach((antenna, index) => {
                        const rotation = Math.sin(now / 850 + index) * 7;
                        antenna.style.transform = `rotate(${rotation}deg)`;
                    });
                }
            }

            function animationLoop(now) {
                const delta = Math.min((now - state.lastFrame) / 1000, 0.05);
                state.lastFrame = now;

                analyseAudio();
                blink(now);
                performIdleAction(now);
                finishIdleAction(now);
                updateLookAndPosture(delta);
                updateActing(now);

                requestAnimationFrame(animationLoop);
            }

            window.Marquinhos = {
                react,
                talk: (text) => {
                    let safeText = String(text || '');
                    if (window.MarquinhosCognitiveAI && window.MarquinhosCognitiveAI.isChildDetected()) {
                        const offensiveWords = ['pendejo', 'wey', 'güey', 'chinga', 'verga', 'puto', 'culero', 'mamón',
                            'chingar'
                        ];
                        for (const word of offensiveWords) {
                            const regex = new RegExp(word, 'gi');
                            safeText = safeText.replace(regex, 'amigo');
                        }
                        safeText = safeText.replace(/[^a-zA-ZáéíóúüñÁÉÍÓÚÜÑ\s.,;:!?¿¡]/g, '');
                    }
                    if (!safeText) safeText = "Dime algo, por favor.";
                    setEmotion('talking', safeText, Math.max(2200, safeText.length * 55));
                    speakWithDisneyMouth(safeText);
                },
                setEmotion,
                setLook,
                speak: speakWithDisneyMouth,
                reset: resetState,
                startListening: () => {
                    state.recognitionRetries = 0;
                    if (!state.recognition) {
                        initSpeechRecognition();
                    }
                    state.isListening = true;
                    if (micIndicator) micIndicator.classList.add('active');
                    if (micStatus) micStatus.textContent = '🎤 Escuchando...';
                    try {
                        state.recognition.start();
                    } catch (e) {}
                },
                stopListening: () => {
                    state.isListening = false;
                    if (micIndicator) micIndicator.classList.remove('active');
                    if (micStatus) micStatus.textContent = '⏸️ En espera';
                    try {
                        state.recognition.stop();
                    } catch (e) {}
                },
                isListening: () => state.isListening,
                applyColor: applyColor,
                _disneyMouth: DisneyMouth,
                _triggerOra: () => DisneyMouth.triggerOra()
            };

            initColorPicker();
            requestAnimationFrame(animationLoop);

            console.log('🚀 Marquinhos · Asistente de voz con DISNEY LIP SYNC');
            console.log('🎤 Di "Hola Marquinhos" para activarlo (toca el avatar para activar micrófono).');
            console.log('👶 Detección infantil automática activada.');
            console.log('🎨 Selector de color: toca 🎨 para cambiar el color.');
            console.log('🎬 La boca se mueve al ritmo de los fonemas (como Disney)');
            console.log('😲 Reacción ORA: dice "ORA" cuando le cuentas algo sorprendente');
            console.log('🔒 RLS activado: solo el usuario puede ver/escribir sus datos');

            marquinhosEl.addEventListener('click', () => {
                if (!window.MarquinhosCognitiveAI.isMicActive()) {
                    window.MarquinhosCognitiveAI.requestMicPermission().then(() => {
                        if (state.recognition) {
                            state.recognitionRetries = 0;
                            state.isListening = true;
                            if (micIndicator) micIndicator.classList.add('active');
                            if (micStatus) micStatus.textContent = '🎤 Escuchando...';
                            try {
                                state.recognition.start();
                            } catch (e) {}
                        } else {
                            initSpeechRecognition();
                        }
                    });
                } else if (!state.isListening) {
                    state.recognitionRetries = 0;
                    state.isListening = true;
                    if (micIndicator) micIndicator.classList.add('active');
                    if (micStatus) micStatus.textContent = '🎤 Escuchando...';
                    try {
                        state.recognition.start();
                    } catch (e) {}
                }
            });

            console.log('🎤 Micrófono: se activa al tocar el avatar de Marquinhos.');
            console.log('🎬 Disney Lip Sync: la boca se mueve con cada fonema');
            console.log('😲 Palabras que activan ORA: sorpresa, increíble, no mames, wow, órale, etc.');

        })();
    </script>
</body>
</html>
