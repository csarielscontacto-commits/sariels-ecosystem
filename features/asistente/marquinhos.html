<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#071019">
    <title>Marquinhos · Asistente Flotante</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ===== VARIABLES Y RESET ===== */
        :root {
            --bg: #071019;
            --bg2: #0c1726;
            --card: rgba(9, 15, 24, .74);
            --blue: #1a237e;
            --blue2: #2f47cc;
            --white: #fbfdff;
            --gold: #d7b35c;
            --gold2: #b88b2d;
            --pink: #ffccd8;
            --shadow: rgba(0, 0, 0, .35);
            --glow: rgba(215, 179, 92, .22);
            --speed: .28s;
            --idle: 4s;
            --talavera-white: #F5F5F5;
            --talavera-dark: #0D47A1;
            --talavera-blue: #1565C0;
            --talavera-light: #42A5F5;
            --deep-blue: #0A1E3F;
            --talavera-gold: #FFD700;
            --soft-gold: #FFC107;
            --talavera-green: #00897B;
            --terracotta: #E65100;
            --cream: #FFF8E1;
            --ceramic: #FFFFFF;
            --child-safe: #4CAF50;
            --child-safe-bg: rgba(76, 175, 80, 0.15);
            --call-pause: #FF6B35;
            --call-pause-bg: rgba(255, 107, 53, 0.15);
            --mic-active: #00E5FF;
            --mic-active-bg: rgba(0, 229, 255, 0.15);
            --bluetooth: #2979FF;
            --bluetooth-bg: rgba(41, 121, 255, 0.15);
            /* Color activo (controlado por el usuario) */
            --color-activo: #001A80;
            --color-activo-rgb: 0, 26, 128;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
            font-family: "Space Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        }

        /* ===== ESCENA PRINCIPAL ===== */
        .scene {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: grid;
            place-items: center;
            perspective: 1200px;
            perspective-origin: 50% 42%;
            background: radial-gradient(circle at top, #173757 0%, #0a121d 38%, var(--bg) 100%);
        }

        .ambient {
            position: absolute;
            width: 540px;
            height: 540px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(215, 179, 92, .16) 0%, rgba(47, 71, 204, .08) 35%, transparent 70%);
            filter: blur(8px);
            transform: translateY(40px);
            pointer-events: none;
        }

        .shadow {
            position: absolute;
            bottom: 10%;
            width: 250px;
            height: 42px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 0, 0, .4) 0%, rgba(0, 0, 0, .18) 45%, transparent 70%);
            filter: blur(6px);
            transform: scale(1.15);
            pointer-events: none;
        }

        /* ===== CONTENEDOR PRINCIPAL ===== */
        .marquinhos {
            position: relative;
            width: 300px;
            transform-style: preserve-3d;
            animation: float 4.5s ease-in-out infinite;
            filter: drop-shadow(0 28px 34px rgba(0, 0, 0, .34));
            user-select: none;
            touch-action: none;
            isolation: isolate;
            transition: all 0.5s ease;
        }

        /* ===== TARJETA ===== */
        .card {
            background: linear-gradient(180deg, rgba(15, 23, 36, .8), rgba(7, 12, 20, .82));
            border: 1px solid rgba(255, 255, 255, .08);
            border-radius: 30px;
            padding: 18px 18px 16px;
            backdrop-filter: blur(10px);
            transform: rotateX(2deg);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05), 0 10px 30px rgba(0, 0, 0, .22);
            position: relative;
            transition: all 0.5s ease;
        }

        /* ===== HEAD ===== */
        .head {
            position: relative;
            width: 184px;
            height: 168px;
            margin: 0 auto;
            border: 4px solid var(--color-activo);
            border-radius: 50% 50% 42% 42%;
            overflow: hidden;
            background: radial-gradient(circle at 35% 25%, rgba(255, 255, 255, .95) 0 28%, rgba(245, 249, 255, .98) 42%, #edf2ff 72%, #dfe9ff 100%);
            box-shadow: inset 0 16px 18px rgba(255, 255, 255, .75), inset 0 -18px 30px rgba(20, 40, 90, .06), 0 10px 24px rgba(0, 0, 0, .15);
            transform: translateZ(26px);
            transition: border-color .25s ease, box-shadow .25s ease;
        }

        .head::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 22px 20px, rgba(26, 35, 126, .9) 0 2px, transparent 2.5px),
                radial-gradient(circle at 46px 42px, rgba(26, 35, 126, .75) 0 2px, transparent 2.5px),
                radial-gradient(circle at 70px 18px, rgba(26, 35, 126, .5) 0 2px, transparent 2.5px),
                radial-gradient(circle at 118px 24px, rgba(26, 35, 126, .45) 0 2px, transparent 2.5px),
                radial-gradient(circle at 146px 48px, rgba(26, 35, 126, .72) 0 2px, transparent 2.5px);
            background-size: 56px 56px;
            opacity: .22;
            mix-blend-mode: multiply;
            pointer-events: none;
        }

        .head::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(145deg, rgba(255, 255, 255, .72), transparent 22%),
                linear-gradient(330deg, transparent 58%, rgba(26, 35, 126, .06) 100%);
            pointer-events: none;
        }

        /* ===== ANTENAS ===== */
        .antenna {
            position: absolute;
            top: -24px;
            width: 6px;
            height: 30px;
            border-radius: 999px;
            background: linear-gradient(180deg, var(--blue2), var(--blue));
            transform-origin: bottom center;
            animation: sway 3.2s ease-in-out infinite alternate;
            box-shadow: 0 0 12px rgba(47, 71, 204, .25);
            transition: all 0.5s ease;
        }
        .antenna::after {
            content: "";
            position: absolute;
            left: 50%;
            top: -8px;
            width: 12px;
            height: 12px;
            transform: translateX(-50%);
            border-radius: 50%;
            background: radial-gradient(circle, #ffe9ab 0%, var(--gold) 55%, var(--gold2) 100%);
            box-shadow: 0 0 16px rgba(215, 179, 92, .7);
            transition: all 0.5s ease;
        }
        .antenna.left {
            left: 58px;
        }
        .antenna.right {
            right: 58px;
            animation-delay: .14s;
        }

        /* ===== CEJAS ===== */
        .brow {
            position: absolute;
            top: 32px;
            width: 34px;
            height: 8px;
            border-top: 4px solid var(--color-activo);
            border-radius: 50%;
            z-index: 4;
            opacity: .95;
            transition: transform .25s ease, top .25s ease, border-color .25s ease;
        }
        .brow.left {
            left: 30px;
            transform: rotate(-8deg);
        }
        .brow.right {
            right: 30px;
            transform: rotate(8deg);
        }

        /* ===== OJOS ===== */
        .eye {
            position: absolute;
            top: 46px;
            width: 42px;
            height: 50px;
            border-radius: 50%;
            overflow: hidden;
            background: #111;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .1);
            transition: clip-path 0.15s ease;
        }
        .eye.left {
            left: 30px;
        }
        .eye.right {
            right: 30px;
        }

        .eye::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 42%, #fff 0 56%, #eef4ff 66%, #d7e1ff 100%);
            border-radius: 50%;
            transform: scaleY(.74);
            transition: transform .2s ease;
        }

        .eye::after {
            content: "";
            position: absolute;
            left: 8px;
            right: 8px;
            top: -2px;
            height: 0;
            background: var(--white);
            border-bottom: 3px solid var(--color-activo);
            border-radius: 50%;
            z-index: 3;
            transition: height .2s ease, border-color .25s ease;
        }

        /* ===== IRIS ===== */
        .iris {
            position: absolute;
            z-index: 2;
            width: 18px;
            height: 18px;
            left: 12px;
            top: 14px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #5dd7ff 0 16%, #0d5aa3 38%, #061635 74%, #030814 100%);
            box-shadow: 0 0 8px rgba(0, 229, 255, .2);
            transition: transform .28s ease;
        }
        .iris::before {
            content: "";
            position: absolute;
            width: 7px;
            height: 7px;
            left: 3px;
            top: 3px;
            border-radius: 50%;
            background: #fff;
            opacity: .9;
        }

        /* ===== BOCA ===== */
        .mouth {
            position: absolute;
            left: 50%;
            bottom: 33px;
            width: 42px;
            height: 18px;
            border-bottom: 4px solid var(--color-activo);
            border-radius: 0 0 50% 50%;
            transform: translateX(-50%);
            transition: all var(--speed) ease, border-color .25s ease;
            box-shadow: 0 0 0 1px rgba(26, 35, 126, .02);
        }

        /* ===== MEJILLAS ===== */
        .cheek {
            position: absolute;
            bottom: 36px;
            width: 22px;
            height: 14px;
            border-radius: 50%;
            background: var(--pink);
            filter: blur(4px);
            opacity: .82;
            transition: opacity .3s ease, transform .3s ease, background .3s ease;
        }
        .cheek.left {
            left: 18px;
        }
        .cheek.right {
            right: 18px;
        }

        .chin {
            position: absolute;
            left: 50%;
            bottom: 12px;
            width: 64px;
            height: 18px;
            transform: translateX(-50%);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(26, 35, 126, .08) 0%, transparent 70%);
            opacity: .9;
        }

        /* ===== CUERPO ===== */
        .body {
            position: relative;
            width: 206px;
            height: 214px;
            margin: -8px auto 0;
            border: 4px solid var(--color-activo);
            border-radius: 28px 28px 36px 36px;
            overflow: hidden;
            background: radial-gradient(circle at 50% 0%, rgba(255, 255, 255, .96) 0 24%, rgba(246, 249, 255, .98) 45%, #edf3ff 85%, #dce5fb 100%);
            box-shadow: inset 0 14px 18px rgba(255, 255, 255, .7), inset 0 -18px 30px rgba(20, 40, 90, .08), 0 12px 24px rgba(0, 0, 0, .13);
            transform: translateZ(18px);
            animation: breathe var(--idle) ease-in-out infinite;
            transition: border-color .25s ease, box-shadow .25s ease;
        }

        .body::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent 0 44%, rgba(26, 35, 126, .12) 44% 48%, transparent 48% 100%),
                radial-gradient(circle at 15% 18%, rgba(215, 179, 92, .18) 0 2px, transparent 3px),
                radial-gradient(circle at 82% 22%, rgba(215, 179, 92, .14) 0 2px, transparent 3px),
                radial-gradient(circle at 25% 70%, rgba(26, 35, 126, .08) 0 2px, transparent 3px),
                radial-gradient(circle at 76% 66%, rgba(26, 35, 126, .08) 0 2px, transparent 3px);
            opacity: .28;
            background-size: 62px 62px;
            pointer-events: none;
        }

        /* ===== PECHO ===== */
        .chest {
            position: absolute;
            left: 50%;
            top: 18px;
            width: 110px;
            height: 58px;
            transform: translateX(-50%);
            border: 4px solid var(--gold2);
            border-radius: 18px;
            background: linear-gradient(180deg, rgba(215, 179, 92, .28), rgba(215, 179, 92, .08));
            box-shadow: inset 0 0 14px rgba(215, 179, 92, .16), 0 8px 14px rgba(0, 0, 0, .05);
            display: grid;
            place-items: center;
            transition: all 0.5s ease;
        }

        .chest::before {
            content: "MARQUINHOS";
            font-weight: 900;
            letter-spacing: 1.4px;
            font-size: 11px;
            color: var(--gold);
            text-shadow: 0 0 10px rgba(215, 179, 92, .2);
            font-family: "Orbitron", sans-serif;
            transition: all 0.5s ease;
        }

        /* ===== BRAZOS ===== */
        .arm {
            position: absolute;
            top: 30px;
            width: 26px;
            height: 100px;
            border: 4px solid var(--color-activo);
            border-radius: 15px;
            background: linear-gradient(180deg, #fff, #edf3ff);
            transform-origin: top center;
            box-shadow: inset 0 0 12px rgba(255, 255, 255, .45);
            transition: transform .35s cubic-bezier(.2, .8, .2, 1), border-color .25s ease;
        }
        .arm.left {
            left: -14px;
            transform: rotate(-12deg);
        }
        .arm.right {
            right: -14px;
            transform: rotate(12deg);
        }

        .forearm {
            position: absolute;
            left: 0;
            top: 76px;
            width: 22px;
            height: 84px;
            border: 3px solid var(--color-activo);
            border-radius: 12px;
            background: linear-gradient(180deg, #fff, #edf3ff);
            transform-origin: top center;
            box-shadow: inset 0 0 10px rgba(255, 255, 255, .45);
            transition: transform .35s cubic-bezier(.2, .8, .2, 1), border-color .25s ease;
        }

        .hand {
            position: absolute;
            left: -8px;
            top: 72px;
            width: 36px;
            height: 36px;
            border: 3px solid var(--color-activo);
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #fff 0 26%, #eef4ff 58%, #dce6fb 100%);
            transform-origin: center;
            box-shadow: inset 0 0 10px rgba(255, 255, 255, .4);
            transition: transform .35s cubic-bezier(.2, .8, .2, 1), border-color .25s ease;
        }

        .hand::after {
            content: "";
            position: absolute;
            inset: 8px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(215, 179, 92, .22) 0%, transparent 68%);
            opacity: .7;
        }

        .finger {
            position: absolute;
            top: 2px;
            width: 7px;
            height: 15px;
            border: 1px solid var(--color-activo);
            border-radius: 4px;
            background: #fff;
            transform-origin: bottom center;
            transition: transform .24s ease, border-color .25s ease;
        }
        .finger:nth-child(1) {
            left: 4px;
        }
        .finger:nth-child(2) {
            left: 13px;
        }
        .finger:nth-child(3) {
            left: 22px;
        }

        /* ===== PIERNAS ===== */
        .leg {
            position: absolute;
            bottom: -6px;
            width: 34px;
            height: 72px;
            border: 4px solid var(--color-activo);
            border-radius: 14px;
            background: linear-gradient(180deg, #fff, #edf3ff);
            box-shadow: inset 0 0 10px rgba(255, 255, 255, .42);
            transition: border-color .25s ease;
        }
        .leg.left {
            left: 53px;
        }
        .leg.right {
            right: 53px;
        }

        .foot {
            position: absolute;
            bottom: -16px;
            left: -8px;
            width: 50px;
            height: 22px;
            border: 4px solid var(--color-activo);
            border-radius: 18px 18px 10px 10px;
            background: linear-gradient(180deg, #fff, #edf3ff);
            transition: border-color .25s ease;
        }

        /* ===== TEXTO (oculto) ===== */
        .caption {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }

        .name {
            margin-top: 4px;
            text-align: center;
            font-weight: 900;
            font-size: 18px;
            letter-spacing: .8px;
            color: var(--gold);
            text-shadow: 0 0 14px rgba(215, 179, 92, .18);
            font-family: "Orbitron", sans-serif;
            transition: all 0.5s ease;
        }

        /* ===== BURBUJA ===== */
        .bubble {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 14px;
            border-radius: 16px;
            background: rgba(10, 17, 28, .55);
            border: 1px solid rgba(255, 255, 255, .08);
            backdrop-filter: blur(10px);
            color: #dfe7ff;
            font-size: 13px;
            line-height: 1.35;
            width: min(340px, calc(100vw - 40px));
            pointer-events: none;
            transition: all 0.5s ease;
        }

        .bubble strong {
            color: var(--gold);
        }

        /* ===== INDICADOR DE MICRÓFONO ===== */
        .mic-indicator {
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 229, 255, 0.1);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(0, 229, 255, 0.2);
            font-size: 10px;
            color: var(--mic-active);
            transition: all 0.5s ease;
            opacity: 0;
            pointer-events: none;
        }

        .mic-indicator.active {
            opacity: 1;
        }

        .mic-indicator .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--mic-active);
            animation: micPulse 1s ease-in-out infinite;
        }

        @keyframes micPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
        }

        /* ===== SELECTOR DE COLOR (PALETA) ===== */
        .color-picker {
            position: absolute;
            top: -10px;
            right: -10px;
            z-index: 100;
            cursor: pointer;
            user-select: none;
            transition: all 0.3s ease;
        }

        .color-picker .palette-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            border: 2px solid rgba(255, 255, 255, 0.15);
            display: grid;
            place-items: center;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
        }

        .color-picker .palette-icon:hover {
            transform: scale(1.1);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .color-picker .palette-options {
            position: absolute;
            top: 40px;
            right: 0;
            background: rgba(10, 17, 28, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 8px 0;
            min-width: 170px;
            display: none;
            flex-direction: column;
            gap: 2px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            transform-origin: top right;
            animation: pickerSlide 0.2s ease-out;
        }

        .color-picker .palette-options.open {
            display: flex;
        }

        @keyframes pickerSlide {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(-8px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .color-picker .color-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 16px;
            border: none;
            background: transparent;
            color: #dfe7ff;
            font-family: "Space Grotesk", sans-serif;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            border-radius: 0;
            width: 100%;
            text-align: left;
        }

        .color-picker .color-option:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .color-picker .color-option .swatch {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            flex-shrink: 0;
            transition: border-color 0.2s ease;
        }

        .color-picker .color-option:hover .swatch {
            border-color: rgba(255, 255, 255, 0.5);
        }

        .color-picker .color-option .check-mark {
            margin-left: auto;
            opacity: 0;
            transition: opacity 0.2s ease;
            font-size: 14px;
        }

        .color-picker .color-option.active .check-mark {
            opacity: 1;
        }

        .color-picker .color-option.active {
            background: rgba(255, 255, 255, 0.05);
        }

        /* ===== ESTADOS DE LLAMADA ===== */
        .marquinhos.on-call .antenna {
            animation: callPulse 1.2s ease-in-out infinite alternate;
        }
        .marquinhos.on-call .antenna::after {
            animation: callGlow 1.2s ease-in-out infinite alternate;
        }
        .marquinhos.on-call .chest {
            border-color: var(--call-pause);
            box-shadow: 0 0 30px var(--call-pause-bg);
            animation: callChestPulse 1.2s ease-in-out infinite alternate;
        }
        .marquinhos.on-call .chest::before {
            content: "📞 EN LLAMADA";
            color: var(--call-pause);
            text-shadow: 0 0 20px rgba(255, 107, 53, 0.4);
        }

        /* Modo Bluetooth */
        .marquinhos.bluetooth-connected .chest::before {
            content: "🔊 BLUETOOTH";
            color: var(--bluetooth);
            text-shadow: 0 0 20px rgba(41, 121, 255, 0.4);
        }
        .marquinhos.bluetooth-connected .chest {
            border-color: var(--bluetooth);
            box-shadow: 0 0 30px var(--bluetooth-bg);
        }

        /* ===== ESTADOS / EMOCIONES ===== */
        .marquinhos.happy .mouth {
            width: 48px;
            height: 22px;
            border-bottom-width: 5px;
        }
        .marquinhos.loving .mouth {
            width: 46px;
            height: 20px;
            border-bottom-width: 5px;
        }
        .marquinhos.sad .mouth {
            border-bottom: 0;
            border-top: 4px solid var(--color-activo);
            border-radius: 50% 50% 0 0;
            bottom: 31px;
        }
        .marquinhos.surprised .mouth {
            width: 24px;
            height: 26px;
            border: 4px solid var(--color-activo);
            border-radius: 50%;
        }
        .marquinhos.talking .mouth {
            animation: talk .18s ease-in-out infinite alternate;
        }
        .marquinhos.talking .body {
            animation: breathe var(--idle) ease-in-out infinite, talkBody .65s ease-in-out infinite alternate;
        }
        .marquinhos.waving .arm.right {
            animation: waveR .45s ease-in-out infinite alternate;
        }
        .marquinhos.waving .arm.left {
            animation: waveL .45s ease-in-out infinite alternate;
        }
        .marquinhos.waving .finger {
            animation: wiggle .24s ease-in-out infinite alternate;
        }

        /* ===== COGNITIVE BUBBLE ===== */
        #cognitive-speech-bubble {
            position: absolute;
            bottom: 105%;
            left: 50%;

        #cognitive-speech-bubble::after {

            border-right: 8px solid transparent;

        /* ===== ANIMACIONES ===== */
        @keyframes float {
            0%, 100% { transform: translateY(0) rotateX(0deg); }
            50% { transform: translateY(-6px) rotateX(2deg); }

        }
        @keyframes talk {

            to { transform: translateX(-50%) scaleX(1.12); height: 22px; }
        }
        @keyframes talkBody {
            from { margin-top: 0; }

        }
        @keyframes waveR {

        }
        @keyframes waveL {

        }
        @keyframes wiggle {

            to { transform: rotate(15deg); }
        }
        @keyframes think {

        }
        @keyframes bounce {
            from { transform: translateY(0) scale(1); }
            to { transform: translateY(-10px) scale(1.03); }
        }
        @keyframes embarrassedHead {

    <script>
        "use strict";

        // ================================================================
        // 1. MÓDULO DE INTELIGENCIA COGNITIVA (INYECTADO)
        // ================================================================
        (function cognitiveModule() {
            'use strict';

            const STORAGE_KEY = 'marquinhos_cognitive_state_v6';

            let cognitiveState = {
                irritability: 0,
                affection: 60,
                boredom: 0,
                lastInteraction: Date.now(),
                history: [],
                userProfile: 'general',
                isChild: false,
                childConfidence: 0,
                lastChildDetection: 0,
                isOnCall: false,
                callStartTime: 0,
                lastCallEndTime: 0,
                pendingConversation: false,
                callHistory: [],
                bluetoothDevices: [],
                bluetoothConnected: false,
                audioOutputDevices: [],
                // ===== NUEVO: Preferencia de color (manual) =====
                selectedColor: '#001A80', // Default: Azul Talavera
                // ===== ELIMINADO: detectGender y todo lo relacionado =====
            };

            // ===== CARGA INICIAL DESDE SUPABASE + localStorage =====
            async function loadFromSupabase() {
                try {
                    // ==========================================================
                    // INTEGRACIÓN CON SUPABASE
                    // Usa window.PerfilConnector o window.auth para obtener el uid
                    // ==========================================================
                    const userId = window.PerfilConnector?.auth?.uid?.() ||
                        window.auth?.uid?.() ||
                        localStorage.getItem('supabase.auth.token');

                    if (!userId) {
                        console.warn('⚠️ No se pudo obtener userId para Supabase. Usando solo localStorage.');
                        loadFromLocalStorage();
                        return;
                    }

                    // Intentar cargar desde localStorage primero (caché)
                    loadFromLocalStorage();

                    // Luego sincronizar con Supabase
                    const supabase = window.supabase || window._supabase;
                    if (supabase) {
                        const { data, error } = await supabase
                            .from('marquinhos_preferences')
                            .select('color, historial, updated_at')
                            .eq('user_id', userId)
                            .maybeSingle();

                        if (error) {
                            console.warn('⚠️ Error al cargar desde Supabase:', error);
                            return;
                        }

                        if (data) {
                            // Aplicar color desde Supabase
                            if (data.color) {
                                cognitiveState.selectedColor = data.color;
                                try {
                                    localStorage.setItem('marquinhos_color_preference', data.color);
                                } catch (e) {}
                                applyColorToUI(data.color);
                            }

                            // Cargar historial desde Supabase
                            if (data.historial && Array.isArray(data.historial)) {
                                cognitiveState.history = data.historial;
                                try {
                                    localStorage.setItem(STORAGE_KEY, JSON.stringify(data.historial));
                                } catch (e) {}
                            }

                            console.log('✅ Datos cargados desde Supabase');
                        } else {
                            // Si no hay datos en Supabase, crear registro
                            await saveToSupabase(userId);
                        }
                    } else {
                        console.warn('⚠️ Supabase no disponible. Usando solo localStorage.');
                    }
                } catch (e) {
                    console.warn('⚠️ Error en carga desde Supabase:', e);
                    loadFromLocalStorage();
                }
            }

            function loadFromLocalStorage() {
                try {
                    const saved = localStorage.getItem(STORAGE_KEY);
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        cognitiveState.history = parsed;
                    } else {
                        cognitiveState.history = [];
                    }

                    const savedColor = localStorage.getItem('marquinhos_color_preference');
                    if (savedColor) {
                        cognitiveState.selectedColor = savedColor;
                    }
                } catch (e) {
                    cognitiveState.history = [];
                }
            }

            // ===== GUARDAR EN SUPABASE =====
            async function saveToSupabase(userId) {
                try {
                    const supabase = window.supabase || window._supabase;
                    if (!supabase) {
                        console.warn('⚠️ Supabase no disponible para guardar.');
                        return;
                    }

                    if (!userId) {
                        userId = window.PerfilConnector?.auth?.uid?.() ||
                            window.auth?.uid?.() ||
                            localStorage.getItem('supabase.auth.token');
                        if (!userId) {
                            console.warn('⚠️ No se pudo obtener userId para guardar en Supabase.');
                            return;
                        }
                    }

                    const payload = {
                        user_id: userId,
                        color: cognitiveState.selectedColor,
                        historial: cognitiveState.history.slice(-50), // Últimos 50 mensajes
                        updated_at: new Date().toISOString()
                    };

                    const { error } = await supabase
                        .from('marquinhos_preferences')
                        .upsert(payload, { onConflict: 'user_id' });

                    if (error) {
                        console.warn('⚠️ Error al guardar en Supabase:', error);
                    } else {
                        console.log('✅ Datos guardados en Supabase');
                    }
                } catch (e) {
                    console.warn('⚠️ Error en guardado Supabase:', e);
                }
            }

            // ===== GUARDAR EN LOCALSTORAGE + SUPABASE =====
            async function saveMemory() {
                if (cognitiveState.history.length > 50) {
                    cognitiveState.history = cognitiveState.history.slice(-50);
                }

                // Guardar en localStorage (caché)
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(cognitiveState.history));
                } catch (e) {}

                // Guardar en Supabase
                try {
                    const userId = window.PerfilConnector?.auth?.uid?.() ||
                        window.auth?.uid?.() ||
                        localStorage.getItem('supabase.auth.token');
                    if (userId) {
                        await saveToSupabase(userId);
                    }
                } catch (e) {
                    // Silencioso
                }
            }

            // ===== APLICAR COLOR A LA UI =====

                const root = document.documentElement;
                root.style.setProperty('--color-activo', colorHex);

                const r = parseInt(colorHex.slice(1, 3), 16);
                const g = parseInt(colorHex.slice(3, 5), 16);
                const b = parseInt(colorHex.slice(5, 7), 16);
                root.style.setProperty('--color-activo-rgb', `${r}, ${g}, ${b}`);

                // Actualizar opciones activas en el selector
                const options = document.querySelectorAll('.color-option');
                options.forEach(opt => {
                    opt.classList.toggle('active', opt.dataset.color === colorHex);
                });
            }

            // ===== DICCIONARIO DE FRASES NEUTRO (sin género) =====
            const neutralPhrases = {

            function getPhraseByCategory(category, isChild = false) {
                if (isChild) {
                    return getChildSafePhrase(category);
                }
                const list = neutralPhrases[category] || neutralPhrases.casual || neutralPhrases.greeting;
                return list[Math.floor(Math.random() * list.length)];

            // ===== FRASES INFANTILES (sin género) =====
            const childSafePhrases = {
                greeting: [

                help: [

                    "¡Bravo! Estoy muy orgulloso de ti."
                ],
                question: [

                comfort: [

                ],
                learning: [

                thanks: [

                noSwear: [

                    "El micrófono está apagado. ¿Me das permiso para encenderlo y poder conversar?",

            function getChildSafePhrase(category) {
                const list = childSafePhrases[category] || childSafePhrases.greeting || childSafePhrases.help;
                return list[Math.floor(Math.random() * list.length)];
            }

            // ===== DETECTOR DE VOZ INFANTIL =====
            function detectChildVoice(text) {
                const now = Date.now();

                const childPatterns = [
                    /\b(mami|papi|abuelo|abuela|tío|tía|hermano|hermana)\b/i,
                    /\b(cole|escuela|maestro|maestra|profesor|clase|amigo|amiga)\b/i,
                    /\b(jugar|juego|juguete|diversión|risa|pelota|carro|muñeca)\b/i,
                    /\b(me gusta|no me gusta|quiero|tengo miedo|estoy feliz|estoy triste)\b/i,
                    /\b(por qué|porqué|cómo|cual|quien|cuando|donde)\b/i,
                    /\b(ay|oh|wow|guao|epa|uy|ah)\b/i,
                    /\b(¿?.*\?)\b/,
                    /\b(ta|pa|ma|na|da)\b/,
                    /[😊😄😁😅😂🤣😍🥰😘😗😙😚]/,
                    /\b(mucho|muchísimo|super|re|requete)\b/i,
                    /\b(animal|perro|gato|pájaro|pez|conejo|tortuga)\b/i,
                    /\b(princesa|príncipe|rey|reina|castillo|dragón|hada)\b/i,
                    /\b(robot|avión|nave|espacio|astronauta)\b/i,
                    /\b(años|edad|chico|chica|niño|niña|pequeño|pequeña)\b/i
                ];

                const offensivePatterns = [
                    /\b(pendejo|pendeja|wey|güey|chinga|chingar|mamón|mamona|verga|puto|puta|culero|culera|pito|v*rga)\b/i
                ];

                const textLower = text.toLowerCase();

                const hasOffensive = offensivePatterns.some(p => p.test(textLower));
                if (hasOffensive) {
                    cognitiveState.isChild = false;
                    cognitiveState.childConfidence = Math.max(0, cognitiveState.childConfidence - 0.3);
                    return false;
                }

                let childScore = 0;
                for (const pattern of childPatterns) {
                    const matches = (textLower.match(new RegExp(pattern.source, 'gi')) || []).length;
                    if (matches > 0) {
                        childScore += matches * 0.15;
                    }
                }

                const wordCount = text.split(/\s+/).length;
                if (wordCount < 3) {
                    childScore *= 0.5;
                }

                const questionCount = (text.match(/\?/g) || []).length;
                if (questionCount >= 2) {
                    childScore += 0.2;
                }

                const emotionCount = (text.match(/[😊😄😁😅😂🤣😍🥰😘😗😙😚❤️💕💖]/g) || []).length;
                if (emotionCount > 0) {
                    childScore += 0.15 * emotionCount;
                }

                const threshold = 0.4;
                const isChild = childScore > threshold;

                if (isChild) {
                    cognitiveState.childConfidence = Math.min(1, cognitiveState.childConfidence + 0.15);
                } else {
                    cognitiveState.childConfidence = Math.max(0, cognitiveState.childConfidence - 0.1);
                }

                const wasChild = cognitiveState.isChild;
                cognitiveState.isChild = cognitiveState.childConfidence > 0.3;

                if (wasChild !== cognitiveState.isChild) {
                    console.log(`🧒 Modo infantil ${cognitiveState.isChild ? 'ACTIVADO' : 'DESACTIVADO'} (confianza: ${cognitiveState.childConfidence.toFixed(2)})`);
                }

                cognitiveState.lastChildDetection = now;
                return cognitiveState.isChild;
            }

            // ===== GESTIÓN DE LLAMADAS =====
            function handleCallStart() {
                if (cognitiveState.isOnCall) return;

                cognitiveState.isOnCall = true;
                cognitiveState.callStartTime = Date.now();
                cognitiveState.pendingConversation = false;

                if (window.Marquinhos && typeof window.Marquinhos.setEmotion === 'function') {
                    window.Marquinhos.setEmotion('thinking', '📞 En llamada... regreso en un momento.', 0);
                }

                const marquinhosEl = document.getElementById('marquinhos');
                if (marquinhosEl) {
                    marquinhosEl.classList.add('on-call');
                }

                const bubble = document.getElementById('cognitive-speech-bubble');
                if (bubble) {
                    bubble.classList.add('on-call');
                    bubble.textContent = '📞 En llamada... regreso en un momento.';
                    bubble.classList.add('visible');
                }

                cognitiveState.callHistory.push({
                    type: 'start',
                    timestamp: cognitiveState.callStartTime
                });
                if (cognitiveState.callHistory.length > 10) cognitiveState.callHistory.shift();

                console.log('📞 Marquinhos en pausa por llamada.');
            }

            function handleCallEnd() {
                if (!cognitiveState.isOnCall) return;

                const callDuration = (Date.now() - cognitiveState.callStartTime) / 1000;
                cognitiveState.isOnCall = false;
                cognitiveState.lastCallEndTime = Date.now();
                cognitiveState.pendingConversation = true;

                const marquinhosEl = document.getElementById('marquinhos');
                if (marquinhosEl) {
                    marquinhosEl.classList.remove('on-call');
                }

                const bubble = document.getElementById('cognitive-speech-bubble');
                if (bubble) {
                    bubble.classList.remove('on-call');
                    bubble.classList.remove('visible');
                }

                cognitiveState.callHistory.push({
                    type: 'end',
                    timestamp: Date.now(),
                    duration: callDuration
                });
                if (cognitiveState.callHistory.length > 10) cognitiveState.callHistory.shift();

                console.log(`📞 Llamada finalizada (${callDuration.toFixed(1)}s). Retomando conversación...`);

                setTimeout(() => {
                    if (!cognitiveState.isOnCall && cognitiveState.pendingConversation) {
                        cognitiveState.pendingConversation = false;

                        const isChild = cognitiveState.isChild;

                        let resumeMessages;
                        if (isChild) {
                            resumeMessages = [
                                "¡Ya regresé! ¿Seguimos con lo que estábamos haciendo?",
                                "Listo, ya terminó la llamada. ¿Qué tal si seguimos?",
                                "Perdón por la interrupción. ¿Continuamos?"
                            ];
                        } else {
                            resumeMessages = [
                                "Disculpa la pausa. ¿Seguimos con nuestra conversación?",
                                "Ya regresé. ¿En qué estábamos?",
                                "Perdona la interrupción. ¿Continuamos?",
                                "Listo. ¿Qué te parece si retomamos donde nos quedamos?"
                            ];
                        }

                        const msg = resumeMessages[Math.floor(Math.random() * resumeMessages.length)];

                        if (window.Marquinhos && typeof window.Marquinhos.react === 'function') {
                            window.Marquinhos.react('happy', msg);
                        }
                    }
                }, 1500);
            }

            // ===== BLUETOOTH / AUDIO DEVICES =====
            function detectAudioDevices() {
                if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) {
                    console.log('🔊 API de dispositivos no disponible');
                    return;
                }

                navigator.mediaDevices.enumerateDevices()
                    .then(devices => {
                        const audioOutputs = devices.filter(d => d.kind === 'audiooutput');

                        cognitiveState.audioOutputDevices = audioOutputs.map(d => ({
                            id: d.deviceId,
                            label: d.label || 'Dispositivo de audio',
                            kind: d.kind
                        }));

                        const bluetoothDevices = audioOutputs.filter(d =>
                            d.label &&
                            (d.label.toLowerCase().includes('bluetooth') ||
                             d.label.toLowerCase().includes('bt') ||
                             d.label.toLowerCase().includes('headset') ||
                             d.label.toLowerCase().includes('earbuds') ||
                             d.label.toLowerCase().includes('speaker') ||
                             d.label.toLowerCase().includes('bocina'))
                        );

                        if (bluetoothDevices.length > 0) {
                            cognitiveState.bluetoothDevices = bluetoothDevices.map(d => ({
                                id: d.deviceId,
                                label: d.label,
                                kind: d.kind
                            }));
                            cognitiveState.bluetoothConnected = true;

                            const marquinhosEl = document.getElementById('marquinhos');
                            if (marquinhosEl) {
                                marquinhosEl.classList.add('bluetooth-connected');
                            }

                            const bubble = document.getElementById('bubble');
                            if (bubble) {
                                const deviceNames = bluetoothDevices.map(d => d.label).join(', ');
                                bubble.innerHTML =
                                    `<strong>🔊 Bluetooth</strong> · Conectado a: ${deviceNames}`;
                            }

                            console.log('🔊 Dispositivos Bluetooth detectados:', bluetoothDevices.map(d => d.label));
                        }
                    })
                    .catch(err => {
                        console.warn('⚠️ No se pudieron enumerar dispositivos:', err);
                    });
            }

            if (navigator.mediaDevices) {
                setTimeout(detectAudioDevices, 1000);
                if (navigator.mediaDevices.addEventListener) {
                    navigator.mediaDevices.addEventListener('devicechange', () => {
                        console.log('🔄 Cambio en dispositivos de audio detectado');
                        setTimeout(detectAudioDevices, 500);
                    });

            }

            // ===== ANÁLISIS DE INPUT =====
            function analyzeInput(text) {
                const now = Date.now();
                cognitiveState.lastInteraction = now;

                if (cognitiveState.isOnCall) {
                    return { recentSimilar: false, profile: cognitiveState.userProfile, isChild: false, onCall: true };
                }

                // Detectar niño
                const isChild = detectChildVoice(text);

                // Actualizar estado
                cognitiveState.userProfile = isChild ? 'infantil' : 'general';

                const recentSimilar = cognitiveState.history.find(h =>
                    h.text.toLowerCase() === text.toLowerCase() &&
                    (now - h.timestamp) < 900000
                );

                const isAggressive = /estúpido|inútil|cállate|maldito|pendejo|wey|güey|chinga|verga|puto|culero/i.test(text);
                if (isAggressive) {
                    cognitiveState.irritability = Math.min(100, cognitiveState.irritability + 10);
                    if (isChild) {
                        return { recentSimilar, profile: 'infantil', isChild: true, gentleReminder: true, onCall: false };
                    }
                } else {
                    cognitiveState.irritability = Math.max(0, cognitiveState.irritability - 10);
                }

                cognitiveState.boredom = 0;

                cognitiveState.history.push({
                    text,
                    timestamp: now,
                    profile: cognitiveState.userProfile,
                    isChild
                });
                saveMemory();

                return {
                    recentSimilar,
                    profile: cognitiveState.userProfile,
                    isChild,
                    gentleReminder: false,
                    onCall: false
                };
            }

            // ===== LOOP COGNITIVO =====
            let cognitiveLoopRunning = false;

            function cognitiveLoop() {
                if (!cognitiveLoopRunning) return;

                const idleTime = (Date.now() - cognitiveState.lastInteraction) / 1000;

                if (!cognitiveState.isOnCall && idleTime > 120 && cognitiveState.boredom === 0 && !cognitiveState.isChild) {
                    cognitiveState.boredom = 1;
                    triggerVisualReaction('bored');
                    setTimeout(() => {
                        cognitiveState.boredom = 0;
                    }, 30000);
                }

                requestAnimationFrame(cognitiveLoop);
            }

            // ===== ACCIONES VISUALES =====
            function triggerVisualReaction(type, customMessage = null) {
                const targetElement = document.getElementById('marquinhos') || document.body;

                let speechBubble = document.getElementById('cognitive-speech-bubble');
                if (!speechBubble) {
                    speechBubble = document.createElement('div');
                    speechBubble.id = 'cognitive-speech-bubble';
                    targetElement.style.position = targetElement.style.position || 'relative';
                    targetElement.appendChild(speechBubble);
                }

                let message;
                if (customMessage) {
                    message = customMessage;
                } else {
                    const isChild = cognitiveState.isChild;
                    message = getPhraseByCategory(type, isChild);
                }

                speechBubble.textContent = message;

                // Aplicar clases según modo
                speechBubble.classList.remove('child-safe', 'on-call');

                if (cognitiveState.isChild) {
                    speechBubble.classList.add('child-safe');
                    const marquinhosEl = document.getElementById('marquinhos');
                    if (marquinhosEl) marquinhosEl.classList.add('child-mode');
                } else if (cognitiveState.isOnCall) {
                    speechBubble.classList.add('on-call');
                } else {
                    const marquinhosEl = document.getElementById('marquinhos');
                    if (marquinhosEl) marquinhosEl.classList.remove('child-mode');
                }

                speechBubble.classList.add('visible');

                if (window.Marquinhos && typeof window.Marquinhos.speak === 'function' && !cognitiveState.isOnCall) {
                    window.Marquinhos.speak(message);
                }

                const duration = cognitiveState.isChild ? 6000 : 5000;
                setTimeout(() => {
                    speechBubble.classList.remove('visible');
                }, duration);
            }

            // ===== EXPOSICIÓN DE API =====
            window.MarquinhosCognitiveAI = {
                evalInput(userInput) {
                    const analysis = analyzeInput(userInput);

                    if (analysis.onCall) {
                        return { allowed: true, onCall: true, message: '📞 En llamada...' };
                    }

                    if (analysis.gentleReminder) {
                        const reminder = childSafePhrases.noSwear[Math.floor(Math.random() * childSafePhrases.noSwear
                            .length)];
                        triggerVisualReaction('noSwear', reminder);
                        return { allowed: true, isChild: true, message: reminder, gentleReminder: true };
                    }

                    if (analysis.recentSimilar) {
                        const isChild = analysis.isChild;
                        const message = getPhraseByCategory('play', isChild);
                        triggerVisualReaction('associative', message);
                        return { allowed: true, isChild: analysis.isChild, message, profile: analysis.profile };
                    }

                    if (analysis.isChild) {
                        const message = childSafePhrases.greeting[Math.floor(Math.random() * childSafePhrases.greeting
                            .length)];
                        triggerVisualReaction('greeting', message);
                        return { allowed: true, isChild: true, message, profile: 'infantil' };
                    }

                    // Respuesta por defecto (neutro)
                    const message = getPhraseByCategory('greeting', false);
                    triggerVisualReaction('greeting', message);

                    return { allowed: true, profile: analysis.profile, isChild: false };
                },
                getStatus() {
                    return { ...cognitiveState };
                },
                getSelectedColor() {
                    return cognitiveState.selectedColor || '#001A80';
                },
                setSelectedColor: async function(colorHex) {
                    cognitiveState.selectedColor = colorHex;

                    // Guardar en localStorage (caché)
                    try {

                    applyColorToUI(colorHex);

                    try {

                    cognitiveState.boredom = 0;

                setChildMode(active) {

                scanAudioDevices() {
                    detectAudioDevices();
                },
                requestMicPermission() {
                    return new Promise((resolve) => {
                        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                            const msg = '⚠️ Tu navegador no soporta micrófono.';
                            console.warn(msg);
                            triggerVisualReaction('permission', msg);
                            resolve(false);
                            return;
                        }

                        const isChild = cognitiveState.isChild;

                        let permissionMsg;
                        if (isChild) {
                            permissionMsg = childSafePhrases.permission[Math.floor(Math.random() * childSafePhrases
                                .permission.length)];
                        } else {
                            permissionMsg = "Para poder escucharte, necesito permiso del micrófono. ¿Me lo concedes?";
                        }

                        triggerVisualReaction('permission', permissionMsg);

                        navigator.mediaDevices.getUserMedia({ audio: true })
                            .then((stream) => {
                                cognitiveState._micStream = stream;
                                cognitiveState._micActive = true;

                                const micIndicator = document.getElementById('micIndicator');
                                if (micIndicator) {
                                    micIndicator.classList.add('active');
                                    const status = document.getElementById('micStatus');
                                    if (status) status.textContent = '🎤 Micrófono activo';
                                }

                                console.log('🎤 Permiso de micrófono concedido.');

                                const activationMsg = getPhraseByCategory('activation', cognitiveState
                                    .isChild);
                                triggerVisualReaction('activation', activationMsg);
                                resolve(true);
                            })
                            .catch((err) => {
                                console.warn('⚠️ Permiso de micrófono denegado:', err);
                                const msg = '⚠️ Necesito permiso del micrófono para poder escucharte.';
                                triggerVisualReaction('permission', msg);
                                resolve(false);
                            });
                    });
                },
                isMicActive() {
                    return cognitiveState._micActive || false;
                },
                stopMic() {
                    if (cognitiveState._micStream) {
                        cognitiveState._micStream.getTracks().forEach(track => track.stop());
                        cognitiveState._micStream = null;
                        cognitiveState._micActive = false;
                        const micIndicator = document.getElementById('micIndicator');
                        if (micIndicator) {
                            micIndicator.classList.remove('active');
                            const status = document.getElementById('micStatus');
                            if (status) status.textContent = '⏸️ Micrófono pausado';
                        }
                        console.log('⏸️ Micrófono detenido.');

                },
                getActivationPhrase() {
                    return getPhraseByCategory('activation', cognitiveState.isChild);
                },
                // ===== EXPUESTO PARA SINCronización =====
                _syncWithSupabase: saveToSupabase,
                _loadFromSupabase: loadFromSupabase
            };

            // ===== INICIALIZACIÓN =====
            document.addEventListener('DOMContentLoaded', async () => {
                // Cargar desde Supabase + localStorage
                await loadFromSupabase();

                // Aplicar color inicial
                applyColorToUI(cognitiveState.selectedColor);

                setTimeout(() => {

                console.log('🧠 Módulo Cognitivo de Marquinhos iniciado.');

                console.log('🎤 Micrófono: requestMicPermission() (solo por acción explícita)');

                if (cognitiveState._micStream) {

                // Guardar en Supabase antes de salir
                try {

                        window.auth?.uid?.() ||

                    if (userId) {
                        saveToSupabase(userId);
                    }
                } catch (e) {}
            });

        })();


        // ================================================================
        // 2. MÓDULO PRINCIPAL DE MARQUINHOS
        // ================================================================
        (() => {
            // ============================
            // 1. ELEMENTOS Y ESTADO
            // ============================
            const marquinhosEl = document.getElementById('marquinhos');
            const captionEl = document.getElementById('caption');
            const bubbleEl = document.getElementById('bubble');
            const irises = [...document.querySelectorAll('.iris')];
            const eyes = [...document.querySelectorAll('.eye')];
            const mouth = document.querySelector('.mouth');
            const antennas = [...document.querySelectorAll('.antenna')];
            const micIndicator = document.getElementById('micIndicator');
            const micStatus = document.getElementById('micStatus');

            // Selector de color
            const colorPicker = document.getElementById('colorPicker');
            const paletteToggle = document.getElementById('paletteToggle');
            const paletteOptions = document.getElementById('paletteOptions');
            const colorOptions = paletteOptions.querySelectorAll('.color-option');

            const validEmotions = new Set([
                'idle', 'happy', 'loving', 'sad', 'surprised', 'talking',
                'waving', 'wink', 'excited', 'thinking', 'caring',
                'grateful', 'embarrassed', 'curious', 'tired', 'thrilled'
            ]);

            const state = {
                emotion: 'caring',
                speaking: false,
                audioLevel: 0,
                targetLookX: 0,
                targetLookY: 0,
                lookX: 0,
                lookY: 0,
                targetTiltX: 0,
                targetTiltY: 0,
                tiltX: 0,
                tiltY: 0,
                nextBlink: performance.now() + 3000 + Math.random() * 3500,
                blinkUntil: 0,
                nextIdleAction: performance.now() + 3500 + Math.random() * 5000,
                idleActionUntil: 0,

                audioContext: null,

            function clamp(value, min, max) {
                return Math.max(min, Math.min(max, value));
            }

            function random(min, max) {
                return min + Math.random() * (max - min);
            }

                marquinhosEl.classList.remove(...validEmotions);

            function applyColor(colorHex) {

                    window.MarquinhosCognitiveAI.setSelectedColor(colorHex);

            // ============================
            // 4. RECONOCIMIENTO DE VOZ (con reintentos)
            // ============================
            function initSpeechRecognition() {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

                if (!SpeechRecognition) {
                    console.warn('⚠️ Speech Recognition no soportado en este navegador.');

                state.recognition = new SpeechRecognition();
                state.recognition.lang = 'es-MX';
                state.recognition.continuous = true;
                state.recognition.interimResults = true;
                state.recognition.maxAlternatives = 1;

                const activationWords = ['hola marquinhos', 'marquinhos', 'hey marquinhos', 'buenas marquinhos'];

                state.recognition.onresult = (event) => {
                    // Reiniciar contador de reintentos al recibir resultado
                    state.recognitionRetries = 0;

                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        const transcript = event.results[i][0].transcript.toLowerCase().trim();

                        if (micStatus) {
                            micStatus.textContent = '🎤 ' + (event.results[i].isFinal ? 'Escuchando...' : '...');
                        }

                        if (event.results[i].isFinal) {
                            console.log('🎤 Dijiste:', transcript);

                            const isActivation = activationWords.some(word => transcript.includes(word));

                            if (isActivation) {
                                const msg = window.MarquinhosCognitiveAI.getActivationPhrase();
                                react('greet', msg);
                                state.isListening = true;

                            }

                            if (state.isListening) {
                                if (window.MarquinhosCognitiveAI && window.MarquinhosCognitiveAI.isOnCall()) {

                                processVoiceCommand(transcript);
                            }
                        }
                    }
                };

                state.recognition.onerror = (event) => {
                    console.warn('⚠️ Error de reconocimiento:', event.error);

                    if (event.error === 'not-allowed') {
                        // Si es not-allowed, detener reintentos y mostrar mensaje
                        state.recognitionRetries = state.maxRetries;
                        if (micStatus) micStatus.textContent = '🔇 Toca el micrófono para activar';
                        showMicPermissionMessage();
                        return;
                    }

                    // Reintentar con backoff
                    if (state.recognitionRetries < state.maxRetries) {
                        state.recognitionRetries++;
                        const delay = [1000, 3000, 6000][state.recognitionRetries - 1] || 3000;
                        console.log(`🔄 Reintento ${state.recognitionRetries}/${state.maxRetries} en ${delay}ms...`);

                        if (micStatus) {
                            micStatus.textContent = `⏳ Reintentando (${state.recognitionRetries}/${state.maxRetries})...`;
                        }

                        clearTimeout(state.retryTimeout);
                        state.retryTimeout = setTimeout(() => {
                            if (state.isListening) {
                                try {
                                    state.recognition.start();
                                } catch (e) {
                                    // Ignorar
                                }
                            }
                        }, delay);
                    } else {
                        // Máximo de reintentos alcanzado
                        console.log('❌ Máximo de reintentos alcanzado.');
                        if (micStatus) micStatus.textContent = '🔇 Toca el micrófono para reactivar';
                        showMicPermissionMessage();
                        state.isListening = false;
                        if (micIndicator) micIndicator.classList.remove('active');
                    }
                };

                state.recognition.onend = () => {
                    if (state.recognitionRetries >= state.maxRetries) {
                        // Ya se alcanzó el máximo, no reintentar automáticamente
                        return;
                    }

                    if (state.isListening) {
                        // Reintentar automáticamente si no se ha excedido el límite
                        clearTimeout(state.retryTimeout);
                        state.retryTimeout = setTimeout(() => {
                            try {
                                state.recognition.start();
                            } catch (e) {
                                // Ignorar
                            }
                        }, 500);
                    }
                };

                try {
                    state.recognition.start();
                    state.isListening = true;
                    state.recognitionRetries = 0;
                    if (micIndicator) micIndicator.classList.add('active');
                    if (micStatus) micStatus.textContent = '🎤 Escuchando...';
                    console.log('🎤 Reconocimiento de voz iniciado.');
                } catch (e) {
                    console.warn('⚠️ No se pudo iniciar reconocimiento:', e);
                }
            }

            function showMicPermissionMessage() {
                const msg = '🔇 Necesito permiso del micrófono. Toca el avatar para activarlo.';
                if (window.MarquinhosCognitiveAI && typeof window.MarquinhosCognitiveAI.triggerReaction === 'function') {
                    window.MarquinhosCognitiveAI.triggerReaction('permission', msg);

            // ============================
            // 5. PROCESAR COMANDOS DE VOZ
            // ============================
            function processVoiceCommand(transcript) {
                const text = transcript.toLowerCase();

                if (text.includes('salir') || text.includes('adiós') || text.includes('hasta luego')) {
                    state.isListening = false;
                    if (micIndicator) micIndicator.classList.remove('active');
                    if (micStatus) micStatus.textContent = '⏸️ En espera';

                    let farewellMsg = "¡Hasta luego! Fue un placer.";
                    setEmotion('waving', farewellMsg, 3000);
                    speakWithBrowser(farewellMsg);

                    setTimeout(() => {
                        state.isListening = true;
                        if (micIndicator) micIndicator.classList.add('active');
                        if (micStatus) micStatus.textContent = '🎤 Escuchando...';
                        state.recognitionRetries = 0;
                        if (state.recognition) {
                            try {
                                state.recognition.start();
                            } catch (e) {}
                        }
                    }, 10000);
                    return;
                }

                if (text.includes('gracias')) {
                    let thanksMsg = "¡De nada! Es un placer ayudarte.";
                    react('grateful', thanksMsg);
                    return;
                }

                if (text.includes('cómo estás') || text.includes('qué tal')) {
                    let howMsg = "¡Estoy muy bien! ¿Y tú cómo estás?";
                    setEmotion('happy', howMsg, 3000);
                    speakWithBrowser(howMsg);
                    return;
                }

                if (text.includes('quién eres') || text.includes('qué haces')) {
                    let whoMsg = "Soy Marquinhos, tu asistente de voz. Estoy aquí para ayudarte y acompañarte.";
                    setEmotion('caring', whoMsg, 5000);
                    speakWithBrowser(whoMsg);
                    return;
                }

                if (text.includes('llamada') || text.includes('teléfono') || text.includes('llamar')) {
                    if (window.MarquinhosCognitiveAI && window.MarquinhosCognitiveAI.callStart) {
                        window.MarquinhosCognitiveAI.callStart();
                        const msg = 'Entendido, pausando para la llamada.';
                        setEmotion('thinking', msg, 3000);
                        speakWithBrowser(msg);
                    }
                    return;
                }

                if (text.includes('colgar') || text.includes('terminar llamada') || text.includes('finalizar')) {
                    if (window.MarquinhosCognitiveAI && window.MarquinhosCognitiveAI.callEnd) {
                        window.MarquinhosCognitiveAI.callEnd();
                    }
                    return;
                }

                if (window.MarquinhosCognitiveAI && window.MarquinhosCognitiveAI.isOnCall()) {
                    return;
                }

                if (window.MarquinhosCognitiveAI && typeof window.MarquinhosCognitiveAI.evalInput === 'function') {
                    const result = window.MarquinhosCognitiveAI.evalInput(text);
                    if (result.message) {
                        setEmotion('talking', result.message, 4500);
                        speakWithBrowser(result.message);
                        return;
                    }
                }

                let fallbackMsg = "No entendí bien, ¿puedes repetirlo?";
                setEmotion('thinking', fallbackMsg, 3500);
                speakWithBrowser(fallbackMsg);
            }

            // ============================
            // 6. API PÚBLICA
            // ============================
            function setEmotion(emotion, text, duration = 3200) {
                const next = validEmotions.has(emotion) ? emotion : 'caring';
                clearTimeout(resetTimer);

                marquinhosEl.classList.remove(...validEmotions);
                marquinhosEl.classList.add(next);
                state.emotion = next;

                if (text) {
                    let safeText = String(text);
                    // ==========================================================
                    // FILTRO DE LENGUAJE EN MODO NIÑO (SOLO COSMÉTICO)
                    // Esto oculta palabras ofensivas en el texto mostrado/hablado
                    // pero NO es una medida de seguridad infantil completa.
                    // ==========================================================
                    if (window.MarquinhosCognitiveAI && window.MarquinhosCognitiveAI.isChildDetected()) {
                        const offensiveWords = ['pendejo', 'wey', 'güey', 'chinga', 'verga', 'puto', 'culero', 'mamón'];
                        for (const word of offensiveWords) {
                            const regex = new RegExp(word, 'gi');
                            safeText = safeText.replace(regex, '****');
                        }
                    }
                    captionEl.textContent = safeText;
                    bubbleEl.innerHTML = `<strong>🎤 Marquinhos</strong> · ${safeText}`;

                if (duration > 0) {
                    resetTimer = window.setTimeout(() => {

            function setCaption(text) {
                let safeText = String(text || '');
                if (window.MarquinhosCognitiveAI && window.MarquinhosCognitiveAI.isChildDetected()) {
                    const offensiveWords = ['pendejo', 'wey', 'güey', 'chinga', 'verga', 'puto', 'culero', 'mamón'];

            function setLook(x = 0, y = 0) {
                state.targetLookX = clamp(Number(x) || 0, -1, 1);
                state.targetLookY = clamp(Number(y) || 0, -1, 1);
            }

            function setAudioLevel(level = 0) {
                state.audioLevel = clamp(Number(level) || 0, 0, 1);
            }

            // ===== SPEAK =====
            function speakWithBrowser(text, options = {}) {
                if (!('speechSynthesis' in window)) {
                    console.warn('Web Speech API no soportada.');
                    return null;
                }

                if (window.MarquinhosCognitiveAI && window.MarquinhosCognitiveAI.isOnCall()) {
                    console.log('📞 En llamada, Marquinhos no habla.');
                    return null;
                }

                let safeText = String(text || '');
                // ==========================================================
                // FILTRO DE LENGUAJE EN MODO NIÑO (SOLO COSMÉTICO)
                // Esto oculta palabras ofensivas en el texto mostrado/hablado
                // pero NO es una medida de seguridad infantil completa.
                // ==========================================================
                if (window.MarquinhosCognitiveAI && window.MarquinhosCognitiveAI.isChildDetected()) {
                    const offensiveWords = ['pendejo', 'wey', 'güey', 'chinga', 'verga', 'puto', 'culero', 'mamón', 'chingar'];
                    for (const word of offensiveWords) {
                        const regex = new RegExp(word, 'gi');
                        safeText = safeText.replace(regex, 'amigo');
                    }
                    safeText = safeText.replace(/[^a-zA-ZáéíóúüñÁÉÍÓÚÜÑ\s.,;:!?¿¡]/g, '');
                }

                if (!safeText) return null;

                const token = ++state.speechToken;
                state.speaking = true;

                const emotion = options.emotion || 'talking';
                const label = options.caption || safeText;
                setEmotion(emotion, label, 0);

                const utterance = new SpeechSynthesisUtterance(safeText);

                // Tono neutro (sin ajustes de género)
                utterance.pitch = 1.08;
                utterance.rate = 1;

                utterance.lang = options.lang || 'es-MX';
                utterance.volume = Number(options.volume) || 1;

                utterance.onstart = () => {
                    if (token !== state.speechToken) return;
                    state.speaking = true;
                    setEmotion(emotion, label, 0);
                };

                utterance.onboundary = () => {
                    if (token !== state.speechToken) return;
                    state.speaking = true;
                    state.audioLevel = Math.max(state.audioLevel, 0.18);
                };

                utterance.onend = () => {
                    if (token !== state.speechToken) return;
                    state.speaking = false;
                    state.audioLevel = 0;
                    setEmotion('caring', 'Listo para escucharte.', 1800);
                };

                utterance.onerror = () => {
                    if (token !== state.speechToken) return;
                    state.speaking = false;
                    state.audioLevel = 0;
                    setEmotion('caring', 'Listo para escucharte.', 1800);
                };

                window.speechSynthesis.cancel();
                window.speechSynthesis.speak(utterance);
                return utterance;
            }

            // ============================
            // 7. SELECTOR DE COLOR
            // ============================
            function initColorPicker() {
                // Cargar color guardado (ya cargado por el módulo cognitivo)
                let savedColor = '#001A80';
                try {
                    const stored = localStorage.getItem('marquinhos_color_preference');
                    if (stored) savedColor = stored;
                } catch (e) {}

                // Aplicar color inicial (ya lo hace el módulo cognitivo, pero por si acaso)
                applyColor(savedColor);

                // Marcar opción activa
                colorOptions.forEach(opt => {
                    const color = opt.dataset.color;
                    opt.classList.toggle('active', color === savedColor);
                });

                // Toggle del menú
                paletteToggle.addEventListener('click', (e) => {
                    e.stopPropagation();
                    paletteOptions.classList.toggle('open');
                });

                // Cerrar al hacer clic fuera
                document.addEventListener('click', () => {
                    paletteOptions.classList.remove('open');
                });

                // Seleccionar color
                colorOptions.forEach(opt => {
                    opt.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const color = opt.dataset.color;
                        const name = opt.dataset.name;

                        // Actualizar UI
                        colorOptions.forEach(o => o.classList.remove('active'));
                        opt.classList.add('active');

                        // Aplicar color (esto guarda en localStorage + Supabase)

                        // Mostrar feedback

                                `<strong>🎨 Color</strong> · Cambiado a "${name}"`;

                                    bubbleEl.innerHTML =
                                        '<strong>🎤 Marquinhos</strong> · Di "Hola Marquinhos" para activarme';
                                }
                            }, 3000);
