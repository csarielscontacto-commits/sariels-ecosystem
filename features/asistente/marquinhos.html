<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1565C0" />
    <title>Marquinhos · Asistente Personal</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet" />

    <style>
        /* ===== RESET ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0A0A1A;
            font-family: "Quicksand", system-ui, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        /* ===== FONDO DINÁMICO ===== */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 30%, rgba(21, 101, 192, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(13, 71, 161, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(10, 25, 47, 0.9) 0%, #0A0A1A 100%);
            z-index: 0;
            pointer-events: none;
        }

        /* ===== CONTENEDOR PRINCIPAL - FLOTANTE ===== */
        #marquinhos-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 160px;
            height: 200px;
            z-index: 9999;
            cursor: grab;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            transition: none;
            filter: drop-shadow(0 8px 30px rgba(13, 71, 161, 0.3));
            pointer-events: auto;
        }

        #marquinhos-container:active {
            cursor: grabbing;
        }

        /* ===== MARQUINHOS ===== */
        .marquinhos {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            animation: float 4.5s ease-in-out infinite;
            user-select: none;
            touch-action: none;
            isolation: isolate;
            pointer-events: none;
            margin: 0 auto;
        }

        .marquinhos * {
            pointer-events: none;
        }

        /* ===== TARJETA ===== */
        .card {
            background: transparent;
            border: none;
            padding: 0;
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* ===== HEAD ===== */
        .head {
            position: relative;
            width: 140px;
            height: 130px;
            margin: 0 auto 0;
            border: 4px solid var(--color-activo, #1565C0);
            border-radius: 50% 50% 45% 45%;
            overflow: visible;
            background: radial-gradient(circle at 35% 25%, #FFFFFF 0%, #FFF8E1 60%, #f5efe0 85%, #e8e0d0 100%);
            box-shadow: inset 0 4px 12px rgba(255, 255, 255, 0.6), inset 0 -4px 12px rgba(13, 71, 161, 0.08), 0 4px 12px rgba(0, 0, 0, 0.10);
            transform: translateZ(10px);
            transition: border-color .3s ease, box-shadow .3s ease;
        }

        .head::before {
            content: "";
            position: absolute;
            inset: 6px;
            border-radius: 50%;
            background-image:
                radial-gradient(circle at 20% 30%, #1565C0 2px, transparent 2px),
                radial-gradient(circle at 80% 25%, #1565C0 2px, transparent 2px),
                radial-gradient(circle at 50% 15%, #1565C0 2.5px, transparent 2.5px),
                radial-gradient(circle at 70% 70%, #1565C0 1.8px, transparent 1.8px),
                radial-gradient(circle at 30% 75%, #1565C0 1.8px, transparent 1.8px),
                radial-gradient(circle at 50% 55%, #1565C0 2px, transparent 2px),
                radial-gradient(circle at 15% 55%, #42A5F5 1.5px, transparent 1.5px),
                radial-gradient(circle at 85% 55%, #42A5F5 1.5px, transparent 1.5px);
            background-size: 60px 60px;
            background-repeat: repeat;
            opacity: 0.25;
            pointer-events: none;
            z-index: 1;
        }

        .head::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.4) 0%, transparent 60%);
            pointer-events: none;
            border-radius: inherit;
            z-index: 2;
        }

        /* ===== ANTENAS ===== */
        .antenna {
            position: absolute;
            top: -18px;
            width: 5px;
            height: 24px;
            border-radius: 999px;
            background: linear-gradient(180deg, #1565C0, #42A5F5);
            transform-origin: bottom center;
            animation: sway 3.2s ease-in-out infinite alternate;
            box-shadow: none;
            transition: all 0.5s ease;
            z-index: 5;
        }
        .antenna::after {
            content: "";
            position: absolute;
            left: 50%;
            top: -12px;
            width: 18px;
            height: 18px;
            transform: translateX(-50%);
            border-radius: 50%;
            background: radial-gradient(circle at 40% 35%, #FFFFFF 0%, #FFF8E1 65%, #42A5F5 100%);
            border: 2px solid #1565C0;
            box-shadow: inset 0 0 6px rgba(255, 255, 255, 0.5), 0 0 0 1px rgba(13, 71, 161, 0.15);
            transition: all 0.5s ease;
        }
        .antenna.left {
            left: 38px;
        }
        .antenna.right {
            right: 38px;
            animation-delay: .14s;
        }

        /* ===== CEJAS ===== */
        .brow {
            position: absolute;
            top: 30px;
            width: 30px;
            height: 7px;
            border-top: 4px solid var(--color-activo, #1565C0);
            border-radius: 50%;
            z-index: 4;
            opacity: 1;
            transition: transform .3s ease, top .3s ease, border-color .3s ease;
        }
        .brow.left {
            left: 22px;
            transform: rotate(-4deg);
        }
        .brow.right {
            right: 22px;
            transform: rotate(4deg);
        }

        /* ===== OJOS ===== */
        .eye {
            position: absolute;
            top: 38px;
            width: 34px;
            height: 38px;
            border-radius: 50%;
            overflow: hidden;
            background: #1A0A2E;
            box-shadow: inset 0 0 0 2px rgba(13, 71, 161, 0.12), 0 0 8px rgba(21, 101, 192, 0.08);
            transition: clip-path 0.15s ease;
            z-index: 3;
        }
        .eye.left {
            left: 22px;
        }
        .eye.right {
            right: 22px;
        }

        .eye::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 42%, #fff 0 56%, #f5f0e8 66%, #e8e0d0 100%);
            border-radius: 50%;
            transform: scaleY(.78);
            transition: transform .2s ease;
        }

        .eye::after {
            content: "";
            position: absolute;
            left: 6px;
            right: 6px;
            top: -2px;
            height: 0;
            background: #FFF8F0;
            border-bottom: 3px solid var(--color-activo, #1565C0);
            border-radius: 50%;
            z-index: 3;
            transition: height .2s ease, border-color .3s ease;
        }

        /* ===== IRIS ===== */
        .iris {
            position: absolute;
            z-index: 2;
            width: 16px;
            height: 16px;
            left: 9px;
            top: 12px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #6dd5ff 0 16%, #1a6cb0 38%, #0a1a3e 74%, #030810 100%);
            box-shadow: 0 0 10px rgba(0, 229, 255, .15), inset 0 0 6px rgba(255, 255, 255, .1);
            transition: transform .3s ease;
        }
        .iris::before {
            content: "";
            position: absolute;
            width: 6px;
            height: 6px;
            left: 2px;
            top: 2px;
            border-radius: 50%;
            background: #fff;
            opacity: .9;
        }

        /* ===== BOCA ===== */
        .mouth-container {
            position: absolute;
            left: 50%;
            bottom: 16px;
            transform: translateX(-50%);
            width: 40px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3;
        }

        .mouth {
            width: 32px;
            height: 10px;
            border-bottom: 4px solid var(--color-activo, #1565C0);
            border-radius: 0 0 50% 50%;
            transition: all 0.04s ease;
            transform-origin: center;
            background: transparent;
            position: relative;
            filter: drop-shadow(0 1px 4px rgba(21, 101, 192, .10));
        }

        .mouth.shape-neutral { width: 32px; height: 10px; border-bottom-width: 4px; border-radius: 0 0 50% 50%; }
        .mouth.talking { animation: talk .12s ease-in-out infinite alternate; }

        /* ===== MEJILLAS ===== */
        .cheek {
            position: absolute;
            bottom: 24px;
            width: 20px;
            height: 14px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 107, 138, 0.55) 0%, rgba(255, 59, 111, 0.25) 100%);
            filter: blur(4px);
            opacity: .6;
            transition: opacity .3s ease;
            z-index: 2;
        }
        .cheek.left {
            left: 10px;
        }
        .cheek.right {
            right: 10px;
        }

        /* ===== CUERPO ===== */
        .body {
            position: relative;
            width: 150px;
            height: 130px;
            margin: -4px auto 0;
            border: 4px solid var(--color-activo, #1565C0);
            border-radius: 30px 30px 40px 40px;
            overflow: hidden;
            background: radial-gradient(circle at 50% 0%, #FFFFFF 0%, #FFF8E1 55%, #f0ead8 85%, #e0d8c0 100%);
            box-shadow: inset 0 4px 12px rgba(255, 255, 255, 0.5), inset 0 -4px 12px rgba(13, 71, 161, 0.06), 0 4px 12px rgba(0, 0, 0, 0.08);
            transform: translateZ(8px);
            animation: breathe 4s ease-in-out infinite;
            transition: border-color .3s ease;
        }

        .body::before {
            content: "";
            position: absolute;
            inset: 8px;
            border-radius: 20px;
            background-image:
                radial-gradient(circle at 20% 25%, #1565C0 2.5px, transparent 2.5px),
                radial-gradient(circle at 80% 30%, #1565C0 2px, transparent 2px),
                radial-gradient(circle at 50% 15%, #1565C0 2px, transparent 2px),
                radial-gradient(circle at 70% 70%, #1565C0 2px, transparent 2px),
                radial-gradient(circle at 30% 75%, #1565C0 2px, transparent 2px),
                radial-gradient(circle at 50% 50%, #42A5F5 2.5px, transparent 2.5px);
            background-size: 50px 50px;
            background-repeat: repeat;
            opacity: 0.2;
            pointer-events: none;
            z-index: 1;
        }

        .body::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.25) 0%, transparent 50%);
            pointer-events: none;
            border-radius: inherit;
            z-index: 2;
        }

        /* ===== PECHO ===== */
        .chest {
            position: absolute;
            left: 50%;
            top: 12px;
            width: 80px;
            height: 38px;
            transform: translateX(-50%);
            border: 3px solid #1565C0;
            border-radius: 12px;
            background: #FFFFFF;
            box-shadow: inset 0 0 0 1px rgba(13, 71, 161, 0.05), 0 2px 8px rgba(0, 0, 0, 0.04);
            display: grid;
            place-items: center;
            transition: all 0.5s ease;
            z-index: 3;
            overflow: hidden;
        }

        .chest::before {
            content: "MARQUINHOS";
            font-weight: 700;
            letter-spacing: 0.8px;
            font-size: 9px;
            color: #0D47A1;
            font-family: "Quicksand", sans-serif;
            transition: all 0.5s ease;
            text-align: center;
            line-height: 1.1;
            padding: 0 2px;
        }

        /* ===== BRAZOS ===== */
        .arm {
            position: absolute;
            top: 14px;
            width: 22px;
            height: 70px;
            border: 4px solid var(--color-activo, #1565C0);
            border-radius: 14px;
            background: linear-gradient(180deg, #FFFFFF, #FFF8E1);
            transform-origin: top center;
            box-shadow: inset 0 0 8px rgba(255, 255, 255, 0.4);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), border-color .3s ease;
            z-index: 2;
            will-change: transform;
        }
        .arm.left {
            left: -12px;
            transform: rotate(-12deg);
        }
        .arm.right {
            right: -12px;
            transform: rotate(12deg);
        }

        .forearm {
            position: absolute;
            left: 0;
            top: 50px;
            width: 20px;
            height: 52px;
            border: 3px solid var(--color-activo, #1565C0);
            border-radius: 12px;
            background: linear-gradient(180deg, #FFFFFF, #FFF8E1);
            transform-origin: top center;
            box-shadow: inset 0 0 8px rgba(255, 255, 255, 0.3);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), border-color .3s ease;
        }

        .hand {
            position: absolute;
            left: -8px;
            top: 44px;
            width: 34px;
            height: 34px;
            border: 3px solid var(--color-activo, #1565C0);
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #FFFFFF 0%, #FFF8E1 60%, #e8e0d0 100%);
            transform-origin: center;
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.3);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), border-color .3s ease;
        }

        /* ===== PIERNAS ===== */
        .leg {
            position: absolute;
            bottom: -4px;
            width: 28px;
            height: 52px;
            border: 4px solid var(--color-activo, #1565C0);
            border-radius: 12px;
            background: linear-gradient(180deg, #FFFFFF, #FFF8E1);
            box-shadow: inset 0 0 8px rgba(255, 255, 255, 0.3);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), border-color .3s ease;
            z-index: 1;
            will-change: transform;
        }
        .leg.left {
            left: 38px;
            transform: rotate(0deg);
        }
        .leg.right {
            right: 38px;
            transform: rotate(0deg);
        }

        .foot {
            position: absolute;
            bottom: -10px;
            left: -8px;
            width: 42px;
            height: 18px;
            border: 4px solid var(--color-activo, #1565C0);
            border-radius: 14px 14px 8px 8px;
            background: linear-gradient(180deg, #FFFFFF, #FFF8E1);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), border-color .3s ease;
        }

        /* ===== BURBUJA DE TEXTO ===== */
        #speech-bubble {
            position: absolute;
            bottom: calc(100% + 10px);
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            color: #0D47A1;
            padding: 8px 16px;
            border-radius: 16px;
            font-size: 11px;
            font-family: "Quicksand", sans-serif;
            z-index: 100;
            max-width: 200px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12), 0 0 0 1px rgba(21, 101, 192, 0.08);
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.25s ease;
            opacity: 0;
            border: 1px solid rgba(21, 101, 192, 0.1);
            line-height: 1.4;
            font-weight: 600;
            white-space: nowrap;
        }

        #speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 6px solid rgba(255, 255, 255, 0.95);
        }

        #speech-bubble.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(-2px);
        }

        #speech-bubble.listening {
            border-color: #00E5FF;
            color: #00B4D8;
            background: rgba(0, 229, 255, 0.08);
        }

        #speech-bubble.listening::after {
            border-top-color: rgba(0, 229, 255, 0.08);
        }

        #speech-bubble.thinking {
            border-color: #FF6B35;
            color: #BF360C;
            background: rgba(255, 107, 53, 0.08);
        }

        #speech-bubble.thinking::after {
            border-top-color: rgba(255, 107, 53, 0.08);
        }

        /* ===== ESTADOS ===== */
        .marquinhos.on-call .antenna {
            animation: callPulse 1.2s ease-in-out infinite alternate;
        }
        .marquinhos.on-call .chest::before {
            content: "📞 LLAMADA";
            color: #FF6B35;
            font-size: 7px;
        }

        .marquinhos.bluetooth .chest::before {
            content: "🔊 BT";
            color: #2979FF;
            font-size: 8px;
        }

        /* ===== ANIMACIONES ===== */
        @keyframes float {
            0%, 100% { transform: translateY(0) rotateX(0deg); }
            50% { transform: translateY(-6px) rotateX(1deg); }
        }

        @keyframes breathe {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(3px); }
        }

        @keyframes sway {
            from { transform: rotate(-8deg); }
            to { transform: rotate(8deg); }
        }

        @keyframes talk {
            from { transform: translateX(-50%) scaleX(.9); height: 4px; }
            to { transform: translateX(-50%) scaleX(1.1); height: 16px; }
        }

        @keyframes callPulse {
            0% { transform: rotate(-10deg) scale(1); }
            100% { transform: rotate(10deg) scale(1.06); }
        }

        /* ===== CONTROLES FLOTANTES ===== */
        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 10000;
            background: rgba(10, 25, 47, 0.85);
            backdrop-filter: blur(12px);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid rgba(212, 175, 55, 0.15);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        .controls button {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            font-size: 20px;
            padding: 4px 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .controls button:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #D4AF37;
            transform: scale(1.1);
        }

        .controls button.active {
            color: #00E5FF;
            background: rgba(0, 229, 255, 0.1);
        }

        .controls .mic-btn.active {
            color: #FF6B35;
            background: rgba(255, 107, 53, 0.15);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 520px) {
            #marquinhos-container {
                width: 130px;
                height: 165px;
            }
            .head {
                width: 115px;
                height: 110px;
            }
            .head .eye {
                width: 28px;
                height: 32px;
            }
            .head .eye.left { left: 18px; }
            .head .eye.right { right: 18px; }
            .head .iris {
                width: 13px;
                height: 13px;
                left: 7px;
                top: 10px;
            }
            .head .brow {
                width: 24px;
                top: 24px;
            }
            .head .brow.left { left: 18px; }
            .head .brow.right { right: 18px; }
            .head .antenna.left { left: 30px; }
            .head .antenna.right { right: 30px; }
            .head .cheek { width: 16px; height: 10px; }
            .head .cheek.left { left: 8px; }
            .head .cheek.right { right: 8px; }
            .body {
                width: 120px;
                height: 105px;
            }
            .body .chest {
                width: 65px;
                height: 30px;
                top: 10px;
            }
            .body .chest::before { font-size: 7px; }
            .arm {
                width: 18px;
                height: 58px;
            }
            .arm.left { left: -10px; }
            .arm.right { right: -10px; }
            .forearm {
                width: 16px;
                height: 42px;
                top: 40px;
            }
            .hand {
                width: 28px;
                height: 28px;
                left: -6px;
                top: 36px;
            }
            .leg {
                width: 22px;
                height: 42px;
            }
            .leg.left { left: 30px; }
            .leg.right { right: 30px; }
            .foot {
                width: 34px;
                height: 14px;
                left: -6px;
            }
            .controls {
                padding: 6px 12px;
                gap: 6px;
                bottom: 12px;
            }
            .controls button {
                font-size: 16px;
                width: 30px;
                height: 30px;
            }
            #speech-bubble {
                font-size: 9px;
                padding: 4px 12px;
                max-width: 140px;
                white-space: normal;
            }
        }

        @media (prefers-reduced-motion:reduce) {
            .marquinhos, .head, .body, .antenna, .mouth, .hand {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body>

    <!-- ===== MARQUINHOS FLOTANTE ===== -->
    <div id="marquinhos-container">
        <div class="marquinhos caring" id="marquinhos">
            <div class="card">
                <!-- BURBUJA DE TEXTO -->
                <div id="speech-bubble"></div>

                <div class="head">
                    <div class="antenna left"></div>
                    <div class="antenna right"></div>

                    <div class="brow left"></div>
                    <div class="brow right"></div>

                    <div class="eye left">
                        <div class="iris"></div>
                    </div>
                    <div class="eye right">
                        <div class="iris"></div>
                    </div>

                    <div class="mouth-container">
                        <div class="mouth shape-neutral" id="disneyMouth"></div>
                    </div>

                    <div class="cheek left"></div>
                    <div class="cheek right"></div>
                </div>

                <div class="body">
                    <div class="chest"></div>

                    <div class="arm left">
                        <div class="forearm">
                            <div class="hand"></div>
                        </div>
                    </div>

                    <div class="arm right">
                        <div class="forearm">
                            <div class="hand"></div>
                        </div>
                    </div>

                    <div class="leg left">
                        <div class="foot"></div>
                    </div>
                    <div class="leg right">
                        <div class="foot"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== CONTROLES ===== -->
    <div class="controls" id="controls">
        <button id="btnMic" class="mic-btn" title="Micrófono">🎤</button>
        <button id="btnMusic" title="Música">🎵</button>
        <button id="btnLight" title="Luz">💡</button>
        <button id="btnReset" title="Resetear posición">🏠</button>
    </div>

    <script>
        "use strict";

        // ================================================================
        // 1. DISNEY LIP SYNC
        // ================================================================
        const DisneyMouth = {
            mouthElement: null,

            init() {
                this.mouthElement = document.getElementById('disneyMouth');
                if (!this.mouthElement) return;
                this.setShape('neutral');
            },

            setShape(shape, intensity = 1) {
                if (!this.mouthElement) return;
                if (shape === 'talking') {
                    this.mouthElement.className = 'mouth talking';
                    return;
                }
                this.mouthElement.className = 'mouth shape-neutral';
            },

            setOpenAmount(amount) {
                if (!this.mouthElement) return;
                const width = 32 * (0.4 + amount * 0.55);
                const height = 10 * (0.1 + amount * 0.85);
                this.mouthElement.style.width = `${Math.max(16, width)}px`;
                this.mouthElement.style.height = `${Math.max(2, height)}px`;
                if (amount > 0.5) {
                    this.mouthElement.style.borderRadius = '50% 50% 45% 45%';
                } else {
                    this.mouthElement.style.borderRadius = '0 0 50% 50%';
                }
                this.mouthElement.style.borderBottomWidth = `${Math.max(2, 3 + amount * 5)}px`;
            },

            reset() {
                if (!this.mouthElement) return;
                this.mouthElement.className = 'mouth shape-neutral';
                this.mouthElement.style.width = '32px';
                this.mouthElement.style.height = '10px';
                this.mouthElement.style.borderRadius = '0 0 50% 50%';
                this.mouthElement.style.borderBottomWidth = '4px';
            }
        };

        // ================================================================
        // 2. DETECTOR DE PALABRAS
        // ================================================================
        const OraDetector = {
            triggerWords: [
                'sorpresa', 'increíble', 'no mames', 'no manches', 'wow',
                'órale', 'ora', 'qué pedo', 'qué onda', 'no me digas',
                '¡ora!', 'ora ora', 'no mms', 'nmms', 'ke pedo'
            ],

            check(text) {
                const lower = text.toLowerCase();
                for (const word of this.triggerWords) {
                    if (lower.includes(word)) return true;
                }
                return false;
            }
        };

        // ================================================================
        // 3. ASISTENTE DE VOZ
        // ================================================================
        (function voiceAssistant() {
            'use strict';

            const container = document.getElementById('marquinhos-container');
            const bubble = document.getElementById('speech-bubble');
            const marquinhosEl = document.getElementById('marquinhos');

            let recognition = null;
            let isListening = false;
            let isSpeaking = false;
            let retries = 0;
            const maxRetries = 3;
            let retryTimeout = null;
            let synth = window.speechSynthesis;
            let audioContext = null;
            let isMusicPlaying = false;
            let isLightOn = false;
            let currentUtterance = null;
            let userName = null;

            // ===== BURBUJA =====
            function showBubble(text, type = '') {
                bubble.textContent = text;
                bubble.className = 'visible';
                if (type) bubble.classList.add(type);
                clearTimeout(bubble._timeout);
                bubble._timeout = setTimeout(() => {
                    bubble.classList.remove('visible', 'listening', 'thinking');
                }, 4000);
            }

            function hideBubble() {
                bubble.classList.remove('visible', 'listening', 'thinking');
            }

            // ===== HABLAR =====
            function speak(text, callback) {
                if (!text) return;
                if (isSpeaking) {
                    synth.cancel();
                }

                showBubble(text, 'thinking');

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'es-MX';
                utterance.pitch = 1.08;
                utterance.rate = 0.95;
                utterance.volume = 1;

                utterance.onstart = () => {
                    isSpeaking = true;
                    marquinhosEl.classList.add('talking');
                    DisneyMouth.setShape('talking');
                    startMouthTracking();
                };

                utterance.onend = () => {
                    isSpeaking = false;
                    marquinhosEl.classList.remove('talking');
                    DisneyMouth.reset();
                    stopMouthTracking();
                    hideBubble();
                    if (callback) callback();
                };

                utterance.onerror = () => {
                    isSpeaking = false;
                    marquinhosEl.classList.remove('talking');
                    DisneyMouth.reset();
                    stopMouthTracking();
                    hideBubble();
                    if (callback) callback();
                };

                currentUtterance = utterance;
                synth.cancel();
                synth.speak(utterance);
            }

            // ===== TRACKING DE BOCA =====
            let mouthTrackInterval = null;

            function startMouthTracking() {
                if (!audioContext) {
                    try {
                        audioContext = new(window.AudioContext || window.webkitAudioContext)();
                    } catch (e) { return; }
                }
                let lastLevel = 0;
                if (mouthTrackInterval) clearInterval(mouthTrackInterval);
                mouthTrackInterval = setInterval(() => {
                    if (!isSpeaking) {
                        DisneyMouth.setOpenAmount(0);
                        return;
                    }
                    // Simulación de movimiento de boca basado en tiempo
                    const time = Date.now() / 100;
                    const level = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(time));
                    const smoothed = lastLevel * 0.3 + level * 0.7;
                    lastLevel = smoothed;
                    DisneyMouth.setOpenAmount(smoothed * 0.8);
                }, 50);
            }

            function stopMouthTracking() {
                if (mouthTrackInterval) {
                    clearInterval(mouthTrackInterval);
                    mouthTrackInterval = null;
                }
                DisneyMouth.reset();
            }

            // ===== COMANDOS =====
            function processCommand(text) {
                const lower = text.toLowerCase();

                // Detectar ORA
                if (OraDetector.check(text)) {
                    speak('¡Ora! ¿Qué pasó?');
                    return;
                }

                // Saludar
                if (lower.includes('hola') || lower.includes('buenas') || lower.includes('hey') || lower.includes('qué tal')) {
                    const namePart = userName ? ` ${userName}` : '';
                    speak(`¡Hola${namePart}! ¿Cómo estás hoy?`);
                    return;
                }

                // Nombre
                if (lower.includes('me llamo') || lower.includes('mi nombre es') || lower.includes('soy ')) {
                    const match = text.match(/(?:me llamo|mi nombre es|soy)\s+([a-zA-ZáéíóúüñÁÉÍÓÚÜÑ]+)/i);
                    if (match && match[1]) {
                        userName = match[1].charAt(0).toUpperCase() + match[1].slice(1).toLowerCase();
                        speak(`¡Mucho gusto ${userName}! Ya te voy a recordar.`);
                        try {
                            localStorage.setItem('marquinhos_user_name', userName);
                        } catch (e) {}
                    }
                    return;
                }

                // Música
                if (lower.includes('música') || lower.includes('música') || lower.includes('canción') || lower.includes('musica')) {
                    toggleMusic();
                    return;
                }

                // Luz
                if (lower.includes('luz') || lower.includes('luz') || lower.includes('prende') || lower.includes('apaga')) {
                    toggleLight();
                    return;
                }

                // Cómo estás
                if (lower.includes('cómo estás') || lower.includes('como estas') || lower.includes('qué tal')) {
                    speak('¡Estoy muy bien! Gracias por preguntar. ¿Y tú?');
                    return;
                }

                // Quién eres
                if (lower.includes('quién eres') || lower.includes('quien eres') || lower.includes('qué haces')) {
                    speak('Soy Marquinhos, tu asistente personal. Estoy aquí para ayudarte con música, luces y lo que necesites.');
                    return;
                }

                // Gracias
                if (lower.includes('gracias') || lower.includes('gracias')) {
                    speak('¡De nada! Es un placer ayudarte.');
                    return;
                }

                // Adiós
                if (lower.includes('adiós') || lower.includes('adios') || lower.includes('hasta luego') || lower.includes('chao')) {
                    speak('¡Hasta luego! Fue un placer hablar contigo.');
                    if (isListening) {
                        setTimeout(() => {
                            if (recognition) {
                                try { recognition.stop(); } catch (e) {}
                            }
                            isListening = false;
                            document.getElementById('btnMic').classList.remove('active');
                            showBubble('🔇 En espera');
                        }, 2000);
                    }
                    return;
                }

                // Ayuda
                if (lower.includes('ayuda') || lower.includes('ayuda') || lower.includes('qué puedes hacer')) {
                    speak('Puedo ayudarte con música, luces, responder preguntas y ser tu compañero. Solo dímelo.');
                    return;
                }

                // Tiempo
                if (lower.includes('hora') || lower.includes('tiempo') || lower.includes('qué hora')) {
                    const now = new Date();
                    const hora = now.getHours();
                    const minutos = now.getMinutes().toString().padStart(2, '0');
                    speak(`Son las ${hora}:${minutos}.`);
                    return;
                }

                // Respuesta por defecto
                speak('No entendí bien, ¿puedes repetirlo?');
            }

            // ===== MÚSICA =====
            function toggleMusic() {
                isMusicPlaying = !isMusicPlaying;
                if (isMusicPlaying) {
                    playMusic();
                } else {
                    stopMusic();
                }
                document.getElementById('btnMusic').classList.toggle('active', isMusicPlaying);
                speak(isMusicPlaying ? '🎵 Música activada' : '⏹️ Música pausada');
            }

            let musicNode = null;

            function playMusic() {
                try {
                    if (!audioContext) {
                        audioContext = new(window.AudioContext || window.webkitAudioContext)();
                    }
                    if (musicNode) {
                        musicNode.disconnect();
                        musicNode = null;
                    }
                    // Crear un tono simple y agradable
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = 440;
                    gain.gain.value = 0.1;
                    osc.connect(gain);
                    gain.connect(audioContext.destination);
                    osc.start();
                    musicNode = { osc, gain };

                    // Cambiar frecuencia suavemente
                    let noteIndex = 0;
                    const notes = [440, 523, 587, 659, 784];
                    if (musicNoteInterval) clearInterval(musicNoteInterval);
                    musicNoteInterval = setInterval(() => {
                        if (!isMusicPlaying || !musicNode) return;
                        noteIndex = (noteIndex + 1) % notes.length;
                        musicNode.osc.frequency.setTargetAtTime(notes[noteIndex], audioContext.currentTime, 0.3);
                    }, 500);

                    showBubble('🎵 Música activa');
                } catch (e) {
                    console.warn('Error al reproducir música:', e);
                    isMusicPlaying = false;
                    document.getElementById('btnMusic').classList.remove('active');
                }
            }

            let musicNoteInterval = null;

            function stopMusic() {
                if (musicNode) {
                    try {
                        musicNode.osc.stop();
                        musicNode.osc.disconnect();
                        musicNode.gain.disconnect();
                    } catch (e) {}
                    musicNode = null;
                }
                if (musicNoteInterval) {
                    clearInterval(musicNoteInterval);
                    musicNoteInterval = null;
                }
                hideBubble();
            }

            // ===== LUZ =====
            function toggleLight() {
                isLightOn = !isLightOn;
                if (isLightOn) {
                    document.body.style.background = '#1A1A3A';
                    document.body.style.transition = 'background 0.5s ease';
                    document.querySelector('.controls').style.borderColor = 'rgba(255, 215, 0, 0.3)';
                    document.getElementById('btnLight').classList.add('active');
                    showBubble('💡 Luz encendida');
                    speak('💡 Luz encendida');
                } else {
                    document.body.style.background = '#0A0A1A';
                    document.querySelector('.controls').style.borderColor = 'rgba(212, 175, 55, 0.15)';
                    document.getElementById('btnLight').classList.remove('active');
                    showBubble('💡 Luz apagada');
                    speak('💡 Luz apagada');
                }
            }

            // ===== RECONOCIMIENTO DE VOZ =====
            function initSpeechRecognition() {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) {
                    showBubble('⚠️ Tu navegador no soporta voz');
                    return;
                }

                recognition = new SpeechRecognition();
                recognition.lang = 'es-MX';
                recognition.continuous = true;
                recognition.interimResults = true;
                recognition.maxAlternatives = 1;

                const activationWords = ['hola marquinhos', 'marquinhos', 'hey marquinhos', 'buenas marquinhos', 'marquinhos'];

                recognition.onresult = (event) => {
                    retries = 0;
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        const transcript = event.results[i][0].transcript.trim();
                        if (event.results[i].isFinal) {
                            console.log('🎤 Dijiste:', transcript);
                            // Mostrar en burbuja
                            showBubble(`🎤 ${transcript}`, 'listening');

                            const lower = transcript.toLowerCase();
                            const isActivation = activationWords.some(word => lower.includes(word));

                            if (isActivation) {
                                speak('¡Dime! Estoy aquí.');
                                continue;
                            }

                            if (isListening) {
                                processCommand(transcript);
                            }
                        }
                    }
                };

                recognition.onerror = (event) => {
                    console.warn('⚠️ Error de reconocimiento:', event.error);
                    if (event.error === 'not-allowed') {
                        retries = maxRetries;
                        showBubble('🔇 Necesito permiso del micrófono');
                        document.getElementById('btnMic').classList.remove('active');
                        isListening = false;
                        return;
                    }
                    if (retries < maxRetries) {
                        retries++;
                        const delay = [1000, 3000, 5000][retries - 1] || 3000;
                        clearTimeout(retryTimeout);
                        retryTimeout = setTimeout(() => {
                            if (isListening && recognition) {
                                try { recognition.start(); } catch (e) {}
                            }
                        }, delay);
                    } else {
                        showBubble('🔇 Toca el micrófono para reactivar');
                        document.getElementById('btnMic').classList.remove('active');
                        isListening = false;
                    }
                };

                recognition.onend = () => {
                    if (retries >= maxRetries) return;
                    if (isListening) {
                        clearTimeout(retryTimeout);
                        retryTimeout = setTimeout(() => {
                            try { recognition.start(); } catch (e) {}
                        }, 300);
                    }
                };

                try {
                    recognition.start();
                    isListening = true;
                    retries = 0;
                    document.getElementById('btnMic').classList.add('active');
                    showBubble('🎤 Escuchando...', 'listening');
                } catch (e) {
                    console.warn('⚠️ No se pudo iniciar:', e);
                }
            }

            // ===== CONTROL DE MICRÓFONO =====
            function toggleMic() {
                if (isListening) {
                    // Apagar
                    isListening = false;
                    if (recognition) {
                        try { recognition.stop(); } catch (e) {}
                    }
                    document.getElementById('btnMic').classList.remove('active');
                    showBubble('🔇 Micrófono apagado');
                } else {
                    // Encender
                    if (!recognition) {
                        initSpeechRecognition();
                        return;
                    }
                    isListening = true;
                    retries = 0;
                    try {
                        recognition.start();
                        document.getElementById('btnMic').classList.add('active');
                        showBubble('🎤 Escuchando...', 'listening');
                    } catch (e) {
                        showBubble('⚠️ Error al activar micrófono');
                    }
                }
            }

            // ===== CONTROLES UI =====
            document.getElementById('btnMic').addEventListener('click', toggleMic);
            document.getElementById('btnMusic').addEventListener('click', toggleMusic);
            document.getElementById('btnLight').addEventListener('click', toggleLight);
            document.getElementById('btnReset').addEventListener('click', () => {
                container.style.top = '50%';
                container.style.left = '50%';
                container.style.transform = 'translate(-50%, -50%)';
                container.style.right = 'auto';
                container.style.bottom = 'auto';
                showBubble('🏠 Posición restaurada');
                setTimeout(hideBubble, 1500);
            });

            // ===== INICIALIZAR =====
            document.addEventListener('DOMContentLoaded', () => {
                DisneyMouth.init();
                // Cargar nombre guardado
                try {
                    const saved = localStorage.getItem('marquinhos_user_name');
                    if (saved) userName = saved;
                } catch (e) {}

                // Iniciar reconocimiento automáticamente
                setTimeout(initSpeechRecognition, 1000);

                // Saludo de bienvenida
                setTimeout(() => {
                    const namePart = userName ? ` ${userName}` : '';
                    speak(`¡Hola${namePart}! Soy Marquinhos, tu asistente personal. ¿Cómo puedo ayudarte?`);
                }, 1500);

                console.log('🚀 MARQUINHOS - Asistente Personal');
                console.log('🎤 Di "Marquinhos" para activarme');
                console.log('🎵 Comandos: música, luz, hora, hola, gracias, adiós');
                console.log('👤 Di "me llamo [nombre]" para recordarlo');
            });

            // Exponer funciones
            window.MarquinhosAssistant = {
                speak,
                toggleMusic,
                toggleLight,
                toggleMic,
                isListening: () => isListening,
                isSpeaking: () => isSpeaking,
                getUserName: () => userName,
                setUserName: (name) => {
                    userName = name;
                    try { localStorage.setItem('marquinhos_user_name', name); } catch (e) {}
                }
            };

            // Limpiar al salir
            window.addEventListener('beforeunload', () => {
                stopMusic();
                if (recognition) {
                    try { recognition.stop(); } catch (e) {}
                }
                synth.cancel();
            });

        })();

        // ================================================================
        // 4. ARRASTRE CON FÍSICA
        // ================================================================

        (function dragPhysics() {
            const container = document.getElementById('marquinhos-container');
            const marquinhos = document.getElementById('marquinhos');

            // Referencias a brazos y piernas
            const arms = marquinhos.querySelectorAll('.arm');
            const legs = marquinhos.querySelectorAll('.leg');

            let isDragging = false;
            let startX = 0,
                startY = 0;
            let origX = 0,
                origY = 0;
            let lastDx = 0,
                lastDy = 0;
            let velocityX = 0,
                velocityY = 0;
            let animationId = null;

            // Función para aplicar física a extremidades
            function applyPhysics(dx, dy, velX, velY) {
                const factor = 0.4;
                // Dirección CONTRARIA al arrastre
                const xOffset = -dx * factor + velX * 3;
                const yOffset = -dy * factor + velY * 3;
                const rotX = dx * 0.1 + velX * 0.8;
                const rotY = dy * 0.1 + velY * 0.8;

                // Brazos: rotación en dirección contraria
                arms.forEach((arm, index) => {
                    const delay = index * 20;
                    clearTimeout(arm._physicsTimeout);
                    arm._physicsTimeout = setTimeout(() => {
                        const baseRotation = index === 0 ? -12 : 12;
                        const extraRot = -rotX * 0.5 + (index === 0 ? -rotY * 0.2 : rotY * 0.2);
                        arm.style.transform = `rotate(${baseRotation + extraRot + xOffset * 0.3}deg)`;
                        arm.style.transition = 'transform 0.05s ease';
                    }, delay);
                });

                // Piernas: rotación en dirección contraria
                legs.forEach((leg, index) => {
                    const delay = index * 20 + 10;
                    clearTimeout(leg._physicsTimeout);
                    leg._physicsTimeout = setTimeout(() => {
                        const baseRotation = 0;
                        const extraRot = -rotX * 0.3 + (index === 0 ? -rotY * 0.15 : rotY * 0.15);
                        leg.style.transform = `rotate(${baseRotation + extraRot + xOffset * 0.2}deg)`;
                        leg.style.transition = 'transform 0.05s ease';
                    }, delay);
                });
            }

            // Función para resetear extremidades con bounce
            function resetPhysics() {
                arms.forEach((arm, index) => {
                    clearTimeout(arm._physicsTimeout);
                    const baseRotation = index === 0 ? -12 : 12;
                    arm.style.transform = `rotate(${baseRotation}deg)`;
                    arm.style.transition = 'transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';
                    setTimeout(() => {
                        arm.style.transition = 'transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1)';
                    }, 500);
                });

                legs.forEach((leg) => {
                    clearTimeout(leg._physicsTimeout);
                    leg.style.transform = 'rotate(0deg)';
                    leg.style.transition = 'transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';
                    setTimeout(() => {
                        leg.style.transition = 'transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1)';
                    }, 500);
                });
            }

            // Eventos de arrastre
            container.addEventListener('pointerdown', (e) => {
                isDragging = true;
                const rect = container.getBoundingClientRect();
                startX = e.clientX;
                startY = e.clientY;
                origX = rect.left;
                origY = rect.top;
                container.setPointerCapture(e.pointerId);
                container.style.cursor = 'grabbing';
                lastDx = 0;
                lastDy = 0;
                velocityX = 0;
                velocityY = 0;

                // Cancelar animación de inercia
                if (animationId) {
                    cancelAnimationFrame(animationId);
                    animationId = null;
                }
            });

            container.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;

                const velX = dx - lastDx;
                const velY = dy - lastDy;
                lastDx = dx;
                lastDy = dy;

                // Mover el contenedor
                container.style.left = (origX + dx) + 'px';
                container.style.top = (origY + dy) + 'px';
                container.style.right = 'auto';
                container.style.bottom = 'auto';
                container.style.transform = 'none';

                // Aplicar física a extremidades
                applyPhysics(dx, dy, velX, velY);

                // Guardar velocidad para inercia
                velocityX = velX;
                velocityY = velY;
            });

            container.addEventListener('pointerup', () => {
                if (!isDragging) return;
                isDragging = false;
                container.style.cursor = 'grab';

                // Resetear extremidades con bounce
                resetPhysics();

                // Inercia
                const friction = 0.92;
                let vx = velocityX * 0.5;
                let vy = velocityY * 0.5;

                if (Math.abs(vx) > 0.5 || Math.abs(vy) > 0.5) {
                    let lastTime = performance.now();

                    function animateInertia() {
                        const now = performance.now();
                        const delta = Math.min((now - lastTime) / 16, 2);
                        lastTime = now;

                        vx *= Math.pow(friction, delta);
                        vy *= Math.pow(friction, delta);

                        const rect = container.getBoundingClientRect();
                        const newX = rect.left + vx * delta;
                        const newY = rect.top + vy * delta;

                        // Limitar dentro de la pantalla
                        const maxX = window.innerWidth - rect.width;
                        const maxY = window.innerHeight - rect.height;

                        container.style.left = Math.max(0, Math.min(maxX, newX)) + 'px';
                        container.style.top = Math.max(0, Math.min(maxY, newY)) + 'px';
                        container.style.right = 'auto';
                        container.style.bottom = 'auto';
                        container.style.transform = 'none';

                        if (Math.abs(vx) > 0.1 || Math.abs(vy) > 0.1) {
                            animationId = requestAnimationFrame(animateInertia);
                        } else {
                            animationId = null;
                        }
                    }
                    animateInertia();
                }

                velocityX = 0;
                velocityY = 0;
            });

            container.addEventListener('pointercancel', () => {
                isDragging = false;
                container.style.cursor = 'grab';
                resetPhysics();
                if (animationId) {
                    cancelAnimationFrame(animationId);
                    animationId = null;
                }
            });

            // Prevenir scroll
            container.addEventListener('touchstart', (e) => {
                e.preventDefault();
            }, { passive: false });

            console.log('👆 Arrastre con física activado');
            console.log('🦵 Brazos y piernas se mueven en dirección contraria al arrastre');

        })();
    </script>
