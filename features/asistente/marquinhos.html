<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FF6B00" />
    <title>Marquinhos · Disney Edition</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <style>
        /* ===== VARIABLES Y RESET ===== */
        :root {
            --bg: #0A0A1A;
            --bg2: #1A0A2E;
            --card: rgba(20, 10, 40, .85);
            --blue: #6C3CE0;
            --blue2: #8B5CF6;
            --white: #FFF8F0;
            --gold: #FFD700;
            --gold2: #FFC107;
            --pink: #FF6B8A;
            --shadow: rgba(0, 0, 0, .45);
            --glow: rgba(255, 215, 0, .35);
            --speed: .28s;
            --idle: 4s;
            --talavera-white: #F5F5F5;
            --talavera-dark: #0D47A1;
            --talavera-blue: #1565C0;
            --talavera-light: #42A5F5;
            --deep-blue: #0A1E3F;
            --talavera-gold: #FFD700;
            --soft-gold: #FFC107;
            --talavera-green: #00897B;
            --terracotta: #E65100;
            --cream: #FFF8E1;
            --ceramic: #FFFFFF;
            --child-safe: #4CAF50;
            --child-safe-bg: rgba(76, 175, 80, 0.15);
            --call-pause: #FF6B35;
            --call-pause-bg: rgba(255, 107, 53, 0.15);
            --mic-active: #00E5FF;
            --mic-active-bg: rgba(0, 229, 255, 0.15);
            --bluetooth: #2979FF;
            --bluetooth-bg: rgba(41, 121, 255, 0.15);
            /* Color activo (controlado por el usuario) */
            --color-activo: #6C3CE0;
            --color-activo-rgb: 108, 60, 224;
            /* Disney Colors */
            --disney-yellow: #FFD700;
            --disney-red: #FF3B30;
            --disney-blue: #007AFF;
            --disney-pink: #FF2D55;
            --disney-orange: #FF9500;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
            font-family: "Space Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        }

        /* ===== ESCENA PRINCIPAL ===== */
        .scene {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: grid;
            place-items: center;
            perspective: 1200px;
            perspective-origin: 50% 42%;
            background: radial-gradient(circle at top, #2A1A5E 0%, #0A0A1A 38%, #050510 100%);
        }

        .ambient {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 215, 0, .25) 0%, rgba(108, 60, 224, .15) 35%, transparent 70%);
            filter: blur(12px);
            transform: translateY(40px);
            pointer-events: none;
            animation: ambientPulse 3s ease-in-out infinite alternate;
        }

        @keyframes ambientPulse {
            0% {
                transform: translateY(40px) scale(1);
                opacity: 0.8;
            }
            100% {
                transform: translateY(20px) scale(1.2);
                opacity: 1;
            }
        }

        .shadow {
            position: absolute;
            bottom: 10%;
            width: 280px;
            height: 50px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 215, 0, .25) 0%, rgba(108, 60, 224, .12) 45%, transparent 70%);
            filter: blur(8px);
            transform: scale(1.2);
            pointer-events: none;
            animation: shadowPulse 2.5s ease-in-out infinite alternate;
        }

        @keyframes shadowPulse {
            0% {
                transform: scale(1.1);
                opacity: 0.6;
            }
            100% {
                transform: scale(1.3);
                opacity: 1;
            }
        }

        /* ===== CONTENEDOR PRINCIPAL ===== */
        .marquinhos {
            position: relative;
            width: 320px;
            transform-style: preserve-3d;
            animation: float 4.5s ease-in-out infinite;
            filter: drop-shadow(0 30px 40px rgba(108, 60, 224, .35));
            user-select: none;
            touch-action: none;
            isolation: isolate;
            transition: all 0.5s ease;
        }

        /* ===== TARJETA ===== */
        .card {
            background: linear-gradient(180deg, rgba(30, 15, 60, .85), rgba(10, 5, 25, .9));
            border: 2px solid rgba(255, 215, 0, .2);
            border-radius: 35px;
            padding: 20px 20px 18px;
            backdrop-filter: blur(15px);
            transform: rotateX(2deg);
            box-shadow: inset 0 1px 0 rgba(255, 215, 0, .1), 0 15px 40px rgba(0, 0, 0, .4), 0 0 60px rgba(108, 60, 224, .15);
            position: relative;
            transition: all 0.5s ease;
        }

        /* ===== HEAD ===== */
        .head {
            position: relative;
            width: 200px;
            height: 190px;
            margin: 0 auto;
            border: 5px solid var(--color-activo);
            border-radius: 50% 50% 45% 45%;
            overflow: visible;
            background: radial-gradient(circle at 35% 25%, rgba(255, 248, 240, .98) 0 28%, rgba(245, 240, 255, .98) 42%, #f0e8ff 72%, #e0d6ff 100%);
            box-shadow: inset 0 20px 25px rgba(255, 215, 0, .3), inset 0 -20px 30px rgba(108, 60, 224, .1), 0 15px 30px rgba(0, 0, 0, .2), 0 0 50px rgba(255, 215, 0, .1);
            transform: translateZ(30px);
            transition: border-color .3s ease, box-shadow .3s ease;
        }

        .head::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 25px 25px, rgba(108, 60, 224, .15) 0 3px, transparent 4px),
                radial-gradient(circle at 50px 50px, rgba(108, 60, 224, .1) 0 3px, transparent 4px),
                radial-gradient(circle at 75px 25px, rgba(108, 60, 224, .08) 0 3px, transparent 4px),
                radial-gradient(circle at 125px 30px, rgba(108, 60, 224, .08) 0 3px, transparent 4px),
                radial-gradient(circle at 155px 55px, rgba(108, 60, 224, .12) 0 3px, transparent 4px);
            background-size: 60px 60px;
            opacity: .3;
            mix-blend-mode: multiply;
            pointer-events: none;
        }

        .head::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(145deg, rgba(255, 215, 0, .2), transparent 30%),
                linear-gradient(330deg, transparent 60%, rgba(108, 60, 224, .08) 100%);
            pointer-events: none;
            border-radius: inherit;
        }

        /* ===== ANTENAS DISNEY ===== */
        .antenna {
            position: absolute;
            top: -28px;
            width: 8px;
            height: 35px;
            border-radius: 999px;
            background: linear-gradient(180deg, var(--gold), var(--gold2));
            transform-origin: bottom center;
            animation: sway 3.2s ease-in-out infinite alternate;
            box-shadow: 0 0 20px rgba(255, 215, 0, .4);
            transition: all 0.5s ease;
        }
        .antenna::after {
            content: "";
            position: absolute;
            left: 50%;
            top: -10px;
            width: 16px;
            height: 16px;
            transform: translateX(-50%);
            border-radius: 50%;
            background: radial-gradient(circle, #fff 0%, var(--gold) 55%, var(--gold2) 100%);
            box-shadow: 0 0 25px rgba(255, 215, 0, .8), 0 0 50px rgba(255, 215, 0, .3);
            transition: all 0.5s ease;
        }
        .antenna.left {
            left: 60px;
        }
        .antenna.right {
            right: 60px;
            animation-delay: .14s;
        }

        /* ===== CEJAS DISNEY (más expresivas) ===== */
        .brow {
            position: absolute;
            top: 32px;
            width: 40px;
            height: 10px;
            border-top: 5px solid var(--color-activo);
            border-radius: 50%;
            z-index: 4;
            opacity: 1;
            transition: transform .3s ease, top .3s ease, border-color .3s ease, width .3s ease;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,.1));
        }
        .brow.left {
            left: 28px;
            transform: rotate(-6deg);
        }
        .brow.right {
            right: 28px;
            transform: rotate(6deg);
        }

        /* ===== OJOS DISNEY (más grandes) ===== */
        .eye {
            position: absolute;
            top: 48px;
            width: 50px;
            height: 58px;
            border-radius: 50%;
            overflow: hidden;
            background: #1A0A2E;
            box-shadow: inset 0 0 0 2px rgba(255, 215, 0, .15), 0 0 20px rgba(108, 60, 224, .1);
            transition: clip-path 0.15s ease;
        }
        .eye.left {
            left: 28px;
        }
        .eye.right {
            right: 28px;
        }

        .eye::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 42%, #fff 0 56%, #f5f0ff 66%, #e8dfff 100%);
            border-radius: 50%;
            transform: scaleY(.78);
            transition: transform .2s ease;
        }

        .eye::after {
            content: "";
            position: absolute;
            left: 10px;
            right: 10px;
            top: -4px;
            height: 0;
            background: var(--white);
            border-bottom: 4px solid var(--color-activo);
            border-radius: 50%;
            z-index: 3;
            transition: height .2s ease, border-color .3s ease;
        }

        /* ===== IRIS DISNEY (más brillantes) ===== */
        .iris {
            position: absolute;
            z-index: 2;
            width: 22px;
            height: 22px;
            left: 14px;
            top: 16px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #6dd5ff 0 16%, #1a6cb0 38%, #0a1a3e 74%, #030810 100%);
            box-shadow: 0 0 15px rgba(0, 229, 255, .25), inset 0 0 10px rgba(255, 255, 255, .1);
            transition: transform .3s ease;
        }
        .iris::before {
            content: "";
            position: absolute;
            width: 9px;
            height: 9px;
            left: 3px;
            top: 3px;
            border-radius: 50%;
            background: #fff;
            opacity: .95;
            box-shadow: 0 0 10px rgba(255, 255, 255, .3);
        }
        .iris::after {
            content: "";
            position: absolute;
            width: 4px;
            height: 4px;
            right: 4px;
            bottom: 4px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .3);
        }

        /* ===== BOCA DISNEY (con forma de caricatura) ===== */
        .mouth-container {
            position: absolute;
            left: 50%;
            bottom: 22px;
            transform: translateX(-50%);
            width: 60px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.05s ease;
        }

        .mouth {
            width: 44px;
            height: 16px;
            border-bottom: 5px solid var(--color-activo);
            border-radius: 0 0 50% 50%;
            transition: all 0.04s ease;
            transform-origin: center;
            background: transparent;
            position: relative;
            transition: width 0.04s ease, height 0.04s ease, border-bottom-width 0.04s ease, border-radius 0.04s ease;
            filter: drop-shadow(0 2px 8px rgba(108, 60, 224, .15));
        }

        /* Formas de boca Disney */
        .mouth.shape-A {
            width: 52px;
            height: 30px;
            border-bottom-width: 6px;
            border-radius: 50% 50% 45% 45%;
        }
        .mouth.shape-E {
            width: 46px;
            height: 20px;
            border-bottom-width: 5px;
            border-radius: 0 0 50% 50%;
        }
        .mouth.shape-I {
            width: 34px;
            height: 14px;
            border-bottom-width: 4px;
            border-radius: 0 0 40% 40%;
        }
        .mouth.shape-O {
            width: 50px;
            height: 28px;
            border-bottom-width: 6px;
            border-radius: 50%;
        }
        .mouth.shape-U {
            width: 32px;
            height: 22px;
            border-bottom-width: 5px;
            border-radius: 50% 50% 40% 40%;
        }
        .mouth.shape-M {
            width: 28px;
            height: 8px;
            border-bottom-width: 4px;
            border-radius: 0 0 50% 50%;
        }
        .mouth.shape-F {
            width: 32px;
            height: 10px;
            border-bottom-width: 3px;
            border-radius: 0 0 30% 30%;
        }
        .mouth.shape-S {
            width: 36px;
            height: 10px;
            border-bottom-width: 3px;
            border-radius: 0 0 40% 40%;
        }
        .mouth.shape-neutral {
            width: 44px;
            height: 14px;
            border-bottom-width: 4px;
            border-radius: 0 0 50% 50%;
        }
        .mouth.shape-ORA {
            width: 55px;
            height: 32px;
            border-bottom-width: 7px;
            border-radius: 50%;
            border-color: var(--disney-orange);
            animation: oraShake 0.4s ease-in-out;
        }

        @keyframes oraShake {
            0% { transform: translateX(-50%) scale(1) rotate(0deg); }
            25% { transform: translateX(-50%) scale(1.2) rotate(-5deg); }
            50% { transform: translateX(-50%) scale(1.1) rotate(5deg); }
            75% { transform: translateX(-50%) scale(1.15) rotate(-3deg); }
            100% { transform: translateX(-50%) scale(1) rotate(0deg); }
        }

        /* ===== MEJILLAS DISNEY ===== */
        .cheek {
            position: absolute;
            bottom: 32px;
            width: 28px;
            height: 18px;
            border-radius: 50%;
            background: radial-gradient(circle, #FF6B8A 0%, #FF3B6F 100%);
            filter: blur(6px);
            opacity: .7;
            transition: opacity .3s ease, transform .3s ease, background .3s ease;
            box-shadow: 0 0 20px rgba(255, 107, 138, .2);
        }
        .cheek.left {
            left: 14px;
        }
        .cheek.right {
            right: 14px;
        }

        .chin {
            position: absolute;
            left: 50%;
            bottom: 10px;
            width: 70px;
            height: 20px;
            transform: translateX(-50%);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(108, 60, 224, .08) 0%, transparent 70%);
            opacity: .9;
        }

        /* ===== CUERPO DISNEY ===== */
        .body {
            position: relative;
            width: 220px;
            height: 230px;
            margin: -10px auto 0;
            border: 5px solid var(--color-activo);
            border-radius: 30px 30px 40px 40px;
            overflow: hidden;
            background: radial-gradient(circle at 50% 0%, rgba(255, 248, 240, .98) 0 24%, rgba(246, 240, 255, .98) 45%, #ede5ff 85%, #dcd0ff 100%);
            box-shadow: inset 0 18px 25px rgba(255, 215, 0, .2), inset 0 -20px 30px rgba(108, 60, 224, .08), 0 15px 30px rgba(0, 0, 0, .2);
            transform: translateZ(20px);
            animation: breathe var(--idle) ease-in-out infinite;
            transition: border-color .3s ease, box-shadow .3s ease;
        }

        .body::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent 0 44%, rgba(108, 60, 224, .1) 44% 48%, transparent 48% 100%),
                radial-gradient(circle at 15% 18%, rgba(255, 215, 0, .15) 0 3px, transparent 4px),
                radial-gradient(circle at 82% 22%, rgba(255, 215, 0, .12) 0 3px, transparent 4px),
                radial-gradient(circle at 25% 70%, rgba(108, 60, 224, .08) 0 3px, transparent 4px),
                radial-gradient(circle at 76% 66%, rgba(108, 60, 224, .08) 0 3px, transparent 4px);
            opacity: .3;
            background-size: 66px 66px;
            pointer-events: none;
        }

        /* ===== PECHO DISNEY ===== */
        .chest {
            position: absolute;
            left: 50%;
            top: 18px;
            width: 120px;
            height: 62px;
            transform: translateX(-50%);
            border: 5px solid var(--gold2);
            border-radius: 20px;
            background: linear-gradient(180deg, rgba(255, 215, 0, .3), rgba(255, 215, 0, .1));
            box-shadow: inset 0 0 20px rgba(255, 215, 0, .2), 0 8px 20px rgba(0, 0, 0, .08);
            display: grid;
            place-items: center;
            transition: all 0.5s ease;
        }

        .chest::before {
            content: "⭐ MARQUINHOS ⭐";
            font-weight: 900;
            letter-spacing: 1.8px;
            font-size: 12px;
            color: var(--gold);
            text-shadow: 0 0 15px rgba(255, 215, 0, .3), 0 0 30px rgba(255, 215, 0, .1);
            font-family: "Orbitron", sans-serif;
            transition: all 0.5s ease;
        }

        /* ===== BRAZOS DISNEY ===== */
        .arm {
            position: absolute;
            top: 30px;
            width: 30px;
            height: 110px;
            border: 5px solid var(--color-activo);
            border-radius: 18px;
            background: linear-gradient(180deg, #fff, #ede5ff);
            transform-origin: top center;
            box-shadow: inset 0 0 15px rgba(255, 255, 255, .5);
            transition: transform .4s cubic-bezier(.2, .8, .2, 1), border-color .3s ease;
        }
        .arm.left {
            left: -18px;
            transform: rotate(-14deg);
        }
        .arm.right {
            right: -18px;
            transform: rotate(14deg);
        }

        .forearm {
            position: absolute;
            left: 0;
            top: 80px;
            width: 26px;
            height: 90px;
            border: 4px solid var(--color-activo);
            border-radius: 14px;
            background: linear-gradient(180deg, #fff, #ede5ff);
            transform-origin: top center;
            box-shadow: inset 0 0 12px rgba(255, 255, 255, .5);
            transition: transform .4s cubic-bezier(.2, .8, .2, 1), border-color .3s ease;
        }

        .hand {
            position: absolute;
            left: -10px;
            top: 76px;
            width: 42px;
            height: 42px;
            border: 4px solid var(--color-activo);
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #fff 0 26%, #f0e8ff 58%, #e0d6ff 100%);
            transform-origin: center;
            box-shadow: inset 0 0 15px rgba(255, 255, 255, .4);
            transition: transform .4s cubic-bezier(.2, .8, .2, 1), border-color .3s ease;
        }

        .hand::after {
            content: "";
            position: absolute;
            inset: 10px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 215, 0, .2) 0%, transparent 68%);
            opacity: .7;
        }

        .finger {
            position: absolute;
            top: 2px;
            width: 8px;
            height: 18px;
            border: 2px solid var(--color-activo);
            border-radius: 5px;
            background: #fff;
            transform-origin: bottom center;
            transition: transform .3s ease, border-color .3s ease;
        }
        .finger:nth-child(1) {
            left: 4px;
        }
        .finger:nth-child(2) {
            left: 16px;
        }
        .finger:nth-child(3) {
            left: 28px;
        }

        /* ===== PIERNAS DISNEY ===== */
        .leg {
            position: absolute;
            bottom: -8px;
            width: 38px;
            height: 80px;
            border: 5px solid var(--color-activo);
            border-radius: 16px;
            background: linear-gradient(180deg, #fff, #ede5ff);
            box-shadow: inset 0 0 12px rgba(255, 255, 255, .5);
            transition: border-color .3s ease;
        }
        .leg.left {
            left: 50px;
        }
        .leg.right {
            right: 50px;
        }

        .foot {
            position: absolute;
            bottom: -18px;
            left: -10px;
            width: 56px;
            height: 26px;
            border: 5px solid var(--color-activo);
            border-radius: 20px 20px 12px 12px;
            background: linear-gradient(180deg, #fff, #ede5ff);
            transition: border-color .3s ease;
        }

        /* ===== TEXTO ===== */
        .caption {
            margin-top: 14px;
            text-align: center;
            font-size: 14px;
            color: rgba(255, 248, 240, .85);
            letter-spacing: .3px;
            transition: all 0.3s ease;
            text-shadow: 0 0 20px rgba(255, 215, 0, .1);
        }

        .name {
            margin-top: 4px;
            text-align: center;
            font-weight: 900;
            font-size: 20px;
            letter-spacing: 1.2px;
            color: var(--gold);
            text-shadow: 0 0 20px rgba(255, 215, 0, .25), 0 0 40px rgba(255, 215, 0, .1);
            font-family: "Orbitron", sans-serif;
            transition: all 0.5s ease;
        }

        /* ===== BURBUJA ===== */
        .bubble {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 12px 18px;
            border-radius: 18px;
            background: rgba(10, 5, 25, .7);
            border: 1px solid rgba(255, 215, 0, .12);
            backdrop-filter: blur(15px);
            color: #e8e0ff;
            font-size: 14px;
            line-height: 1.4;
            width: min(360px, calc(100vw - 40px));
            pointer-events: none;
            transition: all 0.5s ease;
            box-shadow: 0 0 30px rgba(108, 60, 224, .08);
        }

        .bubble strong {
            color: var(--gold);
        }

        /* ===== INDICADOR DE MICRÓFONO ===== */
        .mic-indicator {
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 229, 255, 0.12);
            padding: 5px 14px;
            border-radius: 22px;
            border: 1px solid rgba(0, 229, 255, 0.25);
            font-size: 11px;
            color: var(--mic-active);
            transition: all 0.5s ease;
            opacity: 0;
            pointer-events: none;
            backdrop-filter: blur(4px);
        }

        .mic-indicator.active {
            opacity: 1;
        }

        .mic-indicator .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--mic-active);
            animation: micPulse 1s ease-in-out infinite;
            box-shadow: 0 0 15px rgba(0, 229, 255, .3);
        }

        @keyframes micPulse {
            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.6);
                opacity: 0.5;
            }
        }

        /* ===== SELECTOR DE COLOR (PALETA) ===== */
        .color-picker {
            position: absolute;
            top: -12px;
            right: -12px;
            z-index: 100;
            cursor: pointer;
            user-select: none;
            transition: all 0.3s ease;
        }

        .color-picker .palette-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(10, 5, 25, 0.7);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 215, 0, 0.2);
            display: grid;
            place-items: center;
            font-size: 18px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4), 0 0 30px rgba(108, 60, 224, .08);
        }

        .color-picker .palette-icon:hover {
            transform: scale(1.15) rotate(15deg);
            border-color: rgba(255, 215, 0, 0.5);
            box-shadow: 0 4px 30px rgba(108, 60, 224, .2);
        }

        .color-picker .palette-options {
            position: absolute;
            top: 44px;
            right: 0;
            background: rgba(10, 5, 25, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 215, 0, 0.12);
            border-radius: 16px;
            padding: 10px 0;
            min-width: 190px;
            display: none;
            flex-direction: column;
            gap: 3px;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.6), 0 0 40px rgba(108, 60, 224, .05);
            transform-origin: top right;
            animation: pickerSlide 0.25s ease-out;
        }

        .color-picker .palette-options.open {
            display: flex;
        }

        @keyframes pickerSlide {
            from {
                opacity: 0;
                transform: scale(0.92) translateY(-10px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .color-picker .color-option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 18px;
            border: none;
            background: transparent;
            color: #e8e0ff;
            font-family: "Space Grotesk", sans-serif;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            border-radius: 0;
            width: 100%;
            text-align: left;
        }

        .color-picker .color-option:hover {
            background: rgba(255, 215, 0, 0.06);
        }

        .color-picker .color-option .swatch {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.15);
            flex-shrink: 0;
            transition: border-color 0.2s ease, transform 0.2s ease;
        }

        .color-picker .color-option:hover .swatch {
            border-color: rgba(255, 215, 0, 0.5);
            transform: scale(1.1);
        }

        .color-picker .color-option .check-mark {
            margin-left: auto;
            opacity: 0;
            transition: opacity 0.2s ease;
            font-size: 16px;
            color: var(--gold);
        }

        .color-picker .color-option.active .check-mark {
            opacity: 1;
        }

        .color-picker .color-option.active {
            background: rgba(255, 215, 0, 0.05);
        }

        /* ===== ESTADOS DE LLAMADA ===== */
        .marquinhos.on-call .antenna {
            animation: callPulse 1.2s ease-in-out infinite alternate;
        }
        .marquinhos.on-call .antenna::after {
            animation: callGlow 1.2s ease-in-out infinite alternate;
        }
        .marquinhos.on-call .chest {
            border-color: var(--call-pause);
            box-shadow: 0 0 40px var(--call-pause-bg);
            animation: callChestPulse 1.2s ease-in-out infinite alternate;
        }
        .marquinhos.on-call .chest::before {
            content: "📞 EN LLAMADA";
            color: var(--call-pause);
            text-shadow: 0 0 25px rgba(255, 107, 53, 0.5);
        }

        /* Modo Bluetooth */
        .marquinhos.bluetooth-connected .chest::before {
            content: "🔊 BLUETOOTH";
            color: var(--bluetooth);
            text-shadow: 0 0 25px rgba(41, 121, 255, 0.5);
        }
        .marquinhos.bluetooth-connected .chest {
            border-color: var(--bluetooth);
            box-shadow: 0 0 40px var(--bluetooth-bg);
        }

        /* ===== ESTADOS / EMOCIONES DISNEY ===== */
        .marquinhos.happy .mouth {
            border-bottom-width: 6px;
            border-radius: 0 0 50% 50%;
            width: 52px;
            height: 24px;
        }
        .marquinhos.happy .cheek {
            opacity: 1;
            transform: scale(1.2);
        }
        .marquinhos.loving .mouth {
            width: 50px;
            height: 22px;
            border-bottom-width: 6px;
        }
        .marquinhos.loving .cheek {
            opacity: 1;
            transform: scale(1.4);
            background: radial-gradient(circle, #FF6B8A 0%, #FF2D55 100%);
        }
        .marquinhos.sad .mouth {
            border-bottom: 0;
            border-top: 5px solid var(--color-activo);
            border-radius: 50% 50% 0 0;
            height: 18px;
            width: 40px;
        }
        .marquinhos.sad .brow.left {
            transform: rotate(12deg) translateY(6px);
        }
        .marquinhos.sad .brow.right {
            transform: rotate(-12deg) translateY(6px);
        }
        .marquinhos.surprised .mouth {
            width: 34px;
            height: 32px;
            border: 5px solid var(--color-activo);
            border-radius: 50%;
            border-bottom: 5px solid var(--color-activo);
        }
        .marquinhos.surprised .brow {
            top: 22px;
        }
        .marquinhos.talking .mouth {
            animation: talk .12s ease-in-out infinite alternate;
        }
        .marquinhos.talking .body {
            animation: breathe var(--idle) ease-in-out infinite, talkBody .65s ease-in-out infinite alternate;
        }
        .marquinhos.waving .arm.right {
            animation: waveR .45s ease-in-out infinite alternate;
        }
        .marquinhos.waving .arm.left {
            animation: waveL .45s ease-in-out infinite alternate;
        }
        .marquinhos.waving .finger {
            animation: wiggle .24s ease-in-out infinite alternate;
        }
        .marquinhos.wink .eye.left::after {
            height: 48px;
        }
        .marquinhos.wink .eye.left::before {
            transform: scaleY(.06);
        }
        .marquinhos.excited {
            animation: bounce .55s ease-in-out infinite alternate;
        }
        .marquinhos.excited .mouth {
            width: 52px;
            height: 26px;
            border-bottom-width: 6px;
        }
        .marquinhos.excited .cheek {
            opacity: 1;
            transform: scale(1.3);
        }
        .marquinhos.thinking .iris {
            animation: think 1.2s ease-in-out infinite alternate;
        }
        .marquinhos.thinking .brow.left {
            transform: rotate(-18deg) translateY(-6px);
        }
        .marquinhos.thinking .brow.right {
            transform: rotate(18deg) translateY(-6px);
        }
        .marquinhos.caring .cheek {
            opacity: 1;
            transform: scale(1.3);
        }
        .marquinhos.caring .mouth {
            width: 44px;
            height: 20px;
            border-bottom-width: 5px;
        }
        .marquinhos.grateful .mouth {
            width: 48px;
            height: 22px;
            border-bottom-width: 5px;
        }
        .marquinhos.grateful .cheek {
            opacity: 1;
            transform: scale(1.2);
        }
        .marquinhos.grateful .brow.left {
            transform: rotate(-4deg) translateY(-3px);
        }
        .marquinhos.grateful .brow.right {
            transform: rotate(4deg) translateY(-3px);
        }
        .marquinhos.embarrassed .cheek {
            opacity: 1;
            transform: scale(1.8);
            background: radial-gradient(circle, #FF3B30 0%, #FF2D55 100%);
        }
        .marquinhos.embarrassed .mouth {
            width: 28px;
            height: 10px;
            border-bottom-width: 4px;
        }
        .marquinhos.embarrassed .head {
            animation: embarrassedHead 1.2s ease-in-out infinite alternate;
        }
        .marquinhos.curious .brow.left {
            transform: rotate(-22deg) translateY(-6px);
        }
        .marquinhos.curious .brow.right {
            transform: rotate(6deg) translateY(2px);
        }
        .marquinhos.curious .head {
            animation: curiousHead 1.6s ease-in-out infinite alternate;
        }
        .marquinhos.tired .eye::before {
            transform: scaleY(.4);
        }
        .marquinhos.tired .brow.left,
        .marquinhos.tired .brow.right {
            top: 44px;
            transform: rotate(4deg);
        }
        .marquinhos.tired .mouth {
            width: 34px;
            height: 8px;
            border-bottom-width: 3px;
        }
        .marquinhos.thrilled {
            animation: thrilledBounce .48s ease-in-out infinite alternate;
        }
        .marquinhos.thrilled .mouth {
            width: 54px;
            height: 30px;
            border-bottom-width: 6px;
        }
        .marquinhos.thrilled .cheek {
            opacity: 1;
            transform: scale(1.4);
        }

        /* ===== ESTADO ORA (sorpresa mexicana) ===== */
        .marquinhos.ora .mouth {
            width: 55px;
            height: 32px;
            border-bottom-width: 7px;
            border-radius: 50%;
            border-color: var(--disney-orange);
            animation: oraShake 0.5s ease-in-out;
        }
        .marquinhos.ora .brow.left {
            transform: rotate(-20deg) translateY(-8px);
        }
        .marquinhos.ora .brow.right {
            transform: rotate(20deg) translateY(-8px);
        }
        .marquinhos.ora .eye {
            animation: oraEyes 0.5s ease-in-out;
        }

        @keyframes oraEyes {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        @keyframes oraShake {
            0% { transform: translateX(-50%) scale(1) rotate(0deg); }
            20% { transform: translateX(-50%) scale(1.3) rotate(-8deg); }
            40% { transform: translateX(-50%) scale(1.1) rotate(8deg); }
            60% { transform: translateX(-50%) scale(1.2) rotate(-5deg); }
            80% { transform: translateX(-50%) scale(1.05) rotate(3deg); }
            100% { transform: translateX(-50%) scale(1) rotate(0deg); }
        }

        /* ===== ANIMACIONES ===== */
        @keyframes talk {
            from {
                transform: translateX(-50%) scaleX(.92);
                height: 8px;
            }
            to {
                transform: translateX(-50%) scaleX(1.12);
                height: 24px;
            }
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0) rotateX(0deg);
            }
            50% {
                transform: translateY(-8px) rotateX(2deg);
            }
        }
        @keyframes breathe {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(5px);
            }
        }
        @keyframes sway {
            from {
                transform: rotate(-10deg);
            }
            to {
                transform: rotate(10deg);
            }
        }
        @keyframes talkBody {
            from {
                margin-top: 0;
            }
            to {
                margin-top: 2px;
            }
        }
        @keyframes waveR {
            from {
                transform: rotate(10deg);
            }
            to {
                transform: rotate(70deg);
            }
        }
        @keyframes waveL {
            from {
                transform: rotate(-10deg);
            }
            to {
                transform: rotate(-70deg);
            }
        }
        @keyframes wiggle {
            from {
                transform: rotate(-10deg);
            }
            to {
                transform: rotate(18deg);
            }
        }
        @keyframes think {
            from {
                transform: translate(0, -2px);
            }
            to {
                transform: translate(10px, -8px);
            }
        }
        @keyframes bounce {
            from {
                transform: translateY(0) scale(1);
            }
            to {
                transform: translateY(-14px) scale(1.04);
            }
        }
        @keyframes embarrassedHead {
            from {
                transform: translateZ(30px) rotateZ(-3deg);
            }
            to {
                transform: translateZ(30px) rotateZ(4deg) translateY(4px);
            }
        }
        @keyframes curiousHead {
            from {
                transform: translateZ(30px) rotateZ(-6deg);
            }
            to {
                transform: translateZ(30px) rotateZ(6deg);
            }
        }
        @keyframes thrilledBounce {
            from {
                transform: translateY(0) scale(1);
            }
            to {
                transform: translateY(-16px) scale(1.04);
            }
        }
        @keyframes callPulse {
            0% {
                transform: rotate(-12deg) scale(1);
            }
            100% {
                transform: rotate(12deg) scale(1.1);
            }
        }
        @keyframes callGlow {
            0% {
                box-shadow: 0 0 20px rgba(255, 107, 53, 0.7);
            }
            100% {
                box-shadow: 0 0 50px rgba(255, 107, 53, 1);
            }
        }
        @keyframes callChestPulse {
            0% {
                box-shadow: 0 0 25px rgba(255, 107, 53, 0.2);
            }
            100% {
                box-shadow: 0 0 50px rgba(255, 107, 53, 0.5);
            }
        }

        /* ===== COGNITIVE BUBBLE ===== */
        #cognitive-speech-bubble {
            position: absolute;
            bottom: 105%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 5, 25, 0.9);
            color: #FFD700;
            padding: 12px 20px;
            border-radius: 16px;
            font-size: 14px;
            font-family: "Space Grotesk", system-ui, sans-serif;
            z-index: 9999;
            max-width: 300px;
            text-align: center;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6), 0 0 40px rgba(108, 60, 224, .08);
            pointer-events: none;
            transition: opacity 0.4s ease, transform 0.3s ease;
            opacity: 0;
            border: 1px solid rgba(255, 215, 0, 0.15);
            backdrop-filter: blur(12px);
            line-height: 1.5;
        }

        #cognitive-speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 10px solid rgba(10, 5, 25, 0.9);
        }

        #cognitive-speech-bubble.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(-6px);
        }

        #cognitive-speech-bubble.ora-mode {
            border-color: var(--disney-orange);
            color: #FF9500;
            background: rgba(20, 5, 0, 0.95);
            box-shadow: 0 8px 40px rgba(255, 149, 0, 0.2);
        }

        #cognitive-speech-bubble.ora-mode::after {
            border-top-color: rgba(20, 5, 0, 0.95);
        }

        #cognitive-speech-bubble.child-safe {
            border-color: var(--child-safe);
            color: #A5D6A7;
            background: rgba(10, 20, 10, 0.95);
        }

        #cognitive-speech-bubble.child-safe::after {
            border-top-color: rgba(10, 20, 10, 0.95);
        }

        #cognitive-speech-bubble.on-call {
            border-color: var(--call-pause);
            color: #FFB085;
            background: rgba(20, 10, 5, 0.95);
        }

        #cognitive-speech-bubble.on-call::after {
            border-top-color: rgba(20, 10, 5, 0.95);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width:520px) {
            .marquinhos {
                transform: scale(.85);
            }
            .bubble {
                top: 12px;
                left: 12px;
                width: calc(100vw - 24px);
                font-size: 12px;
            }
            #cognitive-speech-bubble {
                max-width: 220px;
                font-size: 12px;
                padding: 10px 14px;
            }
            .mic-indicator {
                font-size: 9px;
                padding: 3px 10px;
            }
            .mic-indicator .dot {
                width: 8px;
                height: 8px;
            }
            .color-picker .palette-icon {
                width: 30px;
                height: 30px;
                font-size: 15px;
            }
            .color-picker .palette-options {
                min-width: 160px;
            }
            .color-picker .color-option {
                font-size: 12px;
                padding: 8px 14px;
            }
        }

        @media (prefers-reduced-motion:reduce) {
            .marquinhos,
            .head,
            .body,
            .antenna,
            .mouth,
            .hand {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>
    <div class="scene">
        <div class="ambient"></div>
        <div class="shadow"></div>

        <div class="bubble" id="bubble">
            <strong>⭐ Marquinhos</strong> · Asistente de voz · Di "Hola Marquinhos" para activar
        </div>

        <div class="marquinhos caring" id="marquinhos" data-emotion="caring">
            <div class="card">
                <div class="head">

                    <div class="brow left"></div>
                    <div class="brow right"></div>

                    <div class="eye left">
                        <div class="iris"></div>
                    </div>
                    <div class="eye right">
                        <div class="iris"></div>
                    </div>

                    <div class="mouth-container">
                        <div class="mouth shape-neutral" id="disneyMouth"></div>
                    </div>

                    <div class="cheek left"></div>
                    <div class="cheek right"></div>
                    <div class="chin"></div>
                </div>

                <div class="body">
                    <div class="chest"></div>

                    <div class="arm left">
                        <div class="forearm">
                            <div class="hand">
                                <div class="finger"></div>
                                <div class="finger"></div>
                                <div class="finger"></div>
                            </div>
                        </div>
                    </div>

                    <div class="arm right">
                        <div class="forearm">
                            <div class="hand">
                                <div class="finger"></div>
                                <div class="finger"></div>
                                <div class="finger"></div>
                            </div>
                        </div>
                    </div>

                    <div class="leg left">
                        <div class="foot"></div>
                    </div>
                    <div class="leg right">
                        <div class="foot"></div>
                    </div>
                </div>

                <div class="name">⭐ Marquinhos</div>
                <div class="caption" id="caption">Hola 👋 estoy listo para tu ecosistema.</div>

                <!-- Indicador de micrófono -->
                <div class="mic-indicator" id="micIndicator">

                    <span id="micStatus">Escuchando...</span>

                <!-- Selector de color (paleta) -->
                <div class="color-picker" id="colorPicker">

                    <div class="palette-options" id="paletteOptions">
                        <button class="color-option active" data-color="#6C3CE0" data-name="Púrpura Mágico">
                            <span class="swatch" style="background:#6C3CE0;"></span>
                            Púrpura Mágico
                            <span class="check-mark">✓</span>
                        </button>
                        <button class="color-option" data-color="#FF3B30" data-name="Rojo Disney">
                            <span class="swatch" style="background:#FF3B30;"></span>
                            Rojo Disney
                            <span class="check-mark">✓</span>
                        </button>
                        <button class="color-option" data-color="#FF9500" data-name="Naranja ORA">
                            <span class="swatch" style="background:#FF9500;"></span>
                            Naranja ORA
                            <span class="check-mark">✓</span>
                        </button>
                        <button class="color-option" data-color="#007AFF" data-name="Azul Disney">
                            <span class="swatch" style="background:#007AFF;"></span>
                            Azul Disney
                            <span class="check-mark">✓</span>
                        </button>
                        <button class="color-option" data-color="#FFD700" data-name="Oro Disney">
                            <span class="swatch" style="background:#FFD700;"></span>
                            Oro Disney
                            <span class="check-mark">✓</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        "use strict";

        // ================================================================
        // 1. DISNEY LIP SYNC + REACCIÓN ORA

        const DisneyMouth = {

            setShape(phoneme, intensity = 1) {
                if (!this.mouthElement) return;

                const cleanPhoneme = phoneme.toUpperCase().replace(/[^A-Z]/g, '');
                const shape = this.shapes[cleanPhoneme] || this.shapes['neutral'];

                const widthBase = 44;
                const heightBase = 18;

                const width = widthBase * (0.5 + (shape.width * 0.5 * intensity));
                const height = heightBase * (0.3 + (shape.height * 0.7 * intensity));

                this.mouthElement.style.width = `${Math.max(22, width)}px`;
                this.mouthElement.style.height = `${Math.max(4, height)}px`;
                this.mouthElement.style.borderRadius = shape.borderRadius || '0 0 50% 50%';
                this.mouthElement.style.borderBottomWidth = `${Math.max(2, shape.borderWidth || 4)}px`;

                if (height > 22) {
                    this.mouthElement.style.borderRadius = '50% 50% 45% 45%';
                }

                this.currentShape = cleanPhoneme;
            },

            setOpenAmount(amount) {
                if (!this.mouthElement) return;
                const width = 44 * (0.4 + amount * 0.55);
                const height = 18 * (0.1 + amount * 0.85);
                this.mouthElement.style.width = `${Math.max(22, width)}px`;
                this.mouthElement.style.height = `${Math.max(4, height)}px`;
                if (amount > 0.5) {
                    this.mouthElement.style.borderRadius = '50% 50% 45% 45%';
                } else {
                    this.mouthElement.style.borderRadius = '0 0 50% 50%';
                }
                this.mouthElement.style.borderBottomWidth = `${Math.max(2, 3 + amount * 5)}px`;

            function detectChildVoice(text) {
                const now = Date.now();
                const childPatterns = [
                    /\b(mami|papi|abuelo|abuela|tío|tía|hermano|hermana)\b/i,
                    /\b(cole|escuela|maestro|maestra|profesor|clase|amigo|amiga)\b/i,
                    /\b(jugar|juego|juguete|diversión|risa|pelota|carro|muñeca)\b/i,
                    /\b(me gusta|no me gusta|quiero|tengo miedo|estoy feliz|estoy triste)\b/i,
                    /\b(por qué|porqué|cómo|cual|quien|cuando|donde)\b/i,
                    /\b(ay|oh|wow|guao|epa|uy|ah)\b/i,
                    /\b(¿?.*\?)\b/,
                    /\b(ta|pa|ma|na|da)\b/,
                    /[😊😄😁😅😂🤣😍🥰😘😗😙😚]/,
                    /\b(mucho|muchísimo|super|re|requete)\b/i,
                    /\b(animal|perro|gato|pájaro|pez|conejo|tortuga)\b/i,
                    /\b(princesa|príncipe|rey|reina|castillo|dragón|hada)\b/i,
                    /\b(robot|avión|nave|espacio|astronauta)\b/i,
                    /\b(años|edad|chico|chica|niño|niña|pequeño|pequeña)\b/i
                ];
                const offensivePatterns = [
                    /\b(pendejo|pendeja|wey|güey|chinga|chingar|mamón|mamona|verga|puto|puta|culero|culera|pito|v*rga)\b/i
                ];
                const textLower = text.toLowerCase();
                const hasOffensive = offensivePatterns.some(p => p.test(textLower));
                if (hasOffensive) {
                    cognitiveState.isChild = false;
                    cognitiveState.childConfidence = Math.max(0, cognitiveState.childConfidence - 0.3);
                    return false;
                }
                let childScore = 0;
                for (const pattern of childPatterns) {
                    const matches = (textLower.match(new RegExp(pattern.source, 'gi')) || []).length;
                    if (matches > 0) {
                        childScore += matches * 0.15;
                    }
                }
                const wordCount = text.split(/\s+/).length;
                if (wordCount < 3) {
                    childScore *= 0.5;
                }
                const questionCount = (text.match(/\?/g) || []).length;
                if (questionCount >= 2) {
                    childScore += 0.2;
                }
                const emotionCount = (text.match(/[😊😄😁😅😂🤣😍🥰😘😗😙😚❤️💕💖]/g) || []).length;
                if (emotionCount > 0) {
                    childScore += 0.15 * emotionCount;
                }
                const threshold = 0.4;
                const isChild = childScore > threshold;
                if (isChild) {
                    cognitiveState.childConfidence = Math.min(1, cognitiveState.childConfidence + 0.15);
                } else {
                    cognitiveState.childConfidence = Math.max(0, cognitiveState.childConfidence - 0.1);
                }
                const wasChild = cognitiveState.isChild;
                cognitiveState.isChild = cognitiveState.childConfidence > 0.3;
                if (wasChild !== cognitiveState.isChild) {
                    console.log(`🧒 Modo infantil ${cognitiveState.isChild ? 'ACTIVADO' : 'DESACTIVADO'}`);
                    saveMemory();
                }
                cognitiveState.lastChildDetection = now;
                return cognitiveState.isChild;
            }

                cognitiveState.lastInteraction = now;
                if (cognitiveState.isOnCall) {
                    return { recentSimilar: false, profile: cognitiveState.userProfile, isChild: false, onCall: true };
                }
                const isChild = detectChildVoice(text);
                cognitiveState.userProfile = isChild ? 'infantil' : 'general';
                const recentSimilar = cognitiveState.history.find(h =>
                    h.text.toLowerCase() === text.toLowerCase() &&
                    (now - h.timestamp) < 900000
                );
                const isAggressive = /estúpido|inútil|cállate|maldito|pendejo|wey|güey|chinga|verga|puto|culero/i.test(text);
                if (isAggressive) {
                    cognitiveState.irritability = Math.min(100, cognitiveState.irritability + 10);
                    if (isChild) {
                        return { recentSimilar, profile: 'infantil', isChild: true, gentleReminder: true, onCall: false };
                    }
                } else {
                    cognitiveState.irritability = Math.max(0, cognitiveState.irritability - 10);
                }
                cognitiveState.boredom = 0;
                cognitiveState.history.push({
                    text,
                    timestamp: now,
                    profile: cognitiveState.userProfile,
                    isChild
                });
                saveMemory();
                return {
                    recentSimilar,
                    profile: cognitiveState.userProfile,
                    isChild,
                    gentleReminder: false,
                    onCall: false
                };
            }

            let cognitiveLoopRunning = false;

            function cognitiveLoop() {
                if (!cognitiveLoopRunning) return;
                const idleTime = (Date.now() - cognitiveState.lastInteraction) / 1000;
                if (!cognitiveState.isOnCall && idleTime > 120 && cognitiveState.boredom === 0 && !cognitiveState.isChild) {
                    cognitiveState.boredom = 1;
                    triggerVisualReaction('bored');
                    setTimeout(() => {
                        cognitiveState.boredom = 0;

            function triggerVisualReaction(type, customMessage = null) {

                speechBubble.textContent = message;
                speechBubble.classList.remove('child-safe', 'on-call', 'ora-mode');
                if (cognitiveState.isChild) {
                    speechBubble.classList.add('child-safe');

            window.MarquinhosCognitiveAI = {

                },

        // ================================================================

        // ================================================================
        (() => {

            const bubbleEl = document.getElementById('bubble');
            const irises = [...document.querySelectorAll('.iris')];
            const eyes = [...document.querySelectorAll('.eye')];
            const mouth = document.getElementById('disneyMouth');
            const antennas = [...document.querySelectorAll('.antenna')];
            const micIndicator = document.getElementById('micIndicator');

            const colorPicker = document.getElementById('colorPicker');
            const paletteToggle = document.getElementById('paletteToggle');
            const paletteOptions = document.getElementById('paletteOptions');
            const colorOptions = paletteOptions.querySelectorAll('.color-option');

            const validEmotions = new Set([
                'idle', 'happy', 'loving', 'sad', 'surprised', 'talking',
                'waving', 'wink', 'excited', 'thinking', 'caring',
                'grateful', 'embarrassed', 'curious', 'tired', 'thrilled', 'ora'

            const state = {
                emotion: 'caring',

                targetLookY: 0,

                nextIdleAction: performance.now() + 3500 + Math.random() * 5000,

                isListening: false,

            };

            let resetTimer = null;

            function clamp(value, min, max) {
                return Math.max(min, Math.min(max, value));
            }

            function random(min, max) {
                return min + Math.random() * (max - min);
            }

            function resetState() {
                clearTimeout(resetTimer);
                marquinhosEl.classList.remove(...validEmotions);

            function applyColor(colorHex) {
