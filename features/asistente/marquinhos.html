                    });
                });
            }

            // ============================
            // 8. LOOP DE ANIMACIÓN
            // ============================
            function analyseAudio() {
                if (!state.analyser || !state.audioData) {
                    if (!state.speaking) state.audioLevel *= 0.88;
                    return;
                }
                state.analyser.getByteTimeDomainData(state.audioData);
                let sum = 0;
                for (let i = 0; i < state.audioData.length; i += 1) {
                    const normalized = (state.audioData[i] - 128) / 128;
                    sum += normalized * normalized;
                }
                const rms = Math.sqrt(sum / state.audioData.length);
                const level = clamp(rms * 5.2, 0, 1);
                state.audioLevel += (level - state.audioLevel) * 0.28;
                state.speaking = level > 0.025;
            }

            function blink(now) {
                if (now >= state.nextBlink && now > state.blinkUntil) {
                    state.blinkUntil = now + 135;
                    state.nextBlink = now + 3200 + Math.random() * 5000;
                }
                const blinking = now < state.blinkUntil;
                eyes.forEach((eye, index) => {
                    if (blinking) {
                        eye.style.clipPath = 'inset(46% 0 46% 0 round 50%)';
                        if (index === 1) eye.style.transform = 'scaleY(.94)';
                    } else {
                        eye.style.clipPath = 'none';
                        eye.style.transform = 'scaleY(1)';
                    }
                });
            }

            function performIdleAction(now) {
                if (now < state.nextIdleAction) return;
                const actions = ['lookLeft', 'lookRight', 'nod', 'listen', 'antenna'];
                state.idleAction = actions[Math.floor(Math.random() * actions.length)];
                state.idleActionUntil = now + random(900, 1800);
                state.nextIdleAction = now + random(3600, 7200);

                if (state.idleAction === 'lookLeft') setLook(-0.75, -0.04);
                if (state.idleAction === 'lookRight') setLook(0.75, -0.04);
                if (state.idleAction === 'nod') {
                    state.targetTiltX = random(-3, 3);
                    state.targetTiltY = random(-5, 5);
                }
                if (state.idleAction === 'listen') {
                    state.targetTiltY = random(-8, 8);
                    state.targetTiltX = random(2, 5);
                }
            }

            function finishIdleAction(now) {
                if (state.idleAction && now > state.idleActionUntil) {
                    state.idleAction = '';
                    setLook(0, 0);
                    state.targetTiltX = 0;
                    state.targetTiltY = 0;
                }
            }

            function updateLookAndPosture(delta) {
                const emotion = state.emotion;
                let lookX = state.targetLookX;
                let lookY = state.targetLookY;
                let tiltX = state.targetTiltX;
                let tiltY = state.targetTiltY;

                if (emotion === 'thinking') {
                    lookX = 0.35;
                    lookY = -0.45;
                    tiltY += 5;
                }
                if (emotion === 'curious') {
                    lookX += 0.18;
                    tiltY += 3;
                }
                if (emotion === 'surprised') {
                    lookY = -0.2;
                    tiltX -= 3;
                }
                if (emotion === 'tired') {
                    lookY += 0.12;
                    tiltX += 2;
                }
                if (emotion === 'talking') {
                    tiltY += Math.sin(performance.now() / 870) * 2.2;
                    tiltX += Math.sin(performance.now() / 1130) * 1.2;
                }

                state.lookX += (lookX - state.lookX) * delta * 7;
                state.lookY += (lookY - state.lookY) * delta * 7;
                state.tiltX += (tiltX - state.tiltX) * delta * 5;
                state.tiltY += (tiltY - state.tiltY) * delta * 5;

                const card = document.querySelector('.marquinhos .card');
                if (card) {
                    card.style.transform =
                        `rotateX(${2 + state.tiltX * 0.3}deg) rotateY(${state.tiltY * 0.3}deg)`;
                }

                irises.forEach((iris) => {
                    iris.style.transform =
                        `translate(${state.lookX * 7}px, ${state.lookY * 4}px)`;
                });
            }

            function updateActing(now) {
                const level = state.audioLevel;
                const talking = state.speaking || level > 0.03;

                if (talking) {
                    const width = 38 + level * 18;
                    const height = 8 + level * 17;
                    mouth.style.width = `${width}px`;
                    mouth.style.height = `${height}px`;
                    antennas.forEach((antenna, index) => {
                        const rotation = Math.sin(now / 180 + index) * (5 + level * 12);
                        antenna.style.transform = `rotate(${rotation}deg)`;
                    });
                } else {
                    mouth.style.width = '';
                    mouth.style.height = '';
                    antennas.forEach((antenna, index) => {
                        const rotation = Math.sin(now / 850 + index) * 7;
                        antenna.style.transform = `rotate(${rotation}deg)`;
                    });
                }
            }

            function animationLoop(now) {
                const delta = Math.min((now - state.lastFrame) / 1000, 0.05);
                state.lastFrame = now;

                analyseAudio();
                blink(now);
                performIdleAction(now);
                finishIdleAction(now);
                updateLookAndPosture(delta);
                updateActing(now);

                requestAnimationFrame(animationLoop);
            }

            // ============================
            // 9. EXPONER API GLOBAL
            // ============================
            window.Marquinhos = {
                react,
                talk,
                setEmotion,
                setLook,
                setCaption,
                setAudioLevel,
                speak: speakWithBrowser,
                reset: resetState,
                startListening: () => {
                    state.recognitionRetries = 0;
                    if (!state.recognition) {
                        initSpeechRecognition();
                    }
                    state.isListening = true;
                    if (micIndicator) micIndicator.classList.add('active');
                    if (micStatus) micStatus.textContent = '🎤 Escuchando...';
                    try {
                        state.recognition.start();
                    } catch (e) {}
                },
                stopListening: () => {
                    state.isListening = false;
                    if (micIndicator) micIndicator.classList.remove('active');
                    if (micStatus) micStatus.textContent = '⏸️ En espera';
                    try {
                        state.recognition.stop();
                    } catch (e) {}
                },
                isListening: () => state.isListening,
                _audioPaused: false,
                // Aplicar color manualmente (desde el selector)
                applyColor: applyColor
            };

            // ============================
            // 10. INICIALIZACIÓN
            // ============================
            // ELIMINADO: setTimeout que iniciaba reconocimiento automáticamente
            // ELIMINADO: listener de click en document para permisos

            // Iniciar selector de color
            initColorPicker();

            // Iniciar loop de animación
            requestAnimationFrame(animationLoop);

            console.log('🚀 Marquinhos · Asistente de voz con selector de color manual.');
            console.log('🎤 Di "Hola Marquinhos" para activarlo (toca el avatar para activar micrófono).');
            console.log('👶 Detección infantil automática activada.');
            console.log('🎨 Selector de color: toca 🎨 para cambiar el color.');
            console.log('📞 Manejo de llamadas: callStart() y callEnd()');
            console.log('📦 API expuesta: window.Marquinhos');
            console.log('🧠 Módulo cognitivo: window.MarquinhosCognitiveAI');
            console.log('🗄️ Datos sincronizados con Supabase (color + historial)');

            // ==========================================================
            // MICRÓFONO: SOLO POR ACCIÓN EXPLÍCITA DEL USUARIO
            // Tocar el avatar activa el micrófono
            // ==========================================================
            marquinhosEl.addEventListener('click', () => {
                if (!window.MarquinhosCognitiveAI.isMicActive()) {
                    window.MarquinhosCognitiveAI.requestMicPermission().then(() => {
                        // Iniciar reconocimiento de voz después de obtener permiso
                        if (state.recognition) {
                            state.recognitionRetries = 0;
                            state.isListening = true;
                            if (micIndicator) micIndicator.classList.add('active');
                            if (micStatus) micStatus.textContent = '🎤 Escuchando...';
                            try {
                                state.recognition.start();
                            } catch (e) {}
                        } else {
                            initSpeechRecognition();
                        }
                    });
                } else if (!state.isListening) {
                    // Si el micrófono está activo pero no escuchando, reactivar
                    state.recognitionRetries = 0;
                    state.isListening = true;
                    if (micIndicator) micIndicator.classList.add('active');
                    if (micStatus) micStatus.textContent = '🎤 Escuchando...';
                    try {
                        state.recognition.start();
                    } catch (e) {}
                }
            });

            console.log('🎤 Micrófono: se activa al tocar el avatar de Marquinhos.');

        })();
    </script>
</body>
</html>
