<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#071019">
    <title>Marquinhos · Asistente Flotante</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ===== VARIABLES Y RESET ===== */
        :root {
            --bg: #071019;
            --bg2: #0c1726;
            --card: rgba(9, 15, 24, .74);
            --blue: #1a237e;
            --blue2: #2f47cc;
            --white: #fbfdff;
            --gold: #d7b35c;
            --gold2: #b88b2d;
            --pink: #ffccd8;
            --shadow: rgba(0, 0, 0, .35);
            --glow: rgba(215, 179, 92, .22);
            --speed: .28s;
            --idle: 4s;
            --talavera-white: #F5F5F5;
            --talavera-dark: #0D47A1;
            --talavera-blue: #1565C0;
            --talavera-light: #42A5F5;
            --deep-blue: #0A1E3F;
            --talavera-gold: #FFD700;
            --soft-gold: #FFC107;
            --talavera-green: #00897B;
            --terracotta: #E65100;
            --cream: #FFF8E1;
            --ceramic: #FFFFFF;
            --child-safe: #4CAF50;
            --child-safe-bg: rgba(76, 175, 80, 0.15);
            --call-pause: #FF6B35;
            --call-pause-bg: rgba(255, 107, 53, 0.15);
            --mic-active: #00E5FF;
            --mic-active-bg: rgba(0, 229, 255, 0.15);
            --bluetooth: #2979FF;
            --bluetooth-bg: rgba(41, 121, 255, 0.15);
            /* Modos de género */
            --feminine: #FF4081;
            --feminine-bg: rgba(255, 64, 129, 0.15);
            --masculine: #448AFF;
            --masculine-bg: rgba(68, 138, 255, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
            font-family: "Space Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        }

        /* ===== ESCENA PRINCIPAL ===== */
        .scene {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: grid;
            place-items: center;
            perspective: 1200px;
            perspective-origin: 50% 42%;
            background: radial-gradient(circle at top, #173757 0%, #0a121d 38%, var(--bg) 100%);
        }

        .ambient {
            position: absolute;
            width: 540px;
            height: 540px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(215, 179, 92, .16) 0%, rgba(47, 71, 204, .08) 35%, transparent 70%);
            filter: blur(8px);
            transform: translateY(40px);
            pointer-events: none;
        }

        .shadow {
            position: absolute;
            bottom: 10%;
            width: 250px;
            height: 42px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 0, 0, .4) 0%, rgba(0, 0, 0, .18) 45%, transparent 70%);
            filter: blur(6px);
            transform: scale(1.15);
            pointer-events: none;
        }

        /* ===== CONTENEDOR PRINCIPAL ===== */
        .marquinhos {
            position: relative;
            width: 300px;
            transform-style: preserve-3d;
            animation: float 4.5s ease-in-out infinite;
            filter: drop-shadow(0 28px 34px rgba(0, 0, 0, .34));
            user-select: none;
            touch-action: none;
            isolation: isolate;
            transition: all 0.5s ease;
        }

        /* ===== TARJETA ===== */
        .card {
            background: linear-gradient(180deg, rgba(15, 23, 36, .8), rgba(7, 12, 20, .82));
            border: 1px solid rgba(255, 255, 255, .08);
            border-radius: 30px;
            padding: 18px 18px 16px;
            backdrop-filter: blur(10px);
            transform: rotateX(2deg);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05), 0 10px 30px rgba(0, 0, 0, .22);
            position: relative;
            transition: all 0.5s ease;
        }

        /* ===== HEAD ===== */
        .head {
            position: relative;
            width: 184px;
            height: 168px;
            margin: 0 auto;
            border: 4px solid var(--blue);
            border-radius: 50% 50% 42% 42%;
            overflow: hidden;
            background: radial-gradient(circle at 35% 25%, rgba(255, 255, 255, .95) 0 28%, rgba(245, 249, 255, .98) 42%, #edf2ff 72%, #dfe9ff 100%);
            box-shadow: inset 0 16px 18px rgba(255, 255, 255, .75), inset 0 -18px 30px rgba(20, 40, 90, .06), 0 10px 24px rgba(0, 0, 0, .15);
            transform: translateZ(26px);
            transition: all .25s ease;
        }

        .head::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 22px 20px, rgba(26, 35, 126, .9) 0 2px, transparent 2.5px),
                radial-gradient(circle at 46px 42px, rgba(26, 35, 126, .75) 0 2px, transparent 2.5px),
                radial-gradient(circle at 70px 18px, rgba(26, 35, 126, .5) 0 2px, transparent 2.5px),
                radial-gradient(circle at 118px 24px, rgba(26, 35, 126, .45) 0 2px, transparent 2.5px),
                radial-gradient(circle at 146px 48px, rgba(26, 35, 126, .72) 0 2px, transparent 2.5px);
            background-size: 56px 56px;
            opacity: .22;
            mix-blend-mode: multiply;
            pointer-events: none;
        }

        .head::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(145deg, rgba(255, 255, 255, .72), transparent 22%),
                linear-gradient(330deg, transparent 58%, rgba(26, 35, 126, .06) 100%);
            pointer-events: none;
        }

        /* ===== ANTENAS ===== */
        .antenna {
            position: absolute;
            top: -24px;
            width: 6px;
            height: 30px;
            border-radius: 999px;
            background: linear-gradient(180deg, var(--blue2), var(--blue));
            transform-origin: bottom center;
            animation: sway 3.2s ease-in-out infinite alternate;
            box-shadow: 0 0 12px rgba(47, 71, 204, .25);
            transition: all 0.5s ease;
        }
        .antenna::after {
            content: "";
            position: absolute;
            left: 50%;
            top: -8px;
            width: 12px;
            height: 12px;
            transform: translateX(-50%);
            border-radius: 50%;
            background: radial-gradient(circle, #ffe9ab 0%, var(--gold) 55%, var(--gold2) 100%);
            box-shadow: 0 0 16px rgba(215, 179, 92, .7);
            transition: all 0.5s ease;
        }
        .antenna.left {
            left: 58px;
        }
        .antenna.right {
            right: 58px;
            animation-delay: .14s;
        }

        /* ===== CEJAS ===== */
        .brow {
            position: absolute;
            top: 32px;
            width: 34px;
            height: 8px;
            border-top: 4px solid var(--blue);
            border-radius: 50%;
            z-index: 4;
            opacity: .95;
            transition: transform .25s ease, top .25s ease;
        }
        .brow.left {
            left: 30px;
            transform: rotate(-8deg);
        }
        .brow.right {
            right: 30px;
            transform: rotate(8deg);
        }

        /* ===== OJOS ===== */
        .eye {
            position: absolute;
            top: 46px;
            width: 42px;
            height: 50px;
            border-radius: 50%;
            overflow: hidden;
            background: #111;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .1);
            transition: clip-path 0.15s ease;
        }
        .eye.left {
            left: 30px;
        }
        .eye.right {
            right: 30px;
        }

        .eye::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 42%, #fff 0 56%, #eef4ff 66%, #d7e1ff 100%);
            border-radius: 50%;
            transform: scaleY(.74);
            transition: transform .2s ease;
        }

        .eye::after {
            content: "";
            position: absolute;
            left: 8px;
            right: 8px;
            top: -2px;
            height: 0;
            background: var(--white);
            border-bottom: 3px solid var(--blue);
            border-radius: 50%;
            z-index: 3;
            transition: height .2s ease;
        }

        /* ===== IRIS ===== */
        .iris {
            position: absolute;
            z-index: 2;
            width: 18px;
            height: 18px;
            left: 12px;
            top: 14px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #5dd7ff 0 16%, #0d5aa3 38%, #061635 74%, #030814 100%);
            box-shadow: 0 0 8px rgba(0, 229, 255, .2);
            transition: transform .28s ease;
        }
        .iris::before {
            content: "";
            position: absolute;
            width: 7px;
            height: 7px;
            left: 3px;
            top: 3px;
            border-radius: 50%;
            background: #fff;
            opacity: .9;
        }

        /* ===== BOCA ===== */
        .mouth {
            position: absolute;
            left: 50%;
            bottom: 33px;
            width: 42px;
            height: 18px;
            border-bottom: 4px solid var(--blue);
            border-radius: 0 0 50% 50%;
            transform: translateX(-50%);
            transition: all var(--speed) ease;
            box-shadow: 0 0 0 1px rgba(26, 35, 126, .02);
        }

        /* ===== MEJILLAS ===== */
        .cheek {
            position: absolute;
            bottom: 36px;
            width: 22px;
            height: 14px;
            border-radius: 50%;
            background: var(--pink);
            filter: blur(4px);
            opacity: .82;
            transition: opacity .3s ease, transform .3s ease, background .3s ease;
        }
        .cheek.left {
            left: 18px;
        }
        .cheek.right {
            right: 18px;
        }

        .chin {
            position: absolute;
            left: 50%;
            bottom: 12px;
            width: 64px;
            height: 18px;
            transform: translateX(-50%);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(26, 35, 126, .08) 0%, transparent 70%);
            opacity: .9;
        }

        /* ===== CUERPO ===== */
        .body {
            position: relative;
            width: 206px;
            height: 214px;
            margin: -8px auto 0;
            border: 4px solid var(--blue);
            border-radius: 28px 28px 36px 36px;
            overflow: hidden;
            background: radial-gradient(circle at 50% 0%, rgba(255, 255, 255, .96) 0 24%, rgba(246, 249, 255, .98) 45%, #edf3ff 85%, #dce5fb 100%);
            box-shadow: inset 0 14px 18px rgba(255, 255, 255, .7), inset 0 -18px 30px rgba(20, 40, 90, .08), 0 12px 24px rgba(0, 0, 0, .13);
            transform: translateZ(18px);
            animation: breathe var(--idle) ease-in-out infinite;
            transition: all 0.5s ease;
        }

        .body::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent 0 44%, rgba(26, 35, 126, .12) 44% 48%, transparent 48% 100%),
                radial-gradient(circle at 15% 18%, rgba(215, 179, 92, .18) 0 2px, transparent 3px),
                radial-gradient(circle at 82% 22%, rgba(215, 179, 92, .14) 0 2px, transparent 3px),
                radial-gradient(circle at 25% 70%, rgba(26, 35, 126, .08) 0 2px, transparent 3px),
                radial-gradient(circle at 76% 66%, rgba(26, 35, 126, .08) 0 2px, transparent 3px);
            opacity: .28;
            background-size: 62px 62px;
            pointer-events: none;
        }

        /* ===== PECHO ===== */
        .chest {
            position: absolute;
            left: 50%;
            top: 18px;
            width: 110px;
            height: 58px;
            transform: translateX(-50%);
            border: 4px solid var(--gold2);
            border-radius: 18px;
            background: linear-gradient(180deg, rgba(215, 179, 92, .28), rgba(215, 179, 92, .08));
            box-shadow: inset 0 0 14px rgba(215, 179, 92, .16), 0 8px 14px rgba(0, 0, 0, .05);
            display: grid;
            place-items: center;
            transition: all 0.5s ease;
        }

        .chest::before {
            content: "MARQUINHOS";
            font-weight: 900;
            letter-spacing: 1.4px;
            font-size: 11px;
            color: var(--gold);
            text-shadow: 0 0 10px rgba(215, 179, 92, .2);
            font-family: "Orbitron", sans-serif;
            transition: all 0.5s ease;
        }

        /* ===== BRAZOS ===== */
        .arm {
            position: absolute;
            top: 30px;
            width: 26px;
            height: 100px;
            border: 4px solid var(--blue);
            border-radius: 15px;
            background: linear-gradient(180deg, #fff, #edf3ff);
            transform-origin: top center;
            box-shadow: inset 0 0 12px rgba(255, 255, 255, .45);
            transition: transform .35s cubic-bezier(.2, .8, .2, 1);
        }
        .arm.left {
            left: -14px;
            transform: rotate(-12deg);
        }
        .arm.right {
            right: -14px;
            transform: rotate(12deg);
        }

        .forearm {
            position: absolute;
            left: 0;
            top: 76px;
            width: 22px;
            height: 84px;
            border: 3px solid var(--blue);
            border-radius: 12px;
            background: linear-gradient(180deg, #fff, #edf3ff);
            transform-origin: top center;
            box-shadow: inset 0 0 10px rgba(255, 255, 255, .45);
            transition: transform .35s cubic-bezier(.2, .8, .2, 1);
        }

        .hand {
            position: absolute;
            left: -8px;
            top: 72px;
            width: 36px;
            height: 36px;
            border: 3px solid var(--blue);
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #fff 0 26%, #eef4ff 58%, #dce6fb 100%);
            transform-origin: center;
            box-shadow: inset 0 0 10px rgba(255, 255, 255, .4);
            transition: transform .35s cubic-bezier(.2, .8, .2, 1);
        }

        .hand::after {
            content: "";
            position: absolute;
            inset: 8px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(215, 179, 92, .22) 0%, transparent 68%);
            opacity: .7;
        }

        .finger {
            position: absolute;
            top: 2px;
            width: 7px;
            height: 15px;
            border: 1px solid var(--blue);
            border-radius: 4px;
            background: #fff;
            transform-origin: bottom center;
            transition: transform .24s ease;
        }
        .finger:nth-child(1) {
            left: 4px;
        }
        .finger:nth-child(2) {
            left: 13px;
        }
        .finger:nth-child(3) {
            left: 22px;
        }

        /* ===== PIERNAS ===== */
        .leg {
            position: absolute;
            bottom: -6px;
            width: 34px;
            height: 72px;
            border: 4px solid var(--blue);
            border-radius: 14px;
            background: linear-gradient(180deg, #fff, #edf3ff);
            box-shadow: inset 0 0 10px rgba(255, 255, 255, .42);
        }
        .leg.left {
            left: 53px;
        }
        .leg.right {
            right: 53px;
        }

        .foot {
            position: absolute;
            bottom: -16px;
            left: -8px;
            width: 50px;
            height: 22px;
            border: 4px solid var(--blue);
            border-radius: 18px 18px 10px 10px;
            background: linear-gradient(180deg, #fff, #edf3ff);
        }

        /* ===== TEXTO (oculto) ===== */
        .caption {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }

        .name {
            margin-top: 4px;
            text-align: center;
            font-weight: 900;
            font-size: 18px;
            letter-spacing: .8px;
            color: var(--gold);
            text-shadow: 0 0 14px rgba(215, 179, 92, .18);
            font-family: "Orbitron", sans-serif;
            transition: all 0.5s ease;
        }

        /* ===== BURBUJA ===== */
        .bubble {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 14px;
            border-radius: 16px;
            background: rgba(10, 17, 28, .55);
            border: 1px solid rgba(255, 255, 255, .08);
            backdrop-filter: blur(10px);
            color: #dfe7ff;
            font-size: 13px;
            line-height: 1.35;
            width: min(340px, calc(100vw - 40px));
            pointer-events: none;
            transition: all 0.5s ease;
        }

        .bubble strong {
            color: var(--gold);
        }

        /* ===== INDICADOR DE MICRÓFONO ===== */
        .mic-indicator {
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 229, 255, 0.1);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(0, 229, 255, 0.2);
            font-size: 10px;
            color: var(--mic-active);
            transition: all 0.5s ease;
            opacity: 0;
            pointer-events: none;
        }

        .mic-indicator.active {
            opacity: 1;
        }

        .mic-indicator .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--mic-active);
            animation: micPulse 1s ease-in-out infinite;
        }

        @keyframes micPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
        }

        /* ===== INDICADOR DE GÉNERO DETECTADO ===== */
        .gender-indicator {
            position: absolute;
            top: -12px;
            right: -12px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 16px;
            border: 2px solid rgba(255,255,255,0.1);
            transition: all 0.5s ease;
            opacity: 0;
            transform: scale(0.5);
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
        }

        .gender-indicator.visible {
            opacity: 1;
            transform: scale(1);
        }

        .gender-indicator.femenine {
            border-color: var(--feminine);
            box-shadow: 0 0 20px var(--feminine-bg);
            color: var(--feminine);
        }

        .gender-indicator.masculine {
            border-color: var(--masculine);
            box-shadow: 0 0 20px var(--masculine-bg);
            color: var(--masculine);
        }

        /* ===== ESTADOS DE GÉNERO ===== */
        .marquinhos.femenine-mode .chest {
            border-color: var(--feminine);
            box-shadow: 0 0 30px var(--feminine-bg);
        }
        .marquinhos.femenine-mode .chest::before {
            color: var(--feminine);
            text-shadow: 0 0 20px rgba(255, 64, 129, 0.3);
        }
        .marquinhos.femenine-mode .head {
            border-color: var(--feminine);
        }
        .marquinhos.femenine-mode .body {
            border-color: var(--feminine);
        }
        .marquinhos.femenine-mode .arm {
            border-color: var(--feminine);
        }
        .marquinhos.femenine-mode .leg {
            border-color: var(--feminine);
        }
        .marquinhos.femenine-mode .foot {
            border-color: var(--feminine);
        }
        .marquinhos.femenine-mode .hand {
            border-color: var(--feminine);
        }
        .marquinhos.femenine-mode .forearm {
            border-color: var(--feminine);
        }
        .marquinhos.femenine-mode .mouth {
            border-color: var(--feminine);
        }
        .marquinhos.femenine-mode .finger {
            border-color: var(--feminine);
        }

        .marquinhos.masculine-mode .chest {
            border-color: var(--masculine);
            box-shadow: 0 0 30px var(--masculine-bg);
        }
        .marquinhos.masculine-mode .chest::before {
            color: var(--masculine);
            text-shadow: 0 0 20px rgba(68, 138, 255, 0.3);
        }
        .marquinhos.masculine-mode .head {
            border-color: var(--masculine);
        }
        .marquinhos.masculine-mode .body {
            border-color: var(--masculine);
        }
        .marquinhos.masculine-mode .arm {
            border-color: var(--masculine);
        }
        .marquinhos.masculine-mode .leg {
            border-color: var(--masculine);
        }
        .marquinhos.masculine-mode .foot {
            border-color: var(--masculine);
        }
        .marquinhos.masculine-mode .hand {
            border-color: var(--masculine);
        }
        .marquinhos.masculine-mode .forearm {
            border-color: var(--masculine);
        }
        .marquinhos.masculine-mode .mouth {
            border-color: var(--masculine);
        }
        .marquinhos.masculine-mode .finger {
            border-color: var(--masculine);
        }

        /* Modo llamada */
        .marquinhos.on-call .antenna {
            animation: callPulse 1.2s ease-in-out infinite alternate;
        }
        .marquinhos.on-call .antenna::after {
            animation: callGlow 1.2s ease-in-out infinite alternate;
        }
        .marquinhos.on-call .chest {
            border-color: var(--call-pause);
            box-shadow: 0 0 30px var(--call-pause-bg);
            animation: callChestPulse 1.2s ease-in-out infinite alternate;
        }
        .marquinhos.on-call .chest::before {
            content: "📞 EN LLAMADA";
            color: var(--call-pause);
            text-shadow: 0 0 20px rgba(255, 107, 53, 0.4);
        }

        /* Modo Bluetooth */
        .marquinhos.bluetooth-connected .chest::before {
            content: "🔊 BLUETOOTH";
            color: var(--bluetooth);
            text-shadow: 0 0 20px rgba(41, 121, 255, 0.4);
        }
        .marquinhos.bluetooth-connected .chest {
            border-color: var(--bluetooth);
            box-shadow: 0 0 30px var(--bluetooth-bg);
        }

        /* ===== ESTADOS / EMOCIONES ===== */
        .marquinhos.happy .mouth {
            width: 48px;
            height: 22px;
            border-bottom-width: 5px;
        }
        .marquinhos.loving .mouth {
            width: 46px;
            height: 20px;
            border-bottom-width: 5px;
        }
        .marquinhos.sad .mouth {
            border-bottom: 0;
            border-top: 4px solid var(--blue);
            border-radius: 50% 50% 0 0;
            bottom: 31px;
        }
        .marquinhos.surprised .mouth {
            width: 24px;
            height: 26px;
            border: 4px solid var(--blue);
            border-radius: 50%;
        }
        .marquinhos.talking .mouth {
            animation: talk .18s ease-in-out infinite alternate;
        }
        .marquinhos.talking .body {
            animation: breathe var(--idle) ease-in-out infinite, talkBody .65s ease-in-out infinite alternate;
        }
        .marquinhos.waving .arm.right {
            animation: waveR .45s ease-in-out infinite alternate;
        }
        .marquinhos.waving .arm.left {

        // ================================================================
        // 1. MÓDULO DE INTELIGENCIA COGNITIVA (INYECTADO)

        (function cognitiveModule() {
            'use strict';

            const STORAGE_KEY = 'marquinhos_cognitive_state_v6';

            let cognitiveState = {
                irritability: 0,
                affection: 60,
                boredom: 0,
                lastInteraction: Date.now(),
                history: JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'),

                callHistory: [],
                bluetoothDevices: [],
                bluetoothConnected: false,
                audioOutputDevices: [],
                // ===== NUEVO: Detección de género =====
                detectedGender: 'neutral', // 'feminine', 'masculine', 'neutral'
                genderConfidence: 0,
                lastGenderDetection: 0,
                genderHistory: []
            };

            function saveMemory() {
                if (cognitiveState.history.length > 20) cognitiveState.history.shift();
                localStorage.setItem(STORAGE_KEY, JSON.stringify(cognitiveState.history));
            }

            // ===== DETECTOR DE GÉNERO POR VOZ =====
            function detectGender(text) {
                const now = Date.now();

                // Patrones lingüísticos asociados a género (no estereotipos, solo patrones de lenguaje)
                const femininePatterns = [
                    // Palabras y frases comúnmente usadas por mujeres en español (basado en estudios lingüísticos)
                    /\b(hermosa|bonita|guapa|linda|preciosa|divina)\b/i,
                    /\b(amiga|hermana|compañera|colega)\b/i,
                    /\b(me encanta|adoro|me fascina|me apasiona)\b/i,
                    /\b(la verdad|sinceramente|honestamente)\b/i,
                    /\b(gracias|muchas gracias|mil gracias)\b/i,
                    /\b(por favor|porfa|porfi)\b/i,
                    /\b(genial|maravilloso|espectacular|increíble)\b/i,
                    /\b(perfecto|excelente|magnífico)\b/i,
                    /\b(quiero|necesito|me gustaría)\b/i,
                    /\b(entiendo|comprendo|entiendes|comprendes)\b/i,
                    // Emojis y expresiones comunes
                    /[🌸🌺🌹💐🌷🌻🌼]/,
                    /[💕💖💗💝💞]/
                ];

                const masculinePatterns = [
                    // Patrones comúnmente usados por hombres
                    /\b(guapo|apuesto|galán|chido|padre|buena onda)\b/i,
                    /\b(amigo|hermano|compa|colega|carnal)\b/i,
                    /\b(va que va|simón|órale|dale|arre)\b/i,
                    /\b(no manches|no mames|wey|güey|bro)\b/i,
                    /\b(qué onda|qué tranza|qué show)\b/i,
                    /\b(está bien|sale|de acuerdo|va)\b/i,
                    /\b(muy bien|excelente|perfecto|chido)\b/i,
                    /\b(quiero|necesito|voy a|vamos a)\b/i,
                    /\b(entiendo|comprendo|ya capto|ya caigo)\b/i,
                    // Emojis comunes
                    /[💪🏋️⚽🏀🏈🎮]/
                ];

                // Palabras neutrales (para reducir falsos positivos)
                const neutralWords = [
                    /\b(hola|buenas|adiós|chao|bye)\b/i,
                    /\b(si|no|quizás|tal vez)\b/i,
                    /\b(y|o|pero|porque|cuando|donde|como)\b/i
                ];

                const textLower = text.toLowerCase();

                // Si es niño, priorizar modo infantil sobre género
                if (cognitiveState.isChild) {
                    return 'neutral';
                }

                // Calcular puntuación femenina
                let feminineScore = 0;
                for (const pattern of femininePatterns) {
                    const matches = (textLower.match(new RegExp(pattern.source, 'gi')) || []).length;
                    if (matches > 0) {
                        feminineScore += matches * 0.12;
                    }
                }

                // Calcular puntuación masculina
                let masculineScore = 0;
                for (const pattern of masculinePatterns) {
                    const matches = (textLower.match(new RegExp(pattern.source, 'gi')) || []).length;
                    if (matches > 0) {
                        masculineScore += matches * 0.12;
                    }
                }

                // Penalizar textos muy cortos (menos de 5 palabras)
                const wordCount = text.split(/\s+/).length;
                if (wordCount < 5) {
                    feminineScore *= 0.6;
                    masculineScore *= 0.6;
                }

                // Si hay muchas palabras neutrales, reducir confianza
                let neutralCount = 0;
                for (const pattern of neutralWords) {
                    const matches = (textLower.match(new RegExp(pattern.source, 'gi')) || []).length;
                    if (matches > 0) {
                        neutralCount += matches;
                    }
                }
                if (neutralCount > wordCount * 0.5) {
                    feminineScore *= 0.7;
                    masculineScore *= 0.7;
                }

                // Umbral para decidir
                const threshold = 0.35;
                let detected = 'neutral';
                let confidence = 0;

                if (feminineScore > threshold && feminineScore > masculineScore) {
                    detected = 'feminine';
                    confidence = Math.min(1, feminineScore);
                } else if (masculineScore > threshold && masculineScore > feminineScore) {
                    detected = 'masculine';
                    confidence = Math.min(1, masculineScore);
                }

                // Suavizar detección con historial
                cognitiveState.genderHistory.push({ detected, confidence, timestamp: now });
                if (cognitiveState.genderHistory.length > 10) cognitiveState.genderHistory.shift();

                // Obtener detección más frecuente en historial reciente
                const recentHistory = cognitiveState.genderHistory.slice(-5);
                const genderCounts = { feminine: 0, masculine: 0, neutral: 0 };
                for (const entry of recentHistory) {
                    if (entry.confidence > 0.3) {
                        genderCounts[entry.detected] = (genderCounts[entry.detected] || 0) + 1;
                    }
                }

                let finalGender = 'neutral';
                let maxCount = 0;
                for (const [gender, count] of Object.entries(genderCounts)) {
                    if (count > maxCount) {
                        maxCount = count;
                        finalGender = gender;
                    }
                }

                // Si hay consistencia, usar el género detectado
                if (maxCount >= 3) {
                    detected = finalGender;
                    confidence = Math.min(1, confidence + 0.2);
                }

                // Actualizar estado
                const wasGender = cognitiveState.detectedGender;
                cognitiveState.detectedGender = detected;
                cognitiveState.genderConfidence = confidence;
                cognitiveState.lastGenderDetection = now;

                if (wasGender !== detected && detected !== 'neutral') {
                    console.log(`👤 Género detectado: ${detected.toUpperCase()} (confianza: ${confidence.toFixed(2)})`);
                    // Actualizar UI
                    updateGenderUI(detected);
                }

                return detected;
            }

            const masculinePhrases = {

            function getPhraseByGender(category, gender = 'neutral', isChild = false) {
                if (isChild) {
                    return getChildSafePhrase(category);
                }

                let phraseSet;
                if (gender === 'feminine') {
                    phraseSet = femininePhrases;
                } else if (gender === 'masculine') {
                    phraseSet = masculinePhrases;
                } else {
                    phraseSet = neutralPhrases;

                const list = phraseSet[category] || phraseSet.casual || phraseSet.greeting;

            // ===== DETECTOR DE VOZ INFANTIL =====
            function detectChildVoice(text) {
                const now = Date.now();

                const childPatterns = [
                    /\b(mami|papi|abuelo|abuela|tío|tía|hermano|hermana)\b/i,
                    /\b(cole|escuela|maestro|maestra|profesor|clase|amigo|amiga)\b/i,
                    /\b(jugar|juego|juguete|diversión|risa|pelota|carro|muñeca)\b/i,
                    /\b(me gusta|no me gusta|quiero|tengo miedo|estoy feliz|estoy triste)\b/i,
                    /\b(por qué|porqué|cómo|cual|quien|cuando|donde)\b/i,
                    /\b(ay|oh|wow|guao|epa|uy|ah)\b/i,
                    /\b(¿?.*\?)\b/,
                    /\b(ta|pa|ma|na|da)\b/,
                    /[😊😄😁😅😂🤣😍🥰😘😗😙😚]/,
                    /\b(mucho|muchísimo|super|re|requete)\b/i,
                    /\b(animal|perro|gato|pájaro|pez|conejo|tortuga)\b/i,
                    /\b(princesa|príncipe|rey|reina|castillo|dragón|hada)\b/i,
                    /\b(robot|avión|nave|espacio|astronauta)\b/i,
                    /\b(años|edad|chico|chica|niño|niña|pequeño|pequeña)\b/i
                ];

                const offensivePatterns = [
                    /\b(pendejo|pendeja|wey|güey|chinga|chingar|mamón|mamona|verga|puto|puta|culero|culera|pito|v*rga)\b/i
                ];

                const textLower = text.toLowerCase();

                const hasOffensive = offensivePatterns.some(p => p.test(textLower));
                if (hasOffensive) {
                    cognitiveState.isChild = false;
                    cognitiveState.childConfidence = Math.max(0, cognitiveState.childConfidence - 0.3);
                    return false;
                }

                let childScore = 0;
                for (const pattern of childPatterns) {
                    const matches = (textLower.match(new RegExp(pattern.source, 'gi')) || []).length;
                    if (matches > 0) {
                        childScore += matches * 0.15;
                    }
                }

                const wordCount = text.split(/\s+/).length;
                if (wordCount < 3) {
                    childScore *= 0.5;
                }

                const questionCount = (text.match(/\?/g) || []).length;
                if (questionCount >= 2) {
                    childScore += 0.2;
                }

                const emotionCount = (text.match(/[😊😄😁😅😂🤣😍🥰😘😗😙😚❤️💕💖]/g) || []).length;
                if (emotionCount > 0) {
                    childScore += 0.15 * emotionCount;
                }

                const threshold = 0.4;
                const isChild = childScore > threshold;

                if (isChild) {
                    cognitiveState.childConfidence = Math.min(1, cognitiveState.childConfidence + 0.15);
                } else {
                    cognitiveState.childConfidence = Math.max(0, cognitiveState.childConfidence - 0.1);
                }

                const wasChild = cognitiveState.isChild;
                cognitiveState.isChild = cognitiveState.childConfidence > 0.3;

                if (wasChild !== cognitiveState.isChild) {
                    console.log(`🧒 Modo infantil ${cognitiveState.isChild ? 'ACTIVADO' : 'DESACTIVADO'} (confianza: ${cognitiveState.childConfidence.toFixed(2)})`);
                }

                cognitiveState.lastChildDetection = now;
                return cognitiveState.isChild;
            }

            // ===== GESTIÓN DE LLAMADAS =====
            function handleCallStart() {
                if (cognitiveState.isOnCall) return;

                cognitiveState.isOnCall = true;
                cognitiveState.callStartTime = Date.now();
                cognitiveState.pendingConversation = false;

                if (window.Marquinhos && typeof window.Marquinhos.setEmotion === 'function') {
                    window.Marquinhos.setEmotion('thinking', '📞 En llamada... regreso en un momento.', 0);
                }

                const marquinhosEl = document.getElementById('marquinhos');
                if (marquinhosEl) {
                    marquinhosEl.classList.add('on-call');

                const bubble = document.getElementById('cognitive-speech-bubble');
                if (bubble) {
                    bubble.classList.add('on-call');
                    bubble.textContent = '📞 En llamada... regreso en un momento.';
                    bubble.classList.add('visible');
                }

                cognitiveState.callHistory.push({
                    type: 'start',
                    timestamp: cognitiveState.callStartTime
                });
                if (cognitiveState.callHistory.length > 10) cognitiveState.callHistory.shift();

                console.log('📞 Marquinhos en pausa por llamada.');
            }

            function handleCallEnd() {

                if (cognitiveState.callHistory.length > 10) cognitiveState.callHistory.shift();

                console.log(`📞 Llamada finalizada (${callDuration.toFixed(1)}s). Retomando conversación...`);

                setTimeout(() => {

            // ===== BLUETOOTH / AUDIO DEVICES =====
            function detectAudioDevices() {
                if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) {
                    console.log('🔊 API de dispositivos no disponible');
                    return;
                }

                navigator.mediaDevices.enumerateDevices()
                    .then(devices => {
                        const audioOutputs = devices.filter(d => d.kind === 'audiooutput');

                        cognitiveState.audioOutputDevices = audioOutputs.map(d => ({
                            id: d.deviceId,
                            label: d.label || 'Dispositivo de audio',
                            kind: d.kind
                        }));

                        const bluetoothDevices = audioOutputs.filter(d =>
                            d.label &&
                            (d.label.toLowerCase().includes('bluetooth') ||
                             d.label.toLowerCase().includes('bt') ||
                             d.label.toLowerCase().includes('headset') ||
                             d.label.toLowerCase().includes('earbuds') ||
                             d.label.toLowerCase().includes('speaker') ||
                             d.label.toLowerCase().includes('bocina'))
                        );

                        if (bluetoothDevices.length > 0) {
                            cognitiveState.bluetoothDevices = bluetoothDevices.map(d => ({
                                id: d.deviceId,
                                label: d.label,
                                kind: d.kind
                            }));
                            cognitiveState.bluetoothConnected = true;

                            const marquinhosEl = document.getElementById('marquinhos');
                            if (marquinhosEl) {
                                marquinhosEl.classList.add('bluetooth-connected');
                            }

                            const bubble = document.getElementById('bubble');
                            if (bubble) {
                                const deviceNames = bluetoothDevices.map(d => d.label).join(', ');
                                bubble.innerHTML =
                                    `<strong>🔊 Bluetooth</strong> · Conectado a: ${deviceNames}`;
                            }

                            console.log('🔊 Dispositivos Bluetooth detectados:', bluetoothDevices.map(d => d.label));
                        }
                    })
                    .catch(err => {
                        console.warn('⚠️ No se pudieron enumerar dispositivos:', err);
                    });
            }

            if (navigator.mediaDevices) {
                setTimeout(detectAudioDevices, 1000);
                if (navigator.mediaDevices.addEventListener) {
                    navigator.mediaDevices.addEventListener('devicechange', () => {
                        console.log('🔄 Cambio en dispositivos de audio detectado');
                        setTimeout(detectAudioDevices, 500);
                    });
                }
            }

            // ===== ANÁLISIS DE INPUT =====
            function analyzeInput(text) {
                const now = Date.now();
                cognitiveState.lastInteraction = now;

                if (cognitiveState.isOnCall) {
                    return { recentSimilar: false, profile: cognitiveState.userProfile, isChild: false, onCall: true };
                }

                // Detectar niño primero
                const isChild = detectChildVoice(text);

                // Detectar género (solo si no es niño)
                let detectedGender = 'neutral';
                if (!isChild) {
                    detectedGender = detectGender(text);
                }

                // Actualizar estado de género
                if (detectedGender !== 'neutral') {
                    cognitiveState.detectedGender = detectedGender;
                }

                const recentSimilar = cognitiveState.history.find(h =>
                    h.text.toLowerCase() === text.toLowerCase() &&
                    (now - h.timestamp) < 900000
                );

                if (!isChild) {
                    const isYoungSlang = /wey|bro|nmms|chido|arre|qué tranza|simón|neta|va que va/i.test(text);
                    const isBusiness = /deploy|api|métricas|cliente|proyecto|corporativo|presupuesto|ejecutivo|estrategia/i
                        .test(text);
                    const isKind = /por favor|gracias|buen día|estimado|disculpa|permiso/i.test(text);

                    if (isYoungSlang) cognitiveState.userProfile = 'joven';
                    else if (isBusiness) cognitiveState.userProfile = 'negocios';
                    else if (isKind) cognitiveState.userProfile = 'general';
                } else {
                    cognitiveState.userProfile = 'infantil';
                }

                const isAggressive = /estúpido|inútil|cállate|maldito|pendejo|wey|güey|chinga|verga|puto|culero/i.test(text);
                if (isAggressive) {
                    cognitiveState.irritability = Math.min(100, cognitiveState.irritability + 10);
                    if (isChild) {
                        return { recentSimilar, profile: 'infantil', isChild: true, gentleReminder: true, onCall: false };
                    }
                } else {
                    cognitiveState.irritability = Math.max(0, cognitiveState.irritability - 10);
                }

                cognitiveState.boredom = 0;

                cognitiveState.history.push({
                    text,
                    timestamp: now,
                    profile: cognitiveState.userProfile,
                    isChild,
                    gender: detectedGender
                });
                saveMemory();

                return {
                    recentSimilar,
                    profile: cognitiveState.userProfile,
                    isChild,
                    gender: detectedGender,
                    gentleReminder: false,
                    onCall: false
                };
            }

            // ===== LOOP COGNITIVO =====
            let cognitiveLoopRunning = false;

            function cognitiveLoop() {
                if (!cognitiveLoopRunning) return;

                const idleTime = (Date.now() - cognitiveState.lastInteraction) / 1000;

                if (!cognitiveState.isOnCall && idleTime > 120 && cognitiveState.boredom === 0 && !cognitiveState.isChild) {
                    cognitiveState.boredom = 1;
                    triggerVisualReaction('bored');
                    setTimeout(() => {
                        cognitiveState.boredom = 0;
                    }, 30000);
                }

                requestAnimationFrame(cognitiveLoop);
            }

            // ===== ACCIONES VISUALES =====
            function triggerVisualReaction(type, customMessage = null) {
                const targetElement = document.getElementById('marquinhos') || document.body;

                let speechBubble = document.getElementById('cognitive-speech-bubble');
                if (!speechBubble) {
                    speechBubble = document.createElement('div');
                    speechBubble.id = 'cognitive-speech-bubble';
                    targetElement.style.position = targetElement.style.position || 'relative';
                    targetElement.appendChild(speechBubble);
                }

                let message;
                if (customMessage) {
                    message = customMessage;
                } else {
                    const gender = cognitiveState.detectedGender;
                    const isChild = cognitiveState.isChild;
                    message = getPhraseByGender(type, gender, isChild);
                }

                speechBubble.textContent = message;

                // Aplicar clases según modo
                speechBubble.classList.remove('child-safe', 'on-call', 'femenine-mode', 'masculine-mode');

                if (cognitiveState.isChild) {
                    speechBubble.classList.add('child-safe');
                    const marquinhosEl = document.getElementById('marquinhos');
                    if (marquinhosEl) marquinhosEl.classList.add('child-mode');
                } else if (cognitiveState.isOnCall) {
                    speechBubble.classList.add('on-call');
                } else if (cognitiveState.detectedGender === 'feminine') {
                    speechBubble.classList.add('femenine-mode');
                } else if (cognitiveState.detectedGender === 'masculine') {
                    speechBubble.classList.add('masculine-mode');
                } else {
                    const marquinhosEl = document.getElementById('marquinhos');
                    if (marquinhosEl) marquinhosEl.classList.remove('child-mode');
                }

                speechBubble.classList.add('visible');

                if (window.Marquinhos && typeof window.Marquinhos.speak === 'function' && !cognitiveState.isOnCall) {
                    window.Marquinhos.speak(message);
                }

                const duration = cognitiveState.isChild ? 6000 : 5000;
                setTimeout(() => {
                    speechBubble.classList.remove('visible');
                }, duration);
            }

                            console.warn(msg);
                            triggerVisualReaction('permission', msg);
                            resolve(false);
                            return;

                        const gender = cognitiveState.detectedGender;
                        const isChild = cognitiveState.isChild;

                        let permissionMsg;
                        if (isChild) {
                            permissionMsg = childSafePhrases.permission[Math.floor(Math.random() * childSafePhrases
                                .permission.length)];
                        } else if (gender === 'feminine') {
                            permissionMsg = "Para poder escucharte, hermosa, necesito permiso del micrófono. ¿Me lo concedes?";
                        } else if (gender === 'masculine') {
                            permissionMsg = "Para poder escucharte, carnal, necesito permiso del micrófono. ¿Me lo concedes?";
                        } else {
                            permissionMsg = "Para poder escucharte, necesito permiso del micrófono. ¿Me lo concedes?";
                        }

                        triggerVisualReaction('permission', permissionMsg);

                        navigator.mediaDevices.getUserMedia({ audio: true })
                            .then((stream) => {
                                cognitiveState._micStream = stream;
                                cognitiveState._micActive = true;

                                const micIndicator = document.getElementById('micIndicator');

                                triggerVisualReaction('permission', msg);
                                resolve(false);
                            });

            function speakWithBrowser(text, options = {}) {
                if (!('speechSynthesis' in window)) {

                if (window.MarquinhosCognitiveAI && window.MarquinhosCognitiveAI.isOnCall()) {

                let safeText = String(text || '');

                    for (const word of offensiveWords) {

                    }
                    safeText = safeText.replace(/[^a-zA-ZáéíóúüñÁÉÍÓÚÜÑ\s.,;:!?¿¡]/g, '');

                    state.speaking = true;
                    setEmotion(emotion, label, 0);

                let fallbackMsg;
                if (isChild) {
                    fallbackMsg = "Cuéntame más, me interesa mucho lo que dices.";
                } else if (gender === 'feminine') {
                    fallbackMsg = "Cuéntame más, hermosa. Me interesa mucho lo que dices.";
                } else if (gender === 'masculine') {
                    fallbackMsg = "Cuéntame más, carnal. Me interesa lo que dices.";
                } else {
                    fallbackMsg = "Cuéntame más.";
                }
                setEmotion('talking', fallbackMsg, 2600);
                speakWithBrowser(fallbackMsg);
            }

            function talk(text) {
                let safeText = String(text || '');
                if (window.MarquinhosCognitiveAI && window.MarquinhosCognitiveAI.isChildDetected()) {
                    const offensiveWords = ['pendejo', 'wey', 'güey', 'chinga', 'verga', 'puto', 'culero', 'mamón', 'chingar'];
                    for (const word of offensiveWords) {
                        const regex = new RegExp(word, 'gi');
                        safeText = safeText.replace(regex, 'amigo');
                    }
                    safeText = safeText.replace(/[^a-zA-ZáéíóúüñÁÉÍÓÚÜÑ\s.,;:!?¿¡]/g, '');
                }
                if (!safeText) safeText = "Dime algo, por favor.";
                setEmotion('talking', safeText, Math.max(2200, safeText.length * 55));
                speakWithBrowser(safeText);
            }

            // ============================
            // 6. LOOP DE ANIMACIÓN
            // ============================
            function analyseAudio() {
                if (!state.analyser || !state.audioData) {
                    if (!state.speaking) state.audioLevel *= 0.88;
                    return;
                }
                state.analyser.getByteTimeDomainData(state.audioData);
                let sum = 0;
                for (let i = 0; i < state.audioData.length; i += 1) {
                    const normalized = (state.audioData[i] - 128) / 128;
                    sum += normalized * normalized;
                }
                const rms = Math.sqrt(sum / state.audioData.length);
                const level = clamp(rms * 5.2, 0, 1);
                state.audioLevel += (level - state.audioLevel) * 0.28;
                state.speaking = level > 0.025;
            }

            function blink(now) {
                if (now >= state.nextBlink && now > state.blinkUntil) {
                    state.blinkUntil = now + 135;
                    state.nextBlink = now + 3200 + Math.random() * 5000;
                }
                const blinking = now < state.blinkUntil;
                eyes.forEach((eye, index) => {
                    if (blinking) {
                        eye.style.clipPath = 'inset(46% 0 46% 0 round 50%)';
                        if (index === 1) eye.style.transform = 'scaleY(.94)';
                    } else {
                        eye.style.clipPath = 'none';
                        eye.style.transform = 'scaleY(1)';
                    }
                });
            }

            function performIdleAction(now) {
                if (now < state.nextIdleAction) return;
                const actions = ['lookLeft', 'lookRight', 'nod', 'listen', 'antenna'];
                state.idleAction = actions[Math.floor(Math.random() * actions.length)];
                state.idleActionUntil = now + random(900, 1800);
                state.nextIdleAction = now + random(3600, 7200);

                if (state.idleAction === 'lookLeft') setLook(-0.75, -0.04);
                if (state.idleAction === 'lookRight') setLook(0.75, -0.04);
                if (state.idleAction === 'nod') {
                    state.targetTiltX = random(-3, 3);
                    state.targetTiltY = random(-5, 5);
                }
                if (state.idleAction === 'listen') {
                    state.targetTiltY = random(-8, 8);
                    state.targetTiltX = random(2, 5);
                }
            }

            function finishIdleAction(now) {
                if (state.idleAction && now > state.idleActionUntil) {
                    state.idleAction = '';
                    setLook(0, 0);
                    state.targetTiltX = 0;
                    state.targetTiltY = 0;
                }
            }

            function updateLookAndPosture(delta) {
                const emotion = state.emotion;
                let lookX = state.targetLookX;
                let lookY = state.targetLookY;
                let tiltX = state.targetTiltX;
                let tiltY = state.targetTiltY;

                if (emotion === 'thinking') {
                    lookX = 0.35;
                    lookY = -0.45;
                    tiltY += 5;
                }
                if (emotion === 'curious') {
                    lookX += 0.18;
                    tiltY += 3;
                }
                if (emotion === 'surprised') {
                    lookY = -0.2;
                    tiltX -= 3;
                }
                if (emotion === 'tired') {
                    lookY += 0.12;
                    tiltX += 2;
                }
                if (emotion === 'talking') {
                    tiltY += Math.sin(performance.now() / 870) * 2.2;
                    tiltX += Math.sin(performance.now() / 1130) * 1.2;
                }

                state.lookX += (lookX - state.lookX) * delta * 7;
                state.lookY += (lookY - state.lookY) * delta * 7;
                state.tiltX += (tiltX - state.tiltX) * delta * 5;
                state.tiltY += (tiltY - state.tiltY) * delta * 5;

                const card = document.querySelector('.marquinhos .card');
                if (card) {
                    card.style.transform =
                        `rotateX(${2 + state.tiltX * 0.3}deg) rotateY(${state.tiltY * 0.3}deg)`;
                }

                irises.forEach((iris) => {
                    iris.style.transform =
                        `translate(${state.lookX * 7}px, ${state.lookY * 4}px)`;
                });
            }

            function updateActing(now) {
                const level = state.audioLevel;
                const talking = state.speaking || level > 0.03;

                if (talking) {
                    const width = 38 + level * 18;
                    const height = 8 + level * 17;
                    mouth.style.width = `${width}px`;
                    mouth.style.height = `${height}px`;
                    antennas.forEach((antenna, index) => {
                        const rotation = Math.sin(now / 180 + index) * (5 + level * 12);
                        antenna.style.transform = `rotate(${rotation}deg)`;
                    });
                } else {
                    mouth.style.width = '';
                    mouth.style.height = '';
                    antennas.forEach((antenna, index) => {
                        const rotation = Math.sin(now / 850 + index) * 7;
                        antenna.style.transform = `rotate(${rotation}deg)`;
                    });
                }
            }

            function animationLoop(now) {
                const delta = Math.min((now - state.lastFrame) / 1000, 0.05);
                state.lastFrame = now;

                analyseAudio();
                blink(now);
                performIdleAction(now);
                finishIdleAction(now);
                updateLookAndPosture(delta);
                updateActing(now);

                requestAnimationFrame(animationLoop);
            }

            // ============================
            // 7. EXPONER API GLOBAL
            // ============================
            window.Marquinhos = {
                react,
                talk,
                setEmotion,
                setLook,
                setCaption,
                setAudioLevel,
                speak: speakWithBrowser,
                reset: resetState,
                startListening: () => {
                    if (!state.recognition) {
                        initSpeechRecognition();
                    }
                    state.isListening = true;
                    if (micIndicator) micIndicator.classList.add('active');
                    if (micStatus) micStatus.textContent = '🎤 Escuchando...';
                    try {
                        state.recognition.start();
                    } catch (e) {}
                },
                stopListening: () => {
                    state.isListening = false;
                    if (micIndicator) micIndicator.classList.remove('active');
                    if (micStatus) micStatus.textContent = '⏸️ En espera';
                    try {
                        state.recognition.stop();
                    } catch (e) {}
                },
                isListening: () => state.isListening,
                _audioPaused: false
            };

            // ============================
            // 8. INICIALIZACIÓN
            // ============================
            setTimeout(() => {
                initSpeechRecognition();
            }, 2000);

            requestAnimationFrame(animationLoop);

            console.log('🚀 Marquinhos · Asistente de voz con detección de género.');
            console.log('🎤 Di "Hola Marquinhos" para activarlo.');
            console.log('👤 Detecta automáticamente si eres femenino o masculino.');
            console.log('👶 También detecta si eres niño para modo seguro.');
            console.log('📦 API expuesta: window.Marquinhos');
            console.log('🧠 Módulo cognitivo: window.MarquinhosCognitiveAI');

            document.addEventListener('click', () => {
                if (!window.MarquinhosCognitiveAI.isMicActive()) {
                    window.MarquinhosCognitiveAI.requestMicPermission();
                }
            }, { once: true });

        })();
    </script>
