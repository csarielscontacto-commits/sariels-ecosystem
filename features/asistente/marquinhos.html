<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1565C0" />
    <title>Marquinhos · Talavera Cerámica</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet" />

    <style>
        /* ===== VARIABLES Y RESET ===== */
        :root {
            --bg: #0A0A1A;
            --bg2: #1A0A2E;
            --card: rgba(20, 10, 40, .85);
            --blue: #6C3CE0;
            --blue2: #8B5CF6;
            --white: #FFF8F0;
            --gold: #FFD700;
            --gold2: #FFC107;
            --pink: #FF6B8A;
            --shadow: rgba(0, 0, 0, .45);
            --glow: rgba(255, 215, 0, .35);
            --speed: .28s;
            --idle: 4s;
            --talavera-white: #F5F5F5;
            --talavera-dark: #0D47A1;
            --talavera-blue: #1565C0;
            --talavera-light: #42A5F5;
            --deep-blue: #0A1E3F;
            --talavera-gold: #FFD700;
            --soft-gold: #FFC107;
            --talavera-green: #00897B;
            --terracotta: #E65100;
            --cream: #FFF8E1;
            --ceramic: #FFFFFF;
            --child-safe: #4CAF50;
            --child-safe-bg: rgba(76, 175, 80, 0.15);
            --call-pause: #FF6B35;
            --call-pause-bg: rgba(255, 107, 53, 0.15);
            --mic-active: #00E5FF;
            --mic-active-bg: rgba(0, 229, 255, 0.15);
            --bluetooth: #2979FF;
            --bluetooth-bg: rgba(41, 121, 255, 0.15);
            /* Color activo (controlado por el usuario) - por defecto Talavera Blue */
            --color-activo: #1565C0;
            --color-activo-rgb: 21, 101, 192;
            /* Disney Colors (mantenemos compatibilidad) */
            --disney-yellow: #FFD700;
            --disney-red: #FF3B30;
            --disney-blue: #007AFF;
            --disney-pink: #FF2D55;
            --disney-orange: #FF9500;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
            font-family: "Quicksand", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        }

        /* ===== ESCENA: contenedor flotante pequeño ===== */
        .scene {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 130px;
            height: 160px;
            display: block;
            background: transparent;
            pointer-events: none;
            z-index: 9998;
            perspective: 800px;
            perspective-origin: 50% 50%;
        }

        /* .ambient y .shadow eliminados completamente */

        /* ===== CONTENEDOR PRINCIPAL ===== */
        .marquinhos {
            position: relative;
            width: 130px;
            transform-style: preserve-3d;
            animation: float 4.5s ease-in-out infinite;
            filter: drop-shadow(0 8px 18px rgba(13, 71, 161, 0.25));
            user-select: none;
            touch-action: none;
            isolation: isolate;
            transition: all 0.5s ease;
            pointer-events: auto;
            margin: 0 auto;
        }

        /* ===== TARJETA: sin fondo, sin borde, sin blur ===== */
        .card {
            background: transparent;
            border: none;
            padding: 0;
            backdrop-filter: none;
            box-shadow: none;
            position: relative;
            transition: all 0.5s ease;
            transform: none !important;
            width: 100%;
        }

        /* ===== HEAD: Talavera Cerámica ===== */
        .head {
            position: relative;
            width: 110px;
            height: 105px;
            margin: 0 auto 0;
            border: 4px solid var(--color-activo);
            border-radius: 50% 50% 45% 45%;
            overflow: visible;
            background: radial-gradient(circle at 35% 25%, var(--ceramic) 0%, var(--cream) 60%, #f5efe0 85%, #e8e0d0 100%);
            box-shadow: inset 0 4px 12px rgba(255, 255, 255, 0.6), inset 0 -4px 12px rgba(13, 71, 161, 0.08), 0 4px 12px rgba(0, 0, 0, 0.10);
            transform: translateZ(10px);
            transition: border-color .3s ease, box-shadow .3s ease;
        }

        /* Patrón floral Talavera en la cabeza */
        .head::before {
            content: "";
            position: absolute;
            inset: 6px;
            border-radius: 50%;
            background-image:
                radial-gradient(circle at 20% 30%, var(--talavera-blue) 2px, transparent 2px),
                radial-gradient(circle at 80% 25%, var(--talavera-blue) 2px, transparent 2px),
                radial-gradient(circle at 50% 15%, var(--talavera-blue) 2.5px, transparent 2.5px),
                radial-gradient(circle at 70% 70%, var(--talavera-blue) 1.8px, transparent 1.8px),
                radial-gradient(circle at 30% 75%, var(--talavera-blue) 1.8px, transparent 1.8px),
                radial-gradient(circle at 50% 55%, var(--talavera-blue) 2px, transparent 2px),
                radial-gradient(circle at 15% 55%, var(--talavera-light) 1.5px, transparent 1.5px),
                radial-gradient(circle at 85% 55%, var(--talavera-light) 1.5px, transparent 1.5px),
                radial-gradient(circle at 45% 85%, var(--talavera-blue) 1.5px, transparent 1.5px),
                radial-gradient(circle at 60% 40%, var(--talavera-blue) 1.2px, transparent 1.2px),
                radial-gradient(circle at 40% 45%, var(--talavera-blue) 1.2px, transparent 1.2px);
            background-size: 60px 60px;
            background-repeat: repeat;
            opacity: 0.25;
            pointer-events: none;
            z-index: 1;
        }

        .head::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.4) 0%, transparent 60%);
            pointer-events: none;
            border-radius: inherit;
            z-index: 2;
        }

        /* ===== ANTENAS TALAVERA: esferas cerámicas con flor ===== */
        .antenna {
            position: absolute;
            top: -18px;
            width: 5px;
            height: 24px;
            border-radius: 999px;
            background: linear-gradient(180deg, var(--talavera-blue), var(--talavera-light));
            transform-origin: bottom center;
            animation: sway 3.2s ease-in-out infinite alternate;
            box-shadow: none;
            transition: all 0.5s ease;
            z-index: 5;
        }
        .antenna::after {
            content: "";
            position: absolute;
            left: 50%;
            top: -12px;
            width: 18px;
            height: 18px;
            transform: translateX(-50%);
            border-radius: 50%;
            background: radial-gradient(circle at 40% 35%, var(--ceramic) 0%, var(--cream) 65%, var(--talavera-light) 100%);
            border: 2px solid var(--talavera-blue);
            box-shadow: inset 0 0 6px rgba(255, 255, 255, 0.5), 0 0 0 1px rgba(13, 71, 161, 0.15);
            transition: all 0.5s ease;
        }
        /* Motivo floral en la esfera de la antena */
        .antenna::after {
            background-image:
                radial-gradient(circle at 45% 40%, var(--talavera-blue) 2px, transparent 2px),
                radial-gradient(circle at 50% 55%, var(--talavera-blue) 1.5px, transparent 1.5px),
                radial-gradient(circle at 55% 45%, var(--talavera-blue) 1.5px, transparent 1.5px),
                radial-gradient(circle at 40% 55%, var(--talavera-blue) 1px, transparent 1px),
                radial-gradient(circle at 60% 50%, var(--talavera-blue) 1px, transparent 1px);
            background-size: 12px 12px;
            background-repeat: no-repeat;
            background-position: center;
            background-color: var(--ceramic);
        }
        .antenna.left {
            left: 28px;
        }
        .antenna.right {
            right: 28px;
            animation-delay: .14s;
        }

        /* ===== CEJAS: azul talavera ===== */
        .brow {
            position: absolute;
            top: 24px;
            width: 26px;
            height: 7px;
            border-top: 4px solid var(--color-activo);
            border-radius: 50%;
            z-index: 4;
            opacity: 1;
            transition: transform .3s ease, top .3s ease, border-color .3s ease, width .3s ease;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,.05));
        }
        .brow.left {
            left: 16px;
            transform: rotate(-4deg);
        }
        .brow.right {
            right: 16px;
            transform: rotate(4deg);
        }

        /* ===== OJOS grandes y expresivos ===== */
        .eye {
            position: absolute;
            top: 30px;
            width: 30px;
            height: 34px;
            border-radius: 50%;
            overflow: hidden;
            background: #1A0A2E;
            box-shadow: inset 0 0 0 2px rgba(13, 71, 161, 0.12), 0 0 8px rgba(21, 101, 192, 0.08);
            transition: clip-path 0.15s ease;
            z-index: 3;
        }
        .eye.left {
            left: 16px;
        }
        .eye.right {
            right: 16px;
        }

        .eye::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 42%, #fff 0 56%, #f5f0e8 66%, #e8e0d0 100%);
            border-radius: 50%;
            transform: scaleY(.78);
            transition: transform .2s ease;
        }

        .eye::after {
            content: "";
            position: absolute;
            left: 6px;
            right: 6px;
            top: -2px;
            height: 0;
            background: var(--white);
            border-bottom: 3px solid var(--color-activo);
            border-radius: 50%;
            z-index: 3;
            transition: height .2s ease, border-color .3s ease;
        }

        /* ===== IRIS ===== */
        .iris {
            position: absolute;
            z-index: 2;
            width: 14px;
            height: 14px;
            left: 8px;
            top: 10px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #6dd5ff 0 16%, #1a6cb0 38%, #0a1a3e 74%, #030810 100%);
            box-shadow: 0 0 10px rgba(0, 229, 255, .15), inset 0 0 6px rgba(255, 255, 255, .1);
            transition: transform .3s ease;
        }
        .iris::before {
            content: "";
            position: absolute;
            width: 6px;
            height: 6px;
            left: 2px;
            top: 2px;
            border-radius: 50%;
            background: #fff;
            opacity: .9;
            box-shadow: 0 0 6px rgba(255, 255, 255, .2);
        }
        .iris::after {
            content: "";
            position: absolute;
            width: 3px;
            height: 3px;
            right: 2px;
            bottom: 2px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .25);
        }

        /* ===== BOCA ===== */
        .mouth-container {
            position: absolute;
            left: 50%;
            bottom: 14px;
            transform: translateX(-50%);
            width: 36px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.05s ease;
            z-index: 3;
        }

        .mouth {
            width: 28px;
            height: 10px;
            border-bottom: 4px solid var(--color-activo);
            border-radius: 0 0 50% 50%;
            transition: all 0.04s ease;
            transform-origin: center;
            background: transparent;
            position: relative;
            transition: width 0.04s ease, height 0.04s ease, border-bottom-width 0.04s ease, border-radius 0.04s ease;
            filter: drop-shadow(0 1px 4px rgba(21, 101, 192, .10));
        }

        /* Formas de boca (mantenemos compatibilidad con Disney) */
        .mouth.shape-A { width: 34px; height: 18px; border-bottom-width: 5px; border-radius: 50% 50% 45% 45%; }
        .mouth.shape-E { width: 30px; height: 12px; border-bottom-width: 4px; border-radius: 0 0 50% 50%; }
        .mouth.shape-I { width: 22px; height: 8px; border-bottom-width: 3px; border-radius: 0 0 40% 40%; }
        .mouth.shape-O { width: 32px; height: 18px; border-bottom-width: 5px; border-radius: 50%; }
        .mouth.shape-U { width: 20px; height: 14px; border-bottom-width: 4px; border-radius: 50% 50% 40% 40%; }
        .mouth.shape-M { width: 18px; height: 6px; border-bottom-width: 3px; border-radius: 0 0 50% 50%; }
        .mouth.shape-F { width: 20px; height: 6px; border-bottom-width: 3px; border-radius: 0 0 30% 30%; }
        .mouth.shape-S { width: 22px; height: 6px; border-bottom-width: 3px; border-radius: 0 0 40% 40%; }
        .mouth.shape-neutral { width: 28px; height: 8px; border-bottom-width: 3px; border-radius: 0 0 50% 50%; }
        .mouth.shape-ORA { width: 34px; height: 20px; border-bottom-width: 6px; border-radius: 50%; border-color: var(--disney-orange); animation: oraShake 0.4s ease-in-out; }

        @keyframes oraShake {
            0% { transform: translateX(-50%) scale(1) rotate(0deg); }
            25% { transform: translateX(-50%) scale(1.15) rotate(-4deg); }
            50% { transform: translateX(-50%) scale(1.05) rotate(4deg); }
            75% { transform: translateX(-50%) scale(1.10) rotate(-2deg); }
            100% { transform: translateX(-50%) scale(1) rotate(0deg); }
        }

        /* ===== MEJILLAS: rubor rosa suave ===== */
        .cheek {
            position: absolute;
            bottom: 20px;
            width: 18px;
            height: 12px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 107, 138, 0.55) 0%, rgba(255, 59, 111, 0.25) 100%);
            filter: blur(4px);
            opacity: .6;
            transition: opacity .3s ease, transform .3s ease;
            box-shadow: 0 0 12px rgba(255, 107, 138, 0.08);
            z-index: 2;
        }
        .cheek.left {
            left: 6px;
        }
        .cheek.right {
            right: 6px;
        }

        .chin {
            position: absolute;
            left: 50%;
            bottom: 4px;
            width: 44px;
            height: 12px;
            transform: translateX(-50%);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(21, 101, 192, 0.06) 0%, transparent 70%);
            opacity: .9;
            z-index: 1;
        }

        /* ===== CUERPO: Talavera Cerámica ===== */
        .body {
            position: relative;
            width: 118px;
            height: 116px;
            margin: -4px auto 0;
            border: 4px solid var(--color-activo);
            border-radius: 30px 30px 40px 40px;
            overflow: hidden;
            background: radial-gradient(circle at 50% 0%, var(--ceramic) 0%, var(--cream) 55%, #f0ead8 85%, #e0d8c0 100%);
            box-shadow: inset 0 4px 12px rgba(255, 255, 255, 0.5), inset 0 -4px 12px rgba(13, 71, 161, 0.06), 0 4px 12px rgba(0, 0, 0, 0.08);
            transform: translateZ(8px);
            animation: breathe var(--idle) ease-in-out infinite;
            transition: border-color .3s ease, box-shadow .3s ease;
        }

        /* Patrón floral Talavera en el cuerpo */
        .body::before {
            content: "";
            position: absolute;
            inset: 8px;
            border-radius: 20px;
            background-image:
                radial-gradient(circle at 20% 25%, var(--talavera-blue) 2.5px, transparent 2.5px),
                radial-gradient(circle at 80% 30%, var(--talavera-blue) 2px, transparent 2px),
                radial-gradient(circle at 50% 15%, var(--talavera-blue) 2px, transparent 2px),
                radial-gradient(circle at 70% 70%, var(--talavera-blue) 2px, transparent 2px),
                radial-gradient(circle at 30% 75%, var(--talavera-blue) 2px, transparent 2px),
                radial-gradient(circle at 50% 50%, var(--talavera-light) 2.5px, transparent 2.5px),
                radial-gradient(circle at 15% 50%, var(--talavera-blue) 1.8px, transparent 1.8px),
                radial-gradient(circle at 85% 50%, var(--talavera-blue) 1.8px, transparent 1.8px);
            background-size: 50px 50px;
            background-repeat: repeat;
            opacity: 0.2;
            pointer-events: none;
            z-index: 1;
        }

        .body::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.25) 0%, transparent 50%);
            pointer-events: none;
            border-radius: inherit;
            z-index: 2;
        }

        /* ===== PECHO: azulejo "MARQUINHOS" ===== */
        .chest {
            position: absolute;
            left: 50%;
            top: 12px;
            width: 68px;
            height: 34px;
            transform: translateX(-50%);
            border: 3px solid var(--talavera-blue);
            border-radius: 12px;
            background: var(--ceramic);
            box-shadow: inset 0 0 0 1px rgba(13, 71, 161, 0.05), 0 2px 8px rgba(0, 0, 0, 0.04);
            display: grid;
            place-items: center;
            transition: all 0.5s ease;
            z-index: 3;
            overflow: hidden;
        }

        .chest::before {
            content: "MARQUINHOS";
            font-weight: 700;
            letter-spacing: 0.8px;
            font-size: 8px;
            color: var(--talavera-dark);
            text-shadow: none;
            font-family: "Quicksand", sans-serif;
            transition: all 0.5s ease;
            text-align: center;
            line-height: 1.1;
            padding: 0 2px;
        }
        /* Pequeño detalle floral en el azulejo */
        .chest::after {
            content: "";
            position: absolute;
            bottom: 2px;
            right: 4px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: radial-gradient(circle at 45% 40%, var(--talavera-blue) 1.5px, transparent 1.5px);
            background-size: 4px 4px;
            opacity: 0.15;
            pointer-events: none;
        }

        /* ===== BRAZOS: cerámica ===== */
        .arm {
            position: absolute;
            top: 14px;
            width: 18px;
            height: 58px;
            border: 4px solid var(--color-activo);
            border-radius: 14px;
            background: linear-gradient(180deg, var(--ceramic), var(--cream));
            transform-origin: top center;
            box-shadow: inset 0 0 8px rgba(255, 255, 255, 0.4);
            transition: transform .4s cubic-bezier(.2, .8, .2, 1), border-color .3s ease;
            z-index: 2;
        }
        .arm.left {
            left: -10px;
            transform: rotate(-12deg);
        }
        .arm.right {
            right: -10px;
            transform: rotate(12deg);
        }

        .forearm {
            position: absolute;
            left: 0;
            top: 42px;
            width: 16px;
            height: 48px;
            border: 3px solid var(--color-activo);
            border-radius: 12px;
            background: linear-gradient(180deg, var(--ceramic), var(--cream));
            transform-origin: top center;
            box-shadow: inset 0 0 8px rgba(255, 255, 255, 0.3);
            transition: transform .4s cubic-bezier(.2, .8, .2, 1), border-color .3s ease;
        }

        .hand {
            position: absolute;
            left: -6px;
            top: 40px;
            width: 26px;
            height: 26px;
            border: 3px solid var(--color-activo);
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, var(--ceramic) 0%, var(--cream) 60%, #e8e0d0 100%);
            transform-origin: center;
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.3);
            transition: transform .4s cubic-bezier(.2, .8, .2, 1), border-color .3s ease;
        }

        .hand::after {
            content: "";
            position: absolute;
            inset: 6px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(21, 101, 192, 0.08) 0%, transparent 68%);
            opacity: .6;
        }

        .finger {
            position: absolute;
            top: 1px;
            width: 5px;
            height: 12px;
            border: 2px solid var(--color-activo);
            border-radius: 4px;
            background: var(--ceramic);
            transform-origin: bottom center;
            transition: transform .3s ease, border-color .3s ease;
        }
        .finger:nth-child(1) { left: 2px; }
        .finger:nth-child(2) { left: 10px; }
        .finger:nth-child(3) { left: 18px; }

        /* ===== PIERNAS: cerámica ===== */
        .leg {
            position: absolute;
            bottom: -4px;
            width: 24px;
            height: 44px;
            border: 4px solid var(--color-activo);
            border-radius: 12px;
            background: linear-gradient(180deg, var(--ceramic), var(--cream));
            box-shadow: inset 0 0 8px rgba(255, 255, 255, 0.3);
            transition: border-color .3s ease, height 0.5s cubic-bezier(.34, 1.2, .64, 1);
            z-index: 1;
        }
        .leg.left {
            left: 28px;
        }
        .leg.right {
            right: 28px;
        }

        .foot {
            position: absolute;
            bottom: -10px;
            left: -6px;
            width: 34px;
            height: 16px;
            border: 4px solid var(--color-activo);
            border-radius: 14px 14px 8px 8px;
            background: linear-gradient(180deg, var(--ceramic), var(--cream));
            transition: border-color .3s ease, transform 0.5s cubic-bezier(.34, 1.2, .64, 1);
        }

        /* ===== SITTING (sentado) ===== */
        .marquinhos.sitting .leg {
            height: 20px;
        }
        .marquinhos.sitting .body {
            transform: translateY(15px);
            transition: transform 0.5s cubic-bezier(.34, 1.2, .64, 1);
        }
        .marquinhos.sitting .foot {
            transform: rotate(8deg);
        }

        /* ===== STRETCHING (estirón) ===== */
        .marquinhos.stretching .arm.left {
            transform: rotate(-160deg);
            transition: transform 0.6s cubic-bezier(.34, 1.2, .64, 1);
        }
        .marquinhos.stretching .arm.right {
            transform: rotate(160deg);
            transition: transform 0.6s cubic-bezier(.34, 1.2, .64, 1);
        }
        .marquinhos.stretching .body {
            transform: scaleY(1.05);
            transition: transform 0.6s cubic-bezier(.34, 1.2, .64, 1);
        }

        /* ===== TEXTO: eliminamos caption y name que no se usan en el flotante ===== */
        .caption, .name {
            display: none;
        }

        /* ===== BURBUJA (bubble) oculta en este layout ===== */
        .bubble {
            display: none;
        }

        /* ===== INDICADOR DE MICRÓFONO: mini ===== */
        .mic-indicator {
            position: absolute;
            bottom: -4px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(0, 229, 255, 0.10);
            padding: 2px 10px;
            border-radius: 16px;
            border: 1px solid rgba(0, 229, 255, 0.15);
            font-size: 8px;
            color: var(--mic-active);
            transition: all 0.5s ease;
            opacity: 0;
            pointer-events: none;
            backdrop-filter: blur(2px);
            z-index: 20;
            white-space: nowrap;
        }

        .mic-indicator.active {
            opacity: 1;
        }

        .mic-indicator .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--mic-active);
            animation: micPulse 1s ease-in-out infinite;
            box-shadow: 0 0 8px rgba(0, 229, 255, .2);
        }
        #micStatus {
            font-size: 7px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        @keyframes micPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
        }

        /* ===== SELECTOR DE COLOR (PALETA) mini ===== */
        .color-picker {
            position: absolute;
            top: -6px;
            right: -6px;
            z-index: 100;
            cursor: pointer;
            user-select: none;
            transition: all 0.3s ease;
        }

        .color-picker .palette-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(4px);
            border: 2px solid var(--talavera-blue);
            display: grid;
            place-items: center;
            font-size: 12px;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.10), 0 0 0 1px rgba(255, 255, 255, 0.2);
        }

        .color-picker .palette-icon:hover {
            transform: scale(1.10) rotate(8deg);
            border-color: var(--talavera-dark);
            box-shadow: 0 2px 12px rgba(21, 101, 192, 0.15);
        }

        .color-picker .palette-options {
            position: absolute;
            top: 32px;
            right: -4px;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(21, 101, 192, 0.12);
            border-radius: 12px;
            padding: 6px 0;
            min-width: 140px;
            display: none;
            flex-direction: column;
            gap: 2px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12), 0 0 0 1px rgba(255, 255, 255, 0.1);
            transform-origin: top right;
            animation: pickerSlide 0.2s ease-out;
        }

        .color-picker .palette-options.open {
            display: flex;
        }

        @keyframes pickerSlide {
            from { opacity: 0; transform: scale(0.92) translateY(-8px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .color-picker .color-option {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border: none;
            background: transparent;
            color: #1A1A2E;
            font-family: "Quicksand", sans-serif;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            border-radius: 0;
            width: 100%;
            text-align: left;
        }

        .color-picker .color-option:hover {
            background: rgba(21, 101, 192, 0.05);
        }

        .color-picker .color-option .swatch {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid rgba(0, 0, 0, 0.06);
            flex-shrink: 0;
            transition: border-color 0.2s ease, transform 0.2s ease;
        }

        .color-picker .color-option:hover .swatch {
            border-color: var(--talavera-blue);
            transform: scale(1.05);
        }

        .color-picker .color-option .check-mark {
            margin-left: auto;
            opacity: 0;
            transition: opacity 0.2s ease;
            font-size: 12px;
            color: var(--talavera-blue);
        }

        .color-picker .color-option.active .check-mark {
            opacity: 1;
        }

        .color-picker .color-option.active {
            background: rgba(21, 101, 192, 0.04);
        }

        /* ===== ESTADOS DE LLAMADA ===== */
        .marquinhos.on-call .antenna {
            animation: callPulse 1.2s ease-in-out infinite alternate;
        }
        .marquinhos.on-call .antenna::after {
            animation: callGlow 1.2s ease-in-out infinite alternate;
        }
        .marquinhos.on-call .chest {
            border-color: var(--call-pause);
            box-shadow: 0 0 20px var(--call-pause-bg);
            animation: callChestPulse 1.2s ease-in-out infinite alternate;
        }
        .marquinhos.on-call .chest::before {
            content: "📞 LLAMADA";
            color: var(--call-pause);
            text-shadow: 0 0 12px rgba(255, 107, 53, 0.2);
            font-size: 7px;
        }

        .marquinhos.bluetooth-connected .chest::before {
            content: "🔊 BT";
            color: var(--bluetooth);
            text-shadow: 0 0 12px rgba(41, 121, 255, 0.2);
            font-size: 8px;
        }
        .marquinhos.bluetooth-connected .chest {
            border-color: var(--bluetooth);
            box-shadow: 0 0 20px var(--bluetooth-bg);
        }

        /* ===== ESTADOS / EMOCIONES (adaptados a escala) ===== */
        .marquinhos.happy .mouth { border-bottom-width: 5px; border-radius: 0 0 50% 50%; width: 32px; height: 14px; }
        .marquinhos.happy .cheek { opacity: .8; transform: scale(1.1); }
        .marquinhos.loving .mouth { width: 30px; height: 12px; border-bottom-width: 5px; }
        .marquinhos.loving .cheek { opacity: .9; transform: scale(1.2); background: radial-gradient(circle, rgba(255, 107, 138, 0.7) 0%, rgba(255, 59, 111, 0.3) 100%); }
        .marquinhos.sad .mouth { border-bottom: 0; border-top: 4px solid var(--color-activo); border-radius: 50% 50% 0 0; height: 10px; width: 24px; }
        .marquinhos.sad .brow.left { transform: rotate(10deg) translateY(4px); }
        .marquinhos.sad .brow.right { transform: rotate(-10deg) translateY(4px); }
        .marquinhos.surprised .mouth { width: 22px; height: 18px; border: 4px solid var(--color-activo); border-radius: 50%; border-bottom: 4px solid var(--color-activo); }
        .marquinhos.surprised .brow { top: 16px; }
        .marquinhos.talking .mouth { animation: talk .12s ease-in-out infinite alternate; }
        .marquinhos.talking .body { animation: breathe var(--idle) ease-in-out infinite, talkBody .65s ease-in-out infinite alternate; }
        .marquinhos.waving .arm.right { animation: waveR .45s ease-in-out infinite alternate; }
        .marquinhos.waving .arm.left { animation: waveL .45s ease-in-out infinite alternate; }
        .marquinhos.waving .finger { animation: wiggle .24s ease-in-out infinite alternate; }
        .marquinhos.wink .eye.left::after { height: 30px; }
        .marquinhos.wink .eye.left::before { transform: scaleY(.06); }
        .marquinhos.excited { animation: bounce .55s ease-in-out infinite alternate; }
        .marquinhos.excited .mouth { width: 32px; height: 16px; border-bottom-width: 5px; }
        .marquinhos.excited .cheek { opacity: .9; transform: scale(1.15); }
        .marquinhos.thinking .iris { animation: think 1.2s ease-in-out infinite alternate; }
        .marquinhos.thinking .brow.left { transform: rotate(-14deg) translateY(-4px); }
        .marquinhos.thinking .brow.right { transform: rotate(14deg) translateY(-4px); }
        .marquinhos.caring .cheek { opacity: .7; transform: scale(1.1); }
        .marquinhos.caring .mouth { width: 28px; height: 12px; border-bottom-width: 4px; }
        .marquinhos.grateful .mouth { width: 30px; height: 14px; border-bottom-width: 4px; }
        .marquinhos.grateful .cheek { opacity: .8; transform: scale(1.05); }
        .marquinhos.grateful .brow.left { transform: rotate(-3deg) translateY(-2px); }
        .marquinhos.grateful .brow.right { transform: rotate(3deg) translateY(-2px); }
        .marquinhos.embarrassed .cheek { opacity: 1; transform: scale(1.5); background: radial-gradient(circle, rgba(255, 59, 48, 0.6) 0%, rgba(255, 45, 85, 0.3) 100%); }
        .marquinhos.embarrassed .mouth { width: 18px; height: 6px; border-bottom-width: 3px; }
        .marquinhos.embarrassed .head { animation: embarrassedHead 1.2s ease-in-out infinite alternate; }
        .marquinhos.curious .brow.left { transform: rotate(-18deg) translateY(-4px); }
        .marquinhos.curious .brow.right { transform: rotate(4deg) translateY(1px); }
        .marquinhos.curious .head { animation: curiousHead 1.6s ease-in-out infinite alternate; }
        .marquinhos.tired .eye::before { transform: scaleY(.4); }
        .marquinhos.tired .brow.left, .marquinhos.tired .brow.right { top: 28px; transform: rotate(3deg); }
        .marquinhos.tired .mouth { width: 20px; height: 5px; border-bottom-width: 3px; }
        .marquinhos.thrilled { animation: thrilledBounce .48s ease-in-out infinite alternate; }
        .marquinhos.thrilled .mouth { width: 34px; height: 18px; border-bottom-width: 5px; }
        .marquinhos.thrilled .cheek { opacity: .9; transform: scale(1.2); }

        .marquinhos.ora .mouth { width: 34px; height: 20px; border-bottom-width: 6px; border-radius: 50%; border-color: var(--disney-orange); animation: oraShake 0.5s ease-in-out; }
        .marquinhos.ora .brow.left { transform: rotate(-18deg) translateY(-6px); }
        .marquinhos.ora .brow.right { transform: rotate(18deg) translateY(-6px); }
        .marquinhos.ora .eye { animation: oraEyes 0.5s ease-in-out; }

        @keyframes oraEyes {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        /* ===== ANIMACIONES (escaladas) ===== */
        @keyframes talk {
            from { transform: translateX(-50%) scaleX(.9); height: 4px; }
            to { transform: translateX(-50%) scaleX(1.1); height: 14px; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotateX(0deg); }
            50% { transform: translateY(-4px) rotateX(1deg); }
        }
        @keyframes breathe {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(3px); }
        }
        @keyframes sway {
            from { transform: rotate(-8deg); }
            to { transform: rotate(8deg); }
        }
        @keyframes talkBody {
            from { margin-top: 0; }
            to { margin-top: 1px; }
        }
        @keyframes waveR {
            from { transform: rotate(8deg); }
            to { transform: rotate(50deg); }
        }
        @keyframes waveL {
            from { transform: rotate(-8deg); }
            to { transform: rotate(-50deg); }
        }
        @keyframes wiggle {
            from { transform: rotate(-8deg); }
            to { transform: rotate(14deg); }
        }
        @keyframes think {
            from { transform: translate(0, -1px); }
            to { transform: translate(6px, -4px); }
        }
        @keyframes bounce {
            from { transform: translateY(0) scale(1); }
            to { transform: translateY(-8px) scale(1.02); }
        }
        @keyframes embarrassedHead {
            from { transform: translateZ(10px) rotateZ(-2deg); }
            to { transform: translateZ(10px) rotateZ(3deg) translateY(2px); }
        }
        @keyframes curiousHead {
            from { transform: translateZ(10px) rotateZ(-4deg); }
            to { transform: translateZ(10px) rotateZ(4deg); }
        }
        @keyframes thrilledBounce {
            from { transform: translateY(0) scale(1); }
            to { transform: translateY(-10px) scale(1.02); }
        }
        @keyframes callPulse {
            0% { transform: rotate(-10deg) scale(1); }
            100% { transform: rotate(10deg) scale(1.06); }
        }
        @keyframes callGlow {
            0% { box-shadow: 0 0 10px rgba(255, 107, 53, 0.4); }
            100% { box-shadow: 0 0 25px rgba(255, 107, 53, 0.6); }
        }
        @keyframes callChestPulse {
            0% { box-shadow: 0 0 12px rgba(255, 107, 53, 0.1); }
            100% { box-shadow: 0 0 25px rgba(255, 107, 53, 0.25); }
        }

        /* ===== COGNITIVE BUBBLE: posicionada sobre el personaje ===== */
        #cognitive-speech-bubble {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.94);
            color: var(--talavera-dark);
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 9px;
            font-family: "Quicksand", system-ui, sans-serif;
            z-index: 9999;
            max-width: 160px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(21, 101, 192, 0.06);
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.25s ease;
            opacity: 0;
            border: 1px solid rgba(21, 101, 192, 0.08);
            backdrop-filter: blur(4px);
            line-height: 1.4;
            font-weight: 600;
            letter-spacing: 0.2px;
            white-space: nowrap;
        }

        #cognitive-speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 6px solid rgba(255, 255, 255, 0.94);
        }

        #cognitive-speech-bubble.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(-2px);
        }

        #cognitive-speech-bubble.ora-mode {
            border-color: var(--disney-orange);
            color: #E65100;
            background: rgba(255, 248, 225, 0.96);
            box-shadow: 0 4px 20px rgba(255, 149, 0, 0.10);
        }
        #cognitive-speech-bubble.ora-mode::after {
            border-top-color: rgba(255, 248, 225, 0.96);
        }

        #cognitive-speech-bubble.child-safe {
            border-color: var(--child-safe);
            color: #2E7D32;
            background: rgba(232, 245, 233, 0.96);
        }
        #cognitive-speech-bubble.child-safe::after {
            border-top-color: rgba(232, 245, 233, 0.96);
        }

        #cognitive-speech-bubble.on-call {
            border-color: var(--call-pause);
            color: #BF360C;
            background: rgba(255, 243, 224, 0.96);
        }
        #cognitive-speech-bubble.on-call::after {
            border-top-color: rgba(255, 243, 224, 0.96);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width:520px) {
            .scene {
                bottom: 16px;
                right: 16px;
                width: 110px;
                height: 140px;
            }
            .marquinhos {
                transform: scale(0.9);
                transform-origin: bottom right;
            }
            #cognitive-speech-bubble {
                max-width: 130px;
                font-size: 8px;
                padding: 4px 10px;
                white-space: nowrap;
            }
            .mic-indicator {
                font-size: 7px;
                padding: 1px 8px;
            }
            .mic-indicator .dot {
                width: 5px;
                height: 5px;
            }
            .color-picker .palette-icon {
                width: 20px;
                height: 20px;
                font-size: 10px;
            }
            .color-picker .palette-options {
                min-width: 120px;
                right: -2px;
            }
            .color-picker .color-option {
                font-size: 10px;
                padding: 4px 12px;
            }
            .color-picker .color-option .swatch {
                width: 14px;
                height: 14px;
            }
        }

        @media (prefers-reduced-motion:reduce) {
            .marquinhos, .head, .body, .antenna, .mouth, .hand {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>
    <div class="scene">
        <!-- .ambient y .shadow eliminados completamente -->

        <div class="marquinhos caring" id="marquinhos" data-emotion="caring">
            <div class="card">
                <div class="head">
                    <div class="antenna left"></div>
                    <div class="antenna right"></div>

                    <div class="brow left"></div>
                    <div class="brow right"></div>

                    <div class="eye left">
                        <div class="iris"></div>
                    </div>
                    <div class="eye right">
                        <div class="iris"></div>
                    </div>

                    <div class="mouth-container">
                        <div class="mouth shape-neutral" id="disneyMouth"></div>
                    </div>

                    <div class="cheek left"></div>
                    <div class="cheek right"></div>
                    <div class="chin"></div>
                </div>

                <div class="body">
                    <div class="chest"></div>

                    <div class="arm left">
                        <div class="forearm">
                            <div class="hand">
                                <div class="finger"></div>
                                <div class="finger"></div>
                                <div class="finger"></div>
                            </div>
                        </div>
                    </div>

                    <div class="arm right">
                        <div class="forearm">
                            <div class="hand">
                                <div class="finger"></div>
                                <div class="finger"></div>
                                <div class="finger"></div>
                            </div>
                        </div>
                    </div>

                    <div class="leg left">
                        <div class="foot"></div>
                    </div>
                    <div class="leg right">
                        <div class="foot"></div>
                    </div>
                </div>

                <!-- Indicador de micrófono -->
                <div class="mic-indicator" id="micIndicator">
                    <span class="dot"></span>
                    <span id="micStatus">Escuchando...</span>
                </div>

                <!-- Selector de color (paleta) -->
                <div class="color-picker" id="colorPicker">
                    <div class="palette-icon" id="paletteToggle" aria-label="Cambiar color">🎨</div>
                    <div class="palette-options" id="paletteOptions">
                        <button class="color-option active" data-color="#1565C0" data-name="Talavera Azul">
                            <span class="swatch" style="background:#1565C0;"></span>
                            Talavera Azul
                            <span class="check-mark">✓</span>
                        </button>
                        <button class="color-option" data-color="#0D47A1" data-name="Azul Profundo">
                            <span class="swatch" style="background:#0D47A1;"></span>
                            Azul Profundo
                            <span class="check-mark">✓</span>
                        </button>
                        <button class="color-option" data-color="#FF3B30" data-name="Rojo Disney">
                            <span class="swatch" style="background:#FF3B30;"></span>
                            Rojo Disney
                            <span class="check-mark">✓</span>
                        </button>
                        <button class="color-option" data-color="#FF9500" data-name="Naranja ORA">
                            <span class="swatch" style="background:#FF9500;"></span>
                            Naranja ORA
                            <span class="check-mark">✓</span>
                        </button>
                        <button class="color-option" data-color="#FFD700" data-name="Oro Talavera">
                            <span class="swatch" style="background:#FFD700;"></span>
                            Oro Talavera
                            <span class="check-mark">✓</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        "use strict";

        // ================================================================
        // 1. DISNEY LIP SYNC + REACCIÓN ORA
        // ================================================================
        const DisneyMouth = {
            shapes: {
                'AA': { width: 0.9, height: 0.85, borderRadius: '50% 50% 45% 45%', borderWidth: 6 },
                'AE': { width: 0.85, height: 0.8, borderRadius: '50% 50% 45% 45%', borderWidth: 6 },
                'AH': { width: 0.75, height: 0.75, borderRadius: '50% 50% 40% 40%', borderWidth: 5 },
                'AO': { width: 0.85, height: 0.85, borderRadius: '50%', borderWidth: 6 },
                'AW': { width: 0.65, height: 0.65, borderRadius: '50% 50% 40% 40%', borderWidth: 5 },
                'AY': { width: 0.75, height: 0.7, borderRadius: '50% 50% 40% 40%', borderWidth: 5 },
                'EH': { width: 0.7, height: 0.55, borderRadius: '0 0 50% 50%', borderWidth: 5 },
                'ER': { width: 0.55, height: 0.5, borderRadius: '0 0 50% 50%', borderWidth: 4 },
                'EY': { width: 0.75, height: 0.6, borderRadius: '0 0 50% 50%', borderWidth: 5 },
                'IH': { width: 0.45, height: 0.4, borderRadius: '0 0 40% 40%', borderWidth: 4 },
                'IY': { width: 0.5, height: 0.4, borderRadius: '0 0 40% 40%', borderWidth: 4 },
                'OW': { width: 0.9, height: 0.8, borderRadius: '50%', borderWidth: 6 },
                'OY': { width: 0.8, height: 0.75, borderRadius: '50%', borderWidth: 6 },
                'UH': { width: 0.55, height: 0.55, borderRadius: '50% 50% 40% 40%', borderWidth: 5 },
                'UW': { width: 0.45, height: 0.5, borderRadius: '50% 50% 40% 40%', borderWidth: 5 },
                'B': { width: 0.35, height: 0.2, borderRadius: '0 0 50% 50%', borderWidth: 4 },
                'CH': { width: 0.45, height: 0.3, borderRadius: '0 0 40% 40%', borderWidth: 4 },
                'D': { width: 0.35, height: 0.25, borderRadius: '0 0 50% 50%', borderWidth: 4 },
                'DH': { width: 0.35, height: 0.25, borderRadius: '0 0 50% 50%', borderWidth: 4 },
                'F': { width: 0.4, height: 0.2, borderRadius: '0 0 30% 30%', borderWidth: 3 },
                'G': { width: 0.35, height: 0.25, borderRadius: '0 0 50% 50%', borderWidth: 4 },
                'HH': { width: 0.45, height: 0.35, borderRadius: '0 0 40% 40%', borderWidth: 4 },
                'JH': { width: 0.45, height: 0.35, borderRadius: '0 0 40% 40%', borderWidth: 4 },
                'K': { width: 0.35, height: 0.25, borderRadius: '0 0 50% 50%', borderWidth: 4 },
                'L': { width: 0.4, height: 0.3, borderRadius: '0 0 40% 40%', borderWidth: 4 },
                'M': { width: 0.3, height: 0.15, borderRadius: '0 0 50% 50%', borderWidth: 4 },
                'N': { width: 0.35, height: 0.2, borderRadius: '0 0 50% 50%', borderWidth: 4 },
                'NG': { width: 0.35, height: 0.25, borderRadius: '0 0 50% 50%', borderWidth: 4 },
                'P': { width: 0.3, height: 0.18, borderRadius: '0 0 50% 50%', borderWidth: 4 },
                'R': { width: 0.4, height: 0.35, borderRadius: '0 0 40% 40%', borderWidth: 4 },
                'S': { width: 0.35, height: 0.18, borderRadius: '0 0 40% 40%', borderWidth: 3 },
                'SH': { width: 0.35, height: 0.18, borderRadius: '0 0 40% 40%', borderWidth: 3 },
                'T': { width: 0.3, height: 0.2, borderRadius: '0 0 50% 50%', borderWidth: 4 },
                'TH': { width: 0.35, height: 0.2, borderRadius: '0 0 50% 50%', borderWidth: 4 },
                'V': { width: 0.35, height: 0.18, borderRadius: '0 0 30% 30%', borderWidth: 3 },
                'W': { width: 0.4, height: 0.35, borderRadius: '50% 50% 40% 40%', borderWidth: 4 },
                'Y': { width: 0.4, height: 0.35, borderRadius: '0 0 40% 40%', borderWidth: 4 },
                'Z': { width: 0.35, height: 0.18, borderRadius: '0 0 40% 40%', borderWidth: 3 },
                'ZH': { width: 0.35, height: 0.18, borderRadius: '0 0 40% 40%', borderWidth: 3 },
                'neutral': { width: 0.5, height: 0.25, borderRadius: '0 0 50% 50%', borderWidth: 4 }
            },

            mouthElement: null,
            currentShape: 'neutral',
            lastPhoneme: null,
            animationFrame: null,
            oraTimeout: null,

            init() {
                this.mouthElement = document.getElementById('disneyMouth');
                if (!this.mouthElement) return;
                this.setShape('neutral');
            },

            setShape(phoneme, intensity = 1) {
                if (!this.mouthElement) return;

                const cleanPhoneme = phoneme.toUpperCase().replace(/[^A-Z]/g, '');
                const shape = this.shapes[cleanPhoneme] || this.shapes['neutral'];

                const widthBase = 28;
                const heightBase = 10;

                const width = widthBase * (0.5 + (shape.width * 0.5 * intensity));
                const height = heightBase * (0.3 + (shape.height * 0.7 * intensity));

                this.mouthElement.style.width = `${Math.max(14, width)}px`;
                this.mouthElement.style.height = `${Math.max(2, height)}px`;
                this.mouthElement.style.borderRadius = shape.borderRadius || '0 0 50% 50%';
                this.mouthElement.style.borderBottomWidth = `${Math.max(2, shape.borderWidth || 4)}px`;

                if (height > 14) {

            function detectUserName(text) {
                const namePatterns = [
                    /me llamo\s+([a-zA-ZáéíóúüñÁÉÍÓÚÜÑ]+)/i,
                    /mi nombre es\s+([a-zA-ZáéíóúüñÁÉÍÓÚÜÑ]+)/i,

                    /([a-zA-ZáéíóúüñÁÉÍÓÚÜÑ]+)\s*,\s*me llamo/i
                ];

                for (const pattern of namePatterns) {
                    const match = text.match(pattern);
                    if (match && match[1]) {
                        let name = match[1].trim();
                        // Capitalizar primera letra
                        name = name.charAt(0).toUpperCase() + name.slice(1).toLowerCase();
                        return name;
                    }
                }
                return null;
            }

                    if (rawPhrase.includes('¡Hola!')) {
                        rawPhrase = rawPhrase.replace('¡Hola!', `¡Hola ${userName}!`);
                    } else if (rawPhrase.includes('Hola,')) {

            function detectChildVoice(text) {
                const now = Date.now();
                const childPatterns = [
                    /\b(mami|papi|abuelo|abuela|tío|tía|hermano|hermana)\b/i,
                    /\b(cole|escuela|maestro|maestra|profesor|clase|amigo|amiga)\b/i,
                    /\b(jugar|juego|juguete|diversión|risa|pelota|carro|muñeca)\b/i,
                    /\b(me gusta|no me gusta|quiero|tengo miedo|estoy feliz|estoy triste)\b/i,
                    /\b(por qué|porqué|cómo|cual|quien|cuando|donde)\b/i,
                    /\b(ay|oh|wow|guao|epa|uy|ah)\b/i,
                    /\b(¿?.*\?)\b/,
                    /\b(ta|pa|ma|na|da)\b/,
                    /[😊😄😁😅😂🤣😍🥰😘😗😙😚]/,
                    /\b(mucho|muchísimo|super|re|requete)\b/i,
                    /\b(animal|perro|gato|pájaro|pez|conejo|tortuga)\b/i,
                    /\b(princesa|príncipe|rey|reina|castillo|dragón|hada)\b/i,
                    /\b(robot|avión|nave|espacio|astronauta)\b/i,
                    /\b(años|edad|chico|chica|niño|niña|pequeño|pequeña)\b/i
                ];
                const offensivePatterns = [
                    /\b(pendejo|pendeja|wey|güey|chinga|chingar|mamón|mamona|verga|puto|puta|culero|culera|pito|v*rga)\b/i
                ];
                const textLower = text.toLowerCase();
                const hasOffensive = offensivePatterns.some(p => p.test(textLower));
                if (hasOffensive) {
                    cognitiveState.isChild = false;
                    cognitiveState.childConfidence = Math.max(0, cognitiveState.childConfidence - 0.3);
                    return false;
                }
                let childScore = 0;
                for (const pattern of childPatterns) {
                    const matches = (textLower.match(new RegExp(pattern.source, 'gi')) || []).length;
                    if (matches > 0) {
                        childScore += matches * 0.15;
                    }
                }
                const wordCount = text.split(/\s+/).length;
                if (wordCount < 3) {
                    childScore *= 0.5;
                }
                const questionCount = (text.match(/\?/g) || []).length;
                if (questionCount >= 2) {
                    childScore += 0.2;
                }
                const emotionCount = (text.match(/[😊😄😁😅😂🤣😍🥰😘😗😙😚❤️💕💖]/g) || []).length;
                if (emotionCount > 0) {
                    childScore += 0.15 * emotionCount;
                }
                const threshold = 0.4;
                const isChild = childScore > threshold;
                if (isChild) {
                    cognitiveState.childConfidence = Math.min(1, cognitiveState.childConfidence + 0.15);
                } else {
                    cognitiveState.childConfidence = Math.max(0, cognitiveState.childConfidence - 0.1);
                }
                const wasChild = cognitiveState.isChild;
                cognitiveState.isChild = cognitiveState.childConfidence > 0.3;
                if (wasChild !== cognitiveState.isChild) {
                    console.log(`🧒 Modo infantil ${cognitiveState.isChild ? 'ACTIVADO' : 'DESACTIVADO'}`);
                    saveMemory();
                }
                cognitiveState.lastChildDetection = now;
                return cognitiveState.isChild;
            }

            function handleCallStart() {
                if (cognitiveState.isOnCall) return;

            function detectAudioDevices() {
                if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) {

        // ================================================================
        // 4. MÓDULO PRINCIPAL DE MARQUINHOS
        // ================================================================
        (() => {
            const marquinhosEl = document.getElementById('marquinhos');

            const eyes = [...document.querySelectorAll('.eye')];
            const mouth = document.getElementById('disneyMouth');
            const antennas = [...document.querySelectorAll('.antenna')];
            const micIndicator = document.getElementById('micIndicator');

            const colorPicker = document.getElementById('colorPicker');
            const paletteToggle = document.getElementById('paletteToggle');
            const paletteOptions = document.getElementById('paletteOptions');
            const colorOptions = paletteOptions.querySelectorAll('.color-option');

            const validEmotions = new Set([
                'idle', 'happy', 'loving', 'sad', 'surprised', 'talking',
                'waving', 'wink', 'excited', 'thinking', 'caring',
                'grateful', 'embarrassed', 'curious', 'tired', 'thrilled', 'ora'
            ]);

            const state = {
                emotion: 'caring',
                speaking: false,
                audioLevel: 0,
                targetLookX: 0,
                targetLookY: 0,
                lookX: 0,
                lookY: 0,
                targetTiltX: 0,
                targetTiltY: 0,
                tiltX: 0,
                tiltY: 0,
                nextBlink: performance.now() + 3000 + Math.random() * 3500,
                blinkUntil: 0,
                nextIdleAction: performance.now() + 3500 + Math.random() * 5000,
                idleActionUntil: 0,
                idleAction: '',
                audioContext: null,
                analyser: null,
                audioData: null,
                audioSource: null,
                audioElement: null,
                speechToken: 0,
                lastFrame: performance.now(),
                _audioPaused: false,
                recognition: null,
                isListening: false,
                recognitionRetries: 0,
                maxRetries: 3,
                retryTimeout: null,
                volumeMouthTimeout: null,
                hasBeenTouched: false,
                micNameTimer: null
            };

            let resetTimer = null;

            function clamp(value, min, max) {
                return Math.max(min, Math.min(max, value));
            }

            function random(min, max) {
                return min + Math.random() * (max - min);
            }

            function resetState() {
                clearTimeout(resetTimer);
                marquinhosEl.classList.remove(...validEmotions);
                marquinhosEl.classList.add('caring');

                state.speaking = false;
