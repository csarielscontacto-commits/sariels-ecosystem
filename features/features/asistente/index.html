<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente Marquinhos | Csariel's</title>
    <meta name="theme-color" content="#0F2D1A" />

    <!-- ===== SUPABASE ===== -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

    <!-- ===== CONECTORES ===== -->
    <script src="/js/client-config-loader.js"></script>
    <script src="/js/security.js"></script>
    <script src="/js/red-main.js"></script>

    <!-- ===== MARQUINHOS ===== -->
    <script src="marquinhos.html" type="text/html"></script>

    <style>
        :root {
            --space-deep: #05080f;
            --space-mid: #0a1428;
            --verde-bosque: #0F2D1A;
            --gold-cosmic: #D4AF37;
            --gold-dim: rgba(212,175,55,0.15);
            --text-primary: #e8f0f8;
            --text-secondary: #8ba3c7;
            --text-muted: #4a6a8a;
            --border: rgba(212,175,55,0.08);
            --border-glow: rgba(212,175,55,0.25);
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --success: #00b894;
            --danger: #ff3366;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            background: var(--space-deep);
            color: var(--text-primary);
            font-family: 'Space Grotesk', system-ui, sans-serif;
            min-height: 100vh;
            overflow: hidden;
        }

        #stars-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .app {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0 16px;
            border-bottom: 2px solid var(--gold-dim);
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
            width: 100%;
            position: relative;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-cosmic), var(--verde-bosque), var(--gold-cosmic), transparent);
            opacity: 0.4;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        .logo-icon { font-size: 2rem; filter: drop-shadow(0 0 20px rgba(212,175,55,0.2)); }
        .logo-icon .hex {
            display: inline-block;
            background: var(--verde-bosque);
            color: var(--gold-cosmic);
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 900;
            border: 2px solid var(--gold-cosmic);
            font-family: 'Orbitron', monospace;
        }
        .logo-text {
            font-family: 'Orbitron', monospace;
            font-size: 1.3rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--gold-cosmic), var(--verde-bosque));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 16px;
            border: 1px solid var(--border);
            border-radius: 30px;
            background: rgba(212,175,55,0.03);
            color: var(--text-primary);
            font-family: 'Orbitron', monospace;
            font-size: 0.6rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
        }
        .btn:hover { transform: scale(1.02); border-color: var(--border-glow); }
        .btn-primary {
            background: linear-gradient(135deg, var(--verde-bosque), #1a4a2a);
            border-color: var(--gold-cosmic);
            color: var(--gold-cosmic);
        }
        .btn-primary:hover { box-shadow: 0 0 40px rgba(15,45,26,0.5); }
        .btn-danger {
            background: rgba(255,51,102,0.15);
            border-color: rgba(255,51,102,0.3);
            color: var(--danger);
        }
        .btn-danger:hover { background: rgba(255,51,102,0.25); }
        .btn-outline { border-color: var(--border); background: transparent; }
        .btn-outline:hover { background: rgba(212,175,55,0.05); border-color: var(--gold-cosmic); }
        .btn-sm { padding: 4px 12px; font-size: 0.55rem; }

        .marquinhos-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
            width: 100%;
            max-width: 400px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .chat-input {
            display: flex;
            gap: 8px;
            width: 100%;
            max-width: 500px;
            margin-top: 16px;
        }
        .chat-input input {
            flex: 1;
            padding: 10px 16px;
            border-radius: 30px;
            border: 1px solid var(--gold-dim);
            background: rgba(0,0,0,0.3);
            color: var(--text-primary);
            font-size: 0.9rem;
            outline: none;
            font-family: 'Space Grotesk', sans-serif;
        }
        .chat-input input:focus { border-color: var(--gold-cosmic); }
        .chat-input input::placeholder { color: var(--text-muted); }
        .chat-input .btn { padding: 10px 20px; }

        .footer {
            margin-top: 40px;
            padding-top: 14px;
            border-top: 1px solid var(--gold-dim);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            width: 100%;
            position: relative;
        }

        .footer-text {
            color: var(--text-muted);
            font-size: 0.5rem;
            letter-spacing: 0.5px;
            font-family: 'Orbitron', monospace;
        }
        .footer-text .brand { color: var(--gold-cosmic); }

        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--verde-bosque);
            color: var(--gold-cosmic);
            padding: 10px 20px;
            border-radius: var(--radius);
            font-weight: 600;
            font-size: 0.7rem;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 5000;
            pointer-events: none;
            font-family: 'Orbitron', monospace;
            border: 1px solid rgba(212,175,55,0.15);
            max-width: 90%;
            text-align: center;
        }
        .toast.active { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.error { background: var(--danger); color: white; }

        .status-voice {
            font-size: 0.55rem;
            color: var(--text-muted);
            margin-top: 8px;
            font-family: 'Orbitron', monospace;
        }

        @media (max-width: 768px) {
            .header { flex-direction: column; align-items: flex-start; }
            .header-actions { width: 100%; justify-content: flex-start; flex-wrap: wrap; }
            .chat-input { flex-direction: column; }
            .chat-input .btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>
    <canvas id="stars-canvas"></canvas>

    <div class="app">

        <!-- ===== HEADER ===== -->
        <header class="header">
            <a href="/" class="logo">
                <span class="logo-icon"><span class="hex">◈</span></span>
                <span class="logo-text">Csariel's</span>
            </a>
            <div class="header-actions">
                <a href="/" class="btn btn-outline btn-sm">
                    <i class="fas fa-home"></i> Inicio
                </a>
                <a href="/features/red/index.html" class="btn btn-outline btn-sm">
                    <i class="fas fa-users"></i> Mi Red
                </a>
                <a href="/features/live/index.html" class="btn btn-outline btn-sm">
                    <i class="fas fa-video"></i> Live
                </a>
            </div>
        </header>

        <!-- ===== MARQUINHOS ===== -->
        <div class="marquinhos-container">
            <div id="marquinhos-placeholder">
                <!-- Marquinhos se carga aquí -->
            </div>

            <div class="controls">
                <button class="btn btn-primary btn-sm" id="btnEscuchar">
                    <i class="fas fa-microphone"></i> Hablar
                </button>
                <button class="btn btn-outline btn-sm" onclick="window.Marquinhos?.react('happy')">
                    😊 Feliz
                </button>
                <button class="btn btn-outline btn-sm" onclick="window.Marquinhos?.react('thinking')">
                    🤔 Pensando
                </button>
                <button class="btn btn-outline btn-sm" onclick="window.Marquinhos?.react('waving')">
                    👋 Saludar
                </button>
            </div>

            <div class="status-voice" id="statusVoice">💬 Esperando tu mensaje...</div>

            <div class="chat-input">
                <input type="text" id="chatInput" placeholder="Escribe algo para Marquinhos..." />
                <button class="btn btn-primary" onclick="enviarMensaje()">
                    <i class="fas fa-paper-plane"></i> Enviar
                </button>
            </div>
        </div>

        <!-- ===== FOOTER ===== -->
        <footer class="footer">
            <span class="footer-text">
                <span class="brand">◈ Csariel's</span> — Asistente Marquinhos
            </span>
        </footer>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <!-- ================================================================ -->
    <!-- 🔥 SCRIPTS -->
    <!-- ================================================================ -->
    <script>
        // ================================================================
        // 🌟 ESTRELLAS
        // ================================================================
        (function initStars() {
            const canvas = document.getElementById('stars-canvas');
            const ctx = canvas.getContext('2d');
            let w, h;

            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }
            resize();

            const stars = Array.from({ length: 200 }, () => ({
                x: Math.random() * w,
                y: Math.random() * h,
                r: Math.random() * 0.8 + 0.2,
                o: Math.random() * 0.8 + 0.2,
                speed: Math.random() * 0.005 + 0.002,
                phase: Math.random() * Math.PI * 2
            }));

            function draw() {
                ctx.clearRect(0, 0, w, h);
                stars.forEach(s => {
                    const opacity = s.o * (0.6 + 0.4 * Math.sin(s.phase));
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, 2 * Math.PI);
                    ctx.fillStyle = `rgba(255,255,255,${opacity})`;
                    ctx.fill();
                    s.y += s.speed;
                    s.phase += 0.01;
                    if (s.y > h) { s.y = 0;
                        s.x = Math.random() * w; }
                });
                requestAnimationFrame(draw);
            }
            draw();

            window.addEventListener('resize', () => {
                resize();
                stars.forEach(s => { s.x = Math.random() * w;
                    s.y = Math.random() * h; });
            });
        })();

        // ================================================================
        // 🚀 CARGAR MARQUINHOS
        // ================================================================
        function cargarMarquinhos() {
            // Cargar el HTML de Marquinhos desde el archivo
            fetch('marquinhos.html')
                .then(response => response.text())
                .then(html => {
                    const container = document.getElementById('marquinhos-placeholder');
                    container.innerHTML = html;

                    // Inicializar Marquinhos después de cargar
                    setTimeout(() => {
                        if (typeof window.Marquinhos !== 'undefined') {
                            window.Marquinhos.setEmotion('caring', '¡Hola! Soy Marquinhos, tu asistente personal.', 3000);
                            console.log('🤖 Marquinhos cargado y listo');
                            document.getElementById('statusVoice').textContent = '🤖 Marquinhos listo';
                        }
                    }, 500);
                })
                .catch(error => {
                    console.error('❌ Error cargando Marquinhos:', error);
                    document.getElementById('marquinhos-placeholder').innerHTML = `
                        <div style="text-align:center;padding:40px;color:var(--text-muted);">
                            <i class="fas fa-robot" style="font-size:4rem;opacity:0.3;display:block;margin-bottom:12px;"></i>
                            <p>Marquinhos no pudo cargarse.</p>
                        </div>
                    `;
                });
        }

        // ================================================================
        // 💬 ENVIAR MENSAJE
        // ================================================================
        function enviarMensaje() {
            const input = document.getElementById('chatInput');
            const texto = input.value.trim();
            if (!texto) return;

            document.getElementById('statusVoice').textContent = `💬 Tú: ${texto}`;

            if (typeof window.MarquinhosAPI !== 'undefined') {
                window.MarquinhosAPI.procesarComando(texto);
            } else if (typeof window.Marquinhos !== 'undefined') {
                window.Marquinhos.react('thinking');
                window.Marquinhos.speak(`Recibí tu mensaje: "${texto}"`, { emotion: 'thinking' });
            }

            input.value = '';
        }

        // ================================================================
        // 🔔 TOAST
        // ================================================================
        function mostrarToast(mensaje, tipo = '') {
            const toast = document.getElementById('toast');
            toast.textContent = mensaje;
            toast.className = 'toast active';
            if (tipo === 'error') toast.classList.add('error');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => toast.classList.remove('active'), 3000);
        }

        // ================================================================
        // 🚀 INICIALIZAR
        // ================================================================
        document.addEventListener('DOMContentLoaded', function() {
            cargarMarquinhos();

            // Enter para enviar mensaje
            document.getElementById('chatInput').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') enviarMensaje();
            });

            console.log('🎙️ Asistente Marquinhos cargado');
        });

        // Exponer funciones globales
        window.enviarMensaje = enviarMensaje;
        window.mostrarToast = mostrarToast;
    </script>

    <!-- ===== SCRIPTS DE INTEGRACIÓN ===== -->
    <script src="js/marquinhos-api.js"></script>
    <script src="js/voice-integration.js"></script>
</body>
</html>
