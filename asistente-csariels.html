<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asistente IA - Csariel's</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <style>
        /* ============================================================
           ESTILOS BASE DEL ASISTENTE
           ============================================================ */
        :root {
            --verde-bosque: #0B3D2E;
            --verde-bosque-light: #1A5C3A;
            --gold-cosmic: #C5A880;
            --gold-dim: rgba(197, 168, 128, 0.15);
            --bg-card: rgba(11, 61, 46, 0.25);
        }

        /* ===== ANIMACIONES ===== */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }
        @keyframes pulse-soft {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(1.02); }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes typing {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .animate-float { animation: float 3s ease-in-out infinite; }
        .animate-pulse-soft { animation: pulse-soft 2s ease-in-out infinite; }
        .animate-slide-up { animation: slideUp 0.3s ease-out forwards; }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }

        /* ===== WIDGET FLOTANTE ===== */
        .asistente-widget {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 9999;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        /* ===== BOTÓN FLOTANTE ===== */
        .asistente-toggle {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--verde-bosque), var(--verde-bosque-light));
            border: 2px solid var(--gold-cosmic);
            color: var(--gold-cosmic);
            font-size: 1.8rem;
            cursor: pointer;
            box-shadow: 0 8px 32px rgba(11, 61, 46, 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .asistente-toggle:hover {
            transform: scale(1.08);
            box-shadow: 0 12px 40px rgba(11, 61, 46, 0.6);
        }
        .asistente-toggle .badge-notif {
            position: absolute;
            top: -4px;
            right: -4px;
            width: 20px;
            height: 20px;
            background: #ff3366;
            color: white;
            border-radius: 50%;
            font-size: 0.55rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #0a0c10;
        }

        /* ===== PANEL DEL ASISTENTE ===== */
        .asistente-panel {
            position: absolute;
            bottom: 80px;
            right: 0;
            width: 380px;
            max-width: 90vw;
            max-height: 520px;
            background: rgba(10, 20, 40, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid var(--gold-dim);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            display: none;
            animation: slideUp 0.3s ease-out;
            transition: all 0.3s ease;
        }
        .asistente-panel.open {
            display: block;
        }

        /* ===== HEADER ===== */
        .asistente-header {
            padding: 14px 18px;
            background: linear-gradient(135deg, rgba(11, 61, 46, 0.6), rgba(26, 92, 58, 0.3));
            border-bottom: 1px solid var(--gold-dim);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .asistente-header .title {
            font-family: 'Orbitron', monospace;
            font-size: 0.75rem;
            color: var(--gold-cosmic);
            letter-spacing: 0.5px;
        }
        .asistente-header .close-btn {
            background: none;
            border: none;
            color: #8ba3c7;
            font-size: 1.2rem;
            cursor: pointer;
            transition: color 0.3s;
        }
        .asistente-header .close-btn:hover {
            color: #fff;
        }

        /* ===== SELECCIÓN DE PERSONAJES ===== */
        .personajes-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            padding: 12px 16px;
        }
        .personaje-card {
            background: rgba(0, 0, 0, 0.25);
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 10px 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .personaje-card:hover {
            border-color: var(--gold-dim);
            transform: translateY(-2px);
        }
        .personaje-card.selected {
            border-color: var(--gold-cosmic);
            background: rgba(197, 168, 128, 0.08);
        }
        .personaje-card .avatar {
            font-size: 2.4rem;
            display: block;
            margin-bottom: 2px;
        }
        .personaje-card .name {
            font-size: 0.7rem;
            font-weight: 600;
            color: #e8f0f8;
        }
        .personaje-card .role {
            font-size: 0.5rem;
            color: #8ba3c7;
            font-family: 'Orbitron', monospace;
        }
        .personaje-card .tag {
            display: inline-block;
            font-size: 0.4rem;
            padding: 1px 8px;
            border-radius: 20px;
            margin-top: 2px;
        }
        .tag-social { background: rgba(0, 184, 148, 0.2); color: #00b894; }
        .tag-business { background: rgba(197, 168, 128, 0.15); color: var(--gold-cosmic); }

        /* ===== PLANES DE SUSCRIPCIÓN ===== */
        .planes-container {
            padding: 12px 16px;
            border-top: 1px solid var(--gold-dim);
        }
        .planes-container .plan-title {
            font-size: 0.6rem;
            color: #8ba3c7;
            font-family: 'Orbitron', monospace;
            text-align: center;
            margin-bottom: 8px;
        }
        .planes-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .plan-card {
            background: rgba(0, 0, 0, 0.2);
            border: 2px solid var(--border);
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .plan-card:hover {
            border-color: var(--gold-dim);
        }
        .plan-card.selected {
            border-color: var(--gold-cosmic);
            background: rgba(197, 168, 128, 0.06);
        }
        .plan-card .price {
            font-size: 1rem;
            font-weight: 700;
            color: var(--gold-cosmic);
        }
        .plan-card .period {
            font-size: 0.55rem;
            color: #8ba3c7;
            font-family: 'Orbitron', monospace;
        }
        .plan-card .label {
            font-size: 0.45rem;
            color: #4a6a8a;
        }

        /* ===== CHAT / COMANDOS ===== */
        .chat-container {
            padding: 10px 16px;
            max-height: 160px;
            overflow-y: auto;
            border-top: 1px solid var(--gold-dim);
        }
        .chat-container::-webkit-scrollbar {
            width: 4px;
        }
        .chat-container::-webkit-scrollbar-thumb {
            background: var(--gold-cosmic);
            border-radius: 2px;
        }

        .chat-msg {
            display: flex;
            gap: 8px;
            margin-bottom: 6px;
            animation: fadeIn 0.2s ease-out;
        }
        .chat-msg .avatar-mini {
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        .chat-msg .bubble {
            background: rgba(0, 0, 0, 0.3);
            padding: 6px 12px;
            border-radius: 12px;
            border-bottom-left-radius: 4px;
            font-size: 0.75rem;
            color: #e8f0f8;
            max-width: 85%;
        }
        .chat-msg .bubble .sender {
            font-size: 0.5rem;
            color: var(--gold-cosmic);
            font-family: 'Orbitron', monospace;
        }
        .chat-msg .bubble .time {
            font-size: 0.4rem;
            color: #4a6a8a;
            text-align: right;
            margin-top: 2px;
        }
        .chat-msg.user .bubble {
            background: rgba(197, 168, 128, 0.12);
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 4px;
        }
        .chat-msg.user {
            justify-content: flex-end;
        }

        .chat-input-area {
            display: flex;
            gap: 6px;
            padding: 8px 16px;
            border-top: 1px solid var(--gold-dim);
            background: rgba(0, 0, 0, 0.15);
        }
        .chat-input-area input {
            flex: 1;
            padding: 6px 12px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--gold-dim);
            border-radius: 20px;
            color: #e8f0f8;
            font-size: 0.7rem;
            outline: none;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .chat-input-area input::placeholder {
            color: #4a6a8a;
        }
        .chat-input-area input:focus {
            border-color: var(--gold-cosmic);
        }
        .chat-input-area .btn-send {
            background: linear-gradient(135deg, var(--verde-bosque), var(--verde-bosque-light));
            border: 1px solid var(--gold-cosmic);
            color: var(--gold-cosmic);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.7rem;
        }
        .chat-input-area .btn-send:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(197, 168, 128, 0.2);
        }

        /* ===== POSTRES LOCALES ===== */
        .postres-container {
            padding: 8px 16px 12px;
            border-top: 1px solid var(--gold-dim);
        }
        .postres-container .postres-title {
            font-size: 0.55rem;
            color: #8ba3c7;
            font-family: 'Orbitron', monospace;
            margin-bottom: 6px;
        }
        .postre-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 10px;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 8px;
            margin-bottom: 4px;
            transition: background 0.3s;
            cursor: pointer;
        }
        .postre-item:hover {
            background: rgba(0, 0, 0, 0.25);
        }
        .postre-item .info .nombre {
            font-size: 0.7rem;
            font-weight: 600;
            color: #e8f0f8;
        }
        .postre-item .info .zona {
            font-size: 0.5rem;
            color: #4a6a8a;
        }
        .postre-item .btn-ver {
            font-size: 0.45rem;
            padding: 2px 10px;
            border-radius: 20px;
            background: rgba(197, 168, 128, 0.1);
            border: 1px solid var(--gold-dim);
            color: var(--gold-cosmic);
            cursor: pointer;
            transition: all 0.3s;
        }
        .postre-item .btn-ver:hover {
            background: rgba(197, 168, 128, 0.2);
        }

        /* ===== TOAST ===== */
        .toast-container {
            position: fixed;
            bottom: 100px;
            right: 24px;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-width: 90%;
        }
        .toast {
            background: rgba(10, 20, 40, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid var(--gold-dim);
            border-radius: 12px;
            padding: 10px 16px;
            color: #e8f0f8;
            font-size: 0.75rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.3s ease-out;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .toast.success { border-left: 3px solid #00b894; }
        .toast.error { border-left: 3px solid #ff3366; }
        .toast.info { border-left: 3px solid var(--gold-cosmic); }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .asistente-panel {
                width: 100%;
                max-width: 100vw;
                bottom: 72px;
                right: 0;
                border-radius: 16px 16px 0 0;
                max-height: 85vh;
            }
            .asistente-toggle {
                width: 56px;
                height: 56px;
                font-size: 1.4rem;
            }
            .personajes-grid {
                grid-template-columns: 1fr 1fr;
                gap: 6px;
                padding: 8px 12px;
            }
            .personaje-card .avatar { font-size: 1.8rem; }
            .planes-grid { grid-template-columns: 1fr 1fr; }
            .chat-container { max-height: 120px; }
        }

        @media (max-width: 400px) {
            .personajes-grid {
                grid-template-columns: 1fr 1fr;
                gap: 4px;
                padding: 6px 8px;
            }
            .personaje-card { padding: 6px 4px; }
            .personaje-card .avatar { font-size: 1.5rem; }
            .personaje-card .name { font-size: 0.6rem; }
            .plan-card .price { font-size: 0.85rem; }
        }

        /* Scrollbar estilizada */
        .asistente-panel ::-webkit-scrollbar { width: 4px; }
        .asistente-panel ::-webkit-scrollbar-track { background: transparent; }
        .asistente-panel ::-webkit-scrollbar-thumb { background: var(--gold-cosmic); border-radius: 2px; }
    </style>
</head>
<body>

    <!-- ============================================================
    TOAST CONTAINER
    ============================================================ -->
    <div class="toast-container" id="toastContainerAsistente"></div>

    <!-- ============================================================
    WIDGET ASISTENTE IA - COMPONENTE FLOTANTE
    ============================================================ -->
    <div class="asistente-widget" id="asistenteWidget">

        <!-- ===== BOTÓN FLOTANTE ===== -->
        <button class="asistente-toggle" id="asistenteToggle" title="Abrir Asistente IA">
            <span id="toggleIcon">🤖</span>
            <span class="badge-notif" id="notifBadge" style="display:none;">1</span>
        </button>

        <!-- ===== PANEL DEL ASISTENTE ===== -->
        <div class="asistente-panel" id="asistentePanel">

            <!-- HEADER -->
            <div class="asistente-header">
                <span class="title"><i class="fas fa-robot" style="margin-right:6px;"></i>Asistente Csariel's</span>
                <button class="close-btn" id="closePanel">✕</button>
            </div>

            <!-- ===== SECCIÓN: SELECCIÓN DE PERSONAJES ===== -->
            <div id="seccionPersonajes">
                <div style="padding:10px 16px 4px;">
                    <span style="font-size:0.6rem;color:#8ba3c7;font-family:'Orbitron',monospace;">Elige tu compañero</span>
                </div>
                <div class="personajes-grid" id="personajesGrid">
                    <!-- Galletita -->
                    <div class="personaje-card" data-id="galletita" onclick="seleccionarPersonaje('galletita')">
                        <span class="avatar">🍪</span>
                        <div class="name">Galletita</div>
                        <div class="role">🎭 Social</div>
                        <span class="tag tag-social">Comunidad</span>
                    </div>
                    <!-- Miel -->
                    <div class="personaje-card" data-id="miel" onclick="seleccionarPersonaje('miel')">
                        <span class="avatar">🍯</span>
                        <div class="name">Miel</div>
                        <div class="role">🤝 Conectar</div>
                        <span class="tag tag-social">Comunidad</span>
                    </div>
                    <!-- AmasU -->
                    <div class="personaje-card" data-id="amasu" onclick="seleccionarPersonaje('amasu')">
                        <span class="avatar">🧁</span>
                        <div class="name">AmasU</div>
                        <div class="role">📊 Negocios</div>
                        <span class="tag tag-business">Copiloto</span>
                    </div>
                    <!-- Crumb -->
                    <div class="personaje-card" data-id="crumb" onclick="seleccionarPersonaje('crumb')">
                        <span class="avatar">🥐</span>
                        <div class="name">Crumb</div>
                        <div class="role">⚡ Resultados</div>
                        <span class="tag tag-business">Copiloto</span>
                    </div>
                </div>
            </div>

            <!-- ===== SECCIÓN: PLANES DE SUSCRIPCIÓN ===== -->
            <div class="planes-container" id="seccionPlanes" style="display:none;">
                <div class="plan-title">💎 Activa tu compañero</div>
                <div class="planes-grid">
                    <div class="plan-card" data-plan="semanal" onclick="seleccionarPlan('semanal')">
                        <div class="price">$30</div>
                        <div class="period">Semanal</div>
                        <div class="label">7 días</div>
                    </div>
                    <div class="plan-card" data-plan="mensual" onclick="seleccionarPlan('mensual')">
                        <div class="price">$100</div>
                        <div class="period">Mensual</div>
                        <div class="label">30 días</div>
                    </div>
                </div>
                <button class="btn-activar" id="btnActivar" style="display:none;width:100%;margin-top:8px;padding:6px;background:linear-gradient(135deg,#0B3D2E,#1A5C3A);border:1px solid #C5A880;border-radius:20px;color:#C5A880;font-family:'Orbitron',monospace;font-size:0.6rem;cursor:pointer;transition:all 0.3s;">
                    <i class="fas fa-rocket"></i> Activar Ahora
                </button>
                <button class="btn-cancelar" id="btnCancelarPlan" style="display:none;width:100%;margin-top:4px;padding:4px;background:transparent;border:none;color:#4a6a8a;font-size:0.5rem;cursor:pointer;font-family:'Orbitron',monospace;">
                    Cancelar
                </button>
            </div>

            <!-- ===== SECCIÓN: CHAT / COMANDOS ===== -->
            <div class="chat-container" id="chatContainer" style="display:none;">
                <div id="chatMessages">
                    <!-- Mensajes dinámicos -->
                </div>
            </div>

            <!-- ===== INPUT DE CHAT ===== -->
            <div class="chat-input-area" id="chatInputArea" style="display:none;">
                <input type="text" id="chatInput" placeholder="Escribe un mensaje..." />
                <button class="btn-send" id="btnSendChat">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>

            <!-- ===== SECCIÓN: POSTRES LOCALES ===== -->
            <div class="postres-container" id="postresContainer" style="display:none;">
                <div class="postres-title">🍰 Postres disponibles en tu zona</div>
                <div id="postresList">
                    <!-- Postres dinámicos -->
                </div>
            </div>

        </div>
    </div>

    <!-- ============================================================
    SCRIPTS - MÓDULO INDEPENDIENTE
    ============================================================ -->
    <script>
        /**
         * ============================================================
         * ASISTENTE IA - Csariel's
         * Módulo independiente y reutilizable
         * ============================================================
         */

        // ============================================================
        // CONFIGURACIÓN
        // ============================================================
        const ASISTENTE_CONFIG = {
            // Datos de los personajes
            personajes: {
                galletita: {
                    id: 'galletita',
                    nombre: 'Galletita',
                    emoji: '🍪',
                    rol: 'Social',
                    tipo: 'comunidad',
                    saludo: '¡Holi! ¿Listo para conectar con tu comunidad hoy? ✨',
                    descripcion: 'Tierna, amigable, siempre al tanto de lo que pasa'
                },
                miel: {
                    id: 'miel',
                    nombre: 'Miel',
                    emoji: '🍯',
                    rol: 'Conectar',
                    tipo: 'comunidad',
                    saludo: '¡Qué gusto verte! Siempre es un placer compartir contigo 💛',
                    descripcion: 'Cálida, sonriente, acogedora como la miel'
                },
                amasu: {
                    id: 'amasu',
                    nombre: 'AmasU',
                    emoji: '🧁',
                    rol: 'Negocios',
                    tipo: 'business',
                    saludo: '¡Hola! ¿Listo para que trabajemos juntos hoy? 📊',
                    descripcion: 'Chibi repostero, enfocado en tus ventas'
                },
                crumb: {
                    id: 'crumb',
                    nombre: 'Crumb',
                    emoji: '🥐',
                    rol: 'Resultados',
                    tipo: 'business',
                    saludo: '¡Vamos a por todas! Hoy vamos a lograr grandes cosas 🚀',
                    descripcion: 'Dinámico, enfocado en resultados y métricas'
                }
            },

            // Planes disponibles
            planes: {
                semanal: { precio: 30, periodo: 'Semanal', dias: 7 },
                mensual: { precio: 100, periodo: 'Mensual', dias: 30 }
            },

            // Restricciones de seguridad (Read-Only)
            palabrasProhibidas: [
                'enviar', 'transferir', 'pagar', 'cobrar', 'mandar dinero',
                'usdt', 'usdc', 'polygon', 'cripto', 'wallet', 'billetera',
                'depositar', 'retirar', 'vender', 'comprar crypto',
                'mover fondos', 'transacción', 'pago', 'facturar'
            ],

            // Respuestas de seguridad
            respuestaSeguridad: '🔒 Por seguridad, no tengo permisos financieros. Por favor, realiza esa acción desde el panel manual correspondiente. ¡Estoy aquí para ayudarte con información! 😊'
        };

        // ============================================================
        // ESTADO DEL ASISTENTE
        // ============================================================
        let asistenteEstado = {
            abierto: false,
            personajeSeleccionado: null,
            planSeleccionado: null,
            activado: false,
            chatHistorial: [],
            postresLocales: []
        };

        // ============================================================
        // INICIALIZACIÓN
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🤖 Asistente IA - Csariel\'s cargado');

            // Elementos DOM
            const toggle = document.getElementById('asistenteToggle');
            const panel = document.getElementById('asistentePanel');
            const closeBtn = document.getElementById('closePanel');

            // Toggle del panel
            toggle.addEventListener('click', function(e) {
                e.stopPropagation();
                asistenteEstado.abierto = !asistenteEstado.abierto;
                panel.classList.toggle('open', asistenteEstado.abierto);
                if (asistenteEstado.abierto) {
                    document.getElementById('toggleIcon').textContent = '✨';
                    // Cargar postres si está activado
                    if (asistenteEstado.activado) {
                        cargarPostresLocales();
                    }
                } else {
                    document.getElementById('toggleIcon').textContent = '🤖';
                }
            });

            // Cerrar panel
            closeBtn.addEventListener('click', function() {
                asistenteEstado.abierto = false;
                panel.classList.remove('open');
                document.getElementById('toggleIcon').textContent = '🤖';
            });

            // Cerrar al hacer click fuera
            document.addEventListener('click', function(e) {
                const widget = document.getElementById('asistenteWidget');
                if (asistenteEstado.abierto && !widget.contains(e.target)) {
                    asistenteEstado.abierto = false;
                    panel.classList.remove('open');
                    document.getElementById('toggleIcon').textContent = '🤖';
                }
            });

            // Chat input - Enter para enviar
            const chatInput = document.getElementById('chatInput');
            chatInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    enviarMensajeChat();
                }
            });

            // Botón enviar chat
            document.getElementById('btnSendChat').addEventListener('click', enviarMensajeChat);

            // Inicializar postres de ejemplo
            inicializarPostresEjemplo();

            // Verificar estado guardado
            cargarEstadoGuardado();
        });

        // ============================================================
        // SELECCIÓN DE PERSONAJE
        // ============================================================
        function seleccionarPersonaje(id) {
            const personaje = ASISTENTE_CONFIG.personajes[id];
            if (!personaje) return;

            // Si ya está activado y es el mismo personaje, solo abrir chat
            if (asistenteEstado.activado && asistenteEstado.personajeSeleccionado === id) {
                abrirChat();
                return;
            }

            // Si ya está activado y cambia de personaje, pedir confirmación
            if (asistenteEstado.activado && asistenteEstado.personajeSeleccionado !== id) {
                if (!confirm(`¿Cambiar de ${asistenteEstado.personajeSeleccionado} a ${personaje.nombre}? Se mantendrá tu plan activo.`)) {
                    return;
                }
                asistenteEstado.personajeSeleccionado = id;
                guardarEstado();
                mostrarToast(`🔄 Cambiaste a ${personaje.nombre}`, 'info');
                abrirChat();
                return;
            }

            // Seleccionar personaje en UI
            document.querySelectorAll('.personaje-card').forEach(el => {
                el.classList.toggle('selected', el.dataset.id === id);
            });

            asistenteEstado.personajeSeleccionado = id;

            // Mostrar sección de planes
            document.getElementById('seccionPlanes').style.display = 'block';
            document.getElementById('btnActivar').style.display = 'none';
            document.getElementById('btnCancelarPlan').style.display = 'none';

            // Resetear plan seleccionado
            asistenteEstado.planSeleccionado = null;
            document.querySelectorAll('.plan-card').forEach(el => el.classList.remove('selected'));

            mostrarToast(`👋 Has seleccionado a ${personaje.nombre}`, 'info');
        }

        // ============================================================
        // SELECCIÓN DE PLAN
        // ============================================================
        function seleccionarPlan(planId) {
            const plan = ASISTENTE_CONFIG.planes[planId];
            if (!plan) return;

            // Seleccionar plan en UI
            document.querySelectorAll('.plan-card').forEach(el => {
                el.classList.toggle('selected', el.dataset.plan === planId);
            });

            asistenteEstado.planSeleccionado = planId;

            // Mostrar botón de activación
            const btnActivar = document.getElementById('btnActivar');
            const btnCancelar = document.getElementById('btnCancelarPlan');
            btnActivar.style.display = 'block';
            btnCancelar.style.display = 'block';
            btnActivar.innerHTML = `<i class="fas fa-rocket"></i> Activar Ahora · $${plan.precio} ${plan.periodo}`;

            mostrarToast(`💰 Plan ${plan.periodo} seleccionado: $${plan.precio}`, 'info');
        }

        // ============================================================
        // ACTIVAR PLAN - Botón
        // ============================================================
        document.addEventListener('click', function(e) {
            if (e.target.closest('#btnActivar')) {
                activarPlan();
            }
            if (e.target.closest('#btnCancelarPlan')) {
                cancelarSeleccion();
            }
        });

        function activarPlan() {
            const personajeId = asistenteEstado.personajeSeleccionado;
            const planId = asistenteEstado.planSeleccionado;

            if (!personajeId) {
                mostrarToast('⚠️ Selecciona un personaje primero', 'error');
                return;
            }
            if (!planId) {
                mostrarToast('⚠️ Selecciona un plan', 'error');
                return;
            }

            const personaje = ASISTENTE_CONFIG.personajes[personajeId];
            const plan = ASISTENTE_CONFIG.planes[planId];

            // SIMULACIÓN DE PAGO (demo)
            mostrarToast(`💳 Procesando pago de $${plan.precio} ${plan.periodo}...`, 'info');

            setTimeout(() => {
                asistenteEstado.activado = true;
                guardarEstado();

                // Ocultar selección de personajes y planes
                document.getElementById('seccionPersonajes').style.display = 'none';
                document.getElementById('seccionPlanes').style.display = 'none';

                // Mostrar chat y postres
                document.getElementById('chatContainer').style.display = 'block';
                document.getElementById('chatInputArea').style.display = 'flex';
                document.getElementById('postresContainer').style.display = 'block';

                // Saludo del personaje
                const saludo = personaje.saludo || '¡Hola! ¡Qué gusto tenerte aquí! ✨';
                agregarMensajeChat('asistente', saludo);

                // Mensaje de bienvenida con el plan
                agregarMensajeChat('asistente',
                    `🎉 ¡Activado! Plan ${plan.periodo} · $${plan.precio}. Estoy aquí para ayudarte con lo que necesites.`);

                mostrarToast(`✅ ¡${personaje.nombre} activado con plan ${plan.periodo}!`, 'success');

                // Cargar postres
                cargarPostresLocales();

                // Notificación de badge
                document.getElementById('notifBadge').style.display = 'flex';
                document.getElementById('notifBadge').textContent = '✨';

            }, 1500);
        }

        function cancelarSeleccion() {
            asistenteEstado.planSeleccionado = null;
            document.querySelectorAll('.plan-card').forEach(el => el.classList.remove('selected'));
            document.getElementById('btnActivar').style.display = 'none';
            document.getElementById('btnCancelarPlan').style.display = 'none';
            mostrarToast('❌ Selección cancelada', 'info');
        }

        // ============================================================
        // ABRIR CHAT (cuando ya está activado)
        // ============================================================
        function abrirChat() {
            if (!asistenteEstado.activado) return;

            document.getElementById('seccionPersonajes').style.display = 'none';
            document.getElementById('seccionPlanes').style.display = 'none';
            document.getElementById('chatContainer').style.display = 'block';
            document.getElementById('chatInputArea').style.display = 'flex';
            document.getElementById('postresContainer').style.display = 'block';

            // Si no hay mensajes, mostrar saludo
            if (document.getElementById('chatMessages').children.length === 0) {
                const personaje = ASISTENTE_CONFIG.personajes[asistenteEstado.personajeSeleccionado];
                if (personaje) {
                    agregarMensajeChat('asistente', personaje.saludo || '¡Hola! ¿En qué puedo ayudarte hoy? ✨');
                }
            }

            cargarPostresLocales();
        }

        // ============================================================
        // ENVIAR MENSAJE AL CHAT
        // ============================================================
        function enviarMensajeChat() {
            const input = document.getElementById('chatInput');
            const texto = input.value.trim();

            if (!texto || !asistenteEstado.activado) {
                if (!asistenteEstado.activado) {
                    mostrarToast('⚠️ Activa un personaje primero', 'error');
                }
                return;
            }

            // Agregar mensaje del usuario
            agregarMensajeChat('usuario', texto);
            input.value = '';

            // Procesar mensaje del usuario
            procesarComando(texto);
        }

        // ============================================================
        // AGREGAR MENSAJE AL CHAT
        // ============================================================
        function agregarMensajeChat(tipo, texto) {
            const container = document.getElementById('chatMessages');
            const time = new Date().toLocaleTimeString();

            const div = document.createElement('div');
            div.className = `chat-msg ${tipo === 'usuario' ? 'user' : ''}`;

            const personaje = ASISTENTE_CONFIG.personajes[asistenteEstado.personajeSeleccionado];

            if (tipo === 'asistente') {
                div.innerHTML = `
                        <span class="avatar-mini">${personaje ? personaje.emoji : '🤖'}</span>
                        <div class="bubble">
                            <div class="sender">${personaje ? personaje.nombre : 'Asistente'}</div>
                            <div class="text">${texto}</div>
                            <div class="time">${time}</div>
                        </div>
                    `;
            } else {
                div.innerHTML = `
                        <div class="bubble">
                            <div class="sender">Tú</div>
                            <div class="text">${texto}</div>
                            <div class="time">${time}</div>
                        </div>
                    `;
            }

            container.appendChild(div);
            container.scrollTop = container.scrollHeight;

            // Guardar historial
            asistenteEstado.chatHistorial.push({ tipo, texto, time });
        }

        // ============================================================
        // PROCESAR COMANDOS DEL USUARIO
        // ============================================================
        function procesarComando(texto) {
            const textoLower = texto.toLowerCase();

            // ===== VERIFICAR SEGURIDAD (Read-Only) =====
            const palabrasProhibidas = ASISTENTE_CONFIG.palabrasProhibidas;
            const tienePalabraProhibida = palabrasProhibidas.some(p => textoLower.includes(p));

            if (tienePalabraProhibida) {
                agregarMensajeChat('asistente', ASISTENTE_CONFIG.respuestaSeguridad);
                return;
            }

            // ===== COMANDOS CONOCIDOS =====

            // Saludo
            if (textoLower.match(/^(hola|buenas|hey|saludos|qué tal|que tal|oye)/)) {
                const personaje = ASISTENTE_CONFIG.personajes[asistenteEstado.personajeSeleccionado];
                const respuestas = [
                    `¡Hola! ¿Cómo estás hoy? ${personaje ? personaje.emoji : '✨'}`,
                    `¡Qué gusto saludarte! ¿En qué te ayudo? 🌟`,
                    `¡Holi! Siempre es un placer hablar contigo 💛`
                ];
                agregarMensajeChat('asistente', respuestas[Math.floor(Math.random() * respuestas.length)]);
                return;
            }

            // Ventas / Negocios
            if (textoLower.match(/venta|vendí|cuánto vendí|ingresos|ganancias|business|negocio/)) {
                const ventas = Math.round(Math.random() * 1500 + 200);
                const clientes = Math.round(Math.random() * 15 + 3);
                agregarMensajeChat('asistente',
                    `📊 Hoy has tenido ${clientes} clientes y generaste $${ventas} MXN en ventas. ¡Sigue así! 🚀`);
                return;
            }

            // Tendencias
            if (textoLower.match(/tendencia|tendencias|popular|moda|qué hay de nuevo/)) {
                const tendencias = [
                    '🍪 Galletas artesanales están en auge esta semana',
                    '🧁 Cupcakes decorados son los más buscados',
                    '🥐 Croissants recién horneados están arrasando',
                    '🍰 Pasteles de zanahoria con cream cheese son tendencia'
                ];
                agregarMensajeChat('asistente',
                    `📈 Tendencias locales: ${tendencias[Math.floor(Math.random() * tendencias.length)]}`);
                return;
            }

            // Búsqueda de postres
            if (textoLower.match(/postre|galleta|pastel|cupcake|dulce|vende|venden|cerca|colonia|zona/)) {
                const postres = obtenerPostresCercanos();
                if (postres.length === 0) {
                    agregarMensajeChat('asistente',
                        '🍰 Por ahora no hay postres disponibles en tu zona. ¡Sé el primero en publicar!');
                } else {
                    const lista = postres.slice(0, 3).map(p =>
                        `• ${p.nombre} (${p.zona})`).join('\n');
                    agregarMensajeChat('asistente',
                        `🍰 Postres disponibles cerca de ti:\n${lista}\n\n👀 Revisa la sección "Postres locales" para ver más.`);
                }
                return;
            }

            // Ayuda
            if (textoLower.match(/ayuda|help|qué puedes hacer|comandos|funciones/)) {
                agregarMensajeChat('asistente',
                    `🌟 Puedo ayudarte con:\n• 📊 Ver resumen de ventas\n• 📈 Conocer tendencias locales\n• 🍰 Buscar postres cerca de ti\n• 💬 Responder preguntas generales\n\n🔒 No tengo permisos financieros por seguridad.`);
                return;
            }

            // Agradecimiento
            if (textoLower.match(/gracias|thank|merci|graci|agradec|buena onda/)) {
                agregarMensajeChat('asistente',
                    `¡De nada! Es un placer ayudarte. ¿Necesitas algo más? ${ASISTENTE_CONFIG.personajes[asistenteEstado.personajeSeleccionado]?.emoji || '✨'}`);
                return;
            }

            // Despedida
            if (textoLower.match(/adiós|chao|bye|hasta luego|nos vemos|me voy|salir/)) {
                agregarMensajeChat('asistente',
                    `¡Hasta luego! Fue un gusto ayudarte. ¡Vuelve cuando quieras! ${ASISTENTE_CONFIG.personajes[asistenteEstado.personajeSeleccionado]?.emoji || '👋'}`);
                return;
            }

            // Respuesta por defecto
            const respuestasDefault = [
                '¡Qué interesante! Cuéntame más sobre eso 😊',
                'No tengo información sobre eso, pero puedo ayudarte a buscar. ¿Qué más necesitas?',
                'Hmm, no estoy seguro. ¿Podrías preguntarme de otra forma?',
                '¡Buena pregunta! Déjame pensar... ¿Puedo ayudarte con otra cosa mientras tanto?'
            ];
            agregarMensajeChat('asistente', respuestasDefault[Math.floor(Math.random() * respuestasDefault.length)]);
        }

        // ============================================================
        // POSTRES LOCALES
        // ============================================================
        function inicializarPostresEjemplo() {
            const postresEjemplo = [
                { id: 'p1', nombre: 'Galletas de Chispas 🍪', zona: 'Colonia Centro', vendedor: 'Repostería Dulce Hogar' },
                { id: 'p2', nombre: 'Cupcakes de Vainilla 🧁', zona: 'Colonia Jardín', vendedor: 'Cake & Co.' },
                { id: 'p3', nombre: 'Pastel de Chocolate 🍫', zona: 'Colonia Universidad', vendedor: 'Choco Delights' },
                { id: 'p4', nombre: 'Croissants de Mantequilla 🥐', zona: 'Colonia Reforma', vendedor: 'Panadería El Trigal' },
                { id: 'p5', nombre: 'Brownies con Nueces 🍫', zona: 'Colonia Centro', vendedor: 'Sweet Brownie' }
            ];

            // Guardar en localStorage para persistencia
            if (!localStorage.getItem('csariels_postres')) {
                localStorage.setItem('csariels_postres', JSON.stringify(postresEjemplo));
            }

            asistenteEstado.postresLocales = JSON.parse(localStorage.getItem('csariels_postres') || '[]');
        }

        function obtenerPostresCercanos() {
            return asistenteEstado.postresLocales || [];
        }

        function cargarPostresLocales() {
            const container = document.getElementById('postresList');
            const postres = obtenerPostresCercanos();

            if (postres.length === 0) {
                container.innerHTML = `
                        <div style="text-align:center;padding:8px;color:#4a6a8a;font-size:0.65rem;">
                            <i class="fas fa-info-circle"></i> No hay postres disponibles en tu zona
                        </div>
                    `;
                return;
            }

            container.innerHTML = postres.map(p => `
                    <div class="postre-item" onclick="verPublicacionMuro('${p.id}')">
                        <div class="info">
                            <div class="nombre">${p.nombre}</div>
                            <div class="zona"><i class="fas fa-map-pin" style="font-size:0.4rem;"></i> ${p.zona}</div>
                        </div>
                        <button class="btn-ver" onclick="event.stopPropagation(); verPublicacionMuro('${p.id}')">
                            <i class="fas fa-eye"></i> Ver
                        </button>
                    </div>
                `).join('');
        }

        function verPublicacionMuro(id) {
            const postres = obtenerPostresCercanos();
            const postre = postres.find(p => p.id === id);
            if (postre) {
                mostrarToast(`📱 Abriendo publicación: ${postre.nombre} en ${postre.zona}`, 'info');
                // Simular redirección al Muro Live
                agregarMensajeChat('asistente',
                    `📱 Publicación de "${postre.nombre}" en ${postre.zona}. ¡Revisa el Muro Live para más detalles!`);
            }
        }

        // ============================================================
        // GUARDAR / CARGAR ESTADO
        // ============================================================
        function guardarEstado() {
            try {
                localStorage.setItem('csariels_asistente_estado', JSON.stringify({
                    personajeSeleccionado: asistenteEstado.personajeSeleccionado,
                    planSeleccionado: asistenteEstado.planSeleccionado,
                    activado: asistenteEstado.activado,
                    chatHistorial: asistenteEstado.chatHistorial.slice(-20) // Últimos 20 mensajes
                }));
            } catch (e) { console.warn('Error guardando estado:', e); }
        }

        function cargarEstadoGuardado() {
            try {
                const data = localStorage.getItem('csariels_asistente_estado');
                if (data) {
                    const estado = JSON.parse(data);
                    if (estado.personajeSeleccionado) {
                        asistenteEstado.personajeSeleccionado = estado.personajeSeleccionado;
                        // Marcar en UI
                        document.querySelectorAll('.personaje-card').forEach(el => {
                            el.classList.toggle('selected', el.dataset.id === estado.personajeSeleccionado);
                        });
                    }
                    if (estado.planSeleccionado) {
                        asistenteEstado.planSeleccionado = estado.planSeleccionado;
                        document.querySelectorAll('.plan-card').forEach(el => {
                            el.classList.toggle('selected', el.dataset.plan === estado.planSeleccionado);
                        });
                    }
                    if (estado.activado) {
                        asistenteEstado.activado = true;
                        // Restaurar UI
                        document.getElementById('seccionPersonajes').style.display = 'none';
                        document.getElementById('seccionPlanes').style.display = 'none';
                        document.getElementById('chatContainer').style.display = 'block';
                        document.getElementById('chatInputArea').style.display = 'flex';
                        document.getElementById('postresContainer').style.display = 'block';

                        // Restaurar historial
                        if (estado.chatHistorial && estado.chatHistorial.length > 0) {
                            const container = document.getElementById('chatMessages');
                            container.innerHTML = '';
                            estado.chatHistorial.forEach(msg => {
                                const div = document.createElement('div');
                                div.className = `chat-msg ${msg.tipo === 'usuario' ? 'user' : ''}`;
                                const personaje = ASISTENTE_CONFIG.personajes[asistenteEstado
                                .personajeSeleccionado];
                                if (msg.tipo === 'asistente') {
                                    div.innerHTML = `
                                            <span class="avatar-mini">${personaje ? personaje.emoji : '🤖'}</span>
                                            <div class="bubble">
                                                <div class="sender">${personaje ? personaje.nombre : 'Asistente'}</div>
                                                <div class="text">${msg.texto}</div>
                                                <div class="time">${msg.time || ''}</div>
                                            </div>
                                        `;
                                } else {
                                    div.innerHTML = `
                                            <div class="bubble">
                                                <div class="sender">Tú</div>
                                                <div class="text">${msg.texto}</div>
                                                <div class="time">${msg.time || ''}</div>
                                            </div>
                                        `;
                                }
                                container.appendChild(div);
                            });
                            container.scrollTop = container.scrollHeight;
                        } else {
                            // Saludo si no hay historial
                            const personaje = ASISTENTE_CONFIG.personajes[asistenteEstado.personajeSeleccionado];
                            if (personaje) {
                                agregarMensajeChat('asistente', personaje.saludo || '¡Hola! ¿En qué puedo ayudarte? ✨');
                            }
                        }

                        cargarPostresLocales();
                        document.getElementById('notifBadge').style.display = 'flex';
                        document.getElementById('notifBadge').textContent = '✨';
                    }
                }
            } catch (e) { console.warn('Error cargando estado:', e); }
        }

        // ============================================================
        // TOAST NOTIFICACIONES
        // ============================================================
        function mostrarToast(mensaje, tipo = 'info') {
            const container = document.getElementById('toastContainerAsistente');
            const toast = document.createElement('div');
            toast.className = `toast ${tipo}`;

            const iconos = { success: '✅', error: '❌', info: 'ℹ️' };

            toast.innerHTML = `
                    <span style="font-size:1rem;">${iconos[tipo] || 'ℹ️'}</span>
                    <span>${mensaje}</span>
                `;

            container.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(30px)';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // ============================================================
        // API PÚBLICA - PARA INTEGRACIÓN CON OTROS MÓDULOS
        // ============================================================
        window.CsarielsAsistente = {
            // Abrir el asistente
            abrir: function() {
                const toggle = document.getElementById('asistenteToggle');
                if (toggle) toggle.click();
            },

            // Cerrar el asistente
            cerrar: function() {
                const panel = document.getElementById('asistentePanel');
                if (panel) panel.classList.remove('open');
                document.getElementById('toggleIcon').textContent = '🤖';
                asistenteEstado.abierto = false;
            },

            // Seleccionar personaje por ID
            seleccionarPersonaje: function(id) {
                if (ASISTENTE_CONFIG.personajes[id]) {
                    seleccionarPersonaje(id);
                    return true;
                }
                return false;
            },

            // Obtener estado actual
            getEstado: function() {
                return { ...asistenteEstado };
            },

            // Enviar mensaje al chat
            enviarMensaje: function(texto) {
                if (asistenteEstado.activado) {
                    document.getElementById('chatInput').value = texto;
                    enviarMensajeChat();
                    return true;
                }
                return false;
            },

            // Mostrar toast
            mostrarToast: mostrarToast
        };

        console.log('✅ Asistente IA listo. API disponible en window.CsarielsAsistente');
    </script>

</body>
</html>
